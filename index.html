<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>공부 노트</title>
<script>
  /* 예전 주소(…/showcase#song.pretender 등)로 들어오면 일본어 페이지의 같은 화면으로 보내요. */
  if (/^#(home|song\.|kana|guide|vocab|food|travel)/.test(location.hash)) location.replace('japanese/index.html' + location.hash);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 공부 노트 첫 페이지(주제 고르기). 색 토큰은 japanese/index.html과 같은 값을 써요. */
:root{
  --paper:#F3F4F7; --sheet:#FFFFFF; --sheet-2:#F7F8FA;
  --ink:#1A2030; --ink-2:#465066; --ink-3:#737D92; --rule:#E2E5EB; --rule-2:#CBD1DB;
  --accent:#A8640F; --accent-soft:#F6EAD6;
  --font-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --radius:12px; --gutter:16px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12151C; --sheet:#1A1F29; --sheet-2:#151922;
    --ink:#E7EAF0; --ink-2:#B3BACA; --ink-3:#8A92A5; --rule:#2A303D; --rule-2:#3A4252;
    --accent:#E2A34A; --accent-soft:#3A2C17;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#12151C; --sheet:#1A1F29; --sheet-2:#151922;
  --ink:#E7EAF0; --ink-2:#B3BACA; --ink-3:#8A92A5; --rule:#2A303D; --rule-2:#3A4252;
  --accent:#E2A34A; --accent-soft:#3A2C17;
  color-scheme:dark;
}
*,*::before,*::after{ box-sizing:border-box }
html,body{ margin:0 }
body{ min-height:100vh; background:var(--paper); color:var(--ink); font-family:var(--font-ui); line-height:1.6; -webkit-font-smoothing:antialiased }
main{ max-width:720px; margin:0 auto; padding:56px var(--gutter) 64px }
h1{ margin:0; font-size:clamp(1.8rem,6vw,2.6rem); font-weight:700; letter-spacing:-.01em; line-height:1.3 }
.lede{ margin:10px 0 0; color:var(--ink-2) }
.langs{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,15rem),1fr)); gap:12px; margin-top:32px; padding:0; list-style:none }
.lang{ display:grid; gap:6px; height:100%; padding:20px 20px 22px; border:1px solid var(--rule-2); border-radius:var(--radius); background:var(--sheet); color:inherit; text-decoration:none; transition:border-color .15s, box-shadow .15s }
a.lang:hover{ border-color:var(--ink-3) }
a.lang:focus-visible{ outline:none; box-shadow:0 0 0 2px var(--ink) }
.lang-name{ font-size:1.35rem; font-weight:700 }
.lang-desc{ font-size:.92rem; color:var(--ink-2) }
.lang-go{ margin-top:6px; font-size:.85rem; font-weight:600; color:var(--accent) }
.lang.soon{ background:var(--sheet-2); border-style:dashed }
.lang.soon .lang-name{ color:var(--ink-2) }
.soon-tag{ justify-self:start; padding:1px 8px; border-radius:6px; font-size:.75rem; font-weight:600; color:var(--ink-3); background:var(--sheet); border:1px solid var(--rule) }
@media (prefers-reduced-motion:reduce){ *{ transition:none!important } }
</style>

<main>
  <h1>무엇을 공부해 볼까요?</h1>
  <p class="lede">요즘 관심 있고 공부하고 싶은 것들을 하나씩 모아 두는 노트예요.</p>
  <ul class="langs">
    <li>
      <a class="lang" href="japanese/index.html">
        <span class="lang-name">일본어</span>
        <span class="lang-desc">노래 가사, 음식, 여행 회화로 익히는 일본어. 히라가나·가타카나부터 시작할 수 있어요.</span>
        <span class="lang-go">공부하러 가기 →</span>
      </a>
    </li>
    <li>
      <div class="lang soon" aria-disabled="true">
        <span class="lang-name">카메라</span>
        <span class="lang-desc">준비하고 있어요.</span>
        <span class="soon-tag">준비 중</span>
      </div>
    </li>
    <li>
      <a class="lang" href="novel/index.html">
        <span class="lang-name">소설</span>
        <span class="lang-desc">자극이 되고 롤모델로 삼고 싶은 작가들의 노트. 히가시노 게이고부터 시작해요.</span>
        <span class="lang-go">공부하러 가기 →</span>
      </a>
    </li>
  </ul>
</main>
