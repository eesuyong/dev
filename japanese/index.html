<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>일본어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Klee+One:wght@400;600&display=swap">
<style>
/* Layout: 공책 — 데스크톱은 왼쪽 목차(곡·가이드) + 본문, 휴대폰은 상단 바 + 하단 탭. 가사 한 줄 = 노트 카드 한 장.
   색은 UI가 아니라 '문자 종류'에 쓴다: 한자 紅 · 히라가나 藍 · 가타카나 若竹 · 영어 紫. UI 강조는 山吹 하나. */
:root{
  --paper:#F3F4F7; --paper-glass:rgba(243,244,247,.9); --sheet:#FFFFFF; --sheet-2:#F7F8FA;
  --ink:#1A2030; --ink-2:#465066; --ink-3:#737D92; --rule:#E2E5EB; --rule-2:#CBD1DB;
  --accent:#A8640F; --accent-ink:#FFFFFF; --accent-soft:#F6EAD6;
  --kanji:#B0303A; --hira:#24498F; --kata:#17704B; --latin:#6E3F9C;
  --kanji-tint:#FBECEE; --hira-tint:#EAF0FA; --kata-tint:#E6F3EC; --latin-tint:#F2EBF8;
  --scrim:rgba(14,18,28,.42); --shadow:0 12px 40px rgba(20,28,45,.16);
  --font-jp:"Klee One","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  --font-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --lyric:1.55rem; --topbar-h:56px; --gutter:16px; --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12151C; --paper-glass:rgba(18,21,28,.9); --sheet:#1A1F29; --sheet-2:#151922;
    --ink:#E7EAF0; --ink-2:#B3BACA; --ink-3:#8A92A5; --rule:#2A303D; --rule-2:#3A4252;
    --accent:#E2A34A; --accent-ink:#1A1206; --accent-soft:#3A2C17;
    --kanji:#FF8E93; --hira:#93B4F5; --kata:#6FD4A6; --latin:#CDA6F0;
    --kanji-tint:#3A2125; --hira-tint:#1E2A42; --kata-tint:#183329; --latin-tint:#2E2340;
    --scrim:rgba(0,0,0,.6); --shadow:0 12px 40px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#12151C; --paper-glass:rgba(18,21,28,.9); --sheet:#1A1F29; --sheet-2:#151922;
  --ink:#E7EAF0; --ink-2:#B3BACA; --ink-3:#8A92A5; --rule:#2A303D; --rule-2:#3A4252;
  --accent:#E2A34A; --accent-ink:#1A1206; --accent-soft:#3A2C17;
  --kanji:#FF8E93; --hira:#93B4F5; --kata:#6FD4A6; --latin:#CDA6F0;
  --kanji-tint:#3A2125; --hira-tint:#1E2A42; --kata-tint:#183329; --latin-tint:#2E2340;
  --scrim:rgba(0,0,0,.6); --shadow:0 12px 40px rgba(0,0,0,.5);
  color-scheme:dark;
}
:root[data-size="s"]{ --lyric:1.3rem }
:root[data-size="l"]{ --lyric:1.85rem }
:root[data-size="xl"]{ --lyric:2.2rem }

*,*::before,*::after{ box-sizing:border-box }
[hidden]{ display:none !important }
body{ background:var(--paper); color:var(--ink); font:400 1rem/1.65 var(--font-ui); -webkit-text-size-adjust:100% }
button{ font:inherit; color:inherit; background:none; border:0; padding:0; margin:0; cursor:pointer; text-align:inherit }
a{ color:inherit }
h1,h2,h3,h4{ margin:0; text-wrap:balance }
p,ul,ol,dl{ margin:0 }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px }
.jp{ font-family:var(--font-jp) }
.mono{ font-family:var(--font-mono) }
.muted{ color:var(--ink-3) }
.grow{ flex:1 }
.eyebrow{ font:600 .74rem/1.3 var(--font-ui); letter-spacing:.06em; color:var(--ink-3) }

/* 문자 색 */
.colorize .s-k,.force-color .s-k{ color:var(--kanji) }
.colorize .s-h,.force-color .s-h{ color:var(--hira) }
.colorize .s-a,.force-color .s-a{ color:var(--kata) }
.colorize .s-l,.force-color .s-l{ color:var(--latin) }
ruby{ ruby-position:over }
rt{ font-family:var(--font-jp); font-size:.5em; font-weight:400; color:var(--ink-3); letter-spacing:0 }
ruby.sp .rb{ text-decoration:underline dashed var(--accent) 1.5px; text-underline-offset:.3em }
ruby.sp rt{ color:var(--accent) }
.no-furi .lyric rt,.no-furi .chip rt{ display:none }

/* 뼈대 */
.shell{ display:grid; grid-template-columns:minmax(0,1fr); min-height:100vh }
.side{ display:none }
.col{ min-width:0; display:flex; flex-direction:column }
.topbar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; height:var(--topbar-h); display:flex; align-items:center; gap:12px; padding-inline:var(--gutter); background:var(--paper-glass); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); border-bottom:1px solid var(--rule) }
.brand{ display:flex; align-items:baseline; gap:8px }
.brand-ko{ font-weight:700; letter-spacing:-.01em }
.view{ width:100%; max-width:1120px; margin-inline:auto; padding-inline:var(--gutter); padding-block:20px calc(100px + env(safe-area-inset-bottom,0px)); min-width:0 }
.nav-glyph{ display:inline-grid; place-items:center; width:18px; height:18px; font-family:var(--font-jp); font-weight:600; font-size:1rem; line-height:1 }
.nav-glyph.big{ width:22px; height:22px; font-size:1.2rem }
.tabbar{ position:fixed; left:0; right:0; bottom:0; z-index:30; display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); background:var(--sheet); border-top:1px solid var(--rule); padding-bottom:env(safe-area-inset-bottom,0px) }
.tabbar button{ display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 0 7px; font-size:.7rem; color:var(--ink-3); text-align:center }
.tabbar button[aria-current="page"]{ color:var(--ink); font-weight:600 }
.ico{ flex:none; width:36px; height:36px; display:inline-grid; place-items:center; border-radius:8px; color:var(--ink-3) }
.ico:hover{ background:var(--sheet-2); color:var(--ink) }
.hist{ flex:none; display:flex; gap:2px; margin-left:-8px }
.hist .ico{ color:var(--ink-2) }
.hist .ico:disabled{ opacity:.3; cursor:default; background:none; color:var(--ink-3) }
.no-tts [data-a="speak"],.no-tts [data-a="speak-line"],.no-tts [data-tts]{ display:none }
html:not(.can-dl) [data-dl]{ display:none }

@media (min-width:960px){
  :root{ --topbar-h:0px; --gutter:44px }
  .shell{ grid-template-columns:256px minmax(0,1fr) }
  .side{ display:flex; flex-direction:column; gap:26px; position:sticky; top:env(safe-area-inset-top,0px); height:100vh; overflow-y:auto; padding:28px 18px; border-right:1px solid var(--rule); background:var(--sheet) }
  .topbar,.tabbar{ display:none }
  .view{ padding-block:40px 80px }
  .side .hist{ margin:-12px 0 -14px 2px }
}
.side-brand{ display:grid; gap:2px; padding-inline:10px }
.side-brand .brand-ko{ font-size:1.12rem }
.side-nav{ display:grid; gap:2px }
.nav-item{ width:100%; display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; color:var(--ink-2); font-weight:500; font-size:.95rem; text-decoration:none }
.nav-item:hover{ background:var(--sheet-2); color:var(--ink) }
.nav-item[aria-current="page"]{ background:var(--paper); color:var(--ink); font-weight:600 }
.side-h{ padding-inline:10px; margin-bottom:4px }
.song-item .si-t{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.si-tag{ flex:none; font-size:.7rem; color:var(--ink-3); border:1px solid var(--rule); border-radius:999px; padding:1px 7px }
.song-item.soon{ color:var(--ink-3); cursor:default }
.song-item.soon:hover{ background:none; color:var(--ink-3) }
.side-foot{ margin-top:auto; display:grid; gap:6px }
.side-sync{ display:flex; align-items:center; gap:8px; padding-inline:10px; font-size:.76rem; color:var(--ink-3) }
.side-sync::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--rule-2) }
.side-sync[data-on="1"]::before{ background:var(--kata) }

/* 공통 블록 */
.block{ display:grid; gap:16px; padding-block:32px }
.block + .block{ border-top:1px solid var(--rule) }
.block-head{ display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:4px 16px }
.h2{ font-size:1.3rem; font-weight:700; letter-spacing:-.01em }
.page-head{ display:grid; gap:10px; padding-bottom:24px; border-bottom:1px solid var(--rule) }
.page-title{ font-size:clamp(1.8rem,5vw,2.6rem); font-weight:700; letter-spacing:-.02em; line-height:1.2 }
.lede{ max-width:40rem; color:var(--ink-2); font-size:1.03rem }
.empty{ padding:32px 16px; text-align:center; color:var(--ink-3); border:1px dashed var(--rule-2); border-radius:12px; list-style:none }
.tg{ flex:none; display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; border:1px solid var(--rule-2); background:var(--sheet); font-size:.85rem; color:var(--ink-2); white-space:nowrap }
.tg:hover{ border-color:var(--ink-3); color:var(--ink) }
.tg[aria-pressed="true"]{ background:var(--ink); color:var(--paper); border-color:var(--ink) }
.tg.sm{ padding:4px 10px; font-size:.8rem }
.tg-sep{ flex:none; width:1px; height:20px; background:var(--rule-2); margin-inline:2px }
.aside-box{ display:grid; gap:4px; padding:14px 16px; border-radius:var(--radius); background:var(--sheet-2); border:1px dashed var(--rule-2); font-size:.93rem; color:var(--ink-2) }
.ref{ font-size:.76rem; color:var(--ink-2); text-decoration:underline; text-underline-offset:2px; text-decoration-color:var(--rule-2) }
.ref:hover{ color:var(--ink); text-decoration-color:currentColor }

/* 홈 */
.hero{ display:grid; gap:18px; padding-block:8px 32px }
.hero-title{ font-weight:700; font-size:clamp(2rem,7.5vw,3.6rem); line-height:1.3; letter-spacing:-.01em }
.legend{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px }
@media (min-width:640px){ .legend{ grid-template-columns:repeat(4,minmax(0,1fr)) } }
.lg{ display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:var(--radius); background:var(--sheet); border:1px solid var(--rule); min-width:0 }
.lg-ch{ flex:none; font-family:var(--font-jp); font-weight:600; font-size:1.9rem; line-height:1; width:1.15em; text-align:center }
.lg-k .lg-ch{ color:var(--kanji) } .lg-h .lg-ch{ color:var(--hira) } .lg-a .lg-ch{ color:var(--kata) } .lg-l .lg-ch{ color:var(--latin) }
.lg b{ display:block; font-size:.95rem }
.lg small{ display:block; color:var(--ink-3); font-size:.78rem; line-height:1.4 }
.resume{ justify-self:start; display:inline-flex; align-items:center; gap:8px; padding:9px 14px; border-radius:999px; background:var(--accent-soft); color:var(--ink); font-size:.9rem; font-weight:500 }
.cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr)); gap:14px }
.song-card{ display:grid; align-content:start; gap:10px; padding:18px; border-radius:12px; background:var(--sheet); border:1px solid var(--rule); text-decoration:none; transition:border-color .15s,transform .15s }
a.song-card:hover{ border-color:var(--rule-2); transform:translateY(-1px) }
.song-card.soon{ background:transparent; border-style:dashed }
.sc-top{ display:flex; justify-content:space-between; align-items:center; gap:8px }
.pill{ font:500 .72rem/1 var(--font-ui); padding:5px 9px; border-radius:999px; background:var(--sheet-2); color:var(--ink-2); border:1px solid var(--rule); white-space:nowrap }
.pill.ready{ background:var(--kata-tint); color:var(--kata); border-color:transparent }
.pill.demo{ background:var(--accent-soft); color:var(--accent); border-color:transparent }
.sc-meta{ font-size:.76rem; color:var(--ink-3); text-align:right }
.sc-title{ font-size:1.45rem; font-weight:700; letter-spacing:-.01em; line-height:1.25 }
.sc-sub{ color:var(--ink-2); font-size:.9rem }
.prog{ display:grid; gap:6px }
.prog-bar{ height:6px; border-radius:99px; background:var(--rule); overflow:hidden }
.prog-bar i{ display:block; height:100%; width:0; background:var(--accent); border-radius:inherit; transition:width .3s }
.prog-txt{ display:flex; justify-content:space-between; gap:8px; font:400 .74rem/1.2 var(--font-mono); color:var(--ink-3); font-variant-numeric:tabular-nums }
.steps{ list-style:none; padding:0; display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr)); counter-reset:step }
.steps li{ counter-increment:step; display:grid; align-content:start; gap:6px; padding-top:14px; border-top:2px solid var(--ink) }
.steps li::before{ content:counter(step,decimal-leading-zero); font:500 .8rem var(--font-mono); color:var(--accent) }
.steps b{ font-size:1rem }
.steps p{ font-size:.9rem; color:var(--ink-2) }
.band{ display:grid; gap:28px }
@media (min-width:860px){ .band{ grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) } }
.band-text{ display:grid; align-content:start; gap:14px }
.band-text > p{ color:var(--ink-2) }
.members{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px }
.member{ display:grid; padding:10px 12px; background:var(--sheet); border:1px solid var(--rule); border-radius:8px; min-width:0 }
.member .jp{ font-weight:600; font-size:1.05rem; line-height:1.9 }
.member small{ color:var(--ink-3); font-size:.78rem }
.timeline{ list-style:none; padding:0; display:grid; margin-top:8px }
.timeline li{ display:grid; grid-template-columns:3.2rem minmax(0,1fr); gap:12px; padding:10px 0; border-bottom:1px solid var(--rule) }
.tl-y{ font:500 .85rem/1.6 var(--font-mono); color:var(--accent); font-variant-numeric:tabular-nums }
.tl-t{ font-weight:600 }
.tl-d{ display:block; font-size:.84rem; color:var(--ink-2) }

/* 곡 페이지 */
.song-head{ display:grid; gap:8px; padding-bottom:22px }
.back{ display:inline-flex; align-items:center; gap:4px; font-size:.85rem; color:var(--ink-3); width:max-content; margin-bottom:6px }
.back:hover{ color:var(--ink) }
.song-title{ font-size:clamp(2rem,6vw,3rem); font-weight:700; letter-spacing:-.02em; line-height:1.15 }
.song-sub{ color:var(--ink-2); max-width:40rem }
.song-head .prog{ max-width:420px; margin-top:8px }
.tabs{ display:flex; gap:2px; border-bottom:1px solid var(--rule); overflow-x:auto; scrollbar-width:none; margin-bottom:6px }
.tabs::-webkit-scrollbar{ display:none }
.tab{ flex:none; padding:10px 14px; color:var(--ink-3); font-weight:500; border-bottom:2px solid transparent; margin-bottom:-1px; text-decoration:none }
.tab:hover{ color:var(--ink) }
.tab[aria-selected="true"]{ color:var(--ink); border-color:var(--ink); font-weight:600 }
.tab .cnt{ font:400 .72rem var(--font-mono); color:var(--ink-3); margin-left:5px }
.toolbar{ position:sticky; top:calc(env(safe-area-inset-top,0px) + var(--topbar-h)); z-index:10; display:flex; align-items:center; gap:6px; overflow-x:auto; scrollbar-width:none; margin-inline:calc(-1 * var(--gutter)); padding:10px var(--gutter); background:var(--paper-glass); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px) }
.toolbar::-webkit-scrollbar{ display:none }
.song-layout{ display:grid; gap:32px; padding-top:10px }
.lines-col{ min-width:0; max-width:780px }
.rail{ display:none }
@media (min-width:1240px){
  .song-layout{ grid-template-columns:minmax(0,1fr) 220px }
  .rail{ display:block; position:sticky; top:72px; align-self:start }
  .sec-jump{ display:none }
}
.rail-box{ display:grid; gap:8px; padding-bottom:18px; margin-bottom:18px; border-bottom:1px solid var(--rule) }
.rail-link{ display:flex; justify-content:space-between; gap:8px; padding:3px 0; font-size:.88rem; color:var(--ink-2) }
.rail-link:hover{ color:var(--ink) }
.rail-link .mono{ font-size:.75rem; color:var(--ink-3) }
.legend-inline{ display:none; flex-wrap:wrap; gap:4px 14px; font-size:.78rem; color:var(--ink-3); margin-bottom:14px }
.colorize .legend-inline{ display:flex }
.legend-inline span{ display:inline-flex; align-items:center; gap:6px }
.legend-inline span::before{ content:""; width:.62em; height:.62em; border-radius:2px; background:var(--rule-2) }
.legend-inline .li-k::before{ background:var(--kanji) } .legend-inline .li-h::before{ background:var(--hira) }
.legend-inline .li-a::before{ background:var(--kata) } .legend-inline .li-l::before{ background:var(--latin) }
.legend-inline .li-sp::before{ width:1.1em; height:0; border-radius:0; background:none; border-bottom:1.5px dashed var(--accent) }
.sec-jump{ display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; margin-bottom:16px }
.sec{ display:grid; gap:10px; margin-bottom:30px; scroll-margin-top:calc(var(--topbar-h) + 64px) }
.sec.cont{ margin-top:-12px }
.sec-h{ display:flex; align-items:center; gap:10px; font-size:.8rem; font-weight:600; letter-spacing:.04em; color:var(--ink-3); padding-block:4px }
.sec-h::after{ content:""; flex:1; height:1px; background:var(--rule) }
.sec-note{ font-size:.9rem; color:var(--ink-2) }
.line-list{ list-style:none; padding:0; display:grid; gap:10px }
.line{ background:var(--sheet); border:1px solid var(--rule); border-radius:var(--radius); scroll-margin-top:calc(var(--topbar-h) + 72px) }
.line.open{ border-color:var(--rule-2) }
.line.flash{ animation:flash 1.6s ease-out }
@keyframes flash{ 0%,30%{ box-shadow:0 0 0 3px var(--accent) } 100%{ box-shadow:0 0 0 0 transparent } }
.line-head{ display:flex; align-items:center; gap:4px; padding:8px 10px 0 16px }
.ln{ font:500 .75rem var(--font-mono); color:var(--ink-3); font-variant-numeric:tabular-nums }
.line.done .ln{ color:var(--accent) }
.check{ flex:none; width:30px; height:30px; display:inline-grid; place-items:center; border-radius:50%; border:1.5px solid var(--rule-2); color:transparent; margin-left:4px }
.check:hover{ border-color:var(--accent); color:var(--accent) }
.check[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink) }
.lyric{ font-family:var(--font-jp); font-weight:600; font-size:var(--lyric); line-height:2.1; padding:0 16px; line-break:strict; overflow-wrap:anywhere }
.no-furi .lyric{ line-height:1.75; padding-block:4px }
.tok{ cursor:pointer; border-radius:4px; transition:background-color .12s }
.tok:hover{ background:var(--sheet-2) }
.tok.punct{ cursor:default }
.tok.punct:hover{ background:none }
.tok.sel{ background:var(--accent-soft) }
.gaps .lyric .tok:not(.punct){ margin-inline:.08em }
.gaps .lyric .tok:not(.punct) > .tok-jp{ box-shadow:inset 0 -2px 0 var(--rule-2) }
.tok-kr{ display:none }
.show-kr .kr-map{ line-height:1.2; row-gap:0 }
.show-kr .kr-map .tok-jp{ line-height:2.1 }
.no-furi.show-kr .kr-map .tok-jp{ line-height:1.6 }
.show-kr .kr-map .tok{ display:inline-flex; flex-direction:column; align-items:center; vertical-align:bottom; padding-bottom:2px }
.show-kr .kr-map .tok-kr{ display:block; font-family:var(--font-ui); font-weight:500; font-size:.72rem; line-height:1.2; color:var(--ink-2); white-space:nowrap; letter-spacing:0 }
.kr-line{ display:none; padding:0 16px; font-size:.88rem; line-height:1.5; color:var(--ink-2) }
.show-kr .kr-line{ display:block }
.romaji{ display:none; padding:0 16px; font:400 .82rem/1.5 var(--font-mono); color:var(--ink-3) }
.show-romaji .romaji{ display:block }
.rep-tag{ margin-left:8px; padding:1px 8px; border:1px solid var(--rule); border-radius:999px; font-size:.7rem; color:var(--ink-3); font-variant-numeric:tabular-nums }
.rep-note{ font-size:.88rem; color:var(--ink-2); padding:10px 12px; border-radius:8px; background:var(--sheet-2) }
.ko-wrap{ position:relative; padding:6px 16px 0 }
.ko-hint{ display:none }
.hide-ko .ko-wrap:not(.revealed){ cursor:pointer }
.hide-ko .ko-wrap:not(.revealed) .ko{ filter:blur(6px); opacity:.5; -webkit-user-select:none; user-select:none }
.hide-ko .ko-wrap:not(.revealed) .ko-hint{ position:absolute; inset:6px 16px 0; display:flex; align-items:center; font-size:.84rem; font-weight:600; color:var(--ink-2) }
.more{ display:inline-flex; align-items:center; gap:6px; margin:6px 8px 8px; padding:6px 8px; font-size:.85rem; color:var(--ink-2); border-radius:6px }

<script>
(function () {
  'use strict';

  /* ── 곡 목록 ───────────────────────────────────────────────
     곡을 추가할 때: 여기 한 줄 + songs/<id>.json 파일.
     곡 파일 형식
     { id, title, sub?, eyebrow?, artist?, year?, release?, tieIn?, lyricist?, composer?, listen?, intro?,
       notes?: [{ tag, title, body }],
       dict?: { "<표기>": { p, m, b, bm, w, n } }   ← 곡 안에서 반복되는 단어의 기본값 (토큰 값이 우선)
       sections: [{ label, part?(1절·2절·마지막 묶음 이름, 없으면 label로 짐작), note?, lines: [{
         id?, same?(앞 줄 id: 반복 가사), ko(해석), lit?(직역), s?(표기 포인트), c?(문화·뉘앙스), g?: [{ k, d }](문법), kr?(한글 발음 덮어쓰기),
         tk: [{ t(표기), p?(품사), m?(뜻), b?(사전형), bm?(사전형 뜻), w?(왜 이 문자), n?(메모),
                ro?(로마자 덮어쓰기), v?(단어장 포함 여부), k?(단어 키), lv?(JLPT) }] }] }] }
     표기 마크업: {漢字|かんじ} 루비 · {本気|マジ|*} 특수 읽기 · [[…]] 색 구분 예문 · **굵게** */
  const CATALOG = [
    { id: 'film', file: 'songs/film.json', status: 'ready',
      title: '115{万|まん}キロのフィルム', sub: '앨범 『エスカパレード』 수록 · 영화 「思い、思われ、ふり、ふられ」(2020) 주제가', meta: '2018 · 작사·작곡 藤原聡' },
    { id: 'pretender', file: 'songs/pretender.json', status: 'ready',
      title: 'Pretender', sub: '영화 「コンフィデンスマンJP ロマンス編」 주제가', meta: '2019 · 작사·작곡 藤原聡' },
    { id: 'shukumei', file: 'songs/shukumei.json', status: 'ready',
      title: '{宿命|しゅくめい}', sub: '고교야구 프로그램 「熱闘甲子園」 2019 테마송', meta: '2019 · 작사·작곡 藤原聡' },
    { id: 'laughter', file: 'songs/laughter.json', status: 'ready',
      title: 'Laughter', sub: '영화 「コンフィデンスマンJP プリンセス編」 주제가', meta: '2020 · 작사·작곡 藤原聡' },
    { id: 'rashisa', file: 'songs/rashisa.json', status: 'ready',
      title: 'らしさ', sub: '극장 애니메이션 「ひゃくえむ。」 주제가', meta: '2025 · 작사·작곡 藤原聡' }
  ];

  const ROOT = document.documentElement;
  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ESC[c]);
  const smooth = () => (matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth');
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 저장 불가 환경 */ } }
  };
  const state = { route: 'home', rendered: null, song: null, pendingLine: null, allOpen: false,
    vf: { cat: 'all', lv: 'all', q: '', hide: false }, vopen: new Set(), lastFocus: null, toastT: 0, resetT: 0,
    mode: 'song', ksel: null, kmode: 'h', quiz: { mode: 'h', cur: null, right: 0, total: 0, streak: 0, best: +store.get('hgn.kanaBest', 0) || 0 } };

  const I = {
    speaker: '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
    check: '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5.5 12.5l4 4L18.5 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    chev: '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    close: '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    back: '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };

  /* ── 문자 판별과 표기 렌더링 ───────────────────────────── */
  function sc(ch) {
    const c = ch.codePointAt(0);
    if (c >= 0x3041 && c <= 0x309F) return 'h';
    if (c === 0x30FB) return 'p';
    if ((c >= 0x30A0 && c <= 0x30FF) || (c >= 0x31F0 && c <= 0x31FF) || (c >= 0xFF66 && c <= 0xFF9F)) return 'a';
    if ((c >= 0x4E00 && c <= 0x9FFF) || (c >= 0x3400 && c <= 0x4DBF) || (c >= 0xF900 && c <= 0xFAFF) || c === 0x3005 || c === 0x3006) return 'k';
    if (/[A-Za-z0-9０-９Ａ-Ｚａ-ｚ]/.test(ch)) return 'l';
    return 'p';
  }
  function scriptsOf(str) {
    const set = new Set(); let prev = null;
    for (const ch of str) { let k = sc(ch); if (ch === 'ー' && prev) k = prev; if (k !== 'p') { set.add(k); prev = k; } }
    return ['k', 'h', 'a', 'l'].filter((k) => set.has(k));
  }
  function paint(str) {
    let out = '', cur = null, buf = '';
    const flush = () => { if (buf) { out += cur === 'p' ? esc(buf) : '<span class="s-' + cur + '">' + esc(buf) + '</span>'; buf = ''; } };
    for (const ch of str) { let k = sc(ch); if (ch === 'ー' && cur && cur !== 'p') k = cur; if (k !== cur) { flush(); cur = k; } buf += ch; }
    flush(); return out;
  }
  const RUBY_RE = /\{([^{}|]+)\|([^{}|]+)(?:\|(\*))?\}/g;
  function segs(str) {
    const out = []; let last = 0; str = String(str || '');
    str.replace(RUBY_RE, (m, b, r, f, idx) => { if (idx > last) out.push({ t: str.slice(last, idx) }); out.push({ t: b, r: r, sp: !!f }); last = idx + m.length; return m; });
    if (last < str.length) out.push({ t: str.slice(last) });
    return out;
  }
  const plainOf = (s) => segs(s).map((x) => x.t).join('');
  const readingOf = (s) => segs(s).map((x) => x.r || x.t).join('');
  const speechOf = (s) => segs(s).map((x) => (x.sp ? x.r : x.t)).join('');
  function renderJP(s) {
    return segs(s).map((x) => (x.r
      ? '<ruby' + (x.sp ? ' class="sp"' : '') + '><span class="rb">' + paint(x.t) + '</span><rt>' + esc(x.r) + '</rt></ruby>'
      : paint(x.t))).join('');
  }
  const JP_RUN = /[぀-ヿ㐀-鿿豈-﫿々〆〜「」『』、。]+/g;
  function richPlain(s) {
    return segs(s).map((x) => (x.r
      ? '<ruby class="jp' + (x.sp ? ' sp' : '') + '" lang="ja"><span class="rb">' + esc(x.t) + '</span><rt>' + esc(x.r) + '</rt></ruby>'
      : esc(x.t).replace(JP_RUN, (m) => '<span class="jp" lang="ja">' + m + '</span>'))).join('');
  }
  function rich(src) {
    if (src == null || src === '') return '';
    return String(src).split(/(\[\[[^\]]+\]\])/).map((part) => (part.indexOf('[[') === 0
      ? '<span class="jp ex-inline force-color" lang="ja">' + renderJP(part.slice(2, -2)) + '</span>'
      : richPlain(part))).join('').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  }
  const paras = (t) => String(t || '').split(/\n{2,}/).map((p) => '<p>' + rich(p) + '</p>').join('');

  /* ── 가나 → 로마자 ─────────────────────────────────────── */
  const KANA = { 'あ':'a','い':'i','う':'u','え':'e','お':'o','か':'ka','き':'ki','く':'ku','け':'ke','こ':'ko','さ':'sa','し':'shi','す':'su','せ':'se','そ':'so','た':'ta','ち':'chi','つ':'tsu','て':'te','と':'to','な':'na','に':'ni','ぬ':'nu','ね':'ne','の':'no','は':'ha','ひ':'hi','ふ':'fu','へ':'he','ほ':'ho','ま':'ma','み':'mi','む':'mu','め':'me','も':'mo','や':'ya','ゆ':'yu','よ':'yo','ら':'ra','り':'ri','る':'ru','れ':'re','ろ':'ro','わ':'wa','ゐ':'i','ゑ':'e','を':'wo','ん':'n','が':'ga','ぎ':'gi','ぐ':'gu','げ':'ge','ご':'go','ざ':'za','じ':'ji','ず':'zu','ぜ':'ze','ぞ':'zo','だ':'da','ぢ':'ji','づ':'zu','で':'de','ど':'do','ば':'ba','び':'bi','ぶ':'bu','べ':'be','ぼ':'bo','ぱ':'pa','ぴ':'pi','ぷ':'pu','ぺ':'pe','ぽ':'po','ゔ':'vu','ぁ':'a','ぃ':'i','ぅ':'u','ぇ':'e','ぉ':'o','ゃ':'ya','ゅ':'yu','ょ':'yo','ゎ':'wa' };
  const toHira = (s) => String(s).replace(/[ァ-ヶ]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60));
  function syl(s, i) {
    const c = s[i], n = s[i + 1], b = KANA[c];
    if (!b) return null;

  /* ── 설정 ─────────────────────────────────────────────── */
  const DEFAULTS = { furi: true, kr: true, romaji: false, color: true, gaps: true, hideKo: false, size: 'm', rate: 0.9 };
  const S = Object.assign({}, DEFAULTS, store.get('hgn.settings', {}));

  else { try { speechSynthesis.getVoices(); } catch (e) { /* 음성 목록은 나중에 채워짐 */ } }
  function speak(text) {
    if (!TTS || !text) return;

      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ja-JP'; u.rate = S.rate;

      if (v) u.voice = v;

  /* ── 학습 기록: claude.ai 계정(가능하면) + 브라우저 사본 ── */
  const Progress = {
    data: { w: {}, l: {} }, mode: 'local', ref: null, dirty: false, writing: false, timer: 0, retries: 0, viewOnly: false,
    load() { const d = store.get('hgn.progress', null); if (d && typeof d === 'object') this.data = { w: Object.assign({}, d.w), l: Object.assign({}, d.l) }; },
    async connect() {
      try {
        if (!window.claude || typeof window.claude.use !== 'function') return;
        const pair = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
        const db = pair[0], user = pair[1];
        if (!db || !user) return;
        // 보기 권한만 있는 사람(공유받은 Viewer 등)은 자기 기록도 쓸 수 없다. 조직 밖 사람은 can()이 null이라 첫 저장 거절로 판단한다.
        const uid = await user.id();
        let canWrite = null;
        try { canWrite = await user.can('data.write'); } catch (e) { canWrite = null; }
        if (!uid || canWrite === false) { this.viewOnly = true; updateSyncLabel(); return; }
        this.ref = db.doc('data/users/' + uid + '/progress');
        this.mode = 'cloud'; updateSyncLabel();
        this.ref.onSnapshot((snap) => {
          if (this.dirty || this.writing || !snap.exists) return;
          const d = snap.data() || {};
          this.data = { w: Object.assign({}, d.w), l: Object.assign({}, d.l) };
          store.set('hgn.progress', this.data); refreshProgressUI();
        }, () => { this.goLocal(); });
      } catch (e) { this.goLocal(); }
    },
    goLocal() { this.ref = null; this.mode = 'local'; updateSyncLabel(); },
    has(type, key) { return !!this.data[type][key]; },
    toggle(type, key) {
      const m = this.data[type];
      if (m[key]) delete m[key]; else m[key] = 1;
      this.commit(); return !!m[key];
    },
    clear() { this.data = { w: {}, l: {} }; this.commit(); },
    commit() { store.set('hgn.progress', this.data); refreshProgressUI(); if (this.ref) { this.dirty = true; clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 800); } },
    async flush() {
      if (!this.ref) return;
      if (this.writing) { clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 400); return; }
      this.writing = true; this.dirty = false;
      try { await this.ref.set({ w: this.data.w, l: this.data.l, v: 1 }); this.retries = 0; }
      catch (e) {
        const code = e && e.code;
        if ((code === 'unavailable' || code === 'resource_exhausted') && this.retries < 2) {
          this.retries++; this.dirty = true; clearTimeout(this.timer);
          this.timer = setTimeout(() => this.flush(), 1500 + Math.random() * 2500);
        } else if (code === 'quota_exceeded') { toast('기록 저장 공간이 가득 찼어요. 이 브라우저에는 계속 저장돼요.'); this.goLocal(); }
        else { if (code === 'invalid_argument') this.viewOnly = true; this.goLocal(); }
      } finally { this.writing = false; }
    }
  };
  function updateSyncLabel() {
    const cloud = Progress.mode === 'cloud';
    const l = $('#sync-label');
    const built = embedded('built');
    if (l) l.textContent = cloud
      ? '이해한 줄과 외운 단어가 claude.ai 계정에 저장돼요. PC와 휴대폰에서 같은 기록이 이어져요.'
      : built
        ? '이 파일은 ' + built + '에 내려받은 판이에요. 이해한 줄과 외운 단어는 지금 쓰는 브라우저에만 저장돼요.'
        : Progress.viewOnly
        ? '이 페이지에서는 계정에 기록을 남길 수 없어서, 이해한 줄과 외운 단어가 이 브라우저에만 저장돼요.'
        : '이해한 줄과 외운 단어가 이 브라우저에만 저장돼요. claude.ai에 로그인한 상태로 열면 기기 사이에 기록이 이어져요.';

  /* ── 내려받기: 곡·단어 데이터를 담은 단일 HTML 파일을 기기에 저장 (claude.ai에서 열었을 때만) ── */
  const DL = { api: null, file: 'download/higedan-note.html', name: 'higedan-note.html' };
  async function setupDownload() {
    try {
      if (embedded('built') || !window.claude || typeof window.claude.use !== 'function') return;

  async function saveOffline(btn) {

      const r = await fetch(DL.file, { cache: 'no-cache' });

      await DL.api.save({ filename: DL.name, data: await r.blob() });
      toast('파일을 저장했어요. 더블클릭하면 브라우저에서 열려요.');
    } catch (e) {
      const code = e && e.code;
      if (code === 'declined') return;
      if (code === 'rate_limited') toast('저장 창이 이미 떠 있어요. 잠시 뒤 다시 눌러 주세요.');
      else if (code && code !== 'bad_request' && code !== 'transform_error' && code !== 'too_large') { DL.api = null; ROOT.classList.remove('can-dl'); toast('이 화면에서는 내려받기를 쓸 수 없어요.'); }
      else toast('파일을 준비하지 못했어요. 잠시 뒤 다시 시도해 주세요.');
    } finally { btn.disabled = false; }

  /* 구간을 '1절·2절·마지막'으로 묶어요. sec.part가 있으면 그대로 쓰고, 없으면 label로 짐작해요.

  function notesHTML(s) {

  async function viewSong(id, tab, sameSong) {

  /* 뒤로·앞으로 버튼: 앱 안 브라우저처럼 이동 버튼이 없는 곳을 위해 페이지 안에 둔다.

    if (!(y > 0)) return;
    const r = state.route;
    setTimeout(() => {
      if (state.route !== r) return;
      window.scrollTo(0, y);
      if (Math.abs(window.scrollY - y) > 2) setTimeout(() => { if (state.route === r) window.scrollTo(0, y); }, 250);
    }, 0);
  }
  function arrive(r, y) { state.route = r; route(); restoreScroll(y); updateHistBtns(); }
  function histGo(d) {
    const j = H.i + d;
    if (j < 0 || j > H.max) return;
    H.pos[H.i] = window.scrollY;
    if (H.native) { try { history.go(d); return; } catch (e) { H.native = false; } }
    const r = H.list[j]; if (!r) return;
    H.i = j;
    try { history.replaceState(null, '', '#' + r); } catch (e) { /* 주소 갱신이 막힌 환경 */ }
    arrive(r, H.pos[j] || 0);
  }
  function navigate(to) {
    const next = (to || 'home') === 'home' && state.mode === 'food' ? 'food' : to || 'home', moved = next !== state.route;
    state.route = next;
    if (moved) {
      H.pos[H.i] = window.scrollY;
      H.list.length = H.i + 1; H.pos.length = H.i + 1;
      if (H.native) { try { history.pushState({ hgn: H.i + 1 }, '', '#' + next); } catch (e) { H.native = false; } }
      H.i++; H.max = H.i; H.list[H.i] = next; saveNavMax();
    } else if (H.native) {
      try { if (location.hash.slice(1) !== next) history.replaceState({ hgn: H.i }, '', '#' + next); } catch (e) { /* 주소 갱신이 막힌 환경 */ }
    }
    route(); updateHistBtns();
  }
  const fromHash = () => { try { return location.hash.slice(1) || 'home'; } catch (e) { return 'home'; } };
  window.addEventListener('popstate', (e) => {
    const st = e.state, r = fromHash();
    let y = 0;
    if (st && typeof st.hgn === 'number') { H.i = st.hgn; y = H.pos[H.i] || 0; if (H.i > H.max) H.max = H.i; }
    else { // 링크로 주소(#)만 바뀌어 새로 생긴 기록
      H.list.length = H.i + 1; H.pos.length = H.i + 1; H.i++; H.max = H.i;
      try { history.replaceState({ hgn: H.i }, ''); } catch (e2) { /* 주소 갱신이 막힌 환경 */ }
    }
    H.list[H.i] = r; saveNavMax();
    arrive(r, y);
  });
  window.addEventListener('hashchange', () => { const h = fromHash(); if (h !== state.route) { state.route = h; route(); } });

  /* ── 이벤트 ───────────────────────────────────────────── */
  document.addEventListener('click', (e) => {
    const tokEl = e.target.closest('.lyric .tok');
    if (tokEl) { if (!tokEl.classList.contains('punct')) selectTok(tokEl.closest('.line'), +tokEl.dataset.i); return; }
    const el = e.target.closest('[data-a]'); if (!el) return;
    const a = el.dataset.a, li = el.closest('.line');
    switch (a) {
      case 'nav': e.preventDefault(); closeSheet(); navigate(el.dataset.to); break;
      case 'mode': state.mode = el.dataset.v; closeSheet(); navigate(state.mode === 'food' ? 'food' : 'home'); break;
      case 'opt': setOpt(el.dataset.opt, !S[el.dataset.opt]); break;
      case 'set': setOpt(el.dataset.key, el.dataset.key === 'rate' ? +el.dataset.val : el.dataset.val); break;
      case 'expand': setOpen(li, !li.classList.contains('open')); break;
      case 'expand-all':
        state.allOpen = !state.allOpen; $$('.line').forEach((x) => setOpen(x, state.allOpen));
        el.textContent = state.allOpen ? '모두 접기' : '모두 펼치기'; break;
      case 'tok': selectTok(li, +el.dataset.i); break;
      case 'tok-close': clearSel(li); break;
      case 'tok-step': selectTok(li, +el.dataset.i); break;
      case 'reveal': if (ROOT.classList.contains('hide-ko')) el.classList.toggle('revealed'); break;
      case 'speak': speak(el.dataset.say); break;
      case 'speak-line': { const l = lineOf(li); if (l) speak(l.toks.map(sayOf).join('')); break; }
      case 'toggle-line': { const on = Progress.toggle('l', el.dataset.lk); remember(li); toast(on ? '이해한 줄로 표시했어요' : '이해한 줄 표시를 풀었어요'); break; }
      case 'toggle-word': { const on = Progress.toggle('w', el.dataset.wk); toast(on ? '외운 단어에 넣었어요' : '외운 단어에서 뺐어요'); break; }
      case 'goto-line': gotoLine(el.dataset.song, +el.dataset.line); break;
      case 'vx': { const v = el.closest('.vrow'); setVOpen(v, !v.classList.contains('open')); break; }
      case 'kana': selectKana(el); break;
      case 'kmode': {
        state.kmode = el.dataset.v; const pg = $('#kana-page'); if (pg) pg.className = 'kmode-' + state.kmode;
        $$('[data-a="kmode"]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === state.kmode)));
        { const card = $('#kdetail'); if (card && state.ksel) card.innerHTML = kanaDetailHTML(state.ksel); } break;
      }
      case 'q-ans': {
        const q = state.quiz, c = q.cur; if (!c || c.picked != null) break;
        c.picked = +el.dataset.i; q.total++;
        if (c.labels[c.picked] === c.ans) { q.right++; q.streak++; if (q.streak > q.best) { q.best = q.streak; store.set('hgn.kanaBest', q.best); } } else q.streak = 0;
        renderQuiz(); speak(c.h);
        const nb = $('#quiz [data-a="q-next"]'); if (nb) nb.focus({ preventScroll: true });
        break;
      }
      case 'q-next': qNew(); renderQuiz(); { const b0 = $('#quiz .q-btn'); if (b0) b0.focus({ preventScroll: true }); } break;
      case 'q-opt': state.quiz[el.dataset.key] = el.dataset.v; qNew(); renderQuiz(); break;
      case 'jump': { const t = document.getElementById(el.dataset.target); if (t) t.scrollIntoView({ block: 'start', behavior: smooth() }); break; }
      case 'hist': histGo(+el.dataset.d); break;
      case 'download': saveOffline(el); break;
      case 'open-settings': openSheet(); break;
      case 'close-settings': closeSheet(); break;
      case 'reset':
        if (el.classList.contains('armed')) {
          clearTimeout(state.resetT); Progress.clear(); el.classList.remove('armed'); el.textContent = '학습 기록 지우기'; toast('학습 기록을 모두 지웠어요');
        } else {
          el.classList.add('armed'); el.textContent = '한 번 더 누르면 모두 지워져요';
          clearTimeout(state.resetT); state.resetT = setTimeout(() => { el.classList.remove('armed'); el.textContent = '학습 기록 지우기'; }, 4000);
        }
        break;
    }
  });
  $('#sheet').addEventListener('change', (e) => { const i = e.target.closest('input[data-opt]'); if (i) setOpt(i.dataset.opt, i.checked); });
  $('#scrim').addEventListener('click', closeSheet);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

  /* ── 시작 ─────────────────────────────────────────────── */
  $('#side-songs').innerHTML = CATALOG.map((c) => (c.status === 'ready'
    ? '<button class="nav-item song-item" data-a="nav" data-to="song.' + c.id + '" data-nav="song.' + c.id + '"><span class="si-t">' + rich(c.title) + '</span>' + (c.demo ? '<span class="si-tag">예시</span>' : '') + '</button>'
    : '<div class="nav-item song-item soon" aria-disabled="true"><span class="si-t">' + rich(c.title) + '</span><span class="si-tag">준비 중</span></div>')).join('');
  applyS();
  loadWords();
  Progress.load();
  updateSyncLabel();
  setupDownload();
  state.route = fromHash();
  /* 언어 선택 페이지(../index.html)로 가는 링크는 GitHub Pages처럼 japanese/ 폴더 안에서 열렸을 때만 보여요. 아티팩트나 내려받은 파일에는 위 폴더가 없어요. */
  if (/\/japanese\/(index\.html)?$/.test(location.pathname)) $$('[data-lang-back]').forEach((el) => { el.hidden = false; });
  initHistory();
  route();
  Progress.connect();
})();
</script>
