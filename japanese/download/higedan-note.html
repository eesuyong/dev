싶다, 살아가고 싶다."}],"c":"앞 줄의 희망과 미래도를 손에서 놓지 않겠다는 말이에요. '~일 뿐(だけ)'이라고 소박하게 줄여 말해요."}]},{"label":"サビ 2 · 두 번째 후렴","note":"이번 질문은 현실과 보장이에요. 대답하지 못했던 과거까지 등에 태우고 날며, 나를 이끈 빛이 그 목소리였다는 걸 깨달아요.","lines":[{"id":"f1","tk":[{"t":"{現|げん}{実|じつ}","p":"명사","m":"현실","n":"한국어 '현실(現實)'과 같은 한자어예요. 実은 實의 일본식 약자예요."},{"t":"は"},{"t":"{見|み}えます","p":"동사","m":"보입니까","b":"{見|み}える","bm":"보이다","w":"어간 見는 한자, えます는 히라가나예요."},{"t":"か"},{"t":"？"},{"t":"{保|ほ}{証|しょう}","p":"명사","m":"보증, 보장","n":"한국어 '보증(保證)'과 같은 한자어예요. 証은 證의 일본식 약자예요."},{"t":"は"},{"t":"{出|で}{来|き}ます","p":"동사","m":"할 수 있습니까","b":"{出|で}{来|き}る","bm":"할 수 있다","w":"出来る는 한자로도, 히라가나 できる로도 써요. 여기서는 한자로 썼어요.","n":"保証は出来ますか = 보증할 수 있습니까. 명사 + は + できる = ~을 할 수 있다."},{"t":"か"},{"t":"？"}],"ko":"현실이 보이나요? 보장할 수 있나요?","lit":"현실 / 은 / 보입니다 / 까 / 보증 / 은 / 할 수 있습니다 / 까","g":[{"k":"명사 + は + {出|で}{来|き}る","d":"'~을 할 수 있다'. 保証は出来る = 보증은 할 수 있다. 運転は出来る = 운전은 할 수 있다."}],"c":"1절 질문은 날개와 날 수 있는지였고, 2절 질문은 현실과 보장이에요. 꿈 이야기를 하면 꼭 돌아오는 어른들의 물음처럼 들려요."},{"id":"f2","tk":[{"t":"Yes"},{"t":"も"},{"t":"No"},{"t":"も"},{"t":"{言|い}えずに","p":"동사","m":"말하지 못하고","b":"{言|い}う","bm":"말하다","w":"어간 言는 한자, えずに는 히라가나예요.","n":"가능형 言える(말할 수 있다)의 부정 言えない → 言えずに(말하지 못하고). 사비의 言わずに(말하지 않고)와 한 글자 차이예요."},{"t":"{答|こた}え","p":"명사","m":"대답, 답","w":"答える(대답하다)의 명사형이라 오쿠리가나 え가 붙어 있어요."},{"t":"に"},{"t":"{詰|つ}まっていた","p":"동사","m":"막혀 있던","b":"{詰|つ}まる","bm":"막히다, 꽉 차다","w":"어간 詰는 한자, まっていた는 히라가나예요.","n":"答えに詰まる = 대답이 막히다, 말문이 막히다. 鼻が詰まる = 코가 막히다."},{"t":"{過|か}{去|こ}","p":"명사","m":"과거"},{"t":"を"}],"ko":"Yes도 No도 말하지 못한 채 대답이 막혀 있던 과거를","lit":"Yes / 도 / No / 도 / 말하지 못하고 / 대답 / 에 / 막혀 있던 / 과거 / 를","kr":"예스모 노-모 이에즈니 코타에니 츠맛테이타 카코오","g":[{"k":"{言|い}わずに / {言|い}えずに","d":"言わずに = 말하지 않고(스스로 안 함). 言えずに = 말하지 못하고(하고 싶어도 못 함). わ와 え 한 글자로 '안 함'과 '못 함'이 갈려요."},{"k":"{答|こた}えに{詰|つ}まる","d":"'대답이 막히다'. 질문을 받고 말이 나오지 않는 상태예요."}],"c":"1절 사비의 '말하지 않고'가 여기서 '말하지 못하고'로 바뀌었어요. 같은 침묵이라도 과거의 나는 대답을 못 했던 거예요."},{"id":"f3","tk":[{"t":"{背|せ}","p":"명사","m":"등","n":"背는 せ로도 せなか(背中)로도 '등'이에요. 背が高い는 '키가 크다'라는 뜻이 돼요."},{"t":"に"},{"t":"{乗|の}せた","p":"동사","m":"태운, 실은","b":"{乗|の}せる","bm":"태우다, 싣다","w":"어간 乗는 한자, せた는 히라가나예요.","n":"乗る(타다, 자동사)와 乗せる(태우다, 타동사)는 짝이에요. 사비의 乗り越えた와 같은 乗예요."},{"t":"ラフター"},{"t":"　"},{"t":"{予|よ}{想|そう}","p":"명사","m":"예상","n":"한국어 '예상(豫想)'과 같은 한자어예요. 予는 豫의 일본식 약자예요."},{"t":"を"},{"t":"{覆|くつがえ}した","p":"동사","m":"뒤엎었어","b":"{覆|くつがえ}す","bm":"뒤엎다","w":"어간 覆는 한자, した는 히라가나예요.","n":"覆(뒤집힐 복)는 覆う(おおう, 덮다)로도 읽어요. 予想を覆す(예상을 뒤엎다)는 스포츠 뉴스에서도 자주 쓰는 말이에요."}],"ko":"그 과거를 등에 태운 Laughter, 예상을 뒤엎었어","lit":"등 / 에 / 태운 / 래프터 / 예상 / 을 / 뒤엎었다","g":[{"k":"AをBに{乗|の}せる","d":"'A를 B에 태우다, 싣다'. 앞 줄의 過去を(과거를)가 이 줄의 背に乗せた(등에 태운)로 이어져요. 過去を背に乗せたラフター = 과거를 등에 태운 래프터."}],"c":"대답하지 못했던 과거를 버리지 않고 등에 태운 채 날아요. 날 수 있겠냐던 사람들의 예상을 뒤집은 거예요."},{"id":"f4","tk":[{"t":"ゴール","p":"명사(외래어)","m":"결승점, 골","w":"영어 goal을 가타카나로 옮긴 외래어예요.","n":"축구의 골, 마라톤의 결승점처럼 '목표 지점'을 말해요."},{"t":"や"},{"t":"{距|きょ}{離|り}","p":"명사","m":"거리","n":"한국어 '거리(距離)'와 같은 한자어예요."},{"t":"では"},{"t":"なくて"},{"t":"　"},{"t":"{絶|た}えず","p":"부사","m":"끊임없이","w":"絶える(끊기다)에 ず(~않고)가 붙어 굳은 부사예요. 絶는 한자, えず는 히라가나예요.","n":"絶える는 らしさ의 息絶える(숨이 끊어지다)에도 나왔어요. 絶えず = 끊이지 않고, 늘."},{"t":"{響|ひび}いてた","p":"동사","m":"울리고 있던","b":"{響|ひび}く","bm":"울리다","w":"어간 響는 한자, いてた는 히라가나예요.","n":"響いていた의 い가 빠진 회화체예요."},{"t":"{声|こえ}"},{"t":"こそ","p":"조사","m":"~야말로","n":"こそ는 앞말을 강하게 내세워요. 今こそ = 지금이야말로."},{"t":"が"}],"ko":"결승점도 거리도 아니라, 끊임없이 울리던 그 목소리야말로","lit":"골 / 이나 / 거리 / 가 / 아니고 / 끊임없이 / 울리고 있던 / 목소리 / 야말로 / 가","g":[{"k":"〜こそが","d":"'~야말로'. こそ + 주어의 が. 声こそが = 목소리야말로. 이 문장은 두 줄 뒤 あの光だった(그 빛이었다)에서 끝나요."}],"c":"얼마나 멀리, 어디까지 날았는지가 아니라 나를 계속 부르던 목소리가 중요했다는 말이에요. 1절 사비의 '날고 싶다고 들떠 외치는 목소리'와 이어져요."},{"id":"f5","tk":[{"t":"{孤|こ}{独|どく}な","p":"な형용사","m":"고독한, 외로운","b":"{孤|こ}{独|どく}","bm":"고독함","n":"한국어 '고독(孤獨)'과 같은 한자어예요. 独은 獨의 일본식 약자예요."},{"t":"{夜|よる}","p":"명사","m":"밤"},{"t":"に","m":"~에 (때)"},{"t":"サーチライト","p":"명사(외래어)","m":"탐조등, 서치라이트","w":"영어 searchlight를 가타카나로 옮긴 외래어예요.","n":"어두운 하늘이나 바다를 비춰 무언가를 찾는 큰 조명이에요."},{"t":"に","m":"~로 (삼다)"},{"t":"してた","p":"동사","m":"삼고 있던","b":"する","bm":"하다","w":"する의 て형 して에 た(いた의 줄임)가 붙었어요.","n":"AをBにする = A를 B로 삼다. 声をサーチライトにしてた = 목소리를 서치라이트로 삼고 있었다."}],"ko":"외로운 밤마다 서치라이트로 삼았던","lit":"고독한 / 밤 / 에 / 서치라이트 / 로 / 삼고 있던","g":[{"k":"AをBにする","d":"'A를 B로 삼다, A를 B로 만들다'. 여기서 A(목소리)는 앞 줄에 있어요. 声を…サーチライトにしてた."}],"c":"외로운 밤에 길을 찾게 해 준 탐조등이 바로 그 목소리였다는 고백이에요."},{"id":"f6","tk":[{"t":"あの","p":"연체사","m":"그, 저","w":"こ·そ·あ·ど 지시어라 히라가나로 써요.","n":"あの는 말하는 사람과 듣는 사람이 함께 아는 것을 가리킬 때도 써요. 여기서는 '그때의 그'예요."},{"t":"{光|ひかり}"},{"t":"だった"},{"t":"　"},{"t":"{今|いま}"},{"t":"やっと","p":"부사","m":"이제야, 겨우","w":"부사라 히라가나로 써요.","n":"오래 기다리거나 애쓴 끝에 '드디어, 이제야'라는 느낌이에요."},{"t":"{気|き}{付|づ}いた","p":"동사","m":"깨달았어, 알아챘어","b":"{気|き}{付|づ}く","bm":"깨닫다, 알아차리다","w":"気·付 두 한자에 오쿠리가나가 붙은 말이에요. 気づく처럼 히라가나를 섞어 쓰기도 해요.","n":"気(마음) + 付く(붙다) = 마음이 닿다 → 알아차리다. 付く가 뒤에 붙어 づく로 흐려져요."}],"ko":"그 빛이었어, 이제야 겨우 깨달았어","lit":"그 / 빛 / 이었다 / 지금 / 겨우 / 깨달았다","g":[{"k":"〜だった","d":"'~였다'. だ의 과거형이에요. あの光だった = 그 빛이었다."}],"c":"f4부터 한 문장이에요. '결승점도 거리도 아닌, 끊임없이 울리던 목소리야말로 외로운 밤의 서치라이트였던 그 빛이었다.' 긴 문장을 끝까지 따라가면 마지막에 답이 나와요."}]},{"label":"Cメロ · 브리지","note":"전례 없는 폭우 속에서도 가슴은 뜨거워지고, 새는 번개보다 빠르게 날아올라요.","lines":[{"id":"g1","tk":[{"t":"{前|ぜん}{例|れい}","p":"명사","m":"전례","n":"한국어 '전례(前例)'와 같은 한자어예요. 前例のない = 전례 없는, 처음 겪는."},{"t":"の","m":"~가 (꾸미는 말 속의 주어)"},{"t":"ない","p":"い형용사","m":"없는","b":"ない","bm":"없다","w":"'없다'의 ない는 히라가나로 써요."},{"t":"{大|おお}{雨|あめ}","p":"명사","m":"큰비, 폭우","n":"大(큰) + 雨(비). 여기서는 大를 おお로 읽어요. 大事(だいじ)처럼 だい로 읽는 말과 구별해요."},{"t":"に","m":"~에 (그런 상황에서)"},{"t":"　"},{"t":"{傘|かさ}","p":"명사","m":"우산","n":"傘는 펼친 우산의 모양을 본뜬 한자예요."},{"t":"も"},{"t":"{意|い}{味|み}","p":"명사","m":"의미","n":"한국어 '의미(意味)'와 같은 한자어예요."},{"t":"を"},{"t":"{為|な}さない","p":"동사","m":"이루지 못한다","b":"{為|な}す","bm":"하다, 이루다","w":"為す는 히라가나 なす로 쓰는 일이 많은 말인데, 여기서는 한자로 썼어요.","n":"意味を為さない = 의미를 이루지 못한다 → 소용없다. 굳어진 표현이에요."}],"ko":"전례 없는 폭우에 우산도 소용이 없어","lit":"전례 / 가 / 없는 / 큰비 / 에 / 우산 / 도 / 의미 / 를 / 이루지 않는다","g":[{"k":"명사のない + 명사","d":"'~가 없는 (명사)'. 꾸미는 말 속에서 が 대신 の를 써요. 前例のない大雨 = 전례 없는 폭우. 1절의 鳥の急かすような와 같은 の예요."},{"k":"{意|い}{味|み}を{為|な}さない","d":"'의미가 없다, 소용없다'. 意味がない와 뜻이 같지만 더 글말이에요."}],"c":"날아오른 뒤 가장 큰 시련이 폭우로 그려져요. 우산, 곧 준비해 둔 보호나 대책도 통하지 않는 상황으로 읽혀요."},{"id":"g2","tk":[{"t":"それでも","p":"접속사","m":"그래도, 그럼에도","w":"접속사라 히라가나로 써요."},{"t":"{胸|むね}","p":"명사","m":"가슴","n":"胸는 몸의 가슴과 함께 '마음'을 가리킬 때도 써요. 胸がいっぱい = 가슴이 벅차다."},{"t":"は"},{"t":"{熱|あつ}く","p":"い형용사","m":"뜨겁게","b":"{熱|あつ}い","bm":"뜨겁다","w":"어간 熱는 한자, く는 히라가나예요.","n":"熱い(뜨겁다), 暑い(덥다), 厚い(두껍다)는 모두 あつい예요. 한자로 뜻을 구별해요."},{"t":"なって","p":"동사","m":"되어","b":"なる","bm":"되다","w":"なる는 기본 동사라 히라가나로 써요."}],"ko":"그래도 가슴은 뜨거워져서","lit":"그래도 / 가슴 / 은 / 뜨겁게 / 되어","g":[{"k":"い형용사 く형 + なる","d":"'~해지다'. 熱い → 熱くなる(뜨거워지다), 寒い → 寒くなる(추워지다)."}],"c":"それでも(그래도)는 らしさ에도 나온 말이에요. 상황이 나빠질수록 오히려 뜨거워지는 마음을 그려요."},{"id":"g3","tk":[{"t":"{海|うみ}{鳴|な}り","p":"명사","m":"해명 (바다가 우르릉 우는 소리)","w":"海(바다)와 鳴り(울림, 鳴る의 명사형)를 합친 말이에요.","n":"海鳴り는 먼바다에서 들려오는 낮고 우르릉거리는 소리예요. 폭풍이 다가올 때 들린다고들 해요. 鳴(울 명)는 鳥が鳴く(새가 울다)의 鳴와 같은 한자예요."},{"t":"よりも"},{"t":"{強|つよ}く","p":"い형용사","m":"강하게","b":"{強|つよ}い","bm":"강하다","w":"어간 強는 한자, く는 히라가나예요."},{"t":"　"},{"t":"{稲|いな}{妻|ずま}","p":"명사","m":"번개","w":"稲(벼)와 妻(아내)를 합쳐 '번개'를 나타내는 말이에요.","n":"번개가 치면 벼가 잘 여문다고 믿어, 번개를 '벼의 짝(つま)'이라 부른 데서 왔다는 설이 널리 알려져 있어요. 옛말 つま는 아내와 남편을 모두 가리켰어요."},{"t":"よりも"},{"t":"{速|はや}く","p":"い형용사","m":"빠르게","b":"{速|はや}い","bm":"빠르다","w":"어간 速는 한자, く는 히라가나예요.","n":"速い는 속도가 빠른 것, 早い는 때가 이른 것이에요. 둘 다 はやい예요."}],"ko":"바다 울음보다 강하게, 번개보다 빠르게","lit":"해명 / 보다도 / 강하게 / 번개 / 보다도 / 빠르게","g":[{"k":"〜よりも","d":"'~보다도'. 비교의 より + 강조의 も. 誰よりも = 누구보다도."},{"k":"い형용사 く형 (부사)","d":"い를 く로 바꾸면 '~하게'. 強い → 強く, 速い → 速く."}],"s":"稲妻는 글자만 보면 '벼의 아내'라서 한자 뜻만으로는 번개가 떠오르지 않아요. 옛사람들의 생각이 담긴 말이라, 한자로 써야 그 이야기가 보여요.","c":"폭풍의 바다와 번개처럼 자연에서 가장 센 것들보다 더 강하고 빠르게 날겠다는 말이에요."},{"id":"g4","tk":[{"t":"{羽|は}ばたいて","p":"동사","m":"날갯짓하며","b":"{羽|は}ばたく","bm":"날갯짓하다, 날아오르다","w":"羽(날개)는 한자, ばたいて는 히라가나예요.","n":"날개로 공기를 쳐서 나는 모습이에요. 世界に羽ばたく(세계로 날아오르다)처럼 '크게 활약하다'는 뜻으로도 써요."},{"t":"{前|ぜん}{途|と}","p":"명사","m":"앞길, 전도","n":"한국어 '전도(前途)'와 같은 한자어예요. 前途洋洋 = 앞길이 밝고 넓음."},{"t":"を"},{"t":"{目|め}{指|ざ}して","p":"동사","m":"향해, 목표로 삼아","b":"{目|め}{指|ざ}す","bm":"목표로 하다, 향하다","w":"目·指 두 한자에 오쿠리가나가 붙은 말이에요.","n":"目(눈) + 指す(가리키다) = 눈으로 가리키다 → 목표로 삼다. 優勝を目指す = 우승을 노리다."}],"ko":"날갯짓하며 내 앞길을 향해","lit":"날갯짓해서 / 앞길 / 을 / 목표로 하여","g":[{"k":"〜を{目|め}{指|ざ}す","d":"'~을 목표로 하다, ~을 향해 가다'. 頂上を目指す = 정상을 향해 가다."}],"s":"1절의 羽根(はね)과 같은 羽가 여기서는 동사 羽ばたく로 나와요. 거울 속에서 찾지 못했던 깃털이 마지막에는 날갯짓이 된 셈이에요.","c":"브리지는 문장을 끝맺지 않고 て형으로 끝나요. 그대로 마지막 후렴으로 날아 들어가는 느낌이에요."}]},{"label":"ラストサビ · 마지막 후렴","note":"첫 후렴을 그대로 다시 불러요. 폭풍을 지나온 뒤라 같은 말이 더 힘 있게 들려요.","lines":[{"id":"h1","same":"c1"},{"id":"h2","same":"c2"},{"id":"h3","same":"c3"},{"id":"h4","same":"c4"},{"id":"h5","same":"c5"},{"id":"h6","same":"c6"},{"id":"h7","same":"c7"}]}]},"rashisa":{"id":"rashisa","title":"らしさ","artist":"Official髭男dism","year":2025,"eyebrow":"Official髭男dism · 2025","sub":"나의 약함도, 어두운 마음도, 지기 싫은 열정도 전부 '나다움'으로 끌어안는 노래. 극장 애니메이션 「ひゃくえむ。」 주제가.","release":"2025년 8월 6일 디지털 발매","tieIn":"극장 애니메이션 「ひゃくえむ。」(2025) 주제가","lyricist":"藤原聡","composer":"藤原聡","listen":"https://www.youtube.com/results?search_query=Official%E9%AB%AD%E7%94%B7dism+%E3%82%89%E3%81%97%E3%81%95","intro":"らしさ는 2025년 8월에 발표된 곡으로, 100m 달리기에 인생을 건 사람들을 그린 극장 애니메이션 「ひゃくえむ。」의 주제가예요. 원작 만화에 영감을 받아 보컬 藤原聡가 새로 쓴 곡이에요.\n\n제목 らしさ는 '~다움'이라는 뜻이에요. 재능이 없어도, 마음이 약해도, 남들이 '절대 1등은 못 한다'고 해도, 지기 싫은 마음까지 전부 '나다움'으로 안고 달리겠다는 노래예요. 가사 속 君(너)는 다른 사람이라기보다 '나의 어두운 부분'을 부르는 이름이라는 점을 기억하고 읽어 보세요.","notes":[{"tag":"배경","title":"100m 달리기 만화 「ひゃくえむ。」","body":"「ひゃくえむ。」는 만화가 魚豊의 연재 데뷔작으로, 육상 100m 달리기의 한순간에 매료된 사람들의 광기와 열정을 그린 작품이에요. 魚豊는 지동설을 둘러싼 이야기 「チ。―地球の運動について―」로도 잘 알려진 작가예요. 극장 애니메이션은 2025년 9월에 공개됐고, らしさ는 그 주제가로 한 달 앞서 발표됐어요.\n\n밴드는 이 곡을 어려움이나 '절대'에 맞서 분투하는 모든 사람에게 보내는 찬가로 만들었다고 밝혔어요. 가사의 絶対的1位(절대적인 1위), 足音の群衆(발소리의 군중), 位置についたなら(제자리에 섰다면)가 모두 달리기 장면과 이어져요."},{"tag":"표현","title":"이 곡의 君는 누구일까","body":"첫 부분에 [[{君|きみ}という{僕|ぼく}の{黒|くろ}い{部分|ぶぶん}]](너라는 나의 검은 부분)이라는 말이 나와요. 이어서 [[{君|きみ}という{闇|やみ}]](너라는 어둠), [[どちらも{僕|ぼく}で{君|きみ}だから]](어느 쪽도 나이고 너니까)가 나오죠. 그래서 이 곡의 君는 다른 사람이라기보다, 포기하라고 속삭이는 내 안의 또 다른 나로 읽혀요.\n\n같은 君라도 Pretender에서는 사랑하는 상대, 宿命에서는 함께 뛰는 동료였어요. 곡마다 君가 누구인지 생각하며 읽으면 히게단 가사가 더 깊게 보여요. Cメロ에서 핑계를 대는 목소리가 君가 아니라 거친 お前로 부르는 것도 눈여겨보세요."},{"tag":"표기","title":"〜的(てき)가 이어지는 말맛","body":"[[{現実的|げんじつてき}・{客観的|きゃっかんてき}・{絶望的|ぜつぼうてき}・{絶対的|ぜったいてき}]], [[{圧倒的|あっとうてき}・{直感的|ちょっかんてき}]], [[{打算的|ださんてき}・{消極的|しょうきょくてき}]]처럼 〜的가 줄줄이 나와요. 的는 한국어 '~적'과 같은 한자라서, 한자만 알면 현실적·객관적·절망적처럼 뜻이 바로 보여요.\n\n노래에서는 てき라는 소리가 박자마다 되풀이되며 리듬을 만들어요. 남들의 냉정한 평가(현실적, 객관적)와 나의 뜨거운 반발(압도적, 직감적)을 같은 〜的로 맞세운 것도 재미있는 대비예요."},{"tag":"표현","title":"らしさ와 〜らしい","body":"〜らしい는 명사 뒤에 붙어 '~답다'를 만들고, 끝의 い를 さ로 바꾸면 '~다움'이라는 명사 らしさ가 돼요. [[{僕|ぼく}らしい]](나답다) → [[{僕|ぼく}らしさ]](나다움). 한자가 없는 접미사라서 늘 히라가나로 써요.\n\n일본에서는 [[{自分|じぶん}らしさ]](나다움)라는 말이 광고나 교육, 취업 이야기에서 자주 쓰여요. 이 곡은 그 말을 예쁜 개성으로 그리지 않아요. 약점과 어둠, 질투와 지기 싫은 마음까지 전부 끌어안는 무거운 말로 다시 써요. 가사 속 思想なんて僕らしくはないや(사상 같은 건 나답지 않아)도 같은 らしい예요."},{"tag":"문화","title":"オンリーワン이라는 말","body":"일본에서 [[オンリーワン]](온리 원)은 SMAP의 히트곡 「世界に一つだけの花」(2003)의 '넘버원이 되지 않아도 돼, 원래 특별한 온리 원'이라는 가사로 널리 퍼진 말이에요. 1등이 아니어도 저마다 특별하다는 위로의 말로 쓰여요.\n\n이 곡의 オンリーワンでもいいと 無理やりつけたアイマスク는 그 위로를 억지로 눈가리개처럼 썼지만 결국 한숨도 못 잤다는 고백으로 읽혀요. 진짜 마음은 1등을 원한다는 걸 숨길 수 없었던 거죠."},{"tag":"문화","title":"位置について、よーい、ドン","body":"일본 달리기의 출발 구령은 [[{位置|いち}について、よーい、ドン]]이에요. '제자리에, 준비, 출발'에 해당하고, 초등학교 운동회에서부터 누구나 듣는 말이에요.\n\n마지막 후렴의 位置についたなら さあ、本気で勝負だ(제자리에 섰다면 자, 진심으로 승부다)는 이 구령을 그대로 빌린 표현이에요. 100m 달리기 작품의 주제가다운 마무리예요."},{"tag":"표기","title":"이 곡의 가타카나와 회화체","body":"**가타카나**: 외래어 オンリーワン·アイマスク·ペース·プレゼント·プライド·レベル 말고도, 한자로 쓸 수 있는 말을 가타카나로 쓴 곳이 있어요. [[メチャクチャ]](滅茶苦茶)와 동사 [[ブレない]]는 말투를 살리고 강조하려는 가타카나예요.\n\n**회화체**: まじで, てか, じゃん, やっぱ, そっか처럼 친구끼리 쓰는 말이 많아요. 分かっちゃいる(分かってはいる), 楽しけりゃ(楽しければ)처럼 소리가 줄어든 말도 자주 나와요. 노래 전체가 자기 자신과 다투는 혼잣말이라서 그래요.\n\n**한자**: 捧げる·痒い처럼 조요칸지 밖의 글자를 일부러 썼어요. 宿命에 이어 宿す(품다)의 宿가 다시 나와요."}],"dict":{"{君|きみ}":{"p":"대명사","m":"너 (내 안의 또 다른 나)","w":"'너'를 뜻하는 대명사로, 한자로 쓰는 게 일반적이에요.","n":"이 곡의 君는 다른 사람이라기보다 '나의 어두운 부분'을 부르는 이름으로 읽혀요. 첫 부분에 君という僕の黒い部分(너라는 나의 검은 부분)이라고 직접 나와요."},"{僕|ぼく}":{"p":"대명사","m":"나 (남성)","w":"1인칭 대명사로 한자로 쓰는 게 일반적이에요.","n":"부드럽고 소년 같은 느낌의 남성 1인칭이에요. 히게단 곡의 화자는 대부분 僕예요."},"{僕|ぼく}ら":{"p":"대명사","m":"우리","b":"{僕|ぼく}ら","w":"僕(나)는 한자, 복수를 만드는 ら는 히라가나예요.","n":"이 곡의 僕ら는 '나와 내 안의 君', 또는 같은 길을 달리는 사람들 모두로 읽을 수 있어요."},"の":{"p":"조사","m":"~의"},"は":{"p":"조사","m":"~은/는 (주제)","n":"조사로 쓸 때는 wa로 읽어요."},"が":{"p":"조사","m":"~이/가"},"を":{"p":"조사","m":"~을/를","n":"발음은 お(o)와 같아요."},"に":{"p":"조사","m":"~에"},"と":{"p":"조사","m":"~와/과"},"も":{"p":"조사","m":"~도"},"だ":{"p":"조동사","m":"~이다"},"よ":{"p":"조사(종조사)","m":"~야 (알려 주는 말투)","n":"문장 끝에 붙어 '내가 말해 줄게'라는 느낌을 더해요."},"な":{"p":"조사(종조사)","m":"~네, ~겠지 (혼잣말)"},"から":{"p":"조사","m":"~니까 (이유)"},"けど":{"p":"조사","m":"~지만"},"んだ":{"p":"조동사","m":"~인 거야","n":"のだ의 회화체예요. 이유를 대거나 마음을 힘주어 말할 때 써요. 泣くんだ = 우는 거야."},"ああ":{"p":"감동사","m":"아","w":"감탄사라 히라가나로 써요."},"そんな":{"p":"연체사","m":"그런","w":"こんな(이런)·そんな(그런)·あんな(저런)는 지시어라 히라가나로 써요."},"もの":{"p":"형식명사","m":"것","w":"'것'이라는 뜻의 형식명사라 히라가나로 써요."},"らしさ":{"p":"명사","m":"~다움, 나다움","w":"'~답다'를 만드는 접미사 らしい를 명사로 바꾼 말이에요. らしい에는 한자가 없어서 늘 히라가나로 써요.","n":"〜らしい(~답다)의 い를 さ로 바꾸면 명사가 돼요. 僕らしい(나답다) → 僕らしさ(나다움). 일본에서는 自分らしさ(나다움)라는 말을 광고나 교육에서 자주 써요."},"{抱|かか}えて":{"p":"동사","m":"안고, 떠안고","b":"{抱|かか}える","bm":"(끌어)안다, 떠안다","w":"어간 抱는 한자, えて는 히라가나예요.","n":"Pretender의 抱きしめる(だきしめる)와 같은 한자 抱인데, 여기서는 かかえる로 읽어요. 抱える는 팔로 감싸 안는 것, 그리고 문제나 짐을 '떠안다'는 뜻도 있어요."},"{捧|ささ}げて":{"p":"동사","m":"바치고","b":"{捧|ささ}げる","bm":"바치다","w":"어간 捧는 한자, げて는 히라가나예요. 捧는 조요칸지에 없는 글자라 ささげる로 풀어 쓰기도 하는 말인데, 한자로 써서 '모든 걸 바친다'는 무게를 실었어요."},"{泣|な}く":{"p":"동사","m":"울다","w":"어간 泣는 한자, く는 히라가나예요."},"{笑|わら}う":{"p":"동사","m":"웃다","w":"어간 笑는 한자, う는 히라가나예요."},"{泣|な}いてた":{"p":"동사","m":"울었다, 울곤 했다","b":"{泣|な}く","bm":"울다","w":"어간 泣는 한자, いてた는 히라가나예요.","n":"泣いていた에서 い가 빠진 회화체예요. 〜ていた는 '~하고 있었다, ~하곤 했다'."},"{笑|わら}ってた":{"p":"동사","m":"웃었다, 웃곤 했다","b":"{笑|わら}う","bm":"웃다","w":"어간 笑는 한자, ってた는 히라가나예요.","n":"笑っていた의 회화체예요."},"{分|わ}かってる":{"p":"동사","m":"알고 있어","b":"{分|わ}かる","bm":"알다, 이해하다","w":"分는 한자, 활용 부분 かってる는 히라가나예요.","n":"分かっている에서 い가 빠진 회화체예요."},"{分|わ}かっちゃいる":{"p":"동사","m":"알고는 있다","b":"{分|わ}かる","bm":"알다, 이해하다","w":"分는 한자, 나머지는 히라가나예요.","n":"分かってはいる의 회화체예요. 〜ては가 줄어 〜ちゃ가 됐어요. '알긴 아는데'처럼 뒤에 반대 말이 올 때 써요."},"{何度|なんど}":{"p":"명사","m":"몇 번","n":"何(なん) + 度(번). 何度も = 몇 번이고. 度는 回(かい)와 같이 횟수를 세는 말이에요."},"{負|ま}けて":{"p":"동사","m":"져서, 지고","b":"{負|ま}ける","bm":"지다","w":"어간 負는 한자, けて는 히라가나예요."},"どちら":{"p":"대명사","m":"어느 쪽","w":"どちら(어느 쪽)·こちら(이쪽)·そちら(그쪽)는 지시어라 히라가나로 써요.","n":"どちらも = 둘 다, 어느 쪽이든."},"{全|すべ}て":{"p":"명사","m":"전부, 모든 것","w":"全은 한자, て는 오쿠리가나예요."},"{大好|だいす}きな":{"p":"な형용사","m":"아주 좋아하는","b":"{大好|だいす}き","bm":"아주 좋아함","w":"大(크다)+好(좋아하다)는 한자, き와 명사를 꾸미는 な는 히라가나예요."},"{競|きそ}い{合|あ}った":{"p":"동사","m":"서로 겨룬","b":"{競|きそ}い{合|あ}う","bm":"서로 경쟁하다","w":"競う(겨루다)+合う(서로 ~하다)의 복합동사예요. 어간은 한자, 활용 부분은 히라가나예요.","n":"동사 ます형 + 合う = '서로 ~하다'. 宿命의 照らし合う(서로 비추다)와 같은 짜임이에요."},"まま":{"p":"명사","m":"~한 채, 그대로","w":"'그대로인 상태'를 뜻하는 명사예요. 한자 儘이 있지만 보통 히라가나로 써요."},"{事|こと}":{"p":"형식명사","m":"일, 것","k":"こと","w":"こと는 보통 히라가나로 쓰는데, 여기서는 한자 事를 썼어요. '좋아하는 일'이라는 실제 내용이 있는 말이라 한자를 고른 것으로 볼 수 있어요."},"{全部|ぜんぶ}":{"p":"명사","m":"전부","n":"한국어 '전부(全部)'와 같은 한자어예요."}},"sections":[{"label":"도입","note":"곡은 결론부터 시작해요. 나를 나로 만드는 것은 약점과 어둠까지 '전부' 자랑하고 좋아하겠다는 선언이에요.","lines":[{"id":"a1","tk":[{"t":"{誇|ほこ}る","p":"동사","m":"자랑하다, 자랑스럽게 여기다","w":"어간 誇는 한자, る는 히라가나예요.","n":"誇る = 자랑으로 여기다. 誇り(ほこり)는 명사로 '자부심'이에요. 같은 소리의 ほこり(埃)는 '먼지'라서 한자로 구별해요."},{"t":"よ"},{"t":"{全部|ぜんぶ}"}],"ko":"자랑할 거야, 전부","lit":"자랑하다 / 야 / 전부","g":[{"k":"도치 (말 순서 바꾸기)","d":"원래 순서는 全部(を)誇るよ(전부 자랑할 거야). 가사에서는 동사를 먼저 던지고 목적어를 뒤에 붙여 강조하는 일이 많아요."}],"s":"誇·全部만 한자이고, 끝의 よ가 히라가나로 말투를 붙여요. 다음 줄 好きだよ全部와 짝을 이뤄 같은 틀을 반복해요."},{"id":"a2","tk":[{"t":"{僕|ぼく}"},{"t":"が"},{"t":"{僕|ぼく}"},{"t":"で","p":"조동사","m":"~이 (~である의 で)"},{"t":"ある","p":"동사","m":"~이다 (である)","w":"ある(있다)는 보통 히라가나로 써요.","n":"〜である는 '~이다'의 딱딱한 글말이에요. 僕が僕である = 내가 나라는 것, 내가 나로 있는 것."},{"t":"ため","p":"형식명사","m":"~하기 위함","w":"'위함'을 뜻하는 형식명사라 히라가나로 써요. 한자 為로도 쓰지만 드물어요.","n":"〜ための = ~하기 위한. 僕が僕であるための要素 = 내가 나로 있기 위한 요소."},{"t":"の"},{"t":"{要素|ようそ}","p":"명사","m":"요소","n":"한국어 '요소(要素)'와 같은 한자어예요."},{"t":"を"}],"ko":"내가 나로 있기 위한 요소들을","lit":"나 / 가 / 나 / 이 / 다 / 위함 / 의 / 요소 / 를","g":[{"k":"〜である","d":"'~이다'의 글말 형태예요. 회화체 だ보다 단단하고 선언하는 느낌이 나요."},{"k":"〜ための + 명사","d":"'~하기 위한 (명사)'. 僕であるための要素 = 나이기 위한 요소."}],"c":"앞 줄의 全部(전부)가 무엇인지 이 줄에서 밝혀요. 이어지는 줄들이 그 '요소'를 하나씩 늘어놓아요. 그런데 그 목록은 장점이 아니라 대부분 약점이에요."},{"id":"a3","tk":[{"t":"{好|す}き","p":"な형용사","m":"좋아함","w":"뜻을 담은 好는 한자, 끝의 き는 오쿠리가나라 히라가나예요."},{"t":"だ"},{"t":"よ"},{"t":"{全部|ぜんぶ}"}],"ko":"좋아해, 전부","lit":"좋아함 / 이다 / 야 / 전부","s":"1행 誇るよ全部와 같은 틀이에요. 誇る(자랑하다)와 好き(좋아하다) 두 마음을 나란히 세워요."},{"id":"a4","tk":[{"t":"{君|きみ}"},{"t":"という","p":"조사(복합)","m":"~라는","n":"と(~라고) + いう(말하다)가 굳은 표현이에요. 君という僕の黒い部分 = 너라는 (이름의) 나의 검은 부분."},{"t":"{僕|ぼく}"},{"t":"の"},{"t":"{黒|くろ}い","p":"い형용사","m":"검은","w":"어간 黒는 한자, い는 오쿠리가나예요.","n":"黒い는 색깔 말고도 '속이 검은, 어두운'이라는 뜻으로도 써요. 腹黒い(はらぐろい) = 속이 시커멓다."},{"t":"{部分|ぶぶん}","p":"명사","m":"부분","n":"한국어 '부분(部分)'과 같은 한자어예요."},{"t":"も"}],"ko":"너라는 나의 검은 부분도","lit":"너 / 라는 / 나 / 의 / 검은 / 부분 / 도","g":[{"k":"AというB","d":"'A라는 B'. 君という僕の黒い部分 = 君라고 부르는, 나의 검은 부분."}],"c":"이 곡을 읽는 열쇠가 되는 줄이에요. 君(너)가 곧 '나의 검은 부분'이라고 말해요. 이 뒤로 나오는 君는 모두 다른 사람이 아니라, 나를 주저앉히는 내 안의 또 다른 나로 읽을 수 있어요."},{"id":"a5","tk":[{"t":"{恵|めぐ}まれなかった","p":"동사","m":"타고나지 못한, 복 받지 못한","b":"{恵|めぐ}まれる","bm":"(복·재능 등을) 타고나다, 혜택받다","w":"어간 恵는 한자, 활용 부분 まれなかった는 히라가나예요.","n":"恵む(베풀다)의 수동형 恵まれる = '은혜를 입다 → 타고나다'. 才能に恵まれる = 재능을 타고나다. 恵まれなかった = 타고나지 못했다."},{"t":"{才能|さいのう}","p":"명사","m":"재능","n":"한국어 '재능(才能)'과 같은 한자어예요."},{"t":"も"}],"ko":"타고나지 못한 재능도","lit":"혜택받지 못한 / 재능 / 도","g":[{"k":"〜に{恵|めぐ}まれる","d":"'~을 타고나다, ~복이 있다'. 天気に恵まれる(날씨 운이 좋다), 才能に恵まれる(재능을 타고나다)."}]},{"id":"a6","tk":[{"t":"{丈夫|じょうぶ}","p":"な형용사","m":"튼튼함","w":"한자어라 한자로 써요.","n":"丈夫는 '튼튼하다, 단단하다'. 宿命의 大丈夫(괜찮다)에서 大를 뺀 말이에요. 大丈夫는 원래 '훌륭한 사나이'였고, 丈夫도 원래는 '어엿한 남자'를 뜻했어요."},{"t":"じゃない","p":"조동사(부정)","m":"~하지 않은","b":"ではない","w":"ではない의 회화체라 히라가나로 써요."},{"t":"{性格|せいかく}","p":"명사","m":"성격"},{"t":"も"}],"ko":"튼튼하지 못한 성격도","lit":"튼튼함 / 이 아닌 / 성격 / 도","s":"丈夫·性格 둘 다 한국어와 같은 한자어예요. 丈夫(튼튼함)를 보면 宿命의 大丈夫(괜찮아)와 같은 한자라는 게 보여요."},{"id":"a7","tk":[{"t":"だけど","p":"접속사","m":"하지만, 그렇지만","w":"접속사라 히라가나로 써요.","n":"だ + けど가 굳은 말로 '그렇지만'. けれど보다 회화적이에요."},{"t":"{大|だい}それた","p":"연체사","m":"터무니없이 큰, 분수에 넘치는","b":"{大|だい}それた","w":"大는 한자, それた는 히라가나예요. 원래 '정도를 크게 벗어났다'는 말이 굳어진 표현이에요.","n":"大それた夢 = 분수에 넘칠 만큼 큰 꿈. 주로 '감히'라는 비꼬는 느낌으로 쓰는데, 여기서는 그런 꿈을 일부러 품는 자신을 인정하는 말이에요."},{"t":"{夢|ゆめ}","p":"명사","m":"꿈"},{"t":"を"},{"t":"ちゃんと","p":"부사","m":"제대로, 똑바로","w":"부사라 히라가나로 써요.","n":"ちゃんと는 회화에서 아주 많이 써요. ちゃんと食べて(제대로 먹어)."},{"t":"{描|えが}く","p":"동사","m":"그리다","w":"어간 描는 한자, く는 히라가나예요.","n":"描く는 えがく와 かく 두 가지로 읽어요. 꿈이나 장면을 마음속에 그릴 때는 えがく를 많이 써요."},{"t":"{強|したた}かさ","p":"명사","m":"강인함, 끈질긴 억셈","b":"{強|したた}か","bm":"억세다, 만만치 않다","w":"強는 한자, か는 오쿠리가나, 명사를 만드는 さ는 히라가나예요.","n":"強か(したたか)는 쉽게 꺾이지 않는 억셈이에요. '영악하다, 만만치 않다'는 뉘앙스도 있어요. 같은 強를 つよい(強い)로 읽으면 그냥 '강하다'예요."},{"t":"も"}],"ko":"하지만 분에 넘치는 꿈을 똑바로 그려 내는 억척스러운 강함도","lit":"하지만 / 분에 넘치는 / 꿈 / 을 / 제대로 / 그리다 / 억셈 / 도","g":[{"k":"な형용사 + さ","d":"な형용사 어간에 さ를 붙여도 명사가 돼요. 強か → 強かさ(억셈), 穏やか → 穏やかさ(온화함)."}],"s":"같은 한자 強를 したたか로 읽는 특별한 쿤요미예요. 루비가 없으면 つよかさ로 잘못 읽기 쉬운 말이라, 가사집에도 꼭 읽기가 달려요.","c":"약점만 늘어놓다가 だけど(하지만)로 돌아서요. 재능은 없어도 큰 꿈을 그만두지 않는 끈질김만큼은 내 것이라는 말이에요."}]},{"label":"1절 · Aメロ","note":"남들의 발소리에 쫓기는 초조함, 그리고 '온리 원이면 된다'고 자신을 달래 보지만 잠들 수 없는 밤이에요.","lines":[{"id":"b1","tk":[{"t":"{焦|あせ}る","p":"동사","m":"초조하다, 조급해하다","w":"어간 焦는 한자, る는 히라가나예요.","n":"焦る = 마음이 급해 안절부절못하다. 같은 한자를 こげる(焦げる)로 읽으면 '타다, 눋다'예요. 마음이 타들어 가는 느낌이죠."},{"t":"よ"},{"t":"いつも","p":"부사","m":"언제나, 늘","w":"부사라 히라가나로 써요."}],"ko":"초조해, 언제나","lit":"초조하다 / 야 / 늘","s":"도입의 誇るよ全部와 같은 틀(동사 + よ + 한마디)이에요. '자랑한다'로 시작한 곡이 바로 '초조하다'로 뒤집혀요."},{"id":"b2","tk":[{"t":"{足|あし}{音|おと}","p":"명사","m":"발소리","w":"足(발)+音(소리) 두 한자로 된 고유어예요.","n":"音는 쿤요미 おと, 온요미 おん(音楽 おんがく)이에요."},{"t":"の"},{"t":"{群衆|ぐんしゅう}","p":"명사","m":"군중","n":"한국어 '군중(群衆)'과 같은 한자어예요. 宿命의 群青(군청)과 같은 群(무리 군)이에요."},{"t":"が"},{"t":"{僕|ぼく}"},{"t":"の"},{"t":"{努力|どりょく}","p":"명사","m":"노력","n":"한국어 '노력(努力)'과 같은 한자어예요."},{"t":"を"},{"t":"{引|ひ}き{裂|さ}いて","p":"동사","m":"갈기갈기 찢어","b":"{引|ひ}き{裂|さ}く","bm":"잡아 찢다","w":"引く(당기다)+裂く(찢다)의 복합동사예요. 어간은 한자, 활용 부분은 히라가나예요.","n":"く로 끝나는 동사의 て형은 いて예요. 裂く → 裂いて."}],"ko":"발소리 떼가 나의 노력을 갈기갈기 찢어 놓고","lit":"발소리 / 의 / 군중 / 이 / 나 / 의 / 노력 / 을 / 찢어","g":[{"k":"복합동사","d":"引く + 裂く → 引き裂く. 앞 동사를 ます형(引き)으로 바꿔 이어요."}],"c":"100m 달리기에서 옆과 뒤에서 들리는 수많은 발소리를 떠올리게 해요. 남들의 발소리가 '군중'처럼 몰려와 내가 쌓은 노력을 찢어 버린다는, 경쟁의 공포를 그린 표현이에요."},{"id":"b3","tk":[{"t":"{何度|なんど}","m":"몇 번이나"},{"t":"　"},{"t":"{君|きみ}"},{"t":"という","p":"조사(복합)","m":"~라는"},{"t":"{闇|やみ}","p":"명사","m":"어둠","n":"闇는 빛이 없는 깊은 어둠이에요. 마음의 어두운 면을 말할 때도 써요. 闇는 門(문) 안에 音(소리)이 든 글자예요."},{"t":"の"},{"t":"{世話|せわ}","p":"명사","m":"보살핌, 신세","n":"世話になる = 신세를 지다. お世話になります(신세 지겠습니다)는 일본에서 가장 많이 쓰는 인사말 중 하나예요."},{"t":"に"},{"t":"なったろう","p":"동사","m":"졌을까, 졌던가","b":"なる","bm":"되다","w":"なる(되다)는 기본 동사라 히라가나로 써요.","n":"なっただろう의 줄임말이에요. 〜たろう = '~했던가, ~했겠지'처럼 지난 일을 돌아보며 짐작하는 말투예요."}],"ko":"몇 번이나 너라는 어둠에 신세를 졌던가","lit":"몇 번 / 너 / 라는 / 어둠 / 의 / 신세 / 에 / 되었을까","g":[{"k":"〜の{世話|せわ}になる","d":"'~의 신세를 지다'. お世話になりました = 신세 많이 졌습니다."},{"k":"〜たろう","d":"〜ただろう의 줄임. 지난 일을 떠올리며 '~했던가' 하고 혼잣말할 때 써요."}],"c":"어둠(君)에 '신세를 졌다'는 말이 흥미로워요. 포기하라는 마음, 핑계를 대는 마음이 사실은 지친 나를 쉬게 해 준 피난처이기도 했다는 거예요."},{"id":"b4","tk":[{"t":"オンリーワン","p":"명사(외래어)","m":"온리 원, 유일한 존재","w":"영어 only one을 옮긴 외래어라 가타카나예요.","n":"일본에서는 SMAP의 노래로 유명해진 '넘버원보다 온리 원'이라는 말로 널리 쓰여요. 배경·문화 탭의 노트를 참고하세요."},{"t":"でも","p":"조사","m":"~라도","n":"여기서 でも는 접속사 '하지만'이 아니라 '~라도'라는 조사예요. オンリーワンでもいい = 온리 원이라도 괜찮아."},{"t":"いい","p":"い형용사","m":"좋다, 괜찮다","w":"良い로도 쓰지만 회화체 いい는 보통 히라가나로 써요."},{"t":"と","m":"~라고 (인용)"}],"ko":"온리 원이어도 괜찮다며","lit":"온리 원 / 이라도 / 괜찮다 / 라고","g":[{"k":"〜でもいい","d":"'~라도 괜찮다'. 明日でもいい(내일이라도 괜찮아)."}],"c":"1등이 아니어도 저마다 특별하다는 위로의 말이에요. 하지만 다음 줄에서 그 말을 '억지로' 썼다고 해요. 위로가 진짜 마음을 덮지 못했다는 고백이에요."},{"id":"b5","tk":[{"t":"{無理|むり}やり","p":"부사","m":"억지로","b":"{無理|むり}やり","w":"無理(무리)는 한자, やり는 히라가나예요. 원래 無理遣り로 쓰지만 遣는 보통 히라가나로 풀어요.","n":"無理는 한국어 '무리(無理)'와 같은 한자어예요. 無理やり = 무리하게, 억지로."},{"t":"つけた","p":"동사","m":"(몸에) 쓴, 붙인","b":"つける","bm":"붙이다, 몸에 걸치다","w":"한자 付ける·着ける가 있지만 히라가나로 썼어요. 뜻에 따라 한자가 갈리는 말이라 히라가나로 두는 경우가 많아요."},{"t":"アイマスク","p":"명사(외래어)","m":"안대, 수면용 눈가리개","w":"eye + mask를 이어 일본에서 만든 외래어라 가타카나예요.","n":"영어로는 보통 sleep mask라고 해서, 일본식 영어(和製英語)로 볼 수 있어요."},{"t":"の"}],"ko":"억지로 쓴 안대","lit":"억지로 / 쓴 / 안대 / 의","s":"가타카나 アイマスク는 영어처럼 보이지만 일본에서 만든 영어 조합이에요. 이런 말을 和製英語(わせいえいご, 일본식 영어)라고 해요."},{"id":"b6","tk":[{"t":"{奥|おく}","p":"명사","m":"안쪽, 속","n":"奥는 깊숙한 안쪽이에요. 宿命의 瞳の奥(눈동자 깊은 곳)에도 나왔어요."},{"t":"で","p":"조사","m":"~에서"},{"t":"{一睡|いっすい}","p":"명사","m":"한잠, 잠깐의 잠","n":"一(하나)+睡(잠). 一睡もしない = 한숨도 자지 않다. 睡는 睡眠(すいみん, 수면)의 睡예요."},{"t":"も","m":"~도 (부정 강조)"},{"t":"しやしない","p":"동사","m":"하지도 않는","b":"する","bm":"하다","w":"する(하다)는 히라가나로 써요.","n":"しはしない(하지는 않는다)가 소리 나는 대로 줄어든 회화체예요. '절대 ~하지 않는다'는 강한 부정이에요."},{"t":"{自分|じぶん}","p":"명사","m":"자기 자신, 나"},{"t":"も"},{"t":"{見|み}{飽|あ}きた","p":"동사","m":"보기에 질렸다","b":"{見|み}{飽|あ}きる","bm":"보기에 질리다","w":"見る(보다)+飽きる(질리다)의 복합동사예요. 어간은 한자, 활용 부분은 히라가나예요.","n":"동사 ます형 + 飽きる = '~하는 데 질리다'. 聞き飽きる(듣다가 질리다), 食べ飽きる(먹다가 질리다)."},{"t":"よ"}],"ko":"그 속에서 한숨도 못 자는 나 자신에게도 이젠 질렸어","lit":"속 / 에서 / 한잠 / 도 / 하지도 않는 / 자신 / 도 / 보기에 질렸다 / 야","g":[{"k":"{一睡|いっすい}もしない","d":"'한숨도 자지 않다'. 一 + も + 부정 = 하나도 ~않다."},{"k":"〜やしない","d":"〜はしない의 회화체. 行きやしない(가지도 않아)처럼 강하게 부정할 때 써요."}],"c":"'온리 원이면 됐어'라는 위로를 안대처럼 쓰고 눈을 감아 봐도 잠들지 못해요. 진짜로는 1등을 원한다는 마음이 계속 깨어 있어서죠. 그런 자신을 보는 것도 지겹다는 솔직한 말이에요."}]},{"label":"1절 · Bメロ","note":"남들의 냉정한 평가와, 그래도 납득하지 못하는 나의 반발이 〜的(~적)의 리듬으로 부딪혀요.","lines":[{"id":"c1","tk":[{"t":"「"},{"t":"{現実的|げんじつてき}","p":"な형용사","m":"현실적","w":"現実(현실) + 的(~적)의 한자어예요.","n":"〜的는 한국어 '~적'과 같은 한자예요. 現実的 = 현실적, 客観的 = 객관적."},{"t":"、"},{"t":"{客観的|きゃっかんてき}に","p":"な형용사","m":"객관적으로","b":"{客観的|きゃっかんてき}","bm":"객관적","w":"한자어 客観的는 한자, 부사로 만드는 に는 히라가나예요.","n":"観은 觀의 일본식 약자예요. きゃく+かん이 이어지며 きゃっかん으로 소쿠온이 생겼어요."},{"t":"{見|み}れば","p":"동사","m":"보면","b":"{見|み}る","bm":"보다","w":"어간 見는 한자, れば는 히라가나예요."},{"t":"　"},{"t":"{絶望的|ぜつぼうてき}","p":"な형용사","m":"절망적","n":"한국어 '절망적(絶望的)'과 같은 한자어예요."},{"t":"。"}],"ko":"“현실적으로, 객관적으로 보면 절망적이야.","lit":"현실적 / , / 객관적으로 / 보면 / 절망적","g":[{"k":"〜{的|てき}","d":"명사 + 的 = '~적'. な형용사처럼 써서 的な(~적인), 的に(~적으로)로 활용해요."},{"k":"1단동사 ば형","d":"見る → 見れば(보면). る를 떼고 れば를 붙여요."}],"s":"「」로 시작해 다음 줄까지 이어지는 인용이에요. 남이 하는 말, 혹은 머릿속의 냉정한 목소리를 따옴표로 따로 떼어 놓았어요."},{"id":"c2","tk":[{"t":"{絶対的|ぜったいてき}","p":"な형용사","m":"절대적인","n":"한국어 '절대적(絶対的)'과 같은 한자어예요."},{"t":"{1位|いちい}","p":"명사","m":"1위, 1등","w":"숫자는 아라비아 숫자로, 位는 한자로 썼어요. 가로쓰기에서는 숫자를 아라비아 숫자로 쓰는 게 보통이에요.","n":"1位 = いちい. 2位(にい), 3位(さんい)."},{"t":"は"},{"t":"きっと","p":"부사","m":"분명히, 틀림없이","w":"부사라 히라가나로 써요."},{"t":"{取|と}れない","p":"동사","m":"딸 수 없다","b":"{取|と}る","bm":"잡다, 따다","w":"어간 取는 한자, れない는 히라가나예요.","n":"取る → 取れる(딸 수 있다) → 取れない(딸 수 없다). 1位を取る = 1위를 하다."},{"t":"な"},{"t":"」"}],"ko":"절대적인 1등은 분명 못 하겠지”","lit":"절대적 / 1위 / 는 / 분명 / 딸 수 없다 / 겠지","g":[{"k":"가능형 + ない","d":"取る → 取れる → 取れない(할 수 없다). 5단 동사의 끝을 え단으로 바꾸고 る를 붙이면 가능형이에요."}],"c":"100m 달리기에서 '절대적 1위'는 세상에 단 한 명뿐이에요. 현실적·객관적·절망적·절대적으로 〜的를 네 번 쌓아 반박할 수 없는 판정처럼 들리게 해요."},{"id":"c3","tk":[{"t":"{分|わ}かってる"}],"ko":"알아","lit":"알고 있다","s":"分かってる 한 단어만 한 줄을 차지해요. 다음 줄 分かっちゃいるんだけど와 함께, 인정하면서도 받아들이지 못하는 마음을 짧게 끊어 보여 줘요."},{"id":"c4","tk":[{"t":"{分|わ}かっちゃいる"},{"t":"んだ"},{"t":"けど"}],"ko":"알고는 있지만","lit":"알고는 있다 / 인 거다 / 지만","g":[{"k":"〜ちゃ (= 〜ては)","d":"〜ては가 회화에서 〜ちゃ로 줄어요. 分かってはいる → 分かっちゃいる(알고는 있다)."}]},{"id":"c5","tk":[{"t":"{圧倒的|あっとうてき}","p":"な형용사","m":"압도적","n":"한국어 '압도적(壓倒的)'과 같은 한자어예요. 圧는 壓의 일본식 약자예요."},{"t":"、"},{"t":"{直感的|ちょっかんてき}に","p":"な형용사","m":"직감적으로","b":"{直感的|ちょっかんてき}","bm":"직감적","w":"한자어 直感的는 한자, 부사로 만드는 に는 히라가나예요."},{"t":"{僕|ぼく}"},{"t":"は"},{"t":"　"},{"t":"{納得|なっとく}","p":"명사","m":"납득","n":"한국어 '납득(納得)'과 같은 한자어예요. 納得する = 납득하다."},{"t":"{出|で}{来|き}ちゃいない","p":"동사","m":"할 수는 없다","b":"{出|で}{来|き}る","bm":"할 수 있다","w":"できる는 보통 히라가나로 쓰는데, 여기서는 한자 出来를 썼어요.","n":"出来てはいない의 회화체예요(〜ては → 〜ちゃ). 納得出来ちゃいない = 납득은 못 하고 있어."}],"ko":"압도적으로, 직감적으로 나는 납득이 안 돼","lit":"압도적 / , / 직감적으로 / 나 / 는 / 납득 / 할 수는 없다","g":[{"k":"한자어 + {出来|でき}る","d":"한자어 명사 + できる = '~할 수 있다'. 納得できる(납득할 수 있다), 理解できる(이해할 수 있다)."}],"s":"c1의 現実的、客観的과 같은 자리에 圧倒的、直感的가 왔어요. 냉정한 〜的 두 개에 뜨거운 〜的 두 개로 맞받아치는 구조예요.","c":"머리로는 알지만(分かってる), 몸과 직감은 '압도적으로' 받아들이지 못해요. 논리로는 지는데 마음으로는 지지 않는 상태예요."},{"id":"c6","tk":[{"t":"ああ"},{"t":"　"},{"t":"なんで","p":"부사","m":"왜, 어째서","b":"{何|なん}で","w":"何で를 히라가나로 풀어 썼어요. 회화체에서는 히라가나 なんで가 더 흔해요.","n":"なんで는 どうして(왜)보다 편한 말투예요."},{"t":"こんなにも","p":"부사","m":"이렇게나","w":"지시어 こんな에서 나온 말이라 히라가나로 써요.","n":"こんなに(이렇게) + も(강조) = 이렇게나."},{"t":"{面倒|めんどう}","p":"な형용사","m":"귀찮음, 성가심","n":"面倒くさい(めんどくさい) = 귀찮다. 회화에서 아주 자주 써요."},{"t":"で","p":"조동사","m":"~하고 (나열)","n":"な형용사 + で = '~하고'. 面倒で不適合な = 성가시고 부적합한."}],"ko":"아, 왜 이렇게나 성가시고","lit":"아 / 왜 / 이렇게나 / 성가심 / 이고","g":[{"k":"な형용사 + で","d":"な형용사를 이어 나열할 때 で를 써요. 静かできれいな部屋 = 조용하고 깨끗한 방."}]},{"id":"c7","tk":[{"t":"{不適合|ふてきごう}な","p":"な형용사","m":"들어맞지 않는, 부적합한","b":"{不適合|ふてきごう}","bm":"부적합","w":"한자어 不適合는 한자, 명사를 꾸미는 な는 히라가나예요.","n":"한국어 '부적합(不適合)'과 같은 한자어예요."},{"t":"{長所|ちょうしょ}","p":"명사","m":"장점","n":"長所(장점) ↔ 短所(단점). 한국어 '장소'가 아니라 '장점'이라는 뜻이라 헷갈리기 쉬워요."},{"t":"を"},{"t":"{宿|やど}して","p":"동사","m":"품어","b":"{宿|やど}す","bm":"품다, 깃들게 하다","w":"어간 宿는 한자, して는 히라가나예요.","n":"宿す = 안에 품다, 깃들게 하다. 宿命의 宿(깃들다)와 같은 한자예요."},{"t":"しまった","p":"보조동사","m":"~해 버렸다","b":"しまう","bm":"(완전히) ~해 버리다","w":"보조동사로 쓰일 때는 히라가나로 써요."},{"t":"んだろう","p":"조동사","m":"~인 걸까","n":"のだろう의 회화체예요. 이유를 모르겠다는 혼잣말 같은 질문이에요."}],"ko":"맞지도 않는 장점을 품고 말았을까","lit":"부적합한 / 장점 / 을 / 품어 / 버렸다 / 는 걸까","g":[{"k":"なんで〜んだろう","d":"'왜 ~한 걸까'. 답을 바라기보다 스스로에게 묻는 말투예요."}],"c":"'부적합한 장점'은 서로 어긋나는 말이에요. 지기 싫어하는 마음이나 큰 꿈을 버리지 못하는 끈질김은 장점이지만, 재능 없는 나에게는 오히려 나를 괴롭히는 성질이라는 뜻으로 읽혀요. 宿す의 宿는 宿命의 宿와 같은 한자라, 타고난 성질이라는 느낌도 겹쳐요."}]},{"label":"サビ · 후렴","note":"'나다움'이라는 짐을 안고 울고 웃으며 경쟁하는 사람들의 노래예요. 괄호 속 가사는 마음속 목소리처럼 들려요.","lines":[{"id":"d1","tk":[{"t":"らしさ"},{"t":"　"},{"t":"そんな"},{"t":"もの"},{"t":"を"},{"t":"{抱|かか}えて"},{"t":"は","m":"~고는 (반복)","n":"〜ては = '~하고는 (또 ~하다)'. 같은 일이 되풀이되는 모습을 나타내요."}],"ko":"'나다움', 그런 걸 끌어안고는","lit":"~다움 / 그런 / 것 / 을 / 안고 / 는","g":[{"k":"〜ては","d":"동사 て형 + は = '~하고는'. 뒤에 같은 일이 반복된다는 뜻이 이어져요. 抱えては泣いた = 안고는 울곤 했다."}],"s":"제목 らしさ가 히라가나 세 글자로 후렴 첫머리에 놓여요. 한자 없이 소리만 있는 말이라 더 가볍게 들리지만, 바로 뒤에 そんなもの(그런 것)라고 낮춰 부르며 무게를 더해요.","c":"らしさ를 そんなもの(그런 것)라고 부르는 데서 애증이 느껴져요. 나다움은 자랑이면서 동시에 떠안고 다니는 짐이에요."},{"id":"d2","tk":[{"t":"{僕|ぼく}ら"},{"t":"は"},{"t":"{泣|な}いてた"},{"t":"　"},{"t":"{笑|わら}ってた"}],"ko":"우리는 울고, 웃었어","lit":"우리 / 는 / 울었다 / 웃었다","g":[{"k":"〜てた (= 〜ていた)","d":"'~하고 있었다, ~하곤 했다'. 회화에서는 い가 빠져 泣いてた, 笑ってた가 돼요."}]},{"id":"d3","tk":[{"t":"{競|きそ}い{合|あ}った"},{"t":"まま"}],"ko":"서로 겨루면서","lit":"서로 겨룬 / 채","g":[{"k":"〜たまま","d":"동사 과거형 + まま = '~한 채로'. 競い合ったまま = 서로 겨룬 채로(경쟁을 멈추지 않고)."}],"c":"울고 웃는 동안에도 경쟁은 멈추지 않아요. 친구이자 라이벌인 관계, 그리고 나와 내 안의 君가 계속 겨루는 관계로도 읽혀요."},{"id":"d4","tk":[{"t":"{大好|だいす}きな"},{"t":"{事|こと}"},{"t":"に"},{"t":"{全|すべ}て"},{"t":"{捧|ささ}げて"},{"t":"は","m":"~고는 (반복)"}],"ko":"정말 좋아하는 일에 모든 걸 바치고는","lit":"아주 좋아하는 / 일 / 에 / 모두 / 바치고 / 는","s":"事를 한자로, 捧げる를 조요칸지 밖의 한자로 썼어요. 평소라면 こと, ささげる로 풀어 쓸 말들을 한자로 굳혀서, '좋아하는 일에 전부 바친다'는 다짐이 무겁게 보여요."},{"id":"d5","tk":[{"t":"{何度|なんど}"},{"t":"も","m":"~이고, ~이나 (강조)"},{"t":"{泣|な}く"},{"t":"んだ"},{"t":"　"},{"t":"{笑|わら}う"},{"t":"んだ"}],"ko":"몇 번이고 우는 거야, 웃는 거야","lit":"몇 번 / 이고 / 운다 / 는 거야 / 웃는다 / 는 거야","g":[{"k":"〜んだ","d":"のだ의 회화체로 '~하는 거야'. 사실을 힘주어 말하거나 결심을 밝힐 때 써요."}],"c":"d2는 泣いてた·笑ってた(과거), 이 줄은 泣くんだ·笑うんだ(현재)예요. 지난 일이 아니라 앞으로도 계속 그렇게 살겠다는 뜻으로 바뀌어요."},{"id":"d6","tk":[{"t":"メチャクチャな","p":"な형용사","m":"엉망진창인, 터무니없는","b":"メチャクチャ","bm":"엉망진창","w":"한자로는 滅茶苦茶라고 쓰지만, 소리만 빌린 当て字라 보통 가타카나나 히라가나로 써요. 가타카나로 쓰면 말투가 세고 강조돼요.","n":"メチャクチャ는 '엉망진창'과 '굉장히'라는 뜻이 다 있어요. めちゃくちゃ美味しい = 엄청 맛있다. 줄여서 めっちゃ라고도 해요."},{"t":"ペース","p":"명사(외래어)","m":"페이스, 속도","w":"영어 pace를 옮긴 외래어라 가타카나예요."},{"t":"で","p":"조사","m":"~으로 (방식)"}],"ko":"엉망진창인 페이스로","lit":"엉망진창인 / 페이스 / 로","s":"가타카나가 두 개 이어져요. ペース는 외래어라서, メチャクチャ는 강조하려고 가타카나로 썼어요. 같은 가타카나라도 이유가 달라요.","c":"달리기에서 페이스는 계획대로 지키는 게 기본이에요. '엉망진창인 페이스'는 계산 없이 좋아하는 일에 전력으로 뛰어드는 모습이에요."},{"id":"d7","tk":[{"t":"（"},{"t":"これ","p":"대명사","m":"이것","w":"지시어라 히라가나로 써요."},{"t":"しか","p":"조사","m":"~밖에","n":"しか + 부정 = '~밖에 없다'. これしかない = 이것밖에 없다."},{"t":"ない","p":"い형용사","m":"없다","w":"'없다'는 보통 히라가나로 써요."},{"t":"から"},{"t":"）"}],"ko":"(이것밖에 없으니까)","lit":"이것 / 밖에 / 없다 / 니까","g":[{"k":"〜しか〜ない","d":"'~밖에 ~않다'. 한국어 '~밖에 없다'와 똑같이 뒤에 부정이 와요."}],"s":"괄호로 묶인 세 줄은 노래에서 다른 목소리로 겹쳐 불러요. 겉으로 하는 말 아래에 깔린 속마음처럼 들려요."},{"id":"d8","tk":[{"t":"（"},{"t":"しがみついてたかった","p":"동사","m":"매달려 있고 싶었다","b":"しがみつく","bm":"매달리다, 달라붙다","w":"한자 없이 히라가나로만 쓰는 동사예요.","n":"しがみつく = 놓치지 않으려고 꽉 매달리다. しがみついていたかった에서 い가 빠졌어요. 〜ていたい(~하고 있고 싶다)의 과거형이에요."},{"t":"んだ"},{"t":"）"}],"ko":"(매달려 있고 싶었어)","lit":"매달려 있고 싶었다 / 는 거야","g":[{"k":"〜ていたかった","d":"〜ている(~하고 있다) + たい(~하고 싶다)의 과거. '~하고 있고 싶었다'."}]},{"id":"d9","tk":[{"t":"（"},{"t":"{居場所|いばしょ}","p":"명사","m":"있을 곳, 내 자리","n":"居(있다)+場所(장소). 몸이 있을 곳이라는 뜻을 넘어 '마음 편히 있을 수 있는 곳, 나를 받아 주는 곳'이라는 뜻으로 많이 써요."},{"t":"が"},{"t":"{欲|ほ}しかった","p":"い형용사","m":"갖고 싶었다, 필요했다","b":"{欲|ほ}しい","bm":"갖고 싶다","w":"어간 欲는 한자, しかった는 히라가나예요.","n":"〜が欲しい = ~을 갖고 싶다. 대상에 が를 써요."},{"t":"んだ"},{"t":"）"}],"ko":"(있을 곳이 필요했어)","lit":"있을 곳 / 이 / 갖고 싶었다 / 는 거야","g":[{"k":"〜が{欲|ほ}しい","d":"'~을 갖고 싶다, ~이 필요하다'. 好き처럼 대상에 が를 써요."}],"c":"居場所는 일본 사회에서 중요하게 쓰이는 말이에요. 학교나 직장에서 '내 자리가 없다(居場所がない)'는 고민은 흔한 이야기예요. 좋아하는 일이 곧 나의 居場所였다는 고백이에요."}]},{"label":"2절 · Aメロ","note":"이겨도 괴롭고, 지면 추억이 발목을 잡아요. 경쟁하는 사람의 솔직한 짜증이 회화체로 터져 나와요.","lines":[{"id":"e1","tk":[{"t":"{何度|なんど}"},{"t":"{勝|か}っても","p":"동사","m":"이겨도","b":"{勝|か}つ","bm":"이기다","w":"어간 勝는 한자, っても는 히라가나예요.","n":"つ로 끝나는 동사의 て형은 って예요. 勝つ → 勝って → 勝っても(이겨도)."},{"t":"　"},{"t":"それ","p":"대명사","m":"그것","w":"지시어라 히라가나로 써요."},{"t":"は"},{"t":"それ","p":"대명사","m":"그것","w":"지시어라 히라가나로 써요."},{"t":"で","p":"조사","m":"~대로","n":"それはそれで = '그건 그것대로'. 굳어진 관용 표현이에요."},{"t":"{未来|みらい}","p":"명사","m":"미래"},{"t":"は"},{"t":"{苦|くる}しい","p":"い형용사","m":"괴롭다","w":"어간 苦는 한자, しい는 히라가나예요."},{"t":"もの","m":"~인 법 (일반적인 사실)","n":"문장 끝의 もの는 '원래 그런 법이다'라는 일반론을 나타내요."}],"ko":"몇 번을 이겨도, 그건 그것대로 미래는 괴로운 법","lit":"몇 번 / 이겨도 / 그건 그것대로 / 미래 / 는 / 괴롭다 / 법","g":[{"k":"〜ても","d":"'~해도'. 何度勝っても = 몇 번을 이겨도."},{"k":"문장 + もの","d":"'원래 ~한 법이야'. 人生は苦しいもの = 인생은 괴로운 법."},{"k":"それはそれで","d":"'그건 그것대로 (또 다른 사정이 있다)'. 좋은 일에도 따로 따르는 문제가 있을 때 써요."}],"c":"이기면 끝나는 게 아니라, 다음에도 이겨야 하는 부담이 생겨요. 1등을 지켜야 하는 사람의 괴로움까지 말하는 줄이에요."},{"id":"e2","tk":[{"t":"ああ"},{"t":"　"},{"t":"まじで","p":"부사(속어)","m":"진짜로, 정말","b":"まじで","w":"속어라서 히라가나로 썼어요. 한자로 本気で(ほんきで)라고 쓰고 マジ로 읽게 하는 가사도 있어요.","n":"まじ는 '진심, 진짜'라는 뜻의 속어예요. まじで?(진짜?)처럼 친구끼리 아주 많이 써요. 윗사람에게는 쓰지 않아요."},{"t":"なんなの","p":"표현","m":"뭐야, 뭔데","b":"{何|なん}なの","w":"何なの를 히라가나로 풀어 쓴 회화체예요.","n":"何(なん) + なの(= なのだ의 의문형). 짜증이나 황당함을 담아 '대체 뭐야'라고 할 때 써요."},{"t":"？"}],"ko":"아, 진짜 뭐냐고?","lit":"아 / 진짜로 / 뭐야?","s":"まじで·なんなの 모두 히라가나 속어예요. 한자를 쓰지 않아서 혼잣말로 툭 내뱉는 짜증이 그대로 느껴져요.","c":"응원가에서 잘 쓰지 않는 거친 말투가 갑자기 나와요. 꾸미지 않은 감정을 그대로 노래에 담는 게 이 곡의 매력이에요."},{"id":"e3","tk":[{"t":"{負|ま}けて"},{"t":"{負|ま}けて"},{"t":"{負|ま}けまくった","p":"동사","m":"계속 져 댔다","b":"{負|ま}ける","bm":"지다","w":"어간 負는 한자, 나머지는 히라가나예요.","n":"동사 ます형 + まくる = '마구 ~해 대다'. 負けまくる = 계속 지다, 食べまくる = 마구 먹어 대다. 회화체예요."},{"t":"{時|とき}","p":"명사","m":"때","n":"時는 쿤요미 とき, 온요미 じ(時間 じかん, 시간)예요."},{"t":"ほど","p":"조사","m":"~일수록","n":"〜ほど = '~일수록, ~만큼'. 負けた時ほど = 졌을 때일수록."}],"ko":"지고 지고 또 지기만 할 때일수록","lit":"져서 / 져서 / 계속 져 댔다 / 때 / 일수록","g":[{"k":"〜まくる","d":"동사 ます형 + まくる = '마구 ~해 대다'. 말하는 사람의 감정이 실린 회화체예요."},{"k":"〜ほど","d":"'~일수록'. 考えるほど分からない = 생각할수록 모르겠다."}],"s":"負け가 세 번 겹쳐요. 같은 한자를 반복해 지고 또 지는 시간을 눈으로도 보여 줘요."},{"id":"e4","tk":[{"t":"{思|おも}い{出|で}{話|ばなし}","p":"명사","m":"추억담, 옛날이야기","w":"思い出(추억)+話(이야기)의 합성어예요. 한자 세 개에 히라가나가 사이사이 끼어 있어요.","n":"話(はなし)가 뒤에 붙으며 ばなし로 탁해졌어요(렌다쿠). 昔話(むかしばなし, 옛날이야기)도 같아요."},{"t":"が"},{"t":"{僕|ぼく}"},{"t":"の"},{"t":"{歩|あゆ}み","p":"명사","m":"걸음, 발걸음","b":"{歩|あゆ}み","w":"동사 歩む(걷다)에서 나온 명사라 한자 歩 뒤에 오쿠리가나 み가 붙어요.","n":"歩み는 한 걸음 한 걸음 나아가는 것, 그리고 '지금까지 걸어온 길'이라는 뜻도 있어요. 같은 한자를 あるく(歩く)로 읽으면 그냥 '걷다'예요."},{"t":"を"},{"t":"{遅|おそ}めて","p":"동사","m":"늦추어","b":"{遅|おそ}める","bm":"늦추다","w":"어간 遅는 한자, めて는 히라가나예요.","n":"'늦추다'는 보통 遅らせる(おくらせる)라고 해요. 遅める도 사전에 있는 말이지만 잘 쓰지 않아서 노래다운 느낌이 나요."},{"t":"しまう","p":"보조동사","m":"~해 버리다","w":"보조동사로 쓰일 때는 히라가나로 써요."},{"t":"よ"}],"ko":"추억 이야기가 내 발걸음을 늦춰 버려","lit":"추억담 / 이 / 나 / 의 / 걸음 / 을 / 늦춰 / 버리다 / 야","c":"질 때일수록 '그때가 좋았지' 하는 추억이 떠올라 앞으로 나아가지 못하게 해요. 달리기 작품답게 '걸음'을 늦춘다고 표현했어요."},{"id":"e5","tk":[{"t":"{過去|かこ}","p":"명사","m":"과거","n":"한국어 '과거(過去)'와 같은 한자어예요."},{"t":"の"},{"t":"{僕|ぼく}"},{"t":"と"},{"t":"{君|きみ}"},{"t":"から","p":"조사","m":"~에게서, ~로부터"},{"t":"の"},{"t":"{最低|さいてい}","p":"명사","m":"최악, 형편없음","w":"한자어라 한자로 써요.","n":"글자는 한국어 '최저'와 같지만, 일본어 最低는 회화에서 '최악, 형편없다'는 뜻으로 많이 써요. 最低な人 = 최악인 사람."},{"t":"の"},{"t":"プレゼント","p":"명사(외래어)","m":"선물","w":"영어 present를 옮긴 외래어라 가타카나예요.","n":"고유어로는 贈り物(おくりもの)라고 해요."}],"ko":"과거의 나와 너에게서 받은 최악의 선물","lit":"과거 / 의 / 나 / 와 / 너 / 로부터 / 의 / 최악 / 의 / 선물","g":[{"k":"〜からの + 명사","d":"'~로부터의 (명사)'. 君からの手紙 = 너에게서 온 편지."}],"c":"앞 줄의 '추억 이야기'를 과거의 나와 君(어두운 나)가 준 '최악의 선물'이라고 불러요. 반짝이는 포장의 선물인 줄 알았는데 열어 보니 발목을 잡는 짐이었다는 비유예요."}]},{"label":"2절 · Bメロ","note":"나를 지키는 '반창고'와, 그 밑에서 불어 버린 '새것 그대로의 자존심'. 몸의 감각으로 마음을 그려요.","lines":[{"id":"f1","tk":[{"t":"{打算的|ださんてき}","p":"な형용사","m":"타산적","n":"한국어 '타산적(打算的)'과 같은 한자어예요. 손해와 이익을 따지는 성격이에요."},{"t":"で","p":"조동사","m":"~이고"},{"t":"{消極的|しょうきょくてき}な","p":"な형용사","m":"소극적인","b":"{消極的|しょうきょくてき}","bm":"소극적","w":"한자어 消極的는 한자, 꾸미는 な는 히라가나예요.","n":"한국어 '소극적(消極的)'과 같은 한자어예요. 반대말은 積極的(せっきょくてき, 적극적)."},{"t":"{面|めん}","p":"명사","m":"면, 측면","n":"面은 온요미 めん(측면), 쿤요미 おもて·つら(얼굴)로도 읽어요. 한국어 '면(面)'과 같은 한자예요."},{"t":"は"},{"t":"　"},{"t":"{僕|ぼく}"},{"t":"を"},{"t":"{守|まも}る","p":"동사","m":"지키는","w":"어간 守는 한자, る는 히라가나예요."},{"t":"{絆創膏|ばんそうこう}","p":"명사","m":"반창고","n":"한국어 '반창고'와 같은 말이에요. 絆는 きずな로 읽으면 '끈끈한 인연'이라는 뜻이 돼요."}],"ko":"타산적이고 소극적인 면은 나를 지키는 반창고","lit":"타산적 / 이고 / 소극적인 / 면 / 은 / 나 / 를 / 지키다 / 반창고","g":[{"k":"AでBな + 명사","d":"な형용사를 이어 꾸밀 때: 打算的で消極的な面 = 타산적이고 소극적인 면."}],"c":"손익을 따지고 몸을 사리는 성격을 상처를 덮는 반창고에 빗댔어요. 상처받지 않게 지켜 주지만, 계속 붙이고 있으면 그 밑의 살이 약해지죠. 그 이야기가 이어지는 두 줄에서 펼쳐져요."},{"id":"f2","tk":[{"t":"{怖|こわ}くて","p":"い형용사","m":"무서워서","b":"{怖|こわ}い","bm":"무섭다","w":"어간 怖는 한자, くて는 히라가나예요.","n":"い형용사의 て형은 い를 くて로 바꿔요. 怖い → 怖くて(무서워서)."},{"t":"きっと","p":"부사","m":"분명, 아마 틀림없이","w":"부사라 히라가나로 써요."},{"t":"{剥|は}げない","p":"동사","m":"뗄 수 없다","b":"{剥|は}ぐ","bm":"벗기다, 떼어 내다","w":"어간 剥는 한자, げない는 히라가나예요.","n":"剥ぐ(떼다) → 剥げる(뗄 수 있다) → 剥げない(뗄 수 없다). 반창고를 떼는 것을 剥がす(はがす)라고도 해요."},{"t":"な"}],"ko":"무서워서 분명 못 떼겠지","lit":"무서워서 / 분명 / 뗄 수 없다 / 겠지","g":[{"k":"い형용사 + くて","d":"'~해서'(이유) 또는 '~하고'(나열). 怖くて剥げない = 무서워서 뗄 수 없다."}],"c":"반창고를 떼면 상처가 드러날까 봐 무서워요. 몸을 사리는 성격을 버리지 못하는 이유가 바로 '두려움'이라는 고백이에요."},{"same":"c3"},{"same":"c4"},{"id":"f3","tk":[{"t":"プライド","p":"명사(외래어)","m":"자존심, 자부심","w":"영어 pride를 옮긴 외래어라 가타카나예요.","n":"일본어에서 プライド는 '자존심'이라는 뜻으로 많이 써요. プライドが高い = 자존심이 세다."},{"t":"は"},{"t":"{新品|しんぴん}","p":"명사","m":"새것, 신품","n":"한국어 '신품(新品)'과 같은 한자어예요. 쓰지 않은 새 물건이에요."},{"t":"の"},{"t":"まま"},{"t":"で","p":"조사","m":"~으로 (상태)"},{"t":"{白|しろ}く","p":"い형용사","m":"하얗게","b":"{白|しろ}い","bm":"하얗다","w":"어간 白는 한자, く는 히라가나예요."},{"t":"ふやけ","p":"동사","m":"(물에) 불어","b":"ふやける","bm":"(물에 젖어) 불다","w":"한자가 거의 쓰이지 않는 동사라 히라가나로 써요.","n":"ふやける = 물에 오래 젖어 하얗게 붓다. 목욕을 오래 하면 손가락이 ふやける라고 해요. ます형(ふやけ)으로 다음 말과 이었어요."},{"t":"{痒|かゆ}がっている","p":"동사","m":"가려워하고 있다","b":"{痒|かゆ}がる","bm":"가려워하다","w":"痒는 조요칸지에 없는 글자라 보통 かゆい로 풀어 쓰는데, 한자로 써서 근질거리는 감각을 눈에 보이게 했어요.","n":"痒い(かゆい, 가렵다) + がる = '가려워하다'. 〜がる는 '~해하다'처럼 겉으로 드러나는 감정을 나타내요(欲しがる, 怖がる)."}],"ko":"자존심은 새것 그대로 하얗게 불어서 근질거리고 있어","lit":"자존심 / 은 / 새것 / 의 / 그대로 / 로 / 하얗게 / 불어 / 가려워하고 있다","g":[{"k":"〜のままで","d":"'~인 채로'. 新品のままで = 새것인 채로(한 번도 쓰지 않고)."},{"k":"い형용사 + がる","d":"い를 떼고 がる를 붙이면 '~해하다'. 痒い → 痒がる, 怖い → 怖がる."}],"s":"가타카나 プライド, 한자 新品·白·痒, 히라가나 ふやけ가 섞여 있어요. 痒라는 어려운 한자를 일부러 써서 '근질거림'이 눈에 걸리게 해요.","c":"반창고(f1) 밑에 오래 가려 둔 살이 하얗게 불어 근질거리는 모습이에요. 한 번도 써 보지 않은 자존심이 상처받을까 봐 가려만 두다가, 오히려 근질근질 견딜 수 없어졌다는 비유예요."},{"id":"f4","tk":[{"t":"ああ"},{"t":"　"},{"t":"どちら"},{"t":"も","m":"~도 (どちらも = 둘 다)"},{"t":"{僕|ぼく}"},{"t":"で","p":"조동사","m":"~이고"},{"t":"{君|きみ}"},{"t":"だ"},{"t":"から"}],"ko":"아, 어느 쪽이든 나이고 너니까","lit":"아 / 어느 쪽 / 도 / 나 / 이고 / 너 / 이다 / 니까","c":"몸을 사리는 나(반창고)도, 지기 싫은 나(자존심)도 결국 둘 다 나이고 君(어두운 나)라는 말이에요. 곡의 처음 君という僕(너라는 나)과 이어져요."},{"id":"f5","tk":[{"t":"どちら"},{"t":"も"},{"t":"{本心|ほんしん}","p":"명사","m":"본심, 진심","n":"한국어 '본심(本心)'과 같은 한자어예요."},{"t":"だ"},{"t":"から"},{"t":"たち","p":"명사","m":"성질, 됨됨이","b":"{質|たち}","bm":"성질","w":"성질을 뜻하는 たち는 한자 質·性로도 쓰지만 보통 히라가나로 써요.","n":"복수를 만드는 〜たち(私たち의 たち)와는 다른 말이에요. たちが悪い = 성질이 고약하다, 골치 아프다."},{"t":"が"},{"t":"{悪|わる}い","p":"い형용사","m":"나쁘다","w":"어간 悪는 한자, い는 오쿠리가나예요."},{"t":"よな","p":"조사(종조사)","m":"~잖아, ~구나","n":"よ + な. 스스로 수긍하는 혼잣말이에요."}],"ko":"둘 다 진심이니까 골치 아프다니까","lit":"어느 쪽 / 도 / 본심 / 이다 / 니까 / 성질 / 이 / 나쁘다 / 잖아","g":[{"k":"たちが{悪|わる}い","d":"'성질이 고약하다, 골치 아프다'. 사람이나 일이 다루기 어려울 때 써요. たちの悪い冗談 = 고약한 농담."}],"s":"히라가나 たち 하나가 두 가지 말이 될 수 있어요. 私たち의 たち(~들)와 여기의 たち(성질)는 전혀 다른 말이라 문맥으로 구별해요."}]},{"label":"Cメロ · 브리지","note":"따옴표 속 네 마디는 포기하라고 속삭이는 목소리들이에요. 모두 그럴듯한 핑계라서 더 무섭게 들려요.","lines":[{"id":"g1","tk":[{"t":"「"},{"t":"{始|はじ}めた","p":"동사","m":"시작한","b":"{始|はじ}める","bm":"시작하다","w":"어간 始는 한자, めた는 히라가나예요.","n":"始める(시작하다, 타동사) ↔ 始まる(시작되다, 자동사). Pretender에는 始まる가 나왔어요."},{"t":"の","p":"조사","m":"~것 (명사로 만듦)","n":"문장 + の = '~한 것'. 始めたのが遅い = 시작한 것이 늦다."},{"t":"が"},{"t":"{遅|おそ}い","p":"い형용사","m":"늦다, 느리다","w":"어간 遅는 한자, い는 오쿠리가나예요."},{"t":"から"},{"t":"」"}],"ko":"“시작한 게 늦었으니까”","lit":"시작했다 / 것 / 이 / 늦다 / 니까","g":[{"k":"문장 + の + が","d":"の를 붙여 문장을 명사처럼 써요. 走るのが好き = 달리는 게 좋아."}]},{"id":"g2","tk":[{"t":"「"},{"t":"{世界|せかい}","p":"명사","m":"세계, 세상","n":"한국어 '세계(世界)'와 같은 한자어예요."},{"t":"は"},{"t":"あまりにも","p":"부사","m":"너무나도","w":"부사라 히라가나로 써요.","n":"あまり(너무) + にも(강조). あまりにも広い = 너무나 넓다. あまり + 부정은 '별로 ~않다'라서 뜻이 달라요."},{"t":"{広|ひろ}い","p":"い형용사","m":"넓다","w":"어간 広는 한자, い는 오쿠리가나예요."},{"t":"から"},{"t":"」"}],"ko":"“세상은 너무나도 넓으니까”","lit":"세계 / 는 / 너무나도 / 넓다 / 니까","g":[{"k":"あまりにも","d":"'너무나도'. 정도가 지나칠 때 써요. あまりにも遠い = 너무나도 멀다."}],"c":"세상이 넓다는 건 나보다 빠른 사람이 어딘가에 반드시 있다는 뜻이에요. 사실이라서 반박하기 어려운 핑계예요."},{"id":"g3","tk":[{"t":"「"},{"t":"{天才|てんさい}","p":"명사","m":"천재","n":"한국어 '천재(天才)'와 같은 한자어예요."},{"t":"は"},{"t":"レベル","p":"명사(외래어)","m":"레벨, 수준","w":"영어 level을 옮긴 외래어라 가타카나예요."},{"t":"が"},{"t":"{違|ちが}う","p":"동사","m":"다르다","w":"어간 違는 한자, う는 히라가나예요."},{"t":"から"},{"t":"」"}],"ko":"“천재는 레벨이 다르니까”","lit":"천재 / 는 / 레벨 / 이 / 다르다 / 니까","g":[{"k":"AはBが〜","d":"'A는 B가 ~하다'. 天才はレベルが違う = 천재는 레벨이 달라. 큰 주제는 は, 그 안의 주어는 が."}]},{"id":"g4","tk":[{"t":"「"},{"t":"てか","p":"접속사(속어)","m":"근데, 그보다","w":"っていうか가 줄어든 속어라 히라가나로 써요.","n":"てか = '근데, 그게 아니라'. 말을 돌릴 때 젊은 층이 많이 쓰는 회화체예요."},{"t":"お{前|まえ}","p":"대명사","m":"너 (거친 말)","w":"높임의 お는 히라가나, 前는 한자예요.","n":"お前는 친한 사이나 손아랫사람에게 쓰는 거친 '너'예요. 君보다 훨씬 막 대하는 말투예요."},{"t":"が"},{"t":"{楽|たの}しけりゃ","p":"い형용사","m":"즐거우면","b":"{楽|たの}しい","bm":"즐겁다","w":"어간 楽는 한자, しけりゃ는 히라가나예요.","n":"楽しければ(즐거우면)가 줄어든 회화체예요. 〜ければ → 〜けりゃ."},{"t":"いい","p":"い형용사","m":"좋다, 됐다","w":"회화체 いい는 히라가나로 써요."},{"t":"じゃん","p":"조사(종조사)","m":"~잖아","n":"じゃない(~잖아)의 회화체예요. 원래 일부 지역의 사투리였는데 지금은 전국의 젊은 층이 써요."},{"t":"」"}],"ko":"“그보다 너만 즐거우면 됐잖아”","lit":"근데 / 너 / 가 / 즐거우면 / 좋다 / 잖아","g":[{"k":"〜ければ → 〜けりゃ","d":"い형용사 ば형의 회화체 줄임. 楽しければ → 楽しけりゃ, 早ければ → 早けりゃ."},{"k":"〜ばいいじゃん","d":"'~하면 되잖아'. 가볍게 권하거나 달래는 말투예요."}],"s":"앞의 세 마디는 차분한 이유(から)인데, 마지막은 てか·お前·けりゃ·じゃん으로 확 가벼운 회화체가 돼요. 다정한 척하며 포기를 권하는 목소리예요.","c":"'즐거우면 됐잖아'는 다정한 위로처럼 들려요. 하지만 이 곡에서는 1등을 원하는 마음을 접게 만드는 가장 달콤한 핑계예요. 그래서 다음 줄에서 '아, 시끄러워'라고 받아쳐요."}]},{"label":"Dメロ · 마지막 후렴 전","note":"핑계들에 '시끄러워'라고 맞서며, 결국 '누구에게도 지고 싶지 않다'는 진심을 꺼내요.","lines":[{"id":"h1","tk":[{"t":"ああ"},{"t":"　"},{"t":"うるさい","p":"い형용사","m":"시끄럽다, 성가시다","w":"한자 煩い로도 쓰지만 보통 히라가나로 써요.","n":"うるさい는 소리가 시끄러운 것 말고도 '잔소리 그만해, 귀찮게 하지 마'라는 짜증의 말로 많이 써요."},{"t":"な"},{"t":"　"},{"t":"それでも","p":"접속사","m":"그래도, 그런데도","w":"접속사라 히라가나로 써요."},{"t":"なんか","p":"부사","m":"왠지, 어쩐지","w":"何か가 줄어든 회화체라 히라가나로 써요.","n":"なんか는 '왠지', '뭔가', '~따위' 등 뜻이 여러 가지예요. 여기서는 '왠지'."}],"ko":"아, 시끄러워. 그래도 왠지","lit":"아 / 시끄럽다 / 네 / 그래도 / 왠지","c":"Cメロ의 네 가지 핑계를 '아, 시끄러워' 한마디로 받아쳐요. 논리로 반박하지 않고 감정으로 밀어내는 게 이 곡다워요."},{"id":"h2","tk":[{"t":"{君|きみ}"},{"t":"に","m":"~에게"},{"t":"{負|ま}けて"},{"t":"しまう","p":"보조동사","m":"~해 버리다","w":"보조동사로 쓰일 때는 히라가나로 써요."},{"t":"{日|ひ}","p":"명사","m":"날"},{"t":"も"},{"t":"あった","p":"동사","m":"있었다","b":"ある","bm":"있다 (사물·일)","w":"ある는 보통 히라가나로 써요."}],"ko":"너에게 져 버리는 날도 있었지","lit":"너 / 에게 / 져 / 버리다 / 날 / 도 / 있었다","c":"君(어두운 나)의 핑계에 넘어가 포기해 버린 날도 있었다고 인정해요. 宿命의 そんな夜もあった(그런 밤도 있었어)와 같은 말투예요."},{"id":"h3","tk":[{"t":"まあ","p":"감동사","m":"뭐, 그야","w":"감탄사라 히라가나로 써요."},{"t":"　"},{"t":"そりゃ","p":"감동사","m":"그야","b":"それは","bm":"그것은","w":"それは가 줄어든 회화체예요. 지시어라 히라가나."},{"t":"そっか","p":"감동사","m":"그런가, 그렇겠지","b":"そうか","bm":"그런가","w":"そうか가 줄어든 회화체라 히라가나로 써요.","n":"そうか → そっか. 혼잣말로 수긍할 때 써요."},{"t":"　"},{"t":"ブレない","p":"동사","m":"흔들리지 않는","b":"ブレる","bm":"흔들리다, 흐려지다","w":"원래 일본어 동사 ぶれる(흔들리다)인데, 어간을 가타카나로 써서 ブレる가 됐어요. 회화에서는 이 표기가 더 흔해요.","n":"ブレない = 흔들리지 않는, 일관된. ブレない人 = 소신이 확실한 사람. 사진의 손떨림을 手ブレ(てブレ)라고 하는 것도 같은 말이에요. 가타카나 어간에 히라가나 활용이 붙은 동사예요."},{"t":"{芯|しん}","p":"명사","m":"심지, 중심","n":"芯은 연필심, 초의 심지처럼 한가운데 단단한 것이에요. 芯が強い = 심지가 굳다."},{"t":"や","p":"조사","m":"~나 (나열)"}],"ko":"뭐, 그야 그렇겠지. 흔들리지 않는 심지나","lit":"뭐 / 그야 / 그런가 / 흔들리지 않는 / 심지 / 나","s":"ブレない는 가타카나 어간에 히라가나 어미가 붙은 동사예요. 외래어도 아닌데 가타카나로 쓰는 일본어 동사의 대표적인 예예요."},{"id":"h4","tk":[{"t":"{思想|しそう}","p":"명사","m":"사상","n":"한국어 '사상(思想)'과 같은 한자어예요."},{"t":"なんて","p":"조사","m":"~같은 건, ~따위","n":"なんて = '~같은 건'. 가볍게 낮추거나 부정할 때 써요. 勉強なんて嫌い = 공부 따위 싫어."},{"t":"{僕|ぼく}"},{"t":"らしく","p":"접미사","m":"~답게","b":"らしい","bm":"~답다","w":"'~답다'를 만드는 접미사라 히라가나로 써요.","n":"명사 + らしい = '~답다'. 僕らしい(나답다) → 僕らしくはない(나답지는 않다). 제목 らしさ와 같은 말이에요."},{"t":"は","m":"~는 (대비)"},{"t":"ない","p":"조동사","m":"~지 않다"},{"t":"や","p":"조사(종조사)","m":"~네 (혼잣말)","n":"체념하듯 툭 내뱉는 종조사예요."}],"ko":"사상 같은 건 나답지 않잖아","lit":"사상 / 따위 / 나 / 답게 / 는 / 않다 / 네","g":[{"k":"명사 + らしい","d":"'~답다'. 男らしい(남자답다), 子供らしい(아이답다), 僕らしい(나답다)."}],"c":"흔들리지 않는 신념이나 멋진 철학은 나와 어울리지 않는다고 스스로 인정해요. 이 곡의 '나다움'은 훌륭한 신념이 아니라, 흔들리고 질투하는 모습까지 포함한 말이에요."},{"id":"h5","tk":[{"t":"でも","p":"접속사","m":"하지만","w":"접속사라 히라가나로 써요."},{"t":"{今|いま}","p":"명사","m":"지금"},{"t":"の"},{"t":"{僕|ぼく}"},{"t":"は"},{"t":"　"},{"t":"もう","p":"부사","m":"이제, 이미","w":"부사라 히라가나로 써요."},{"t":"{限界|げんかい}","p":"명사","m":"한계","n":"한국어 '한계(限界)'와 같은 한자어예요. 宿命의 魂の限り(혼이 다하도록)와 같은 限이에요."},{"t":"だ"}],"ko":"하지만 지금의 나는 이제 한계야","lit":"하지만 / 지금 / 의 / 나 / 는 / 이제 / 한계 / 다","c":"여기서 '한계'는 포기하겠다는 뜻이 아니에요. 핑계를 듣고 참는 것이 한계라는 뜻이에요. 다음 줄에서 반격이 시작돼요."},{"id":"h6","tk":[{"t":"{君|きみ}"},{"t":"の"},{"t":"{言|い}いなり","p":"명사","m":"시키는 대로 함","b":"{言|い}いなり","w":"言う(말하다)의 言는 한자, いなり는 히라가나예요.","n":"言いなりになる = 남이 시키는 대로 따르다. 言う + なる(되다)가 합쳐진 말이에요."},{"t":"に"},{"t":"なって","p":"동사","m":"되어","b":"なる","bm":"되다","w":"なる는 기본 동사라 히라가나로 써요."},{"t":"たまるか","p":"표현","m":"~할까 보냐","w":"'참을 수 있겠냐'는 관용 표현이라 히라가나로 써요.","n":"〜てたまるか = '절대 ~하지 않겠다'. 宿命의 負けてたまるか와 같은 표현이에요."}],"ko":"네 말대로 따라 줄까 보냐","lit":"너 / 의 / 시키는 대로 / 로 / 되어 / 참을 수 있겠냐","g":[{"k":"〜てたまるか","d":"동사 て형 + たまるか = '~할까 보냐'. 宿命의 負けてたまるか(질까 보냐)에 이어 히게단 응원가에 다시 나와요."}],"c":"'즐거우면 됐잖아'라던 君의 목소리에 정면으로 맞서요. 宿命에서 불안에게 했던 말 負けてたまるか를, 이번에는 내 안의 君에게 해요."},{"id":"h7","tk":[{"t":"{僕|ぼく}"},{"t":"は"},{"t":"やっぱ","p":"부사","m":"역시","b":"やっぱり","w":"やっぱり가 줄어든 회화체라 히라가나로 써요. 원래 한자 矢張り가 있지만 거의 쓰지 않아요.","n":"やはり(조금 격식) → やっぱり(회화) → やっぱ(더 편한 회화)."},{"t":"　"},{"t":"{誰|だれ}","p":"대명사","m":"누구"},{"t":"にも","p":"조사(복합)","m":"~에게도","n":"誰にも + 부정 = 아무에게도 ~않다."},{"t":"{負|ま}けたく","p":"동사","m":"지고 싶(지)","b":"{負|ま}ける","bm":"지다","w":"어간 負는 한자, けたく는 히라가나예요.","n":"負ける + たい(~하고 싶다) → 負けたくない(지고 싶지 않다)."},{"t":"ない","p":"조동사","m":"~지 않다"},{"t":"んだ"}],"ko":"나는 역시 누구에게도 지고 싶지 않아","lit":"나 / 는 / 역시 / 누구 / 에게도 / 지고 싶 / 지 않다 / 는 거야","g":[{"k":"{誰|だれ}にも〜ない","d":"'아무에게도 ~않다'. 誰にも言わない = 아무에게도 말하지 않아."},{"k":"〜たくない","d":"'~하고 싶지 않다'. 負ける → 負けたくない."}],"c":"곡 전체가 이 한 줄을 향해 왔어요. 온리 원이면 된다는 위로도, 재능이 없다는 핑계도 아니고, 그냥 '지기 싫다'는 단순하고 솔직한 진심이에요."},{"id":"h8","tk":[{"t":"そんな"},{"t":"{熱|ねつ}","p":"명사","m":"열, 열기","n":"熱는 온요미 ねつ(열, 열정), 쿤요미 あつい(熱い, 뜨겁다)예요. 宿命의 熱さ(뜨거움)와 같은 한자예요."},{"t":"よ","p":"조사","m":"~여 (부르는 말)","n":"명사 + よ = '~여'. 무언가를 부를 때 써요. 문장 끝의 よ(~야)와 모양은 같지만 쓰임이 달라요."},{"t":"どうか","p":"부사","m":"부디, 제발","w":"부사라 히라가나로 써요.","n":"どうか는 간절히 부탁할 때 써요. どうかお願いします = 부디 부탁드립니다."},{"t":"{消|き}えて","p":"동사","m":"사라져","b":"{消|き}える","bm":"사라지다, 꺼지다","w":"어간 消는 한자, えて는 히라가나예요."},{"t":"なくなる","p":"동사","m":"없어지다","w":"한자 無くなる로도 쓰지만 보통 히라가나로 써요."},{"t":"な","p":"조사(종조사)","m":"~하지 마 (금지)","n":"동사 사전형 + な = '~하지 마'. 忘れるな = 잊지 마. 혼잣말의 な(~네)와 모양이 같지만, 동사 사전형 뒤에 오면 금지예요."},{"t":"！"}],"ko":"그런 열정이여, 부디 사라져 없어지지 마!","lit":"그런 / 열 / 이여 / 부디 / 사라져 / 없어지다 / 마!","g":[{"k":"동사 + な (금지)","d":"동사 사전형 + な = '~하지 마'. 消えるな(사라지지 마), 負けるな(지지 마)."},{"k":"명사 + よ (부르기)","d":"'~여'. 熱よ = 열정이여. 시나 노래에서 무언가를 부를 때 써요."}],"s":"같은 な가 이 곡에 두 번 다른 뜻으로 나와요. 取れないな의 な는 혼잣말(~겠지), 이 줄의 なくなるな의 な는 금지(~하지 마)예요. 앞의 말이 무엇인지로 구별해요.","c":"지기 싫은 마음을 '열(熱)'이라고 부르며, 사라지지 말아 달라고 빌어요. 그 열이 괴롭게 해도, 그것이 곧 나다움이라는 걸 받아들이는 순간이에요."}]},{"label":"ラストサビ · 마지막 후렴","note":"1절 후렴이 다시 나오지만, 끝이 '출발선에 서서 진심으로 승부하자'로 바뀌어요.","lines":[{"same":"d1"},{"same":"d2"},{"same":"d3"},{"same":"d4"},{"id":"i1","tk":[{"t":"まだまだ","p":"부사","m":"아직도, 아직 한참","w":"부사라 히라가나로 써요.","n":"まだ(아직)를 겹쳐 강조한 말이에요. まだまだこれから = 아직 이제부터야."},{"t":"{泣|な}く"},{"t":"んだ"},{"t":"　"},{"t":"{笑|わら}う"},{"t":"んだ"}],"ko":"아직 한참 더 울 거야, 웃을 거야","lit":"아직도 / 운다 / 는 거야 / 웃는다 / 는 거야","s":"1절 후렴의 何度も(몇 번이고)가 まだまだ(아직 한참)로 바뀌었어요. 같은 자리의 단어 하나로 '지금까지'가 '앞으로'로 바뀌어요."},{"id":"i2","tk":[{"t":"{位置|いち}","p":"명사","m":"위치, 자리","n":"한국어 '위치(位置)'와 같은 한자어예요."},{"t":"に"},{"t":"ついた","p":"동사","m":"(자리에) 선, 붙은","b":"つく","bm":"(자리에) 붙다, 자리 잡다","w":"한자 着く·就く·付く 등 뜻마다 다르게 쓰는 말이라 히라가나로 썼어요.","n":"位置につく = 정해진 자리에 서다. 달리기 출발 구령 位置について(제자리에)가 바로 이 말이에요."},{"t":"なら","p":"조사","m":"~라면"}],"ko":"제자리에 섰다면","lit":"위치 / 에 / 붙었다 / 면","g":[{"k":"과거형 + なら","d":"'~했다면'. 位置についたなら = 제자리에 섰다면."}],"c":"일본 달리기의 출발 구령 位置について、よーい、ドン(제자리에, 준비, 출발)을 그대로 떠올리게 해요. 100m 출발선에 선 순간이에요."},{"id":"i3","tk":[{"t":"さあ","p":"감동사","m":"자","w":"감탄사라 히라가나로 써요.","n":"さあ = '자, 이제'. 무언가를 시작할 때 재촉하는 말이에요."},{"t":"、"},{"t":"{本気|ほんき}","p":"명사","m":"진심, 진지함","n":"本気で = 진심으로, 전력으로. 속어로는 マジ라고도 해요(e2의 まじで)."},{"t":"で","p":"조사","m":"~으로 (방식)"},{"t":"{勝負|しょうぶ}","p":"명사","m":"승부","n":"한국어 '승부(勝負)'와 같은 한자어예요. 勝(이기다)와 負(지다)를 합친 말이라, 이 곡의 勝っても·負けて가 한 단어에 들어 있어요."},{"t":"だ"}],"ko":"자, 진심으로 승부다","lit":"자 / , / 진심 / 으로 / 승부 / 다","s":"勝負는 勝(이기다)와 負(지다) 두 글자예요. 이 곡에 나온 勝っても와 負けて負けて가 한 단어로 합쳐진 셈이에요.","c":"e2에서 속어로 내뱉던 まじ(진짜)가, 여기서는 한자 本気(진심)로 바뀌어요. 짜증 섞인 '진짜 뭐야'가 '진심으로 승부하자'로 바뀌는 흐름이에요."}]},{"label":"アウトロ · 마무리","note":"모든 감정을 '너와 나의 것'으로 끌어안고, '살아 있어서 다행이야'로 끝나요.","lines":[{"same":"d1"},{"id":"j1","tk":[{"t":"{喜|よろこ}び","p":"명사","m":"기쁨","b":"{喜|よろこ}び","w":"동사 喜ぶ(기뻐하다)에서 나온 명사라 한자 喜 뒤에 오쿠리가나 び가 붙어요."},{"t":"{悲|かな}しみ","p":"명사","m":"슬픔","b":"{悲|かな}しみ","w":"형용사 悲しい(슬프다)에서 나온 명사라 한자 悲 뒤에 오쿠리가나 しみ가 붙어요.","n":"い형용사 어간 + み = 명사. 悲しみ(슬픔), 楽しみ(즐거움). 〜さ보다 감정 자체를 말하는 느낌이에요."},{"t":"　"},{"t":"{不安|ふあん}","p":"명사","m":"불안"},{"t":"{期待|きたい}","p":"명사","m":"기대"},{"t":"　"},{"t":"{絶望|ぜつぼう}","p":"명사","m":"절망","n":"한국어 '절망(絶望)'과 같은 한자어예요."},{"t":"{絶頂|ぜっちょう}","p":"명사","m":"절정","n":"한국어 '절정(絶頂)'과 같은 한자어예요. 絶望(절망)과 絶頂(절정)은 같은 絶로 시작하지만 뜻은 정반대예요."}],"ko":"기쁨과 슬픔, 불안과 기대, 절망과 절정","lit":"기쁨 / 슬픔 / 불안 / 기대 / 절망 / 절정","s":"조사 하나 없이 명사만 늘어놓았어요. 喜び·悲しみ(고유어, 한자+히라가나), 不安·期待·絶望·絶頂(한자어, 한자만)이 짝을 지어 반대되는 감정끼리 붙어 있어요.","c":"반대되는 감정이 두 개씩 붙어 있어요. 宿命의 Cメロ에 나왔던 不安·期待도 다시 보여요. 좋은 감정과 나쁜 감정을 가리지 않고 전부 받아들이겠다는 뜻이에요."},{"id":"j2","tk":[{"t":"{君|きみ}"},{"t":"と"},{"t":"{僕|ぼく}"},{"t":"の"},{"t":"もの"},{"t":"だ"},{"t":"よ"},{"t":"{全部|ぜんぶ}"}],"ko":"너와 나의 거야, 전부","lit":"너 / 와 / 나 / 의 / 것 / 이다 / 야 / 전부","s":"도입의 誇るよ全部·好きだよ全部와 같은 '~よ全部' 틀로 돌아왔어요. 곡의 처음과 끝이 이어져요.","c":"처음에는 君가 '나의 검은 부분'이었는데, 이제는 모든 감정이 '너와 나의 것'이 돼요. 어두운 나를 몰아내지 않고 함께 가겠다는 결말이에요."},{"same":"d1"},{"id":"j3","tk":[{"t":"ああ"},{"t":"　"},{"t":"{息|いき}{絶|た}える","p":"동사","m":"숨이 끊어지다","w":"息(숨)+絶える(끊어지다)의 동사예요. 어간은 한자, える는 히라가나예요.","n":"息絶える = 숨을 거두다. 絶える(たえる)는 '끊기다'. 같은 絶가 絶望·絶頂에도 나와요."},{"t":"まで","p":"조사","m":"~까지"},{"t":"{泣|な}く"},{"t":"んだ"},{"t":"　"},{"t":"{笑|わら}う"},{"t":"んだ"}],"ko":"아, 숨이 다할 때까지 우는 거야, 웃는 거야","lit":"아 / 숨이 끊어지다 / 까지 / 운다 / 는 거야 / 웃는다 / 는 거야","c":"何度も(몇 번이고) → まだまだ(아직 한참) → 息絶えるまで(숨이 다할 때까지). 후렴이 반복될 때마다 울고 웃는 시간이 점점 길어져요."},{"id":"j4","tk":[{"t":"「"},{"t":"{本当|ほんとう}に","p":"부사","m":"정말로","b":"{本当|ほんとう}","bm":"정말, 진짜","w":"한자어 本当은 한자, 부사로 만드는 に는 히라가나예요.","n":"회화에서는 ほんと, 가타카나로 ホント라고도 써요."},{"t":"{良|よ}かった","p":"い형용사","m":"다행이다, 좋았다","b":"{良|よ}い","bm":"좋다","w":"Pretender의 選べたらよかった에서는 히라가나로 썼는데, 여기서는 한자 良かった로 썼어요. 정말 마음에서 우러난 '다행이다'라 한자로 무게를 실은 것으로 볼 수 있어요.","n":"いい의 과거형은 よかった예요. 良かった = 다행이다, 잘됐다."},{"t":"」"}],"ko":"“정말 다행이다”","lit":"정말로 / 다행이다","s":"곡의 마지막 따옴표예요. Cメロ의 따옴표가 포기를 권하는 목소리였다면, 여기의 따옴표는 끝까지 달린 뒤에 나오는 진심이에요."},{"id":"j5","tk":[{"t":"ああ"},{"t":"　"},{"t":"{生|い}きてて","p":"동사","m":"살아 있어서","b":"{生     'す': ['さ', 'し', 'せ', 'そ', 'して', 'した'], 'つ': ['た', 'ち', 'て', 'と', 'って', 'った'], 'ぬ': ['な', 'に', 'ね', 'の', 'んで', 'んだ'],
    'ぶ': ['ば', 'び', 'べ', 'ぼ', 'んで', 'んだ'], 'む': ['ま', 'み', 'め', 'も', 'んで', 'んだ'], 'る': ['ら', 'り', 'れ', 'ろ', 'って', 'った']
  };
  const FORM_V = [['masu', 'ます형', '정중하게'], ['te', 'て형', '~하고, ~해서'], ['ta', 'た형', '~했다'], ['nai', 'ない형', '~하지 않다'], ['pot', '가능형', '~할 수 있다'], ['ba', 'ば형', '~하면'], ['vol', '의지형', '~하자'], ['imp', '명령형', '~해라']];
  const FORM_A = [['neg', '부정', '~하지 않다'], ['past', '과거', '~했다'], ['te', 'て형', '~하고, ~해서'], ['ba', 'ば형', '~하면'], ['adv', '부사형', '~하게'], ['noun', '명사형', '~함']];
  const FORM_N = [['pol', '정중', '~입니다'], ['neg', '부정', '~하지 않다'], ['past', '과거', '~했다'], ['te', 'て형', '~하고'], ['attr', '명사 수식', '~한 + 명사'], ['adv', '부사형', '~하게']];
  const CLS_NAME = { v5: '5단 동사', v1: '1단 동사', vs: 'する 동사', vk: '불규칙 동사', 'adj-i': 'い형용사', 'adj-na': 'な형용사' };
  const CLS_NOTE = {
    v5: '끝소리(う단)가 あ·い·え·お단으로 바뀌며 활용해요.', v1: '끝의 る를 떼고 뒤를 붙여요.', vs: 'する 부분만 활용해요.',
    vk: '来る는 읽기가 き·く·こ로 바뀌는 불규칙 동사예요.', 'adj-i': '끝의 い가 く·かっ·けれ로 바뀌어요.', 'adj-na': '어간은 그대로 두고 뒤에 だ·な·に 등을 붙여요.'
  };
  function conjugate(base, w) {
    if (w.forms) return w.forms.map((f) => ({ l: f[0], t: f[1], h: f[2] || '' }));
    const plain = plainOf(base), no = w.no || [];
    let F = null, L = FORM_V;
    if (w.cls === 'v5') {
      const g = GODAN[base.slice(-1)]; if (!g) return [];
      const st = base.slice(0, -1), te = plain === '行く' ? ['って', 'った'] : [g[4], g[5]];
      F = { masu: st + g[1] + 'ます', te: st + te[0], ta: st + te[1], nai: st + g[0] + 'ない', pot: st + g[2] + 'る', ba: st + g[2] + 'ば', vol: st + g[3] + 'う', imp: st + g[2] };
    } else if (w.cls === 'v1') {
      const st = base.slice(0, -1);
      F = { masu: st + 'ます', te: st + 'て', ta: st + 'た', nai: st + 'ない', pot: st + 'られる', ba: st + 'れば', vol: st + 'よう', imp: st + 'ろ' };
    } else if (w.cls === 'vs') {
      const st = base.replace(/する$/, '');
      F = { masu: st + 'します', te: st + 'して', ta: st + 'した', nai: st + 'しない', pot: st + 'できる', ba: st + 'すれば', vol: st + 'しよう', imp: st + 'しろ' };
    } else if (w.cls === 'vk') {
      const k = base.indexOf('{来|') === 0, r = (y, rest) => (k ? '{来|' + y + '}' : y) + rest;
      F = { masu: r('き', 'ます'), te: r('き', 'て'), ta: r('き', 'た'), nai: r('こ', 'ない'), pot: r('こ', 'られる'), ba: r('く', 'れば'), vol: r('こ', 'よう'), imp: r('こ', 'い') };
    } else if (w.cls === 'adj-i') {
      const st = plain === 'いい' ? 'よ' : base.slice(0, -1); L = FORM_A;
      F = { neg: st + 'くない', past: st + 'かった', te: st + 'くて', ba: st + 'ければ', adv: st + 'く', noun: st + 'さ' };
    } else if (w.cls === 'adj-na') {
      L = FORM_N;
      F = { pol: base + 'です', neg: base + 'じゃない', past: base + 'だった', te: base + 'で', attr: base + 'な', adv: base + 'に' };
    }
    return F ? L.filter((x) => no.indexOf(x[0]) < 0).map((x) => ({ l: x[1], t: F[x[0]], h: x[2] })) : [];
  }
  const wBlock = (label, inner) => '<div class="wd-block"><h4 class="d-label">' + label + '</h4>' + inner + '</div>';
  /* 예문·형태 변화·관련 단어. surf = 가사에 나온 형태들 (plain → 표기) */
  function wordExtraHTML(key, base, surf) {
    const w = (WORDS && WORDS[key]) || {}, forms = conjugate(base, w);
    let h = '';
    if (w.ex && w.ex.length) h += wBlock('예문', w.ex.map((x) => '<div class="wex"><div class="ex-row"><p class="wex-jp" lang="ja">' + renderJP(x.t) + '</p>' + speakBtn(speechOf(x.t)) + '</div><p class="ex-ko">' + rich(x.ko) + '</p></div>').join(''));
    if (forms.length) {
      const all = [{ l: '사전형', t: base, h: '기본' }].concat(forms), lab = new Map(all.map((f) => [plainOf(f.t), f.l]));
      const hit = all.some((f) => surf.has(plainOf(f.t)));
      const used = Array.from(surf.values()).filter((m) => !lab.has(plainOf(m)));
      h += wBlock('형태 변화', (CLS_NAME[w.cls] ? '<p class="cls-note"><b>' + CLS_NAME[w.cls] + '</b> · ' + CLS_NOTE[w.cls] + '</p>' : '')
        + '<div class="forms">' + all.map((f) => '<div class="form' + (surf.has(plainOf(f.t)) ? ' in-lyric' : '') + '"><small>' + f.l + (f.h ? ' · ' + f.h : '') + '</small><span class="jp" lang="ja">' + renderJP(f.t) + '</span></div>').join('') + '</div>'
        + (hit ? '<p class="cls-note">색칠된 칸이 가사에 나온 형태예요.</p>' : '')
        + (used.length ? '<p class="cls-note">가사에서 쓴 형태: ' + used.map((m) => '<span class="jp" lang="ja">' + renderJP(m) + '</span>').join(', ') + '</p>' : ''));
    }
    if (w.rel && w.rel.length) h += wBlock('관련 단어', '<div class="rels">' + w.rel.map((r) => '<span class="rel"><span class="rel-top"><span class="jp" lang="ja">' + renderJP(r.t) + '</span>' + (r.r ? '<span class="rel-r">' + esc(r.r) + '</span>' : '') + '</span><small>' + rich(r.m) + '</small></span>').join('') + '</div>');
    return h;
  }
  function surfacesOf(e) {
    const m = new Map();
    e.refs.forEach((r) => { const s = songs[r.song], l = s && s.lines[r.line - 1]; if (l) l.toks.forEach((t) => { if (t.isVocab && t.vkey === e.key) m.set(t.plain, t.t); }); });

  }
  const lineMarked = (l, key) => l.toks.map((t) => (t.isVocab && t.vkey === key ? '<mark class="hl">' + renderJP(t.t) + '</mark>' : renderJP(t.t))).join('');
  function wordDetailHTML(e, scope) {
    const ctx = e.refs.slice(0, 3).map((r) => {
      const s = songs[r.song], l = s && s.lines[r.line - 1]; if (!l) return '';
      return '<div class="ctx"><p class="ctx-jp" lang="ja">' + lineMarked(l, e.key) + '</p>' + (l.ko ? '<p class="ctx-ko">' + rich(l.ko) + '</p>' : '')
        + '<p class="ctx-meta">' + (scope === 'all' ? esc(songTitle(r.song)) + ' · ' : '') + r.line + '번째 줄 · <button class="ref" data-a="goto-line" data-song="' + esc(r.song) + '" data-line="' + r.line + '">가사에서 보기</button></p></div>';
    }).join('') + (e.refs.length > 3 ? '<p class="cls-note">이 밖에 ' + (e.refs.length - 3) + '줄에 더 나와요.</p>' : '');
    const lvNote = lvText(e.key);
    return wBlock('가사 속 문장', (lvNote ? '<p class="cls-note">' + esc(lvNote) + '</p>' : '') + ctx) + wordExtraHTML(e.key, e.tok.b || e.tok.t, surfacesOf(e));
  }

  /* ── 설정 ─────────────────────────────────────────────── */
  const DEFAULTS = { furi: true, kr: true, romaji: false, color: true, gaps: true, hideKo: false, size: 'm', rate: 0.9 };
  const S = Object.assign({}, DEFAULTS, store.get('hgn.settings', {}));
  S.gaps = true; /* 단어 경계 밑줄은 늘 켜 둬요(끄는 버튼 없음). 예전에 꺼 둔 설정이 남아 있어도 켜요. */
  const saveS = () => store.set('hgn.settings', S);
  function applyS() {
    ROOT.classList.toggle('no-furi', !S.furi);
    ROOT.classList.toggle('show-kr', !!S.kr);
    ROOT.classList.toggle('show-romaji', !!S.romaji);
    ROOT.classList.toggle('colorize', !!S.color);
    ROOT.classList.toggle('gaps', !!S.gaps);
    ROOT.classList.toggle('hide-ko', !!S.hideKo);
    ROOT.setAttribute('data-size', S.size);
    $$('[data-a="opt"]').forEach((b) => b.setAttribute('aria-pressed', String(!!S[b.dataset.opt])));
    $$('input[data-opt]').forEach((i) => { i.checked = !!S[i.dataset.opt]; });
    $$('[data-a="set"]').forEach((b) => b.setAttribute('aria-pressed', String(String(S[b.dataset.key]) === b.dataset.val)));
  }
  function setOpt(key, val) {
    S[key] = val; saveS(); applyS();
    if (key === 'hideKo') $$('.ko-wrap.revealed').forEach((x) => x.classList.remove('revealed'));
  }

  /* ── 발음 듣기 ─────────────────────────────────────────── */
  const TTS = 'speechSynthesis' in window && typeof window.SpeechSynthesisUtterance === 'function';
  if (!TTS) ROOT.classList.add('no-tts');
  else { try { speechSynthesis.getVoices(); } catch (e) { /* 음성 목록은 나중에 채워짐 */ } }
  function speak(text) {
    if (!TTS || !text) return;

      speechSynthesis.cancel();

      u.lang = 'ja-JP'; u.rate = S.rate;
      const v = speechSynthesis.getVoices().find((x) => /^ja([-_]|$)/i.test(x.lang));
      if (v) u.voice = v;
      u.onerror = (ev) => { if (ev.error !== 'interrupted' && ev.error !== 'canceled') toast('음성을 재생하지 못했어요. 기기에 일본어 음성이 있는지 확인해 주세요.'); };

  }

  /* ── 학습 기록: claude.ai 계정(가능하면) + 브라우저 사본 ── */
  const Progress = {
    data: { w: {}, l: {} }, mode: 'local', ref: null, dirty: false, writing: false, timer: 0, retries: 0, viewOnly: false,
    load() { const d = store.get('hgn.progress', null); if (d && typeof d === 'object') this.data = { w: Object.assign({}, d.w), l: Object.assign({}, d.l) }; },
    async connect() {
      try {
        if (!window.claude || typeof window.claude.use !== 'function') return;
        const pair = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
        const db = pair[0], user = pair[1];
        if (!db || !user) return;
        // 보기 권한만 있는 사람(공유받은 Viewer 등)은 자기 기록도 쓸 수 없다. 조직 밖 사람은 can()이 null이라 첫 저장 거절로 판단한다.
        const uid = await user.id();
        let canWrite = null;
        try { canWrite = await user.can('data.write'); } catch (e) { canWrite = null; }
        if (!uid || canWrite === false) { this.viewOnly = true; updateSyncLabel(); return; }
        this.ref = db.doc('data/users/' + uid + '/progress');
        this.mode = 'cloud'; updateSyncLabel();
        this.ref.onSnapshot((snap) => {
          if (this.dirty || this.writing || !snap.exists) return;
          const d = snap.data() || {};
          this.data = { w: Object.assign({}, d.w), l: Object.assign({}, d.l) };
          store.set('hgn.progress', this.data); refreshProgressUI();
        }, () => { this.goLocal(); });
      } catch (e) { this.goLocal(); }
    },
    goLocal() { this.ref = null; this.mode = 'local'; updateSyncLabel(); },
    has(type, key) { return !!this.data[type][key]; },
    toggle(type, key) {
      const m = this.data[type];
      if (m[key]) delete m[key]; else m[key] = 1;
      this.commit(); return !!m[key];
    },
    clear() { this.data = { w: {}, l: {} }; this.commit(); },
    commit() { store.set('hgn.progress', this.data); refreshProgressUI(); if (this.ref) { this.dirty = true; clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 800); } },

      : built
        ? '이 파일은 ' + built + '에 내려받은 판이에요. 이해한 줄과 외운 단어는 지금 쓰는 브라우저에만 저장돼요.'
        : Progress.viewOnly

  /* ── 내려받기: 곡·단어 데이터를 담은 단일 HTML 파일을 기기에 저장 (claude.ai에서 열었을 때만) ── */
  const DL = { api: null, file: 'download/higedan-note.html', name: 'higedan-note.html' };
  async function setupDownload() {
    try {

    } catch (e) {
      const code = e && e.code;
      if (code === 'declined') return;
      if (code === 'rate_limited') toast('저장 창이 이미 떠 있어요. 잠시 뒤 다시 눌러 주세요.');
      else if (code && code !== 'bad_request' && code !== 'transform_error' && code !== 'too_large') { DL.api = null; ROOT.classList.remove('can-dl'); toast('이 화면에서는 내려받기를 쓸 수 없어요.'); }
      else toast('파일을 준비하지 못했어요. 잠시 뒤 다시 시도해 주세요.');
    } finally { btn.disabled = false; }
  }
  function progHTML(id) {
    return '<div class="prog" data-prog="' + esc(id) + '"><div class="prog-bar"><i></i></div><div class="prog-txt"><span class="p-l">이해한 줄 –</span><span class="p-w">외운 단어 –</span></div></div>';
  }
  function updateProg(el) {

  function refreshProgressUI() {

  /* ── 공통 조각 ─────────────────────────────────────────── */
  const setView = (html) => { $('#view').innerHTML = html; };

  const optBtn = (k, label) => '<button class="tg" data-a="opt" data-opt="' + k + '" aria-pressed="' + !!S[k] + '">' + label + '</button>';

  function whyAuto(t) {
    const s = t.scripts, p = t.p || '';
    if (t.special) return '가사 특유의 읽기예요. 한자로는 뜻을 보여 주고, 위에 단 루비로 실제로 부르는 소리를 따로 정했어요.';
    if (p.indexOf('조사') === 0) return '조사는 단어 뒤에 붙어 문법 관계만 나타내는 기능어라서 항상 히라가나로 써요.';
    if (p.indexOf('조동사') === 0) return '조동사(〜ます・〜たい・〜ない 등)는 문법 요소라서 히라가나로 써요.';
    if (s.indexOf('k') >= 0 && s.indexOf('h') >= 0) return '뜻을 담은 앞부분(어간)은 한자로, 활용하면서 모양이 바뀌는 뒷부분(오쿠리가나)은 히라가나로 써요.';
    if (s.length === 1 && s[0] === 'k') return '뜻을 가진 내용어는 보통 한자로 써요. 한자 덕분에 띄어쓰기 없이도 단어의 경계가 눈에 들어와요.';
    if (s.length === 1 && s[0] === 'a') return '외래어나 외국어 소리를 옮긴 말, 또는 강조하고 싶은 말은 가타카나로 써요.';
    if (s.length === 1 && s[0] === 'l') return '영어를 알파벳 그대로 썼어요. J-POP 가사에서는 영어 단어나 구절을 그대로 섞는 일이 흔해요.';
    if (s.length === 1 && s[0] === 'h') return '부사·접속사·감탄사처럼 문법적인 성격이 강한 말은 한자가 있더라도 보통 히라가나로 써요.';
    return '여러 문자가 섞인 표기예요. 글자 색으로 어느 부분이 어떤 문자인지 확인해 보세요.';
  }

  /* 회화 문장 표기: 띄어쓰기( )는 한글 발음의 단어 경계, ^は·^へ는 조사라서 wa·e로 읽어요. 화면과 음성에는 둘 다 빠져요. */

  function dialogHTML(lines) {
    let out = '', i = 0;

    }
    return out;
  }

      if (st && typeof st.hgn === 'number') H.i = st.hgn; else history.replaceState({ hgn: 0 }, '');
      H.native = !!history.state && history.state.hgn === H.i;
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    } catch (e) { H.native = false; H.i = 0; }
    let max = H.i;
    try { const m = +sessionStorage.getItem('hgn.navMax'); if (H.native && m > max) max = m; } catch (e) { /* 저장 불가 환경 */ }
    H.max = max; H.list[H.i] = state.route;
    window.addEventListener('scroll', () => { H.pos[H.i] = window.scrollY; }, { passive: true });
    updateHistBtns();
  }
  function saveNavMax() { try { sessionStorage.setItem('hgn.navMax', String(H.max)); } catch (e) { /* 저장 불가 환경 */ } }
  function updateHistBtns() {
    $$('[data-a="hist"]').forEach((b) => { b.disabled = +b.dataset.d < 0 ? H.i <= 0 : H.i >= H.max; });
  }
  // 곡 데이터가 그려진 뒤에 돌아가야 해서 한 박자 늦추고, 페이지가 덜 그려져 덜 내려갔으면 한 번 더 시도한다.
  function restoreScroll(y) {
    if (!(y > 0)) return;
    const r = state.route;
    setTimeout(() => {
      if (state.route !== r) return;
      window.scrollTo(0, y);
      if (Math.abs(window.scrollY - y) > 2) setTimeout(() => { if (state.route === r) window.scrollTo(0, y); }, 250);
    }, 0);
  }
  function arrive(r, y) { state.route = r; route(); restoreScroll(y); updateHistBtns(); }
  function histGo(d) {
    const j = H.i + d;
    if (j < 0 || j > H.max) return;
    H.pos[H.i] = window.scrollY;
    if (H.native) { try { history.go(d); return; } catch (e) { H.native = false; } }
    const r = H.list[j]; if (!r) return;
    H.i = j;
    try { history.replaceState(null, '', '#' + r); } catch (e) { /* 주소 갱신이 막힌 환경 */ }
    arrive(r, H.pos[j] || 0);
  }
  function navigate(to) {
    const next = (to || 'home') === 'home' && state.mode !== 'song' ? state.mode : to || 'home', moved = next !== state.route;
    state.route = next;
    if (moved) {
      H.pos[H.i] = window.scrollY;
      H.list.length = H.i + 1; H.pos.length = H.i + 1;
      if (H.native) { try { history.pushState({ hgn: H.i + 1 }, '', '#' + next); } catch (e) { H.native = false; } }
      H.i++; H.max = H.i; H.list[H.i] = next; saveNavMax();
    } else if (H.native) {
      try { if (location.hash.slice(1) !== next) history.replaceState({ hgn: H.i }, '', '#' + next); } catch (e) { /* 주소 갱신이 막힌 환경 */ }
    }
    route(); updateHistBtns();
  }
  const fromHash = () => { try { return location.hash.slice(1) || 'home'; } catch (e) { return 'home'; } };
  window.addEventListener('popstate', (e) => {
    const st = e.state, r = fromHash();
    let y = 0;
    if (st && typeof st.hgn === 'number') { H.i = st.hgn; y = H.pos[H.i] || 0; if (H.i > H.max) H.max = H.i; }
    else { // 링크로 주소(#)만 바뀌어 새로 생긴 기록
      H.list.length = H.i + 1; H.pos.length = H.i + 1; H.i++; H.max = H.i;
      try { history.replaceState({ hgn: H.i }, ''); } catch (e2) { /* 주소 갱신이 막힌 환경 */ }
    }
    H.list[H.i] = r; saveNavMax();
    arrive(r, y);
  });
  window.addEventListener('hashchange', () => { const h = fromHash(); if (h !== state.route) { state.route = h; route(); } });

  /* ── 이벤트 ───────────────────────────────────────────── */
  document.addEventListener('click', (e) => {
    const tokEl = e.target.closest('.lyric .tok');
    if (tokEl) { if (!tokEl.classList.contains('punct')) selectTok(tokEl.closest('.line'), +tokEl.dataset.i); return; }
    const el = e.target.closest('[data-a]'); if (!el) return;
    const a = el.dataset.a, li = el.closest('.line');
    switch (a) {
      case 'nav': e.preventDefault(); closeSheet(); navigate(el.dataset.to); break;
      case 'artist': state.artist = el.dataset.v; store.set('hgn.artist', state.artist); { const box = $('#song-list'); if (box) { box.innerHTML = songListHTML(); refreshProgressUI(); } } break;
      case 'mode': state.mode = el.dataset.v; closeSheet(); navigate(state.mode === 'song' ? 'home' : state.mode); break;
      case 'opt': setOpt(el.dataset.opt, !S[el.dataset.opt]); break;
      case 'set': setOpt(el.dataset.key, el.dataset.key === 'rate' ? +el.dataset.val : el.dataset.val); break;
      case 'expand': setOpen(li, !li.classList.contains('open')); break;
      case 'expand-all':
        state.allOpen = !state.allOpen; $$('.line').forEach((x) => setOpen(x, state.allOpen));
        el.textContent = state.allOpen ? '모두 접기' : '모두 펼치기'; break;
      case 'tok': selectTok(li, +el.dataset.i); break;
      case 'tok-close': clearSel(li); break;
      case 'tok-step': selectTok(li, +el.dataset.i); break;
      case 'reveal': if (ROOT.classList.contains('hide-ko')) el.classList.toggle('revealed'); break;
      case 'speak': speak(el.dataset.say); break;
      case 'speak-line': { const l = lineOf(li); if (l) speak(l.toks.map(sayOf).join('')); break; }
      case 'toggle-line': { const on = Progress.toggle('l', el.dataset.lk); remember(li); toast(on ? '이해한 줄로 표시했어요' : '이해한 줄 표시를 풀었어요'); break; }
      case 'toggle-word': { const on = Progress.toggle('w', el.dataset.wk); toast(on ? '외운 단어에 넣었어요' : '외운 단어에서 뺐어요'); break; }
      case 'goto-line': gotoLine(el.dataset.song, +el.dataset.line); break;
      case 'vx': { const v = el.closest('.vrow'); setVOpen(v, !v.classList.contains('open')); break; }
      case 'kana': selectKana(el); break;
      case 'kmode': {
        state.kmode = el.dataset.v; const pg = $('#kana-page'); if (pg) pg.className = 'kmode-' + state.kmode;
        $$('[data-a="kmode"]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === state.kmode)));
        { const card = $('#kdetail'); if (card && state.ksel) card.innerHTML = kanaDetailHTML(state.ksel); } break;
      }
      case 'q-ans': {
        const q = state.quiz, c = q.cur; if (!c || c.picked != null) break;
        c.picked = +el.dataset.i; q.total++;
        if (c.labels[c.picked] === c.ans) { q.right++; q.streak++; if (q.streak > q.best) { q.best = q.streak; store.set('hgn.kanaBest', q.best); } } else q.streak = 0;
        renderQuiz(); speak(c.h);
        const nb = $('#quiz [data-a="q-next"]'); if (nb) nb.focus({ preventScroll: true });
        break;
      }
      case 'q-next': qNew(); renderQuiz(); { const b0 = $('#quiz .q-btn'); if (b0) b0.focus({ preventScroll: true }); } break;
      case 'q-opt': state.quiz[el.dataset.key] = el.dataset.v; qNew(); renderQuiz(); break;
      case 'jump': { const t = document.getElementById(el.dataset.target); if (t) t.scrollIntoView({ block: 'start', behavior: smooth() }); break; }
      case 'hist': histGo(+el.dataset.d); break;
      case 'download': saveOffline(el); break;
      case 'open-settings': openSheet(); break;
      case 'close-settings': closeSheet(); break;
      case 'reset':
        if (el.classList.contains('armed')) {
          clearTimeout(state.resetT); Progress.clear(); el.classList.remove('armed'); el.textContent = '학습 기록 지우기'; toast('학습 기록을 모두 지웠어요');
        } else {
          el.classList.add('armed'); el.textContent = '한 번 더 누르면 모두 지워져요';
          clearTimeout(state.resetT); state.resetT = setTimeout(() => { el.classList.remove('armed'); el.textContent = '학습 기록 지우기'; }, 4000);
        }
        break;
    }
  });
  $('#sheet').addEventListener('change', (e) => { const i = e.target.closest('input[data-opt]'); if (i) setOpt(i.dataset.opt, i.checked); });
  $('#scrim').addEventListener('click', closeSheet);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

  /* ── 시작 ─────────────────────────────────────────────── */
  $('#side-songs').innerHTML = ARTISTS.map((a) => {
    const list = CATALOG.filter((c) => c.artist === a.id); if (!list.length) return '';
    return '<p class="side-artist">' + esc(a.ko) + '</p>' + list.map((c) => (c.status === 'ready'
      ? '<button class="nav-item song-item" data-a="nav" data-to="song.' + c.id + '" data-nav="song.' + c.id + '"><span class="si-t">' + rich(c.title) + '</span>' + (c.demo ? '<span class="si-tag">예시</span>' : '') + '</button>'
      : '<div class="nav-item song-item soon" aria-disabled="true"><span class="si-t">' + rich(c.title) + '</span><span class="si-tag">준비 중</span></div>')).join('');
  }).join('');
  applyS();
  loadWords();
  Progress.load();
  updateSyncLabel();
  setupDownload();
  state.route = fromHash();
  /* 언어 선택 페이지(../index.html)로 가는 링크는 GitHub Pages처럼 japanese/ 폴더 안에서 열렸을 때만 보여요. 아티팩트나 내려받은 파일에는 위 폴더가 없어요. */
  if (/\/japanese\/(index\.html)?$/.test(location.pathname)) $$('[data-lang-back]').forEach((el) => { el.hidden = false; });
  initHistory();
  route();
  Progress.connect();
})();
</script>
