<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0;padding:0}</style>
<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>일본어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 공책 — 데스크톱은 왼쪽 목차(곡·가이드) + 본문, 휴대폰은 상단 바 + 하단 탭. 가사 한 줄 = 노트 카드 한 장.
   색은 UI가 아니라 '문자 종류'에 쓴다: 한자 紅 · 히라가나 藍 · 가타카나 若竹 · 영어 紫. UI 강조는 山吹 하나. */
:root{
  --paper:#F3F4F7; --paper-glass:rgba(243,244,247,.9); --sheet:#FFFFFF; --sheet-2:#F7F8FA;
  --ink:#1A2030; --ink-2:#465066; --ink-3:#737D92; --rule:#E2E5EB; --rule-2:#CBD1DB;
  --accent:#A8640F; --accent-ink:#FFFFFF; --accent-soft:#F6EAD6;
  --kanji:#B0303A; --hira:#24498F; --kata:#17704B; --latin:#6E3F9C;
  --kanji-tint:#FBECEE; --hira-tint:#EAF0FA; --kata-tint:#E6F3EC; --latin-tint:#F2EBF8;
  --scrim:rgba(14,18,28,.42); --shadow:0 12px 40px rgba(20,28,45,.16);
  --font-jp:"IBM Plex Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif; /* 한국어(IBM Plex Sans KR)와 같은 가족이라 한 줄에 섞여도 굵기·높이가 맞아요 */
  --font-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --font-mono:var(--font-ui); /* 숫자·로마자도 본문과 같은 글꼴(고정폭 글꼴은 쓰지 않아요). 자릿수는 tabular-nums로 맞춰요 */
  --lyric:1.55rem; --topbar-h:56px; --gutter:16px; --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12151C; --paper-glass:rgba(18,21,28,.9); --sheet:#1A1F29; --sheet-2:#151922;
    --ink:#E7EAF0; --ink-2:#B3BACA; --ink-3:#8A92A5; --rule:#2A303D; --rule-2:#3A4252;
    --accent:#E2A34A; --accent-ink:#1A1206; --accent-soft:#3A2C17;
    --kanji:#FF8E93; --hira:#93B4F5; --kata:#6FD4A6; --latin:#CDA6F0;
    --kanji-tint:#3A2125; --hira-tint:#1E2A42; --kata-tint:#183329; --latin-tint:#2E2340;
    --scrim:rgba(0,0,0,.6); --shadow:0 12px 40px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#12151C; --paper-glass:rgba(18,21,28,.9); --sheet:#1A1F29; --sheet-2:#151922;
  --ink:#E7EAF0; --ink-2:#B3BACA; --ink-3:#8A92A5; --rule:#2A303D; --rule-2:#3A4252;
  --accent:#E2A34A; --accent-ink:#1A1206; --accent-soft:#3A2C17;
  --kanji:#FF8E93; --hira:#93B4F5; --kata:#6FD4A6; --latin:#CDA6F0;
  --kanji-tint:#3A2125; --hira-tint:#1E2A42; --kata-tint:#183329; --latin-tint:#2E2340;
  --scrim:rgba(0,0,0,.6); --shadow:0 12px 40px rgba(0,0,0,.5);
  color-scheme:dark;
}
:root[data-size="s"]{ --lyric:1.3rem }
:root[data-size="l"]{ --lyric:1.85rem }
:root[data-size="xl"]{ --lyric:2.2rem }

*,*::before,*::after{ box-sizing:border-box }
[hidden]{ display:none !important }
body{ background:var(--paper); color:var(--ink); font:400 1rem/1.65 var(--font-ui); -webkit-text-size-adjust:100% }
button{ font:inherit; color:inherit; background:none; border:0; padding:0; margin:0; cursor:pointer; text-align:inherit }
a{ color:inherit }
h1,h2,h3,h4{ margin:0; text-wrap:balance }
p,ul,ol,dl{ margin:0 }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px }
.jp{ font-family:var(--font-jp) }
.mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums }
.muted{ color:var(--ink-3) }
.grow{ flex:1 }
.eyebrow{ font:600 .74rem/1.3 var(--font-ui); letter-spacing:.06em; color:var(--ink-3) }

/* 문자 색 */
.colorize .s-k,.force-color .s-k{ color:var(--kanji) }
.colorize .s-h,.force-color .s-h{ color:var(--hira) }
.colorize .s-a,.force-color .s-a{ color:var(--kata) }
.colorize .s-l,.force-color .s-l{ color:var(--latin) }
ruby{ ruby-position:over }
rt{ font-family:var(--font-jp); font-size:.5em; font-weight:400; color:var(--ink-3); letter-spacing:0 }
ruby.sp .rb{ text-decoration:underline dashed var(--accent) 1.5px; text-underline-offset:.3em }
ruby.sp rt{ color:var(--accent) }
/* 가사 본문은 후리가나·한글 발음을 꺼도 자리를 비워 둬서, 켜고 끌 때 글자 위치가 움직이지 않아요. */
.no-furi .lyric rt{ visibility:hidden }
.no-furi .chip rt{ display:none }

/* 뼈대 */
.shell{ display:grid; grid-template-columns:minmax(0,1fr); min-height:100vh }
.side{ display:none }
.col{ min-width:0; display:flex; flex-direction:column }
.topbar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; height:var(--topbar-h); display:flex; align-items:center; gap:12px; padding-inline:var(--gutter); background:var(--paper-glass); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); border-bottom:1px solid var(--rule) }
.brand{ display:flex; align-items:baseline; gap:8px }
.brand-ko{ font-weight:700; letter-spacing:-.01em }
.view{ width:100%; max-width:1120px; margin-inline:auto; padding-inline:var(--gutter); padding-block:20px calc(100px + env(safe-area-inset-bottom,0px)); min-width:0 }
.nav-glyph{ display:inline-grid; place-items:center; width:18px; height:18px; font-family:var(--font-jp); font-weight:400; font-size:1rem; line-height:1 }
.nav-glyph.big{ width:22px; height:22px; font-size:1.2rem }
.tabbar{ position:fixed; left:0; right:0; bottom:0; z-index:30; display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); background:var(--sheet); border-top:1px solid var(--rule); padding-bottom:env(safe-area-inset-bottom,0px) }
.tabbar button{ display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 0 7px; font-size:.7rem; color:var(--ink-3); text-align:center }
.tabbar button[aria-current="page"]{ color:var(--ink); font-weight:600 }
.ico{ flex:none; width:36px; height:36px; display:inline-grid; place-items:center; border-radius:8px; color:var(--ink-3) }
.ico:hover{ background:var(--sheet-2); color:var(--ink) }
.hist{ flex:none; display:flex; gap:2px; margin-left:-8px }
.hist .ico{ color:var(--ink-2) }
.hist .ico:disabled{ opacity:.3; cursor:default; background:none; color:var(--ink-3) }
.no-tts [data-a="speak"],.no-tts [data-a="speak-line"],.no-tts [data-tts]{ display:none }
html:not(.can-dl) [data-dl]{ display:none }

@media (min-width:960px){
  :root{ --topbar-h:0px; --gutter:44px }
  .shell{ grid-template-columns:256px minmax(0,1fr) }
  .side{ display:flex; flex-direction:column; gap:26px; position:sticky; top:env(safe-area-inset-top,0px); height:100vh; overflow-y:auto; padding:28px 18px; border-right:1px solid var(--rule); background:var(--sheet) }
  .topbar,.tabbar{ display:none }
  .view{ padding-block:40px 80px }
  .side .hist{ margin:-12px 0 -14px 2px }
}
.side-brand{ display:grid; gap:2px; padding-inline:10px }
.side-brand .brand-ko{ font-size:1.12rem }
.side-nav{ display:grid; gap:2px }
.nav-item{ width:100%; display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; color:var(--ink-2); font-weight:500; font-size:.95rem; text-decoration:none }
.nav-item:hover{ background:var(--sheet-2); color:var(--ink) }
.nav-item[aria-current="page"]{ background:var(--paper); color:var(--ink); font-weight:600 }
.side-h{ padding-inline:10px; margin-bottom:4px }
.song-item .si-t{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.si-tag{ flex:none; font-size:.7rem; color:var(--ink-3); border:1px solid var(--rule); border-radius:999px; padding:1px 7px }
.song-item.soon{ color:var(--ink-3); cursor:default }
.song-item.soon:hover{ background:none; color:var(--ink-3) }
.side-foot{ margin-top:auto; display:grid; gap:6px }
.side-sync{ display:flex; align-items:center; gap:8px; padding-inline:10px; font-size:.76rem; color:var(--ink-3) }
.side-sync::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--rule-2) }
.side-sync[data-on="1"]::before{ background:var(--kata) }

/* 공통 블록 */
.block{ display:grid; gap:16px; padding-block:32px }
.block + .block{ border-top:1px solid var(--rule) }
.block-head{ display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:4px 16px }
.h2{ font-size:1.3rem; font-weight:700; letter-spacing:-.01em }
.page-head{ display:grid; gap:10px; padding-bottom:24px; border-bottom:1px solid var(--rule) }
.page-title{ font-size:clamp(1.8rem,5vw,2.6rem); font-weight:700; letter-spacing:-.02em; line-height:1.2 }
.lede{ max-width:40rem; color:var(--ink-2); font-size:1.03rem }
.empty{ padding:32px 16px; text-align:center; color:var(--ink-3); border:1px dashed var(--rule-2); border-radius:12px; list-style:none }
.tg{ flex:none; display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; border:1px solid var(--rule-2); background:var(--sheet); font-size:.85rem; color:var(--ink-2); white-space:nowrap }
.tg:hover{ border-color:var(--ink-3); color:var(--ink) }
.tg[aria-pressed="true"]{ background:var(--ink); color:var(--paper); border-color:var(--ink) }
.tg.sm{ padding:4px 10px; font-size:.8rem }
.tg-sep{ flex:none; width:1px; height:20px; background:var(--rule-2); margin-inline:2px }
.aside-box{ display:block; padding:14px 16px; border-radius:var(--radius); background:var(--sheet-2); border:1px dashed var(--rule-2); font-size:.93rem; color:var(--ink-2) }
/* 상자 안의 글과 일본어 조각이 한 문단으로 이어지도록 block으로 둬요(grid면 조각마다 줄이 갈라져요). */
.aside-box > .eyebrow{ display:block; margin-bottom:4px }
.aside-box > p + p{ margin-top:6px }
.ref{ font-size:.76rem; color:var(--ink-2); text-decoration:underline; text-underline-offset:2px; text-decoration-color:var(--rule-2) }
.ref:hover{ color:var(--ink); text-decoration-color:currentColor }

/* 홈 */
.hero{ display:grid; gap:18px; padding-block:8px 32px }
.hero-title{ font-weight:700; font-size:clamp(2rem,7.5vw,3.6rem); line-height:1.3; letter-spacing:-.01em }
.legend{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px }
@media (min-width:640px){ .legend{ grid-template-columns:repeat(4,minmax(0,1fr)) } }
.lg{ display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:var(--radius); background:var(--sheet); border:1px solid var(--rule); min-width:0 }
.lg-ch{ flex:none; font-family:var(--font-jp); font-weight:400; font-size:1.9rem; line-height:1; width:1.15em; text-align:center }
.lg-k .lg-ch{ color:var(--kanji) } .lg-h .lg-ch{ color:var(--hira) } .lg-a .lg-ch{ color:var(--kata) } .lg-l .lg-ch{ color:var(--latin) }
.lg b{ display:block; font-size:.95rem }
.lg small{ display:block; color:var(--ink-3); font-size:.78rem; line-height:1.4 }
.resume{ justify-self:start; display:inline-flex; align-items:center; gap:8px; padding:9px 14px; border-radius:999px; background:var(--accent-soft); color:var(--ink); font-size:.9rem; font-weight:500 }
.song-list{ display:grid; gap:22px }
.artist-group{ display:grid; gap:10px }
.artist-h{ display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 10px; font-size:1.02rem; font-weight:700 }
.artist-h .jp{ font-size:.85rem; font-weight:400; color:var(--ink-3) }
.artist-about{ padding:20px; border:1px solid var(--rule); border-radius:12px; background:var(--sheet) }
.side-artist{ padding:8px 10px 2px; font-size:.72rem; font-weight:600; color:var(--ink-3) }
.cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr)); gap:14px }
.song-card{ display:grid; align-content:start; gap:10px; padding:18px; border-radius:12px; background:var(--sheet); border:1px solid var(--rule); text-decoration:none; transition:border-color .15s,transform .15s }
a.song-card:hover{ border-color:var(--rule-2); transform:translateY(-1px) }
.song-card.soon{ background:transparent; border-style:dashed }
.sc-top{ display:flex; justify-content:space-between; align-items:center; gap:8px }
.pill{ font:500 .72rem/1 var(--font-ui); padding:5px 9px; border-radius:999px; background:var(--sheet-2); color:var(--ink-2); border:1px solid var(--rule); white-space:nowrap }
.pill.ready{ background:var(--kata-tint); color:var(--kata); border-color:transparent }
.pill.demo{ background:var(--accent-soft); color:var(--accent); border-color:transparent }
.sc-meta{ font-size:.76rem; color:var(--ink-3); text-align:right }
.sc-title{ font-size:1.45rem; font-weight:700; letter-spacing:-.01em; line-height:1.25; display:flex; align-items:flex-end; min-height:1.8em } /* 후리가나가 있는 제목과 없는 제목의 높이를 맞춰요 */
.sc-sub{ color:var(--ink-2); font-size:.9rem }
.prog{ display:grid; gap:6px }
.prog-bar{ height:6px; border-radius:99px; background:var(--rule); overflow:hidden }
.prog-bar i{ display:block; height:100%; width:0; background:var(--accent); border-radius:inherit; transition:width .3s }
.prog-txt{ display:flex; justify-content:space-between; gap:8px; font:400 .74rem/1.2 var(--font-mono); color:var(--ink-3); font-variant-numeric:tabular-nums }
.steps{ list-style:none; padding:0; display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr)); counter-reset:step }
.steps li{ counter-increment:step; display:grid; align-content:start; gap:6px; padding-top:14px; border-top:2px solid var(--ink) }
.steps li::before{ content:counter(step,decimal-leading-zero); font:500 .8rem var(--font-mono); color:var(--accent) }
.steps b{ font-size:1rem }
.steps p{ font-size:.9rem; color:var(--ink-2) }
.band{ display:grid; gap:28px }
@media (min-width:860px){ .band{ grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) } }
.band-text{ display:grid; align-content:start; gap:14px }
.band-text > p{ color:var(--ink-2) }
.members{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px }
.member{ display:grid; padding:10px 12px; background:var(--sheet); border:1px solid var(--rule); border-radius:8px; min-width:0 }
.member .jp{ font-weight:600; font-size:1.05rem; line-height:1.9 }
.member small{ color:var(--ink-3); font-size:.78rem }
.timeline{ list-style:none; padding:0; display:grid; margin-top:8px }
.timeline li{ display:grid; grid-template-columns:3.2rem minmax(0,1fr); gap:12px; padding:10px 0; border-bottom:1px solid var(--rule) }
.tl-y{ font:500 .85rem/1.6 var(--font-mono); color:var(--accent); font-variant-numeric:tabular-nums }
.tl-t{ font-weight:600 }
.tl-d{ display:block; font-size:.84rem; color:var(--ink-2) }

/* 곡 페이지 */
.song-head{ display:grid; gap:8px; padding-bottom:22px }
.back{ display:inline-flex; align-items:center; gap:4px; font-size:.85rem; color:var(--ink-3); width:max-content; margin-bottom:6px }
.back:hover{ color:var(--ink) }
.song-title{ font-size:clamp(2rem,6vw,3rem); font-weight:700; letter-spacing:-.02em; line-height:1.15 }
.song-sub{ color:var(--ink-2); max-width:40rem }
.song-head .prog{ max-width:420px; margin-top:8px }
.tabs{ display:flex; gap:2px; border-bottom:1px solid var(--rule); overflow-x:auto; scrollbar-width:none; margin-bottom:6px }
.tabs::-webkit-scrollbar{ display:none }
.tab{ flex:none; padding:10px 14px; color:var(--ink-3); font-weight:500; border-bottom:2px solid transparent; margin-bottom:-1px; text-decoration:none }
.tab:hover{ color:var(--ink) }
.tab[aria-selected="true"]{ color:var(--ink); border-color:var(--ink); font-weight:600 }
.tab .cnt{ font:400 .72rem var(--font-mono); color:var(--ink-3); margin-left:5px }
.toolbar{ position:sticky; top:calc(env(safe-area-inset-top,0px) + var(--topbar-h)); z-index:10; display:flex; align-items:center; gap:6px; overflow-x:auto; scrollbar-width:none; margin-inline:calc(-1 * var(--gutter)); padding:10px var(--gutter); background:var(--paper-glass); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px) }
.toolbar::-webkit-scrollbar{ display:none }
.song-layout{ display:grid; gap:32px; padding-top:10px }
.lines-col{ min-width:0; max-width:780px }
.rail{ display:none }
@media (min-width:1240px){
  .song-layout{ grid-template-columns:minmax(0,1fr) 220px }
  .rail{ display:block; position:sticky; top:72px; align-self:start }
  .sec-jump{ display:none }
}
.rail-box{ display:grid; gap:8px; padding-bottom:18px; margin-bottom:18px; border-bottom:1px solid var(--rule) }
.rail-link{ display:flex; justify-content:space-between; gap:8px; padding:3px 0; font-size:.88rem; color:var(--ink-2) }
.rail-link:hover{ color:var(--ink) }
.rail-link .mono{ font-size:.75rem; color:var(--ink-3) }
.legend-inline{ display:none; flex-wrap:wrap; gap:4px 14px; font-size:.78rem; color:var(--ink-3); margin-bottom:14px }
.colorize .legend-inline{ display:flex }
.legend-inline span{ display:inline-flex; align-items:center; gap:6px }
.legend-inline span::before{ content:""; width:.62em; height:.62em; border-radius:2px; background:var(--rule-2) }
.legend-inline .li-k::before{ background:var(--kanji) } .legend-inline .li-h::before{ background:var(--hira) }
.legend-inline .li-a::before{ background:var(--kata) } .legend-inline .li-l::before{ background:var(--latin) }
.legend-inline .li-sp::before{ width:1.1em; height:0; border-radius:0; background:none; border-bottom:1.5px dashed var(--accent) }
.sec-jump{ display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; margin-bottom:16px }
.sec{ display:grid; gap:10px; margin-bottom:30px; scroll-margin-top:calc(var(--topbar-h) + 64px) }
.sec.cont{ margin-top:-12px }
.sec-h{ display:flex; align-items:center; gap:10px; font-size:.8rem; font-weight:600; letter-spacing:.04em; color:var(--ink-3); padding-block:4px }
.sec-h::after{ content:""; flex:1; height:1px; background:var(--rule) }
.sec-note{ font-size:.9rem; color:var(--ink-2) }
.line-list{ list-style:none; padding:0; display:grid; gap:10px }
.line{ background:var(--sheet); border:1px solid var(--rule); border-radius:var(--radius); scroll-margin-top:calc(var(--topbar-h) + 72px) }
.line.open{ border-color:var(--rule-2) }
.line.flash{ animation:flash 1.6s ease-out }
@keyframes flash{ 0%,30%{ box-shadow:0 0 0 3px var(--accent) } 100%{ box-shadow:0 0 0 0 transparent } }
.line-head{ display:flex; align-items:center; gap:4px; padding:8px 10px 0 16px }
.ln{ font:500 .75rem var(--font-mono); color:var(--ink-3); font-variant-numeric:tabular-nums }
.line.done .ln{ color:var(--accent) }
.check{ flex:none; width:30px; height:30px; display:inline-grid; place-items:center; border-radius:50%; border:1.5px solid var(--rule-2); color:transparent; margin-left:4px }
.check:hover{ border-color:var(--accent); color:var(--accent) }
.check[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink) }
.lyric{ font-family:var(--font-jp); font-weight:400; font-size:var(--lyric); line-height:2.1; padding:0 16px; line-break:strict; overflow-wrap:anywhere }
.tok{ cursor:pointer; border-radius:4px; transition:background-color .12s }
.tok:hover{ background:var(--sheet-2) }
.tok.punct{ cursor:default }
.tok.punct:hover{ background:none }
.tok.sel{ background:var(--accent-soft) }
.gaps .lyric .tok:not(.punct){ margin-inline:.08em }
.gaps .lyric .tok:not(.punct) > .tok-jp{ box-shadow:inset 0 -2px 0 var(--rule-2) }
.kr-map{ line-height:1.2 }
.kr-map .tok-jp{ line-height:2.1 }

.chip-m{ font-size:.72rem; color:var(--ink-3); max-width:8.5em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.tokpanel{ display:grid; gap:12px; margin-top:10px; padding:12px 14px 14px; background:var(--sheet-2); border:1px solid var(--rule); border-radius:10px }

.notes-layout{ display:grid; gap:16px; max-width:780px; padding-top:16px }

.vcount{ font:400 .78rem var(--font-mono); color:var(--ink-3); padding-bottom:8px; font-variant-numeric:tabular-nums }

.v-mean{ font-size:.96rem }
.v-chev{ display:inline-grid; color:var(--ink-3); transition:transform .2s }
.vrow.open .v-chev{ transform:rotate(180deg) }
.v-act{ display:flex; align-items:center; gap:2px }
.vtools-r{ display:inline-flex; flex-wrap:wrap; align-items:center; gap:10px }
.seg-label{ align-self:center; min-width:2.6rem; font-size:.74rem; font-weight:600; letter-spacing:.04em; color:var(--ink-3) }
.tg .cnt{ font:400 .7rem var(--font-mono); opacity:.7 }
.lv{ display:inline-block; padding:0 6px; border:1px solid var(--ink-3); border-radius:4px; font:600 .7rem/1.5 var(--font-mono); color:var(--ink); background:var(--sheet); white-space:nowrap; font-variant-numeric:tabular-nums }

.wd-block{ display:grid; gap:8px; min-width:0 }
.wd-block .d-label{ margin-bottom:0 }
.ctx{ display:grid; gap:2px; padding:10px 12px; border-radius:8px; background:var(--sheet-2) }

.wex{ display:grid; gap:0 }

.forms{ display:grid; grid-template-columns:repeat(auto-fill,minmax(8.6rem,1fr)); gap:6px }

.rels{ display:flex; flex-wrap:wrap; gap:6px }

.tp-more{ border-top:1px dashed var(--rule-2); padding-top:10px }
.tp-more summary{ cursor:pointer; font-size:.84rem; font-weight:600; color:var(--ink-2) }

/* 가이드 */
.toc{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px }

/* 히라가나·가타카나 */
.hero-links{ display:flex; flex-wrap:wrap; gap:8px }

@media (min-width:1000px){
  .kana-wrap{ grid-template-columns:minmax(0,1fr) 300px; align-items:start }

}
.k-sub{ font-size:1.05rem; font-weight:700; margin-top:12px; scroll-margin-top:calc(var(--topbar-h) + 12px) }
.k-p{ color:var(--ink-2); font-size:.94rem }
.terms{ display:grid; gap:8px; grid-template-columns:repeat(auto-fill,minmax(min(100%,20rem),1fr)) }

.k-jp{ margin-left:6px; font-size:.82rem; font-weight:400; color:var(--ink-3) }
.kgrid{ display:grid; grid-template-columns:2.6rem repeat(var(--cols,5),minmax(0,1fr)); gap:4px; max-width:560px }
.kg-head{ text-align:center; font:500 .72rem var(--font-mono); color:var(--ink-3); padding-bottom:2px }
.kg-row{ align-self:center; font-family:var(--font-jp); font-size:.82rem; font-weight:600; color:var(--ink-3); text-align:center }
.kcell{ display:grid; justify-items:center; gap:0; padding:5px 2px 4px; min-width:0; border:1px solid var(--rule); border-radius:8px; background:var(--sheet); text-align:center }

.kc-chars{ display:flex; align-items:baseline; justify-content:center; gap:3px; font-family:var(--font-jp); font-weight:400; line-height:1.25 }
.kh{ font-size:1.45rem; color:var(--hira) }
.kk{ font-size:1rem; color:var(--kata) }
.kmode-h .kk,.kmode-k .kh{ display:none }
.kmode-k .kk{ font-size:1.45rem }
.kcell small{ font:400 .66rem var(--font-mono); color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100% }
.kdetail{ display:grid; gap:12px; padding:16px; background:var(--sheet); border:1px solid var(--rule-2); border-radius:12px; max-width:560px }

.kd-one{ display:grid; justify-items:center; gap:2px; padding:10px 6px; border-radius:10px }

.kd-one.a{ background:var(--kata-tint) }
.kd-label{ font-size:.72rem; font-weight:600; color:var(--ink-3) }
.kd-big{ font-family:var(--font-jp); font-weight:400; font-size:3rem; line-height:1.25 }
.kd-one.h .kd-big{ color:var(--hira) }
.kd-one.a .kd-big{ color:var(--kata) }
.kd-src{ font-size:.78rem; color:var(--ink-2); text-align:center }
.kd-src .jp{ font-size:1.15rem; font-weight:600; color:var(--kanji) }
.kd-read{ display:flex; align-items:center; gap:10px; font-size:1rem }
.kd-ro{ font:500 1rem var(--font-mono) }
.ext-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,10.5rem),1fr)); grid-auto-rows:1fr; gap:8px }

.ext-w{ font-size:.85rem; color:var(--ink-2) }

.conf-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,15rem),1fr)); gap:8px }

.quiz{ display:grid; gap:12px; max-width:560px }

.hint{ font-size:.8rem; color:var(--ink-3) }
.sync{ font-size:.86rem; color:var(--ink-2); padding:12px 14px; border-radius:10px; background:var(--sheet-2) }
.danger{ justify-self:start; padding:8px 12px; border-radius:8px; border:1px solid var(--rule-2); color:var(--kanji); font-size:.85rem }
.danger.armed{ background:var(--kanji); border-color:var(--kanji); color:var(--sheet) }
.dl-btn{ justify-self:start; padding:8px 12px; border-radius:8px; border:1px solid var(--rule-2); color:var(--ink); font-size:.85rem; font-weight:500 }
.dl-btn:disabled{ opacity:.55 }
.tg:disabled{ opacity:.45; cursor:default }
.mode-tg{ flex-wrap:nowrap; gap:4px }
.lang-back{ padding-inline:10px; font-size:.8rem; color:var(--ink-3) }
.lang-back:hover{ color:var(--ink) }
.side .mode-tg{ padding-inline:10px }
.food-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,13.5rem),1fr)); gap:8px }
.food{ display:grid; align-content:start; gap:3px; padding:10px 12px 12px; border:1px solid var(--rule); border-radius:var(--radius); background:var(--sheet) }
.food-top{ display:flex; align-items:center; justify-content:space-between; gap:6px }
.food-jp{ font-family:var(--font-jp); font-weight:400; font-size:1.35rem; line-height:1.9 }
.food-hg{ font-size:.8rem; color:var(--ink-3) }
.food-m{ font-size:.95rem; font-weight:600 }
.food-n{ font-size:.82rem; color:var(--ink-2) }
.food-talk{ display:grid; gap:8px }
.food-who{ flex:none; padding:1px 7px; border-radius:5px; font-size:.72rem; font-weight:600; color:var(--ink-2); background:var(--sheet-2); border:1px solid var(--rule) }
.toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(78px + env(safe-area-inset-bottom,0px)); z-index:60; max-width:calc(100vw - 32px); padding:9px 16px; border-radius:999px; background:var(--ink); color:var(--paper); font-size:.86rem; box-shadow:var(--shadow); text-align:center }
@media (min-width:960px){ .toast{ bottom:28px } }
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{ transition:none!important; animation:none!important; scroll-behavior:auto!important } }

t":"걸어서 / 몇 분 / 입니까 / 까","g":[{"k":"て형 = 수단","d":"'~해서'로 수단을 나타내요. 歩いて行く(걸어서 가다), 走って帰る(뛰어서 돌아가다)."}],"s":"何分은 ん 뒤라서 ふん이 ぷん으로 바뀌어 '남푼'이에요."},{"id":"f4","who":"나","tk":[{"t":"この"},{"t":"{地図|ちず}"},{"t":"の"},{"t":"どこ"},{"t":"です"},{"t":"か"}],"ko":"이 지도에서 어디예요?","lit":"이 / 지도 / 의 / 어디 / 입니까 / 까","g":[{"k":"〜のどこ","d":"'~의 어디'. この地図のどこですか = 이 지도의 어디예요? 한국어로는 '이 지도에서 어디예요?'가 자연스러워요."}],"c":"휴대폰 지도를 보여 주며 이렇게 물으면 손가락으로 짚어 줘요.","grp":"map"},{"id":"f6","who":"상대","tk":[{"t":"{二|ふた}つ{目|め}","p":"명사","m":"두 번째","w":"二つ(ふたつ, 두 개) + 目(め, ~째). 숫자 뒤의 目는 '~번째'예요.","n":"一つ目(ひとつめ, 첫 번째), 三つ目(みっつめ, 세 번째)."},{"t":"の"},{"t":"{角|かど}","p":"명사","m":"모퉁이","n":"角(뿔 각). 길에서는 '모퉁이'라는 뜻이에요."},{"t":"を"},{"t":"{左|ひだり}","p":"명사","m":"왼쪽"},{"t":"に"},{"t":"{曲|ま}がって","p":"동사","m":"돌아","b":"{曲|ま}がる","bm":"구부러지다, (길을) 돌다","w":"어간 曲는 한자, がって는 히라가나예요.","n":"曲(굽을 곡). 曲がる = 꺾어 돌다. 左に曲がる = 왼쪽으로 돌다."},{"t":"ください"}],"ko":"두 번째 모퉁이에서 왼쪽으로 도세요","lit":"두 번째 / 의 / 모퉁이 / 를 / 왼쪽 / 으로 / 돌아 / 주세요","g":[{"k":"〜を{曲|ま}がる","d":"'~를 돌다'. 지나가는 장소에는 を를 써요. 角を曲がる(모퉁이를 돌다), 道を渡る(길을 건너다)."}],"s":"二つ目의 目는 '눈'이 아니라 '~번째'라는 뜻이에요. 같은 한자도 붙는 자리에 따라 뜻이 달라져요.","grp":"map"}]},{"label":"긴급 상황","note":"일본의 긴급 전화는 경찰 110, 구급차·소방 119예요.","lines":[{"id":"g1","who":"나","tk":[{"t":"{助|たす}けて","p":"동사","m":"도와","b":"{助|たす}ける","bm":"돕다, 구하다","w":"어간 助는 한자, けて는 히라가나예요.","n":"助(도울 조). 한국어 '조수(助手)'의 助예요."},{"t":"ください"}],"ko":"도와주세요","lit":"도와 / 주세요","g":[{"k":"て형 + ください","d":"'~해 주세요'. 급할 때는 助けて!만 크게 외쳐도 돼요."}],"c":"위급할 때는 ください를 빼고 助けて!(도와줘!)라고 외치는 게 더 빨라요."},{"id":"g2","who":"나","tk":[{"t":"{病院|びょういん}","p":"명사","m":"병원","n":"한국어 '병원(病院)'과 같은 한자어예요. 美容院(びよういん, 미용실)과 소리가 비슷하니 조심하세요."},{"t":"は"},{"t":"どこ"},{"t":"です"},{"t":"か"}],"ko":"병원은 어디예요?","lit":"병원 / 은 / 어디 / 입니까 / 까","g":[{"k":"〜はどこですか","d":"어디서나 쓰는 틀이에요. 薬局(やっきょく, 약국)はどこですか."}],"s":"病院(びょういん)과 美容院(びよういん)은 요온 びょ와 び·よ 차이 하나로 뜻이 갈라져요."},{"id":"g3","who":"나","tk":[{"t":"{気分|きぶん}","p":"명사","m":"몸 상태, 기분","n":"気分が悪い = 속이 안 좋다, 몸이 안 좋다. 기분이 나쁠 때가 아니라 몸이 안 좋을 때 써요."},{"t":"が"},{"t":"{悪|わる}い","p":"い형용사","m":"나쁘다","w":"어간 悪는 한자, い는 히라가나예요."},{"t":"です"}],"ko":"몸이 안 좋아요","lit":"기분 / 이 / 나쁘다 / 입니다","g":[{"k":"{気分|きぶん}が{悪|わる}い","d":"'몸이 안 좋다, 속이 안 좋다'. 한국어 '기분이 나쁘다'와 뜻이 달라요."}],"c":"아픈 곳을 말할 때는 頭が痛いです(머리가 아파요), お腹が痛いです(배가 아파요)처럼 써요."},{"id":"g4","who":"나","tk":[{"t":"{財布|さいふ}","p":"명사","m":"지갑","n":"財(재물 재) + 布(베 포). '돈을 넣는 천'이라는 뜻이에요."},{"t":"を"},{"t":"なくしました"}],"ko":"지갑을 잃어버렸어요","lit":"지갑 / 을 / 잃어버렸습니다","g":[{"k":"〜をなくしました","d":"'~를 잃어버렸어요'. 숙소의 鍵をなくしました와 같은 틀이에요."}],"c":"물건을 잃어버리면 역무원이나 근처 파출소(交番, こうばん)에 이 말을 하면 돼요."},{"id":"g5","who":"나","tk":[{"t":"{警察|けいさつ}","p":"명사","m":"경찰","n":"한국어 '경찰(警察)'과 같은 한자어예요."},{"t":"を"},{"t":"{呼|よ}んでください"}],"ko":"경찰을 불러 주세요","lit":"경찰 / 을 / 불러 주세요","g":[{"k":"〜を{呼|よ}んでください","d":"'~를 불러 주세요'. 사람이나 차를 부를 때 써요. タクシーを呼んでください(택시를 불러 주세요)."}],"s":"警察는 한국어와 한자가 같아서 표지판에서 바로 알아볼 수 있어요."},{"id":"g6","who":"나","tk":[{"t":"{救急車|きゅうきゅうしゃ}","p":"명사","m":"구급차","n":"救(구원할 구) + 急(급할 급) + 車(차). 한국어 '구급차'와 같은 한자어예요."},{"t":"を"},{"t":"{呼|よ}んでください"}],"ko":"구급차를 불러 주세요","lit":"구급차 / 를 / 불러 주세요","g":[{"k":"〜を{呼|よ}んでください","d":"앞 줄과 같은 틀이에요. 구급차는 119예요."}],"s":"救急車의 救急(きゅうきゅう)는 요온 きゅ가 두 번 이어져요. '큐-큐-샤'로 읽어요."}]}]},"aiwo":{"id":"aiwo","title":"{愛|あい}を{伝|つた}えたいだとか","artist":"あいみょん","year":2017,"eyebrow":"あいみょん · 2017","sub":"사랑을 전하고 싶다느니 하는 오글거리는 생각만 하며 소파에 가라앉는 하루. 기다림과 투정이 섞인 아이묭의 초기 싱글.","release":"2017년 5월 3일 · 싱글","lyricist":"あいみょん","composer":"あいみょん","listen":"https://www.youtube.com/results?search_query=%E3%81%82%E3%81%84%E3%81%BF%E3%82%87%E3%82%93+%E6%84%9B%E3%82%92%E4%BC%9D%E3%81%88%E3%81%9F%E3%81%84%E3%81%A0%E3%81%A8%E3%81%8B","intro":"愛を伝えたいだとか는 아이묭이 2017년 5월에 낸 싱글이에요. 석 달 뒤 君はロックを聴かない가 나왔고, 이듬해 マリーゴールド로 이어져요.\n\n화자는 '사랑을 전하고 싶다'느니 하는 오글거리는 생각만 하면서 너를 기다려요. 그러다 소파에 점점 가라앉고, 투덜대고, 또 기다려요. 커튼, 앞머리, 깨진 계란 프라이, 장미, 케이크 같은 집 안의 작은 물건들을 따라 읽어 보세요.","notes":[{"tag":"배경","title":"君はロックを聴かない 석 달 전","body":"2017년 5월 3일에 나온 싱글로, 같은 해 8월의 君はロックを聴かない보다 먼저 나왔어요. 세 곡 모두 '너'를 향한 마음을 노래하지만 장면이 달라요. 이 곡은 혼자 집에서 너를 기다리는 하루예요.\n\n화자가 [[{僕|ぼく}]]이고 말끝에 さ·や를 자주 붙이는 것도 君はロックを聴かない와 같아요."},{"tag":"표기","title":"聞く와 聴く","body":"이 곡은 君の'愛してる'が[[{聞|き}きたい]]처럼 보통의 [[{聞|き}く]]를 써요. 君はロックを聴かない는 음악을 귀 기울여 듣는 [[{聴|き}く]]를 썼죠.\n\n사랑한다는 말을 '듣고 싶다'는 건 음악 감상이 아니라 그냥 귀에 들리는 말이라 聞く가 자연스러워요. 같은 가수가 두 곡에서 한자를 다르게 고른 셈이에요."},{"tag":"표기","title":"馬鹿와 バカ, 薔薇 대신 バラ","body":"1절의 [[{馬鹿|ばか}な{夢|ゆめ}]](바보 같은 꿈)는 한자로, C메로의 [[バカでかい]](엄청 큰)는 가타카나로 썼어요. 같은 말인데 가타카나로 쓰면 더 가볍고 장난스러운 느낌이 나요. 馬鹿는 소리에 맞춰 한자를 빌린 아테지예요.\n\n장미는 한자로 薔薇라고 쓰지만 너무 어려워서 보통 가타카나 [[バラ]]로 써요. [[キリがない]](끝이 없다)의 キリ(切り)도 가타카나로 써서 강조했어요."},{"tag":"표기","title":"조요칸지 밖의 한자들","body":"[[{溢|あふ}れちゃう]](넘쳐 버려), [[{惹|ひ}かれない]](끌리지 않아), [[{雫|しずく}]](물방울)는 조요칸지(일상 글에 쓰도록 정한 한자 목록) 밖의 글자예요. 신문이라면 あふれる, ひかれる, しずく로 풀어 쓸 말이에요.\n\n가사에서는 이런 한자를 골라 써서 글자 모양으로 분위기를 더하기도 해요. 히게단의 繋·想와 같은 습관이에요."},{"tag":"표현","title":"臭いこと, 오글거리는 말","body":"[[{臭|くさ}いこと]]는 글자 그대로는 '냄새나는 것'이지만, 회화에서는 '오글거리는 말, 낯간지러운 말'이라는 뜻으로 써요. 臭いセリフ(오글거리는 대사)처럼요.\n\n사랑을 전하고 싶다느니 하는 생각을 스스로 '臭い'라고 부르며 쑥스러워하는 말투예요. 2절의 [[{腐|くさ}るほど]](썩을 만큼 = 아주 많이)도 같은 くさ 소리가 들어 있어 말장난처럼 들리기도 해요."},{"tag":"표현","title":"사랑의 맛, 辛い·酸っぱい·甘ったるい","body":"1절 B메로는 [[{辛|から}くて]](맵고), [[{酸|す}っぱくて]](시고), [[{甘|あま}ったるかったり]](느끼하게 달기도 하고)처럼 맛 표현을 늘어놓아요. 앞줄의 깨진 계란 프라이에 이어, 사랑이나 하루의 기분을 맛으로 빗댄 것으로 읽혀요.\n\n음식 탭의 '맛과 식감'에서 이 형용사들을 다시 볼 수 있어요."},{"tag":"표현","title":"〜わけでもない, 그런 것도 아니고","body":"[[〜わけでもない]]는 '~인 것도 아니다'라는 말로, 이 곡에 세 번이나 나와요. [[{良|い}い{男|おとこ}になるわけでもない]](좋은 남자가 될 것도 아니고), [[{言|ゆ}うわけでもない]](말하려는 것도 아니고), [[{食|く}いつくわけでもない]](덥석 먹을 것도 아니고).\n\n하고 싶은 걸 하나하나 '그렇다고 뭐가 달라지는 것도 아니고'라며 스스로 접는 말투예요. 화자의 투덜거림과 체념이 이 말에 담겨 있어요."}],"dict":{"{君|きみ}":{"p":"대명사","m":"너","w":"'너'를 뜻하는 대명사로, 한자로 쓰는 게 일반적이에요.","n":"원래 '임금'을 뜻하던 한자예요(君主 = 군주)."},"{僕|ぼく}":{"p":"대명사","m":"나 (남성)","w":"1인칭 대명사로 한자로 쓰는 게 일반적이에요.","n":"아이묭은 君はロックを聴かない처럼 이 곡에서도 화자를 僕로 써요."},"は":{"p":"조사","m":"~은/는 (주제)","n":"조사로 쓸 때는 ha가 아니라 wa로 읽어요."},"が":{"p":"조사","m":"~이/가"},"を":{"p":"조사","m":"~을/를","n":"발음은 お(o)와 같아요."},"に":{"p":"조사","m":"~에, ~에게"},"の":{"p":"조사","m":"~의"},"で":{"p":"조사","m":"~으로, ~에서"},"と":{"p":"조사","m":"~라고 (인용)"},"も":{"p":"조사","m":"~도"},"から":{"p":"조사","m":"~니까"},"さ":{"p":"조사(종조사)","m":"~야, ~말야","n":"문장 끝이나 말 중간에 붙여 가볍게 툭 던지는 말투예요. 이 곡에 아주 많이 나와요."},"や":{"p":"조사(종조사)","m":"~네, ~다 (혼잣말)","n":"문장 끝 や는 혼잣말처럼 가볍게 감정을 털어놓는 말투예요. 간사이 지방 말투로도 자주 들려요."},"よ":{"p":"조사(종조사)","m":"~야, ~할게","n":"상대에게 알리거나 다짐할 때 붙여요."},"な":{"p":"조사(종조사)","m":"~네, ~구나","n":"문장 끝 な는 혼잣말처럼 감탄할 때 붙어요."},"{少|すこ}し":{"p":"부사","m":"조금, 살짝","w":"어간 少는 한자, し는 히라가나예요."},"{男|おとこ}":{"p":"명사","m":"남자","n":"男(사내 남). 女(おんな) = 여자."},"{目|め}":{"p":"명사","m":"눈","n":"한국어 '목(目)'과 같은 한자예요."},"{今日|きょう}":{"p":"명사","m":"오늘","w":"今日는 단어 전체를 きょう로 읽는 주쿠지쿤(熟字訓)이에요."},"{明日|あした}":{"p":"명사","m":"내일","w":"明日는 단어 전체를 あした로 읽는 주쿠지쿤(熟字訓)이에요. 딱딱한 말로는 あす, みょうにち로도 읽어요."},"だんだん":{"p":"부사","m":"점점","w":"부사라 히라가나로 써요(段々).","n":"같은 소리를 두 번 겹친 말이에요. 少しずつ(조금씩)와 비슷해요."},"{夢|ゆめ}":{"p":"명사","m":"꿈","n":"한국어 '몽(夢)'과 같은 한자예요."},"バラ":{"p":"명사","m":"장미","w":"한자로는 薔薇인데 너무 어려워서 보통 가타카나로 써요. 외래어가 아닌데 가타카나로 쓰는 말이에요.","n":"동식물 이름은 가타카나로 쓰는 일이 많아요(ネコ, サクラ)."},"{花|はな}":{"p":"명사","m":"꽃","n":"한국어 '화(花)'와 같은 한자예요. 花火(はなび) = 불꽃놀이."},"{愛|あい}":{"p":"명사","m":"사랑","n":"한 글자 한자어예요(온요미 あい). 恋(こい)보다 깊고 넓은 사랑이에요."},"とりあえず":{"p":"부사","m":"일단, 우선","w":"한자로 取り敢えず라고 쓸 수 있지만 보통 히라가나로 써요.","n":"회화에서 아주 많이 써요. とりあえずビール(일단 맥주부터)는 술자리 첫 주문으로 유명해요."},"わけでもない":{"p":"표현","m":"~인 것도 아니다","w":"わけ(訳, 이유·사정)는 뜻이 옅어진 형식명사라 히라가나로 써요.","n":"わけ + でも + ない. '그렇다고 ~인 것도 아니다'. 이 곡에 세 번 나와요."}},"sections":[{"label":"1절 · Aメロ","note":"상쾌한 아침, 흔들리는 커튼과 들뜬 앞머리. 그런데 계란 프라이는 깨져 버렸어요.","lines":[{"id":"a1","tk":[{"t":"{健康的|けんこうてき}な","p":"な형용사","m":"건강한","b":"{健康的|けんこうてき}","bm":"건강함","w":"한자어 健康에 '~적'을 뜻하는 的를 붙였어요. な는 히라가나예요.","n":"한국어 '건강적'처럼 的를 붙여 な형용사를 만들어요. 積極的(せっきょくてき, 적극적)."},{"t":"{朝|あさ}","p":"명사","m":"아침","n":"한국어 '조(朝)'와 같은 한자예요. 朝ご飯(あさごはん) = 아침밥."},{"t":"だ","p":"조동사","m":"~이다"},{"t":"な"}],"ko":"건강한 아침이네","lit":"건강적인 / 아침 / 이다 / 네","g":[{"k":"〜{的|てき}","d":"한자어 + 的 = '~적'. 명사를 꾸밀 때 な를 붙여요. 健康的な朝(건강한 아침)."}],"s":"健康的은 한국어 '건강'과 같은 한자에 的가 붙은 말이라 한자만 봐도 뜻이 보여요.","c":"첫 줄은 상쾌한 아침 풍경이에요. 그런데 이어지는 줄에서 화자는 이 좋은 아침에 '너'의 말이 듣고 싶다고 해요."},{"id":"a2","tk":[{"t":"こんな","p":"연체사","m":"이런","w":"こんな·そんな·あんな·どんな는 히라가나로 써요."},{"t":"{時|とき}","p":"명사","m":"때","n":"時(때 시). こんな時に = 이럴 때에."},{"t":"に"},{"t":"{君|きみ}"},{"t":"の"},{"t":"“"},{"t":"{愛|あい}してる","p":"동사","m":"사랑해","b":"{愛|あい}する","bm":"사랑하다","w":"한자어 愛에 する를 붙인 동사예요. してる는 している의 회화체예요.","n":"일본어에서 愛してる는 아주 무게 있는 말이라 일상에서는 好き(좋아해)를 더 자주 써요."},{"t":"”"},{"t":"が"},{"t":"{聞|き}きたい","p":"동사","m":"듣고 싶어","b":"{聞|き}く","bm":"듣다","w":"어간 聞는 한자, きたい는 히라가나예요. 君はロックを聴かない의 聴く와 달리 보통의 聞く를 썼어요.","n":"동사 ます형 + たい = '~하고 싶다'. 聞く → 聞きたい."},{"t":"や"}],"ko":"이럴 때 너의 '사랑해'가 듣고 싶어","lit":"이런 / 때 / 에 / 너 / 의 / 사랑해 / 가 / 듣고 싶다 / 네","g":[{"k":"ます형 + たい","d":"'~하고 싶다'. 聞く → 聞きたい, 会う → 会いたい. 듣고 싶은 대상에는 が도 を도 써요."}],"s":"따옴표로 “ ”를 썼어요. 일본어는 보통 「 」를 쓰지만 가사에서는 이렇게 쓰기도 해요. 聞く와 聴く의 차이는 곡 노트를 보세요.","c":"상쾌한 아침이라서 오히려 너의 '사랑해'가 듣고 싶다는 거예요. 화자는 혼자 있어요."},{"id":"a3","tk":[{"t":"{揺|ゆ}れる","p":"동사","m":"흔들리는","w":"어간 揺는 한자, れる는 히라가나예요.","n":"マリーゴールド의 揺れたマリーゴールド와 같은 동사예요."},{"t":"カーテン","p":"명사","m":"커튼","w":"영어 curtain에서 온 외래어라 가타카나로 써요."}],"ko":"흔들리는 커튼","lit":"흔들리는 / 커튼","g":[{"k":"동사 + 명사","d":"동사 사전형이 그대로 명사를 꾸며요. 揺れるカーテン = 흔들리는 커튼."}],"s":"揺れる는 マリーゴールド에도 나온 동사예요. 아이묭 곡에는 바람에 흔들리는 것이 자주 나와요.","c":"창문이 열려 바람이 들어오는 아침 방 안이에요."},{"id":"a4","tk":[{"t":"{少|すこ}し","p":"부사","m":"조금, 살짝","w":"어간 少는 한자, し는 히라가나예요."},{"t":"{浮|う}いた","p":"동사","m":"들뜬, 뜬","b":"{浮|う}く","bm":"뜨다","w":"어간 浮는 한자, いた는 히라가나예요.","n":"浮く → 과거형 浮いた가 명사를 꾸며요. 浮いた前髪 = 붕 뜬 앞머리."},{"t":"{前髪|まえがみ}","p":"명사","m":"앞머리","w":"前(まえ) + 髪(かみ). 髪가 뒤에 붙으며 か가 が로 탁해졌어요(렌다쿠).","n":"髪(머리카락)는 紙(종이)·神(신)과 소리가 같아요."},{"t":"も"}],"ko":"살짝 뜬 앞머리도","lit":"조금 / 뜬 / 앞머리 / 도","g":[{"k":"〜も","d":"'~도'. 다음 줄 すべて(전부)와 이어져 '~도 전부'가 돼요."}],"s":"前髪는 前 + 髪로, 髪의 か가 が로 탁해졌어요. 두 말이 합쳐질 때 뒷말이 탁해지는 렌다쿠예요.","c":"자고 일어나 들뜬 앞머리까지 기분 좋다는 건, 그만큼 느긋하고 좋은 아침이라는 뜻이에요."},{"id":"a5","tk":[{"t":"すべて","p":"명사","m":"전부, 모두","w":"한자로 全て라고도 쓰지만 히라가나로 풀어 썼어요."},{"t":"{心地|ここち}いい","p":"い형용사","m":"기분 좋다, 쾌적하다","b":"{心地|ここち}いい","w":"心地는 단어 전체를 ここち로 읽어요. いい는 히라가나예요.","n":"心(마음) + 地(땅) = 마음의 상태. 心地いい·心地よい = 기분 좋다. 居心地(いごこち) = 머무는 느낌."},{"t":"さ"}],"ko":"전부 기분 좋아","lit":"전부 / 기분 좋다 / 야","g":[{"k":"종조사 さ","d":"문장 끝 さ는 가볍게 툭 던지는 말투예요. 心地いいさ = 기분 좋거든."}],"s":"すべて는 全て라는 한자가 있지만 히라가나로 써서 부드럽게 만들었어요.","c":"커튼도 앞머리도 다 기분 좋다는 평화로운 아침이에요. 다음 줄에서 그 분위기가 살짝 깨져요."},{"id":"a6","tk":[{"t":"それに","p":"접속사","m":"그런데, 게다가","w":"접속사라 히라가나로 써요.","n":"원래는 '게다가'라는 뜻이에요. 여기서는 앞의 좋은 기분에 '그런 와중에'라고 덧붙이는 느낌이에요."},{"t":"{割|わ}れてしまった","p":"동사","m":"깨져 버린","b":"{割|わ}れる","bm":"깨지다","w":"어간 割는 한자, れてしまった는 히라가나예요.","n":"割れる(깨지다, 자동사)와 割る(깨다, 타동사)는 짝이에요."},{"t":"{目|め}{玉|だま}{焼|や}き","p":"명사","m":"계란 프라이 (서니사이드업)","b":"{目|め}{玉|だま}{焼|や}き","w":"目(눈) + 玉(구슬) + 焼き(구이). 玉의 た가 だ로 탁해졌어요.","n":"노른자가 눈알처럼 보여서 '눈알 구이'라는 이름이 붙었어요."}],"ko":"그런데 터져 버린 계란 프라이","lit":"게다가 / 깨져 버린 / 계란 프라이","g":[{"k":"〜てしまう","d":"'~해 버리다'. 원하지 않은 일이 일어났을 때 써요. 割れる → 割れてしまった(깨져 버렸다)."}],"s":"目玉焼き는 한자 세 개에 히라가나 き가 붙어요. 한자만 보면 '눈알 구이'라는 그림이 보여요.","c":"노른자가 터진 계란 프라이예요. 완벽한 아침에 생긴 작은 실패라서 다음 줄의 '재수 없네'로 이어져요."},{"id":"a7","tk":[{"t":"ついてない","p":"동사","m":"운이 없다","b":"つく","bm":"(운이) 따르다","w":"'운이 따르다'라는 뜻일 때는 보통 히라가나로 써요.","n":"ついてる = 운이 좋다, ついてない = 운이 없다. 회화에서 아주 많이 써요."},{"t":"なあ","p":"조사(종조사)","m":"~네, ~구나","n":"な를 길게 늘인 혼잣말 말투예요."}],"ko":"재수 없네","lit":"운이 따르지 않다 / 네","g":[{"k":"ついてる · ついてない","d":"'운이 좋다 · 운이 없다'. 今日はついてない(오늘은 재수 없다)."}],"s":"つく는 붙다(付く), 도착하다(着く), 켜지다(点く) 등 한자가 많은데, '운이 따르다'일 때는 히라가나로 써요.","c":"깨진 계란 프라이 하나로 '오늘 재수 없네' 하고 투덜대는 귀여운 장면이에요."},{"id":"a8","tk":[{"t":"バランス","p":"명사","m":"균형, 밸런스","w":"영어 balance에서 온 외래어라 가타카나로 써요."},{"t":"を"},{"t":"とっても","p":"동사","m":"잡아도","b":"とる","bm":"잡다, 취하다","w":"取る라는 한자가 있지만 히라가나로 썼어요. バランスをとる = 균형을 잡다.","n":"とる → て형 とって + も = '~해도'. 부사 とっても(아주)와 소리가 같으니 앞뒤를 보고 구별해요."},{"t":"{溢|あふ}れちゃう","p":"동사","m":"넘쳐 버려","b":"{溢|あふ}れる","bm":"넘치다","w":"溢는 조요칸지 밖의 한자예요. 보통은 あふれる로 풀어 써요. ちゃう는 てしまう의 회화체예요.","n":"溢れてしまう → 회화체 溢れちゃう. 宿命의 あふれ出す도 같은 동사예요."},{"t":"や"}],"ko":"균형을 잡아도 넘쳐 버려","lit":"균형 / 을 / 잡아도 / 넘쳐 버린다 / 네","g":[{"k":"〜ちゃう (= 〜てしまう)","d":"'~해 버리다'의 회화체. 溢れてしまう → 溢れちゃう, 食べてしまう → 食べちゃう."},{"k":"て형 + も","d":"'~해도'. とる → とっても(잡아도)."}],"s":"溢는 조요칸지 밖의 어려운 한자예요. 宿命에서는 あふれ出す를 히라가나로 썼는데, 이 곡은 한자를 골랐어요.","c":"아무리 마음의 균형을 잡으려 해도 감정이 넘쳐 버린다는 고백으로 읽혀요. 계란 노른자가 넘쳐흐르는 그림과도 겹쳐요."}]},{"label":"1절 · Bメロ","note":"맵고 시고 느끼하게 단 하루. 일단 오늘은 장미에 소원을 담아요.","lines":[{"id":"b1","tk":[{"t":"{少|すこ}し"},{"t":"{辛|から}くて","p":"い형용사","m":"맵고","b":"{辛|から}い","bm":"맵다","w":"어간 辛는 한자, くて는 히라가나예요.","n":"같은 한자 辛い를 つらい로 읽으면 '괴롭다'예요. 여기서는 からい(맵다)예요."},{"t":"　"},{"t":"{少|すこ}し"},{"t":"{酸|す}っぱくて","p":"い형용사","m":"시고","b":"{酸|す}っぱい","bm":"시다","w":"어간 酸는 한자, っぱくて는 히라가나예요.","n":"酸(실 산)은 한국어 '산성(酸性)'의 酸이에요."}],"ko":"조금 맵고 조금 시고","lit":"조금 / 맵고 / 조금 / 시고","g":[{"k":"い형용사 〜くて","d":"い를 くて로 바꾸면 '~하고'. 辛い → 辛くて, 酸っぱい → 酸っぱくて. 형용사를 나란히 이어요."}],"s":"줄 가운데 전각 공백이 노래의 쉼표 역할을 해요. 少し를 두 번 되풀이해 리듬을 맞췄어요.","c":"앞의 계란 프라이에 이어 맛 표현이 이어져요. 사랑이나 하루의 기분을 맛으로 빗댄 것으로 읽혀요."},{"id":"b2","tk":[{"t":"{甘|あま}ったるかったり","p":"い형용사","m":"느끼하게 달기도 하고","b":"{甘|あま}ったるい","bm":"느끼하게 달다","w":"어간 甘는 한자, ったるかったり는 히라가나예요.","n":"甘い(달다)보다 지나치게 달아 질리는 느낌이에요. 〜たり는 '~하기도 하고'."},{"t":"さ"}],"ko":"느끼하게 달기도 하고 말야","lit":"느끼하게 달기도 하고 / 말야","g":[{"k":"〜たり","d":"과거형 た + り = '~하기도 하고'. 甘ったるかった → 甘ったるかったり. 여러 가지를 예로 들 때 써요."}],"s":"甘ったるい는 甘 한 글자 뒤에 히라가나가 길게 붙는 형용사예요. 소리만으로도 끈적하게 단 느낌이 나요.","c":"맵고, 시고, 너무 단 것까지. 좋기만 하지 않은 하루, 또는 사랑의 여러 맛으로 읽혀요."},{"id":"b3","tk":[{"t":"とりあえず"},{"t":"{今日|きょう}"},{"t":"は"}],"ko":"일단 오늘은","lit":"일단 / 오늘 / 은","g":[{"k":"とりあえず","d":"'일단, 우선'. 다른 건 제쳐 두고 먼저 하나 할 때 써요."}],"s":"とりあえず는 取り敢えず라는 한자가 있지만 보통 히라가나로 써요.","c":"복잡한 생각은 일단 접어 두고, 오늘 할 일을 정하는 말이에요. 2절에도 똑같이 나와요."},{"id":"b4","tk":[{"t":"バラ"},{"t":"の"},{"t":"{花|はな}"},{"t":"に"},{"t":"{願|ねが}い","p":"명사","m":"소원","b":"{願|ねが}い","w":"어간 願는 한자, い는 히라가나예요. 동사 願う(바라다)의 ます형이 명사가 됐어요.","n":"お願いします의 願와 같은 한자예요."},{"t":"{込|こ}めて","p":"동사","m":"담아","b":"{込|こ}める","bm":"담다, 넣다","w":"어간 込는 한자, めて는 히라가나예요.","n":"願いを込める = 소원을 담다, 心を込める = 마음을 담다. 込는 일본에서 만든 한자(국자)예요."},{"t":"さ"}],"ko":"장미꽃에 소원을 담아서 말야","lit":"장미 / 의 / 꽃 / 에 / 소원 / 담아 / 말야","g":[{"k":"〜を{込|こ}める","d":"'~를 담다'. 이 줄은 願いを込めて에서 を가 빠졌어요. 가사에서는 조사를 자주 줄여요."}],"s":"バラ는 한자 薔薇가 어려워서 가타카나로 쓰는 대표적인 말이에요. 외래어가 아닌데 가타카나인 말이에요.","c":"장미꽃 한 송이에 소원을 담는 건 조금 낭만적인 행동이에요. 다음 줄에서 스스로 '바보 같은 꿈'이라고 불러요."},{"id":"b5","tk":[{"t":"{馬鹿|ばか}な","p":"な형용사","m":"바보 같은","b":"{馬鹿|ばか}","bm":"바보, 어리석음","w":"馬鹿는 소리에 맞춰 한자를 빌린 아테지예요. C메로에서는 같은 말을 가타카나 バカ로 써요.","n":"馬(말) + 鹿(사슴)으로, 글자 뜻과는 상관없이 소리만 빌렸어요."},{"t":"{夢|ゆめ}"},{"t":"で"},{"t":"{踊|おど}ろう","p":"동사","m":"춤추자","b":"{踊|おど}る","bm":"춤추다","w":"어간 踊는 한자, ろう는 히라가나예요.","n":"君はロックを聴かない의 踊ろうよ와 같은 말이에요."}],"ko":"바보 같은 꿈속에서 춤추자","lit":"바보 같은 / 꿈 / 에서 / 춤추자","g":[{"k":"의지형 〜おう","d":"'~하자'. 踊る → 踊ろう. 君はロックを聴かない의 乾いたメロディで踊ろうよ와 같아요."}],"s":"馬鹿는 한자, 뒤의 バカでかい는 가타카나예요. 같은 말을 다른 문자로 써서 느낌을 바꿨어요.","c":"君はロックを聴かない에서도 '춤추자'고 했어요. 아이묭의 초기 곡에서 춤은 마음을 들뜨게 하는 상상으로 자주 나와요."}]},{"label":"サビ · 후렴","note":"사랑을 전하고 싶다느니 오글거리는 생각만 하며 소파에 가라앉아요. 그래도 서두르지 않고 기다려요.","lines":[{"id":"c1","tk":[{"t":"{愛|あい}"},{"t":"を"},{"t":"{伝|つた}えたい","p":"동사","m":"전하고 싶다","b":"{伝|つた}える","bm":"전하다","w":"어간 伝는 한자, えたい는 히라가나예요.","n":"伝える(전하다, 타동사)와 伝わる(전해지다, 자동사)는 짝이에요. 伝는 傳의 일본식 약자예요."},{"t":"だとか","p":"조사","m":"~라느니, ~라든가","n":"だ + とか. 예를 늘어놓으며 '~라느니 하는'처럼 조금 낮춰 말해요."}],"ko":"사랑을 전하고 싶다느니","lit":"사랑 / 을 / 전하고 싶다 / 라느니","g":[{"k":"〜だとか","d":"'~라느니, ~라든가'. 앞의 말을 예로 들며 살짝 비꼬거나 쑥스러워하는 말투예요."}],"s":"곡 제목이 그대로 나오는 줄이에요. 愛·伝 두 한자에 나머지는 히라가나예요.","c":"사랑을 전하고 싶다는 말을 스스로 だとか(~라느니)로 깎아내려요. 진지한 마음을 쑥스러워하는 말투예요."},{"id":"c2","tk":[{"t":"{臭|くさ}い","p":"い형용사","m":"오글거리는","w":"어간 臭는 한자, い는 히라가나예요. 가타카나로 クサい라고 쓰기도 해요.","n":"원래 '냄새나다'인데, 회화에서는 '오글거리다, 낯간지럽다'라는 뜻으로도 써요."},{"t":"こと","p":"형식명사","m":"것","w":"뜻이 옅어진 형식명사라 히라가나로 써요."},{"t":"ばっか","p":"조사","m":"~만, ~뿐","n":"ばかり의 회화체예요. 臭いことばっか = 오글거리는 것만."},{"t":"{考|かんが}えて","p":"동사","m":"생각하고","b":"{考|かんが}える","bm":"생각하다","w":"어간 考는 한자, えて는 히라가나예요."},{"t":"{待|ま}ってても","p":"동사","m":"기다리고 있어도","b":"{待|ま}つ","bm":"기다리다","w":"어간 待는 한자, ってても는 히라가나예요.","n":"待っていても의 회화체예요. 待つ → 待って + いて + も."}],"ko":"오글거리는 생각만 하며 기다려 봐도","lit":"오글거리는 / 것 / 만 / 생각하고 / 기다리고 있어도","g":[{"k":"〜ばっか (= ばかり)","d":"'~만, ~뿐'. 회화에서는 ばっか로 줄여요. C메로의 事ばかり와 같은 말이에요."}],"s":"ばっか(회화체)와 C메로의 ばかり(본래 꼴)가 한 곡에 같이 나와요.","c":"사랑을 전하는 멋진 말을 상상만 하면서 기다리는 화자예요. 스스로도 '오글거린다'고 알고 있어요."},{"id":"c3","tk":[{"t":"だんだん"},{"t":"ソファ","p":"명사","m":"소파","w":"영어 sofa에서 온 외래어라 가타카나로 써요. ソファー라고 장음을 붙이기도 해요."},{"t":"に"},{"t":"{沈|しず}んでいく","p":"동사","m":"가라앉아 가는","b":"{沈|しず}む","bm":"가라앉다","w":"어간 沈는 한자, んでいく는 히라가나예요.","n":"沈む + ていく(~해 가다). 해가 지는 것도 日が沈む라고 해요."},{"t":"だけ","p":"조사","m":"~뿐"}],"ko":"점점 소파에 가라앉아 갈 뿐","lit":"점점 / 소파 / 에 / 가라앉아 간다 / 뿐","g":[{"k":"〜ていく","d":"'~해 가다'. 지금부터 앞으로 변해 가는 모습이에요. 沈んでいく = 가라앉아 가다."}],"s":"ソファ는 君はロックを聴かない의 メロディ처럼 장음 ー 없이 썼어요.","c":"생각만 하다가 몸이 소파에 푹 꺼져 들어가는 모습이에요. 기다림이 길어지는 시간이 그려져요."},{"id":"c4","tk":[{"t":"{僕|ぼく}"},{"t":"が"},{"t":"{明日|あした}"},{"t":"{良|い}い","p":"い형용사","m":"좋은","w":"良い는 よい와 いい 두 가지로 읽어요. 이 노래에서는 いい로 불러요.","n":"いい는 활용할 때 よ-로 돌아가요(よくない, よかった)."},{"t":"{男|おとこ}","p":"명사","m":"남자","n":"男(사내 남). 女(おんな) = 여자."},{"t":"に"},{"t":"なる","p":"동사","m":"되다","w":"なる는 보통 히라가나로 써요."},{"t":"わけでもない"},{"t":"から"},{"t":"さ"}],"ko":"내가 내일 좋은 남자가 되는 것도 아니니까 말야","lit":"나 / 가 / 내일 / 좋은 / 남자 / 가 / 되다 / 것도 아니다 / 니까 / 말야","g":[{"k":"〜わけでもない","d":"'~인 것도 아니다'. 僕が明日良い男になるわけでもない = 내가 내일 갑자기 좋은 남자가 되는 것도 아니다."},{"k":"〜になる","d":"'~이 되다'. 조사 に를 써요."}],"s":"良い를 いい로 읽었어요. 같은 한자를 よい로 읽기도 해서 루비를 보고 확인해요.","c":"애써 봤자 하루아침에 멋진 사람이 되는 건 아니니까, 하고 스스로를 달래는 말이에요."},{"id":"c5","tk":[{"t":"{焦|あせ}らずに","p":"동사","m":"서두르지 않고","b":"{焦|あせ}る","bm":"조급해하다, 서두르다","w":"어간 焦는 한자, らずに는 히라가나예요.","n":"〜ずに = 〜ないで(~하지 않고). 焦る는 る로 끝나는 5단 동사예요. 君はロックを聴かない의 焦がれる와 같은 한자예요."},{"t":"いる","p":"보조동사","m":"있다","w":"보조로 쓰는 いる는 히라가나로 써요."},{"t":"よ"}],"ko":"조급해하지 않고 있을게","lit":"서두르지 않고 / 있다 / 할게","g":[{"k":"〜ずに","d":"'~하지 않고'. ないで의 조금 딱딱한 꼴이에요. 焦らずに = 서두르지 않고, 食べずに = 먹지 않고."}],"s":"焦는 '타다'라는 뜻의 한자예요. 焦る(조급하다), 焦がれる(애태우다), 焦げる(눋다) 모두 마음이나 물건이 '타는' 그림이에요.","c":"앞줄에서 스스로를 달랜 뒤, 조급해하지 않겠다고 다짐해요. 그래도 마음은 다음 줄의 질문으로 이어져요."},{"id":"c6","tk":[{"t":"{今日|きょう}"},{"t":"は"},{"t":"{日|ひ}","p":"명사","m":"해","n":"日는 '날'도 되고 '해'도 돼요. 日が落ちる = 해가 지다."},{"t":"が"},{"t":"{落|お}ちる","p":"동사","m":"지는, 떨어지는","w":"어간 落는 한자, ちる는 히라가나예요.","n":"落ちる(떨어지다, 자동사)와 落とす(떨어뜨리다, 타동사)는 짝이에요."},{"t":"{頃|ころ}","p":"명사","m":"무렵","n":"頃(ころ) = 무렵, 쯤. 숫자 뒤에서는 ごろ(三時ごろ, 3시쯤)."},{"t":"に"},{"t":"{会|あ}える","p":"동사","m":"만날 수 있다","b":"{会|あ}う","bm":"만나다","w":"어간 会는 한자, える는 히라가나예요.","n":"会う → 가능형 会える(만날 수 있다)."},{"t":"の","p":"조사(종조사)","m":"~거야?","n":"문장 끝 の를 올려 말하면 부드러운 질문이 돼요."},{"t":"？"}],"ko":"오늘은 해 질 무렵에 만날 수 있어?","lit":"오늘 / 은 / 해 / 가 / 지는 / 무렵 / 에 / 만날 수 있다 / 거야","g":[{"k":"문장 끝 の (질문)","d":"회화에서 문장 끝에 の를 붙여 올려 말하면 '~거야?'라는 부드러운 질문이에요. 会えるの? = 만날 수 있어?"}],"s":"日는 날(日曜日)도 해(日が落ちる)도 돼요. 이 줄에서는 '해'예요.","c":"서두르지 않겠다고 해 놓고 바로 '오늘 저녁엔 만날 수 있어?'라고 물어요. 참지 못하는 마음이 귀엽게 드러나요."}]},{"label":"2절 · Aメロ","note":"'완벽한 남자엔 끌리지 않아'라며 웃던 너가 분하고, 할 말은 잔뜩인데 외로워요.","lines":[{"id":"d1","tk":[{"t":"“"},{"t":"{完璧|かんぺき}な","p":"な형용사","m":"완벽한","b":"{完璧|かんぺき}","bm":"완벽함","w":"뜻을 담은 한자어라 한자로 쓰고, な는 히라가나예요.","n":"한국어 '완벽(完璧)'과 같은 한자어예요. 璧(구슬 벽)을 壁(벽)으로 잘못 쓰기 쉬워요."},{"t":"{男|おとこ}"},{"t":"に"},{"t":"なんて","p":"조사","m":"~같은 건","n":"앞의 말을 가볍게 낮춰 불러요. 君はロックを聴かない의 なんか와 비슷해요."},{"t":"{惹|ひ}かれない","p":"동사","m":"끌리지 않아","b":"{惹|ひ}かれる","bm":"끌리다, 매혹되다","w":"惹는 조요칸지 밖의 한자예요. 보통 ひかれる로 풀어 쓰거나 引かれる로 써요.","n":"惹かれる는 마음이 이끌리는 것, 引かれる는 물리적으로 끌려가는 것에 주로 써요."},{"t":"”"},{"t":"と"}],"ko":"'완벽한 남자 같은 덴 끌리지 않아'라며","lit":"완벽한 / 남자 / 에게 / 같은 건 / 끌리지 않는다 / 라고","g":[{"k":"〜になんて","d":"に + なんて = '~ 같은 데에는'. 完璧な男になんて惹かれない = 완벽한 남자 같은 덴 끌리지 않아."}],"s":"惹는 조요칸지 밖의 한자예요. 마음이 '이끌린다'는 뜻을 살리려고 引 대신 골랐어요.","c":"너가 했던 말이에요. 화자는 이 말이 위로인지 놀림인지 몰라 다음 줄에서 '분하다'고 해요."},{"id":"d2","tk":[{"t":"{君|きみ}"},{"t":"が"},{"t":"{笑|わら}ってた","p":"동사","m":"웃고 있었다","b":"{笑|わら}う","bm":"웃다","w":"어간 笑는 한자, ってた는 히라가나예요.","n":"笑っていた의 회화체예요."},{"t":"から"},{"t":"{悔|くや}しい","p":"い형용사","m":"분하다","w":"어간 悔는 한자, しい는 히라가나예요.","n":"져서 분하거나 억울할 때 써요. 한국어 '분하다·약 오르다'에 가까워요."},{"t":"や"}],"ko":"네가 웃고 있었으니까 분해","lit":"너 / 가 / 웃고 있었다 / 니까 / 분하다 / 네","g":[{"k":"〜てた (= 〜ていた)","d":"'~하고 있었다'의 회화체. 笑っていた → 笑ってた."}],"s":"悔しい는 悔(뉘우칠 회) 한 글자에 しい가 붙는 형용사예요.","c":"완벽하지 않은 나라서 오히려 좋다는 말 같기도 한데, 웃으며 말하니 약이 올라요. 귀여운 투정이에요."},{"id":"d3","tk":[{"t":"{腐|くさ}る","p":"동사","m":"썩다","w":"어간 腐는 한자, る는 히라가나예요.","n":"腐るほど = 썩을 만큼 = 남아돌 만큼 많이. 후렴의 臭い(くさい)와 소리가 닮았어요."},{"t":"ほど","p":"조사","m":"~만큼"},{"t":"に"},{"t":"{話|はな}したい","p":"동사","m":"이야기하고 싶은","b":"{話|はな}す","bm":"이야기하다","w":"어간 話는 한자, したい는 히라가나예요."},{"t":"こと","p":"형식명사","m":"것","w":"뜻이 옅어진 형식명사라 히라가나로 써요."},{"t":"{沢山|たくさん}","p":"부사","m":"잔뜩, 많이","w":"沢山은 소리에 맞춰 한자를 빌린 아테지예요. 보통은 たくさん으로 히라가나로 써요."},{"t":"ある","p":"동사","m":"있다","w":"ある는 보통 히라가나로 써요."},{"t":"のに","p":"조사","m":"~는데 (아쉬움)","n":"기대와 다를 때 아쉬움을 담아 '~는데'. 話したいことがあるのに = 할 말이 있는데."},{"t":"な"}],"ko":"썩을 만큼 하고 싶은 얘기가 잔뜩 있는데","lit":"썩다 / 만큼 / 에 / 이야기하고 싶은 / 것 / 잔뜩 / 있다 / 는데 / 네","g":[{"k":"〜ほど","d":"'~할 만큼'. 腐るほど = 썩을 만큼(아주 많이), 泣くほど嬉しい = 울 만큼 기뻐."},{"k":"〜のに","d":"'~는데'(아쉬움). 할 말은 많은데 너가 없다는 아쉬움이에요."}],"s":"沢山은 보통 히라가나 たくさん으로 쓰는 말인데 한자로 썼어요. 沢(못)·山(산)의 뜻과는 상관없는 아테지예요.","c":"썩을 만큼 많은 이야기, 과장된 표현이에요. 다음 줄에서 그 마음이 '외로워'로 정리돼요."},{"id":"d4","tk":[{"t":"{寂|さび}しい","p":"い형용사","m":"외롭다, 쓸쓸하다","w":"어간 寂는 한자, しい는 히라가나예요.","n":"君はロックを聴かない의 寂しそうな君(쓸쓸해 보이는 너)과 같은 말이에요."},{"t":"さ"}],"ko":"외로워","lit":"외롭다 / 야","g":[{"k":"い형용사 + さ","d":"종조사 さ를 붙여 담담하게 말해요. 寂しいさ = 외롭거든."}],"s":"한 단어짜리 줄이에요. 寂しい 뒤의 さ가 쓸쓸함을 덤덤하게 들려줘요.","c":"君はロックを聴かない에서는 '너'가 쓸쓸해 보였는데, 이 곡에서는 화자가 외로워요."},{"id":"d5","tk":[{"t":"{結局|けっきょく}","p":"명사","m":"결국","n":"한국어 '결국(結局)'과 같은 한자어예요. Pretender에도 나왔어요."},{"t":"の"},{"t":"ところ","p":"형식명사","m":"점, 바","w":"'곳'의 所를 뜻이 옅어진 형식명사로 써서 히라가나로 썼어요.","n":"結局のところ = 결국에는, 따지고 보면."},{"t":"{君|きみ}"},{"t":"は"},{"t":"さ"}],"ko":"결국 너는 말야","lit":"결국 / 의 / 바 / 너 / 는 / 말야","g":[{"k":"{結局|けっきょく}のところ","d":"'결국에는, 따지고 보면'. 結局만 써도 되지만 のところ를 붙여 말을 고르는 느낌이 나요."}],"s":"말 중간의 さ는 '있잖아' 하고 잠깐 숨을 고르는 말투예요.","c":"외로움이 투정으로 바뀌는 순간이에요. 다음 두 줄에서 너에게 직접 따져 물어요."},{"id":"d6","tk":[{"t":"どう","p":"부사","m":"어떻게","w":"こう·そう·ああ·どう 같은 지시어는 히라가나로 써요."},{"t":"したい","p":"동사","m":"하고 싶다","b":"する","bm":"하다","w":"する는 히라가나로 써요."},{"t":"の","p":"조사(종조사)","m":"~거야?"},{"t":"？"}],"ko":"어떻게 하고 싶은 거야?","lit":"어떻게 / 하고 싶다 / 거야","g":[{"k":"どうしたいの?","d":"'어떻게 하고 싶은 거야?'. 상대의 속마음을 묻는 말이에요."}],"s":"한자가 하나도 없는 줄이에요. 짧고 직접적인 질문이라 히라가나만으로 날카롭게 들려요.","c":"앞줄 結局のところ君はさ에 이어지는 질문이에요."},{"id":"d7","tk":[{"t":"まじで","p":"부사","m":"진짜로, 정말로","w":"한자 真面目에서 온 속어라 히라가나나 가타카나(マジで)로 써요.","n":"젊은 사람들이 많이 쓰는 속어예요. マリーゴールド의 真面目(まじめ)와 같은 뿌리예요."},{"t":"{僕|ぼく}"},{"t":"に"},{"t":"{愛|あい}される","p":"동사","m":"사랑받을","b":"{愛|あい}する","bm":"사랑하다","w":"愛する의 수동형이에요. される는 히라가나예요.","n":"する → される(~당하다, ~받다). 僕に愛される = 나에게 사랑받다."},{"t":"{気|き}","p":"명사","m":"마음, 생각","n":"〜する気 = ~할 생각. 行く気がない(갈 생각이 없다)."},{"t":"あんの","p":"동사","m":"있는 거야?","b":"ある","bm":"있다","w":"あるの를 회화에서 줄여 あんの로 썼어요. 히라가나로만 써요.","n":"る가 ん으로 바뀌는 건 편한 회화체예요. わかるの → わかんの."},{"t":"？"}],"ko":"진짜로 나한테 사랑받을 마음은 있는 거야?","lit":"진짜로 / 나 / 에게 / 사랑받을 / 마음 / 있는 거야","g":[{"k":"수동형 〜される","d":"する → される. 愛される = 사랑받다. ~에게 받을 때는 に를 써요(僕に愛される)."},{"k":"あんの (= あるの)","d":"る가 ん으로 바뀐 회화체예요. 아주 편한 말투라 친구끼리만 써요."}],"s":"まじで는 真面目에서 온 말이에요. 같은 한자어가 マリーゴールド에서는 真面目に(진지하게), 이 곡에서는 속어 まじで(진짜로)로 나와요.","c":"투정의 절정이에요. 사랑받을 마음이 있긴 한 거냐고 따지지만, 그만큼 사랑받고 싶다는 말이기도 해요."}]},{"label":"2절 · Bメロ","note":"창가에 떨어지는 물방울. 일단 오늘은 불을 일찍 끄고 아무래도 좋은 꿈을 꾸기로 해요.","lines":[{"id":"e1","tk":[{"t":"{雫|しずく}","p":"명사","m":"물방울","w":"雫는 조요칸지 밖의 한자예요. 보통 しずく로 풀어 쓰거나 滴로 써요.","n":"雨(비) 아래 下(아래)를 붙인 모양으로, 빗방울이 떨어지는 그림 같은 글자예요."},{"t":"が"},{"t":"{落|お}ちてる","p":"동사","m":"떨어지고 있어","b":"{落|お}ちる","bm":"떨어지다","w":"어간 落는 한자, ちてる는 히라가나예요.","n":"落ちている의 회화체예요. 후렴의 日が落ちる와 같은 동사예요."}],"ko":"물방울이 떨어지고 있어","lit":"물방울 / 이 / 떨어지고 있다","g":[{"k":"〜てる (= 〜ている)","d":"'~하고 있다'의 회화체. 落ちている → 落ちてる."}],"s":"雫는 雨 밑에 下가 붙은 글자라 모양만 봐도 물방울이 떨어지는 그림이에요.","c":"다음 줄과 이어 읽으면 창가, 눈가, 꽃에서 물방울이 떨어지는 장면이에요. 눈가의 물방울은 눈물로도 읽혀요."},{"id":"e2","tk":[{"t":"{窓際|まどぎわ}","p":"명사","m":"창가","w":"窓(まど) + 際(きわ). 際가 뒤에 붙으며 き가 ぎ로 탁해졌어요(렌다쿠).","n":"際(가 제)는 '가장자리'예요. 같은 줄의 目の際(めのきわ)는 탁해지지 않았어요."},{"t":"{目|め}"},{"t":"の"},{"t":"{際|きわ}","p":"명사","m":"가장자리","n":"目の際 = 눈가. 앞의 窓際(まどぎわ)와 같은 한자예요."},{"t":"お{気|き}に{入|い}り","p":"명사","m":"마음에 듦, 좋아하는 것","w":"気(き)와 入(い) 두 한자 사이와 뒤에 히라가나가 붙었어요. 앞의 お는 공손하게 만드는 말이에요.","n":"気に入る(마음에 들다)에서 온 명사예요. お気に入りの花 = 아끼는 꽃."},{"t":"の"},{"t":"{花|はな}"}],"ko":"창가에, 눈가에, 아끼는 꽃에","lit":"창가 / 눈 / 의 / 가장자리 / 마음에 드는 / 의 / 꽃","g":[{"k":"명사 나열","d":"조사 없이 명사를 늘어놓아 장면을 차례로 비춰요. 窓際、目の際、お気に入りの花."}],"s":"같은 際를 窓際에서는 ぎわ, 目の際에서는 きわ로 읽어요. 바로 붙으면 탁해지고(렌다쿠), の가 사이에 있으면 탁해지지 않아요.","c":"창가의 빗방울, 눈가의 눈물, 꽃의 물방울을 차례로 보여 줘요. 1절의 장미와 이어져 '아끼는 꽃'이 나와요."},{"same":"b3"},{"id":"e4","tk":[{"t":"{部屋|へや}","p":"명사","m":"방","w":"部屋는 단어 전체를 へや로 읽는 주쿠지쿤(熟字訓)이에요."},{"t":"の"},{"t":"{明|あ}かり","p":"명사","m":"불빛, 조명","b":"{明|あ}かり","w":"어간 明는 한자, かり는 히라가나예요.","n":"明るい(밝다)와 같은 한자예요. 明かりを消す = 불을 끄다."},{"t":"{早|はや}めに","p":"부사","m":"일찌감치, 조금 일찍","w":"早(이를 조)에 '조금 ~하게'라는 め와 に가 붙었어요.","n":"早めに = 평소보다 조금 일찍. 多めに(조금 많이)도 같은 꼴이에요."},{"t":"{消|け}して","p":"동사","m":"끄고","b":"{消|け}す","bm":"끄다, 지우다","w":"어간 消는 한자, して는 히라가나예요.","n":"消す(끄다, 타동사)와 消える(꺼지다, 자동사)는 짝이에요."},{"t":"さ"}],"ko":"방 불을 일찌감치 끄고 말야","lit":"방 / 의 / 불빛 / 일찌감치 / 끄고 / 말야","g":[{"k":"〜めに","d":"'조금 ~하게'. 早めに(조금 일찍), 多めに(조금 많이), 少なめに(조금 적게)."}],"s":"明かり는 明 한 글자에 かり가 붙어요. 明るい(あかるい, 밝다)와 같은 읽기예요.","c":"1절은 장미에 소원을 담았는데, 2절은 일찍 불을 끄고 잠들기로 해요. 기다리다 지친 하루의 끝이에요."},{"id":"e5","tk":[{"t":"どうでもいい","p":"표현","m":"아무래도 좋은, 시시한","w":"どう + でも + いい가 굳은 말이라 히라가나로 써요.","n":"'어찌 되든 상관없는'. どうでもいいこと = 하찮은 일."},{"t":"{夢|ゆめ}"},{"t":"を"},{"t":"{見|み}よう","p":"동사","m":"꾸자","b":"{見|み}る","bm":"보다, (꿈을) 꾸다","w":"어간 見는 한자, よう는 히라가나예요.","n":"夢を見る = 꿈을 꾸다. 한국어는 '꾸다', 일본어는 '보다'예요."}],"ko":"아무래도 좋은 꿈이나 꾸자","lit":"아무래도 좋은 / 꿈 / 을 / 보자","g":[{"k":"{夢|ゆめ}を{見|み}る","d":"'꿈을 꾸다'. 일본어는 꿈을 '본다'고 해요."}],"s":"1절은 馬鹿な夢(바보 같은 꿈), 2절은 どうでもいい夢(아무래도 좋은 꿈)예요. 꿈 앞의 말만 바꿔 같은 틀을 이었어요.","c":"1절에서는 꿈속에서 춤추자고 했는데, 2절에서는 그냥 아무 꿈이나 꾸자고 해요. 기운이 조금 빠진 모습이에요."}]},{"label":"サビ 2 · 두 번째 후렴","note":"내일은 둘이서 보내고 싶다고 생각해도 문은 열리지 않아요. 점점 센치해질 뿐이에요.","lines":[{"id":"f1","tk":[{"t":"{明日|あした}"},{"t":"は"},{"t":"{2人|ふたり}","p":"명사","m":"둘","b":"{二人|ふたり}","bm":"두 사람","w":"보통은 二人로 쓰는데 아라비아 숫자 2를 썼어요. 읽기는 ふたり 그대로예요.","n":"マリーゴールド에도 2人가 나와요. 아이묭이 즐겨 쓰는 표기예요."},{"t":"で"},{"t":"{過|す}ごしたい","p":"동사","m":"보내고 싶다","b":"{過|す}ごす","bm":"(시간을) 보내다","w":"어간 過는 한자, ごしたい는 히라가나예요.","n":"過ごす = 시간을 보내다. 楽しく過ごす(즐겁게 보내다)."},{"t":"なんて","p":"조사","m":"~라느니, ~같은 걸","n":"앞의 생각을 가볍게 가리켜요. 쑥스러운 마음이 담겨요."}],"ko":"내일은 둘이서 보내고 싶다느니","lit":"내일 / 은 / 둘 / 이서 / 보내고 싶다 / 라느니","g":[{"k":"〜で (인원)","d":"사람 수 + で = '~이서'. 2人で(둘이서), 一人で(혼자서)."}],"s":"2人를 아라비아 숫자로 썼어요. マリーゴールド와 같은 표기예요.","c":"첫 후렴의 愛を伝えたいだとか가 '내일은 둘이서 보내고 싶다느니'로 바뀌었어요. 바람이 더 구체적이에요."},{"id":"f2","tk":[{"t":"{考|かんが}えていても","p":"동사","m":"생각하고 있어도","b":"{考|かんが}える","bm":"생각하다","w":"어간 考는 한자, えていても는 히라가나예요."},{"t":"ドア","p":"명사","m":"문","w":"영어 door에서 온 외래어라 가타카나로 써요.","n":"일본식 미닫이문은 戸(と)나 扉(とびら)라고 해요."},{"t":"は"},{"t":"{開|あ}かない","p":"동사","m":"열리지 않아","b":"{開|あ}く","bm":"열리다","w":"어간 開는 한자, かない는 히라가나예요.","n":"開く(열리다, 자동사)와 開ける(열다, 타동사)는 짝이에요."},{"t":"し","p":"조사","m":"~하고 (게다가)","n":"이유를 늘어놓을 때 '~하고'. 다음 줄로 이어져요."}],"ko":"생각하고 있어도 문은 열리지 않고","lit":"생각하고 있어도 / 문 / 은 / 열리지 않는다 / 하고","g":[{"k":"〜し","d":"'~하고(게다가)'. 이유나 사정을 늘어놓을 때 써요. ドアは開かないし = 문은 안 열리고."}],"s":"ドア는 외래어라 가타카나, 開かない는 한자 + 히라가나예요.","c":"아무리 생각해도 너가 문을 열고 들어오지는 않아요. 기다림이 계속돼요."},{"id":"f3","tk":[{"t":"だんだん"},{"t":"おセンチ","p":"な형용사","m":"센치함, 감상적","w":"영어 sentimental을 줄인 センチ(가타카나)에 공손하게 만드는 お(히라가나)를 붙였어요. 한 단어에 히라가나와 가타카나가 섞였어요.","n":"조금 옛날 말투예요. センチメンタル(센티멘털)을 장난스럽게 줄인 말이에요."},{"t":"に"},{"t":"なる","p":"동사","m":"되다"},{"t":"だけ","p":"조사","m":"~뿐"},{"t":"だ","p":"조동사","m":"~이다"},{"t":"{僕|ぼく}"},{"t":"は"}],"ko":"점점 센치해질 뿐이야, 나는","lit":"점점 / 센치 / 하게 / 되다 / 뿐 / 이다 / 나 / 는","g":[{"k":"도치 (말 순서 바꾸기)","d":"원래 순서는 僕はだんだんおセンチになるだけだ. 僕は를 뒤로 보내 '나는 말이야'처럼 덧붙였어요."}],"s":"おセンチ는 히라가나 お + 가타카나 センチ예요. 한 단어 안에서 문자가 바뀌는 재미있는 말이에요.","c":"첫 후렴은 '소파에 가라앉을 뿐', 두 번째는 '센치해질 뿐'이에요. 몸에 이어 마음까지 가라앉아요."},{"id":"f4","tk":[{"t":"{愛|あい}"},{"t":"が"},{"t":"{何|なん}","p":"대명사","m":"무엇","n":"何은 뒤 소리에 따라 なに 또는 なん으로 읽어요."},{"t":"だとか","p":"조사","m":"~라느니"},{"t":"{言|ゆ}う","p":"동사","m":"말하다","b":"{言|い}う","bm":"말하다","w":"사전형은 いう라고 쓰지만, 실제 발음은 ゆう에 가까워서 노래도 ゆう로 불러요.","n":"言う는 글자로는 いう, 소리로는 ゆう예요. 그래서 한글 발음도 '유우'예요."},{"t":"わけでもない"},{"t":"けど","p":"조사","m":"~지만"}],"ko":"사랑이 뭐라느니 말하려는 것도 아니지만","lit":"사랑 / 이 / 무엇 / 이라느니 / 말하다 / 것도 아니다 / 지만","g":[{"k":"〜わけでもないけど","d":"'~인 것도 아니지만'. 후렴의 良い男になるわけでもない와 같은 말이에요."}],"s":"言う는 쓸 때는 いう, 말할 때는 ゆう예요. 글자와 소리가 다른 대표적인 말이에요.","c":"사랑에 대해 거창하게 말하려는 건 아니라고 한 발 물러서요. 다음 줄에서 진짜 마음이 나와요."},{"id":"f5","tk":[{"t":"ただ","p":"부사","m":"그저, 다만","w":"부사라 히라가나로 써요."},{"t":"{切|せつ}ない","p":"い형용사","m":"애달프다, 가슴이 저리다","w":"切(せつ)는 한자, ない는 히라가나예요. 부정의 ない가 아니라 형용사의 일부예요.","n":"그립고 아프고 안타까운 마음이 섞인 말로, 한국어로 딱 맞는 말이 없어요. 노래 가사에 아주 많이 나와요."},{"t":"と"},{"t":"{言|い}えば","p":"동사","m":"말하면","b":"{言|い}う","bm":"말하다","w":"어간 言는 한자, えば는 히라가나예요."},{"t":"キリ","p":"명사","m":"끝, 한도","b":"{切|き}り","bm":"끝","w":"切り를 가타카나로 써서 강조했어요. キリがない = 끝이 없다.","n":"같은 줄의 切ない와 같은 한자 切인데, 한쪽은 한자, 한쪽은 가타카나로 썼어요."},{"t":"が"},{"t":"ない","p":"い형용사","m":"없다","w":"ない는 히라가나로 써요."},{"t":"くらい","p":"조사","m":"~정도"},{"t":"なんだ","p":"조동사","m":"~인 거야","n":"な + んだ. 설명하거나 강조하는 말끝이에요."}],"ko":"그저 애달프다고 말하자면 끝이 없을 정도야","lit":"그저 / 애달프다 / 라고 / 말하면 / 끝 / 이 / 없다 / 정도 / 인 거야","g":[{"k":"〜と{言|い}えば","d":"'~라고 말하면'. 言う → 가정형 言えば."},{"k":"キリがない","d":"'끝이 없다'. 一つ一つ言えばキリがない(하나하나 말하면 끝이 없어)."}],"s":"切ない(한자)와 キリ(가타카나)에 같은 切가 숨어 있어요. 한 줄 안에서 같은 글자를 다르게 표기했어요.","c":"거창한 사랑 얘기는 아니라면서도, 애달픈 마음은 말하자면 끝이 없다는 고백이에요."},{"id":"f6","tk":[{"t":"もう","p":"부사","m":"이제, 정말","w":"부사라 히라가나로 써요."},{"t":"{嫌|いや}だ","p":"な형용사","m":"싫어","b":"{嫌|いや}","bm":"싫음","w":"어간 嫌는 한자, だ는 히라가나예요.","n":"嫌い(きらい, 싫어하다)와 같은 한자예요. もう嫌だ = 이제 싫어, 못 해 먹겠어."}],"ko":"이제 싫어","lit":"이제 / 싫다","g":[{"k":"もう + 감정","d":"'이제 정말 ~'. もう嫌だ(이제 싫어), もう無理(이제 무리야)."}],"s":"嫌는 いや(싫음)와 きらい(싫어함) 두 가지로 읽어요. 여기서는 いや예요.","c":"애달픔이 쌓여 '이제 싫어'라고 터져요. 다음 C메로에서 투정이 이어져요."}]},{"label":"Cメロ · 브리지","note":"촛불, 엄청 큰 케이크도 소용없다며 치사한 생각만 해요. 오늘은 장미꽃도 없어요.","lines":[{"id":"g1","tk":[{"t":"ろうそく","p":"명사","m":"초, 양초","w":"한자로 蝋燭라고 쓰지만 너무 어려워서 보통 히라가나로 써요."},{"t":"{炊|た}いて","p":"동사","m":"피우고","b":"{炊|た}く","bm":"(밥을) 짓다","w":"보통 초나 불을 피울 때는 焚く(たく)를 쓰는데, 이 곡은 밥을 지을 때 쓰는 炊く로 썼어요.","n":"炊く(밥을 짓다)와 焚く(불을 때다)는 소리가 같아요. 원문 표기를 그대로 따랐어요."}],"ko":"촛불을 켜고","lit":"양초 / 피우고","g":[{"k":"を 빠짐","d":"원래는 ろうそくを炊いて예요. 가사에서는 조사를 자주 줄여요."}],"s":"炊く와 焚く는 둘 다 たく예요. 보통 촛불에는 焚く를 써서, 이 곡의 炊く는 눈에 띄는 표기예요.","c":"촛불을 켜고 기념일처럼 꾸미는 장면이에요. 다음 줄에서 케이크까지 나와요."},{"id":"g2","tk":[{"t":"バカでかい","p":"い형용사","m":"엄청나게 큰","w":"馬鹿(바보)를 가타카나 バカ로 써서 '엄청'이라는 강조로 썼어요. 1절의 馬鹿な夢은 한자였어요.","n":"バカ + でかい(크다). バカ는 앞에 붙어 '엄청'이라는 강조가 돼요(バカ正直, 바보처럼 정직)."},{"t":"ケーキ","p":"명사","m":"케이크","w":"영어 cake에서 온 외래어라 가타카나로 써요."},{"t":"が"},{"t":"あっても","p":"동사","m":"있어도","b":"ある","bm":"있다","w":"ある는 보통 히라가나로 써요."}],"ko":"엄청나게 큰 케이크가 있어도","lit":"엄청 큰 / 케이크 / 가 / 있어도","g":[{"k":"て형 + も","d":"'~해도'. ある → あっても(있어도)."}],"s":"같은 ばか를 1절에서는 한자 馬鹿, 여기서는 가타카나 バカ로 썼어요. 가타카나가 더 가볍고 장난스러워요.","c":"아무리 크게 준비해도 소용없다는 투정이에요."},{"id":"g3","tk":[{"t":"{君|きみ}"},{"t":"が"},{"t":"{食|く}いつく","p":"동사","m":"덥석 달려들다","w":"食(く)와 つく 사이에 い가 끼었어요. 食う(먹다, 거친 말) + 付く가 합쳐진 말이에요.","n":"음식에 덥석 달려들거나, 이야기·제안에 크게 관심을 보이는 것도 食いつく라고 해요."},{"t":"わけでもない"},{"t":"だろう","p":"조동사","m":"~겠지","n":"추측의 말끝이에요. 정중하게는 でしょう."}],"ko":"네가 덥석 좋아할 것도 아니겠지","lit":"너 / 가 / 덥석 달려들다 / 것도 아니다 / 겠지","g":[{"k":"〜わけでもないだろう","d":"'~인 것도 아니겠지'. わけでもない + だろう(추측)."}],"s":"食う는 食べる보다 거친 말이에요. 食(く)를 食べる에서는 た로 읽어요.","c":"케이크를 준비해도 너가 기뻐할 것 같지 않다며 미리 실망해요. 화자의 자신 없는 마음이 보여요."},{"id":"g4","tk":[{"t":"{情|なさ}けない","p":"い형용사","m":"한심한","w":"情(なさ)는 한자, けない는 히라가나예요. 부정의 ない가 아니라 형용사의 일부예요.","n":"情(뜻 정)에서 온 말이지만 지금은 '한심하다, 꼴사납다'예요."},{"t":"ずるい","p":"い형용사","m":"치사한, 교활한","w":"한자 狡い가 있지만 거의 안 써서 히라가나로 써요."},{"t":"{事|こと}","p":"명사","m":"일, 것","w":"보통 형식명사 こと는 히라가나로 쓰는데, 여기서는 한자 事로 썼어요."},{"t":"ばかり","p":"조사","m":"~만"},{"t":"を"}],"ko":"한심하고 치사한 생각만","lit":"한심한 / 치사한 / 일 / 만 / 을","g":[{"k":"〜ばかり","d":"'~만'. 후렴의 ばっか가 원래 꼴 ばかり로 나왔어요."}],"s":"후렴은 臭いこと(히라가나), 여기는 ずるい事(한자)예요. 같은 こと를 한 곡 안에서 다르게 썼어요.","c":"케이크를 준비하면서도 '어차피 안 좋아하겠지' 같은 치사한 생각만 해요. 스스로도 한심하다고 알아요."},{"id":"g5","tk":[{"t":"{考|かんが}えてしまう","p":"동사","m":"생각해 버리는","b":"{考|かんが}える","bm":"생각하다","w":"어간 考는 한자, えてしまう는 히라가나예요."},{"t":"{今日|きょう}"},{"t":"は"}],"ko":"생각해 버리는 오늘은","lit":"생각해 버리는 / 오늘 / 은","g":[{"k":"〜てしまう","d":"'~해 버리다'. 원하지 않는데 그렇게 되는 일이에요. 1절의 割れてしまった와 같아요."}],"s":"앞 줄과 한 문장이에요. 情けないずるい事ばかりを考えてしまう今日は = 한심하고 치사한 생각만 해 버리는 오늘은.","c":"그런 생각을 '해 버리는' 날이라서, 다음 줄에서 장미꽃도 없다고 해요."},{"id":"g6","tk":[{"t":"バラ"},{"t":"の"},{"t":"{花|はな}"},{"t":"も"},{"t":"ない","p":"い형용사","m":"없다","w":"ない는 히라가나로 써요."},{"t":"よ"}],"ko":"장미꽃도 없어","lit":"장미 / 의 / 꽃 / 도 / 없다 / 야","g":[{"k":"〜もない","d":"'~도 없다'. バラの花もない = 장미꽃도 없어."}],"s":"1절의 バラの花に願い込めて(장미꽃에 소원을 담아)와 짝이에요. 장미가 있다가 없어졌어요.","c":"1절에서는 장미에 소원을 담았는데, 오늘은 그 장미조차 없어요. 기대가 꺾인 하루예요."},{"id":"g7","tk":[{"t":"{汚|よご}れてる","p":"동사","m":"더러워진","b":"{汚|よご}れる","bm":"더러워지다","w":"어간 汚는 한자, れてる는 히라가나예요.","n":"汚れている의 회화체예요. 같은 汚를 汚い(きたない, 더럽다)로도 읽어요."},{"t":"シャツ","p":"명사","m":"셔츠","w":"영어 shirt에서 온 외래어라 가타카나로 써요."},{"t":"に"},{"t":"{履|は}き{慣|な}れた","p":"동사","m":"오래 입어 익숙한","b":"{履|は}き{慣|な}れる","bm":"신어(입어) 익숙해지다","w":"履(신다)와 慣(익숙하다) 두 한자 사이에 き가 끼었어요. 履く + 慣れる가 합쳐진 복합동사예요.","n":"바지·신발은 履く(はく)를 써요. 윗옷은 着る(きる)."},{"t":"ジーパン","p":"명사","m":"청바지","w":"jeans + pants를 일본에서 줄여 만든 외래어(일본식 영어)라 가타카나로 써요.","n":"요즘은 ジーンズ, デニム이라고도 해요."},{"t":"で"}],"ko":"더러워진 셔츠에 오래 입은 청바지 차림으로","lit":"더러워진 / 셔츠 / 에 / 입어 익숙한 / 청바지 / 로","g":[{"k":"{履|は}く · {着|き}る","d":"아래에 입는 것(바지·신발)은 履く, 위에 입는 것(셔츠)은 着る. 한국어 '입다·신다'와 나누는 방식이 달라요."}],"s":"ジーパン은 영어에 없는 일본식 영어예요. 가타카나로 써도 진짜 영어와는 다른 말이 있어요.","c":"멋진 옷이 아니라 평소 차림 그대로예요. 꾸미지 않은 내 모습으로 너를 기다린다는 장면이 마지막 후렴으로 이어져요."}]},{"label":"ラストサビ · 마지막 후렴","note":"첫 후렴을 그대로 다시 불러요. 그래도 오늘 저녁엔 만날 수 있냐고 물으며 끝나요.","lines":[{"same":"c1"},{"same":"c2"},{"same":"c3"},{"same":"c4"},{"same":"c5"},{"same":"c6"}]}]},"kimirock":{"id":"kimirock","title":"{君|きみ}はロックを{聴|き}かない","artist":"あいみょん","year":2017,"eyebrow":"あいみょん · 2017","sub":"록 같은 건 듣지 않을 너에게, 그래도 내가 들어 온 노래들을 들려주고 싶은 마음을 담은 곡. 아이묭의 3번째 싱글.","release":"2017년 8월 2일 · 3번째 싱글 · 앨범 『青春のエキサイトメント』(2017) 수록","tieIn":"없음","lyricist":"あいみょん","composer":"あいみょん","listen":"https://www.youtube.com/results?search_query=%E3%81%82%E3%81%84%E3%81%BF%E3%82%87%E3%82%93+%E5%90%9B%E3%81%AF%E3%83%AD%E3%83%83%E3%82%AF%E3%82%92%E8%81%B4%E3%81%8B%E3%81%AA%E3%81%84","intro":"君はロックを聴かない는 아이묭이 2017년 8월에 낸 3번째 싱글이에요. 같은 해 9월에 나온 첫 앨범 『青春のエキサイトメント』에도 실렸어요. 이듬해의 マリーゴールド보다 한 해 앞선 곡이에요.\n\n화자는 쓸쓸해 보이는 '너'에게 레코드를 틀어 주며 마음을 전하려 해요. 너는 록 같은 건 듣지 않을 거라고 생각하면서도, 내가 그 노래들로 사랑을 견뎌 왔다는 걸 알아주길 바라요. 레코드, 바늘, 심장 박동 같은 '소리'에 관한 말을 따라 읽어 보세요.","notes":[{"tag":"배경","title":"마리골드 한 해 전의 곡","body":"2017년 8월에 나온 3번째 싱글로, 드라마나 광고 주제가는 아니었어요. 같은 해 9월 첫 정규 앨범 『青春のエキサイトメント』(청춘의 익사이트먼트)에 실렸어요.\n\n2018년의 マリーゴールド와 함께 아이묭의 초기 대표곡으로 자주 꼽혀요. 두 곡 모두 '너'를 향한 마음을 노래하지만, 마리골드가 여름 풍경이라면 이 곡은 방 안에서 레코드를 트는 장면이에요."},{"tag":"표기","title":"聞く가 아니라 聴く","body":"'듣다'는 보통 [[{聞|き}く]]로 써요. 이 곡은 제목부터 끝까지 [[{聴|き}く]]를 써요. 聴는 귀를 기울여 주의 깊게 듣는다는 느낌의 한자라, 음악을 감상할 때 자주 골라 써요(音楽を聴く).\n\n소리는 둘 다 きく예요. 같은 소리에 뜻에 맞는 한자를 골라 쓰는 건 マリーゴールド의 写る(映る가 아니라)와 같은 방식이에요."},{"tag":"표기","title":"가타카나 의성어와 숫자·알파벳","body":"[[フツフツ]](보글보글), [[ダラダラ]](줄줄)는 소리나 모양을 흉내 내는 말이에요. 보통 히라가나 ふつふつ, だらだら로 쓰는데, 일부러 가타카나로 써서 소리가 또렷하고 거칠게 튀어나오는 느낌을 줘요.\n\n2절에는 [[BPM]]과 [[190]]처럼 알파벳과 숫자가 그대로 나와요. 읽을 때는 ビーピーエム, ひゃくきゅうじゅう예요. 숫자를 섞어 쓰는 건 マリーゴールド의 2人와도 이어져요."},{"tag":"문화","title":"ドーナツ盤과 바늘","body":"[[ドーナツ{盤|ばん}]](도넛판)은 가운데 구멍이 크게 뚫린 작은 레코드판이에요. 생긴 모양이 도넛 같아서 붙은 이름이에요. 주로 싱글곡 한두 곡을 담았어요.\n\n[[{針|はり}を{落|お}とす]](바늘을 떨어뜨리다)는 턴테이블의 바늘을 레코드 위에 내려놓아 음악을 트는 동작이에요. 먼지투성이 레코드를 진지하게 트는 모습에서, 오래 아껴 온 노래를 꺼내 들려주는 장면이 그려져요."},{"tag":"표현","title":"〜なんか, 낮춰 부르는 말","body":"[[ロックなんか]]의 なんか는 '~같은 건, ~따위'라는 뜻으로, 앞의 말을 가볍게 낮춰 불러요. 君はロックなんか聴かない = '너는 록 같은 건 안 듣잖아'.\n\n화자가 정말 록을 낮게 보는 게 아니라, 너는 이런 걸 좋아하지 않을 거라는 체념과 쑥스러움이 섞인 말투로 읽혀요."},{"tag":"표현","title":"ぜ·ぞ·のかい, 거친 말끝","body":"[[{止|と}めすぎたぜ]], [[なったぞ]], [[{気|き}づくのかい]], [[{笑|わら}うんだい]]의 말끝 ぜ·ぞ·かい·だい는 주로 남성이 쓰는 거친 말투예요. 1인칭도 [[{僕|ぼく}]]예요.\n\n아이묭은 여성 싱어송라이터지만 이 곡처럼 僕와 남성적인 말투로 가사를 쓰기도 해요. 화자를 남자 아이로 볼 수도 있고, 성별과 상관없이 솔직하고 거친 말투를 고른 것으로 볼 수도 있어요."},{"tag":"표현","title":"目が泳ぐ","body":"[[{泳|およ}ぐ{目|め}]](헤엄치는 눈)는 관용 표현 [[{目|め}が{泳|およ}ぐ]]에서 왔어요. 당황하거나 거짓말을 할 때 눈동자가 이리저리 흔들리는 모습을 '눈이 헤엄친다'고 해요.\n\n한국어로는 '눈이 흔들리다', '눈을 피하다'에 가까워요. 앞의 嘘みたいに(거짓말처럼)와 이어져, 웃음을 들킨 너의 당황한 눈빛이 그려져요."}],"dict":{"{君|きみ}":{"p":"대명사","m":"너","w":"'너'를 뜻하는 대명사로, 한자로 쓰는 게 일반적이에요.","n":"원래 '임금'을 뜻하던 한자예요(君主 = 군주). 지금은 가까운 사이에서 부르는 '너'예요."},"{僕|ぼく}":{"p":"대명사","m":"나 (남성)","w":"1인칭 대명사로 한자로 쓰는 게 일반적이에요.","n":"僕는 부드럽고 소년 같은 느낌의 1인칭이에요. 여성 작사가가 노래 속 화자로 僕를 쓰는 일도 많아요."},"は":{"p":"조사","m":"~은/는 (주제)","n":"조사로 쓸 때는 ha가 아니라 wa로 읽어요."},"が":{"p":"조사","m":"~이/가"},"を":{"p":"조사","m":"~을/를","n":"현대 일본어에서 を는 이 조사에만 쓰는 글자예요. 발음은 お(o)와 같아요."},"に":{"p":"조사","m":"~에게, ~에"},"の":{"p":"조사","m":"~의"},"で":{"p":"조사","m":"~으로"},"と":{"p":"조사","m":"~라고 (인용)"},"よ":{"p":"조사(종조사)","m":"~자, ~해 (권유·강조)","n":"문장 끝 よ는 상대에게 말을 건네며 힘을 주는 말이에요."},"ぜ":{"p":"조사(종조사)","m":"~다고, ~지 (거친 말투)","n":"주로 남성이 쓰는 거친 말끝이에요. 친구에게 툭 던지듯 말하는 느낌이에요."},"ロック":{"p":"명사","m":"록 (음악)","w":"영어 rock에서 온 외래어라 가타카나로 써요. 작은 ッ가 들어가 '록쿠'로 읽어요.","n":"ロックンロール(로큰롤)의 줄임말이에요. 한국어 '록'과 같은 말이에요."},"なんか":{"p":"조사","m":"~같은 건, ~따위","n":"앞의 말을 가볍게 낮춰 불러요. ロックなんか = 록 같은 건. 회화에서 아주 많이 써요."},"{聴|き}かない":{"p":"동사","m":"듣지 않아","b":"{聴|き}く","bm":"(음악 등을) 듣다","w":"보통 '듣다'는 聞く인데, 귀 기울여 듣는 느낌의 聴를 골라 썼어요. 음악을 들을 때 자주 쓰는 한자예요.","n":"聞く와 聴く는 둘 다 きく예요. 聴는 한국어 '청(聽)'의 일본식 약자예요(청취 = 聴取)."},"{少|すこ}し":{"p":"부사","m":"조금","w":"어간 少는 한자, し는 히라가나예요."},"{近|ちか}づいて":{"p":"동사","m":"다가와","b":"{近|ちか}づく","bm":"다가가다, 가까워지다","w":"近(가까울 근)은 한자, づいて는 히라가나예요. 近 + 付く(つく)가 합쳐지며 つ가 づ로 탁해졌어요(렌다쿠).","n":"近い(가깝다)와 같은 한자예요. 近づく의 て형이 近づいて예요."},"ほしくて":{"p":"보조형용사","m":"~해 주길 바라서","b":"ほしい","bm":"~해 주길 바라다","w":"'~해 주길 바라다'라는 보조 뜻일 때는 欲しい 대신 히라가나 ほしい로 써요.","n":"동사 て형 + ほしい = '~해 줬으면 좋겠다'. 끝의 くて는 '~해서'라는 이유예요."},"こんな":{"p":"연체사","m":"이런","w":"こんな·そんな·あんな·どんな 같은 지시어는 히라가나로 써요."},"あんな":{"p":"연체사","m":"저런, 그런","w":"こんな·そんな·あんな·どんな 같은 지시어는 히라가나로 써요.","n":"あんな는 눈앞에 없거나 지난 일을 가리켜요. こんな歌であんな歌で = 이런 노래로, 저런 노래로."},"{歌|うた}":{"p":"명사","m":"노래","n":"歌う(うたう)는 '노래하다'예요. 한국어 '가(歌)'와 같은 한자예요(가요 = 歌謡)."},"{思|おも}う":{"p":"동사","m":"생각해","w":"어간 思는 한자, う는 히라가나예요."},"けれども":{"p":"조사","m":"~지만","n":"けど·けれど보다 길고 또박또박한 말이에요. 같은 곡 안에 けど도 나와요."},"{恋|こい}":{"p":"명사","m":"사랑","n":"恋(こい)는 설레고 애타는 연애 감정, 愛(あい)는 더 깊고 넓은 사랑이에요."},"{青春|せいしゅん}":{"p":"명사","m":"청춘","n":"한국어 '청춘(靑春)'과 같은 한자어예요. 青는 靑의 일본식 자체예요. 앨범 제목 『青春のエキサイトメント』에도 들어 있어요."},"{音|おと}":{"p":"명사","m":"소리","n":"音楽(おんがく, 음악)에서는 おん으로 읽어요. 혼자 쓰면 おと예요."},"{乾|かわ}いた":{"p":"동사","m":"메마른","b":"{乾|かわ}く","bm":"마르다","w":"어간 乾는 한자, いた는 히라가나예요.","n":"乾く(마르다)의 과거형 乾いた가 명사를 꾸미면 '마른, 메마른'이 돼요. 목이 마를 때는 渇く(かわく)를 써요."},"メロディ":{"p":"명사","m":"멜로디, 선율","w":"영어 melody에서 온 외래어라 가타카나로 써요. メロディー처럼 장음을 붙여 쓰기도 하는데, 이 곡은 ー 없이 メロディ로 썼어요.","n":"외래어 끝의 장음 ー는 붙이기도 하고 빼기도 해요. コンピューター/コンピュータ처럼요."}},"sections":[{"label":"1절 · Aメロ","note":"쓸쓸해 보이는 너를 위해 서툰 깜짝 선물처럼 먼지 쌓인 레코드를 꺼내 틀어요.","lines":[{"id":"a1","tk":[{"t":"{少|すこ}し"},{"t":"{寂|さび}しそうな","p":"い형용사","m":"쓸쓸해 보이는","b":"{寂|さび}しい","bm":"쓸쓸하다, 외롭다","w":"어간 寂는 한자, しそうな는 히라가나예요. 寂しい의 い를 빼고 そうだ(~해 보이다)를 붙였어요.","n":"寂(고요할 적)는 한국어 '적막(寂寞)'의 寂예요. 淋しい(さびしい)로 쓰기도 해요."},{"t":"{君|きみ}"},{"t":"に"}],"ko":"조금 쓸쓸해 보이는 너에게","lit":"조금 / 쓸쓸해 보이는 / 너 / 에게","g":[{"k":"い형용사 + そうだ","d":"'~해 보이다'(겉모습을 보고 하는 짐작). 寂しい → 寂しそうだ, おいしい → おいしそうだ. 명사를 꾸밀 때는 寂しそうな君."}],"s":"寂しい는 어간 한자 하나 뒤에 긴 히라가나가 붙는 형용사예요. 그 뒤에 そうな까지 이어져서, 한 단어에 한자는 寂 하나뿐이에요.","c":"첫 줄부터 화자는 너를 '쓸쓸해 보인다'고 바라봐요. 그래서 노래를 들려주려는 이유가 생겨요."},{"id":"a2","tk":[{"t":"こんな"},{"t":"{歌|うた}"},{"t":"を"},{"t":"{聴|き}かせよう","p":"동사","m":"들려줘야지","b":"{聴|き}かせる","bm":"들려주다","w":"제목과 같은 聴를 써서 '귀 기울여 들려주다'라는 느낌을 살렸어요.","n":"聴く(듣다)의 사역형이 聴かせる(듣게 하다 = 들려주다)예요. 의지형 聴かせよう는 '들려줘야지'."}],"ko":"이런 노래를 들려줄게","lit":"이런 / 노래 / 를 / 들려주자","g":[{"k":"사역형 〜せる","d":"5단 동사 끝 う단을 あ단으로 바꾸고 せる를 붙이면 '~하게 하다'. 聴く → 聴かせる(듣게 하다 = 들려주다)."},{"k":"의지형 〜よう","d":"1단 동사는 る를 빼고 よう. 聴かせる → 聴かせよう(들려주자, 들려줘야지)."}],"s":"聴く는 이 곡에서 계속 나와요. 귀를 기울여 듣는 聴를 골라 '음악을 듣는다'는 장면을 분명히 했어요.","c":"こんな歌(이런 노래)는 화자가 아끼는 노래예요. 뒤에서 그게 록이라는 게 드러나요."},{"id":"a3","tk":[{"t":"{手|て}","p":"명사","m":"손","n":"한국어 '수(手)'와 같은 한자예요. 혼자 쓰면 て로 읽어요."},{"t":"を"},{"t":"{叩|たた}く","p":"동사","m":"치는, 두드리는","w":"어간 叩는 한자, く는 히라가나예요. 叩는 2010년에 조요칸지에 들어간 글자예요.","n":"手を叩く = 손뼉을 치다. ドアを叩く(문을 두드리다)."},{"t":"{合図|あいず}","p":"명사","m":"신호","w":"合(あい)와 図(ず)를 이어 읽는 한자어예요.","n":"合図する = 신호를 보내다. 図는 圖의 일본식 약자예요."}],"ko":"손뼉을 치는 신호","lit":"손 / 을 / 치는 / 신호","g":[{"k":"동사 + 명사","d":"동사 사전형이 그대로 명사를 꾸며요. 手を叩く合図 = 손뼉을 치는 신호."}],"s":"合図는 한자 두 개를 あい + ず로 읽어요. 한국어 한자음(합도)으로는 짐작하기 어려운 말이라 따로 외워 두면 좋아요.","c":"노래를 시작하는 신호로 손뼉을 쳐요. 다음 줄의 '엉성한 서프라이즈'로 이어지는, 쑥스럽고 서툰 시작이에요."},{"id":"a4","tk":[{"t":"{雑|ざつ}な","p":"な형용사","m":"엉성한, 대충인","b":"{雑|ざつ}","bm":"엉성함, 조잡함","w":"뜻을 담은 한자어라 한자로 쓰고, な는 히라가나예요.","n":"한국어 '잡(雜)'의 일본식 약자예요(잡지 = 雑誌). 雑に扱う(함부로 다루다)."},{"t":"サプライズ","p":"명사","m":"서프라이즈, 깜짝 선물","w":"영어 surprise에서 온 외래어라 가타카나로 써요."}],"ko":"엉성한 서프라이즈","lit":"엉성한 / 서프라이즈","g":[{"k":"な형용사 + 명사","d":"雑 + な + サプライズ. な형용사는 명사를 꾸밀 때 な가 붙어요."}],"s":"한자어 雑와 외래어 サプライズ가 나란히 놓였어요. 한자 하나, 히라가나 하나, 가타카나 다섯 글자로 된 짧은 줄이에요.","c":"준비가 엉성하다는 걸 스스로 알고 있어요. 그래도 해 보는 게 다음 줄의 '내 나름의 최선'이에요."},{"id":"a5","tk":[{"t":"{僕|ぼく}"},{"t":"なり","p":"접미사","m":"~나름","w":"뜻이 옅어진 접미사라 히라가나로 써요.","n":"명사 + なり = '~나름'. 僕なりの = 내 나름의, 自分なりに = 내 나름대로."},{"t":"の"},{"t":"{精一杯|せいいっぱい}","p":"명사","m":"최선, 힘껏","n":"精(정성 정) + 一杯(한 잔, 가득). '힘을 가득 담아'라는 뜻이에요. 精一杯頑張る(힘껏 노력하다)."}],"ko":"내 나름의 최선","lit":"나 / 나름 / 의 / 최선","g":[{"k":"〜なりの","d":"'~나름의'. 僕なりの精一杯 = 내 나름대로 할 수 있는 최선."}],"s":"精一杯는 せい + いっ + ぱい로 읽어요. 一杯(いっぱい)가 붙으면서 작은 っ와 ぱ가 생겼어요. 한글로는 '세이잇파이'예요.","c":"엉성해도 이게 지금 내가 할 수 있는 전부라는 말이에요. 서툴지만 진심인 화자의 모습이에요."},{"id":"a6","tk":[{"t":"{埃|ほこり}まみれ","p":"명사","m":"먼지투성이","b":"{埃|ほこり}まみれ","w":"埃는 조요칸지 밖의 한자예요. 보통 ほこり로 풀어 쓰지만, 여기서는 한자를 골라 먼지가 쌓인 모습을 또렷하게 보여 줘요. まみれ는 히라가나예요.","n":"명사 + まみれ = '~투성이'. 汗まみれ(땀투성이), 泥まみれ(진흙투성이)."},{"t":"　"},{"t":"ドーナツ{盤|ばん}","p":"명사","m":"도넛판 (작은 레코드판)","w":"외래어 ドーナツ(도넛)는 가타카나, '판'을 뜻하는 盤은 한자예요. 한 단어 안에서 가타카나와 한자가 섞였어요.","n":"가운데 구멍이 커서 도넛처럼 보이는 작은 레코드판이에요. 盤(소반 반)은 한국어 '음반(音盤)'의 盤이에요."},{"t":"には","p":"조사","m":"~에는"}],"ko":"먼지투성이 도넛판에는","lit":"먼지투성이 / 도넛판 / 에는","g":[{"k":"명사 + まみれ","d":"'~투성이'. 埃まみれ = 먼지투성이. 좋지 않은 것이 온통 묻어 있을 때 써요."}],"s":"埃(먼지)는 조요칸지 밖의 어려운 한자예요. 같은 소리의 誇り(ほこり, 자부심)와 구별하려고 한자로 쓰기도 해요. 줄 가운데의 전각 공백은 노래의 쉼표 같은 호흡이에요.","c":"오래 꺼내지 않아 먼지가 쌓인 레코드예요. 화자가 예전에 아끼던 노래를 다시 꺼내는 장면이에요."},{"id":"a7","tk":[{"t":"あの","p":"연체사","m":"그","w":"この·その·あの 같은 지시어는 히라가나로 써요."},{"t":"{日|ひ}","p":"명사","m":"날"},{"t":"の"},{"t":"{夢|ゆめ}","p":"명사","m":"꿈","n":"한국어 '몽(夢)'과 같은 한자예요. 夢中(むちゅう, 몰두)에서는 む로 읽어요."},{"t":"が"},{"t":"{踊|おど}る","p":"동사","m":"춤춰","w":"어간 踊는 한자, る는 히라가나예요.","n":"踊る는 5단 동사예요. 1절 끝 줄의 踊ろうよ(춤추자)로 다시 나와요."}],"ko":"그날의 꿈이 춤춰","lit":"그 / 날 / 의 / 꿈 / 이 / 춤추다","g":[{"k":"あの〜","d":"あの日 = 그날. あの는 서로 아는 지난 일을 가리켜요."}],"s":"줄 전체가 한자 명사(日·夢)와 히라가나 조사로 이루어져 있어요. 踊る만 오쿠리가나 る가 붙어 동사라는 게 보여요.","c":"레코드에서 흘러나오는 소리를 '그날의 꿈이 춤춘다'고 했어요. 노래를 들으면 그때의 꿈이 되살아나는 느낌으로 읽혀요."},{"id":"a8","tk":[{"t":"{真面目|まじめ}に","p":"な형용사","m":"진지하게","b":"{真面目|まじめ}","bm":"진지함, 성실함","w":"真面目는 단어 전체를 まじめ로 읽는 주쿠지쿤(熟字訓)이에요. マリーゴールド에도 나왔어요."},{"t":"{針|はり}","p":"명사","m":"바늘 (레코드 바늘)","n":"한국어 '침(針)'과 같은 한자예요. 時計の針(시곗바늘)."},{"t":"を"},{"t":"{落|お}とす","p":"동사","m":"내려놓아, 떨어뜨려","w":"어간 落는 한자, とす는 히라가나예요.","n":"落とす(떨어뜨리다, 타동사)와 落ちる(떨어지다, 자동사)는 짝이에요."}],"ko":"진지하게 바늘을 내려놓아","lit":"진지하게 / 바늘 / 을 / 떨어뜨린다","g":[{"k":"な형용사 + に","d":"真面目 → 真面目に(진지하게). マリーゴールド 1절의 真面目に見つめた와 같은 꼴이에요."}],"s":"真面目に는 マリーゴールド에서도 나온 말이에요. 아이묭 곡에서 '진지하게'가 두 곡 모두 첫머리에 나오는 게 재미있어요.","c":"針を落とす는 턴테이블 바늘을 레코드에 내려놓아 음악을 트는 동작이에요. 엉성한 서프라이즈지만, 레코드를 트는 손길만은 진지해요."},{"id":"a9","tk":[{"t":"{息|いき}","p":"명사","m":"숨","n":"息をする(숨을 쉬다), ため息(한숨)."},{"t":"を"},{"t":"{止|と}めすぎた","p":"동사","m":"너무 참았어","b":"{止|と}める","bm":"멈추다, 세우다","w":"어간 止는 한자, めすぎた는 히라가나예요. すぎる가 붙어 '너무 ~했다'가 됐어요.","n":"息を止める = 숨을 참다. 2절의 止まない(やまない)는 같은 止를 다르게 읽어요."},{"t":"ぜ"}],"ko":"숨을 너무 오래 참았지","lit":"숨 / 을 / 너무 멈췄다 / 지","g":[{"k":"〜すぎる","d":"동사 ます형 + すぎる = '너무 ~하다'. 止める → 止めすぎる. 과거형 止めすぎた."}],"s":"止는 이 줄에서는 と(める), 2절 止まない에서는 や(む)로 읽어요. 같은 한자에 쿤요미가 둘 있는 예예요.","c":"바늘을 내려놓는 동안 긴장해서 숨을 참고 있었다는 말이에요. 끝의 ぜ가 쑥스러움을 감추는 거친 말투로 들려요."}]},{"label":"1절 · Bメロ","note":"너를 앉히고, 보글보글 울리기 시작한 청춘의 소리에 맞춰 같이 춤추자고 해요.","lines":[{"id":"b1","tk":[{"t":"さあ","p":"감동사","m":"자","w":"감탄사라 히라가나로 써요.","n":"남을 재촉하거나 무언가를 시작할 때 써요. さあ、行こう(자, 가자)."},{"t":"{腰|こし}","p":"명사","m":"허리","n":"腰を下ろす = 허리를 내리다 → 앉다."},{"t":"を"},{"t":"{下|お}ろして","p":"동사","m":"내려놓아","b":"{下|お}ろす","bm":"내리다","w":"어간 下는 한자, ろして는 히라가나예요.","n":"下(아래 하)는 읽기가 많아요. した(아래), さがる(내려가다), おりる(내리다), おろす(내려놓다)."},{"t":"よ"}],"ko":"자, 앉아 봐","lit":"자 / 허리 / 를 / 내려놓아 / 줘","g":[{"k":"{腰|こし}を{下|お}ろす","d":"'허리를 내리다' = 앉다. 座る(すわる)보다 조금 차분하게 자리 잡고 앉는 느낌이에요."}],"s":"下는 한자 하나에 읽기가 아주 많은 글자예요. 이 줄에서는 오쿠리가나 ろす를 보고 おろす라고 읽어요.","c":"레코드가 돌기 시작하자 너에게 자리에 앉으라고 해요. 이제 함께 들을 준비가 됐어요."},{"id":"b2","tk":[{"t":"フツフツ","p":"부사","m":"보글보글, 부글부글","b":"ふつふつ","w":"보통 히라가나 ふつふつ로 쓰는데, 가타카나로 써서 소리가 또렷하고 힘 있게 튀어나오는 느낌을 줬어요.","n":"물이 끓어오르는 모양이나, 감정이 안에서 조금씩 끓어오르는 모양이에요. 怒りがふつふつと湧く(분노가 부글부글 끓어오르다)."},{"t":"と"},{"t":"{鳴|な}り{出|だ}す","p":"동사","m":"울리기 시작하는","b":"{鳴|な}り{出|だ}す","w":"鳴(울)와 出(나다) 두 한자 사이에 히라가나 り가 끼었어요. 鳴る + 出す가 합쳐진 복합동사예요.","n":"동사 ます형 + 出す = '~하기 시작하다'. 鳴り出す(울리기 시작하다), 泣き出す(울기 시작하다)."},{"t":"{青春|せいしゅん}"},{"t":"の"},{"t":"{音|おと}"}],"ko":"보글보글 울리기 시작하는 청춘의 소리","lit":"보글보글 / 하고 / 울리기 시작하는 / 청춘 / 의 / 소리","g":[{"k":"ます형 + {出|だ}す","d":"'~하기 시작하다'. 鳴る → 鳴り出す. 갑자기 시작되는 느낌이 있어요."},{"k":"의태어 + と","d":"フツフツと鳴り出す처럼 의태어 뒤에 と를 붙여 동사를 꾸며요."}],"s":"フツフツ는 원래 히라가나로 쓰는 말인데 가타카나로 썼어요. 가타카나는 소리를 또렷하게 강조할 때도 써요. 2절의 ダラダラ도 같아요.","c":"레코드 소리를 '청춘의 소리'라고 불러요. 끓어오르듯 울리기 시작하는 소리에, 마음도 같이 달아오르는 느낌이에요."},{"id":"b3","tk":[{"t":"{乾|かわ}いた"},{"t":"メロディ"},{"t":"で"},{"t":"{踊|おど}ろう","p":"동사","m":"춤추자","b":"{踊|おど}る","bm":"춤추다","w":"어간 踊는 한자, ろう는 히라가나예요.","n":"踊る → 의지형 踊ろう(춤추자)."},{"t":"よ"}],"ko":"메마른 멜로디에 맞춰 춤추자","lit":"메마른 / 멜로디 / 로 / 춤추자 / 요","g":[{"k":"의지형 〜おう","d":"5단 동사 끝 う단을 お단으로 바꾸고 う를 붙이면 '~하자'. 踊る → 踊ろう."}],"s":"メロディ는 보통 メロディー로 장음을 붙이기도 하지만, 이 곡의 원문은 ー 없이 썼어요. 외래어의 장음 표기는 사람마다 달라요.","c":"乾いた(메마른)는 거칠고 꾸밈없는 록 소리를 가리키는 말로 읽혀요. 그 소리에 맞춰 함께 춤추자고 해요."}]},{"label":"サビ · 후렴","note":"너는 록 같은 건 안 듣겠지만, 나는 이런 노래들로 사랑을 넘어 왔다고 고백해요.","lines":[{"id":"c1","tk":[{"t":"{君|きみ}"},{"t":"は"},{"t":"ロック"},{"t":"なんか"},{"t":"{聴|き}かない"},{"t":"と"},{"t":"{思|おも}いながら","p":"동사","m":"생각하면서","b":"{思|おも}う","bm":"생각하다","w":"어간 思는 한자, いながら는 히라가나예요.","n":"동사 ます형 + ながら = '~하면서'. 思いながら(생각하면서), 歩きながら(걸으면서)."}],"ko":"너는 록 같은 건 안 듣겠지 생각하면서도","lit":"너 / 는 / 록 / 같은 건 / 듣지 않는다 / 고 / 생각하면서","g":[{"k":"〜なんか","d":"'~같은 건, ~따위'. 앞의 말을 가볍게 낮춰 불러요. ロックなんか = 록 같은 건."},{"k":"ます형 + ながら","d":"'~하면서'. 두 동작이 동시에 일어나요. 思う → 思いながら."}],"s":"제목 君はロックを聴かない의 を가 후렴에서는 なんか로 바뀌었어요. '록을'이 '록 같은 건'이 되면서 쑥스럽고 체념한 말투가 됐어요.","c":"너는 내 취향과 다르다는 걸 알고 있어요. 그래도 다음 줄에서 조금이라도 다가와 주길 바라요."},{"id":"c2","tk":[{"t":"{少|すこ}し"},{"t":"でも","p":"조사","m":"~라도","n":"少しでも = 조금이라도. 一度でも(한 번이라도)."},{"t":"{僕|ぼく}"},{"t":"に"},{"t":"{近|ちか}づいて"},{"t":"ほしくて"}],"ko":"조금이라도 내게 다가와 줬으면 해서","lit":"조금 / 이라도 / 나 / 에게 / 다가와 / 주길 바라서","g":[{"k":"て형 + ほしい","d":"'~해 줬으면 좋겠다'. 近づく → 近づいてほしい. 끝을 くて로 바꾸면 '~해 줬으면 해서'라는 이유가 돼요."}],"s":"ほしい는 '갖고 싶다'일 때 欲しい로 쓰지만, '~해 주길 바라다'처럼 보조로 쓰면 히라가나로 써요. マリーゴールド의 みた(보조동사)와 같은 규칙이에요.","c":"록을 들려주는 진짜 이유가 나와요. 노래가 좋아서라기보다, 너와 가까워지고 싶어서예요."},{"id":"c3","tk":[{"t":"ロック"},{"t":"なんか"},{"t":"{聴|き}かない"},{"t":"と"},{"t":"{思|おも}う"},{"t":"けれども"}],"ko":"록 같은 건 안 듣겠지 싶지만","lit":"록 / 같은 건 / 듣지 않는다 / 고 / 생각하다 / 지만","g":[{"k":"〜と{思|おも}う","d":"'~라고 생각하다'. 앞 문장 끝에 と를 붙여 생각한 내용을 옮겨요."}],"s":"けれども는 けど보다 길고 또박또박한 말이에요. 박자에 맞춰 늘여 부르기 좋은 말이기도 해요.","c":"같은 말을 한 번 더 되풀이해요. 너는 안 들을 거라고 몇 번이고 스스로 확인하는 마음이에요."},{"id":"c4","tk":[{"t":"{僕|ぼく}"},{"t":"は"},{"t":"こんな"},{"t":"{歌|うた}"},{"t":"で"},{"t":"あんな"},{"t":"{歌|うた}"},{"t":"で"}],"ko":"나는 이런 노래로, 저런 노래로","lit":"나 / 는 / 이런 / 노래 / 로 / 저런 / 노래 / 로","g":[{"k":"こんな · あんな","d":"こんな(이런, 가까운 것), あんな(저런, 먼 것·지난 것). こんな歌であんな歌で = 이런 노래로 저런 노래로."}],"s":"한자는 僕·歌 두 글자뿐이고 나머지는 모두 히라가나예요. こ·そ·あ·ど 지시어는 히라가나로 쓰는 규칙이 잘 보여요.","c":"지금 틀어 준 노래도, 예전에 듣던 노래도 다 포함한 말이에요. 다음 줄에서 그 노래들로 무엇을 해 왔는지 나와요."},{"id":"c5","tk":[{"t":"{恋|こい}"},{"t":"を"},{"t":"{乗|の}り{越|こ}えてきた","p":"동사","m":"넘어 왔어, 견뎌 왔어","b":"{乗|の}り{越|こ}える","bm":"넘다, 극복하다","w":"乗(타다)와 越(넘다) 두 한자 사이에 り가 끼었어요. 乗る + 越える가 합쳐진 복합동사예요.","n":"乗り越える + てくる = '~해 오다'. 지금까지 쭉 넘어 왔다는 뜻이에요. 困難を乗り越える(어려움을 극복하다)."}],"ko":"사랑을 넘어 왔어","lit":"사랑 / 을 / 넘어 왔다","g":[{"k":"て형 + くる","d":"'~해 오다'. 과거부터 지금까지 이어진 일이에요. 乗り越える → 乗り越えてきた."}],"s":"乗り越える는 한자 둘에 오쿠리가나가 둘(り·える) 붙는 복합동사예요. 한자만 따라 읽으면 '타고 넘다'라는 그림이 보여요.","c":"실연이나 힘든 사랑을 록을 들으며 견뎌 왔다는 고백이에요. 그 노래들을 너에게 들려주는 건 내 마음의 역사를 보여 주는 일이에요."}]},{"label":"2절 · Aメロ","note":"심장이 BPM 190으로 뛰는데, 너는 눈치챘는지 갑자기 웃고 눈을 피해요.","lines":[{"id":"d1","tk":[{"t":"{僕|ぼく}"},{"t":"の"},{"t":"{心臓|しんぞう}","p":"명사","m":"심장","n":"한국어 '심장(心臟)'과 같은 한자어예요. 臓은 臟의 일본식 약자예요."},{"t":"の"},{"t":"{BPM|ビーピーエム}","p":"명사","m":"BPM (1분당 박자 수)","w":"영어 약자 BPM(beats per minute)을 알파벳 그대로 썼어요. 읽을 때는 알파벳을 하나씩 ビー·ピー·エム으로 읽어요.","n":"음악의 빠르기를 나타내는 단위예요. 심장 박동을 음악의 템포처럼 말한 재미있는 표현이에요."},{"t":"は"}],"ko":"내 심장의 BPM은","lit":"나 / 의 / 심장 / 의 / BPM / 은","g":[{"k":"〜の〜の","d":"僕の心臓のBPM = 나의 심장의 BPM. の를 여러 번 이어 쓸 수 있어요. 한국어로는 '내 심장의 BPM'처럼 하나만 남겨요."}],"s":"알파벳 약자가 가사 안에 그대로 나와요. 일본어는 영어 약자를 가타카나로 바꾸지 않고 알파벳으로 쓰는 일이 많아요(CD, DJ, BPM).","c":"심장 박동을 음악 용어로 말했어요. 록을 좋아하는 화자다운 표현이에요."},{"id":"d2","tk":[{"t":"{190|ひゃくきゅうじゅう}","p":"명사","m":"190","v":false,"w":"숫자를 아라비아 숫자로 썼어요. 읽을 때는 ひゃく(백) + きゅうじゅう(구십)예요.","n":"일본어 숫자: 100 ひゃく, 90 きゅうじゅう. 9는 きゅう 또는 く인데, 90은 きゅうじゅう로 읽어요."},{"t":"に"},{"t":"なった","p":"동사","m":"됐어","b":"なる","bm":"되다","w":"なる는 보통 히라가나로 써요."},{"t":"ぞ","p":"조사(종조사)","m":"~다고 (힘준 말투)","n":"주로 남성이 쓰는 말끝으로, 스스로 다짐하거나 상대에게 힘주어 알릴 때 써요."}],"ko":"190이 됐다고","lit":"190 / 에 / 되었다 / 고","g":[{"k":"〜になる","d":"'~이 되다'는 が가 아니라 に를 써요. 190になった = 190이 됐다. 大人になる(어른이 되다)."}],"s":"숫자 190을 아라비아 숫자로 썼어요. マリーゴールド의 2人처럼, 숫자를 그대로 써서 눈에 확 띄게 했어요.","c":"BPM 190은 아주 빠른 록 음악의 템포예요. 너 앞에서 심장이 그만큼 빨리 뛴다는 과장이에요."},{"id":"d3","tk":[{"t":"{君|きみ}"},{"t":"は"},{"t":"{気|き}づく","p":"동사","m":"눈치채다","w":"気(기운 기)는 한자, づく는 히라가나예요. 気 + 付く(つく)가 합쳐지며 つ가 づ로 탁해졌어요.","n":"気づく = 알아차리다, 눈치채다. 気が付く로도 써요."},{"t":"のかい","p":"조사(종조사)","m":"~는 거야?","n":"の + かい. 친근하지만 조금 남성적인 질문 말투예요."},{"t":"？"}],"ko":"넌 눈치챌까?","lit":"너 / 는 / 눈치채다 / 는 거야","g":[{"k":"〜のかい","d":"질문 끝에 붙이는 말투. 行くのかい?(가는 거야?). 조금 장난스럽고 남성적인 느낌이에요."}],"s":"물음표를 전각 ？로 썼어요. 일본어 문장에서는 물음표도 한자·가나와 같은 폭의 전각 문자를 쓰는 일이 많아요.","c":"빨리 뛰는 심장을 네가 알아챌지 조마조마한 마음이에요."},{"id":"d4","tk":[{"t":"なぜ","p":"부사","m":"왜","w":"한자로 쓰는 일이 거의 없는 의문사라 히라가나로 써요.","n":"なぜ는 どうして보다 조금 딱딱한 말이에요."},{"t":"{今|いま}","p":"명사","m":"지금"},{"t":"{笑|わら}うんだい","p":"동사","m":"웃는 거야","b":"{笑|わら}う","bm":"웃다","w":"어간 笑는 한자, うんだい는 히라가나예요.","n":"笑う + んだい(~는 거야?). んだい는 んだ의 질문형으로, 조금 남성적인 말투예요."},{"t":"？"}],"ko":"왜 지금 웃는 건데?","lit":"왜 / 지금 / 웃는 거야","g":[{"k":"〜んだい","d":"의문사와 함께 쓰는 질문 말투. なぜ笑うんだい = 왜 웃는 거야? 앞줄의 のかい와 짝이에요."}],"s":"笑うんだい처럼 ん으로 시작하는 말끝은 앞의 동사와 한 덩어리로 읽어요. 한글로는 '와라운다이'예요.","c":"너는 내 마음을 눈치챈 걸까, 갑자기 웃어요. 화자는 그 웃음의 뜻을 몰라 당황해요."},{"id":"d5","tk":[{"t":"{嘘|うそ}","p":"명사","m":"거짓말","w":"嘘는 조요칸지 밖의 글자예요. 일상 글에서는 うそ로도 많이 써요.","n":"嘘をつく = 거짓말을 하다. 嘘でしょ?(설마, 거짓말이지?)."},{"t":"みたいに","p":"조동사","m":"~처럼","n":"명사 + みたいに = '~처럼'. ような의 회화체예요. 夢みたいに(꿈처럼)."},{"t":"{泳|およ}ぐ","p":"동사","m":"헤엄치는 (흔들리는)","w":"어간 泳는 한자, ぐ는 히라가나예요.","n":"目が泳ぐ = 눈이 헤엄치다 → 당황해서 눈동자가 흔들리다, 눈을 피하다."},{"t":"{目|め}","p":"명사","m":"눈","n":"한국어 '목(目)'과 같은 한자예요."}],"ko":"거짓말처럼 흔들리는 눈","lit":"거짓말 / 처럼 / 헤엄치는 / 눈","g":[{"k":"{目|め}が{泳|およ}ぐ","d":"관용 표현. 당황하거나 숨기는 게 있을 때 눈동자가 이리저리 움직이는 모습이에요."},{"k":"〜みたいに","d":"'~처럼'. 嘘みたいに = 거짓말처럼."}],"s":"嘘도 埃처럼 조요칸지 밖의 한자예요. 이 곡은 埃·嘘 같은 어려운 한자를 일부러 한자로 남겼어요.","c":"웃던 너의 눈이 갑자기 흔들려요. 너도 나처럼 당황한 걸까, 하는 장면으로 읽혀요."}]},{"label":"2절 · Bメロ","note":"줄줄 흐르는 청춘의 소리, 메마른 멜로디는 멈추지 않아요.","lines":[{"id":"e1","tk":[{"t":"ダラダラ","p":"부사","m":"줄줄, 질질","b":"だらだら","w":"보통 히라가나 だらだら로 쓰는데 가타카나로 썼어요. 1절의 フツフツ와 짝을 이루는 표기예요.","n":"땀이나 물이 줄줄 흐르는 모양, 또는 빈둥빈둥 늘어지는 모양이에요. マリーゴールド의 だらける와 같은 뿌리예요."},{"t":"と"},{"t":"{流|なが}れる","p":"동사","m":"흐르는","w":"어간 流는 한자, れる는 히라가나예요.","n":"流れる(흐르다, 자동사)와 流す(흘리다, 타동사)는 짝이에요."},{"t":"{青春|せいしゅん}"},{"t":"の"},{"t":"{音|おと}"}],"ko":"줄줄 흐르는 청춘의 소리","lit":"줄줄 / 하고 / 흐르는 / 청춘 / 의 / 소리","g":[{"k":"의태어 + と + 동사","d":"ダラダラと流れる = 줄줄 흐르다. 1절 フツフツと鳴り出す와 같은 꼴이에요."}],"s":"1절 フツフツと鳴り出す青春の音, 2절 ダラダラと流れる青春の音. 가타카나 의태어 + と + 동사 + 青春の音이라는 같은 틀을 반복했어요.","c":"1절에서 끓어오르던 소리가 2절에서는 줄줄 흘러요. 시작의 설렘이 끝없이 이어지는 흐름으로 바뀌었어요."},{"id":"e2","tk":[{"t":"{乾|かわ}いた"},{"t":"メロディ"},{"t":"は"},{"t":"{止|や}まない","p":"동사","m":"멈추지 않아","b":"{止|や}む","bm":"그치다, 멎다","w":"어간 止는 한자, まない는 히라가나예요. 1절의 止める(とめる)와 같은 한자를 やむ로 읽었어요.","n":"止む = (비·소리가) 그치다. 雨が止む(비가 그치다). 止める(멈추다)와 읽기가 달라요."},{"t":"ぜ"}],"ko":"메마른 멜로디는 멈추지 않아","lit":"메마른 / 멜로디 / 는 / 그치지 않는다 / 지","g":[{"k":"〜ない (부정)","d":"止む → 止まない. む로 끝나는 5단 동사는 ま + ない가 돼요."}],"s":"같은 止를 1절에서는 とめる, 여기서는 やむ로 읽어요. 오쿠리가나(める·まない)를 보면 어떻게 읽을지 알 수 있어요.","c":"1절에서는 숨을 너무 참았는데(止めすぎた), 2절에서는 멜로디가 그치지 않아요(止まない). 같은 한자로 멈춤과 계속을 대비했어요."}]},{"label":"サビ 2 · 두 번째 후렴","note":"후렴을 되풀이하며, 이번에는 '조금만 더' 다가와 주길 바라고 사랑에 애태워 왔다고 해요.","lines":[{"same":"c1"},{"id":"f1","tk":[{"t":"あと","p":"부사","m":"앞으로, 조금 더","w":"후(後)라는 한자가 있지만, '앞으로 ~만 더'라는 뜻일 때는 히라가나로 써요.","n":"あと少し = 조금만 더. あと5分(앞으로 5분)."},{"t":"{少|すこ}し"},{"t":"{僕|ぼく}"},{"t":"に"},{"t":"{近|ちか}づいて"},{"t":"ほしくて"}],"ko":"조금만 더 내게 다가와 줬으면 해서","lit":"앞으로 / 조금 / 나 / 에게 / 다가와 / 주길 바라서","g":[{"k":"あと + 수량","d":"'~만 더'. あと少し(조금만 더), あと一回(한 번만 더)."}],"s":"첫 후렴의 少しでも(조금이라도)가 あと少し(조금만 더)로 바뀌었어요. 한 단어만 바꿔 바람이 조금 더 커졌어요.","c":"첫 후렴은 '조금이라도', 두 번째는 '조금만 더'예요. 이미 조금 가까워졌다는 느낌으로도 읽혀요."},{"same":"c3"},{"same":"c4"},{"id":"f2","tk":[{"t":"{恋|こい}"},{"t":"に"},{"t":"{焦|こ}がれてきたんだ","p":"동사","m":"애태워 왔어","b":"{焦|こ}がれる","bm":"애타게 그리다","w":"어간 焦는 한자, がれてきたんだ는 히라가나예요.","n":"焦がれる는 원래 '타다, 그을리다'(焦げる)에서 온 말로, 마음이 타듯 애타게 그리워하는 거예요. 恋焦がれる(사랑에 애태우다)."}],"ko":"사랑에 애태워 왔던 거야","lit":"사랑 / 에 / 애태워 왔던 거다","g":[{"k":"〜てきた + んだ","d":"'~해 왔던 거야'. 焦がれる → 焦がれてきた + んだ(설명·강조)."}],"s":"焦는 焦げる(こげる, 타다)의 한자예요. 사랑으로 마음이 '탄다'는 그림이 한자에 그대로 들어 있어요.","c":"첫 후렴은 사랑을 '넘어 왔다'였는데, 두 번째는 사랑에 '애태워 왔다'예요. 견뎌 온 것만이 아니라 그만큼 애타게 바라 왔다는 고백이에요."}]},{"label":"サビ 3 · 세 번째 후렴","part":"마지막","note":"너는 록을 안 듣는다는 걸 알지만, 연인처럼 곁에 있어 주길 바라며 또 가슴이 아파요.","lines":[{"id":"g1","tk":[{"t":"{君|きみ}"},{"t":"が"},{"t":"ロック"},{"t":"なんか"},{"t":"{聴|き}かない"},{"t":"こと","p":"형식명사","m":"~것","b":"こと","w":"'것'이라는 뜻만 남은 형식명사라 한자 事 대신 히라가나로 써요."},{"t":"{知|し}ってる","p":"동사","m":"알고 있어","b":"{知|し}る","bm":"알다","w":"어간 知는 한자, ってる는 히라가나예요.","n":"知る는 る로 끝나지만 5단 동사예요. 知っている → 회화체 知ってる."},{"t":"けど","p":"조사","m":"~지만","n":"けれども의 짧은 말이에요."}],"ko":"네가 록 같은 건 안 듣는다는 거 알지만","lit":"너 / 가 / 록 / 같은 건
