요.","c":"무서운 결말을 떠올리다가도 금세 네가 좋아할 아이스크림 맛을 상상해요. 첫 줄의 きっと로 시작한 망상이 다시 돌아오는 것으로 읽혀요."}]},{"label":"ラストサビ · 마지막 후렴","note":"첫 후렴을 그대로 되풀이하며, '내 것이 될 리 없겠지'로 끝나요.","lines":[{"same":"c1"},{"same":"c2"},{"same":"c3"},{"same":"c4"},{"same":"c5"},{"same":"c6"}]}]},"heroine":{"id":"heroine","title":"ヒロイン","artist":"back number","year":2015,"eyebrow":"back number · 2015","sub":"눈 내리는 날, 멀리 있는 '너'를 떠올리며 '이 장면의 주인공은 너였으면' 하고 바라는 겨울 러브송. 「JR SKISKI」 CM송.","release":"2015년 1월 21일 · 싱글 · 앨범 『シャンデリア』 수록","tieIn":"「JR SKISKI」 CM송","lyricist":"清水依与吏","composer":"清水依与吏","listen":"https://www.youtube.com/results?search_query=back+number+%E3%83%92%E3%83%AD%E3%82%A4%E3%83%B3","intro":"ヒロイン은 back number가 2015년 1월 21일에 낸 싱글이에요. 겨울 스키 여행 캠페인 「JR SKISKI」의 CM송으로 쓰였고, 앨범 『シャンデリア』에도 실렸어요. 작사·작곡은 보컬 清水依与吏예요. 같은 앨범에 クリスマスソング도 들어 있어요.\n\n화자는 눈 내리는 거리에서 다른 곳에 사는 '너'를 떠올려요. 눈이 예쁘다며 웃는 사람, 춥다면서도 즐거워하는 사람이 너였으면 좋겠다고 바라지만, 정작 문자 한 통도 끝까지 보내지 못해요. '君がいい(너였으면 좋겠어)'가 후렴마다 조금씩 커지다가 마지막에 '全部(전부)'가 되는 흐름, 그리고 打ちかけ·出しかけた처럼 하다 만 행동들을 따라 읽어 보세요.","notes":[{"tag":"배경","title":"스키 캠페인 CM송, 그리고 『シャンデリア』","body":"「JR SKISKI」는 해마다 겨울이면 스키장으로 떠나는 여행을 알리는 JR의 캠페인이에요. ヒロイン은 이 캠페인의 CM송으로 쓰였어요. 눈, 하얗게 물든 거리, 미끄러운 길에서 잡은 손처럼 가사 곳곳에 겨울 장면이 나와요.\n\n앨범 『シャンデリア』에는 같은 해 겨울에 나온 クリスマスソング도 실렸어요. クリスマスソング가 들뜬 크리스마스 거리를 투덜거리며 보는 노래라면, ヒロイン은 조용히 눈 오는 거리를 보며 혼자 상상하는 노래예요."},{"tag":"표현","title":"君がいい와 君でいい","body":"후렴의 [[{君|きみ}がいい]]는 '너였으면 좋겠어', 더 정확히는 '(다른 누구도 아닌) 네가 좋아'예요. 조사 が는 여러 후보 중에서 그것을 콕 집어 고르는 느낌이 있어요.\n\n조사를 で로 바꾼 [[{君|きみ}でいい]]는 '너라도 괜찮아'가 돼요. 다른 걸로 대신해도 되지만 이걸로 만족한다는 뜻이라 연인에게 쓰면 서운한 말이에요. 조사 한 글자로 '너여야 해'와 '너라도 돼'가 갈려요.\n\n후렴은 それも君がいい(그것도 너였으면)로 끝나다가, 마지막 후렴에서 全部君がいい(전부 너였으면)로 커져요."},{"tag":"표현","title":"〜そう, 두 가지 뜻","body":"이 곡에는 〜そう가 여러 번 나오는데 뜻이 두 가지예요.\n\n**겉모습: ~해 보이다.** 형용사 어간 + そう. [[{寂|さび}しそうに]](쓸쓸해 보이게), [[{嬉|うれ}しそうな]](기뻐 보이는), [[{楽|たの}しそうな]](즐거워 보이는). 화자가 너의 표정을 바라보며 하는 말이에요.\n\n**곧 일어날 일: ~할 것 같다, ~할 뻔하다.** 동사 ます형 + そう. [[{転|ころ}びそうになって]](넘어질 뻔해서), [[{忘|わす}れてしまいそう]](잊어버릴 것 같아).\n\n伝聞(전해 들은 말)의 そうだ(~라고 한다)도 있는데, 이건 형용사·동사의 기본형에 붙어서(寂しいそうだ) 모양이 달라요."},{"tag":"표현","title":"하다 만 것들: 〜かけ","body":"동사 ます형 + かける는 '~하다가 말다, ~하려던 참이다'예요. 이 곡의 화자는 자꾸 끝까지 하지 못해요.\n\n[[{打|う}ちかけのまま]]: 문자를 치다 만 채로 주머니에 넣어요. [[{出|だ}しかけた{答|こた}え]]: 꺼내려다 만 대답에 가슴이 아파요.\n\n같은 かけ가 명사(打ちかけ)로도, 동사(出しかけた)로도 쓰였어요. 한 번 익혀 두면 読みかけの本(읽다 만 책), 食べかけ(먹다 만 것)처럼 일상에서도 자주 보여요."},{"tag":"표기","title":"조요칸지 밖의 한자와 観る","body":"이 곡에는 조요칸지(常用漢字, 일상에서 쓰도록 정한 한자 목록)에 없는 한자가 여러 개 나와요. [[{綺麗|きれい}]]의 綺, [[{嬉|うれ}しい]]의 嬉, [[{掴|つか}む]]의 掴, [[{怯|おび}える]]의 怯예요. 신문이라면 きれい, うれしい처럼 히라가나로 풀어 쓰는 말이지만, 노래 가사에서는 한자로 쓰는 일이 많아요. Pretender, クリスマスソング에도 나온 綺麗가 대표적이에요.\n\n[[{観|み}たって]]의 観도 볼 만해요. 観는 조요칸지지만, 표에 올라 있는 읽기는 かん(観光, 観客)뿐이에요. 영화나 공연을 '감상하다'는 뜻을 살리려고 見る 대신 観る를 골랐어요."},{"tag":"구성","title":"끝나지 않는 문장들","body":"이 곡에는 말끝이 없는 문장이 자주 나와요. [[ああ{今|いま}{隣|となり}で]](아아, 지금 옆에서), [[{隣|となり}に{描|えが}くのはいつでも]](옆에 그리는 건 언제나), [[{街|まち}がこんなにも]](거리가 이렇게나).\n\n앞의 두 문장은 바로 뒤의 후렴이나 다음 줄이 뒷말을 채워요. 옆에서 눈이 예쁘다며 웃는 건 너, 옆에 그리는 건 언제나 너. 마지막의 こんなにも는 끝내 말을 맺지 않아서, '이렇게나 (달라 보이다니)'처럼 듣는 사람이 채우게 둬요. 말을 끝까지 못 하는 화자의 성격과도 겹쳐 읽혀요."},{"tag":"문화","title":"일본의 メール","body":"[[メール]]는 영어 mail에서 온 말이에요. 일본에서는 컴퓨터 이메일뿐 아니라 휴대폰으로 주고받는 짧은 문자도 메일이라고 불러 왔어요. 그래서 이 곡의 メールを送ろうとして는 '문자를 보내려다'로 옮기는 게 자연스러워요.\n\n문자를 '쓰다'를 打つ(치다)로 말하는 것도 일본어다운 표현이에요. 자판을 두드리는 동작에서 온 말이라 キーボードを打つ(키보드를 치다)처럼도 써요."}],"dict":{"{君|きみ}":{"p":"대명사","m":"너","w":"'너'를 뜻하는 대명사로, 한자로 쓰는 게 일반적이에요.","n":"원래 '임금'을 뜻하던 한자예요(君主 = 군주). 지금은 가까운 사이에서 부르는 '너'예요."},"{僕|ぼく}":{"p":"대명사","m":"나 (남성)","w":"1인칭 대명사로 한자로 쓰는 게 일반적이에요.","n":"僕는 부드럽고 소년 같은 느낌의 1인칭이에요."},"{雪|ゆき}":{"p":"명사","m":"눈","n":"한국어 '설(雪)'과 같은 한자예요(설경 = 雪景). 雪だるま = 눈사람."},"{綺麗|きれい}":{"p":"な형용사","m":"예쁘다, 아름답다","w":"綺는 조요칸지 밖의 한자라 신문에서는 きれい로 풀어 쓰지만, 노래 가사에서는 한자로 자주 써요.","n":"'예쁘다'와 '깨끗하다' 두 뜻이 있어요. Pretender와 クリスマスソング에도 나온 말이에요."},"{街|まち}":{"p":"명사","m":"거리, 동네","w":"같은 まち라도 町는 행정 단위의 동네, 街는 가게와 사람이 모인 거리 느낌이에요.","n":"한국어 '가(街)'와 같은 한자예요(상가 = 商店街)."},"{隣|となり}":{"p":"명사","m":"옆, 곁","n":"隣の席 = 옆자리. 한국어 '인(隣)'과 같은 한자예요(인접 = 隣接)."},"いい":{"p":"い형용사","m":"좋다, 괜찮다","n":"AがいいB는 'A가 좋다(A로 하고 싶다)'라고 고를 때 써요."},"かな":{"p":"조사(종조사)","m":"~일까, ~할까","n":"혼잣말처럼 스스로에게 묻는 말끝이에요. 상대에게 대답을 요구하지 않아요."},"って":{"p":"조사","m":"~라고 (인용)","n":"인용의 と를 회화체로 바꾼 말이에요. 寒いねって = '춥네'라고."},"{笑|わら}う":{"p":"동사","m":"웃다","b":"{笑|わら}う","bm":"웃다","w":"어간 笑는 한자, う는 히라가나예요."},"の":{"p":"조사","m":"~의"},"は":{"p":"조사","m":"~은/는 (주제)","n":"조사로 쓸 때는 ha가 아니라 wa로 읽어요."},"が":{"p":"조사","m":"~이/가"},"を":{"p":"조사","m":"~을/를","n":"현대 일본어에서 を는 이 조사에만 쓰는 글자예요. 발음은 お(o)와 같아요."},"に":{"p":"조사","m":"~에, ~에게"},"で":{"p":"조사","m":"~에서"},"と":{"p":"조사","m":"~라고 (인용)"},"も":{"p":"조사","m":"~도"},"ね":{"p":"조사(종조사)","m":"~네, ~지","n":"말끝의 ね는 상대에게 동의를 구하거나 느낌을 나눌 때 붙여요."},"から":{"p":"조사","m":"~에서, ~부터"},"なのも":{"p":"조사(복합)","m":"~한 것도","n":"な(な형용사의 연결형) + の(것) + も(~도)."},"なるんだろう":{"p":"동사","m":"~해질까","b":"なる","bm":"되다","w":"なる는 보통 히라가나로 써요. んだろう는 '~하는 걸까' 하고 짐작하는 말끝이에요.","n":"〜たくなる(~하고 싶어지다)에 んだろう가 붙어 '~하고 싶어질까'가 됐어요."}},"sections":[{"label":"1절 · Aメロ","note":"하얀 하늘에서 눈이 떨어지고, '별로 상관없어' 하며 내뱉은 한숨이 쓸쓸하게 사라져요.","lines":[{"id":"a1","tk":[{"t":"{君|きみ}"},{"t":"の"},{"t":"{毎日|まいにち}","p":"명사","m":"매일, 하루하루","n":"한국어 '매일(每日)'과 같은 한자예요. 毎는 每의 일본식 모양이에요."},{"t":"に"},{"t":"　"},{"t":"{僕|ぼく}"},{"t":"は"},{"t":"{似合|にあ}わない","p":"동사","m":"어울리지 않는","b":"{似合|にあ}う","bm":"어울리다","w":"似合는 한자, 활용 어미 わない는 히라가나예요.","n":"似(닮을 사) + 合(합할 합). 似合う → 似合わない(부정)처럼 う가 わ로 바뀌어요."},{"t":"かな"}],"ko":"너의 하루하루에 나는 어울리지 않는 걸까","lit":"너 / 의 / 매일 / 에 / 나 / 는 / 어울리지 않는 / 걸까","g":[{"k":"〜ないかな","d":"'~하지 않을까, ~않는 걸까'. 부정형 + かな로 혼잣말처럼 스스로에게 물어요. 2절의 変われないかな와 같은 모양이에요."}],"s":"君·毎日·僕·似合처럼 뜻을 담은 부분은 한자, の·に·は·かな 같은 조사와 활용 어미는 히라가나예요. 원문은 毎日に 뒤에 전각 공백을 두어 한 번 숨을 쉬어요.","c":"곡의 첫 줄부터 화자는 자신이 없어요. 君の毎日(너의 일상)에 내가 들어가도 될까 하는 물음이에요. 高嶺の花子さん의 닿지 않는 사람을 바라보는 화자와도 닮았어요."},{"id":"a2","tk":[{"t":"{白|しろ}い","p":"い형용사","m":"하얀","w":"어간 白는 한자, い는 히라가나예요."},{"t":"{空|そら}","p":"명사","m":"하늘"},{"t":"から"},{"t":"　"},{"t":"{雪|ゆき}"},{"t":"が"},{"t":"{落|お}ちた","p":"동사","m":"떨어졌다","b":"{落|お}ちる","bm":"떨어지다","w":"어간 落는 한자, ちた는 히라가나예요."}],"ko":"하얀 하늘에서 눈이 떨어졌어","lit":"하얀 / 하늘 / 에서 / 눈 / 이 / 떨어졌다","g":[{"k":"〜から (출발점)","d":"'~에서, ~부터'. 장소나 때의 출발점을 나타내요. 空から = 하늘에서."},{"k":"1단 동사의 과거 〜た","d":"落ちる처럼 る로 끝나는 1단 동사는 る를 떼고 た를 붙여요. 落ちる → 落ちた."}],"s":"눈이 내리다는 보통 雪が降る라고 하는데, 여기서는 落ちた(떨어졌다)를 골랐어요. 같은 장면도 동사에 따라 느낌이 달라져요.","c":"흐린 겨울 하늘을 白い空(하얀 하늘)라고 불렀어요. 펑펑 '내린다'보다, 한 송이가 툭 '떨어진' 첫눈처럼 읽혀요."},{"id":"a3","tk":[{"t":"{別|べつ}に","p":"부사","m":"딱히, 뭐","b":"{別|べつ}に","bm":"딱히, 별로","w":"別(다를 별)은 한자, に는 히라가나예요.","n":"뒤에 부정이 오면 '별로 ~않다'(別に好きじゃない). 혼자 쓰면 '딱히(아무것도)', 별 관심 없다는 대답이 돼요."},{"t":"いい"},{"t":"さ","p":"조사(종조사)","m":"~야, ~지 뭐","n":"가볍게 단정하는 말끝이에요. 조금 허세 부리는 느낌이 있어요."},{"t":"と"},{"t":"　"},{"t":"{吐|は}き{出|だ}した","p":"동사","m":"내뱉은","b":"{吐|は}き{出|だ}す","bm":"내뱉다, 토해 내다","w":"吐(토할 토)와 出(날 출)에 각각 루비를 달았어요. 사이의 き와 끝의 した는 히라가나예요.","n":"吐く(뱉다) + 出す(내다)가 합친 복합동사예요."},{"t":"ため{息|いき}","p":"명사","m":"한숨","w":"溜め息로 쓰기도 하지만 溜는 조요칸지 밖이라 ため를 히라가나로 풀었어요. 息(숨 식)만 한자예요.","n":"ため(모으다) + 息(숨). 모았던 숨을 한꺼번에 내쉬는 것, 즉 한숨이에요."},{"t":"が"}],"ko":"뭐 괜찮아, 하고 내뱉은 한숨이","lit":"딱히 / 괜찮다 / 지 뭐 / 라고 / 내뱉은 / 한숨 / 이","g":[{"k":"{別|べつ}にいい","d":"'딱히 상관없어, 아무래도 괜찮아'. 정말 괜찮을 때보다 서운함을 감출 때 자주 써요."},{"k":"〜と (인용)","d":"말이나 생각을 그대로 옮길 때 붙여요. 別にいいさと = '뭐 괜찮아'라고."}],"s":"ため息는 한자 溜め息로도 쓰지만 ため를 히라가나로 풀었어요. 앞의 吐き出した가 한자가 많아서, 히라가나 ため가 눈에 부드럽게 들어와요.","c":"別にいいさ는 입으로는 '괜찮아'인데, 바로 한숨이 나와요. 말과 속마음이 엇갈리는 화자예요."},{"id":"a4","tk":[{"t":"{少|すこ}し","p":"부사","m":"조금, 잠깐","w":"어간 少는 한자, し는 히라가나예요."},{"t":"{残|のこ}って","p":"동사","m":"남아서","b":"{残|のこ}る","bm":"남다","w":"어간 残는 한자, って는 히라가나예요."},{"t":"　"},{"t":"{寂|さび}しそうに","p":"부사","m":"쓸쓸해 보이게","b":"{寂|さび}しい","bm":"쓸쓸하다, 외롭다","w":"寂은 한자, しそうに는 히라가나예요.","n":"寂しい → 寂しそう(쓸쓸해 보이는) → 寂しそうに(쓸쓸해 보이게). 한국어 '적막(寂寞)'의 寂이에요."},{"t":"{消|き}えた","p":"동사","m":"사라졌다","b":"{消|き}える","bm":"사라지다, 꺼지다","w":"어간 消는 한자, えた는 히라가나예요."}],"ko":"잠깐 남아 있다가 쓸쓸하게 사라졌어","lit":"조금 / 남아서 / 쓸쓸해 보이게 / 사라졌다","g":[{"k":"형용사 + そうに","d":"い형용사 어간 + そう = '~해 보이다'. そうに는 부사처럼 동사를 꾸며요. 寂しい → 寂しそうに消えた."}],"s":"少し·残·寂·消, 뜻을 담은 글자만 한자예요. 원문은 残って 뒤에 전각 공백을 두어, 한숨이 잠깐 머무는 시간을 띄어쓰기로 보여 줘요.","c":"추운 날 한숨이 하얀 김이 되어 잠깐 남았다가 사라지는 장면이에요. 한숨이 '쓸쓸해 보였다'고 말하지만, 쓸쓸한 건 화자 쪽으로 읽혀요."}]},{"label":"1절 · Bメロ","note":"네가 있는 거리에도 눈이 오고 있을까 떠올리다가, '지금 옆에서'라는 상상으로 넘어가요.","lines":[{"id":"b1","tk":[{"t":"{君|きみ}"},{"t":"の"},{"t":"{街|まち}"},{"t":"に"},{"t":"も"},{"t":"　"},{"t":"{降|ふ}っている","p":"동사","m":"내리고 있는","b":"{降|ふ}る","bm":"(눈·비가) 내리다","w":"어간 降는 한자, っている는 히라가나예요.","n":"降る는 눈·비가 하늘에서 내리는 것. 버스에서 '내리다'는 降りる(おりる)로, 같은 한자 다른 말이에요."},{"t":"かな"}],"ko":"네가 사는 거리에도 내리고 있을까","lit":"너 / 의 / 거리 / 에 / 도 / 내리고 있다 / 걸까","g":[{"k":"〜ている (진행)","d":"'~하고 있다'. 降る → 降っている. 5단 동사 る는 って로 바뀌어요."},{"k":"にも","d":"に(~에) + も(~도) = '~에도'. 君の街にも = 네 거리에도."}],"s":"まち를 町가 아니라 街로 썼어요. 街는 가게와 사람이 모인 '거리'의 느낌이라, 네가 지내는 도시 풍경이 떠올라요.","c":"君の街(너의 거리)라는 말에서 두 사람이 다른 곳에 산다는 게 보여요. 같은 눈을 보고 있을지 궁금해하는 거리감이 곡 전체에 깔려요."},{"id":"b2","tk":[{"t":"ああ","p":"감동사","m":"아아","w":"감탄하는 소리라 히라가나로 써요."},{"t":"{今|いま}","p":"명사","m":"지금"},{"t":"{隣|となり}"},{"t":"で"}],"ko":"아아, 지금 내 옆에서","lit":"아아 / 지금 / 옆 / 에서","g":[{"k":"〜で (동작의 장소)","d":"'~에서'. 무언가를 하는 곳에 붙여요. 隣で = 옆에서."}],"c":"문장이 '옆에서'로 끝나고, 무엇을 하는지는 바로 다음 후렴이 채워요. 옆에서 눈이 예쁘다며 웃는 건 너였으면, 하고 상상으로 넘어가는 다리예요."}]},{"label":"サビ · 후렴","note":"눈이 예쁘다며 웃는 사람도, 춥다며 기뻐하는 사람도, 넘어질 뻔해 손을 잡는 사람도 너였으면 좋겠다고 늘어놓아요.","lines":[{"id":"c1","tk":[{"t":"{雪|ゆき}"},{"t":"が"},{"t":"{綺麗|きれい}"},{"t":"と"},{"t":"{笑|わら}う"},{"t":"の","p":"형식명사","m":"것, ~하는 사람","v":false,"w":"형식명사 の는 히라가나로 써요.","n":"동사 뒤의 の는 '~하는 것(사람)'이라는 뜻으로 앞말을 명사로 만들어요."},{"t":"は"},{"t":"{君|きみ}"},{"t":"が"},{"t":"いい"}],"ko":"눈이 예쁘다며 웃는 건 너였으면 좋겠어","lit":"눈 / 이 / 예쁘다 / 라고 / 웃다 / 것 / 은 / 너 / 가 / 좋다","g":[{"k":"〜のは〜がいい","d":"'~하는 건 …가 좋아' = '~하는 건 …였으면 좋겠어'. の가 앞 문장을 '~하는 것(사람)'으로 묶어요."},{"k":"{綺麗|きれい}と","d":"원래 綺麗だと인데 회화에서 だ를 빼고 말했어요. 이 말을 그대로 옮기는 인용의 と예요."}],"s":"綺麗의 綺는 조요칸지 밖의 한자예요. 신문이라면 きれい로 풀겠지만 노래 가사에서는 한자로 쓰는 일이 많아요. Pretender, クリスマスソング에도 같은 綺麗가 나왔어요.","c":"제목 ヒロイン과 이어지는 줄이에요. 눈 오는 장면의 여주인공이 너였으면 하는 바람이에요. が를 で로 바꾼 君でいい는 '너라도 괜찮아'라 전혀 다른 말이 돼요(노트 참고)."},{"id":"c2","tk":[{"t":"でも","p":"접속사","m":"그래도, 하지만","w":"접속사는 보통 히라가나로 써요."},{"t":"{寒|さむ}い","p":"い형용사","m":"춥다","w":"어간 寒은 한자, い는 히라가나예요.","n":"한국어 '한(寒)'과 같은 한자예요(한파 = 寒波)."},{"t":"ね"},{"t":"って"},{"t":"{嬉|うれ}しそう","p":"な형용사","m":"기뻐 보이는","b":"{嬉|うれ}しい","bm":"기쁘다","w":"嬉는 조요칸지 밖의 한자라 신문에서는 うれしい로 쓰지만, 가사에서는 한자로 썼어요.","n":"嬉しい → 嬉しそう(기뻐 보이는). 뒤에 の가 오면 嬉しそうなの가 돼요."},{"t":"なのも"}],"ko":"'그래도 춥네' 하면서 기뻐 보이는 것도","lit":"그래도 / 춥다 / 네 / 라고 / 기뻐 보이는 / 한 것도","g":[{"k":"〜って (인용)","d":"인용의 と를 회화체로 바꾼 말이에요. 寒いねって = '춥네'라고."},{"k":"형용사 + そうなの","d":"'~해 보이는 것'. 1절의 寂しそうに와 같은 そう예요. 嬉しい → 嬉しそう → 嬉しそうなの(기뻐 보이는 것)."}],"s":"嬉도 綺처럼 조요칸지 밖의 한자예요. 이 곡은 기쁨·아름다움 같은 감정 말을 일부러 한자로 써서 무게를 줘요.","c":"でも로 앞 줄을 이어요. 눈이 예쁘다 하다가 '그래도 춥다'고 투정하면서도 얼굴은 기뻐 보이는, 그런 모습까지 너였으면 하는 거예요."},{"id":"c3","tk":[{"t":"{転|ころ}びそうに","p":"동사","m":"넘어질 뻔하게","b":"{転|ころ}ぶ","bm":"넘어지다","w":"어간 転은 한자, びそうに는 히라가나예요.","n":"転(구를 전). 한국어 '전락(転落)'의 転이에요. 転ぶ → 転び(ます형) → 転びそう."},{"t":"なって","p":"동사","m":"되어서","b":"なる","bm":"되다","w":"なる는 보통 히라가나로 써요."},{"t":"{掴|つか}んだ","p":"동사","m":"붙잡은","b":"{掴|つか}む","bm":"붙잡다, 쥐다","w":"掴는 조요칸지 밖의 한자예요. 신문에서는 つかむ로 쓰지만 가사에서는 한자로 썼어요.","n":"む로 끝나는 동사의 과거형은 んだ가 돼요. 掴む → 掴んだ, 読む → 読んだ."},{"t":"{手|て}","p":"명사","m":"손"},{"t":"の"},{"t":"その","p":"연체사","m":"그","w":"こ·そ·あ·ど 지시어는 히라가나로 써요."},{"t":"{先|さき}","p":"명사","m":"끝, 그 너머","n":"先는 '앞, 먼저, 끝'. 手の先 = 손끝. 한국어 '선(先)'과 같은 한자예요(선배 = 先輩)."},{"t":"で"}],"ko":"넘어질 뻔해서 붙잡은 손, 그 끝에서","lit":"넘어질 뻔하게 / 되어 / 붙잡은 / 손 / 의 / 그 / 끝 / 에서","g":[{"k":"동사 ます형 + そうになる","d":"'~할 뻔하다'. 転ぶ → 転び + そうになる = 넘어질 뻔하다. 형용사의 そう(~해 보이다)와 붙는 모양이 달라요."},{"k":"む → んだ (과거)","d":"5단 동사 중 む·ぶ·ぬ로 끝나는 말은 과거형이 んだ가 돼요. 掴む → 掴んだ."}],"s":"掴도 조요칸지 밖의 한자예요. 綺麗·嬉しい·掴む까지 후렴 한 바퀴에 표 밖 한자가 세 개 나와요.","c":"눈 쌓인 길에서 미끄러질 뻔해 손을 잡는 장면이에요. 그 손끝, 그 너머에서 너는 '고마워' 하고 웃어요. 다음 줄로 이어져요."},{"id":"c4","tk":[{"t":"ありがとう","p":"감동사","m":"고마워","kana":"ありがと","ro":"arigatou","w":"有り難う로 쓸 수도 있지만 인사말은 보통 히라가나로 써요.","n":"有り難い(있기 어렵다 = 드물고 귀하다)에서 온 말이에요. 정중하게는 ありがとうございます."},{"t":"って"},{"t":"{楽|たの}しそう","p":"な형용사","m":"즐거워 보이는","b":"{楽|たの}しい","bm":"즐겁다","w":"어간 楽는 한자, しそう는 히라가나예요."},{"t":"なのも"}],"ko":"'고마워' 하면서 즐거워 보이는 것도","lit":"고마워 / 라고 / 즐거워 보이는 / 한 것도","g":[{"k":"〜って〜そうなのも","d":"c2의 寒いねって嬉しそうなのも와 같은 틀이에요. 말한 것(って) + 표정(そうな) + 것도(のも)를 되풀이해요."}],"s":"ありがとう는 히라가나로 쓰는 게 보통이에요. 한자 有り難う로 쓰면 편지처럼 딱딱해 보여요.","c":"같은 모양의 문장을 두 번 겹쳐서, 화자가 상상 속 장면을 하나하나 아껴 꺼내 보는 느낌이 나요."},{"id":"c5","tk":[{"t":"それ","p":"대명사","m":"그것","w":"こ·そ·あ·ど 지시어는 히라가나로 써요."},{"t":"も"},{"t":"{君|きみ}"},{"t":"が"},{"t":"いい"}],"ko":"그것도 너였으면 좋겠어","lit":"그것 / 도 / 너 / 가 / 좋다","g":[{"k":"〜も","d":"'~도'. 앞에서 늘어놓은 장면들에 하나를 더 얹어요."}],"c":"늘어놓은 장면들을 それ(그것)로 받아 '그것도 너였으면'으로 정리해요. 마지막 후렴에서는 이 자리가 全部(전부)로 바뀌어요."}]},{"label":"2절 · Aメロ","note":"온통 하얘진 거리에서 '생각보다 많이 쌓였네' 하고 문자를 보내려다, 치다 만 채로 주머니에 넣어요.","lines":[{"id":"d1","tk":[{"t":"{気付|きづ}けば","p":"동사","m":"정신 차려 보면","b":"{気付|きづ}く","bm":"알아차리다","w":"気와 付에 루비를 하나로 달았어요. けば는 히라가나예요. 気づく처럼 付를 히라가나로 쓰기도 해요.","n":"気(기운 기) + 付く(붙다). '마음이 붙다' = 알아차리다."},{"t":"{辺|あた}り","p":"명사","m":"주변, 근처","w":"명사인데 오쿠리가나 り가 붙은 말이에요.","n":"辺り一面 = 온 주변. 辺(가 변)은 한국어 '주변(周辺)'의 辺이에요."},{"t":"は"},{"t":"　"},{"t":"ほとんど","p":"명사","m":"거의 대부분","w":"殆ど라는 한자가 있지만 조요칸지 밖이라 보통 히라가나로 써요."},{"t":"が"},{"t":"{白|しろ}く","p":"い형용사","m":"하얗게","b":"{白|しろ}い","bm":"하얗다","w":"어간 白는 한자, く는 히라가나예요."},{"t":"{染|そ}まって","p":"동사","m":"물들어","b":"{染|そ}まる","bm":"물들다","w":"어간 染는 한자, まって는 히라가나예요.","n":"染まる(물들다, 자동사)와 染める(물들이다, 타동사)는 짝이에요. 한국어 '염색(染色)'의 染이에요."}],"ko":"정신 차려 보면 주변은 거의 다 하얗게 물들어서","lit":"정신 차려 보면 / 주변 / 은 / 거의 대부분 / 이 / 하얗게 / 물들어서","g":[{"k":"{気付|きづ}けば","d":"'정신 차려 보니, 어느새'. 가정의 ば가 굳어진 관용 표현이에요. 문장 맨 앞에서 시간이 흐른 걸 알려요."},{"k":"い형용사 く형 + 동사","d":"い를 く로 바꾸면 부사처럼 동사를 꾸며요. 白い → 白く染まる(하얗게 물들다)."}],"s":"ほとんど는 한자 殆ど가 있지만 히라가나로 써요. 辺り는 명사인데 오쿠리가나가 붙는 말이에요. 원문은 이 줄을 전각 공백 하나로 이어 한 줄로 써요.","c":"1절에서 한 송이씩 떨어지던 눈이 2절에서는 거리를 온통 덮었어요. 시간이 지나는 걸 눈이 쌓이는 모습으로 보여 줘요."},{"id":"d2","tk":[{"t":"{散|ち}らかってた","p":"동사","m":"어질러져 있던","b":"{散|ち}らかる","bm":"어질러지다","w":"어간 散는 한자, らかってた는 히라가나예요.","n":"散(흩을 산)은 한국어 '산만(散漫)'의 散이에요. 散らかす(어지르다, 타동사)와 짝이에요."},{"t":"{事|こと}","p":"형식명사","m":"것, 일","w":"형식명사 こと는 보통 히라가나로 쓰는데 한자 事로 썼어요. クリスマスソング에서도 back number는 事를 한자로 썼어요."},{"t":"　"},{"t":"{忘|わす}れて","p":"동사","m":"잊어","b":"{忘|わす}れる","bm":"잊다","w":"어간 忘는 한자, れて는 히라가나예요."},{"t":"しまいそう","p":"보조동사","m":"~해 버릴 것 같아","b":"しまう","bm":"(~해) 버리다","w":"보조동사로 쓰는 しまう는 히라가나로 써요."}],"ko":"어질러져 있던 일들도 잊어버릴 것 같아","lit":"어질러져 있던 / 것 / 잊어 / 버릴 것 같다","g":[{"k":"〜てた","d":"〜ていた의 회화체예요. 散らかっていた → 散らかってた."},{"k":"〜てしまいそう","d":"〜てしまう(~해 버리다) + そう(~할 것 같다) = '~해 버릴 것 같다'. しまう → しまい + そう."}],"s":"형식명사 こと를 한자 事로 썼어요. 신문 표기 기준이라면 히라가나지만, back number 가사에서는 事를 한자로 쓰는 일이 많아요.","c":"散らかってた事는 어질러진 방일 수도, 엉켜 있던 마음일 수도 있어요. 눈이 거리를 하얗게 덮듯 그것들도 덮어 버릴 것 같다는 거예요."},{"id":"d3","tk":[{"t":"{意外|いがい}と","p":"부사","m":"생각보다, 의외로","b":"{意外|いがい}","bm":"의외","w":"意外(뜻 의, 바깥 외)는 한자, と는 히라가나예요.","n":"한국어 '의외(意外)'와 같은 한자어예요. 意外と는 회화에서 '생각보다'라는 뜻으로 자주 써요."},{"t":"{積|つ}もった","p":"동사","m":"쌓였다","b":"{積|つ}もる","bm":"(눈·먼지가) 쌓이다","w":"어간 積는 한자, もった는 히라가나예요.","n":"積(쌓을 적)은 한국어 '적립(積立)'의 積이에요. 雪が積もる = 눈이 쌓이다."},{"t":"ね"},{"t":"と"},{"t":"　"},{"t":"メール","p":"명사","m":"문자, 메일","w":"영어 mail에서 온 외래어라 가타카나로 써요. ー는 장음 표시예요."},{"t":"を"},{"t":"{送|おく}ろうとして","p":"동사","m":"보내려고 하다가","b":"{送|おく}る","bm":"보내다","w":"어간 送는 한자, ろうとして는 히라가나예요.","n":"送(보낼 송)은 한국어 '송금(送金)'의 送이에요."}],"ko":"생각보다 많이 쌓였네, 하고 문자를 보내려다","lit":"의외로 / 쌓였다 / 네 / 라고 / 문자 / 를 / 보내려고 하다가","g":[{"k":"의지형 + とする","d":"'~하려고 하다'. 送る → 送ろう(의지형) → 送ろうとする. て형 送ろうとして는 '보내려다가'."}],"s":"메일은 외래어라 가타카나 メール예요. 앞의 意外·積처럼 한자 많은 말 사이에서 눈에 띄어요. 원문은 이 줄도 전각 공백으로 이어 한 줄로 써요.","c":"일본에서는 휴대폰으로 주고받는 문자도 メール라고 불러 왔어요. 意外と積もったね처럼 별것 아닌 말을 핑계 삼아 연락하고 싶은 마음이에요."},{"id":"d4","tk":[{"t":"{打|う}ちかけ","p":"명사","m":"치다 만 것","b":"{打|う}つ","bm":"(글자·자판을) 치다","w":"打(칠 타)는 한자, ちかけ는 히라가나예요. かけ를 한자 掛け로 쓰지 않고 풀어 썼어요.","n":"打つ → 打ち(ます형) + かけ = 치다 만 것. 문자를 '쓰다'를 일본어로는 打つ(치다)라고 해요."},{"t":"の"},{"t":"まま","p":"명사","m":"~인 채로","w":"まま는 히라가나로 써요."},{"t":"　"},{"t":"ポケット","p":"명사","m":"주머니","w":"영어 pocket에서 온 외래어라 가타카나로 써요. ッ는 작은 ツ, 소쿠온이에요."},{"t":"に"},{"t":"{入|い}れた","p":"동사","m":"넣었다","b":"{入|い}れる","bm":"넣다","w":"어간 入는 한자, れた는 히라가나예요.","n":"入れる(넣다, 타동사)와 入る(はいる, 들어가다, 자동사)는 짝이에요."}],"ko":"치다 만 채로 주머니에 넣었어","lit":"치다 만 것 / 의 / 채로 / 주머니 / 에 / 넣었다","g":[{"k":"동사 ます형 + かけ","d":"'~하다 만 (것)'. 打つ → 打ちかけ. 読みかけの本(읽다 만 책)처럼 써요. 사비 2의 出しかけた와 같은 かけ예요."},{"k":"〜のまま","d":"명사 + のまま = '~인 채로'. 打ちかけのまま = 치다 만 상태 그대로."}],"s":"외래어 ポケット는 가타카나, 打는 한자, ちかけのまま는 히라가나로 세 가지 문자가 다 나와요.","c":"결국 문자는 보내지 못해요. 1절의 別にいいさ처럼, 마음과 달리 한 발 물러서는 화자예요."}]},{"label":"2절 · Bメロ","note":"네가 좋아할 만한 강하고 다정한 사람으로 바뀔 수는 없을까 스스로에게 물어요.","lines":[{"id":"e1","tk":[{"t":"{好|この}まれる","p":"동사","m":"사랑받는, 좋아하게 되는","b":"{好|この}む","bm":"좋아하다, 즐기다","w":"어간 好는 한자, まれる는 히라가나예요.","n":"好む는 好き(좋아함)와 같은 한자예요. 好む → 好まれる(좋아함을 받다, 수동형)."},{"t":"ような","p":"조동사","m":"~할 것 같은, ~할 만한"},{"t":"　"},{"t":"{強|つよ}く","p":"い형용사","m":"강하고","b":"{強|つよ}い","bm":"강하다","w":"어간 強은 한자, く는 히라가나예요."},{"t":"{優|やさ}しい","p":"い형용사","m":"다정한","w":"어간 優는 한자, しい는 히라가나예요.","n":"優(넉넉할 우)는 한국어 '우수(優秀)'의 優이기도 해요. 일본어에서는 '다정하다'가 먼저 떠오르는 말이에요."},{"t":"{僕|ぼく}"},{"t":"に"}],"ko":"네가 좋아할 만한, 강하고 다정한 나로","lit":"좋아함을 받는 / 듯한 / 강하고 / 다정한 / 나 / 로","g":[{"k":"수동형 〜れる","d":"5단 동사는 う단을 あ단으로 바꾸고 れる를 붙여요. 好む → 好まれる(좋아함을 받다)."},{"k":"〜ような + 명사","d":"'~할 것 같은, ~할 만한'. 好まれるような僕 = 사랑받을 만한 나."},{"k":"い형용사 く형 (나열)","d":"い를 く로 바꾸면 '~하고'로 이어져요. 強く優しい = 강하고 다정한."}],"s":"강하다·다정하다처럼 뜻을 담은 부분만 한자, 활용 어미와 조사는 히라가나예요.","c":"好まれる는 누구에게인지 말하지 않지만, 흐름상 '너에게'로 읽혀요. 지금의 나로는 부족하다고 느끼는 화자예요."},{"id":"e2","tk":[{"t":"{変|か}われない","p":"동사","m":"바뀔 수 없는","b":"{変|か}わる","bm":"바뀌다, 변하다","w":"어간 変은 한자, われない는 히라가나예요.","n":"変わる(바뀌다, 자동사)와 変える(바꾸다, 타동사)는 짝이에요. 한국어 '변화(変化)'의 変이에요."},{"t":"かな"}],"ko":"바뀔 수는 없을까","lit":"바뀔 수 없다 / 걸까","g":[{"k":"가능형 + ないかな","d":"変わる → 変われる(바뀔 수 있다) → 変われない(바뀔 수 없다). 곡 첫 줄의 似合わないかな와 같은 말끝이에요."}],"c":"1절은 '어울리지 않을까', 2절은 '바뀔 수 없을까'. 같은 〜ないかな로 화자의 자신 없음을 되풀이해요."}]},{"label":"サビ 2 · 두 번째 후렴","note":"같은 첫 줄로 시작하지만, 꺼내다 만 대답을 어떻게 할지 몰라 너의 시선을 겁내는 고백으로 바뀌어요.","lines":[{"id":"f1","same":"c1"},{"id":"f2","tk":[{"t":"{出|だ}しかけた","p":"동사","m":"꺼내다 만","b":"{出|だ}す","bm":"내다, 꺼내다","w":"어간 出는 한자, しかけた는 히라가나예요.","n":"出す → 出し(ます형) + かける = 꺼내려다 말다. 2절의 打ちかけ와 같은 かけ예요."},{"t":"{答|こた}え","p":"명사","m":"대답","w":"명사인데 오쿠리가나 え가 붙은 말이에요. 동사 答える(대답하다)에서 왔어요."},{"t":"{胸|むね}","p":"명사","m":"가슴","n":"胸が痛い = 가슴이 아프다. 한국어 '흉(胸)'과 같은 한자예요."},{"t":"が"},{"t":"{痛|いた}くて","p":"い형용사","m":"아파서","b":"{痛|いた}い","bm":"아프다","w":"어간 痛는 한자, くて는 히라가나예요."}],"ko":"꺼내다 만 대답에 가슴이 아파서","lit":"꺼내다 만 / 대답 / 가슴 / 이 / 아파서","g":[{"k":"동사 ます형 + かける","d":"'~하다 말다, ~하려던 참이다'. 出す → 出しかけた. d4의 打ちかけ(명사)와 같은 뿌리예요."},{"k":"い형용사 + くて (이유)","d":"'~해서'. 痛い → 痛くて. 다음 줄로 이유를 이어요."}],"s":"答え는 명사인데 오쿠리가나 え가 붙는 말이에요. 出しかけた答え와 胸 사이에 조사가 없는데, 노래라서 호흡을 짧게 줄인 거예요.","c":"答え(대답)는 '너를 좋아한다'는 내 마음의 답으로 읽혀요. 말하려다 삼킨 그 답이 가슴을 아프게 해요."},{"id":"f3","tk":[{"t":"{渡|わた}し{方|かた}","p":"명사","m":"건네는 법","w":"渡(건널 도)와 方(모 방)에 각각 루비를 달았어요. し는 히라가나예요.","n":"渡す(건네다)의 ます형 渡し + 方 = 건네는 방법. 書き方(쓰는 법), 読み方(읽는 법)처럼 써요."},{"t":"も"},{"t":"どこ","p":"대명사","m":"어디","w":"こ·そ·あ·ど 지시어는 히라가나로 써요."},{"t":"に"},{"t":"{捨|す}てれば","p":"동사","m":"버리면","b":"{捨|す}てる","bm":"버리다","w":"어간 捨는 한자, てれば는 히라가나예요."},{"t":"いい"},{"t":"か","p":"조사","m":"~인지"},{"t":"も"},{"t":"{分|わ}からずに","p":"동사","m":"모른 채","b":"{分|わ}かる","bm":"알다, 이해하다","w":"어간 分는 한자, からずに는 히라가나예요."}],"ko":"어떻게 건네야 할지도, 어디에 버려야 할지도 모른 채","lit":"건네는 법 / 도 / 어디 / 에 / 버리면 / 좋다 / 인지 / 도 / 모른 채","g":[{"k":"동사 ます형 + {方|かた}","d":"'~하는 방법'. 渡す → 渡し方. 書き方, 使い方도 같은 모양이에요."},{"k":"〜ばいい","d":"'~하면 된다'. 의문사와 함께 쓰면 '어디에 ~하면 될지'. どこに捨てればいいか = 어디에 버리면 될지."},{"k":"〜ずに","d":"'~하지 않고, ~하지 못한 채'. ないで의 글말이에요. 分かる → 分からずに."}],"c":"대답을 물건처럼 말했어요. 건넬 수도 없고 버릴 곳도 모르는, 손에 쥔 채 어쩔 줄 모르는 마음이에요."},{"id":"f4","tk":[{"t":"{君|きみ}"},{"t":"から"},{"t":"{見|み}えてる","p":"동사","m":"보이는","b":"{見|み}える","bm":"보이다","w":"어간 見는 한자, えてる는 히라가나예요."},{"t":"{景色|けしき}","p":"명사","m":"풍경, 경치","n":"景(볕 경) + 色(빛 색). 色는 보통 いろ로 읽지만 여기서는 しき로 읽어요. 한국어 '경색'이 아니라 '경치'에 가까운 말이에요."},{"t":"に"}],"ko":"네 눈에 비치는 풍경에","lit":"너 / 에게서 / 보이는 / 풍경 / 에","g":[{"k":"{見|み}える","d":"'(저절로) 보이다'. 보려고 하지 않아도 눈에 들어오는 것이에요. 見る(보다)와 짝이에요."},{"k":"〜てる","d":"〜ている의 회화체예요. 見えている → 見えてる."}],"c":"君から見えてる景色는 '네가 보는 세상', 그 안에서 내가 어떻게 보일지로 읽혀요."},{"id":"f5","tk":[{"t":"ただ","p":"부사","m":"그저, 다만","w":"只라는 한자가 있지만 보통 히라가나로 써요."},{"t":"{怯|おび}えているんだ","p":"동사","m":"겁먹고 있는 거야","b":"{怯|おび}える","bm":"겁먹다, 두려워하다","w":"怯는 조요칸지 밖의 한자예요. 신문에서는 おびえる로 풀어 쓰지만 가사에서는 한자로 썼어요.","n":"怯(겁낼 겁)은 한국어 '비겁(卑怯)'의 怯이에요."}],"ko":"그저 겁먹고 있는 거야","lit":"그저 / 겁먹고 있는 거다","g":[{"k":"〜んだ","d":"'~하는 거야'. 사정을 털어놓거나 설명할 때 붙여요. 怯えている + んだ."}],"s":"怯도 조요칸지 밖의 한자예요. 綺麗·嬉しい·掴む에 이어 감정을 담은 말을 한자로 또렷하게 썼어요.","c":"고백하지 못하는 이유를 스스로 털어놓는 줄이에요. 네 눈에 비친 내가 어떨지 무서운 거예요."}]},{"label":"Cメロ · 브리지","note":"어떤 영화·소설·음악의 히로인에도 너를 겹쳐 보고, 가고 싶은 곳의 밤하늘에도 너를 그리다가, 스스로를 바보라고 불러요.","lines":[{"id":"g1","tk":[{"t":"{思|おも}えば","p":"동사","m":"생각해 보면","b":"{思|おも}う","bm":"생각하다","w":"어간 思는 한자, えば는 히라가나예요."},{"t":"どんな","p":"연체사","m":"어떤","w":"こ·そ·あ·ど 지시어는 히라가나로 써요."},{"t":"{映画|えいが}","p":"명사","m":"영화","n":"한국어 '영화(映畫)'와 같은 한자예요. 画는 畫의 일본식 약자예요."},{"t":"を"},{"t":"{観|み}たって","p":"동사","m":"봐도","b":"{観|み}る","bm":"보다 (감상하다)","w":"観는 조요칸지지만 표에 올라 있는 읽기는 かん뿐이에요. 영화를 '감상하다'는 뜻을 살리려고 見る 대신 観る를 골랐어요.","n":"観는 觀의 일본식 약자예요. 観光(관광), 観客(관객)의 観이에요."}],"ko":"생각해 보면 어떤 영화를 봐도","lit":"생각하면 / 어떤 / 영화 / 를 / 봐도","g":[{"k":"{思|おも}えば","d":"'생각해 보면, 돌이켜 보면'. 가정의 ば가 굳어진 표현이에요. 2절의 気付けば와 같은 모양이에요."},{"k":"どんな〜たって","d":"'어떤 ~를 해도'. 〜たって는 〜ても의 회화체예요. 観る → 観たって."}],"s":"見る가 아니라 観る를 썼어요. 영화·연극·경기처럼 '감상하는' 것에는 観る를 고르는 일이 많아요.","c":"브리지에서 시선이 눈 오는 거리에서 화자의 머릿속으로 옮겨 가요."},{"id":"g2","tk":[{"t":"どんな","p":"연체사","m":"어떤"},{"t":"{小説|しょうせつ}","p":"명사","m":"소설","n":"한국어 '소설(小說)'과 같은 한자어예요. 説은 說의 일본식 모양이에요."},{"t":"や","p":"조사","m":"~이나, ~랑"},{"t":"{音楽|おんがく}","p":"명사","m":"음악","n":"한국어 '음악(音樂)'과 같은 한자어예요. 楽는 樂의 일본식 약자예요."},{"t":"だって","p":"조사","m":"~라도"}],"ko":"어떤 소설이나 음악이라도","lit":"어떤 / 소설 / 이나 / 음악 / 이라도","g":[{"k":"AやB","d":"'A나 B'. 몇 가지를 예로 들며 늘어놓아요. と(~와)는 전부를, や는 그중 몇 개를 드는 느낌이에요."},{"k":"〜だって","d":"'~라도'. 명사 뒤에 붙어 '어떤 ~라도 마찬가지'를 나타내요. 앞 줄의 観たって와 소리를 맞췄어요."}],"s":"小説·音楽 모두 한국어와 같은 한자어예요. 説·楽는 한국에서 쓰는 정자와 모양이 조금 달라요.","c":"영화, 소설, 음악. 이야기가 있는 것이라면 무엇이든 다음 줄의 '히로인'으로 이어져요."},{"id":"g3","tk":[{"t":"その","p":"연체사","m":"그"},{"t":"ヒロイン","p":"명사","m":"히로인, 여주인공","w":"영어 heroine에서 온 외래어라 가타카나로 써요. 곡 제목이 나오는 줄이에요."},{"t":"に"},{"t":"{重|かさ}ねて","p":"동사","m":"겹쳐","b":"{重|かさ}ねる","bm":"겹치다, 포개다","w":"어간 重는 한자, ねて는 히라가나예요.","n":"重ねる(겹치다, 타동사)와 重なる(겹쳐지다, 자동사)는 짝이에요. 宿命에도 重なって가 나왔어요."},{"t":"しまう","p":"보조동사","m":"(나도 모르게) ~해 버리다","w":"보조동사 しまう는 히라가나로 써요."},{"t":"の","p":"형식명사","m":"것, ~하는 사람","v":false},{"t":"は"},{"t":"{君|きみ}"},{"t":"だ","p":"조동사","m":"~이다"},{"t":"よ","p":"조사(종조사)","m":"~야 (강조)"}],"ko":"그 히로인에 겹쳐 보게 되는 건 너야","lit":"그 / 히로인 / 에 / 겹쳐 / 버리다 / 것 / 은 / 너 / 이다 / 야","g":[{"k":"AにBを{重|かさ}ねる","d":"'A에 B를 겹쳐 보다'. 이야기 속 인물에 현실의 누군가를 포개어 보는 거예요."},{"k":"〜てしまう","d":"'(나도 모르게) ~해 버리다'. 2절의 忘れてしまいそう와 같은 しまう예요."}],"s":"제목 ヒロイン이 여기서 처음 가사에 나와요. 외래어라 가타카나예요.","c":"어떤 이야기를 봐도 여주인공 자리에 너를 앉혀 보게 된다는 고백이에요. 후렴의 '이 장면의 주인공은 너였으면'과 같은 마음이에요."},{"id":"g4","tk":[{"t":"{行|い}って","p":"동사","m":"가","b":"{行|い}く","bm":"가다","w":"어간 行는 한자, って는 히라가나예요."},{"t":"みたい","p":"보조동사","m":"~해 보고 싶은","b":"みる","bm":"(~해) 보다","w":"보조동사로 쓰는 みる는 히라가나로 써요."},{"t":"{遠|とお}い","p":"い형용사","m":"먼","w":"어간 遠은 한자, い는 히라가나예요."},{"t":"{場所|ばしょ}","p":"명사","m":"곳, 장소"},{"t":"で"},{"t":"{見|み}たい","p":"동사","m":"보고 싶은","b":"{見|み}る","bm":"보다","w":"어간 見는 한자, たい는 히라가나예요."},{"t":"{夜空|よぞら}","p":"명사","m":"밤하늘","n":"夜(밤) + 空(하늘). 뒤에 붙은 そら가 ぞら로 흐려지는 렌다쿠(連濁)예요."},{"t":"も"}],"ko":"가 보고 싶은 먼 곳에서 보고 싶은 밤하늘도","lit":"가 / 보고 싶은 / 먼 / 곳 / 에서 / 보고 싶은 / 밤하늘 / 도","g":[{"k":"〜てみたい","d":"〜てみる(~해 보다) + たい(~하고 싶다) = '~해 보고 싶다'. 行く → 行ってみたい."},{"k":"〜たい","d":"동사 ます형 + たい = '~하고 싶다'. 見る → 見たい. 명사 앞에서도 그대로 써요(見たい夜空)."}],"s":"보조동사 みる는 히라가나 みたい로, 진짜 '보다'인 見たい는 한자로 썼어요. 같은 소리라도 뜻에 따라 문자가 갈려요.","c":"보고 싶은 것을 늘어놓다가, 다음 줄에서 그 옆자리에 누구를 그리는지 말해요."},{"id":"g5","tk":[{"t":"{隣|となり}"},{"t":"に"},{"t":"{描|えが}く","p":"동사","m":"그리다, 떠올리다","w":"어간 描는 한자, く는 히라가나예요.","n":"描く는 えがく와 かく 두 가지로 읽어요. 마음속에 그리는 것은 えがく가 잘 어울려요."},{"t":"の","p":"형식명사","m":"것, ~하는 사람","v":false},{"t":"は"},{"t":"いつでも","p":"부사","m":"언제나","w":"何時でも라고 쓸 수 있지만 보통 히라가나로 써요."}],"ko":"내 옆에 그리는 건 언제나","lit":"옆 / 에 / 그리다 / 것 / 은 / 언제나","g":[{"k":"〜のは","d":"'~하는 건'. g3의 重ねてしまうのは와 같은 틀이에요. 이번엔 뒷말을 말하지 않아요."}],"c":"'언제나'에서 문장이 끊겨요. 앞 줄의 그 히로인처럼 빈자리에 들어갈 말은 君(너)으로 읽혀요."},{"id":"g6","tk":[{"t":"{見|み}{慣|な}れた","p":"동사","m":"눈에 익은","b":"{見|み}{慣|な}れる","bm":"눈에 익다, 자주 봐서 익숙하다","w":"見와 慣에 각각 루비를 달았어요. れた는 히라가나예요.","n":"見る(보다) + 慣れる(익숙해지다)가 합친 복합동사예요. 慣(익숙할 관)은 한국어 '습관(習慣)'의 慣이에요."},{"t":"はず","p":"형식명사","m":"~일 터","w":"筈라는 한자가 있지만 조요칸지 밖이라 보통 히라가나로 써요."},{"t":"の"},{"t":"　"},{"t":"{街|まち}"},{"t":"が"},{"t":"こんなにも","p":"부사","m":"이렇게나","b":"こんなに","bm":"이렇게","w":"こんな 계열 지시어는 히라가나로 써요."}],"ko":"익숙할 텐데 이 거리가 이렇게나","lit":"눈에 익은 / 터 / 의 / 거리 / 가 / 이렇게나","g":[{"k":"〜たはず","d":"'분명 ~했을 터'. 그래야 하는데 실제로는 아니라는 느낌이 들어요. 見慣れたはずの街 = 익숙할 텐데 (지금은 달라 보이는) 거리."},{"k":"こんなにも","d":"こんなに(이렇게) + も(강조) = '이렇게나'. 뒤의 말을 생략해 여운을 남겼어요."}],"s":"はず는 한자 筈가 있지만 히라가나로 써요. 원문은 見慣れたはずの 뒤에 전각 공백을 두었어요.","c":"'이렇게나' 다음 말이 없어요. 눈 때문인지 너 때문인지, 늘 보던 거리가 달라 보인다는 말로 읽혀요."},{"id":"g7","tk":[{"t":"{馬鹿|ばか}","p":"な형용사","m":"바보, 어리석은","w":"馬鹿는 소리에 한자를 빌려 쓴 아테지(当て字)예요. バカ, ばか로도 자주 써요.","n":"馬(말) + 鹿(사슴)의 뜻과는 상관없이 소리만 맞춘 표기예요."},{"t":"だ","p":"조동사","m":"~이다"},{"t":"なぁ","p":"조사(종조사)","m":"~구나","kana":"なー","n":"혼잣말로 감탄하는 말끝이에요. なあ로도 써요."},{"t":"{僕|ぼく}"},{"t":"は"}],"ko":"바보구나, 나는","lit":"바보 / 이다 / 구나 / 나 / 는","g":[{"k":"도치","d":"원래 순서는 僕は馬鹿だなぁ예요. 馬鹿だなぁ를 먼저 말해 감정을 앞세웠어요."}],"s":"馬鹿는 아테지라 한자 뜻을 풀어 보면 엉뚱해요. 가사에서는 한자, 가타카나 バカ, 히라가나 ばか가 다 쓰여요.","c":"혼자 상상만 키우는 자신을 스스로 놀리는 말이에요. 자조하면서도 어딘가 다정한 back number다운 줄이에요."}]},{"label":"Dメロ · 마지막 후렴 전","note":"네 거리에 눈이 내릴 때 너는 누구를 떠올릴까 묻다가, '나는, 역시 나는' 하고 마지막 후렴으로 들어가요.","lines":[{"id":"i1","tk":[{"t":"{君|きみ}"},{"t":"の"},{"t":"{街|まち}"},{"t":"に"},{"t":"{白|しろ}い","p":"い형용사","m":"하얀"},{"t":"{雪|ゆき}"},{"t":"が"},{"t":"{降|ふ}った","p":"동사","m":"내린","b":"{降|ふ}る","bm":"(눈·비가) 내리다","w":"어간 降는 한자, った는 히라가나예요."},{"t":"{時|とき}","p":"명사","m":"때","w":"とき는 히라가나로 쓰기도 하는데 여기서는 한자 時로 썼어요."}],"ko":"네가 사는 거리에 하얀 눈이 내렸을 때","lit":"너 / 의 / 거리 / 에 / 하얀 / 눈 / 이 / 내린 / 때","g":[{"k":"〜た{時|とき}","d":"'~했을 때'. 과거형 + 時. 降る → 降った時."}],"s":"1절의 白い空, 君の街にも降っているかな에 나온 말들을 다시 모아 한 줄로 만들었어요.","c":"1절에서는 '네 거리에도 오고 있을까'였는데, 여기서는 그때 너는 누구를 떠올릴지로 질문이 바뀌어요."},{"id":"i2","tk":[{"t":"{君|きみ}"},{"t":"は"},{"t":"{誰|だれ}","p":"대명사","m":"누구","w":"誰는 한자로도 히라가나 だれ로도 써요. 여기서는 한자예요."},{"t":"に"},{"t":"{会|あ}いたく","p":"동사","m":"만나고 싶게","b":"{会|あ}う","bm":"만나다","w":"어간 会는 한자, いたく는 히라가나예요."},{"t":"なるんだろう"}],"ko":"너는 누구를 보고 싶어질까","lit":"너 / 는 / 누구 / 에게 / 만나고 싶게 / 될까","g":[{"k":"〜たくなる","d":"'~하고 싶어지다'. 〜たい의 い를 く로 바꾸고 なる를 붙여요. 会いたい → 会いたくなる."},{"k":"〜に{会|あ}う","d":"'~를 만나다'. 일본어는 만나는 상대에 を가 아니라 に를 써요."}],"c":"クリスマスソング에도 会いたい(보고 싶다)가 나왔어요. 여기서는 내가 아니라 네가 누구를 보고 싶어 할지 묻는 게 달라요."},{"id":"i3","tk":[{"t":"{雪|ゆき}"},{"t":"が"},{"t":"{綺麗|きれい}"},{"t":"だ","p":"조동사","m":"~이다"},{"t":"ね"},{"t":"って"},{"t":"{誰|だれ}","p":"대명사","m":"누구"},{"t":"に"},{"t":"{言|い}いたく","p":"동사","m":"말하고 싶게","b":"{言|い}う","bm":"말하다","w":"어간 言는 한자, いたく는 히라가나예요."},{"t":"なるんだろう"}],"ko":"눈이 예쁘다고 누구에게 말하고 싶어질까","lit":"눈 / 이 / 예쁘다 / 이다 / 네 / 라고 / 누구 / 에게 / 말하고 싶게 / 될까","g":[{"k":"〜たくなるんだろう","d":"앞 줄과 같은 틀이에요. 言う → 言いたい → 言いたくなる + んだろう."}],"s":"후렴은 綺麗と였는데 여기서는 綺麗だねって예요. 실제로 누군가에게 건네는 말투를 그대로 옮겼어요.","c":"후렴의 雪が綺麗와 같은 말을 이번엔 네가 누구에게 할지 물어요. 그 상대가 나였으면 하는 마음이 다음 줄에서 터져요."},{"id":"i4","tk":[{"t":"{僕|ぼく}"},{"t":"は"},{"t":"　"},{"t":"やっぱり","p":"부사","m":"역시","w":"矢っ張り라는 아테지가 있지만 보통 히라가나로 써요.","n":"やはり의 회화체예요. やっぱ로 더 줄이기도 해요."},{"t":"{僕|ぼく}"},{"t":"は"}],"ko":"나는, 역시 나는","lit":"나 / 는 / 역시 / 나 / 는","g":[{"k":"やっぱり","d":"'역시, 결국'. 이리저리 생각해도 처음 마음으로 돌아올 때 써요."}],"s":"원문은 僕は와 やっぱり 사이에 전각 공백을 두어 말을 한 번 멈춰요.","c":"'나는'에서 말이 끊기고 바로 마지막 후렴이 이어져요. 뒷말은 후렴의 '눈이 예쁘다며 웃는 건 너였으면 좋겠어'예요."}]},{"label":"ラストサビ · 마지막 후렴","note":"첫 후렴을 그대로 되풀이하다가, 마지막 한 줄을 '그것도'에서 '전부'로 바꿔 끝내요.","lines":[{"id":"j1","same":"c1"},{"id":"j2","same":"c2"},{"id":"j3","same":"c3"},{"id":"j4","same":"c4"},{"id":"j5","tk":[{"t":"{全部|ぜんぶ}","p":"명사","m":"전부","n":"한국어 '전부(全部)'와 같은 한자어예요."},{"t":"{君|きみ}"},{"t":"が"},{"t":"いい"}],"ko":"전부 너였으면 좋겠어","lit":"전부 / 너 / 가 / 좋다","g":[{"k":"{全部|ぜんぶ}","d":"'전부, 모두'. 명사지만 부사처럼 문장 앞에 놓여 '전부 다'라는 뜻을 더해요."}],"c":"첫 후렴의 それも君がいい(그것도 너였으면)가 마지막에 全部君がいい(전부 너였으면)로 커져요. 문자 한 통 못 보내던 화자가 속마음만은 끝까지 다 말해요."}]}]},"xmassong":{"id":"xmassong","title":"クリスマスソング","artist":"back number","year":2015,"eyebrow":"back number · 2015","sub":"들뜬 크리스마스 거리를 삐딱하게 바라보면서도 '너'를 향한 마음은 숨기지 못하는 겨울 러브송. 후지TV 月9 드라마 「5→9〜私に恋したお坊さん〜」 주제가.","release":"2015년 11월 18일 · 싱글 · 앨범 『シャンデリア』 수록","tieIn":"후지TV 월요 9시 드라마(月9) 「5→9〜私に恋したお坊さん〜」 주제가","lyricist":"清水依与吏","composer":"清水依与吏","listen":"https://www.youtube.com/results?search_query=back+number+%E3%82%AF%E3%83%AA%E3%82%B9%E3%83%9E%E3%82%B9%E3%82%BD%E3%83%B3%E3%82%B0","intro":"クリスマスソング는 back number가 2015년 11월 18일에 낸 싱글이에요. 후지TV의 월요일 밤 9시 드라마(月9) 「5→9〜私に恋したお坊さん〜」의 주제가로 쓰였고, 앨범 『シャンデリア』에도 실렸어요. 작사·작곡은 보컬 清水依与吏이고, 프로듀서로 小林武史가 참여했어요. 지금은 해마다 크리스마스 무렵이면 일본 거리에서 흘러나오는 정번곡(定番曲, 늘 빠지지 않는 곡)이 됐어요.\n\n화자는 반짝이는 거리와 들뜬 연인들을 보며 괜히 투덜거려요. 그런데 투덜거릴수록 '너'를 보고 싶은 마음이 드러나요. 옆에 있어 줬으면, 나만 생각해 줬으면 하는 바람을 길게 늘어놓다가, 결국 '君が好きだ(네가 좋아)' 한마디로 정리하는 흐름을 따라 읽어 보세요.","notes":[{"tag":"배경","title":"月9 드라마 주제가에서 크리스마스 정번곡으로","body":"2015년 11월 18일에 나온 싱글로, 후지TV 月9 드라마 「5→9〜私に恋したお坊さん〜」(나를 사랑한 스님)의 주제가였어요. 드라마가 겨울에 방송된 덕분에 크리스마스 분위기와 잘 맞아떨어졌어요.\n\n지금은 일본에서 크리스마스 시기에 빠지지 않는 정번곡으로 자리 잡았어요. 정번(定番)은 '늘 정해진 단골 메뉴'라는 뜻으로, 定番曲는 그 계절이면 꼭 나오는 곡이에요."},{"tag":"문화","title":"月9, 연애 드라마의 간판 시간대","body":"[[{月|げつ}9]]는 '월요일(月曜日) 밤 9시'의 줄임말로, 후지TV가 그 시간에 방송하는 드라마 틀을 가리켜요. 오랫동안 인기 연애 드라마가 많이 나와 '月9 = 연애 드라마'라는 인상이 강해요.\n\n月9 주제가는 드라마와 함께 매주 흘러나와서 많은 사람이 듣게 돼요. 月은 曜日 이름에서 げつ로 읽어요(月曜日 = げつようび)."},{"tag":"문화","title":"일본의 크리스마스는 연인의 날","body":"일본에서 크리스마스는 종교 행사라기보다 계절 이벤트예요. 특히 크리스마스 이브는 연인끼리 데이트하는 날이라는 분위기가 강해요. 거리마다 일루미네이션이 켜지고, 크리스마스 케이크를 먹는 풍습도 있어요.\n\n그래서 혼자인 화자에게는 [[わざとらしくきらめく{街|まち}]](억지스럽게 반짝이는 거리)와 [[はしゃぐ{恋|こい}{人|びと}{達|たち}]](들뜬 연인들)이 괜히 거슬려요. 한국의 크리스마스 분위기와도 꽤 비슷하게 느껴질 거예요."},{"tag":"표기","title":"欲しい, 事, 出来る를 한자로","body":"'~해 줬으면 좋겠다'의 ほしい는 보조 뜻이라 보통 히라가나로 풀어 써요. 아이묭의 君はロックを聴かない에서도 [[{近|ちか}づいてほしくて]]처럼 히라가나였어요. 이 곡은 [[いて{欲|ほ}しくて]], [[{考|かんが}えていて{欲|ほ}しい]]처럼 한자 欲를 그대로 썼어요.\n\n형식명사 こと도 [[{君|きみ}の{事|こと}]]처럼 계속 한자 事로 썼어요. 2절에서는 できる를 [[{出|で}{来|き}る]]로 썼는데, 후렴의 [[できれば]]는 히라가나예요. 한 곡 안에서도 표기가 섞일 수 있다는 걸 보여 주는 예예요."},{"tag":"표기","title":"サンタ, トナカイ, ツノ","body":"[[サンタ]](산타)와 [[プレゼント]](선물)는 외래어라 가타카나로 써요. [[トナカイ]](순록)는 아이누어에서 온 말이라 역시 가타카나로 써요.\n\n[[ツノ]](뿔)는 원래 한자 [[{角|つの}]]가 있는 일본어 단어인데 가타카나로 썼어요. 연인들이 머리에 쓴 장난감 순록 뿔이라, 진짜 뿔이 아닌 소품 같은 느낌이 나요."},{"tag":"표현","title":"〜とやら, 柄じゃない, 〜なんて","body":"[[サンタとやら]]의 とやら는 '~라던가 하는 것'이라는 뜻이에요. 잘 모르는 척, 살짝 깔보듯 부르는 말투예요. '산타라나 뭐라나'에 가까워요.\n\n[[{柄|がら}じゃない]]는 '내 성격(체질)에 안 맞다, 나답지 않다'예요. [[{星|ほし}に{願|ねが}いをなんて]]의 なんて(~라니)와 함께, 쑥스러워서 일부러 시큰둥하게 말하는 화자의 성격이 드러나요. 1절 첫 줄의 [[らしくない]](나답지 않은)와도 이어져요."},{"tag":"표현","title":"〜て欲しい를 늘어놓다가 '君が好きだ'","body":"후렴에서 화자는 [[いて{欲|ほ}しくて]], [[{行|い}って{欲|ほ}しくなくて]], [[{考|かんが}えていて{欲|ほ}しい]]로 바람을 세 번 이어 말해요. 동사 て형 + ほしい는 '(상대가) ~해 줬으면 좋겠다'예요.\n\n그러다 [[{長|なが}くなるだけだからまとめるよ]](길어지기만 하니까 정리할게)라며 [[{君|きみ}が{好|す}きだ]]로 끝맺어요. 길게 늘어놓은 바람이 결국 이 한마디였다는 구성으로 읽혀요."}],"dict":{"{君|きみ}":{"p":"대명사","m":"너","w":"'너'를 뜻하는 대명사로, 한자로 쓰는 게 일반적이에요.","n":"원래 '임금'을 뜻하던 한자예요(君主 = 군주). 지금은 가까운 사이에서 부르는 '너'예요."},"{僕|ぼく}":{"p":"대명사","m":"나 (남성)","w":"1인칭 대명사로 한자로 쓰는 게 일반적이에요.","n":"僕는 부드럽고 소년 같은 느낌의 1인칭이에요."},"{事|こと}":{"p":"형식명사","m":"것, 일","w":"형식명사 こと는 보통 히라가나로 쓰는데, 이 곡은 처음부터 끝까지 한자 事로 썼어요.","n":"君の事 = 너에 관한 것, 너를. 한국어 '사(事)'와 같은 한자예요(사건 = 事件)."},"{自|じ}{分|ぶん}":{"p":"명사","m":"자기, 나 자신","n":"한국어 '자기'에 가까운 말이에요. 自(스스로 자) + 分(나눌 분). 自分で = 스스로."},"{胸|むね}":{"p":"명사","m":"가슴","n":"한국어 '흉(胸)'과 같은 한자예요(흉부 = 胸部). 胸が痛い = 가슴이 아프다."},"{次|つぎ}":{"p":"명사","m":"다음","n":"次から次に = 잇달아, 줄줄이. 次は(다음은)처럼 일상에서 자주 써요."},"{奥|おく}":{"p":"명사","m":"깊은 곳, 안쪽","n":"胸の奥 = 가슴속 깊은 곳. 奥さん(부인)도 같은 한자예요."},"{欲|ほ}しい":{"p":"보조형용사","m":"~해 줬으면 좋겠어","b":"{欲|ほ}しい","bm":"~해 주길 바라다","w":"'~해 주길 바라다'라는 보조 뜻일 때는 보통 히라가나 ほしい로 풀어 쓰는데, 이 곡은 한자 欲しい로 썼어요.","n":"동사 て형 + ほしい = '(상대가) ~해 줬으면 좋겠다'. 君はロックを聴かない에서는 히라가나 ほしくて였어요."},"{欲|ほ}しくて":{"p":"보조형용사","m":"~해 줬으면 해서","b":"{欲|ほ}しい","bm":"~해 주길 바라다","w":"보조 뜻의 ほしい는 보통 히라가나로 쓰는데, 여기서는 한자 欲しい로 썼어요. 끝의 くて는 히라가나예요.","n":"欲しい의 て형이 欲しくて예요. '~해 줬으면 해서'라고 다음 말로 이어 가요."},"{格|かっ}{好|こう}{悪|わる}いし":{"p":"い형용사","m":"꼴사나우니까, 멋없고","b":"{格|かっ}{好|こう}{悪|わる}い","bm":"꼴사납다, 멋없다","w":"格好(모양새) + 悪い(나쁘다)를 한자로 썼어요. 회화에서는 かっこわるい로 짧게 읽고, カッコ悪い처럼 가타카나로도 자주 써요.","n":"格는 보통 かく로 읽는데 好 앞에서 かっ으로 바뀌어요. 반대말은 格好いい(かっこいい, 멋있다). 끝의 し는 '~하고, ~하니까'라고 이유를 늘어놓는 말이에요."},"こんな":{"p":"연체사","m":"이런","w":"こんな·そんな·あんな·どんな 같은 지시어는 히라가나로 써요."},"なんだろう":{"p":"표현","m":"뭘까","w":"何(なん)을 히라가나로 풀어 썼어요. だろう는 짐작하는 말끝이에요.","n":"なん(무엇) + だろう(~일까). 혼잣말처럼 스스로에게 묻는 말투예요."},"なんか":{"p":"조사","m":"~따위, ~같은 거","n":"앞의 말을 가볍게 낮춰 불러요. 君はロックを聴かない의 ロックなんか와 같은 말이에요."},"なんて":{"p":"조사","m":"~같은 건, ~라니","n":"앞의 말을 가볍게 낮추거나 '~라니' 하고 어이없어할 때 써요. なんか보다 조금 더 감정이 실려요."},"だけで":{"p":"조사(복합)","m":"~만으로"},"だけ":{"p":"조사","m":"~만, ~뿐"},"は":{"p":"조사","m":"~은/는 (주제)","n":"조사로 쓸 때는 ha가 아니라 wa로 읽어요."},"が":{"p":"조사","m":"~이/가"},"を":{"p":"조사","m":"~을/를","n":"현대 일본어에서 を는 이 조사에만 쓰는 글자예요. 발음은 お(o)와 같아요."},"に":{"p":"조사","m":"~에, ~에게"},"の":{"p":"조사","m":"~의"},"で":{"p":"조사","m":"~에서, ~으로"},"と":{"p":"조사","m":"~라고 (인용)"},"も":{"p":"조사","m":"~도"},"か":{"p":"조사","m":"~인지"},"から":{"p":"조사","m":"~니까, ~부터"},"って":{"p":"조사","m":"~란, ~라는 건","n":"は·というのは의 회화체예요. 주제를 꺼낼 때 써요."},"よ":{"p":"조사(종조사)","m":"~야, ~어 (강조)","n":"문장 끝 よ는 상대에게 말을 건네며 힘을 주는 말이에요."},"けど":{"p":"조사","m":"~지만","n":"けれど·けれども의 줄임말로, 회화에서 가장 많이 써요."},"かな":{"p":"조사(종조사)","m":"~일까, ~려나","n":"혼잣말처럼 가볍게 의문을 던지는 말끝이에요."},"なぁ":{"p":"조사(종조사)","m":"~네, ~구나","w":"종조사 な를 길게 끄는 느낌을 작은 ぁ로 썼어요.","n":"감탄이나 혼잣말에 붙는 말끝이에요. なあ로 쓰기도 해요."}},"sections":[{"label":"1절 · Aメロ","note":"크리스마스 종소리 속에서 나답지 않은 말이 떠오르고, 왜 사랑 같은 걸 하고 있나 스스로 놀라요.","lines":[{"id":"a1","tk":[{"t":"どこか","p":"대명사","m":"어딘가","w":"どこ(어디)에 か(~인가)가 붙은 말이에요. 지시어 계열이라 히라가나로 써요.","n":"どこか·だれか·なにか처럼 의문사 + か는 '어딘가·누군가·무언가'가 돼요."},{"t":"で"},{"t":"{鐘|かね}","p":"명사","m":"종","n":"한국어 '종(鐘)'과 같은 한자예요. 같은 かね라도 金(돈)과는 다른 말이에요."},{"t":"が"},{"t":"{鳴|な}って","p":"동사","m":"울리고","b":"{鳴|な}る","bm":"울리다, 소리가 나다","w":"어간 鳴는 한자, って는 히라가나예요.","n":"鳴る(울리다, 자동사)와 鳴らす(울리게 하다, 타동사)는 짝이에요. 鳴는 '울 명(鳴)'으로, 口(입)와 鳥(새)가 합쳐진 한자예요."}],"ko":"어디선가 종이 울리고","lit":"어딘가 / 에서 / 종 / 이 / 울리고","g":[{"k":"〜て (이어 말하기)","d":"동사 て형은 '~하고, ~해서'라고 문장을 이어요. 鳴る → 鳴って. 다음 줄의 浮かんで, よくて로 계속 이어져요."}],"s":"どこか·で·が·って는 히라가나, 鐘·鳴처럼 뜻을 담은 부분만 한자예요. 일본어 문장의 기본 모양이에요.","c":"크리스마스 교회 종이나 거리의 벨 소리로 읽혀요. 곡의 첫 소리부터 크리스마스 분위기를 깔아 줘요."},{"id":"a2","tk":[{"t":"らしくない","p":"い형용사","m":"나답지 않은","b":"らしい","bm":"~답다","w":"접미사에서 나온 말이라 히라가나로 써요.","n":"원래는 男らしい(남자답다)처럼 명사 뒤에 붙는 말이에요. 여기서는 앞말 없이 혼자 쓰여 '(나)답지 않은'이 됐어요."},{"t":"{言|こと}{葉|ば}","p":"명사","m":"말","w":"言(こと)과 葉(は)를 쿤요미(訓読み, 일본 고유어 읽기)로 읽고, 葉가 ば로 탁해졌어요(렌다쿠).","n":"'말의 잎사귀'라는 짜임이에요. 한국어로는 '언엽'이 아니라 '말'이에요."},{"t":"が"},{"t":"{浮|う}かんで","p":"동사","m":"떠오르고","b":"{浮|う}かぶ","bm":"떠오르다","w":"어간 浮는 한자, かんで는 히라가나예요.","n":"ぶ로 끝나는 5단 동사의 て형은 んで예요(遊ぶ → 遊んで). 頭に浮かぶ = 머리에 떠오르다."}],"ko":"나답지 않은 말이 떠오르고","lit":"답지 않은 / 말 / 이 / 떠올라서","g":[{"k":"〜らしくない","d":"'~답지 않다'. らしい의 부정형이에요. 君らしくない = 너답지 않아. 여기서는 앞말이 빠져 '나답지 않은'으로 읽혀요."}],"s":"らしくない는 통째로 히라가나예요. 접미사나 문법 말은 대개 히라가나로 써요.","c":"크리스마스 분위기에 휩쓸려 평소라면 안 할 낭만적인 말이 떠오른다는 느낌이에요."},{"id":"a3","tk":[{"t":"{寒|さむ}さ","p":"명사","m":"추위","b":"{寒|さむ}さ","w":"寒い(춥다)의 い를 さ로 바꿔 명사로 만든 말이에요. 어간 寒는 한자, さ는 히라가나예요.","n":"い형용사 + さ = 정도를 나타내는 명사. 寒い → 寒さ, 長い → 長さ."},{"t":"が"},{"t":"{心地|ここち}よくて","p":"い형용사","m":"기분 좋아서","b":"{心地|ここち}よい","bm":"기분 좋다, 상쾌하다","w":"心地는 두 글자를 통째로 ここち로 읽는 주쿠지쿤(熟字訓)이에요. よい는 良い를 히라가나로 풀었어요.","n":"心地는 '마음의 상태, 기분'이에요. 心地いい라고도 해요. 居心地がいい = (어떤 곳에) 있기 편하다."}],"ko":"추위가 기분 좋게 느껴져","lit":"추위 / 가 / 기분 좋아서","g":[{"k":"い형용사 + さ","d":"형용사를 명사로 바꿔요. 寒い → 寒さ(추위). 이 줄에서는 寒さが가 주어예요."},{"k":"い형용사 て형 〜くて","d":"い를 くて로 바꾸면 '~해서, ~하고'. 心地よい → 心地よくて."}],"s":"心地는 한자 하나씩 읽으면 안 나오는 읽기예요. 心(こころ)의 앞부분만 쓰는 것처럼 보이지만 단어 전체로 외워요.","c":"보통 추위는 싫은 건데 기분 좋게 느껴져요. 사랑에 빠져 들뜬 마음이 드러나는 줄로 읽혀요."},{"id":"a4","tk":[{"t":"あれ","p":"감동사","m":"어라","w":"감동사라 히라가나로 써요.","n":"あれ는 '저것'이라는 뜻도 있지만, 여기서는 뭔가 이상할 때 내는 '어라?'예요."},{"t":"　"},{"t":"なんで","p":"부사","m":"어째서, 왜","w":"何で를 히라가나로 풀어 썼어요. 何で는 なにで(무엇으로)로도 읽혀서 헷갈리지 않게 히라가나로 많이 써요.","n":"なんで는 どうして보다 가볍고 회화적인 '왜'예요."},{"t":"{恋|こい}","p":"명사","m":"사랑, 연애","n":"恋는 '연(戀)'의 일본식 약자예요(연애 = 恋愛). 恋をする = 사랑을 하다."},{"t":"なんか"},{"t":"してんだろう","p":"동사","m":"하고 있는 걸까","b":"する","bm":"하다","w":"する는 기본 동사라 히라가나로 써요.","n":"している → してる → してんだろう. 회화에서 る가 ん 앞에서 빠져요. んだろう는 '~하는 걸까'라고 스스로에게 묻는 말끝이에요."}],"ko":"어라, 내가 왜 사랑 같은 걸 하고 있는 걸까","lit":"어라 / 왜 / 사랑 / 따위 / 하고 있는 걸까","g":[{"k":"〜てる","d":"〜ている(~하고 있다)의 회화체예요. している → してる."},{"k":"〜んだろう","d":"のだろう의 회화체로 '~하는 걸까'. してるんだろう가 빨리 말하면서 してんだろう가 됐어요."}],"s":"あれ와 なんで 사이의 전각 공백은 '어라?' 하고 잠깐 멈추는 호흡이에요. 恋 하나만 한자예요.","c":"사랑을 하고 있는 자신에게 스스로 놀라요. 恋なんか(사랑 따위)라고 낮춰 부르는 데서 쑥스러움이 느껴져요."}]},{"label":"1절 · Bメロ","note":"자꾸 들뜨는 건 크리스마스 노래와 반짝이는 거리 탓일까 하고 핑계를 찾아요.","lines":[{"id":"b1","tk":[{"t":"{聖|せい}{夜|や}","p":"명사","m":"성야, 크리스마스 이브","w":"聖(성스러울 성)과 夜(밤 야)를 온요미(音読み, 한자음 읽기)로 읽는 한자어예요. 노래 가사나 글에서 쓰는 조금 딱딱한 말이에요.","n":"한국어 '성야(聖夜)'와 같은 한자예요. 크리스마스 캐럴 「きよしこの夜」(고요한 밤)처럼 크리스마스 이브의 밤을 가리켜요."},{"t":"だなんだと","p":"표현","m":"~다 뭐다 하며","w":"だ(이다) + なん(何) + だ + と를 이어 쓴 말투라 모두 히라가나예요.","n":"AだなんだとB = 'A다 뭐다 하며 B'. 이것저것 떠드는 걸 귀찮다는 듯 말할 때 써요."},{"t":"{繰|く}り{返|かえ}す","p":"동사","m":"되풀이하는","w":"繰る(감다)와 返す(되돌리다)가 합쳐진 복합동사예요. 한자마다 오쿠리가나 り·す가 붙어요.","n":"繰り返し = 반복. 한국어로는 '되풀이하다'예요."},{"t":"{歌|うた}","p":"명사","m":"노래","n":"한국어 '가(歌)'와 같은 한자예요(가요 = 歌謡). 歌う(うたう) = 노래하다."},{"t":"と","p":"조사","m":"~와"}],"ko":"성야다 뭐다 하며 되풀이하는 노래들과","lit":"성야 / 다 뭐다 하며 / 되풀이하는 / 노래 / 와","g":[{"k":"AだなんだとB","d":"'A다 뭐다 하며'. 비슷한 말로 AだのBだのと(A니 B니 하며)가 있어요. 聖夜だなんだと = 성야라느니 뭐라느니."},{"k":"동사 + 명사","d":"繰り返す歌 = 되풀이하는 노래. 동사 사전형이 그대로 명사를 꾸며요."}],"s":"聖夜는 일상 회화보다 노래나 글에서 쓰는 한자어예요. 화자는 그 거창한 말을 だなんだと로 받아치며 살짝 비꼬아요.","c":"크리스마스가 되면 거리에서 같은 캐럴이 계속 흘러나오는 풍경이에요. 繰り返す에서 지겹다는 투가 느껴져요."},{"id":"b2","tk":[{"t":"わざとらしく","p":"い형용사","m":"억지스럽게, 티 나게","b":"わざとらしい","bm":"억지스럽다, 일부러 그런 티가 나다","w":"わざと(일부러) + らしい라서 통째로 히라가나예요.","n":"わざと = 일부러. わざとらしい는 '일부러 꾸민 티가 난다'는 좋지 않은 뜻이에요."},{"t":"きらめく","p":"동사","m":"반짝이는","w":"煌めく라는 한자가 있지만 조요칸지(常用漢字) 밖이라 보통 히라가나로 써요.","n":"きらきら(반짝반짝)와 뿌리가 같은 말이에요."},{"t":"{街|まち}","p":"명사","m":"거리","n":"まち는 町로도 써요. 街는 번화한 거리, 町는 행정 구역이나 동네 느낌이에요. 한국어 '가(街)'와 같은 한자예요."},{"t":"の"},{"t":"せい","p":"형식명사","m":"탓","w":"所為라는 한자 표기도 있지만 아테지(当て字, 소리에 맞춘 한자)라 보통 히라가나로 써요.","n":"〜のせい = ~탓. 君のせいだ = 네 탓이야. 좋은 일에는 おかげ(덕분)를 써요."},{"t":"かな"}],"ko":"억지스럽게 반짝이는 거리 탓일까","lit":"억지스럽게 / 반짝이는 / 거리 / 의 / 탓 / 일까","g":[{"k":"〜のせい","d":"'~탓'. 명사 + のせい. 반대로 좋은 결과에는 〜のおかげ(~덕분)를 써요."},{"k":"〜かな","d":"'~일까, ~려나'. 혼잣말처럼 가볍게 묻는 말끝이에요."}],"s":"줄 대부분이 히라가나이고 한자는 街 하나예요. わざとらしく·きらめく·せい 모두 한자가 있어도 히라가나로 쓰는 말이에요.","c":"들뜬 마음을 거리 분위기 탓으로 돌려요. 사실은 사랑 때문이라는 걸 알면서도 인정하지 않으려는 말투로 읽혀요."}]},{"label":"サビ · 후렴","note":"보고 싶은 마음과 아픈 가슴이 이미 답을 알려 주는데, 길게 늘어놓던 바람을 '네가 좋아'로 정리해요.","lines":[{"id":"c1","tk":[{"t":"{会|あ}いたい","p":"동사","m":"보고 싶다","b":"{会|あ}う","bm":"만나다","w":"어간 会는 한자, いたい는 히라가나예요.","n":"동사 ます형 어간 + たい = '~하고 싶다'. 会う → 会いたい. 한국어 '보고 싶다'에 해당해요."},{"t":"と"},{"t":"{思|おも}う","p":"동사","m":"생각하는","w":"어간 思는 한자, う는 히라가나예요."},{"t":"{回|かい}{数|すう}","p":"명사","m":"횟수","n":"한국어 '회수(回數)'와 같은 한자어예요. 数는 數의 일본식 약자예요."},{"t":"が"}],"ko":"보고 싶다고 생각하는 횟수가","lit":"보고 싶다 / 고 / 생각하는 / 횟수 / 가","g":[{"k":"〜たい","d":"'~하고 싶다'. 会う → 会いたい, 行く → 行きたい. い형용사처럼 활용해요."},{"k":"〜と思う","d":"'~라고 생각하다'. 会いたいと思う = 보고 싶다고 생각하다."}],"s":"会いたい·思う는 한자 + 히라가나, 回数는 한자만으로 된 한자어예요. 동사와 한자어가 눈으로도 구별돼요.","c":"보고 싶은 마음을 '횟수'로 세는 게 재미있는 표현이에요. 다음 줄과 함께 '이 횟수와 이 가슴이 알려 준다'는 문장의 주어예요."},{"id":"c2","tk":[{"t":"{会|あ}えない","p":"동사","m":"만날 수 없으면","b":"{会|あ}う","bm":"만나다","w":"어간 会는 한자, えない는 히라가나예요.","n":"会う의 가능형 会える(만날 수 있다)의 부정형이에요. 会えない = 만날 수 없다."},{"t":"と","p":"조사","m":"~면"},{"t":"{痛|いた}い","p":"い형용사","m":"아픈","w":"어간 痛는 한자, い는 히라가나예요.","n":"한국어 '통(痛)'과 같은 한자예요(두통 = 頭痛)."},{"t":"この","p":"연체사","m":"이","w":"この·その·あの 같은 지시어는 히라가나로 써요."},{"t":"{胸|むね}"},{"t":"が"}],"ko":"못 만나면 아픈 이 가슴이","lit":"만날 수 없다 / 면 / 아픈 / 이 / 가슴 / 이","g":[{"k":"가능형 〜える","d":"5단 동사는 끝 う단을 え단으로 바꾸고 る. 会う → 会える(만날 수 있다) → 会えない(만날 수 없다)."},{"k":"〜と (조건)","d":"'~하면 (늘)'. 会えないと痛い = 못 만나면 아프다. 앞 줄의 인용 と와 모양은 같지만 뜻이 달라요."}],"s":"앞 줄의 会いたい와 이 줄의 会えない가 같은 한자 会로 짝을 이뤄요. 활용 어미만 히라가나로 바뀌어요.","c":"앞 줄과 나란히 놓여 리듬을 만들어요. 보고 싶은 횟수, 아픈 가슴, 이 두 가지가 다음 줄에서 무언가를 알려 주려 해요."},{"id":"c3","tk":[{"t":"{君|きみ}"},{"t":"の"},{"t":"{事|こと}"},{"t":"どう","p":"부사","m":"어떻게","w":"지시어 こう·そう·ああ·どう 계열이라 히라가나로 써요."},{"t":"{思|おも}う","p":"동사","m":"생각하는지","w":"어간 思는 한자, う는 히라가나예요."},{"t":"か"},{"t":"{教|おし}えよう","p":"동사","m":"알려 주려","b":"{教|おし}える","bm":"가르치다, 알려 주다","w":"어간 教는 한자, えよう는 히라가나예요.","n":"1단 동사의 의지형은 る를 빼고 よう. 教える → 教えよう. 教는 한국어 '교(敎)'의 일본식 약자예요."},{"t":"と"},{"t":"してる","p":"동사","m":"하고 있어","b":"する","bm":"하다","w":"する는 기본 동사라 히라가나로 써요.","n":"している의 회화체예요."}],"ko":"내가 너를 어떻게 생각하는지 알려 주려 해","lit":"너 / 의 / 일 / 어떻게 / 생각하는 / 지 / 알려 주자 / 고 / 하고 있다","g":[{"k":"〜ようとする","d":"의지형 + とする = '~하려고 하다'. 教えようとしてる = 알려 주려 하고 있어."},{"k":"〜の事","d":"사람 + の事 = '~에 관한 것'. 君の事どう思うか = 너를 어떻게 생각하는지. 한국어로는 그냥 '너를'로 옮겨요."}],"s":"君の事의 こと가 한자 事예요. 형식명사 こと는 보통 히라가나로 쓰지만 이 곡은 계속 事로 써요.","c":"주어는 앞 두 줄의 '보고 싶은 횟수'와 '아픈 가슴'이에요. 내 마음보다 몸과 감정이 먼저 답을 알려 준다는 표현으로 읽혀요."},{"id":"c4","tk":[{"t":"いい","p":"い형용사","m":"됐어, 괜찮아","w":"良い(よい)의 회화체로, 보통 히라가나로 써요.","n":"いいよ는 '좋아'라는 허락도 되고, 여기처럼 '됐어, 그만해'라는 거절도 돼요."},{"t":"よ"},{"t":"　"},{"t":"そんな","p":"연체사","m":"그런","w":"こんな·そんな·あんな·どんな 같은 지시어는 히라가나로 써요."},{"t":"{事|こと}"},{"t":"{自|じ}{分|ぶん}"},{"t":"で"},{"t":"{分|わ}かってる","p":"동사","m":"알고 있어","b":"{分|わ}かる","bm":"알다, 이해하다","w":"어간 分는 한자, かってる는 히라가나예요. 判る·解る로 쓰기도 하지만 分かる가 가장 일반적이에요.","n":"分かっている의 회화체예요. 分かる는 상태를 나타내서 '알고 있다'를 分かってる로 말해요."},{"t":"よ","p":"조사(종조사)","m":"~다고 (강조)"}],"ko":"됐어, 그런 건 나도 알고 있다고","lit":"됐어 / 요 / 그런 / 일 / 자기 / 로 / 알고 있다 / 고","g":[{"k":"いいよ","d":"'괜찮아, 됐어'. 허락의 '좋아'로도, 사양의 '됐어'로도 써요. 여기서는 마음이 알려 주려는 걸 막는 '됐어'예요."},{"k":"自分で","d":"'스스로, 내 힘으로'. 自分で分かってる = 나 스스로 알고 있어."}],"s":"いいよ 뒤의 전각 공백이 '됐어' 하고 말을 끊는 호흡을 보여 줘요. 줄 앞뒤에 よ가 두 번 나와 말투가 투박해요.","c":"가슴이 알려 주기도 전에 이미 안다고 말을 끊어요. 좋아한다는 걸 인정하면서도 쑥스러워하는 화자예요."},{"id":"c5","tk":[{"t":"サンタ","p":"명사","m":"산타","w":"サンタクロース(Santa Claus)를 줄인 외래어라 가타카나로 써요.","n":"일본에서는 サンタさん이라고 さん을 붙여 친근하게 부르기도 해요."},{"t":"とやら","p":"조사","m":"~라던가 하는 것","n":"잘 모르는 걸 '~라나 뭐라나' 하고 부를 때 써요. 살짝 깔보거나 거리를 두는 말투예요. 조금 예스러운 말이에요."},{"t":"に"},{"t":"{頼|たの}んでも","p":"동사","m":"부탁해도","b":"{頼|たの}む","bm":"부탁하다","w":"어간 頼는 한자, んでも는 히라가나예요.","n":"む로 끝나는 5단 동사의 て형은 んで예요. て형 + も = '~해도'. 頼는 頼る(たよる, 의지하다)로도 읽어요."},{"t":"{仕|し}{方|かた}ない","p":"い형용사","m":"소용없다","b":"{仕|し}{方|かた}ない","bm":"어쩔 수 없다, 소용없다","w":"仕方(방법)는 한자, ない는 히라가나예요. 仕(し)는 온요미, 方(かた)는 쿤요미로 읽어요.","n":"'방법(仕方)이 없다'라는 짜임이에요. 仕方がない라고도 해요. 회화에서는 しょうがない가 더 흔해요."},{"t":"よ"},{"t":"なぁ"}],"ko":"산타인지 뭔지한테 빌어 봤자 소용없겠지","lit":"산타 / 라던가 하는 것 / 에게 / 부탁해도 / 소용없다 / 지 / 네","g":[{"k":"〜ても","d":"て형 + も = '~해도'. 頼む → 頼んで → 頼んでも(부탁해도)."},{"k":"〜とやら","d":"'~라던가 하는 것'. サンタとやら = 산타라나 뭐라나. 아는 걸 일부러 모르는 척 부르는 말투예요."}],"s":"サンタ는 가타카나, とやら·よなぁ는 히라가나예요. 끝의 なぁ는 작은 ぁ로 말끝을 길게 끄는 표기예요.","c":"크리스마스에 산타에게 소원을 비는 풍습을 떠올리면서도, 연애는 산타가 해결해 줄 일이 아니라고 혼잣말해요."},{"id":"c6","tk":[{"t":"できれば","p":"부사","m":"될 수 있으면","b":"できる","bm":"할 수 있다","w":"できる를 히라가나로 썼어요. 2절에서는 같은 말을 한자 出来る로 써요.","n":"できる의 가정형 できれば가 굳어 '가능하면, 될 수 있으면'이라는 부사처럼 쓰여요."},{"t":"{横|よこ}","p":"명사","m":"옆","n":"한국어 '횡(橫)'과 같은 한자예요(횡단 = 横断). 横に = 옆에."},{"t":"に"},{"t":"いて","p":"동사","m":"있어","b":"いる","bm":"(사람이) 있다","w":"사람이 있다는 いる는 居る라는 한자가 있지만 보통 히라가나로 써요.","n":"いる의 て형이 いて예요. いてほしい = 있어 줬으면 좋겠다."},{"t":"{欲|ほ}しくて"}],"ko":"될 수 있으면 옆에 있어 줬으면 해서","lit":"가능하면 / 옆 / 에 / 있어 / 줬으면 해서","g":[{"k":"〜てほしい","d":"동사 て형 + ほしい = '(상대가) ~해 줬으면 좋겠다'. いる → いて → いてほしい. 君はロックを聴かない의 近づいてほしくて와 같은 문법이에요."}],"s":"欲しい를 한자로 쓴 게 눈에 띄어요. 보조 뜻의 ほしい는 보통 히라가나로 풀어 쓰는데, 이 곡은 끝까지 欲しい예요.","c":"여기서부터 '~해 줬으면' 하는 바람이 세 줄 이어져요. 앞에서 됐다고 말을 끊었지만 결국 속마음이 줄줄 나와요."},{"id":"c7","tk":[{"t":"どこ","p":"대명사","m":"어디","w":"ここ·そこ·あそこ·どこ 같은 지시어는 히라가나로 써요."},{"t":"にも","p":"조사","m":"~에도"},{"t":"{行|い}って","p":"동사","m":"가","b":"{行|い}く","bm":"가다","w":"어간 行는 한자, って는 히라가나예요.","n":"行く의 て형은 예외로 行って예요(行いて가 아니에요)."},{"t":"{欲|ほ}しくなくて","p":"보조형용사","m":"~하지 않았으면 해서","b":"{欲|ほ}しい","bm":"~해 주길 바라다","w":"보조 뜻의 ほしい를 한자 欲しい로 썼어요. くなくて는 히라가나예요.","n":"欲しい → 欲しくない(바라지 않다) → 欲しくなくて. 行って欲しくない = 가지 않았으면 좋겠다."}],"ko":"어디에도 가지 않았으면 해서","lit":"어디 / 에도 / 가 / 줬으면 하지 않아서","g":[{"k":"〜てほしくない","d":"'~하지 않았으면 좋겠다'. 行ってほしくない = 가지 않았으면 좋겠다. 동사 쪽(行かないで)이 아니라 ほしい 쪽을 부정해요."},{"k":"どこにも + 부정","d":"'어디에도 ~않다'. どこにも行かない = 아무 데도 안 가."}],"s":"앞 줄의 欲しくて와 이 줄의 欲しくなくて가 짝을 이뤄요. 같은 한자 欲 뒤에서 히라가나 어미만 늘어나요.","c":"옆에 있어 줬으면 하는 바람이 '아무 데도 가지 마'로 한 걸음 더 나아가요."},{"id":"c8","tk":[{"t":"{僕|ぼく}"},{"t":"の"},{"t":"{事|こと}"},{"t":"だけ"},{"t":"を"},{"t":"ずっと","p":"부사","m":"계속, 줄곧","w":"부사라 히라가나로 써요."},{"t":"{考|かんが}えていて","p":"동사","m":"생각하고 있어","b":"{考|かんが}える","bm":"생각하다","w":"어간 考는 한자, えていて는 히라가나예요.","n":"考えている(생각하고 있다)의 て형이에요. 思う가 마음에 떠오르는 생각이라면, 考える는 머리로 곰곰이 생각하는 쪽이에요."},{"t":"{欲|ほ}しい"}],"ko":"나만 계속 생각해 줬으면 좋겠어","lit":"나 / 의 / 일 / 만 / 을 / 계속 / 생각하고 있어 / 줬으면 좋겠다","g":[{"k":"〜ていてほしい","d":"'~하고 있어 줬으면 좋겠다'. 考える → 考えている → 考えていて欲しい. 상태가 계속되길 바라요."},{"k":"〜だけを","d":"'~만을'. 僕の事だけを = 나만을."}],"s":"僕の事의 事, 考えていて欲しい의 欲처럼 보통 히라가나로 쓸 법한 곳에 한자가 쓰였어요.","c":"바람이 점점 커져서 '나만 생각해 줘'까지 가요. 너무 솔직해서 다음 줄에서 스스로 멋없다고 해요."},{"id":"c9","tk":[{"t":"でも","p":"접속사","m":"하지만","w":"접속사라 히라가나로 써요."},{"t":"こんな"},{"t":"{事|こと}"},{"t":"を"},{"t":"{伝|つた}えたら","p":"동사","m":"전하면","b":"{伝|つた}える","bm":"전하다","w":"어간 伝는 한자, えたら는 히라가나예요.","n":"た형 + ら = '~하면'. 伝은 '전(傳)'의 일본식 약자예요(전달 = 伝達)."},{"t":"{格|かっ}{好|こう}{悪|わる}いし"}],"ko":"하지만 이런 걸 말하면 꼴사납고","lit":"하지만 / 이런 / 일 / 을 / 전하면 / 꼴사납고","g":[{"k":"〜たら","d":"'~하면'. 伝える → 伝えた → 伝えたら. 가정을 나타내는 가장 흔한 말이에요."},{"k":"〜し","d":"'~하고, ~하니까'. 이유를 하나씩 늘어놓을 때 써요. 다음 줄에 이유가 하나 더 와요."}],"s":"格好悪い는 원래 かっこうわるい인데 회화에서는 かっこわるい로 읽고, カッコ悪い처럼 가타카나로도 많이 써요. 여기서는 한자로 또박또박 썼어요.","c":"속마음을 다 털어놓으면 멋없어 보일까 봐 걱정해요. 체면을 신경 쓰는 쑥스러운 화자의 모습이에요."},{"id":"c10","tk":[{"t":"{長|なが}く","p":"い형용사","m":"길게","b":"{長|なが}い","bm":"길다","w":"어간 長는 한자, く는 히라가나예요.","n":"い형용사의 い를 く로 바꾸면 부사처럼 돼요. 長く + なる = 길어지다."},{"t":"なる","p":"동사","m":"되다","w":"기본 동사라 히라가나로 써요. 成る라는 한자는 잘 쓰지 않아요."},{"t":"だけ"},{"t":"だ","p":"조동사","m":"~이다"},{"t":"から"},{"t":"まとめる","p":"동사","m":"정리할게","w":"纏める라는 한자가 있지만 조요칸지 밖이라 보통 히라가나로 써요.","n":"まとめる = 모아서 정리하다, 요약하다. まとめ = 정리, 요약."},{"t":"よ"}],"ko":"길어지기만 하니까 짧게 정리할게","lit":"길게 / 되다 / 뿐 / 이다 / 니까 / 정리하다 / 야","g":[{"k":"い형용사 + くなる","d":"'~해지다'. 長い → 長くなる(길어지다), 寒い → 寒くなる(추워지다)."},{"k":"〜だけだから","d":"'~할 뿐이니까'. 長くなるだけだから = 길어지기만 할 뿐이니까."}],"s":"한자는 長 하나뿐이고 나머지는 모두 히라가나예요. まとめる처럼 어려운 한자가 있는 말은 히라가나로 푸는 게 보통이에요.","c":"말이 길어지자 스스로 끊고 한마디로 정리하겠다고 해요. 다음 줄의 고백을 위한 준비예요."},{"id":"c11","tk":[{"t":"{君|きみ}"},{"t":"が","p":"조사","m":"~이/가 (좋아하는 대상)"},{"t":"{好|す}き","p":"な형용사","m":"좋아","w":"어간 好는 한자, き는 히라가나예요.","n":"好き는 형용사라서 '~을 좋아하다'를 〜が好きだ로 말해요. 大好き = 아주 좋아함."},{"t":"だ","p":"조동사","m":"~이다"}],"ko":"네가 좋아","lit":"너 / 가 / 좋아함 / 이다","g":[{"k":"〜が好きだ","d":"'~을 좋아하다'. 좋아하는 대상에 を가 아니라 が를 써요. 君が好きだ = 너를 좋아해, 네가 좋아."}],"s":"고백은 君·好 두 한자와 が·き·だ 세 히라가나로 끝나요. 앞 줄들이 길었던 만큼 짧은 줄이 눈에 띄어요.","c":"길게 늘어놓던 바람이 이 한마디로 정리돼요. だ로 딱 끊는 말투가 쑥스러움을 무릅쓴 단호한 고백처럼 들려요."}]},{"label":"2절 · Aメロ","note":"순록 뿔을 달고 들뜬 연인들을 보며 투덜거리지만, 부러운 게 아니라고 굳이 덧붙여요.","lines":[{"id":"d1","tk":[{"t":"はしゃぐ","p":"동사","m":"들뜬, 신난","w":"한자 표기가 거의 쓰이지 않는 동사라 히라가나로 써요.","n":"はしゃぐ = 신이 나서 떠들다. 子どもがはしゃぐ(아이들이 신나서 떠들다)."},{"t":"{恋|こい}{人|びと}","p":"명사","m":"연인","w":"恋(こい)와 人(ひと)를 쿤요미로 읽고, 人이 びと로 탁해졌어요(렌다쿠).","n":"한국어 '연인(戀人)'과 같은 한자지만 온요미가 아니라 쿤요미 こいびと로 읽어요."},{"t":"{達|たち}","p":"접미사","m":"~들","w":"복수를 나타내는 たち는 히라가나로 쓰는 일이 많은데, 여기서는 한자 達로 썼어요.","n":"僕たち, 子どもたち처럼 사람 뒤에 붙어 '~들'이 돼요. 達은 한국어 '달(達)'과 같은 한자예요."},{"t":"は"}],"ko":"들뜬 연인들은","lit":"들뜬 / 연인 / 들 / 은","g":[{"k":"명사 + たち","d":"'~들'. 사람이나 동물 뒤에 붙어요. 恋人達 = 연인들."}],"s":"恋人達은 한자 세 글자인데 읽기는 모두 쿤요미예요. 達을 히라가나 たち로 쓴 恋人たち도 자주 볼 수 있어요.","c":"크리스마스 거리를 걷는 커플들이에요. 1절의 '반짝이는 거리'에 이어 화자가 바라보는 풍경이에요."},{"id":"d2","tk":[{"t":"トナカイ","p":"명사","m":"순록","w":"아이누어에서 온 말이라 가타카나로 써요.","n":"산타의 썰매를 끄는 동물로 크리스마스에 자주 나와요."},{"t":"の"},{"t":"ツノ","p":"명사","m":"뿔","b":"{角|つの}","bm":"뿔","w":"角라는 한자가 있는 일본어 단어인데 가타카나로 썼어요. 장난감 머리띠 뿔 같은 가볍고 귀여운 느낌이 나요.","n":"角는 かど(모서리)로도 읽어요. 한국어 '각(角)'과 같은 한자예요."},{"t":"なんか"},{"t":"{生|は}やして","p":"동사","m":"달고, 돋우고","b":"{生|は}やす","bm":"(털·뿔 등을) 기르다, 돋게 하다","w":"어간 生는 한자, やして는 히라가나예요. 生는 읽기가 아주 많은 한자예요.","n":"生える(はえる, 돋다)의 짝인 타동사예요. ひげを生やす = 수염을 기르다. 生는 いきる·うまれる·なま·せい로도 읽어요."}],"ko":"순록 뿔 같은 걸 머리에 달고","lit":"순록 / 의 / 뿔 / 따위 / 돋우고","g":[{"k":"〜なんか","d":"'~같은 걸, ~따위'. 1절의 恋なんか와 같은 말이에요. 여기서는 순록 뿔을 낮춰 불러요."}],"s":"トナカイ와 ツノ, 가타카나 단어 두 개가 の로 이어져요. 둘 중 ツノ는 외래어가 아닌데도 가타카나예요.","c":"뿔을 '단다'가 아니라 '돋운다(生やす)'고 해서, 머리에서 뿔이 자라난 것처럼 말해요. 살짝 비꼬는 유머로 읽혀요."},{"id":"d3","tk":[{"t":"よく","p":"부사","m":"잘도","w":"良く를 히라가나로 풀어 썼어요. 부사는 대개 히라가나예요.","n":"よく는 '자주'라는 뜻도 있지만, 여기처럼 어이없어하며 '잘도 ~하네'로도 써요."},{"t":"{人|ひと}{前|まえ}","p":"명사","m":"사람들 앞","w":"人(ひと)와 前(まえ)를 쿤요미로 읽는 말이에요.","n":"人前で = 남들 앞에서. 人前に出る = 사람들 앞에 나서다."},{"t":"で"},{"t":"{出|で}{来|き}る","p":"동사","m":"할 수 있다","b":"{出|で}{来|き}る","bm":"할 수 있다","w":"できる를 한자 出来る로 썼어요. 보통은 히라가나 できる가 더 흔하고, 후렴의 できれば도 히라가나였어요.","n":"出(で)와 来(き)를 이어 읽는 쿤요미예요. 한자로 쓰면 '생기다, 완성되다'라는 뜻이 더 또렷해 보이기도 해요(出来上がる = 완성되다)."},{"t":"なぁ"}],"ko":"잘도 사람들 앞에서 저러네","lit":"잘도 / 사람들 앞 / 에서 / 할 수 있다 / 네","g":[{"k":"よく〜なぁ","d":"'잘도 ~하네'. 감탄 반, 어이없음 반의 말투예요. よくそんなことが言えるなぁ = 잘도 그런 말을 하네."}],"s":"같은 できる가 1절 후렴에서는 히라가나, 여기서는 한자 出来る예요. 한 곡 안에서 표기가 흔들리는 모습도 가사의 재미예요.","c":"남들 앞에서 커플 티를 내는 연인들에게 투덜거려요. 부러운 마음이 살짝 비쳐요."},{"id":"d4","tk":[{"t":"いや","p":"감동사","m":"아니","w":"감동사라 히라가나로 써요. 嫌(いや, 싫다)와는 다른 말이에요.","n":"앞에 한 말을 스스로 고칠 때 '아니, ...' 하고 써요."},{"t":"　"},{"t":"{羨|うらや}ましく","p":"い형용사","m":"부럽게","b":"{羨|うらや}ましい","bm":"부럽다","w":"어간 羨는 한자, ましく는 히라가나예요. 羨는 2010년에 조요칸지에 들어간 한자예요.","n":"한국어 '선망(羨望)'의 羨예요. 羨ましい의 い를 く로 바꿔 뒤의 ない로 이어요."},{"t":"なんて"},{"t":"ない","p":"い형용사","m":"않아","w":"부정의 ない는 히라가나로 써요.","n":"羨ましくない(부럽지 않아) 사이에 なんて가 끼어들었어요."},{"t":"けど"}],"ko":"아니, 부러운 건 아니지만","lit":"아니 / 부럽게 / 따위 / 않다 / 지만","g":[{"k":"〜くなんてない","d":"い형용사 く형 + なんてない = '~하긴 무슨, 전혀 ~하지 않아'. 羨ましくなんてない = 부럽긴 무슨."}],"s":"いや 뒤의 전각 공백이 말을 고쳐 잡는 짧은 멈춤이에요. 羨처럼 획이 많은 한자도 조요칸지에 들어가 지금은 한자로 써요.","c":"부럽지 않다고 굳이 덧붙이는 게 오히려 부럽다는 고백처럼 들려요. 끝의 けど에 말하지 않은 속마음이 남아요."}]},{"label":"2절 · Bメロ","note":"네가 기뻐할 선물, 나만 줄 수 있는 게 무엇일지 고민해요.","lines":[{"id":"e1","tk":[{"t":"{君|きみ}"},{"t":"が"},{"t":"{喜|よろこ}ぶ","p":"동사","m":"기뻐하는","w":"어간 喜는 한자, ぶ는 히라가나예요.","n":"한국어 '희(喜)'와 같은 한자예요(환희 = 歓喜). 喜んで = 기꺼이."},{"t":"プレゼント","p":"명사","m":"선물","w":"영어 present에서 온 외래어라 가타카나로 써요.","n":"贈り物(おくりもの)라는 일본어도 있지만 일상에서는 プレゼント를 더 많이 써요."},{"t":"って"},{"t":"なんだろう"}],"ko":"네가 기뻐할 선물은 뭘까","lit":"너 / 가 / 기뻐하는 / 선물 / 이란 / 뭘까","g":[{"k":"〜って","d":"'~란, ~라는 건'. 주제를 꺼내는 회화체예요. プレゼントってなんだろう = 선물이란 뭘까."}],"s":"君·喜만 한자이고, プレゼント는 가타카나, 나머지는 히라가나예요. 세 가지 문자가 한 줄에 다 모였어요.","c":"크리스마스 선물을 고민하는 장면이에요. 투덜거리던 화자가 결국 너를 기쁘게 할 방법을 생각해요."},{"id":"e2","tk":[{"t":"{僕|ぼく}"},{"t":"だけ"},{"t":"が"},{"t":"あげられる","p":"동사","m":"줄 수 있는","b":"あげる","bm":"(남에게) 주다","w":"上げる라는 한자가 있지만 '주다'라는 뜻일 때는 보통 히라가나로 써요.","n":"あげる의 가능형이에요. あげる(내가 남에게 주다)와 くれる(남이 나에게 주다)는 방향이 달라요."},{"t":"もの","p":"형식명사","m":"것","w":"物라는 한자가 있지만 뜻이 옅은 '것'일 때는 히라가나로 써요."},{"t":"って"},{"t":"なんだろう"}],"ko":"나만 줄 수 있는 건 뭘까","lit":"나 / 만 / 이 / 줄 수 있는 / 것 / 이란 / 뭘까","g":[{"k":"가능형 〜られる","d":"1단 동사는 る를 빼고 られる. あげる → あげられる(줄 수 있다)."},{"k":"あげる・くれる","d":"あげる는 내가 남에게, くれる는 남이 나에게 줄 때 써요. 한국어는 둘 다 '주다'예요."}],"s":"앞 줄과 똑같이 〜ってなんだろう로 끝나요. 같은 모양의 두 줄이 나란히 놓여 리듬을 만들어요.","c":"앞 줄의 '네가 기뻐할 것'에서 '나만 줄 수 있는 것'으로 질문이 깊어져요. 물건보다 마음을 생각하게 되는 흐름으로 읽혀요."}]},{"label":"サビ 2 · 두 번째 후렴","note":"고백의 답이 기대와 달라도 싫어질 수 없다며, 나답지 않게 별을 올려다봐요.","lines":[{"id":"f1","tk":[{"t":"{大|だい}{好|す}き","p":"な형용사","m":"정말 좋아함","w":"大(だい)는 온요미, 好(す)는 쿤요미로 읽어요. き는 히라가나예요.","n":"大 + 好き = 아주 좋아함. 大嫌い(だいきらい) = 아주 싫어함."},{"t":"だ","p":"조동사","m":"~이다"},{"t":"と"},{"t":"{言|い}った","p":"동사","m":"말한","b":"{言|い}う","bm":"말하다","w":"어간 言는 한자, った는 히라가나예요.","n":"言う의 과거형이 言った예요. 言う는 いう로 쓰지만 발음은 ゆう에 가까워요."},{"t":"{返|へん}{事|じ}","p":"명사","m":"대답","n":"返(돌아올 반) + 事(일 사). 온요미로 へんじ라고 읽어요. 返事をする = 대답하다."},{"t":"が"}],"ko":"정말 좋아한다고 말했을 때 돌아온 대답이","lit":"정말 좋아함 / 이다 / 라고 / 말한 / 대답 / 이","g":[{"k":"〜と言った + 명사","d":"'~라고 말한 ~'. 大好きだと言った返事 = 정말 좋아한다고 말한 (데 대한) 대답."}],"s":"返事의 事는 이 곡에서 계속 나온 こと와 같은 한자인데, 여기서는 온요미 じ로 읽어요.","c":"고백을 한 뒤의 장면이에요. 返事는 고백에 대한 상대의 대답이라, '정말 좋아해'라고 말한 쪽은 화자로 읽혀요."},{"id":"f2","tk":[{"t":"{思|おも}ってた","p":"동사","m":"생각했던","b":"{思|おも}う","bm":"생각하다","w":"어간 思는 한자, ってた는 히라가나예요.","n":"思っていた(생각하고 있었다)의 회화체예요."},{"t":"の","p":"형식명사","m":"것","v":false,"n":"동사 뒤의 の는 '~것'이라는 뜻으로 말을 명사로 만들어요. 思ってたの = 생각했던 것."},{"t":"とは","p":"조사","m":"~와는"},{"t":"{違|ちが}っても","p":"동사","m":"달라도","b":"{違|ちが}う","bm":"다르다","w":"어간 違는 한자, っても는 히라가나예요.","n":"違う는 '다르다'와 '틀리다' 두 뜻이에요. 違うよ = 아니야."}],"ko":"생각했던 것과 달라도","lit":"생각했던 / 것 / 과는 / 달라도","g":[{"k":"〜と違う","d":"'~와 다르다'. 思ってたのとは違う = 생각했던 거랑은 달라. は가 붙어 대비가 강해져요."},{"k":"〜ても","d":"'~해도'. 違う → 違って → 違っても. 1절의 頼んでも와 같은 문법이에요."}],"s":"思ってた·違っても 모두 한자 하나 뒤에 작은 っ가 들어간 히라가나가 이어져요. 소쿠온(促音, 작은 っ)이 리듬을 만들어요.","c":"기대했던 대답이 아닐 수도 있다는 걸 미리 각오하는 말로 읽혀요."},{"id":"f3","tk":[{"t":"それ","p":"대명사","m":"그것","w":"これ·それ·あれ·どれ 같은 지시어는 히라가나로 써요."},{"t":"だけで"},{"t":"{嫌|きら}い","p":"な형용사","m":"싫음","w":"어간 嫌는 한자, い는 히라가나예요. い로 끝나지만 な형용사예요.","n":"嫌い는 きらい, 嫌는 いや로 읽어요. 같은 한자인데 이 곡에는 두 읽기가 다 나와요."},{"t":"に"},{"t":"なんて"},{"t":"なれやしない","p":"동사","m":"될 수 없어","b":"なる","bm":"되다","w":"기본 동사 なる의 활용이라 히라가나로 써요.","n":"なる → なれる(될 수 있다) → なれやしない. 〜やしない는 〜はしない의 강조형으로 '절대 ~하지 않아'예요."},{"t":"から"}],"ko":"그것만으로 싫어할 수는 없으니까","lit":"그것 / 만으로 / 싫음 / 으로 / 따위 / 될 수 없다 / 니까","g":[{"k":"な형용사 + になる","d":"'~해지다'. 嫌い → 嫌いになる(싫어지다). 好きになる(좋아지다)도 같아요."},{"k":"〜やしない","d":"'절대 ~하지 않는다'. なれない보다 강한 부정이에요. 조금 예스럽고 감정이 실린 말투예요."}],"s":"嫌い는 い로 끝나서 い형용사처럼 보이지만 な형용사예요. 嫌いな人(싫은 사람)처럼 な를 붙여요.","c":"대답이 거절이어도 그것만으로 마음이 식지 않는다고 말해요. 1절보다 한층 단단해진 마음으로 읽혀요."},{"id":"f4","tk":[{"t":"{星|ほし}","p":"명사","m":"별","n":"한국어 '성(星)'과 같은 한자예요(유성 = 流星). 혼자 쓰면 쿤요미 ほし로 읽어요."},{"t":"に"},{"t":"{願|ねが}い","p":"명사","m":"소원","w":"願う(바라다)의 명사형이라 오쿠리가나 い가 붙어요.","n":"願いを込める = 소원을 담다. お願い(부탁)도 같은 말이에요."},{"t":"を"},{"t":"なんて"},{"t":"さ","p":"조사(종조사)","m":"~말이야","n":"말 중간이나 끝에 붙여 가볍게 힘을 주는 회화체예요."},{"t":"　"},{"t":"{柄|がら}","p":"명사","m":"성격, 체질, 격","n":"柄じゃない = 내 성격에 안 맞다, 나답지 않다. 柄는 がら로 읽으면 '무늬, 성격', え로 읽으면 '손잡이'예요."},{"t":"じゃない","p":"조동사(부정)","m":"~가 아니다"},{"t":"けど"}],"ko":"별에 소원을 빈다니, 나답지 않지만","lit":"별 / 에 / 소원 / 을 / 따위 / 말이야 / 성격 / 아니다 / 지만","g":[{"k":"〜なんて","d":"'~라니, ~같은 건'. 星に願いをなんて = 별에 소원을, 이라니. 동사(かける·祈る)를 빼고 なんて로 얼버무려요."},{"k":"柄じゃない","d":"'~할 성격이 아니다, 나답지 않다'. 私の柄じゃない = 내 스타일이 아니야."}],"s":"柄 앞의 전각 공백이 '별에 소원이라니' 하고 쑥스러워 멈추는 호흡이에요. 柄는 한자 하나로 된 쿤요미 명사예요.","c":"星に願いを는 디즈니 노래 When You Wish Upon a Star의 일본어 제목으로도 알려진 말이에요. 그 낭만적인 말을 하다 말고 柄じゃない로 쑥스러움을 감춰요."},{"id":"f5","tk":[{"t":"{結|けっ}{局|きょく}","p":"부사","m":"결국","w":"結(けつ)가 局 앞에서 けっ으로 바뀌는 한자어예요.","n":"한국어 '결국(結局)'과 같은 한자어예요."},{"t":"{君|きみ}"},{"t":"じゃない","p":"조동사(부정)","m":"~가 아니다"},{"t":"と","p":"조사","m":"~면"},{"t":"{嫌|いや}","p":"な형용사","m":"싫음","w":"嫌를 いや로 읽어요. 앞 줄의 嫌い(きらい)와 같은 한자, 다른 읽기예요.","n":"いや는 '싫어!' 하는 감정적인 말이고, 嫌い는 '좋아하지 않다'는 차분한 말이에요."},{"t":"なんだ","p":"조동사","m":"~인 거야","n":"な + んだ. な형용사 뒤에서 '~인 거야'라고 힘주어 말해요."},{"t":"って","p":"조사","m":"~라고 (인용)","n":"と의 회화체 인용이에요."}],"ko":"결국 네가 아니면 싫다면서","lit":"결국 / 너 / 가 아니다 / 면 / 싫음 / 인 거야 / 라고","g":[{"k":"〜じゃないと","d":"'~가 아니면'. 君じゃないと嫌 = 네가 아니면 싫어."},{"k":"〜って (인용)","d":"と의 회화체예요. 嫌なんだって = 싫다고 (하며). 다음 줄의 見上げてる로 이어져요."}],"s":"嫌가 앞 줄에서는 きらい, 이 줄에서는 いや예요. 같은 한자를 이렇게 다르게 읽는 게 일본어 한자의 어려운 점이에요.","c":"柄じゃないと 해 놓고 결국 별에 비는 이유가 '네가 아니면 안 된다'예요."},{"id":"f6","tk":[{"t":"{見|み}{上|あ}げてるんだ","p":"동사","m":"올려다보고 있는 거야","b":"{見|み}{上|あ}げる","bm":"올려다보다","w":"見る(보다)와 上げる(올리다)가 합쳐진 복합동사예요. 오쿠리가나 げてるんだ는 히라가나예요.","n":"見上げる ↔ 見下ろす(내려다보다). 見上げている의 회화체 見上げてる에 んだ가 붙었어요."}],"ko":"하늘을 올려다보고 있어","lit":"올려다보고 있는 거야","g":[{"k":"〜てるんだ","d":"〜ているのだ의 회화체로 '~하고 있는 거야'. 이유나 사정을 설명하는 말끝이에요."}],"s":"見上(みあ)는 한자마다 쿤요미를 하나씩 붙여 읽어요. 見는 み, 上는 あ예요.","c":"무엇을 올려다보는지는 쓰지 않았지만, 앞 줄의 별이 있는 밤하늘로 읽혀요. 결국 별에 소원을 빌고 있는 거예요."}]},{"label":"Cメロ · 브리지","note":"너를 만난 그때부터 나도 몰랐던 내가 줄줄이 나타났다고 돌아봐요.","lines":[{"id":"g1","tk":[{"t":"あの","p":"연체사","m":"그","w":"この·その·あの 같은 지시어는 히라가나로 써요."},{"t":"{時|とき}","p":"명사","m":"때","n":"한국어 '시(時)'와 같은 한자예요. 혼자 쓰면 とき, 時間처럼 한자어에서는 じ로 읽어요."},{"t":"{君|きみ}"},{"t":"に"}],"ko":"그때 너를","lit":"그 / 때 / 너 / 에게","g":[{"k":"〜に出会う","d":"'~를 (우연히) 만나다'. 한국어는 '~를'이지만 일본어는 に를 써요. 다음 줄로 이어져요."}],"s":"あの時는 지시어 あの(히라가나) + 時(한자)예요. 이 곡에서 時는 쿤요미 とき로만 나와요.","c":"후렴의 현재에서 처음 만난 날로 시간이 거슬러 올라가요."},{"id":"g2","tk":[{"t":"{出|で}{会|あ}って","p":"동사","m":"만나서","b":"{出|で}{会|あ}う","bm":"(우연히) 만나다","w":"出る(나가다)와 会う(만나다)가 합쳐진 복합동사예요. 오쿠리가나 って는 히라가나예요.","n":"出会う는 처음으로, 우연히 만나는 느낌이에요. 出会い = 만남."},{"t":"　"},{"t":"ただ","p":"부사","m":"그저","w":"부사라 히라가나로 써요. 只라는 한자는 거의 안 써요."},{"t":"それ","p":"대명사","m":"그것","w":"これ·それ·あれ·どれ 같은 지시어는 히라가나로 써요."},{"t":"だけで"}],"ko":"만나서, 그저 그것만으로","lit":"만나서 / 그저 / 그것 / 만으로","g":[{"k":"ただ〜だけで","d":"'그저 ~만으로'. ただ와 だけ가 함께 쓰여 '오직 그것뿐'을 강조해요."}],"s":"出会って 뒤의 전각 공백이 만남의 순간을 곱씹는 쉼표 같아요. 出(で)·会(あ)는 둘 다 쿤요미예요.","c":"대단한 사건이 아니라 '만났다는 것만으로' 모든 게 바뀌었다는 말이에요."},{"id":"g3","tk":[{"t":"{自|じ}{分|ぶん}"},{"t":"も"},{"t":"{知|し}らなかった","p":"동사","m":"몰랐던","b":"{知|し}る","bm":"알다","w":"어간 知는 한자, らなかった는 히라가나예요.","n":"知る는 る로 끝나지만 5단 동사예요. 知る → 知らない → 知らなかった."},{"t":"{自|じ}{分|ぶん}","p":"명사","m":"나 자신"},{"t":"が"},{"t":"{次|つぎ}"},{"t":"から"},{"t":"{次|つぎ}","p":"명사","m":"다음"},{"t":"に"}],"ko":"나도 몰랐던 내가 하나둘 계속 나타나","lit":"자기 / 도 / 몰랐던 / 자기 / 가 / 다음 / 부터 / 다음 / 에","g":[{"k":"次から次に","d":"'잇달아, 줄줄이'. 次から次へと라고도 해요."},{"k":"〜なかった","d":"부정 ない의 과거형이에요. 知らない → 知らなかった(몰랐다)."}],"s":"自分과 次가 한 줄에 두 번씩 나와요. 같은 한자의 반복이 '계속 튀어나온다'는 뜻을 눈으로도 보여 줘요.","c":"문장이 끝나지 않고 次から次に에서 멈춰요. 뒤에 '나타났다'가 생략돼 있어, 말이 다 끝나기 전에 마지막 후렴으로 넘어가는 느낌이에요."}]},{"label":"ラストサビ · 마지막 후렴","note":"인파 속에서 너를 찾고 가슴이 답답해지다가, 들릴 때까지 몇 번이고 '네가 좋아'라고 말하겠다며 끝나요.","lines":[{"id":"h1","tk":[{"t":"{会|あ}いたい","p":"동사","m":"보고 싶다","b":"{会|あ}う","bm":"만나다","w":"어간 会는 한자, いたい는 히라가나예요."},{"t":"と"},{"t":"{毎|まい}{日|にち}","p":"명사","m":"매일","n":"한국어 '매일(每日)'과 같은 한자어예요. 毎는 每의 일본식 약자예요."},{"t":"{思|おも}ってて","p":"동사","m":"생각하고 있어서","b":"{思|おも}う","bm":"생각하다","w":"어간 思는 한자, ってて는 히라가나예요.","n":"思っていて의 회화체예요. 〜ている의 い가 빠졌어요."}],"ko":"매일 보고 싶다고 생각하고 있어서","lit":"보고 싶다 / 고 / 매일 / 생각하고 있어서","g":[{"k":"〜てて","d":"〜ていて(~하고 있어서)의 회화체예요. 思っていて → 思ってて."}],"s":"첫 후렴의 会いたいと思う回数와 같은 말로 시작해요. 回数(횟수)가 毎日(매일)로 바뀌었어요.","c":"첫 후렴에서는 보고 싶은 '횟수'를 셌는데, 이제는 '매일'이 됐어요. 마음이 더 깊어진 걸로 읽혀요."},{"id":"h2","tk":[{"t":"それ","p":"대명사","m":"그것","w":"これ·それ·あれ·どれ 같은 지시어는 히라가나로 써요."},{"t":"を"},{"t":"{君|きみ}"},{"t":"に"},{"t":"{知|し}って","p":"동사","m":"알아","b":"{知|し}る","bm":"알다","w":"어간 知는 한자, って는 히라가나예요.","n":"知る는 5단 동사라 て형이 知って예요."},{"t":"{欲|ほ}しくて"}],"ko":"그걸 네가 알아줬으면 해서","lit":"그것 / 을 / 너 / 에게 / 알아 / 줬으면 해서","g":[{"k":"사람 + に + 〜てほしい","d":"'(누가) ~해 줬으면 좋겠다'. 해 줄 사람을 に로 나타내요. 君に知ってほしい = 네가 알아줬으면 좋겠어."}],"s":"후렴의 いて欲しくて와 같은 欲しくて예요. 마지막 후렴에서도 欲しい는 계속 한자예요.","c":"1절에서는 마음이 알려 주려 했는데, 이제는 내가 너에게 알리고 싶어 해요."},{"id":"h3","tk":[{"t":"すれ{違|ちが}う","p":"동사","m":"스쳐 지나가는","b":"すれ{違|ちが}う","bm":"스쳐 지나가다, 엇갈리다","w":"擦れ違う의 擦를 히라가나 すれ로 풀고 違만 한자로 썼어요. 한 단어 안에 히라가나와 한자가 섞였어요.","n":"擦る(すれる, 스치다) + 違う(어긋나다). すれ違い = 엇갈림. 연애 드라마에서 마음이 엇갈릴 때도 써요."},{"t":"{人|ひと}{混|ご}み","p":"명사","m":"인파, 붐비는 곳","w":"人(ひと)와 混む(こむ, 붐비다)가 합쳐지며 こ가 ご로 탁해졌어요(렌다쿠). 명사인데 오쿠리가나 み가 붙어요.","n":"人込み로 쓰기도 해요. 人混みが苦手 = 붐비는 데가 싫어."},{"t":"に","p":"조사","m":"~에서, ~속에서"},{"t":"{君|きみ}"},{"t":"を"},{"t":"{探|さが}している","p":"동사","m":"찾고 있어","b":"{探|さが}す","bm":"찾다","w":"어간 探는 한자, している는 히라가나예요.","n":"한국어 '탐(探)'과 같은 한자예요(탐색 = 探索). 探す는 없는 걸 찾고, 捜す는 잃어버린 걸 찾을 때 써요."}],"ko":"스쳐 가는 인파 속에서 너를 찾고 있어","lit":"스쳐 지나가는 / 인파 / 에 / 너 / 를 / 찾고 있다","g":[{"k":"〜ている","d":"'~하고 있다'. 探す → 探している. 이 줄은 줄이지 않은 している를 그대로 썼어요."}],"s":"すれ違う와 人混み 모두 한자와 히라가나가 섞인 말이에요. 人混み처럼 명사에 오쿠리가나가 붙는 말은 따로 눈여겨보세요.","c":"크리스마스의 붐비는 거리에서 무심코 너를 찾는 장면이에요. 너는 여기 없다는 걸 알면서도 찾는 느낌으로 읽혀요."},{"id":"h4","tk":[{"t":"こんな"},{"t":"{日|ひ}","p":"명사","m":"날","n":"혼자 쓰면 ひ, 毎日처럼 한자어에서는 にち로 읽어요."},{"t":"は"},{"t":"{他|ほか}","p":"명사","m":"다른","w":"他를 쿤요미 ほか로 읽어요. 한자어에서는 た로 읽어요(他人 = たにん).","n":"他の誰か = 다른 누군가. 外(ほか)로 쓰기도 해요."},{"t":"の"},{"t":"{誰|だれ}か","p":"대명사","m":"누군가","w":"誰(だれ)에 か가 붙어 '누군가'가 됐어요.","n":"1절 첫 줄의 どこか(어딘가)와 같은 짜임이에요."},{"t":"と","p":"조사","m":"~와"},{"t":"{笑|わら}ってる","p":"동사","m":"웃고 있다","b":"{笑|わら}う","bm":"웃다","w":"어간 笑는 한자, ってる는 히라가나예요.","n":"笑っている의 회화체예요. 笑顔(えがお)는 주쿠지쿤이에요."},{"t":"かな"}],"ko":"이런 날엔 다른 누군가와 웃고 있으려나","lit":"이런 / 날 / 은 / 다른 / 의 / 누군가 / 와 / 웃고 있다 / 려나","g":[{"k":"〜てるかな","d":"'~하고 있으려나'. 상대의 지금 모습을 혼자 짐작해요. 1절의 街のせいかな와 같은 かな예요."}],"s":"日가 이 줄에서는 ひ, 앞 줄의 毎日에서는 にち예요. 같은 한자가 혼자일 때와 한자어일 때 읽기가 달라요.","c":"こんな日는 크리스마스예요. 연인의 날이라 너도 누군가와 함께 있을지 모른다는 불안이에요."},{"id":"h5","tk":[{"t":"{胸|むね}"},{"t":"の"},{"t":"{奥|おく}"},{"t":"の"},{"t":"{奥|おく}","p":"명사","m":"깊은 곳"},{"t":"が"},{"t":"{苦|くる}しく","p":"い형용사","m":"괴롭게","b":"{苦|くる}しい","bm":"괴롭다, 답답하다","w":"어간 苦는 한자, しく는 히라가나예요.","n":"한국어 '고(苦)'와 같은 한자예요(고통 = 苦痛). 苦い(にがい)로 읽으면 '쓰다'예요."},{"t":"なる","p":"동사","m":"되다","w":"기본 동사라 히라가나로 써요."}],"ko":"가슴 깊은 곳의 더 깊은 곳이 답답해져","lit":"가슴 / 의 / 깊은 곳 / 의 / 깊은 곳 / 이 / 괴롭게 / 되다","g":[{"k":"い형용사 + くなる","d":"'~해지다'. 苦しい → 苦しくなる. 후렴의 長くなる와 같은 문법이에요."}],"s":"奥를 두 번 겹쳐 '가슴속 더 깊은 곳'을 만들었어요. 한자 胸·奥·奥·苦 사이를 히라가나 の·が가 이어요.","c":"첫 후렴의 '못 만나면 아픈 이 가슴'이 여기서 더 깊은 곳까지 아파요."},{"same":"c6"},{"same":"c7"},{"same":"c8"},{"id":"h6","tk":[{"t":"やっぱり","p":"부사","m":"역시","w":"부사라 히라가나로 써요. やはり의 회화체예요.","n":"やはり를 강조한 말이에요. 회화에서는 やっぱ로 더 줄이기도 해요."},{"t":"こんな"},{"t":"{事|こと}"},{"t":"{伝|つた}えたら","p":"동사","m":"전하면","b":"{伝|つた}える","bm":"전하다","w":"어간 伝는 한자, えたら는 히라가나예요."},{"t":"{格|かっ}{好|こう}{悪|わる}いし"}],"ko":"역시 이런 말 하면 꼴사납고","lit":"역시 / 이런 / 일 / 전하면 / 꼴사납고","g":[{"k":"조사 생략","d":"회화에서는 を가 자주 빠져요. 첫 후렴의 こんな事を伝えたら가 여기서는 こんな事伝えたら예요."}],"s":"첫 후렴의 でもこんな事を가 やっぱりこんな事로 바뀌었어요. を가 빠져 말이 더 급하게 이어져요.","c":"'하지만'이 '역시'로 바뀌었어요. 한 번 겪어 본 망설임을 다시 떠올리는 느낌으로 읽혀요."},{"same":"c10"},{"same":"c11"},{"id":"h7","tk":[{"t":"{聞|き}こえる","p":"동사","m":"들리다","w":"어간 聞는 한자, こえる는 히라가나예요.","n":"聞く(듣다)의 자연스러운 짝으로 '(소리가) 들리다'예요. 聞こえる는 일부러 듣지 않아도 들리는 쪽이에요."},{"t":"まで","p":"조사","m":"~까지"},{"t":"{何|なん}{度|ど}","p":"명사","m":"몇 번","w":"何는 度 앞에서 なん으로 읽어요. 何(なに)가 뒤 소리에 따라 なん으로 바뀌어요.","n":"何度も = 몇 번이나. 度는 한국어 '도(度)'예요(온도 = 温度)."},{"t":"だって","p":"조사","m":"~이라도","n":"でも의 회화체예요. 何度だって = 몇 번이라도."},{"t":"{言|い}う","p":"동사","m":"말할게","w":"어간 言는 한자, う는 히라가나예요.","n":"いう로 쓰지만 발음은 ゆう에 가까워요."},{"t":"よ"}],"ko":"들릴 때까지 몇 번이라도 말할게","lit":"들리다 / 까지 / 몇 번 / 이라도 / 말하다 / 야","g":[{"k":"〜まで","d":"'~할 때까지'. 동사 사전형 + まで. 聞こえるまで = 들릴 때까지."},{"k":"何度だって","d":"'몇 번이라도'. 何度でも의 회화체예요."}],"s":"聞こえる의 聞는 君はロックを聴かない의 聴가 아니라 기본 한자 聞예요. 소리가 저절로 들린다는 뜻이라 聞를 써요.","c":"후렴에서 한 번 짧게 정리했던 '네가 좋아'를 이제는 몇 번이라도 말하겠대요. 쑥스러움을 넘어선 마지막 다짐으로 읽혀요."},{"same":"c11"}]}]},"suiheisen":{"id":"suiheisen","title":"{水平線|すいへいせん}","artist":"back number","year":2020,"eyebrow":"back number · 2020","sub":"코로나19로 취소된 2020년 인터하이를 목표로 하던 고교생들을 위해 만든 곡. 개회식이 열릴 예정이던 날 0시에 YouTube로 깜짝 공개됐어요.","release":"2020년 8월 18일 YouTube 공개 · 2021년 8월 13일 음원 배포","lyricist":"清水依与吏","composer":"清水依与吏","listen":"https://www.youtube.com/results?search_query=back+number+%E6%B0%B4%E5%B9%B3%E7%B7%9A","intro":"水平線은 back number가 2020년에 공개한 곡이에요. 그해 여름 코로나19로 인터하이(고교 종합 체육대회)가 취소되자, 그 대회를 목표로 하던 고교생들을 위해 만들었어요. 원래 개회식 날이던 8월 18일 0시에 YouTube로 깜짝 공개됐고, 1년 뒤인 2021년 8월 13일에 음원으로 나왔어요.\n\n노래는 거짓 없이, 다정하게 살고 싶다는 바람에서 시작해요. 그래도 희망이 무너지는 날은 와요. 무너진 희망의 조각이 바람에 날려 바다로 흘러가 빛나고, 당신은 언젠가 그걸 보게 될 거라고 노래해요. 아침과 밤, 희망과 꿈, 환호와 비명처럼 짝을 이루는 말을 따라 읽어 보세요.","notes":[{"tag":"배경","title":"취소된 인터하이를 위한 노래","body":"2020년 여름, 코로나19 때문에 인터하이(고교 종합 체육대회)가 취소됐어요. 水平線은 이 대회를 목표로 연습해 온 고교생들을 위해 back number가 만든 곡이에요. 작사·작곡은 보컬 {清|し}{水|みず}{依|い}{与|よ}{吏|り}, 편곡에는 {小|こ}{林|ばやし}{武|たけ}{史|し}가 참여했어요.\n\n곡은 원래 개회식이 열릴 예정이던 2020년 8월 18일 0시에 YouTube로 깜짝 공개됐어요. 한동안은 공식 리릭 비디오로만 들을 수 있었어요. 음원은 이듬해 2021년 인터하이 개회식 날인 8월 13일에 배포됐어요."},{"tag":"문화","title":"インターハイ, 고교생의 여름","body":"[[インターハイ]]는 inter와 high school을 줄인 일본식 영어예요. 정식 이름은 [[{全|ぜん}{国|こく}{高|こう}{等|とう}{学|がっ}{校|こう}{総|そう}{合|ごう}{体|たい}{育|いく}{大|たい}{会|かい}]]예요. 육상, 수영, 농구 등 여러 종목의 고교 전국 대회가 여름에 열려요. 3학년에게는 고교 마지막 대회가 되는 경우가 많아요.\n\n야구는 인터하이 종목이 아니라 고시엔(甲子園)이 따로 있어요. 고시엔 프로그램 테마송이던 히게단의 宿命과 이 곡은 둘 다 고교생 스포츠와 이어진 노래예요. 宿命이 경기의 뜨거움을 노래했다면, 이 곡은 대회 자체를 잃은 마음 곁에 서 있는 노래로 읽혀요."},{"tag":"표현","title":"아침과 밤, 무너진 희망과 이루어진 꿈","body":"두 후렴은 같은 틀로 짝을 이뤄요. 첫 후렴은 '수평선이 빛나는 아침'에 당신의 희망이 무너지고, 두 번째 후렴은 '비쳐 보일 만큼 옅은 밤'에 당신의 꿈이 이루어져요.\n\n그런데 무너진 희망의 조각을 누군가는 예쁘다고 하고, 이룬 꿈의 환호 속에는 누군가의 비명이 숨어 있어요. 이긴 사람 뒤에는 진 사람이 있는 스포츠 대회와 닮은 그림으로 읽혀요. 끝은 각각 [[それを{見|み}るでしょう]], [[{自|じ}{分|ぶん}を{知|し}るでしょう]]로 맺어요."},{"tag":"표현","title":"〜ように, 바람을 담은 말끝","body":"1절 Aメロ 네 줄은 모두 [[ように]]로 끝나요. 문장 끝의 ように는 '~하도록, ~하기를' 하고 바라는 말이에요. 주어가 없어서 노래하는 사람의 다짐으로도, 듣는 사람을 위한 기도로도 읽혀요.\n\nマリーゴールド에서 본 [[〜ますように]]와 같은 ように예요. 같은 Aメロ의 [[{自|じ}{分|ぶん}の{事|こと}のように]]는 '~처럼'이라는 다른 ように라서 구별해 보세요."},{"tag":"표현","title":"あなた, 그리고 단 한 번의 私","body":"이 곡은 듣는 사람을 처음부터 끝까지 [[あなた]]라고 불러요. 히게단·아이묭 곡에 많이 나온 [[{君|きみ}]]보다 조금 거리를 둔 부드러운 말이에요. 어른이 고교생에게 건네는 말투로도 읽혀요.\n\n1인칭 [[{私|わたし}]]는 Cメロ 마지막 줄에 딱 한 번 나와요. 아무에게도 기억되지 않는 오늘에도 '나 여기 있어'라고 외치는 목소리예요. 이 私를 누구로 볼지는 열려 있어요."},{"tag":"표기","title":"일부러 고른 한자들","body":"이 곡에는 조요칸지(일상에서 쓰는 한자의 기준 목록) 밖의 한자가 여럿 나와요. [[{嘘|うそ}]], [[{綺|き}{麗|れい}]], [[{呟|つぶや}く]], [[{叶|かな}う]]예요. 신문이라면 うそ, きれい, つぶやく, かなう처럼 히라가나로 쓰는 말이에요.\n\n한자는 목록에 있지만 읽기가 목록 밖인 표기도 있어요. [[{失|な}くす]](보통 無くす), [[{欠片|かけら}]]예요. 또 [[{事|こと}]], [[{出|で}{来|き}る]], [[{無|な}い]]처럼 히라가나로 쓰는 일이 많은 말도 한자로 썼어요. Pretender의 綺麗·繋처럼, 한자로 뜻을 눈에 보이게 하는 가사 표기로 볼 수 있어요."},{"tag":"표기","title":"히라가나로 푼 말과 두 가지 ない","body":"반대로 히라가나로 푼 말도 있어요. [[ひとつ]](一つ), [[いつしか]](何時しか), [[いくつも]](幾つも), [[あなた]](貴方), [[ここ]](此処)는 한자가 있지만 보통 히라가나로 써요. 2절 [[{見|み}えるもの]]의 もの도 히라가나예요.\n\n'없다'도 눈여겨보세요. 첫 줄 [[{嘘|うそ}は{無|な}い]]는 한자, Cメロ의 [[{事|こと}もない]]는 히라가나예요. 둘 다 형용사 ない인데 표기가 달라요. 한편 [[{見|み}えない]]의 ない는 '~하지 않다'라는 부정 조동사라 늘 히라가나로 써요."}],"dict":{"は":{"p":"조사","m":"~은/는 (주제)","n":"조사로 쓸 때는 ha가 아니라 wa로 읽어요."},"が":{"p":"조사","m":"~이/가"},"を":{"p":"조사","m":"~을/를","n":"현대 일본어에서 を는 이 조사에만 쓰는 글자예요. 발음은 お(o)와 같아요."},"に":{"p":"조사","m":"~에"},"の":{"p":"조사","m":"~의"},"で":{"p":"조사","m":"~으로"},"と":{"p":"조사","m":"~라고 (인용)"},"も":{"p":"조사","m":"~도"},"ように":{"p":"조동사","m":"~하도록, ~하기를","n":"문장 끝을 ように로 맺으면 '~하기를' 하고 바라는 말이 돼요. 명사 + のように는 '~처럼'이에요."},"けれど":{"p":"조사","m":"~지만","n":"けど보다 조금 또박또박한 말이에요. けれども > けれど > けど 순으로 짧아져요."},"でしょう":{"p":"조동사","m":"~겠지, ~일 거야","n":"だろう의 정중한 말이에요. 앞일을 짐작해요. 明日は雨でしょう(내일은 비가 오겠지요)."},"のだから":{"p":"조사(복합)","m":"~인 법이니까, ~니까","n":"の + だ + から. 누구나 아는 사실을 이유로 들 때 써요. 뒤에 그러니 이렇게 하라는 말이 자주 와요."},"いい":{"p":"い형용사","m":"좋다","w":"良い라는 한자가 있지만, 회화체 いい는 히라가나로 써요.","n":"いい는 よい의 회화체예요. 활용할 때는 よかった, よくない처럼 よい 꼴을 써요."},"あなた":{"p":"대명사","m":"당신","w":"貴方라는 한자가 있지만 보통 히라가나로 써요.","n":"あなた는 君보다 조금 거리를 둔 부드러운 '당신'이에요. 회화에서 상대를 직접 あなた라고 부르는 일은 생각보다 적어요."},"{自|じ}{分|ぶん}":{"p":"명사","m":"자기, 자신","n":"自(스스로 자)와 分(몫 분)으로 '자기, 자신'이에요. 自分で(스스로), 自分の事(자기 일)."},"{人|ひと}":{"p":"명사","m":"남, 다른 사람","n":"人은 '사람'이지만 이 곡에서처럼 '남, 다른 사람'이라는 뜻으로도 자주 써요. 人の物(남의 물건)."},"{時|とき}":{"p":"명사","m":"때","n":"時는 じ로도 읽어요. 時間(じかん, 시간). 혼자 '때'라는 뜻일 때는 とき예요."},"{事|こと}":{"p":"형식명사","m":"일, 것","w":"형식명사 こと는 보통 히라가나로 쓰는데, 이 곡은 네 번 모두 한자 事로 썼어요.","n":"事는 한국어 '사(事)'예요. 大事(だいじ)처럼 온요미 じ로도 읽어요."},"{誰|だれ}":{"p":"대명사","m":"누구","n":"誰는 2010년에 조요칸지에 들어간 글자예요. 誰にも(누구에게도), 誰も(아무도)처럼 뒤의 조사로 뜻이 바뀌어요."},"{誰|だれ}か":{"p":"대명사","m":"누군가","w":"誰는 한자, 뒤의 か는 히라가나예요. 誰(누구) + か(불확실) = 누군가.","n":"의문사 + か는 '~인가'예요. 何か(무언가), どこか(어딘가)."},"{心|こころ}":{"p":"명사","m":"마음","n":"心는 쿤요미 こころ, 온요미 しん이에요. 心臓(しんぞう, 심장), 安心(あんしん, 안심)."},"{正|ただ}しさ":{"p":"명사","m":"올바름, 옳음","w":"어간 正은 한자, しさ는 히라가나예요. 형용사 正しい의 い를 さ로 바꾼 명사예요.","n":"〜さ는 형용사를 명사로 만들어요. 正しい → 正しさ, 優しい → 優しさ. 히게단 らしさ(らしい + さ)와 같은 꼴이에요."},"{見|み}えない":{"p":"동사","m":"보이지 않는","b":"{見|み}える","bm":"보이다","w":"어간 見는 한자, えない는 히라가나예요. 끝의 ない는 부정 조동사라 늘 히라가나로 써요.","n":"見る(보다)와 見える(보이다)는 달라요. 見える는 저절로 눈에 들어오는 것이에요."}},"sections":[{"label":"1절 · Aメロ","note":"거짓 없이, 언제나 다정하게, 남의 아픔을 내 일처럼. 네 줄 모두 ように로 끝나는 바람이에요.","lines":[{"id":"a1","tk":[{"t":"{出|で}{来|き}るだけ","p":"부사","m":"될 수 있는 한, 되도록","w":"出来る를 한자로 썼어요. できるだけ처럼 히라가나로 쓰는 일도 많은 말이에요. 2절의 出来るけれど도 한자예요.","n":"出来る(할 수 있다) + だけ(~만큼) = '할 수 있는 만큼', 곧 '될 수 있는 한'. できるだけ早く(되도록 빨리)."},{"t":"{嘘|うそ}","p":"명사","m":"거짓, 거짓말","w":"嘘는 조요칸지(일상 한자의 기준 목록)에 없는 글자예요. 히라가나 うそ로 쓰는 일도 많은데, 가사에서는 한자로 썼어요.","n":"口(입)에 虚(빌 허)가 붙은 글자예요. 嘘をつく = 거짓말을 하다. 회화에서 嘘!는 '설마!, 진짜?'라는 놀람이에요."},{"t":"は"},{"t":"{無|な}い","p":"い형용사","m":"없다","k":"ない","w":"형용사 ない(없다)를 한자 無い로 썼어요. Cメロ의 事もない에서는 같은 ない를 히라가나로 썼어요.","n":"無는 한국어 '무(無)'예요. 無理(むり, 무리), 無料(むりょう, 무료)."},{"t":"ように"}],"ko":"될 수 있는 한 거짓은 없도록","lit":"될 수 있는 한 / 거짓 / 은 / 없다 / 도록","g":[{"k":"{出|で}{来|き}るだけ","d":"'될 수 있는 한, 되도록'. できるだけ早く(되도록 빨리), できるだけ頑張る(할 수 있는 만큼 힘내다)."},{"k":"〜ように (바람)","d":"문장 끝의 ように는 '~하도록, ~하기를'. 이 줄에서는 嘘は無い(거짓이 없다) + ように = 거짓이 없도록."}],"s":"嘘는 조요칸지 밖의 한자, 無い와 出来る는 히라가나로도 많이 쓰는 말이에요. 첫 줄부터 한자를 또렷하게 고른 표기예요.","c":"노래는 '되도록'이라는 말로 시작해요. 완벽하겠다는 게 아니라, 할 수 있는 만큼 해 보겠다는 겸손한 다짐으로 읽혀요."},{"id":"a2","tk":[{"t":"どんな","p":"연체사","m":"어떤","w":"こんな·そんな·あんな·どんな 같은 지시어는 히라가나로 써요."},{"t":"{時|とき}"},{"t":"も"},{"t":"{優|やさ}しく","p":"い형용사","m":"다정하게","b":"{優|やさ}しい","bm":"다정하다, 상냥하다","w":"어간 優는 한자, しく는 히라가나예요. 優しい의 い를 く로 바꿨어요.","n":"やさしい는 한자가 둘이에요. 優しい(다정하다)와 易しい(쉽다). 소리는 같고 뜻이 달라요."},{"t":"あれる","p":"동사","m":"있을 수 있는","b":"ある","bm":"있다, ~한 상태이다","w":"ある는 보통 히라가나로 써요. 한자 在る·有る도 있지만 가사·회화에서는 잘 쓰지 않아요.","n":"ある는 원래 가능형을 잘 만들지 않는 동사예요. 하지만 優しくあれる·強くあれる처럼 '그런 사람으로 있을 수 있다'는 뜻으로 쓰는 일이 있어요."},{"t":"ように"}],"ko":"어느 때든 다정할 수 있도록","lit":"어떤 / 때 / 도 / 다정하게 / 있을 수 있는 / 도록","g":[{"k":"どんな〜も","d":"'어떤 ~라도'. どんな時も = 어떤 때라도, 곧 '언제나'. どんな人も(어떤 사람이라도)."},{"k":"い형용사 + くある","d":"優しい → 優しくある(다정한 상태로 있다). '그런 사람으로 있겠다'는 무게가 실린 글말이에요. 여기서는 가능의 뜻 あれる가 붙었어요."}],"c":"優しい(다정하다)가 아니라 優しくあれる(다정할 수 있다)라고 했어요. 다정함은 저절로가 아니라 애써 지켜 내는 것이라는 느낌이 나요."},{"id":"a3","tk":[{"t":"{人|ひと}"},{"t":"が"},{"t":"{痛|いた}み","p":"명사","m":"아픔","w":"어간 痛은 한자, み는 히라가나예요. 형용사 痛い의 い를 み로 바꾼 명사라 오쿠리가나가 붙어요.","n":"〜み는 형용사를 명사로 만들어요. 痛い → 痛み(아픔), 悲しい → 悲しみ(슬픔). 1절 Bメロ의 悲しみ도 같은 꼴이에요."},{"t":"を"},{"t":"{感|かん}じた","p":"동사","m":"느낀","b":"{感|かん}じる","bm":"느끼다","w":"感은 온요미 かん으로 읽고, じた는 히라가나예요. 한자어 感에 じる가 붙은 동사예요.","n":"한국어 '감(感)'과 같은 한자예요. 感じる는 1단 동사라 た형이 感じた예요."},{"t":"{時|とき}"},{"t":"には","p":"조사","m":"~에는"}],"ko":"남이 아픔을 느꼈을 때는","lit":"남 / 이 / 아픔 / 을 / 느낀 / 때 / 에는","g":[{"k":"〜た{時|とき}","d":"'~했을 때'. 感じる → 感じた時. 느끼는 일이 일어난 그 순간을 가리켜요."},{"k":"형용사 + み","d":"痛い → 痛み. い를 み로 바꾸면 '아픔' 같은 명사가 돼요."}],"c":"여기서 人은 '사람 일반'보다 '남, 다른 사람'에 가까워요. 다음 줄의 自分(자기)과 짝을 이뤄요."},{"id":"a4","tk":[{"t":"{自|じ}{分|ぶん}"},{"t":"の"},{"t":"{事|こと}"},{"t":"の"},{"t":"ように","m":"~처럼","n":"명사 + のように = '~처럼'. 줄 끝의 ように(~하도록)와 소리는 같고 쓰임이 달라요."},{"t":"{思|おも}える","p":"동사","m":"여길 수 있는","b":"{思|おも}う","bm":"생각하다","w":"어간 思는 한자, える는 히라가나예요.","n":"思える는 '그렇게 여길 수 있다, 저절로 그렇게 생각되다'예요. 마음이 자연스럽게 그쪽으로 움직인다는 느낌이 있어요."},{"t":"ように"}],"ko":"내 일처럼 여길 수 있도록","lit":"자기 / 의 / 일 / 의 / 처럼 / 여길 수 있는 / 도록","g":[{"k":"〜のように","d":"'~처럼'. 自分の事のように = 자기 일처럼. 줄 끝 ように(~하도록)와 구별해요."},{"k":"{思|おも}える","d":"思う의 가능형 '그렇게 여길 수 있다'. 억지로가 아니라 마음이 자연스럽게 그렇게 된다는 뜻이 담겨요."}],"s":"こと를 한자 事로 썼어요. 이 곡은 형식명사 こと를 네 번 모두 한자 事로 써요(重なる事で, 残る事も, 焼き付く事も).","c":"ように가 한 줄에 두 번 나와요. 하나는 '~처럼', 하나는 '~하도록'이에요. 네 줄이 모두 ように로 끝나며 기도처럼 이어져요."}]},{"label":"1절 · Bメロ","note":"그렇게 살아도, 옳음과 옳음이 부딪쳐 무언가를 잃는 슬픔은 찾아온다고 말해요.","lines":[{"id":"b1","tk":[{"t":"{正|ただ}しさ"},{"t":"を"},{"t":"{別|べつ}","p":"명사","m":"다른 (것)","n":"한국어 '별(別)'과 같은 한자예요. 別の〜 = 다른 ~. 別々(べつべつ, 따로따로)."},{"t":"の"},{"t":"{正|ただ}しさ"},{"t":"で","m":"~으로, ~때문에"}],"ko":"내 옳음을 또 다른 옳음 때문에","lit":"옳음 / 을 / 다른 / 의 / 옳음 / 으로","g":[{"k":"〜を〜で{失|な}くす","d":"'~을 ~으로 잃다'. で는 수단이나 원인이에요. 正しさを別の正しさで失くす = 옳음을 다른 옳음 때문에 잃다. 다음 줄까지 이어지는 한 문장이에요."},{"k":"형용사 + さ","d":"正しい → 正しさ(옳음). い를 さ로 바꾸면 성질을 나타내는 명사가 돼요."}],"s":"正しさ가 한 줄에 두 번 나와요. 같은 말을 되풀이해 '옳음 대 옳음'이라는 맞섬을 눈에 보이게 했어요.","c":"누구도 틀리지 않았는데 한쪽이 무언가를 잃는 장면으로 읽혀요. 둘 다 최선을 다한 경기의 승패처럼요."},{"id":"b2","tk":[{"t":"{失|な}くす","p":"동사","m":"잃는","w":"なくす는 보통 無くす로 쓰는데, 잃을 실(失)을 골랐어요. 失에 なくす라는 읽기는 조요칸지 표에 없어서, 가사나 소설에서 뜻을 살리려고 쓰는 표기예요.","n":"失는 원래 うしなう(잃다)로 읽어요. 사람을 잃을 때는 亡くす(なくす)를 써요."},{"t":"{悲|かな}しみ","p":"명사","m":"슬픔","w":"어간 悲는 한자, しみ는 히라가나예요. 형용사 悲しい의 い를 み로 바꾼 명사예요.","n":"1절 Aメロ의 痛み와 같은 꼴이에요. 悲(슬플 비)는 한국어 '비극(悲劇)'의 悲예요."},{"t":"に"},{"t":"も"},{"t":"{出|で}{会|あ}う","p":"동사","m":"마주치다","w":"出(나다)와 会(만나다) 두 한자에 う가 붙었어요.","n":"出会う는 우연히 만나거나 처음 마주치는 느낌이에요. 出会い(만남)."},{"t":"けれど"}],"ko":"잃어버리는 슬픔과도 마주치겠지만","lit":"잃는 / 슬픔 / 에 / 도 / 마주치다 / 지만","g":[{"k":"〜に{出|で}{会|あ}う","d":"'~을 만나다'는 を가 아니라 に를 써요. 悲しみに出会う = 슬픔을 만나다. 人に会う(사람을 만나다)도 같아요."},{"k":"〜けれど","d":"'~지만'. 문장을 다 맺지 않고 다음 이야기로 넘겨요. 2절 出来るけれど도 같아요."}],"s":"失くす는 조요칸지 표에 없는 읽기예요. 無くす나 히라가나 なくす로 쓸 수도 있는데, 失를 골라 '잃는다'는 뜻을 분명히 했어요.","c":"Aメロ의 다짐을 지키며 살아도 슬픔은 피할 수 없다고 말해요. けれど로 끝나서 후렴으로 이어져요."}]},{"label":"サビ · 후렴","note":"수평선이 빛나는 아침, 무너진 희망의 조각이 바람에 날려 바다로 흘러가 빛나요.","lines":[{"id":"c1","tk":[{"t":"{水|すい}{平|へい}{線|せん}","p":"명사","m":"수평선","n":"한국어 '수평선'과 같은 한자어예요. 땅의 끝은 地平線(ちへいせん, 지평선)이에요."},{"t":"が"},{"t":"{光|ひか}る","p":"동사","m":"빛나는","w":"어간 光는 한자, る는 히라가나예요.","n":"光(ひかり)는 '빛', 光る(ひかる)는 '빛나다'예요. 光는 온요미로 こう라고도 읽어요. 光景(こうけい, 광경)."},{"t":"{朝|あさ}","p":"명사","m":"아침","n":"朝는 쿤요미 あさ, 온요미 ちょう예요. 朝食(ちょうしょく, 아침 식사)."},{"t":"に","m":"~에 (때)"}],"ko":"수평선이 빛나는 아침에","lit":"수평선 / 이 / 빛나는 / 아침 / 에","g":[{"k":"동사 + 명사","d":"일본어는 동사 사전형이 그대로 명사를 꾸며요. 光る朝 = 빛나는 아침. 한국어처럼 '-는'을 따로 붙이지 않아요."}],"s":"제목 水平線은 세 한자를 모두 온요미로 읽는 한자어예요. 한국어 '수평선'과 한자가 같아서 소리도 비슷해요.","c":"인터하이 개회식 날 0시에 공개된 곡이라, 대회가 열렸을 아침의 풍경으로도 읽혀요. 희망이 무너지는 때가 하필 빛나는 아침이라는 점이 아파요."},{"id":"c2","tk":[{"t":"あなた"},{"t":"の"},{"t":"{希|き}{望|ぼう}","p":"명사","m":"희망","n":"한국어 '희망(希望)'과 같은 한자어예요. 일본어로는 きぼう라고 읽어요."},{"t":"が"},{"t":"{崩|くず}れ{落|お}ちて","p":"동사","m":"무너져 내리고","b":"{崩|くず}れ{落|お}ちる","bm":"무너져 내리다","w":"崩(무너지다)와 落(떨어지다) 두 한자 사이에 히라가나 れ가 끼었어요. 崩れる + 落ちる가 합쳐진 복합동사예요.","n":"崩れる의 ます형 崩れ에 落ちる를 붙였어요. 끝의 て는 다음 장면으로 이어 주는 て형이에요."}],"ko":"당신의 희망이 무너져 내리고","lit":"당신 / 의 / 희망 / 이 / 무너져 내리고","g":[{"k":"복합동사","d":"ます형 + 동사. 崩れる + 落ちる → 崩れ落ちる(무너져 내리다). 이 후렴의 流れ着く(흘러가 닿다)도 같은 꼴이에요."},{"k":"て형 (이어 가기)","d":"崩れ落ちる → 崩れ落ちて. 문장을 끝내지 않고 다음 장면으로 이어요."}],"s":"あなた는 한자 貴方가 있지만 히라가나로 썼어요. 이 곡은 듣는 사람을 내내 あなた라고 불러요.","c":"희망이 무너져 내린다는 건 대회를 잃은 고교생의 마음으로도 읽혀요. 무너진 희망은 다음 줄에서 '조각'이 돼요."},{"id":"c3","tk":[{"t":"{風|かぜ}","p":"명사","m":"바람"},{"t":"に","m":"~에 (의해)"},{"t":"{飛|と}ばされる","p":"동사","m":"날려 가는","b":"{飛|と}ばす","bm":"날리다","w":"어간 飛는 한자, ばされる는 히라가나예요.","n":"飛ぶ(날다, 자동사) ↔ 飛ばす(날리다, 타동사). 飛ばす의 수동형이 飛ばされる(날려지다)예요."},{"t":"{欠片|かけら}","p":"명사","m":"조각, 파편","w":"欠片는 한자 하나하나의 읽기로 나눌 수 없어서, 단어 전체에 かけら라는 읽기를 붙였어요. 조요칸지 표에 없는 읽기라 히라가나 かけら로 쓰는 일도 많아요.","n":"欠(이지러질 결)과 片(조각 편)이 '떨어져 나온 조각'이라는 뜻을 보여 줘요. 欠ける(かける)는 '이가 빠지다, 모자라다'예요."},{"t":"に","m":"~에, ~을 보고"}],"ko":"바람에 날려 가는 그 조각을 보고","lit":"바람 / 에 / 날려 가는 / 조각 / 에","g":[{"k":"수동형 〜される","d":"5단 동사 끝 う단을 あ단으로 바꾸고 れる를 붙여요. 飛ばす → 飛ばされる(날려지다). 행위자 '바람'에는 に를 붙여요."},{"k":"〜に〜と{呟|つぶや}く","d":"欠片に + 綺麗と呟く. 앞의 に는 '~을 두고, ~을 보고'라는 대상이에요. 다음 줄까지 이어져요."}],"s":"欠片는 주쿠지쿤처럼 단어 전체에 읽기를 붙이는 표기예요. 이 곡은 히라가나로 쓸 수 있는 말을 한자로 쓴 곳이 많아요.","c":"무너진 희망이 바람에 흩어지는 조각이 됐어요. 이 조각이 후렴 끝까지 이어지는 주인공이에요."},{"id":"c4","tk":[{"t":"{誰|だれ}か"},{"t":"が"},{"t":"{綺|き}{麗|れい}","p":"な형용사","m":"예쁘다, 아름답다","w":"綺는 조요칸지에 없는 글자라 보통 きれい로 히라가나로 써요. Pretender처럼 가사에서는 한자 綺麗를 골라 화려한 느낌을 냈어요.","n":"きれい는 '예쁘다'와 '깨끗하다' 두 뜻이 있어요. 여기서는 '예쁘다'예요."},{"t":"と"},{"t":"{呟|つぶや}いてる","p":"동사","m":"중얼거리고 있어","b":"{呟|つぶや}く","bm":"중얼거리다","w":"呟는 조요칸지에 없는 한자예요. 신문 등에서는 つぶやく로 히라가나로 써요. 口(입) 옆에 玄이 붙은 글자예요.","n":"呟いている의 い를 뺀 회화체가 呟いてる예요. 일본에서는 트위터에 글을 올리는 것도 つぶやく라고 불렀어요."}],"ko":"누군가는 예쁘다고 중얼거리고 있어","lit":"누군가 / 가 / 예쁘다 / 고 / 중얼거리고 있다","g":[{"k":"〜と{呟|つぶや}く","d":"と는 인용의 '~라고'. 綺麗と呟く = 예쁘다고 중얼거리다. 言う(말하다), 思う(생각하다)도 같은 꼴이에요."},{"k":"〜てる","d":"〜ている(~하고 있다)에서 い를 뺀 회화체예요. 呟いている → 呟いてる."}],"s":"綺와 呟 두 한자가 모두 조요칸지 밖이에요. Pretender의 綺麗·繋처럼, 가사에서 분위기를 살리려 일부러 고른 한자로 볼 수 있어요.","c":"내게는 무너진 희망인데, 누군가에게는 예쁜 조각으로 보여요. 같은 장면도 보는 사람에 따라 다르다는 뜻으로 읽혀요."},{"id":"c5","tk":[{"t":"{悲|かな}しい","p":"い형용사","m":"슬픈","w":"어간 悲는 한자, しい는 히라가나예요."},{"t":"{声|こえ}","p":"명사","m":"목소리","n":"声는 한국어 '성(聲)'의 일본식 약자예요. 声優(せいゆう, 성우)."},{"t":"で"},{"t":"{歌|うた}いながら","p":"동사","m":"노래하면서","b":"{歌|うた}う","bm":"노래하다","w":"어간 歌는 한자, いながら는 히라가나예요.","n":"歌(うた)는 '노래', 歌う(うたう)는 '노래하다'예요."}],"ko":"슬픈 목소리로 노래하면서","lit":"슬픈 / 목소리 / 로 / 노래하면서","g":[{"k":"ます형 + ながら","d":"'~하면서'. 두 동작이 동시에 일어나요. 歌う → 歌いながら. 2절의 探しながら, 抱えながら도 같아요."}],"c":"노래하는 것은 바람에 날리는 조각으로 읽을 수 있어요. 조각은 슬프게 노래하며 바다로 흘러가요. 누가 노래하는지 일부러 흐릿하게 둔 줄이에요."},{"id":"c6","tk":[{"t":"いつしか","p":"부사","m":"어느새","w":"한자 何時しか도 있지만 거의 쓰지 않고 히라가나로 써요.","n":"いつ(언제)에 し·か가 붙어 굳은 말로, '언제인지 모르게, 어느덧'이에요. いつの間にか와 비슷하지만 더 글말 같고 시적이에요."},{"t":"{海|うみ}","p":"명사","m":"바다","n":"海는 쿤요미 うみ, 온요미 かい예요. 海外(かいがい, 해외)."},{"t":"に","m":"~에 (도착점)"},{"t":"{流|なが}れ{着|つ}いて","p":"동사","m":"흘러가 닿아","b":"{流|なが}れ{着|つ}く","bm":"떠내려가 닿다","w":"流(흐르다)와 着(닿다) 사이에 れ가 끼었어요. 流れる + 着く의 복합동사예요.","n":"着く는 '도착하다'예요. 着는 한국어 '도착(到着)'의 着예요. 着る(きる, 입다)도 같은 한자예요."},{"t":"　"},{"t":"{光|ひか}って","p":"동사","m":"빛나고","b":"{光|ひか}る","bm":"빛나다","w":"어간 光는 한자, って는 히라가나예요.","n":"光る는 る로 끝나는 5단 동사라 て형이 光って예요(소쿠온 っ)."}],"ko":"어느새 바다에 흘러가 닿아 빛나고","lit":"어느새 / 바다 / 에 / 흘러가 닿아 / (쉼) / 빛나고","g":[{"k":"〜て　〜て","d":"流れ着いて光って처럼 て형을 이어 쓰면 일이 차례로 일어나요. 흘러가 닿고, 그다음 빛나요."},{"k":"に (도착점)","d":"海に流れ着く = 바다에 흘러가 닿다. 行く·着く 같은 이동 동사 앞의 に는 도착점이에요."}],"s":"流れ着いて와 光って 사이에 전각 공백(　)이 있어요. 노래에서 숨을 한 번 고르는 자리예요. いつしか는 히라가나라서 시간이 부드럽게 흘러가는 느낌이 나요.","c":"무너진 희망의 조각이 흘러 흘러 바다에 닿아 빛나요. 첫 줄의 빛나는 수평선과 이어져, 잃은 것이 언젠가 빛으로 바뀐다는 그림으로 읽혀요."},{"id":"c7","tk":[{"t":"あなた"},{"t":"は"},{"t":"それ","p":"대명사","m":"그것","w":"こ·そ·あ·ど 지시어는 히라가나로 써요."},{"t":"を"},{"t":"{見|み}る","p":"동사","m":"보다","w":"어간 見는 한자, る는 히라가나예요."},{"t":"でしょう"}],"ko":"당신은 그걸 보게 될 거야","lit":"당신 / 은 / 그것 / 을 / 보다 / 겠지","g":[{"k":"〜でしょう","d":"'~겠지, ~일 거야'. 앞일을 짐작하는 말이에요. 見る + でしょう = 보게 되겠지. 2절 끝의 知るでしょう도 같아요."}],"c":"それ는 바다에 닿아 빛나는 희망의 조각이에요. 지금은 무너졌지만, 언젠가 그 빛을 당신이 보게 될 거라는 약속처럼 들려요."}]},{"label":"2절 · Aメロ","note":"자기 등과 마음처럼 스스로는 볼 수 없는 것에 대해 부드럽게 조언해요.","lines":[{"id":"d1","tk":[{"t":"{自|じ}{分|ぶん}"},{"t":"の"},{"t":"{背|せ}{中|なか}","p":"명사","m":"등","n":"背(등 배) + 中(가운데 중)이에요. 背는 혼자 せ로 읽으면 '키'라는 뜻도 있어요. 背が高い(키가 크다)."},{"t":"は"},{"t":"{見|み}えない"},{"t":"のだから"}],"ko":"자기 등은 스스로 볼 수 없는 법이니까","lit":"자기 / 의 / 등 / 은 / 보이지 않는 / 법이니까","g":[{"k":"〜のだから","d":"'~인 법이니까'. 누구나 아는 사실을 이유로 들고, 뒤에 권하는 말이 와요. 見えないのだから → 尋ねるといい."},{"k":"{見|み}える","d":"'보이다'. 見る(보다)는 내가 보는 것, 見える는 저절로 보이는 것이에요. 부정 見えない = 보이지 않는다."}],"c":"2절은 조언하는 말투로 바뀌어요. 背中(등)는 남이 보는 내 뒷모습으로도 읽혀요. 내 모습은 나보다 남이 더 잘 볼 때가 있어요."},{"id":"d2","tk":[{"t":"{恥|は}ずかしがらず","p":"동사","m":"부끄러워하지 말고","b":"{恥|は}ずかしがる","bm":"부끄러워하다","w":"어간 恥는 한자, ずかしがらず는 히라가나예요. 오쿠리가나가 아주 긴 말이에요.","n":"恥ずかしい(부끄럽다) + がる(~해하다) = 恥ずかしがる. 〜ず는 〜ないで(~하지 않고)의 글말이에요."},{"t":"{人|ひと}"},{"t":"に","m":"~에게"},{"t":"{尋|たず}ねる","p":"동사","m":"묻다","w":"어간 尋는 한자, ねる는 히라가나예요.","n":"尋ねる는 聞く(묻다)보다 조금 격식 있는 말이에요. 같은 소리의 訪ねる(たずねる)는 '방문하다'예요."},{"t":"と","m":"~하면"},{"t":"いい"}],"ko":"부끄러워 말고 남에게 물어보면 돼","lit":"부끄러워하지 말고 / 남 / 에게 / 묻다 / 하면 / 좋다","g":[{"k":"〜といい","d":"'~하면 좋아, ~하렴'. 상대에게 부드럽게 권하는 말이에요. 尋ねる + といい = 물어보면 돼. 4행 大事にするといい도 같아요."},{"k":"〜ず","d":"〜ないで(~하지 않고)의 글말이에요. 恥ずかしがる → 恥ずかしがらず."},{"k":"형용사 + がる","d":"'~해하다'. 恥ずかしい → 恥ずかしがる. 寂しい → 寂しがる(쓸쓸해하다)."}],"c":"명령이 아니라 といい로 권해요. 선배나 어른이 곁에서 건네는 조언처럼 들려요."},{"id":"d3","tk":[{"t":"{心|こころ}"},{"t":"は"},{"t":"{誰|だれ}"},{"t":"に","m":"~에게"},{"t":"も"},{"t":"{見|み}えない"},{"t":"のだから"}],"ko":"마음은 누구에게도 보이지 않는 법이니까","lit":"마음 / 은 / 누구 / 에게 / 도 / 보이지 않는 / 법이니까","g":[{"k":"{誰|だれ}にも + 부정","d":"'누구에게도 ~않다'. 誰にも見えない = 누구에게도 보이지 않는다. 誰も来ない(아무도 안 와)."}],"s":"1행 自分の背中は見えないのだから와 같은 틀이에요. 背中가 心로, 自分の가 誰にも로 바뀌었어요.","c":"등은 남이 대신 봐 줄 수 있지만, 마음은 누구도 볼 수 없어요. 그래서 다음 줄에서 더 소중히 하라고 해요."},{"id":"d4","tk":[{"t":"{見|み}える","p":"동사","m":"보이는","w":"어간 見는 한자, える는 히라가나예요."},{"t":"もの","p":"명사","m":"것","w":"物라는 한자가 있지만, 넓게 '것'을 가리킬 때는 히라가나로 써요. 이 곡이 こと는 한자 事로 쓴 것과 대비돼요."},{"t":"よりも","p":"조사","m":"~보다도","n":"より(~보다) + も(~도). 비교를 더 강조해요."},{"t":"{大|だい}{事|じ}に","p":"な형용사","m":"소중히","b":"{大|だい}{事|じ}","bm":"소중함, 중요함","w":"大와 事 모두 온요미로 읽는 한자어예요. 끝의 に는 히라가나예요.","n":"한국어 '대사(大事)'와 한자가 같지만 일본어로는 '소중함'이에요. お大事に는 아픈 사람에게 하는 '몸조리 잘하세요'예요."},{"t":"する","p":"동사","m":"하다","w":"する는 늘 히라가나로 써요."},{"t":"と","m":"~하면"},{"t":"いい"}],"ko":"보이는 것보다 더 소중히 하렴","lit":"보이는 / 것 / 보다도 / 소중히 / 하다 / 하면 / 좋다","g":[{"k":"な형용사 + に + する","d":"'~하게 하다'. 大事 → 大事にする(소중히 하다). 静かにする(조용히 하다)."},{"k":"〜よりも","d":"'~보다도'. 見えるものよりも = 보이는 것보다도."}],"s":"大事에도 事가 들어 있어요. 이 곡의 형식명사 事는 こと, 大事의 事는 じ로 읽어요. 같은 한자, 다른 읽기예요.","c":"보이는 것은 결과나 기록, 보이지 않는 것은 마음으로도 읽혀요. 대회를 잃은 학생에게 건네는 말로 들리기도 해요."}]},{"label":"2절 · Bメロ","note":"하루하루가 쌓일수록 만날 수 없게 되는 사람도 생긴다고 해요.","lines":[{"id":"e1","tk":[{"t":"{毎|まい}{日|にち}","p":"명사","m":"매일, 하루하루","n":"한국어 '매일(每日)'과 같은 한자어예요. 毎는 每의 일본식 약자예요."},{"t":"が"},{"t":"{重|かさ}なる","p":"동사","m":"겹치는, 쌓이는","w":"어간 重는 한자, なる는 히라가나예요.","n":"重는 읽기가 많아요. おもい(무겁다), かさなる(겹치다), じゅう(重要, 중요)."},{"t":"{事|こと}"},{"t":"で","m":"~으로써"}],"ko":"하루하루가 쌓여 가면서","lit":"매일 / 이 / 겹치는 / 일 / 로써","g":[{"k":"〜{事|こと}で","d":"'~함으로써, ~하면서'. 동사 + ことで로 원인이나 수단을 말해요. 毎日が重なる事で = 날들이 쌓이면서."}],"s":"여기서도 こと를 한자 事로 썼어요. 毎는 한국 한자 每와 모양이 조금 달라요.","c":"날이 쌓인다는 건 자라고 나아간다는 뜻이기도 해요. 그런데 다음 줄은 그 대가로 헤어짐을 말해요."},{"id":"e2","tk":[{"t":"{会|あ}えなく","p":"동사","m":"만날 수 없게","b":"{会|あ}う","bm":"만나다","w":"어간 会는 한자, えなく는 히라가나예요.","n":"会う → 가능형 会える(만날 수 있다) → 会えない(만날 수 없다) → 会えなく(만날 수 없게). 会는 한국어 '회(會)'의 일본식 약자예요."},{"t":"なる","p":"동사","m":"되는","w":"なる는 보통 히라가나로 써요."},{"t":"{人|ひと}","m":"사람"},{"t":"も"},{"t":"{出|で}{来|き}る
