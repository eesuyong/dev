<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0;padding:0}</style>
<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>일본어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 공책 — 데스크톱은 왼쪽 목차(곡·가이드) + 본문, 휴대폰은 상단 바 + 하단 탭. 가사 한 줄 = 노트 카드 한 장.
   색은 UI가 아니라 '문자 종류'에 쓴다: 한자 紅 · 히라가나 藍 · 가타카나 若竹 · 영어 紫. UI 강조는 山吹 하나. */
:root{
  --paper:#F3F4F7; --paper-glass:rgba(243,244,247,.9); --sheet:#FFFFFF; --sheet-2:#F7F8FA;
  --ink:#1A2030; --ink-2:#465066; --ink-3:#737D92; --rule:#E2E5EB; --rule-2:#CBD1DB;
  --accent:#A8640F; --accent-ink:#FFFFFF; --accent-soft:#F6EAD6;
  --kanji:#B0303A; --hira:#24498F; --kata:#17704B; --latin:#6E3F9C;
  --kanji-tint:#FBECEE; --hira-tint:#EAF0FA; --kata-tint:#E6F3EC; --latin-tint:#F2EBF8;
  --scrim:rgba(14,18,28,.42); --shadow:0 12px 40px rgba(20,28,45,.16);
  --font-jp:"IBM Plex Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif; /* 한국어(IBM Plex Sans KR)와 같은 가족이라 한 줄에 섞여도 굵기·높이가 맞아요 */
  --font-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --font-mono:var(--font-ui); /* 숫자·로마자도 본문과 같은 글꼴(고정폭 글꼴은 쓰지 않아요). 자릿수는 tabular-nums로 맞춰요 */
  --lyric:1.55rem; --topbar-h:56px; --gutter:16px; --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12151C; --paper-glass:rgba(18,21,28,.9); --sheet:#1A1F29; --sheet-2:#151922;
    --ink:#E7EAF0; --ink-2:#B3BACA; --ink-3:#8A92A5; --rule:#2A303D; --rule-2:#3A4252;
    --accent:#E2A34A; --accent-ink:#1A1206; --accent-soft:#3A2C17;
    --kanji:#FF8E93; --hira:#93B4F5; --kata:#6FD4A6; --latin:#CDA6F0;
    --kanji-tint:#3A2125; --hira-tint:#1E2A42; --kata-tint:#183329; --latin-tint:#2E2340;
    --scrim:rgba(0,0,0,.6); --shadow:0 12px 40px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#12151C; --paper-glass:rgba(18,21,28,.9); --sheet:#1A1F29; --sheet-2:#151922;
  --ink:#E7EAF0; --ink-2:#B3BACA; --ink-3:#8A92A5; --rule:#2A303D; --rule-2:#3A4252;
  --accent:#E2A34A; --accent-ink:#1A1206; --accent-soft:#3A2C17;
  --kanji:#FF8E93; --hira:#93B4F5; --kata:#6FD4A6; --latin:#CDA6F0;
  --kanji-tint:#3A2125; --hira-tint:#1E2A42; --kata-tint:#183329; --latin-tint:#2E2340;
  --scrim:rgba(0,0,0,.6); --shadow:0 12px 40px rgba(0,0,0,.5);
  color-scheme:dark;
}
:root[data-size="s"]{ --lyric:1.3rem }
:root[data-size="l"]{ --lyric:1.85rem }
:root[data-size="xl"]{ --lyric:2.2rem }

*,*::before,*::after{ box-sizing:border-box }
[hidden]{ display:none !important }
body{ background:var(--paper); color:var(--ink); font:400 1rem/1.65 var(--font-ui); -webkit-text-size-adjust:100% }
button{ font:inherit; color:inherit; background:none; border:0; padding:0; margin:0; cursor:pointer; text-align:inherit }
a{ color:inherit }
h1,h2,h3,h4{ margin:0; text-wrap:balance }
p,ul,ol,dl{ margin:0 }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px }
.jp{ font-family:var(--font-jp) }
.mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums }
.muted{ color:var(--ink-3) }
.grow{ flex:1 }
.eyebrow{ font:600 .74rem/1.3 var(--font-ui); letter-spacing:.06em; color:var(--ink-3) }

/* 문자 색 */
.colorize .s-k,.force-color .s-k{ color:var(--kanji) }
.colorize .s-h,.force-color .s-h{ color:var(--hira) }
.colorize .s-a,.force-color .s-a{ color:var(--kata) }
.colorize .s-l,.force-color .s-l{ color:var(--latin) }
ruby{ ruby-position:over }
rt{ font-family:var(--font-jp); font-size:.5em; font-weight:400; color:var(--ink-3); letter-spacing:0 }
ruby.sp .rb{ text-decoration:underline dashed var(--accent) 1.5px; text-underline-offset:.3em }
ruby.sp rt{ color:var(--accent) }
/* 가사 본문은 후리가나·한글 발음을 꺼도 자리를 비워 둬서, 켜고 끌 때 글자 위치가 움직이지 않아요. */
.no-furi .lyric rt{ visibility:hidden }
.no-furi .chip rt{ display:none }

/* 뼈대 */
.shell{ display:grid; grid-template-columns:minmax(0,1fr); min-height:100vh }
.side{ display:none }
.col{ min-width:0; display:flex; flex-direction:column }
.topbar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; height:var(--topbar-h); display:flex; align-items:center; gap:12px; padding-inline:var(--gutter); background:var(--paper-glass); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); border-bottom:1px solid var(--rule) }
.brand{ display:flex; align-items:baseline; gap:8px }
.brand-ko{ font-weight:700; letter-spacing:-.01em }
.view{ width:100%; max-width:1120px; margin-inline:auto; padding-inline:var(--gutter); padding-block:20px calc(100px + env(safe-area-inset-bottom,0px)); min-width:0 }
.nav-glyph{ display:inline-grid; place-items:center; width:18px; height:18px; font-family:var(--font-jp); font-weight:400; font-size:1rem; line-height:1 }
.nav-glyph.big{ width:22px; height:22px; font-size:1.2rem }
.tabbar{ position:fixed; left:0; right:0; bottom:0; z-index:30; display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); background:var(--sheet); border-top:1px solid var(--rule); padding-bottom:env(safe-area-inset-bottom,0px) }
.tabbar button{ display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 0 7px; font-size:.7rem; color:var(--ink-3); text-align:center }
.tabbar button[aria-current="page"]{ color:var(--ink); font-weight:600 }
.ico{ flex:none; width:36px; height:36px; display:inline-grid; place-items:center; border-radius:8px; color:var(--ink-3) }
.ico:hover{ background:var(--sheet-2); color:var(--ink) }
.hist{ flex:none; display:flex; gap:2px; margin-left:-8px }
.hist .ico{ color:var(--ink-2) }
.hist .ico:disabled{ opacity:.3; cursor:default; background:none; color:var(--ink-3) }
.no-tts [data-a="speak"],.no-tts [data-a="speak-line"],.no-tts [data-tts]{ display:none }
html:not(.can-dl) [data-dl]{ display:none }

@media (min-width:960px){
  :root{ --topbar-h:0px; --gutter:44px }
  .shell{ grid-template-columns:256px minmax(0,1fr) }
  .side{ display:flex; flex-direction:column; gap:26px; position:sticky; top:env(safe-area-inset-top,0px); height:100vh; overflow-y:auto; padding:28px 18px; border-right:1px solid var(--rule); background:var(--sheet) }
  .topbar,.tabbar{ display:none }
  .view{ padding-block:40px 80px }
  .side .hist{ margin:-12px 0 -14px 2px }
}
.side-brand{ display:grid; gap:2px; padding-inline:10px }
.side-brand .brand-ko{ font-size:1.12rem }
.side-nav{ display:grid; gap:2px }
.nav-item{ width:100%; display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; color:var(--ink-2); font-weight:500; font-size:.95rem; text-decoration:none }
.nav-item:hover{ background:var(--sheet-2); color:var(--ink) }
.nav-item[aria-current="page"]{ background:var(--paper); color:var(--ink); font-weight:600 }
.side-h{ padding-inline:10px; margin-bottom:4px }
.song-item .si-t{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.si-tag{ flex:none; font-size:.7rem; color:var(--ink-3); border:1px solid var(--rule); border-radius:999px; padding:1px 7px }
.song-item.soon{ color:var(--ink-3); cursor:default }
.song-item.soon:hover{ background:none; color:var(--ink-3) }
.side-foot{ margin-top:auto; display:grid; gap:6px }
.side-sync{ display:flex; align-items:center; gap:8px; padding-inline:10px; font-size:.76rem; color:var(--ink-3) }
.side-sync::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--rule-2) }
.side-sync[data-on="1"]::before{ background:var(--kata) }

/* 공통 블록 */
.block{ display:grid; gap:16px; padding-block:32px }
.block + .block{ border-top:1px solid var(--rule) }
.block-head{ display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:4px 16px }
.h2{ font-size:1.3rem; font-weight:700; letter-spacing:-.01em }
.page-head{ display:grid; gap:10px; padding-bottom:24px; border-bottom:1px solid var(--rule) }
.page-title{ font-size:clamp(1.8rem,5vw,2.6rem); font-weight:700; letter-spacing:-.02em; line-height:1.2 }
.lede{ max-width:40rem; color:var(--ink-2); font-size:1.03rem }
.empty{ padding:32px 16px; text-align:center; color:var(--ink-3); border:1px dashed var(--rule-2); border-radius:12px; list-style:none }
.tg{ flex:none; display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; border:1px solid var(--rule-2); background:var(--sheet); font-size:.85rem; color:var(--ink-2); white-space:nowrap }
.tg:hover{ border-color:var(--ink-3); color:var(--ink) }
.tg[aria-pressed="true"]{ background:var(--ink); color:var(--paper); border-color:var(--ink) }
.tg.sm{ padding:4px 10px; font-size:.8rem }
.tg-sep{ flex:none; width:1px; height:20px; background:var(--rule-2); margin-inline:2px }
.aside-box{ display:block; padding:14px 16px; border-radius:var(--radius); background:var(--sheet-2); border:1px dashed var(--rule-2); font-size:.93rem; color:var(--ink-2) }
/* 상자 안의 글과 일본어 조각이 한 문단으로 이어지도록 block으로 둬요(grid면 조각마다 줄이 갈라져요). */
.aside-box > .eyebrow{ display:block; margin-bottom:4px }
.aside-box > p + p{ margin-top:6px }
.ref{ font-size:.76rem; color:var(--ink-2); text-decoration:underline; text-underline-offset:2px; text-decoration-color:var(--rule-2) }
.ref:hover{ color:var(--ink); text-decoration-color:currentColor }

/* 홈 */
.hero{ display:grid; gap:18px; padding-block:8px 32px }
.hero-title{ font-weight:700; font-size:clamp(2rem,7.5vw,3.6rem); line-height:1.3; letter-spacing:-.01em }
.legend{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px }
@media (min-width:640px){ .legend{ grid-template-columns:repeat(4,minmax(0,1fr)) } }
.lg{ display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:var(--radius); background:var(--sheet); border:1px solid var(--rule); min-width:0 }
.lg-ch{ flex:none; font-family:var(--font-jp); font-weight:400; font-size:1.9rem; line-height:1; width:1.15em; text-align:center }
.lg-k .lg-ch{ color:var(--kanji) } .lg-h .lg-ch{ color:var(--hira) } .lg-a .lg-ch{ color:var(--kata) } .lg-l .lg-ch{ color:var(--latin) }
.lg b{ display:block; font-size:.95rem }
.lg small{ display:block; color:var(--ink-3); font-size:.78rem; line-height:1.4 }
.resume{ justify-self:start; display:inline-flex; align-items:center; gap:8px; padding:9px 14px; border-radius:999px; background:var(--accent-soft); color:var(--ink); font-size:.9rem; font-weight:500 }
.song-list{ display:grid; gap:22px }
.artist-group{ display:grid; gap:10px }
.artist-h{ display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 10px; font-size:1.02rem; font-weight:700 }
.artist-h .jp{ font-size:.85rem; font-weight:400; color:var(--ink-3) }
.artist-about{ padding:20px; border:1px solid var(--rule); border-radius:12px; background:var(--sheet) }
.side-artist{ padding:8px 10px 2px; font-size:.72rem; font-weight:600; color:var(--ink-3) }
.cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr)); gap:14px }
.song-card{ display:grid; align-content:start; gap:10px; padding:18px; border-radius:12px; background:var(--sheet); border:1px solid var(--rule); text-decoration:none; transition:border-color .15s,transform .15s }
a.song-card:hover{ border-color:var(--rule-2); transform:translateY(-1px) }
.song-card.soon{ background:transparent; border-style:dashed }
.sc-top{ display:flex; justify-content:space-between; align-items:center; gap:8px }
.pill{ font:500 .72rem/1 var(--font-ui); padding:5px 9px; border-radius:999px; background:var(--sheet-2); color:var(--ink-2); border:1px solid var(--rule); white-space:nowrap }
.pill.ready{ background:var(--kata-tint); color:var(--kata); border-color:transparent }
.pill.demo{ background:var(--accent-soft); color:var(--accent); border-color:transparent }
.sc-meta{ font-size:.76rem; color:var(--ink-3); text-align:right }
.sc-title{ font-size:1.45rem; font-weight:700; letter-spacing:-.01em; line-height:1.25; display:flex; align-items:flex-end; min-height:1.8em } /* 후리가나가 있는 제목과 없는 제목의 높이를 맞춰요 */
.sc-sub{ color:var(--ink-2); font-size:.9rem }
.prog{ display:grid; gap:6px }
.prog-bar{ height:6px; border-radius:99px; background:var(--rule); overflow:hidden }
.prog-bar i{ display:block; height:100%; width:0; background:var(--accent); border-radius:inherit; transition:width .3s }
.prog-txt{ display:flex; justify-content:space-between; gap:8px; font:400 .74rem/1.2 var(--font-mono); color:var(--ink-3); font-variant-numeric:tabular-nums }
.steps{ list-style:none; padding:0; display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr)); counter-reset:step }
.steps li{ counter-increment:step; display:grid; align-content:start; gap:6px; padding-top:14px; border-top:2px solid var(--ink) }
.steps li::before{ content:counter(step,decimal-leading-zero); font:500 .8rem var(--font-mono); color:var(--accent) }
.steps b{ font-size:1rem }
.steps p{ font-size:.9rem; color:var(--ink-2) }
.band{ display:grid; gap:28px }
@media (min-width:860px){ .band{ grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) } }
.band-text{ display:grid; align-content:start; gap:14px }
.band-text > p{ color:var(--ink-2) }
.members{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px }
.member{ display:grid; padding:10px 12px; background:var(--sheet); border:1px solid var(--rule); border-radius:8px; min-width:0 }
.member .jp{ font-weight:600; font-size:1.05rem; line-height:1.9 }
.member small{ color:var(--ink-3); font-size:.78rem }
.timeline{ list-style:none; padding:0; display:grid; margin-top:8px }
.timeline li{ display:grid; grid-template-columns:3.2rem minmax(0,1fr); gap:12px; padding:10px 0; border-bottom:1px solid var(--rule) }
.tl-y{ font:500 .85rem/1.6 var(--font-mono); color:var(--accent); font-variant-numeric:tabular-nums }
.tl-t{ font-weight:600 }
.tl-d{ display:block; font-size:.84rem; color:var(--ink-2) }

/* 곡 페이지 */
.song-head{ display:grid; gap:8px; padding-bottom:22px }
.back{ display:inline-flex; align-items:center; gap:4px; font-size:.85rem; color:var(--ink-3); width:max-content; margin-bottom:6px }
.back:hover{ color:var(--ink) }
.song-title{ font-size:clamp(2rem,6vw,3rem); font-weight:700; letter-spacing:-.02em; line-height:1.15 }
.song-sub{ color:var(--ink-2); max-width:40rem }
.song-head .prog{ max-width:420px; margin-top:8px }
.tabs{ display:flex; gap:2px; border-bottom:1px solid var(--rule); overflow-x:auto; scrollbar-width:none; margin-bottom:6px }
.tabs::-webkit-scrollbar{ display:none }
.tab{ flex:none; padding:10px 14px; color:var(--ink-3); font-weight:500; border-bottom:2px solid transparent; margin-bottom:-1px; text-decoration:none }
.tab:hover{ color:var(--ink) }
.tab[aria-selected="true"]{ color:var(--ink); border-color:var(--ink); font-weight:600 }
.tab .cnt{ font:400 .72rem var(--font-mono); color:var(--ink-3); margin-left:5px }
.toolbar{ position:sticky; top:calc(env(safe-area-inset-top,0px) + var(--topbar-h)); z-index:10; display:flex; align-items:center; gap:6px; overflow-x:auto; scrollbar-width:none; margin-inline:calc(-1 * var(--gutter)); padding:10px var(--gutter); background:var(--paper-glass); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px) }
.toolbar::-webkit-scrollbar{ display:none }
.song-layout{ display:grid; gap:32px; padding-top:10px }
.lines-col{ min-width:0; max-width:780px }
.rail{ display:none }
@media (min-width:1240px){
  .song-layout{ grid-template-columns:minmax(0,1fr) 220px }
  .rail{ display:block; position:sticky; top:72px; align-self:start }
  .sec-jump{ display:none }
}
.rail-box{ display:grid; gap:8px; padding-bottom:18px; margin-bottom:18px; border-bottom:1px solid var(--rule) }
.rail-link{ display:flex; justify-content:space-between; gap:8px; padding:3px 0; font-size:.88rem; color:var(--ink-2) }
.rail-link:hover{ color:var(--ink) }
.rail-link .mono{ font-size:.75rem; color:var(--ink-3) }
.legend-inline{ display:none; flex-wrap:wrap; gap:4px 14px; font-size:.78rem; color:var(--ink-3); margin-bottom:14px }
.colorize .legend-inline{ display:flex }
.legend-inline span{ display:inline-flex; align-items:center; gap:6px }
.legend-inline span::before{ content:""; width:.62em; height:.62em; border-radius:2px; background:var(--rule-2) }
.legend-inline .li-k::before{ background:var(--kanji) } .legend-inline .li-h::before{ background:var(--hira) }
.legend-inline .li-a::before{ background:var(--kata) } .legend-inline .li-l::before{ background:var(--latin) }
.legend-inline .li-sp::before{ width:1.1em; height:0; border-radius:0; background:none; border-bottom:1.5px dashed var(--accent) }
.sec-jump{ display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; margin-bottom:16px }
.sec{ display:grid; gap:10px; margin-bottom:30px; scroll-margin-top:calc(var(--topbar-h) + 64px) }
.sec.cont{ margin-top:-12px }
.sec-h{ display:flex; align-items:center; gap:10px; font-size:.8rem; font-weight:600; letter-spacing:.04em; color:var(--ink-3); padding-block:4px }
.sec-h::after{ content:""; flex:1; height:1px; background:var(--rule) }
.sec-note{ font-size:.9rem; color:var(--ink-2) }
.line-list{ list-style:none; padding:0; display:grid; gap:10px }
.line{ background:var(--sheet); border:1px solid var(--rule); border-radius:var(--radius); scroll-margin-top:calc(var(--topbar-h) + 72px) }
.line.open{ border-color:var(--rule-2) }
.line.flash{ animation:flash 1.6s ease-out }
@keyframes flash{ 0%,30%{ box-shadow:0 0 0 3px var(--accent) } 100%{ box-shadow:0 0 0 0 transparent } }
.line-head{ display:flex; align-items:center; gap:4px; padding:8px 10px 0 16px }
.ln{ font:500 .75rem var(--font-mono); color:var(--ink-3); font-variant-numeric:tabular-nums }
.line.done .ln{ color:var(--accent) }
.check{ flex:none; width:30px; height:30px; display:inline-grid; place-items:center; border-radius:50%; border:1.5px solid var(--rule-2); color:transparent; margin-left:4px }
.check:hover{ border-color:var(--accent); color:var(--accent) }
.check[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink) }
.lyric{ font-family:var(--font-jp); font-weight:400; font-size:var(--lyric); line-height:2.1; padding:0 16px; line-break:strict; overflow-wrap:anywhere }
.tok{ cursor:pointer; border-radius:4px; transition:background-color .12s }
.tok:hover{ background:var(--sheet-2) }
.tok.punct{ cursor:default }
.tok.punct:hover{ background:none }
.tok.sel{ background:var(--accent-soft) }
.gaps .lyric .tok:not(.punct){ margin-inline:.08em }
.gaps .lyric .tok:not(.punct) > .tok-jp{ box-shadow:inset 0 -2px 0 var(--rule-2) }
.kr-map{ line-height:1.2 }
.kr-map .tok-jp{ line-height:2.1 }

.chip-m{ font-size:.72rem; color:var(--ink-3); max-width:8.5em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.tokpanel{ display:grid; gap:12px; margin-top:10px; padding:12px 14px 14px; background:var(--sheet-2); border:1px solid var(--rule); border-radius:10px }

.notes-layout{ display:grid; gap:16px; max-width:780px; padding-top:16px }

.vcount{ font:400 .78rem var(--font-mono); color:var(--ink-3); padding-bottom:8px; font-variant-numeric:tabular-nums }

.v-mean{ font-size:.96rem }
.v-chev{ display:inline-grid; color:var(--ink-3); transition:transform .2s }
.vrow.open .v-chev{ transform:rotate(180deg) }
.v-act{ display:flex; align-items:center; gap:2px }
.vtools-r{ display:inline-flex; flex-wrap:wrap; align-items:center; gap:10px }
.seg-label{ align-self:center; min-width:2.6rem; font-size:.74rem; font-weight:600; letter-spacing:.04em; color:var(--ink-3) }
.tg .cnt{ font:400 .7rem var(--font-mono); opacity:.7 }
.lv{ display:inline-block; padding:0 6px; border:1px solid var(--ink-3); border-radius:4px; font:600 .7rem/1.5 var(--font-mono); color:var(--ink); background:var(--sheet); white-space:nowrap; font-variant-numeric:tabular-nums }

.wd-block{ display:grid; gap:8px; min-width:0 }
.wd-block .d-label{ margin-bottom:0 }
.ctx{ display:grid; gap:2px; padding:10px 12px; border-radius:8px; background:var(--sheet-2) }

.wex{ display:grid; gap:0 }

.forms{ display:grid; grid-template-columns:repeat(auto-fill,minmax(8.6rem,1fr)); gap:6px }

.rels{ display:flex; flex-wrap:wrap; gap:6px }

.tp-more{ border-top:1px dashed var(--rule-2); padding-top:10px }
.tp-more summary{ cursor:pointer; font-size:.84rem; font-weight:600; color:var(--ink-2) }

/* 가이드 */
.toc{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px }

/* 히라가나·가타카나 */
.hero-links{ display:flex; flex-wrap:wrap; gap:8px }

@media (min-width:1000px){
  .kana-wrap{ grid-template-columns:minmax(0,1fr) 300px; align-items:start }

}
.k-sub{ font-size:1.05rem; font-weight:700; margin-top:12px; scroll-margin-top:calc(var(--topbar-h) + 12px) }
.k-p{ color:var(--ink-2); font-size:.94rem }
.terms{ display:grid; gap:8px; grid-template-columns:repeat(auto-fill,minmax(min(100%,20rem),1fr)) }

.k-jp{ margin-left:6px; font-size:.82rem; font-weight:400; color:var(--ink-3) }
.kgrid{ display:grid; grid-template-columns:2.6rem repeat(var(--cols,5),minmax(0,1fr)); gap:4px; max-width:560px }
.kg-head{ text-align:center; font:500 .72rem var(--font-mono); color:var(--ink-3); padding-bottom:2px }
.kg-row{ align-self:center; font-family:var(--font-jp); font-size:.82rem; font-weight:600; color:var(--ink-3); text-align:center }
.kcell{ display:grid; justify-items:center; gap:0; padding:5px 2px 4px; min-width:0; border:1px solid var(--rule); border-radius:8px; background:var(--sheet); text-align:center }

.kc-chars{ display:flex; align-items:baseline; justify-content:center; gap:3px; font-family:var(--font-jp); font-weight:400; line-height:1.25 }
.kh{ font-size:1.45rem; color:var(--hira) }
.kk{ font-size:1rem; color:var(--kata) }
.kmode-h .kk,.kmode-k .kh{ display:none }
.kmode-k .kk{ font-size:1.45rem }
.kcell small{ font:400 .66rem var(--font-mono); color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100% }
.kdetail{ display:grid; gap:12px; padding:16px; background:var(--sheet); border:1px solid var(--rule-2); border-radius:12px; max-width:560px }

.kd-one{ display:grid; justify-items:center; gap:2px; padding:10px 6px; border-radius:10px }

.kd-one.a{ background:var(--kata-tint) }
.kd-label{ font-size:.72rem; font-weight:600; color:var(--ink-3) }
.kd-big{ font-family:var(--font-jp); font-weight:400; font-size:3rem; line-height:1.25 }
.kd-one.h .kd-big{ color:var(--hira) }
.kd-one.a .kd-big{ color:var(--kata) }
.kd-src{ font-size:.78rem; color:var(--ink-2); text-align:center }
.kd-src .jp{ font-size:1.15rem; font-weight:600; color:var(--kanji) }
.kd-read{ display:flex; align-items:center; gap:10px; font-size:1rem }
.kd-ro{ font:500 1rem var(--font-mono) }
.ext-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,10.5rem),1fr)); grid-auto-rows:1fr; gap:8px }

.ext-w{ font-size:.85rem; color:var(--ink-2) }

.conf-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,15rem),1fr)); gap:8px }

.quiz{ display:grid; gap:12px; max-width:560px }

.hint{ font-size:.8rem; color:var(--ink-3) }
.sync{ font-size:.86rem; color:var(--ink-2); padding:12px 14px; border-radius:10px; background:var(--sheet-2) }
.danger{ justify-self:start; padding:8px 12px; border-radius:8px; border:1px solid var(--rule-2); color:var(--kanji); font-size:.85rem }
.danger.armed{ background:var(--kanji); border-color:var(--kanji); color:var(--sheet) }
.dl-btn{ justify-self:start; padding:8px 12px; border-radius:8px; border:1px solid var(--rule-2); color:var(--ink); font-size:.85rem; font-weight:500 }
.dl-btn:disabled{ opacity:.55 }
.tg:disabled{ opacity:.45; cursor:default }
.mode-tg{ flex-wrap:nowrap; gap:4px }
.lang-back{ padding-inline:10px; font-size:.8rem; color:var(--ink-3) }
.lang-back:hover{ color:var(--ink) }
.side .mode-tg{ padding-inline:10px }
.food-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,13.5rem),1fr)); gap:8px }
.food{ display:grid; align-content:start; gap:3px; padding:10px 12px 12px; border:1px solid var(--rule); border-radius:var(--radius); background:var(--sheet) }
.food-top{ display:flex; align-items:center; justify-content:space-between; gap:6px }
.food-jp{ font-family:var(--font-jp); font-weight:400; font-size:1.35rem; line-height:1.9 }
.food-hg{ font-size:.8rem; color:var(--ink-3) }
.food-m{ font-size:.95rem; font-weight:600 }
.food-n{ font-size:.82rem; color:var(--ink-2) }
.food-talk{ display:grid; gap:8px }
.food-who{ flex:none; padding:1px 7px; border-radius:5px; font-size:.72rem; font-weight:600; color:var(--ink-2); background:var(--sheet-2); border:1px solid var(--rule) }
.toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(78px + env(safe-area-inset-bottom,0px)); z-index:60; max-width:calc(100vw - 32px); padding:9px 16px; border-radius:999px; background:var(--ink); color:var(--paper); font-size:.86rem; box-shadow:var(--shadow); text-align:center }

@media (prefers-reduced-motion:reduce){ *,*::before,*::after{ transition:none!important; animation:none!important; scroll-behavior:auto!important } }

몇 분 / 입니까 / 까","g":[{"k":"て형 = 수단","d":"'~해서'로 수단을 나타내요. 歩いて行く(걸어서 가다), 走って帰る(뛰어서 돌아가다)."}],"s":"何分은 ん 뒤라서 ふん이 ぷん으로 바뀌어 '남푼'이에요."},{"id":"f4","who":"나","tk":[{"t":"この"},{"t":"{地図|ちず}"},{"t":"の"},{"t":"どこ"},{"t":"です"},{"t":"か"}],"ko":"이 지도에서 어디예요?","lit":"이 / 지도 / 의 / 어디 / 입니까 / 까","g":[{"k":"〜のどこ","d":"'~의 어디'. この地図のどこですか = 이 지도의 어디예요? 한국어로는 '이 지도에서 어디예요?'가 자연스러워요."}],"c":"휴대폰 지도를 보여 주며 이렇게 물으면 손가락으로 짚어 줘요.","grp":"map"},{"id":"f6","who":"상대","tk":[{"t":"{二|ふた}つ{目|め}","p":"명사","m":"두 번째","w":"二つ(ふたつ, 두 개) + 目(め, ~째). 숫자 뒤의 目는 '~번째'예요.","n":"一つ目(ひとつめ, 첫 번째), 三つ目(みっつめ, 세 번째)."},{"t":"の"},{"t":"{角|かど}","p":"명사","m":"모퉁이","n":"角(뿔 각). 길에서는 '모퉁이'라는 뜻이에요."},{"t":"を"},{"t":"{左|ひだり}","p":"명사","m":"왼쪽"},{"t":"に"},{"t":"{曲|ま}がって","p":"동사","m":"돌아","b":"{曲|ま}がる","bm":"구부러지다, (길을) 돌다","w":"어간 曲는 한자, がって는 히라가나예요.","n":"曲(굽을 곡). 曲がる = 꺾어 돌다. 左に曲がる = 왼쪽으로 돌다."},{"t":"ください"}],"ko":"두 번째 모퉁이에서 왼쪽으로 도세요","lit":"두 번째 / 의 / 모퉁이 / 를 / 왼쪽 / 으로 / 돌아 / 주세요","g":[{"k":"〜を{曲|ま}がる","d":"'~를 돌다'. 지나가는 장소에는 を를 써요. 角を曲がる(모퉁이를 돌다), 道を渡る(길을 건너다)."}],"s":"二つ目의 目는 '눈'이 아니라 '~번째'라는 뜻이에요. 같은 한자도 붙는 자리에 따라 뜻이 달라져요.","grp":"map"}]},{"label":"긴급 상황","note":"일본의 긴급 전화는 경찰 110, 구급차·소방 119예요.","lines":[{"id":"g1","who":"나","tk":[{"t":"{助|たす}けて","p":"동사","m":"도와","b":"{助|たす}ける","bm":"돕다, 구하다","w":"어간 助는 한자, けて는 히라가나예요.","n":"助(도울 조). 한국어 '조수(助手)'의 助예요."},{"t":"ください"}],"ko":"도와주세요","lit":"도와 / 주세요","g":[{"k":"て형 + ください","d":"'~해 주세요'. 급할 때는 助けて!만 크게 외쳐도 돼요."}],"c":"위급할 때는 ください를 빼고 助けて!(도와줘!)라고 외치는 게 더 빨라요."},{"id":"g2","who":"나","tk":[{"t":"{病院|びょういん}","p":"명사","m":"병원","n":"한국어 '병원(病院)'과 같은 한자어예요. 美容院(びよういん, 미용실)과 소리가 비슷하니 조심하세요."},{"t":"は"},{"t":"どこ"},{"t":"です"},{"t":"か"}],"ko":"병원은 어디예요?","lit":"병원 / 은 / 어디 / 입니까 / 까","g":[{"k":"〜はどこですか","d":"공통 표현에 나온 틀이에요. 薬局(やっきょく, 약국)はどこですか."}],"s":"病院(びょういん)과 美容院(びよういん)은 요온 びょ와 び·よ 차이 하나로 뜻이 갈라져요."},{"id":"g3","who":"나","tk":[{"t":"{気分|きぶん}","p":"명사","m":"몸 상태, 기분","n":"気分が悪い = 속이 안 좋다, 몸이 안 좋다. 기분이 나쁠 때가 아니라 몸이 안 좋을 때 써요."},{"t":"が"},{"t":"{悪|わる}い","p":"い형용사","m":"나쁘다","w":"어간 悪는 한자, い는 히라가나예요."},{"t":"です"}],"ko":"몸이 안 좋아요","lit":"기분 / 이 / 나쁘다 / 입니다","g":[{"k":"{気分|きぶん}が{悪|わる}い","d":"'몸이 안 좋다, 속이 안 좋다'. 한국어 '기분이 나쁘다'와 뜻이 달라요."}],"c":"아픈 곳을 말할 때는 頭が痛いです(머리가 아파요), お腹が痛いです(배가 아파요)처럼 써요."},{"id":"g4","who":"나","tk":[{"t":"{財布|さいふ}","p":"명사","m":"지갑","n":"財(재물 재) + 布(베 포). '돈을 넣는 천'이라는 뜻이에요."},{"t":"を"},{"t":"なくしました"}],"ko":"지갑을 잃어버렸어요","lit":"지갑 / 을 / 잃어버렸습니다","g":[{"k":"〜をなくしました","d":"'~를 잃어버렸어요'. 숙소의 鍵をなくしました와 같은 틀이에요."}],"c":"물건을 잃어버리면 역무원이나 근처 파출소(交番, こうばん)에 이 말을 하면 돼요."},{"id":"g5","who":"나","tk":[{"t":"{警察|けいさつ}","p":"명사","m":"경찰","n":"한국어 '경찰(警察)'과 같은 한자어예요."},{"t":"を"},{"t":"{呼|よ}んでください"}],"ko":"경찰을 불러 주세요","lit":"경찰 / 을 / 불러 주세요","g":[{"k":"〜を{呼|よ}んでください","d":"'~를 불러 주세요'. 사람이나 차를 부를 때 써요. タクシーを呼んでください(택시를 불러 주세요)."}],"s":"警察는 한국어와 한자가 같아서 표지판에서 바로 알아볼 수 있어요."},{"id":"g6","who":"나","tk":[{"t":"{救急車|きゅうきゅうしゃ}","p":"명사","m":"구급차","n":"救(구원할 구) + 急(급할 급) + 車(차). 한국어 '구급차'와 같은 한자어예요."},{"t":"を"},{"t":"{呼|よ}んでください"}],"ko":"구급차를 불러 주세요","lit":"구급차 / 를 / 불러 주세요","g":[{"k":"〜を{呼|よ}んでください","d":"앞 줄과 같은 틀이에요. 구급차는 119예요."}],"s":"救急車의 救急(きゅうきゅう)는 요온 きゅ가 두 번 이어져요. '큐-큐-샤'로 읽어요."}]}]},"thesis":{"id":"thesis","title":"{残酷|ざんこく}な{天使|てんし}のテーゼ","artist":"高橋洋子","year":1995,"eyebrow":"高橋洋子 · 1995","sub":"'잔혹한 천사처럼, 소년이여 신화가 되어라.' 아직 자기 운명을 모르는 소년에게 날아오르라고 노래하는 곡. TV 애니메이션 「新世紀エヴァンゲリオン」 주제가.","release":"1995년 10월 25일 · 싱글 『残酷な天使のテーゼ/月の迷宮』","tieIn":"TV 애니메이션 「新世紀エヴァンゲリオン」(1995) 주제가","lyricist":"及川眠子","composer":"佐藤英敏","listen":"https://www.youtube.com/results?search_query=%E9%AB%98%E6%A9%8B%E6%B4%8B%E5%AD%90+%E6%AE%8B%E9%85%B7%E3%81%AA%E5%A4%A9%E4%BD%BF%E3%81%AE%E3%83%86%E3%83%BC%E3%82%BC","intro":"残酷な天使のテーゼ(잔혹한 천사의 테제)는 高橋洋子가 1995년 10월 25일에 낸 싱글로, 같은 해 방송된 TV 애니메이션 「新世紀エヴァンゲリオン」(신세기 에반게리온)의 주제가예요. 작사는 及川眠子, 작곡은 佐藤英敏예요. 지금까지 오래 팔리고 노래방에서도 계속 불리는 곡으로 소개돼요.\n\n화자 '私(나)'는 아직 자기 운명도 모른 채 자신만 바라보는 '당신', 곧 소년을 지켜봐요. 언젠가 그 등에 미래로 날아갈 날개가 있다는 걸 깨닫게 될 거라고 말하고, 창가에서 날아올라 '신화가 되어라'라고 외쳐요. 떠나보내야 하는 쪽의 마음, 그리고 テーゼ·パトス·バイブル 같은 낯선 외래어를 따라 읽어 보세요.","notes":[{"tag":"배경","title":"「新世紀エヴァンゲリオン」의 주제가","body":"이 곡은 1995년 방송된 TV 애니메이션 「新世紀エヴァンゲリオン」(신세기 에반게리온)의 주제가예요. 1995년 10월 25일 「月の迷宮」(달의 미궁)과 함께 싱글로 나왔어요.\n\n高橋洋子는 1997년 극장판 「シト新生」의 주제가 魂のルフラン(영혼의 르프랑)도 불렀어요. 2018년에는 두 곡을 묶은 싱글이 다시 나왔어요. 지금도 오래 팔리고 노래방에서 이어 불리는 애니메이션 노래의 대표곡으로 소개돼요."},{"tag":"표기","title":"宇宙라 쓰고 そら로 읽기","body":"후렴의 [[この{宇宙|そら|*}を{抱|だ}いて]]는 宇宙(보통 うちゅう, 우주)라고 쓰고 そら(하늘)로 읽어요. 노래 가사에서 자주 쓰는 특수 읽기예요.\n\n글자로는 '우주'의 크기를, 소리로는 '하늘'의 친근함을 함께 전하는 방법이에요. Pretender의 運命(さだめ)처럼, 한자와 읽기가 서로 다른 뜻을 덧입혀요."},{"tag":"표현","title":"テーゼ, パトス, バイブル","body":"이 곡에는 일상 회화에서 잘 안 쓰는 외래어가 세 개 나와요. 모두 가타카나로 써요.\n\n[[テーゼ]]는 독일어 These에서 온 말로 '명제, 주장'이에요. 제목 '잔혹한 천사의 테제'는 '잔혹한 천사의 명제'쯤으로 읽혀요. [[パトス]]는 그리스어 pathos에서 온 '격정, 정념'이에요. [[バイブル]]는 영어 Bible에서 온 '성서', 나아가 '무언가의 길잡이가 되는 책'이에요.\n\n철학과 종교에서 가져온 말들이라 노래 전체에 무겁고 신비로운 분위기를 입혀요."},{"tag":"표기","title":"蒼い, 逢えた, 羽根: 일부러 고른 한자","body":"보통 쓰는 한자 대신 다른 한자를 고른 곳이 있어요.\n\n[[{蒼|あお}い]]: 보통은 青い인데, 蒼는 짙고 깊은 푸른빛이에요. 조요칸지 밖의 한자예요. [[{逢|あ}えた]]: 보통은 会えた인데, 逢는 '인연으로 만나다'라는 느낌을 줘요. 이것도 조요칸지 밖이에요. [[{羽根|はね}]]: 羽만 써도 되지만 羽根로 써서 하나하나의 깃털이 떠올라요.\n\n같은 소리라도 어떤 한자를 고르느냐에 따라 장면의 색이 달라져요."},{"tag":"표기","title":"히라가나로 푼 동사들","body":"이 곡에는 한자로 쓸 수 있는데 히라가나로 푼 말이 많아요. [[ふれる]](触れる), [[もとめる]](求める), [[めざす]](目指す), [[ほとばしる]](迸る), [[はじまる]](始まる), [[つむぎ]](紡ぎ), [[つくる]](作る), [[かたち]](形)예요.\n\n迸·紡처럼 어려운 한자를 피한 것도 있지만, 始まる·作る처럼 쉬운 한자도 풀어 썼어요. 한자가 적어지면 글자가 부드러워 보이고, 화자의 목소리가 조용하게 들리는 효과가 있어요."},{"tag":"표현","title":"'나'와 '소년': 떠나보내는 쪽의 노래","body":"화자는 '私(나)'이고, 노래를 듣는 상대는 '당신', 곧 '소년'이에요. 揺りかご(요람), 女神なんてなれないまま(여신은 되지 못한 채) 같은 말 때문에, 소년을 지켜보다가 떠나보내는 어른, 또는 어머니 같은 시선으로 읽는 해석이 많아요.\n\n그래서 '날아올라라', '신화가 되어라'는 응원이면서 동시에 이별의 말로도 들려요. 제목의 '잔혹함'도 그 이별과 겹쳐 읽을 수 있어요."}],"dict":{"{残酷|ざんこく}な":{"p":"な형용사","m":"잔혹한","b":"{残酷|ざんこく}","bm":"잔혹함","w":"残酷는 한자, な는 히라가나예요.","n":"한국어 '잔혹(殘酷)'과 같은 한자어예요. 残는 殘의 일본식 약자예요."},"{天使|てんし}":{"p":"명사","m":"천사","n":"한국어 '천사(天使)'와 같은 한자어예요."},"{少年|しょうねん}":{"p":"명사","m":"소년","n":"한국어 '소년(少年)'과 같은 한자어예요. 少를 しょう로 길게 읽어요."},"{神話|しんわ}":{"p":"명사","m":"신화","n":"한국어 '신화(神話)'와 같은 한자어예요."},"なれ":{"p":"동사","m":"되어라","b":"なる","bm":"되다","w":"なる는 보통 히라가나로 써요.","n":"なる의 명령형이 なれ예요. 5단 동사는 끝을 え단으로 바꾸면 명령형이 돼요."},"テーゼ":{"p":"명사","m":"테제, 명제","w":"독일어 These에서 온 외래어라 가타카나로 써요. ー는 장음 표시예요.","n":"철학에서 '주장, 명제'를 뜻하는 말이에요. 반대 주장은 アンチテーゼ(안티테제)예요."},"{私|わたし}":{"p":"대명사","m":"나","w":"1인칭 대명사로 한자로 쓰는 게 일반적이에요.","n":"私는 남녀 모두 쓰는 정중한 '나'예요. 이 곡에서는 소년을 지켜보는 화자예요."},"あなた":{"p":"대명사","m":"당신","w":"貴方라는 한자가 있지만 보통 히라가나로 써요."},"{夢|ゆめ}":{"p":"명사","m":"꿈","n":"한국어 '몽(夢)'과 같은 한자예요."},"{愛|あい}":{"p":"명사","m":"사랑","n":"한국어 '애(愛)'와 같은 한자예요."},"は":{"p":"조사","m":"~은/는 (주제)","n":"조사로 쓸 때는 ha가 아니라 wa로 읽어요."},"の":{"p":"조사","m":"~의"},"が":{"p":"조사","m":"~이/가"},"を":{"p":"조사","m":"~을/를","n":"현대 일본어에서 を는 이 조사에만 쓰는 글자예요. 발음은 お(o)와 같아요."},"に":{"p":"조사","m":"~에, ~에게"},"で":{"p":"조사","m":"~로 (수단)"},"も":{"p":"조사","m":"~도"},"よ":{"p":"조사","m":"~여, ~아 (부르는 말)","n":"명사 뒤에 붙여 무언가를 부를 때 써요. 少年よ = 소년이여."},"から":{"p":"조사","m":"~에서, ~부터"},"だけ":{"p":"조사","m":"~만, ~뿐"}},"sections":[{"label":"イントロ · 도입","note":"곡은 후렴의 마지막 말부터 꺼내며 시작해요. 잔혹한 천사처럼, 소년이여 신화가 되어라.","lines":[{"id":"a1","tk":[{"t":"{残酷|ざんこく}な"},{"t":"{天使|てんし}"},{"t":"の"},{"t":"ように","p":"조동사","m":"~처럼","w":"ように는 보통 히라가나로 써요."},{"t":"　"},{"t":"{少年|しょうねん}"},{"t":"よ"},{"t":"{神話|しんわ}"},{"t":"に"},{"t":"なれ"}],"ko":"잔혹한 천사처럼, 소년이여 신화가 되어라","lit":"잔혹한 / 천사 / 의 / 처럼 / 소년 / 이여 / 신화 / 가 / 되어라","g":[{"k":"명사 + のように","d":"'~처럼'. 天使のように = 천사처럼."},{"k":"명사 + よ + 명령형","d":"'~여, ~하라'. 부르고 명령해요. 少年よ神話になれ = 소년이여 신화가 되어라. 紅蓮華의 紅蓮の華よ咲き誇れ와 같은 틀이에요."},{"k":"〜になる","d":"'~가 되다'. 되는 대상에는 に를 붙여요. 神話になる → 명령형 神話になれ."}],"s":"残酷·天使·少年·神話, 한국어와 같은 한자어가 네 개나 나와요. 한자음으로 읽으면 뜻이 바로 보여요.","c":"후렴의 마지막 말을 곡 맨 앞에 먼저 놓았어요. 잔혹한 천사처럼 날아올라 신화가 되라는, 곡 전체의 결론부터 들려주는 셈이에요."}]},{"label":"1절 · Aメロ","note":"바람이 가슴의 문을 두드려도, 소년은 아직 운명도 모른 채 '나'만 바라보며 미소 지어요.","lines":[{"id":"b1","tk":[{"t":"{蒼|あお}い","p":"い형용사","m":"푸른, 짙푸른","b":"{蒼|あお}い","bm":"푸르다","w":"보통은 青い로 쓰는데, 짙고 깊은 푸른빛의 蒼를 골랐어요. 蒼는 조요칸지 밖의 한자예요.","n":"蒼(푸를 창)은 한국어 '창공(蒼空)'의 蒼이에요."},{"t":"{風|かぜ}","p":"명사","m":"바람"},{"t":"が"},{"t":"いま","p":"명사","m":"지금","b":"{今|いま}","bm":"지금","w":"今라는 한자를 두고 히라가나로 풀었어요."},{"t":"　"},{"t":"{胸|むね}","p":"명사","m":"가슴","n":"한국어 '흉(胸)'과 같은 한자예요."},{"t":"の"},{"t":"ドア","p":"명사","m":"문","w":"영어 door에서 온 외래어라 가타카나로 써요."},{"t":"を"},{"t":"{叩|たた}いても","p":"동사","m":"두드려도","b":"{叩|たた}く","bm":"두드리다, 때리다","w":"叩는 조요칸지 밖의 한자예요. 신문에서는 たたく로 풀어 써요.","n":"く로 끝나는 동사의 て형은 いて예요. 叩く → 叩いて → 叩いても(두드려도)."}],"ko":"푸른 바람이 지금 가슴의 문을 두드려도","lit":"푸른 / 바람 / 이 / 지금 / 가슴 / 의 / 문 / 을 / 두드려도","g":[{"k":"〜ても","d":"'~해도'. て형 + も. 叩く → 叩いても. 다음 줄의 '그래도 나만 보는 당신'으로 이어져요."}],"s":"蒼·叩 두 글자가 조요칸지 밖이에요. 今를 히라가나 いま로 풀고, 가슴의 '문'은 외래어 ドア로 썼어요. 한자, 히라가나, 가타카나가 한 줄에 다 섞여 있어요.","c":"푸른 바람은 바깥 세상이나 새로운 운명이 부르는 소리로 읽혀요. 그래도 소년은 아직 그 부름을 듣지 않아요."},{"id":"b2","tk":[{"t":"{私|わたし}"},{"t":"だけ"},{"t":"を"},{"t":"ただ","p":"부사","m":"그저","w":"只라는 한자가 있지만 보통 히라가나로 써요."},{"t":"{見|み}つめて","p":"동사","m":"바라보며","b":"{見|み}つめる","bm":"바라보다, 응시하다","w":"見는 한자, つめて는 히라가나예요.","n":"見る(보다) + 詰める(채우다)에서 온 말로, 눈을 떼지 않고 바라보는 거예요."},{"t":"{微笑|ほほえ}んでる","p":"동사","m":"미소 짓고 있는","b":"{微笑|ほほえ}む","bm":"미소 짓다","w":"微笑를 묶어 ほほえ로 읽는 주쿠지쿤 같은 읽기예요. んでる는 히라가나예요.","n":"微笑를 びしょう로 읽으면 명사 '미소'예요. 〜でる는 〜でいる의 회화체예요."},{"t":"あなた"}],"ko":"나만을 그저 바라보며 미소 짓는 당신","lit":"나 / 만 / 을 / 그저 / 바라보며 / 미소 짓고 있는 / 당신","g":[{"k":"〜だけを","d":"'~만을'. 私だけを見つめる = 나만 바라보다."},{"k":"동사 + 명사","d":"微笑んでるあなた = 미소 짓고 있는 당신. 동사가 그대로 뒤의 명사를 꾸며요."}],"s":"微笑む는 두 글자에 ほほえ라는 읽기를 통째로 달아요. 같은 한자를 음으로 읽은 微笑(びしょう)는 한국어 '미소'와 같아요.","c":"'당신'은 화자만 바라보는 아직 어린 존재예요. 앞 줄의 바깥 바람과 대비돼요."},{"id":"b3","tk":[{"t":"そっと","p":"부사","m":"살며시","w":"의태어 계열의 부사라 히라가나로 써요."},{"t":"ふれる","p":"동사","m":"닿는","b":"{触|ふ}れる","bm":"닿다, 만지다","w":"触れる라는 한자가 있지만 히라가나로 풀었어요."},{"t":"もの","p":"형식명사","m":"것","w":"형식명사로 쓰는 もの는 보통 히라가나로 써요."},{"t":"　"},{"t":"もとめる","p":"동사","m":"찾는, 구하는","b":"{求|もと}める","bm":"구하다, 바라다","w":"求める라는 한자가 있지만 히라가나로 풀었어요."},{"t":"こと","p":"형식명사","m":"것, 일","w":"형식명사 こと는 보통 히라가나로 써요."},{"t":"に"},{"t":"{夢中|むちゅう}","p":"명사","m":"열중함, 푹 빠짐","n":"夢(꿈) + 中(가운데). 꿈속에 있는 것처럼 정신없이 빠져 있다는 뜻이에요."},{"t":"で","p":"조동사","m":"~이고, ~여서"}],"ko":"살며시 닿는 것을 찾는 데 정신이 팔려서","lit":"살며시 / 닿는 / 것 / 찾는 / 일 / 에 / 열중 / 이고","g":[{"k":"〜に{夢中|むちゅう}","d":"'~에 푹 빠져 있다'. ゲームに夢中だ = 게임에 빠져 있다."},{"k":"동사 + こと","d":"동사 뒤에 こと를 붙이면 '~하는 것'이라는 명사가 돼요. もとめること = 구하는 것."}],"s":"ふれる·もとめる 두 동사를 모두 히라가나로 풀었어요. 한자가 夢中뿐이라 줄 전체가 부드럽게 보여요.","c":"살며시 닿는 것, 곧 따뜻함이나 위로를 찾는 데만 빠져 있는 어린 마음으로 읽혀요."},{"id":"b4","tk":[{"t":"{運命|うんめい}","p":"명사","m":"운명","n":"한국어 '운명(運命)'과 같은 한자어예요. Pretender와 紅蓮華에도 나온 말이에요."},{"t":"さえ","p":"조사","m":"~조차"},{"t":"まだ","p":"부사","m":"아직"},{"t":"{知|し}らない","p":"동사","m":"모르는","b":"{知|し}る","bm":"알다","w":"어간 知는 한자, らない는 히라가나예요.","n":"知る는 る로 끝나지만 5단 동사예요. 그래서 부정형이 知らない가 돼요."},{"t":"　"},{"t":"いたいけな","p":"な형용사","m":"애처로울 만큼 어린, 가련한","b":"いたいけ","bm":"가련함, 어림","w":"한자 표기가 거의 쓰이지 않는 말이라 히라가나로 써요."},{"t":"{瞳|ひとみ}","p":"명사","m":"눈동자","n":"目(눈)보다 시적인 말이에요. 瞳(눈동자 동)은 한국어 '동공(瞳孔)'의 瞳이에요."}],"ko":"운명조차 아직 모르는, 가련한 눈동자","lit":"운명 / 조차 / 아직 / 모르는 / 가련한 / 눈동자","g":[{"k":"〜さえ","d":"'~조차, ~마저'. 가장 기본적인 것도 그렇다는 강조예요. 運命さえ知らない = 운명조차 모른다."}],"s":"いたいけ는 거의 히라가나로만 쓰는 말이에요. 눈을 目가 아니라 瞳로 써서 시적인 느낌을 줘요.","c":"いたいけ는 어리고 연약해서 보는 사람이 안쓰러워지는 모습이에요. 자기 앞의 운명도 모르는 소년을 바라보는 화자의 마음이 담겨 있어요."}]},{"label":"1절 · Bメロ","note":"그래도 언젠가 그 등에 아득한 미래로 날아갈 날개가 있다는 걸 깨닫게 될 거라고 말해요.","lines":[{"id":"b5","tk":[{"t":"だけど","p":"접속사","m":"하지만","w":"접속사는 보통 히라가나로 써요."},{"t":"いつか","p":"부사","m":"언젠가","w":"何時か라는 한자가 있지만 보통 히라가나로 써요."},{"t":"{気付|きづ}く","p":"동사","m":"깨닫다","w":"気와 付에 루비를 하나로 달았어요. く는 히라가나예요.","n":"気(기운) + 付く(붙다) = 알아차리다. 気づく로도 써요."},{"t":"でしょう","p":"조동사","m":"~겠지요","n":"だろう의 정중한 말이에요. 앞일을 짐작할 때 써요."},{"t":"　"},{"t":"その","p":"연체사","m":"그","w":"こ·そ·あ·ど 지시어는 히라가나로 써요."},{"t":"{背中|せなか}","p":"명사","m":"등","n":"背(등 배) + 中(가운데). 등 한가운데, 곧 등이에요."},{"t":"に"},{"t":"は"}],"ko":"하지만 언젠가 깨닫겠죠, 그 등에는","lit":"하지만 / 언젠가 / 깨닫다 / 겠지요 / 그 / 등 / 에 / 는","g":[{"k":"〜でしょう","d":"'~겠지요'. 앞일을 짐작하는 정중한 말끝이에요. 気付くでしょう = 깨닫겠지요."},{"k":"には","d":"に(~에) + は(~는) = '~에는'. 그곳을 콕 집어 말해요."}],"c":"문장이 '그 등에는'에서 끊기고 다음 줄로 이어져요. 등에 무엇이 있는지 궁금하게 만들어요."},{"id":"b6","tk":[{"t":"{遥|はる}か","p":"부사","m":"아득히, 멀리","w":"遥는 한자, か는 히라가나예요. 遥는 2010년에 조요칸지에 들어간 한자예요.","n":"遥か彼方 = 아득히 먼 저편."},{"t":"{未来|みらい}","p":"명사","m":"미래","n":"한국어 '미래(未來)'와 같은 한자어예요."},{"t":"めざす","p":"동사","m":"향하는, 목표로 하는","b":"{目指|めざ}す","bm":"목표로 하다","w":"目指す라는 한자가 있지만 히라가나로 풀었어요."},{"t":"ため","p":"형식명사","m":"~하기 위한","w":"為라는 한자가 있지만 형식명사라 보통 히라가나로 써요."},{"t":"の"},{"t":"{羽根|はね}","p":"명사","m":"날개, 깃털","w":"羽만으로도 はね로 읽지만 羽根로 썼어요. 깃털 하나하나가 떠오르는 표기예요."},{"t":"が"},{"t":"ある","p":"동사","m":"있다","w":"ある는 보통 히라가나로 써요."},{"t":"こと","p":"형식명사","m":"것","w":"형식명사 こと는 보통 히라가나로 써요."}],"ko":"아득한 미래를 향하기 위한 날개가 있다는 것을","lit":"아득히 / 미래 / 향하다 / 위한 / 의 / 날개 / 가 / 있다 / 것","g":[{"k":"동사 + ための + 명사","d":"'~하기 위한 ~'. めざすための羽根 = 향하기 위한 날개."},{"k":"〜こと (명사로 끝내기)","d":"'~라는 것'. 앞 줄의 気付くでしょう(깨닫겠지요)의 내용을 こと로 묶어 마무리해요."}],"s":"羽만 써도 되는데 羽根로 쓴 것, 目指す를 히라가나 めざす로 푼 것을 비교해 보세요.","c":"등의 날개는 소년이 언젠가 스스로 날아갈 힘이에요. 화자 곁을 떠나게 될 날을 미리 알고 있는 말로도 읽혀요."}]},{"label":"サビ · 후렴","note":"잔혹한 천사의 테제, 창가에서 날아올라 격정으로 추억마저 저버린다면, 하늘을 품고 빛나는 신화가 되라고 외쳐요.","lines":[{"id":"c1","tk":[{"t":"{残酷|ざんこく}な"},{"t":"{天使|てんし}"},{"t":"の"},{"t":"テーゼ"},{"t":"　"},{"t":"{窓辺|まどべ}","p":"명사","m":"창가","n":"窓(창) + 辺(가). 辺(へ)가 뒤에 붙으며 べ로 흐려지는 렌다쿠예요. 海辺(うみべ, 바닷가)도 같아요."},{"t":"から"},{"t":"やがて","p":"부사","m":"이윽고, 머지않아","w":"부사로 보통 히라가나로 써요."},{"t":"{飛|と}び{立|た}つ","p":"동사","m":"날아오르다","w":"飛와 立에 각각 루비를 달았어요. 사이의 び와 끝의 つ는 히라가나예요.","n":"飛ぶ(날다) + 立つ(서다, 떠나다) = 날아 떠나다."}],"ko":"잔혹한 천사의 테제, 창가에서 이윽고 날아올라","lit":"잔혹한 / 천사 / 의 / 테제 / 창가 / 에서 / 이윽고 / 날아오르다","g":[{"k":"〜から (출발점)","d":"'~에서, ~로부터'. 窓辺から飛び立つ = 창가에서 날아오르다."},{"k":"복합동사","d":"飛び立つ처럼 두 동사를 붙여 한 동사로 써요. 앞 동사는 ます형(飛び)이 돼요."}],"s":"제목 '残酷な天使のテーゼ'가 그대로 후렴 첫머리에 나와요. 외래어 テーゼ는 가타카나, 窓辺는 렌다쿠로 べ가 돼요.","c":"창가는 집 안과 바깥의 경계예요. 1절에서 말한 등의 날개로, 이제 그 경계를 넘어 날아오르는 장면이에요."},{"id":"c2","tk":[{"t":"ほとばしる","p":"동사","m":"용솟음치는, 뿜어 나오는","b":"{迸|ほとばし}る","bm":"세차게 솟구치다","w":"迸る라는 어려운 한자가 있지만 히라가나로 풀었어요."},{"t":"{熱|あつ}い","p":"い형용사","m":"뜨거운","w":"어간 熱은 한자, い는 히라가나예요.","n":"熱い(뜨겁다, 물건·감정)와 暑い(덥다, 날씨)는 소리가 같아요."},{"t":"パトス","p":"명사","m":"파토스, 격정","w":"그리스어 pathos에서 온 외래어라 가타카나로 써요."},{"t":"で"},{"t":"　"},{"t":"{思|おも}い{出|で}","p":"명사","m":"추억","w":"思와 出에 각각 루비를 달았어요. 사이의 い는 히라가나예요.","n":"思う(생각하다) + 出る(나오다) = 떠오르는 것, 추억. 想い出로 쓰기도 해요."},{"t":"を"},{"t":"{裏切|うらぎ}る","p":"동사","m":"저버리다, 배신하다","w":"裏와 切를 묶어 うらぎ로 읽었어요. る는 히라가나예요.","n":"裏(뒤) + 切る(베다). 뒤에서 베다 = 배신하다. 기대를 '뛰어넘다'라는 좋은 뜻으로도 써요."},{"t":"なら","p":"조사","m":"~한다면"}],"ko":"솟구치는 뜨거운 격정으로 추억마저 저버린다면","lit":"솟구치는 / 뜨거운 / 파토스 / 로 / 추억 / 을 / 저버리다 / 면","g":[{"k":"〜で (수단)","d":"'~로'. 熱いパトスで = 뜨거운 격정으로."},{"k":"〜なら","d":"'~한다면'. 앞의 일을 가정하고 뒷말(신화가 되어라)로 이어요."}],"s":"迸る를 히라가나 ほとばしる로 풀고, 외래어 パトス는 가타카나로 썼어요. 思い出는 오쿠리가나 い를 사이에 둔 명사예요.","c":"裏切る는 '배신하다'지만, 여기서는 지난 추억과 어린 시절을 뒤로하고 떠난다는 뜻으로 읽혀요. 떠나보내는 쪽에서는 배신처럼 아픈 일이기도 해요."},{"id":"c3","tk":[{"t":"この","p":"연체사","m":"이","w":"こ·そ·あ·ど 지시어는 히라가나로 써요."},{"t":"{宇宙|そら|*}","p":"명사","m":"하늘 (우주)","b":"{宇宙|うちゅう}","bm":"우주","w":"宇宙는 보통 うちゅう로 읽는데, 여기서는 そら(하늘)로 읽는 특수 읽기예요. 글자로는 우주를, 소리로는 하늘을 함께 전해요.","n":"한국어 '우주(宇宙)'와 같은 한자어예요."},{"t":"を"},{"t":"{抱|だ}いて","p":"동사","m":"품고, 안고","b":"{抱|だ}く","bm":"안다, 품다","w":"어간 抱는 한자, いて는 히라가나예요.","n":"抱く는 だく(안다)와 いだく(마음에 품다) 두 가지로 읽어요. 残響散歌에서도 두 읽기가 나왔어요."},{"t":"{輝|かがや}く","p":"동사","m":"빛나는","w":"어간 輝는 한자, く는 히라가나예요.","n":"輝(빛날 휘)는 한국어 '휘황(輝煌)'의 輝예요."},{"t":"　"},{"t":"{少年|しょうねん}"},{"t":"よ"},{"t":"{神話|しんわ}"},{"t":"に"},{"t":"なれ"}],"ko":"이 하늘을 품고 빛나는 소년이여, 신화가 되어라","lit":"이 / 하늘(우주) / 을 / 품고 / 빛나는 / 소년 / 이여 / 신화 / 가 / 되어라","g":[{"k":"〜て (이어 말하기)","d":"抱く → 抱いて. '품고' 다음 동작 '빛나다'로 이어져요."},{"k":"동사 + 명사","d":"輝く少年 = 빛나는 소년. 동사가 그대로 명사를 꾸며요."}],"s":"宇宙라고 쓰고 そら로 읽는 특수 읽기가 이 곡의 대표 표기예요. 곡 처음의 少年よ神話になれ가 다시 돌아와요.","c":"하늘, 아니 우주를 품을 만큼 커진 소년에게 '신화가 되어라'라고 외치며 후렴을 맺어요. 곡 첫 줄과 같은 말이라 처음과 끝이 이어져요."}]},{"label":"2절 · Aメロ","note":"잠든 사랑의 요람, 꿈의 사자에게 불려 가는 아침, 달빛 비친 목덜미. 화자는 세상의 시간을 멈춰 소년을 가둬 두고 싶어 해요.","lines":[{"id":"d1","tk":[{"t":"ずっと","p":"부사","m":"계속, 줄곧","w":"부사로 보통 히라가나로 써요."},{"t":"{眠|ねむ}ってる","p":"동사","m":"잠들어 있는","b":"{眠|ねむ}る","bm":"잠자다","w":"어간 眠는 한자, ってる는 히라가나예요.","n":"眠る는 る로 끝나지만 5단 동사예요. 〜てる는 〜ている의 회화체예요."},{"t":"　"},{"t":"{私|わたし}"},{"t":"の"},{"t":"{愛|あい}"},{"t":"の"},{"t":"{揺|ゆ}りかご","p":"명사","m":"요람","w":"揺(흔들 요)만 한자, りかご는 히라가나예요. 揺り籠로도 쓰는데 籠를 히라가나 かご로 풀었어요.","n":"揺る(흔들다) + 籠(바구니) = 흔드는 바구니, 요람이에요."}],"ko":"줄곧 잠들어 있는, 내 사랑의 요람","lit":"줄곧 / 잠들어 있는 / 나 / 의 / 사랑 / 의 / 요람","g":[{"k":"AのBのC","d":"の를 여러 번 이어 '~의 ~의'. 私の愛の揺りかご = 내 사랑의 요람."}],"s":"揺り籠의 籠를 히라가나 かご로 풀어 썼어요. 한자가 줄어 요람처럼 부드러운 글자 모양이 돼요.","c":"요람 속에서 잠든 아이를 보는 듯한 장면이에요. 화자가 소년을 아이처럼 품어 온 사람이라는 해석과 이어져요."},{"id":"d2","tk":[{"t":"あなた"},{"t":"だけ"},{"t":"が"},{"t":"{夢|ゆめ}"},{"t":"の"},{"t":"{使者|ししゃ}","p":"명사","m":"사자, 심부름꾼","n":"한국어 '사자(使者)'와 같은 한자어예요. 소식이나 명을 전하러 오는 사람이에요."},{"t":"に"},{"t":"{呼|よ}ばれる","p":"동사","m":"불리는","b":"{呼|よ}ぶ","bm":"부르다","w":"어간 呼는 한자, ばれる는 히라가나예요.","n":"呼ぶ → 呼ばれる(불리다, 수동형). 부르는 쪽에는 に를 붙여요."},{"t":"{朝|あさ}","p":"명사","m":"아침"},{"t":"が"},{"t":"くる","p":"동사","m":"온다","b":"{来|く}る","bm":"오다","w":"来る라는 한자가 있지만 히라가나로 풀었어요."}],"ko":"당신만이 꿈의 사자에게 불려 가는 아침이 와","lit":"당신 / 만 / 이 / 꿈 / 의 / 사자 / 에게 / 불리는 / 아침 / 이 / 온다","g":[{"k":"수동형 〜れる","d":"5단 동사는 う단을 あ단으로 바꾸고 れる를 붙여요. 呼ぶ → 呼ばれる. 부르는 쪽(夢の使者)에는 に를 써요."},{"k":"문장이 명사를 꾸미기","d":"あなただけが夢の使者に呼ばれる가 통째로 朝를 꾸며요. '당신만 불려 가는 아침'."}],"s":"来る를 히라가나 くる로 풀었어요. 이 곡은 쉬운 동사도 자주 히라가나로 써요.","c":"'당신만' 불려 간다는 게 핵심이에요. 화자는 함께 갈 수 없고, 소년 혼자 운명에 불려 가는 아침을 예감해요."},{"id":"d3","tk":[{"t":"{細|ほそ}い","p":"い형용사","m":"가느다란","w":"어간 細는 한자, い는 히라가나예요."},{"t":"{首筋|くびすじ}","p":"명사","m":"목덜미","n":"首(목) + 筋(줄기). 筋(すじ)는 근육이나 줄기를 뜻해요."},{"t":"を"},{"t":"　"},{"t":"{月|つき}あかり","p":"명사","m":"달빛","b":"{月明|つきあ}かり","bm":"달빛","w":"月明かり로 쓸 수 있는데 明かり를 히라가나 あかり로 풀었어요."},{"t":"が"},{"t":"{映|うつ}してる","p":"동사","m":"비추고 있어","b":"{映|うつ}す","bm":"비추다","w":"어간 映는 한자, してる는 히라가나예요.","n":"映す(비추다, 타동사)와 映る(비치다, 자동사)는 짝이에요."}],"ko":"가느다란 목덜미를 달빛이 비추고 있어","lit":"가느다란 / 목덜미 / 를 / 달빛 / 이 / 비추고 있다","g":[{"k":"〜てる","d":"〜ている의 회화체예요. 映している → 映してる."}],"s":"月明かり를 月あかり로 반쯤 풀어 썼어요. 한자와 히라가나가 섞인 표기예요.","c":"잠든 소년의 목덜미에 달빛이 내려앉은 장면이에요. 아직 가늘고 여린 모습이라, 앞 줄의 '불려 가는 아침'과 대비돼요."},{"id":"d4","tk":[{"t":"{世界中|せかいじゅう}","p":"명사","m":"온 세상","n":"世界(세계) + 中(じゅう, 온 ~). 〜中를 じゅう로 읽으면 '~ 전체'예요. 一日中 = 하루 종일."},{"t":"の"},{"t":"{時|とき}","p":"명사","m":"시간, 때"},{"t":"を"},{"t":"{止|と}めて","p":"동사","m":"멈추고","b":"{止|と}める","bm":"멈추다, 세우다","w":"어간 止는 한자, めて는 히라가나예요.","n":"止める(멈추게 하다, 타동사)와 止まる(멈추다, 자동사)는 짝이에요."},{"t":"{閉|と}じこめたい","p":"동사","m":"가둬 두고 싶은","b":"{閉|と}じ{込|こ}める","bm":"가두다","w":"閉じ込める의 込를 히라가나 こ로 풀었어요."},{"t":"けど","p":"조사","m":"~지만"}],"ko":"온 세상의 시간을 멈춰 가둬 두고 싶지만","lit":"온 세상 / 의 / 시간 / 을 / 멈추고 / 가둬 두고 싶다 / 지만","g":[{"k":"〜たい","d":"'~하고 싶다'. 閉じこめる → 閉じこめたい."},{"k":"〜けど","d":"'~지만'. 바람을 말하고 바로 그럴 수 없다는 뒷말로 이어요."}],"s":"閉じ込める의 込를 히라가나로 풀었어요. 中를 じゅう로 읽는 世界中도 볼 만해요.","c":"시간을 멈춰서라도 소년을 지금 이대로 곁에 두고 싶은 마음이에요. 하지만 けど로 끝나, 그럴 수 없다는 걸 화자도 알고 있어요."}]},{"label":"2절 · Bメロ","note":"둘이 만난 것에 의미가 있다면, 나는 소년이 자유를 알기 위한 바이블이라고 말해요.","lines":[{"id":"e1","tk":[{"t":"もしも","p":"부사","m":"만약","w":"부사로 보통 히라가나로 써요.","n":"もし에 も를 더해 '만에 하나'처럼 가정을 강하게 해요."},{"t":"ふたり","p":"명사","m":"두 사람","b":"{二人|ふたり}","bm":"두 사람","w":"二人로 쓸 수 있는데 히라가나로 풀었어요. 숫자 느낌을 지우고 '우리 둘'의 따뜻함을 살리는 표기로 읽혀요."},{"t":"{逢|あ}えた","p":"동사","m":"만날 수 있었던","b":"{逢|あ}う","bm":"만나다","w":"보통은 会えた인데, 인연으로 만난다는 느낌의 逢를 골랐어요. 逢는 조요칸지 밖의 한자예요.","n":"逢う → 逢える(만날 수 있다) → 逢えた(만날 수 있었다)."},{"t":"こと","p":"형식명사","m":"것","w":"형식명사 こと는 보통 히라가나로 써요."},{"t":"に"},{"t":"{意味|いみ}","p":"명사","m":"의미","n":"한국어 '의미(意味)'와 같은 한자어예요."},{"t":"が"},{"t":"ある","p":"동사","m":"있다","w":"ある는 보통 히라가나로 써요."},{"t":"なら","p":"조사","m":"~라면"}],"ko":"만약 우리 둘이 만난 것에 의미가 있다면","lit":"만약 / 두 사람 / 만날 수 있었던 / 것 / 에 / 의미 / 가 / 있다 / 라면","g":[{"k":"もしも〜なら","d":"'만약 ~라면'. 가정을 앞뒤로 감싸요."},{"k":"가능형의 과거","d":"逢う → 逢える → 逢えた. '만날 수 있었다', 곧 만나게 된 것을 고맙게 여기는 느낌이에요."}],"s":"会う 대신 逢う를 골랐어요. 둘의 만남을 특별한 인연으로 보는 표기예요. 二人도 ふたり로 풀었어요.","c":"둘이 만난 데에 의미가 있다면, 그 의미는 무엇일까. 다음 줄에서 화자가 스스로 답해요."},{"id":"e2","tk":[{"t":"{私|わたし}"},{"t":"は"},{"t":"そう","p":"부사","m":"그래, 그렇게","w":"こ·そ·あ·ど 계열이라 히라가나로 써요."},{"t":"　"},{"t":"{自由|じゆう}","p":"명사","m":"자유","n":"한국어 '자유(自由)'와 같은 한자어예요."},{"t":"を"},{"t":"{知|し}る","p":"동사","m":"알다","w":"어간 知는 한자, る는 히라가나예요."},{"t":"ため","p":"형식명사","m":"~하기 위한","w":"형식명사라 히라가나로 써요."},{"t":"の"},{"t":"バイブル","p":"명사","m":"바이블, 성서","w":"영어 Bible에서 온 외래어라 가타카나로 써요.","n":"성서라는 뜻에서 나아가 '어떤 일의 길잡이가 되는 책'이라는 뜻으로도 써요. 料理のバイブル = 요리의 바이블."}],"ko":"나는 그래, 자유를 알기 위한 바이블","lit":"나 / 는 / 그래 / 자유 / 를 / 알다 / 위한 / 의 / 바이블","g":[{"k":"동사 + ための + 명사","d":"1절의 めざすための羽根와 같은 틀이에요. 自由を知るためのバイブル = 자유를 알기 위한 바이블."},{"k":"명사로 끝내기","d":"私は〜バイブル(だ)에서 だ를 빼고 명사로 끝냈어요. 말이 짧고 단단해져요."}],"s":"외래어 バイブル는 가타카나예요. 1절의 テーゼ, 후렴의 パトス와 함께 철학·종교에서 온 말이 하나 더 늘었어요.","c":"화자는 자신을 소년이 자유를 배우는 '교과서'라고 말해요. 가르치고 나면 떠나보내야 하는 존재라는 뜻으로도 읽혀요."}]},{"label":"サビ 2 · 두 번째 후렴","note":"잔혹한 천사의 테제, 슬픔이 그리고 시작되고, 끌어안은 생명의 꿈에서 깨어날 때 누구보다 빛나는 신화가 되라고 해요.","lines":[{"id":"f1","tk":[{"t":"{残酷|ざんこく}な"},{"t":"{天使|てんし}"},{"t":"の"},{"t":"テーゼ"},{"t":"　"},{"t":"{悲|かな}しみ","p":"명사","m":"슬픔","b":"{悲|かな}しみ","bm":"슬픔","w":"悲는 한자, しみ는 히라가나예요.","n":"悲しい(슬프다)의 い를 み로 바꾼 명사예요. 紅蓮華의 悲しみよ와 같은 말이에요."},{"t":"が"},{"t":"そして","p":"접속사","m":"그리고","w":"접속사는 보통 히라가나로 써요."},{"t":"はじまる","p":"동사","m":"시작된다","b":"{始|はじ}まる","bm":"시작되다","w":"始まる라는 쉬운 한자를 두고도 히라가나로 풀었어요."}],"ko":"잔혹한 천사의 테제, 슬픔이 그리고 시작돼","lit":"잔혹한 / 천사 / 의 / 테제 / 슬픔 / 이 / 그리고 / 시작된다","g":[{"k":"접속사의 자리","d":"보통은 そして悲しみがはじまる 순서인데, 悲しみが そして はじまる로 접속사를 가운데 끼워 넣었어요. 노래의 박자와 여운을 위한 순서예요."}],"s":"始まる를 히라가나 はじまる로 썼어요. 쉬운 한자도 풀어 쓰는 이 곡의 습관이 잘 보여요.","c":"첫 후렴이 '날아오른다'였다면 두 번째 후렴은 '슬픔이 시작된다'예요. 떠남은 소년에게는 시작, 화자에게는 슬픔의 시작이에요."},{"id":"f2","tk":[{"t":"{抱|だ}きしめた","p":"동사","m":"끌어안은","b":"{抱|だ}きしめる","bm":"꼭 껴안다","w":"抱き締める의 締める를 히라가나 しめる로 풀었어요."},{"t":"{命|いのち}","p":"명사","m":"생명, 목숨","n":"命(목숨 명)은 한국어 '생명(生命)'의 命이에요. 運命의 命과 같은 한자예요."},{"t":"の"},{"t":"かたち","p":"명사","m":"모양, 형태","b":"{形|かたち}","bm":"모양","w":"形이라는 한자가 있지만 히라가나로 풀었어요."},{"t":"　"},{"t":"その","p":"연체사","m":"그"},{"t":"{夢|ゆめ}"},{"t":"に"},{"t":"{目覚|めざ}めた","p":"동사","m":"깨어난","b":"{目覚|めざ}める","bm":"눈을 뜨다, 깨어나다","w":"目와 覚를 묶어 めざ로 읽었어요. めた는 히라가나예요.","n":"目(눈) + 覚める(깨다). 무언가에 '눈뜨다', 깨닫다라는 뜻으로도 써요."},{"t":"とき","p":"명사","m":"때","b":"{時|とき}","bm":"때","w":"時라는 한자가 있지만 여기서는 히라가나로 썼어요. 2절의 時(とき)는 한자였어요."}],"ko":"끌어안은 생명의 형태, 그 꿈에서 눈뜰 때","lit":"끌어안은 / 생명 / 의 / 형태 / 그 / 꿈 / 에 / 눈뜬 / 때","g":[{"k":"〜た{時|とき}","d":"'~했을 때'. 目覚めたとき = 눈떴을 때."},{"k":"〜に{目覚|めざ}める","d":"'~에 눈뜨다, ~를 깨닫다'. その夢に目覚める = 그 꿈에 눈뜨다."}],"s":"같은 とき를 2절에서는 時(한자), 여기서는 とき(히라가나)로 썼어요. かたち도 形 대신 히라가나예요.","c":"끌어안은 생명, 곧 품어 키운 소년이 자기 꿈에 눈뜨는 순간이에요. 그 순간이 다음 줄의 '누구보다 빛나는' 때예요."},{"id":"f3","tk":[{"t":"{誰|だれ}","p":"대명사","m":"누구"},{"t":"より","p":"조사","m":"~보다"},{"t":"も"},{"t":"{光|ひかり}","p":"명사","m":"빛","w":"동사 光る에서 온 명사인데, 오쿠리가나 없이 光 한 글자로 ひかり라고 읽어요."},{"t":"を"},{"t":"{放|はな}つ","p":"동사","m":"내뿜는, 발하는","w":"어간 放는 한자, つ는 히라가나예요.","n":"放(놓을 방)은 한국어 '방출(放出)'의 放이에요."},{"t":"　"},{"t":"{少年|しょうねん}"},{"t":"よ"},{"t":"{神話|しんわ}"},{"t":"に"},{"t":"なれ"}],"ko":"누구보다도 빛을 발하는 소년이여, 신화가 되어라","lit":"누구 / 보다 / 도 / 빛 / 을 / 발하는 / 소년 / 이여 / 신화 / 가 / 되어라","g":[{"k":"{誰|だれ}よりも","d":"'누구보다도'. より(~보다)에 も를 더해 비교를 강하게 해요."}],"s":"첫 후렴의 この宇宙を抱いて輝く 자리를 誰よりも光を放つ로 바꾸고, 끝은 같은 少年よ神話になれ로 맺어요.","c":"후렴마다 소년을 꾸미는 말만 바뀌고 '신화가 되어라'는 그대로예요. 같은 외침이 점점 커지는 구조예요."}]},{"label":"Cメロ · 브리지","note":"사람은 사랑을 엮으며 역사를 만들고, 나는 여신은 되지 못한 채 살아간다고 조용히 털어놓아요.","lines":[{"id":"g1","tk":[{"t":"{人|ひと}","p":"명사","m":"사람"},{"t":"は"},{"t":"{愛|あい}"},{"t":"を"},{"t":"つむぎながら","p":"동사","m":"엮으면서","b":"{紡|つむ}ぐ","bm":"(실을) 잣다, 엮어 내다","w":"紡ぐ라는 한자가 있지만 히라가나로 풀었어요.","n":"紡ぐ는 실을 뽑아 꼬는 것이에요. 言葉を紡ぐ(말을 엮다)처럼 비유로도 자주 써요. 〜ながら = ~하면서."},{"t":"{歴史|れきし}","p":"명사","m":"역사","n":"한국어 '역사(歷史)'와 같은 한자어예요. 歴는 歷의 일본식 모양이에요."},{"t":"を"},{"t":"つくる","p":"동사","m":"만든다","b":"{作|つく}る","bm":"만들다","w":"作る를 히라가나로 풀었어요."}],"ko":"사람은 사랑을 엮으며 역사를 만들어","lit":"사람 / 은 / 사랑 / 을 / 엮으면서 / 역사 / 를 / 만든다","g":[{"k":"〜ながら","d":"'~하면서'. 동사 ます형 + ながら. 紡ぐ → 紡ぎながら → 여기서는 つむぎながら."}],"s":"紡ぐ·作る 두 동사를 모두 히라가나로 풀었어요. 한자는 人·愛·歴史뿐이에요.","c":"사랑이 실처럼 한 올 한 올 이어져 역사가 된다는 비유예요. 화자의 사랑도 소년을 통해 이어진다는 뜻으로 읽혀요."},{"id":"g2","tk":[{"t":"{女神|めがみ}","p":"명사","m":"여신","n":"女(여자) + 神(신). 神이 뒤에 붙으며 かみ → がみ로 흐려지는 렌다쿠예요."},{"t":"なんて","p":"조사","m":"~같은 건","n":"앞의 말을 가볍게 낮추거나 '~따위'라고 할 때 써요."},{"t":"なれない","p":"동사","m":"될 수 없는","b":"なる","bm":"되다","w":"なる는 보통 히라가나로 써요.","n":"なる → なれる(될 수 있다) → なれない(될 수 없다)."},{"t":"まま","p":"명사","m":"~인 채로","w":"まま는 히라가나로 써요."},{"t":"　"},{"t":"{私|わたし}"},{"t":"は"},{"t":"{生|い}きる","p":"동사","m":"살아간다","w":"어간 生는 한자, きる는 히라가나예요.","n":"生은 읽기가 아주 많은 한자예요. 生きる(いきる), 生まれる(うまれる), 生(なま)."}],"ko":"여신 같은 건 되지 못한 채로 나는 살아가","lit":"여신 / 같은 건 / 될 수 없는 / 채로 / 나 / 는 / 살아간다","g":[{"k":"〜まま","d":"'~인 채로'. なれないまま = 될 수 없는 채로."},{"k":"가능형 + ない","d":"なる → なれない. 후렴의 なれ(되어라, 명령형)와 같은 동사예요."}],"s":"女神는 렌다쿠로 めがみ가 돼요. 후렴의 なれ(되어라)와 여기의 なれない(될 수 없다), 같은 동사가 정반대로 쓰였어요.","c":"소년에게는 '신화가 되어라'고 외치면서, 자신은 '여신은 되지 못한 채' 살아간다고 말해요. 소년을 떠나보낸 뒤 평범하게 남는 쪽의 고백으로 읽혀요."}]},{"label":"ラストサビ · 마지막 후렴","note":"첫 후렴을 그대로 되풀이하며, 다시 '소년이여 신화가 되어라'로 끝나요.","lines":[{"id":"h1","same":"c1"},{"id":"h2","same":"c2"},{"id":"h3","same":"c3"}]}]},"hanako":{"id":"hanako","title":"{高嶺|たかね}の{花子|はなこ}さん","artist":"back number","year":2013,"eyebrow":"back number · 2013","sub":"손에 닿지 않는 '너'를 향한 망상과 갈등을 우스우면서도 애달프게 그린 곡. back number를 널리 알린 대표곡이에요.","release":"2013년 6월 26일 · 싱글 · 앨범 『ラブストーリー』, 베스트 앨범 『アンコール』 수록","lyricist":"清水依与吏","composer":"清水依与吏","listen":"https://www.youtube.com/results?search_query=back+number+%E9%AB%98%E5%B6%BA%E3%81%AE%E8%8A%B1%E5%AD%90%E3%81%95%E3%82%93","intro":"高嶺の花子さん은 back number가 2013년 6월 26일에 낸 싱글이에요. 작사·작곡은 清水依与吏예요. 앨범 『ラブストーリー』와 베스트 앨범 『アンコール』에도 실렸어요. 손에 닿지 않는 상대를 향한 망상과 갈등을 우스우면서도 애달프게 그려, 밴드를 널리 알린 대표곡으로 꼽혀요.\n\n화자는 너에게 '친구의 친구'일 뿐인 '나'예요. 여름의 마물, 여름의 마법, 아브라카다브라 같은 말에 기대어 네가 내 앞에 나타나길 바라요. 그러다 금세 '그럴 리 없지' 하고 스스로 꺾어요. 바람과 체념이 한 줄 안에서 오가는 흐름을 따라 읽어 보세요. 사이트의 マリーゴールド처럼 여름이 무대인 곡이에요.","notes":[{"tag":"표현","title":"高嶺の花 + 花子さん","body":"[[{高嶺|たかね}の{花|はな}]]는 '높은 봉우리에 핀 꽃'이에요. 바라볼 수만 있고 손에 넣을 수 없는 사람이나 물건을 말해요. 한국어 '그림의 떡'과 비슷한데, 주로 사람에게 써요. 彼女は高嶺の花だ = 그녀는 넘볼 수 없는 사람이야.\n\n제목은 花 뒤에 子를 붙여 [[{花子|はなこ}]]라는 여자 이름으로 바꾸고, 이름 뒤에 붙이는 さん(~씨)까지 달았어요. 花子는 예전부터 흔한 여자 이름이라 서류 견본에 山田花子처럼 자주 쓰여요. 넘볼 수 없는 '그 사람'을 사람 이름처럼 불러서, 무겁지 않고 우스운 느낌을 준다고 볼 수 있어요."},{"tag":"표현","title":"여름의 마물과 마법","body":"곡에는 마법에 관한 말이 계속 나와요. [[{黒|くろ}{魔|ま}{術|じゅつ}]](흑마술), [[{夏|なつ}の{魔|ま}{物|もの}]](여름의 마물), [[{夏|なつ}の{魔|ま}{法|ほう}]](여름의 마법), 주문 [[アブラカタブラ]]예요. 평범한 방법으로는 안 되니 초자연적인 힘이라도 빌리고 싶다는 마음으로 읽혀요.\n\n여름은 사람을 들뜨게 해서 평소에 못 하던 일을 하게 만든다는 느낌이 있어요. Cメロ에서는 이 마법이 거꾸로 돌아와, 여름의 마법에 들떠 있었던 건 사실 나였다는 무서운 결말을 상상해요. 참고로 일본에는 고교야구를 두고 '甲子園には魔物が棲む'(고시엔에는 마물이 산다)는 말도 널리 알려져 있어요. 宿命의 고시엔과 함께 떠올려 볼 만해요."},{"tag":"표기","title":"違くたって, 살짝 비튼 구어","body":"違う는 동사라 표준형은 [[{違|ちが}っても]]나 [[{違|ちが}ったって]](달라도)예요. 그런데 회화에서는 違う를 い형용사처럼 활용해 [[{違|ちが}くない]], [[{違|ちが}かった]], [[{違|ちが}くて]]라고 말하는 사람이 많아요. [[{違|ちが}くたって]]도 그 흐름이에요.\n\n시험이나 글에서는 틀린 표현으로 보지만, 노래에서는 친구에게 말하듯 편한 말투를 만들어 줘요. 2절의 [[{誰|だれ}を{気|き}になっていたって]]도 표준형은 誰が気になる(누가 신경 쓰이다)라서, 같은 구어 느낌이 나요."},{"tag":"표현","title":"〜とやら, 믿기 반 의심 반","body":"[[{夏|なつ}の{魔|ま}{法|ほう}とやら]]의 とやら는 '~라나 뭐라나', '~인지 뭔지 하는'이라는 뜻이에요. 남에게 들은 말이나 잘 모르는 것을 반쯤 의심하며 가리킬 때 써요.\n\n'여름의 마법' 같은 건 진짜로 믿지 않으면서도, 그런 거라도 있으면 좋겠다는 마음이 이 한 단어에 담긴 것으로 읽혀요. 조금 예스럽고 장난스러운 말투예요."},{"tag":"문화","title":"星のもと, 타고난 별","body":"[[{星|ほし}の{下|もと}に{生|う}まれる]]는 '~한 별 아래 태어나다', 곧 그런 운명을 타고나다라는 관용 표현이에요. 幸せな星の下に生まれた(행복한 별 아래 태어났다)처럼 써요. 下를 した가 아니라 もと로 읽어요.\n\n가사의 生まれた星のもとが違くたって는 '타고난 별이 달라도', 곧 사는 세계나 처지가 달라도라는 뜻으로 읽혀요. 바로 앞 줄의 [[{僕|ぼく}のもとへ]](내 곁으로)에도 もと가 나와요. 같은 소리 もと가 '곁'과 '아래'로 이어져 나와요."},{"tag":"문화","title":"オチ, 이야기의 결말","body":"[[オチ]]는 동사 [[{落|お}ちる]](떨어지다)에서 온 말이에요. 라쿠고(落語, 혼자 앉아 이야기하는 전통 만담)에서 이야기를 맺는 마지막 한마디를 落ち라고 부른 데서 왔다고 널리 알려져 있어요.\n\n지금은 이야기의 결말이나 웃음 포인트를 말해요. オチがない(결말이 없다 = 이야기가 싱겁다)처럼 일상에서 자주 써요. 원래 일본어지만 보통 가타카나 オチ로 써서 '그 말' 한 단어로 또렷하게 보여 줘요."},{"tag":"표기","title":"풀어 쓴 히라가나와 고른 한자","body":"이 곡은 한자로 쓸 수 있는 말을 자주 히라가나로 풀었어요. [[むけられた]](向けられた), [[となり]](隣), [[なでられ]](撫でられ), [[とき]](時), [[{何|なに}ひとつ]](何一つ), [[とこ]](所)예요. 말하듯 부드러운 느낌이 나요.\n\n반대로 [[{惚|ほ}れる]]의 惚는 조요칸지(常用漢字, 일상에서 쓰는 기준 한자)에 없는 한자인데 한자로 썼어요. [[{駄|だ}{目|め}]]는 소리에 한자를 맞춘 아테지(当て字)예요. 가타카나는 외래어 モデル·キス·アイス·アブラカタブラ와 일본어 オチ, 알파벳은 知人B의 B예요."}],"dict":{"{君|きみ}":{"p":"대명사","m":"너","w":"'너'를 뜻하는 대명사로, 한자로 쓰는 게 일반적이에요.","n":"원래 '임금'을 뜻하던 한자예요(君主 = 군주). 지금은 가까운 사이에서 부르는 '너'예요."},"{僕|ぼく}":{"p":"대명사","m":"나 (남성)","w":"1인칭 대명사로 한자로 쓰는 게 일반적이에요.","n":"僕는 부드럽고 소년 같은 느낌의 1인칭이에요. 俺(おれ)보다 순하고 조심스러운 느낌이에요."},"は":{"p":"조사","m":"~은/는 (주제)","n":"조사로 쓸 때는 ha가 아니라 wa로 읽어요."},"が":{"p":"조사","m":"~이/가"},"を":{"p":"조사","m":"~을/를","n":"현대 일본어에서 を는 이 조사에만 쓰는 글자예요. 발음은 お(o)와 같아요."},"に":{"p":"조사","m":"~에게, ~에"},"の":{"p":"조사","m":"~의"},"で":{"p":"조사","m":"~에서, ~으로"},"と":{"p":"조사","m":"~와/과"},"も":{"p":"조사","m":"~도"},"から":{"p":"조사","m":"~에서, ~로부터"},"へ":{"p":"조사","m":"~로, ~에게 (방향)","n":"방향을 나타내는 조사 へ는 he가 아니라 e로 읽어요."},"か":{"p":"조사(종조사)","m":"~까? (물음·혼잣말)"},"よ":{"p":"조사(종조사)","m":"~라고, ~지 (강조)"},"だ":{"p":"조동사","m":"~이다"},"きっと":{"p":"부사","m":"분명, 틀림없이","w":"한자 없이 히라가나로 쓰는 부사예요.","n":"확신에 가까운 짐작을 말해요. 이 곡에서는 화자의 상상이 시작될 때마다 나와요."},"{人|ひと}":{"p":"명사","m":"사람","n":"한국어 '인(人)'과 같은 한자예요. 혼자 쓰면 ひと, 한자어 안에서는 じん·にん으로 읽어요(知人, 恋人는 예외로 びと)."},"{夏|なつ}":{"p":"명사","m":"여름","n":"한국어 '하(夏)'와 같은 한자예요. 真夏(まなつ)는 한여름이에요."},"{魔|ま}{物|もの}":{"p":"명사","m":"마물, 사람을 홀리는 괴물","w":"魔(마귀 마)는 온요미 ま, 物는 쿤요미 もの로 읽어요. 한 단어 안에서 읽는 법이 섞인 말이에요.","n":"사람을 홀리고 흐리는 정체 모를 힘을 말해요. 甲子園には魔物が棲む(고시엔에는 마물이 산다)라는 말이 널리 알려져 있어요."},"{魔|ま}{法|ほう}":{"p":"명사","m":"마법","n":"한국어 '마법(魔法)'과 같은 한자어예요. 法는 온요미 ほう예요."},"{偶|ぐう}{然|ぜん}":{"p":"명사","m":"우연","n":"한국어 '우연(偶然)'과 같은 한자어예요. 偶然に(우연히)처럼 부사로도 써요."},"{力|ちから}":{"p":"명사","m":"힘","n":"한국어 '력(力)'과 같은 한자예요. 한자어 안에서는 りょく로 읽어요(努力 = どりょく)."},"もの":{"p":"명사","m":"것","w":"물건 物를 쓸 수도 있지만, '~의 것'처럼 뜻이 옅을 때는 히라가나로 써요.","n":"僕のもの = 내 것. 사람에게 쓰면 '내 사람'이라는 소유욕이 섞인 말이에요."},"もと":{"p":"명사","m":"곁","w":"곁·근처를 뜻할 때는 下·元·許 등 한자가 여러 개라, 히라가나로 써서 고민을 피했어요.","n":"僕のもとへ = 내 곁으로. 親のもとを離れる(부모 곁을 떠나다)처럼 써요."},"そいつ":{"p":"대명사","m":"그 녀석","w":"そ(그) + 奴(やつ)가 줄어든 말이에요. 보통 히라가나로 써요.","n":"こいつ·そいつ·あいつ·どいつ로 쓰는 こ·そ·あ·ど 말이에요. 남을 낮춰 부르는 거친 말이라 윗사람에게는 쓰지 않아요."},"{誰|だれ}":{"p":"대명사","m":"누구","n":"한국어 '수(誰)'와 같은 한자예요. 誰か(누군가), 誰も(아무도)."}},"sections":[{"label":"1절 · Aメロ","note":"너에게 나는 친구의 친구일 뿐이에요. 그런데 그런 나에게도 보내는 미소가 너무 눈부셔요.","lines":[{"id":"a1","tk":[{"t":"{君|きみ}"},{"t":"から"},{"t":"{見|み}た","p":"동사","m":"본","b":"{見|み}る","bm":"보다","w":"어간 見는 한자, た는 히라가나예요.","n":"見る의 과거형 見た가 명사를 꾸며요. 君から見た僕 = 너로부터 본 나 = 네 눈에 비친 나."},{"t":"{僕|ぼく}"},{"t":"は"},{"t":"きっと"}],"ko":"네 눈에 비친 나는 분명","lit":"너 / 에게서 / 본 / 나 / 는 / 분명","g":[{"k":"AからBた C","d":"'A로부터 B한 C'. 君から見た僕 = 너로부터 본 나. 남의 눈에 비친 자신을 말할 때 자주 써요. 親から見た子ども(부모가 보는 아이)."}],"s":"君·見·僕만 한자이고 나머지는 히라가나예요. きっと는 한자가 없는 부사라 늘 히라가나예요.","c":"첫 줄부터 화자는 '네가 나를 어떻게 볼까'를 걱정해요. 곡 전체가 이런 상상과 짐작으로 이어져요."},{"id":"a2","tk":[{"t":"ただ","p":"연체사","m":"그저, 단순한","w":"只라는 한자가 있지만 보통 히라가나로 써요.","n":"ただの + 명사 = '그저 ~일 뿐인'. ただの友達(그냥 친구). ただ는 '공짜'라는 뜻도 있어요."},{"t":"の"},{"t":"{友|とも}{達|だち}","p":"명사","m":"친구","w":"友(とも) + 達(たち)가 합쳐지며 た가 だ로 탁해졌어요(렌다쿠).","n":"達는 원래 '~들'이라는 복수 접미사예요(私たち = 우리). 友達는 지금은 한 사람에게도 써요."},{"t":"の"},{"t":"{友|とも}{達|だち}","p":"명사","m":"친구"}],"ko":"그저 친구의 친구","lit":"그저 / 의 / 친구 / 의 / 친구","g":[{"k":"ただの〜","d":"'그저 ~일 뿐인'. ただの友達 = 그냥 친구. 여기서는 友達の友達까지 붙어 거리가 한 겹 더 멀어졌어요."}],"s":"友達가 두 번 이어져요. 한자와 の가 번갈아 나와 '친구의 친구'라는 거리감이 눈으로도 보여요.","c":"친구의 친구는 직접 아는 사이도 아닌, 가장 애매한 관계예요. 화자가 스스로를 얼마나 멀리 두는지 보여 줘요."},{"id":"a3","tk":[{"t":"たかが","p":"부사","m":"고작, 기껏해야","w":"高が라는 한자가 있지만 거의 히라가나로 써요.","n":"たかが + 명사 = '고작 ~ 따위'. たかが一回の失敗(고작 한 번의 실패)."},{"t":"{知|ち}{人|じん}","p":"명사","m":"지인, 아는 사람","n":"한국어 '지인(知人)'과 같은 한자어예요. 人는 여기서 온요미 じん이에요."},{"t":"{B|ビー}","p":"명사","v":false,"m":"B (알파벳)","w":"알파벳을 그대로 썼어요. 읽을 때는 ビー예요. 연극의 배역표처럼 '지인 B'라고 이름도 없이 부르는 느낌이에요.","n":"通行人A(행인 A)처럼, 이름 없는 단역을 A·B로 부르는 습관이 있어요."},{"t":"に"},{"t":"むけられた","p":"동사","m":"향해진","b":"{向|む}ける","bm":"향하게 하다","w":"보통 向けられた로 쓰는데 히라가나로 풀었어요. 말하듯 가벼운 느낌이 나요.","n":"向ける(향하게 하다)의 수동형 向けられる의 과거형이에요. 向く(향하다, 자동사)와 짝이에요."}],"ko":"고작 지인 B한테 보낸","lit":"고작 / 지인 / B / 에게 / 향해진","g":[{"k":"수동형 〜られる","d":"1단 동사는 る를 빼고 られる. 向ける → 向けられる(향해지다). 과거형 向けられた가 다음 줄의 笑顔를 꾸며요."}],"s":"知人은 한자, B는 알파벳, むけられた는 히라가나예요. 向이라는 쉬운 한자도 일부러 풀어 써서, 한자·알파벳·히라가나가 한 줄에 다 나와요.","c":"자기를 '지인 B'라고 불러요. 드라마 엔딩 크레디트의 단역처럼, 이름조차 없는 존재라는 자조로 읽혀요."},{"id":"a4","tk":[{"t":"{笑顔|えがお}","p":"명사","m":"웃는 얼굴, 미소","w":"笑顔는 단어 전체를 えがお로 읽어요. 顔(かお)가 뒤에 붙으며 が로 탁해졌어요.","n":"笑(웃을 소) + 顔(얼굴 안). 한국어로 직역하면 '소안'이에요."},{"t":"が"},{"t":"あれ","p":"대명사","m":"저것, 저 정도","w":"これ·それ·あれ·どれ는 히라가나로 써요.","n":"あれ는 서로 아는 것을 가리켜요. 笑顔があれなら = 미소가 저 정도라면."},{"t":"なら","p":"조사","m":"~라면"},{"t":"もう","p":"부사","m":"이미, 정말이지","n":"もう는 '벌써'뿐 아니라 '이젠 뭐, 정말이지'처럼 감정을 강조할 때도 써요."},{"t":"　"},{"t":"{恐|おそ}ろしい","p":"い형용사","m":"무서운","w":"어간 恐는 한자, ろしい는 오쿠리가나(한자 뒤에 붙어 활용하는 히라가나)예요.","n":"恐(두려울 공)은 한국어 '공포(恐怖)'의 恐예요. 怖い(こわい)보다 무겁고 진지한 말이에요."},{"t":"{人|ひと}"},{"t":"だ"}],"ko":"미소가 저 정도면, 정말 무서운 사람이야","lit":"미소 / 가 / 저것 / 이라면 / 이미 / 무서운 / 사람 / 이다","g":[{"k":"〜なら","d":"'~라면'. 앞의 사실을 받아 판단을 내려요. 笑顔があれなら = 미소가 저 정도라면."}],"s":"恐ろしい는 한자 하나에 히라가나 네 글자가 붙는 긴 형용사예요. 줄 가운데 공백에서 한 번 숨을 쉬고 '무서운 사람'으로 넘어가요.","c":"지인에게도 이렇게 웃어 주면, 정말 좋아하는 사람에게는 어떨까 하는 말로 읽혀요. '무섭다'는 칭찬을 비틀어 한 말이에요."}]},{"label":"1절 · Bメロ","note":"너를 반하게 할 방법도, 바다에 데려갈 용기도 차도 없지만, 옆에서 눈뜨는 너를 보고 싶어 해요.","lines":[{"id":"b1","tk":[{"t":"{君|きみ}"},{"t":"を"},{"t":"{惚|ほ}れさせる","p":"동사","m":"반하게 할","b":"{惚|ほ}れる","bm":"반하다","w":"惚는 조요칸지(常用漢字, 일상에서 쓰는 기준 한자)에 없는 한자인데, 惚れる는 이 한자로 흔히 써요.","n":"惚れる의 사역형이 惚れさせる(반하게 하다)예요. 一目惚れ(ひとめぼれ)는 '첫눈에 반함'이에요."},{"t":"　"},{"t":"{黒|くろ}{魔|ま}{術|じゅつ}","p":"명사","m":"흑마술","w":"黒는 쿤요미 くろ, 魔術는 온요미 まじゅつ예요. 한 단어 안에서 읽는 법이 섞였어요.","n":"한국어 '흑마술(黑魔術)'과 같은 한자예요. 黒는 黑의 일본식 약자예요."},{"t":"は"},{"t":"{知|し}らない","p":"동사","m":"모르는","b":"{知|し}る","bm":"알다","w":"어간 知는 한자, らない는 히라가나예요.","n":"知る는 る로 끝나지만 5단 동사예요. 부정형이 知らない가 돼요."},{"t":"し","p":"조사","m":"~하고 (이유 나열)"}],"ko":"너를 반하게 할 흑마술은 모르고","lit":"너 / 를 / 반하게 하는 / 흑마술 / 은 / 모르다 / 하고","g":[{"k":"사역형 〜させる","d":"1단 동사는 る를 빼고 させる. 惚れる → 惚れさせる(반하게 하다)."},{"k":"〜し","d":"'~하고, ~한 데다'. 이유를 늘어놓을 때 써요. 다음 줄의 勇気も車もない로 이어져요."}],"s":"惚는 조요칸지 밖의 한자예요. 쉬운 히라가나로 풀 수도 있는데 한자를 써서, '반하다'라는 말에 무게가 실려요.","c":"흑마술이라도 쓰고 싶은 마음이에요. 이 곡의 마법 이야기가 여기서 시작돼요."},{"id":"b2","tk":[{"t":"{海|うみ}","p":"명사","m":"바다","n":"한국어 '해(海)'와 같은 한자예요. 혼자 쓰면 쿤요미 うみ예요."},{"t":"に"},{"t":"{誘|さそ}う","p":"동사","m":"가자고 할, 꾈","w":"어간 誘는 한자, う는 히라가나예요.","n":"誘(꾈 유)는 한국어 '유혹(誘惑)'의 誘예요. 일본어 誘う는 '같이 가자고 하다'라는 가벼운 뜻으로 많이 써요."},{"t":"{勇|ゆう}{気|き}","p":"명사","m":"용기","n":"한국어 '용기(勇氣)'와 같은 한자어예요. 気는 氣의 일본식 약자예요."},{"t":"も"},{"t":"{車|くるま}","p":"명사","m":"차, 자동차","n":"혼자 쓰면 쿤요미 くるま, 한자어 안에서는 しゃ예요(電車 = でんしゃ)."},{"t":"も"},{"t":"ない","p":"い형용사","m":"없다","w":"無い로 쓸 수도 있지만 보통 히라가나로 써요."}],"ko":"바다에 가자고 할 용기도 차도 없어","lit":"바다 / 에 / 꾀는 / 용기 / 도 / 차 / 도 / 없다","g":[{"k":"AもBもない","d":"'A도 B도 없다'. 勇気も車もない. 마음의 문제(용기)와 현실의 문제(차)를 나란히 놓았어요."}],"s":"海·誘·勇気·車는 한자, 조사와 ない는 히라가나예요. 같은 も가 두 번 나와 리듬을 만들어요.","c":"일본에서는 여름에 차를 몰고 바다에 가는 게 대표적인 데이트 장면이에요. 차가 없다는 건 꽤 현실적인 고백으로 읽혀요."},{"id":"b3","tk":[{"t":"でも","p":"접속사","m":"하지만, 그래도"},{"t":"{見|み}たい","p":"동사","m":"보고 싶어","b":"{見|み}る","bm":"보다","w":"어간 見는 한자, たい는 히라가나예요.","n":"ます형 + たい = '~하고 싶다'. 見る → 見たい."},{"t":"　"},{"t":"となり","p":"명사","m":"옆","b":"{隣|となり}","bm":"옆, 이웃","w":"隣라는 조요칸지가 있지만 히라가나로 풀었어요. 부드럽고 가까운 느낌이 나요.","n":"隣(이웃 린)은 한국어 '인접(隣接)'의 隣예요. お隣さん은 '옆집 사람'이에요."},{"t":"で"},{"t":"{目|め}{覚|ざ}めて","p":"동사","m":"눈을 뜨고","b":"{目|め}{覚|ざ}める","bm":"잠에서 깨다","w":"目(め) + 覚める(さめる)가 합쳐지며 さ가 ざ로 탁해졌어요(렌다쿠).","n":"目覚まし時計(めざましどけい)는 '자명종'이에요."}],"ko":"그래도 보고 싶어, 옆에서 눈을 뜨고","lit":"하지만 / 보고 싶다 / 옆 / 에서 / 눈을 뜨고","g":[{"k":"도치","d":"見たい(보고 싶다)의 목적어가 다음 줄 끝의 君を예요. 원래 순서는 となりで目覚めておはようと笑う君を見たい예요. 하고 싶은 말을 먼저 꺼냈어요."}],"s":"隣 대신 となり로 썼어요. 見たい와 となり 사이의 공백이 끊어 읽는 곳을 알려 줘요. 붙여 쓰면 見たいとなり처럼 어디서 끊을지 헷갈려요.","c":"옆에서 눈을 뜬다는 건 함께 아침을 맞는 사이라는 뜻이에요. 친구의 친구에서 단숨에 멀리 간 망상이에요."},{"id":"b4","tk":[{"t":"おはよう","p":"감동사","m":"좋은 아침, 안녕","w":"인사말은 히라가나로 써요. お早う로 쓰는 일은 드물어요.","n":"早い(はやい, 이르다)에서 온 말이에요. 윗사람에게는 おはようございます."},{"t":"と","m":"~라고 (인용)"},{"t":"{笑|わら}う","p":"동사","m":"웃는","w":"어간 笑는 한자, う는 히라가나예요.","n":"笑(웃을 소)는 한국어 '미소(微笑)'의 笑예요."},{"t":"{君|きみ}"},{"t":"を"}],"ko":"'좋은 아침' 하고 웃는 너를","lit":"좋은 아침 / 이라고 / 웃는 / 너 / 를","g":[{"k":"〜と + 동사","d":"'~라고 하며 ~하다'. おはようと笑う = 좋은 아침이라며 웃다. と는 인용이에요."}],"s":"おはよう는 원래 お早う에서 왔지만 인사말이라 히라가나로 써요.","c":"앞 줄의 見たい가 여기 君を로 완성돼요. 아침 인사를 하며 웃는 너라는, 아주 평범해서 더 간절한 장면이에요."}]},{"label":"サビ · 후렴","note":"지금 당장 모퉁이에서 네가 튀어나와 주길, 여름의 마법이라도 빌려 내 것이 되길 바라다 스스로 꺾어요.","lines":[{"id":"c1","tk":[{"t":"{会|あ}いたいんだ","p":"동사","m":"만나고 싶은 거야","b":"{会|あ}う","bm":"만나다","w":"어간 会는 한자, いたい는 히라가나예요. 끝의 んだ는 앞말과 붙어 감정을 강하게 해요.","n":"会う + たい + んだ. 〜んだ는 '~하는 거야'처럼 사정이나 마음을 털어놓을 때 써요."},{"t":"　"},{"t":"{今|いま}すぐ","p":"부사","m":"지금 당장","w":"今은 한자, すぐ는 히라가나예요. すぐ는 直ぐ라는 한자가 있지만 거의 쓰지 않아요."},{"t":"その","p":"연체사","m":"그","w":"この·その·あの·どの는 히라가나로 써요."},{"t":"{角|かど}","p":"명사","m":"모퉁이","n":"角(뿔 각)은 쿤요미로 かど(모퉁이), つの(뿔)라고 읽어요. 한국어 '각도(角度)'의 角예요."},{"t":"から"}],"ko":"만나고 싶어, 지금 당장 저 모퉁이에서","lit":"만나고 싶은 거야 / 지금 당장 / 그 / 모퉁이 / 에서","g":[{"k":"〜たいんだ","d":"'~하고 싶은 거야'. たい(바람) + んだ(설명·강조). 会いたい보다 마음을 털어놓는 느낌이 강해요."}],"s":"角은 쿤요미 かど로 읽어요. 같은 한자를 つの(뿔)로도 읽어서, 앞뒤 말로 읽기를 정해요.","c":"모퉁이에서 튀어나와 부딪치는 만남은 일본 만화·드라마의 단골 장면이에요. 그런 우연이라도 일어나길 바라는 마음으로 읽혀요."},{"id":"c2","tk":[{"t":"{飛|と}び{出|だ}して","p":"동사","m":"튀어나와","b":"{飛|と}び{出|だ}す","bm":"튀어나오다, 뛰쳐나오다","w":"飛ぶ(날다)와 出す(내다)가 합쳐진 복합동사예요. 한자 둘에 오쿠리가나가 각각 붙어요.","n":"동사 ます형 + 동사로 만든 말을 복합동사라고 해요. 飛ぶ → 飛び + 出す."},{"t":"きて","p":"보조동사","m":"~와서","b":"くる","bm":"(이쪽으로) ~해 오다","w":"'~해 오다'라는 보조 뜻일 때는 来る 대신 히라가나 くる로 써요."},{"t":"くれない","p":"보조동사","m":"~해 주지 않을","b":"くれる","bm":"(나에게) ~해 주다","w":"보조동사 くれる는 히라가나로 써요.","n":"て형 + くれないか = '~해 주지 않을래?'. 상대에게 부탁하는 말이에요."},{"t":"か"}],"ko":"튀어나와 주지 않을래?","lit":"튀어나와 / 와서 / 주지 않을 / 까","g":[{"k":"〜てくる","d":"'(이쪽으로) ~해 오다'. 飛び出してくる = 내 쪽으로 튀어나오다."},{"k":"〜てくれないか","d":"'~해 주지 않을래?'. 정중함보다 간절함이 담긴 부탁이에요."}],"s":"한자는 飛·出 두 글자뿐이고, 뒤로 きてくれないか가 히라가나로 길게 이어져요. 보조동사(앞 동사를 돕는 동사)는 히라가나로 쓴다는 규칙이 잘 보여요.","c":"물론 대답할 사람은 없어요. 혼잣말 같은 부탁이라 더 애처롭게 들려요."},{"id":"c3","tk":[{"t":"{夏|なつ}"},{"t":"の"},{"t":"{魔|ま}{物|もの}"},{"t":"に","m":"~에게 (수동의 행위자)"},{"t":"{連|つ}れ{去|さ}られ","p":"동사","m":"끌려가","b":"{連|つ}れ{去|さ}る","bm":"데리고 가 버리다, 납치하다","w":"連れる(데리고 가다)와 去る(떠나다)가 합쳐진 복합동사예요. 한자 둘에 오쿠리가나가 각각 붙어요.","n":"連れ去る의 수동형 連れ去られる에서 る를 뺀 연용형이에요. 문장을 끊지 않고 '~해서'처럼 다음으로 이어요."},{"t":"　"},{"t":"{僕|ぼく}"},{"t":"の"},{"t":"もと"},{"t":"へ"}],"ko":"여름의 마물에게 붙들려, 내 곁으로","lit":"여름 / 의 / 마물 / 에게 / 끌려가 / 나 / 의 / 곁 / 으로","g":[{"k":"Aに〜られる","d":"수동형에서 행위자는 に로 나타내요. 夏の魔物に連れ去られ = 여름의 마물에게 끌려가."},{"k":"연용형으로 잇기","d":"連れ去られ(て)처럼 て를 빼고 연용형으로 이으면 글말 같은 리듬이 생겨요."}],"s":"もと는 下·元·許 중 어느 한자도 고르지 않고 히라가나로 썼어요. 다음 줄의 星のもと와 같은 소리라 귀로 이어져요.","c":"네가 스스로 오는 게 아니라 마물에게 납치되듯 끌려오길 바라요. 그 정도가 아니면 올 리 없다는 체념이 깔려 있어요."},{"id":"c4","tk":[{"t":"{生|う}まれた","p":"동사","m":"태어난","b":"{生|う}まれる","bm":"태어나다","w":"어간 生는 한자, まれた는 히라가나예요.","n":"生는 읽기가 아주 많은 한자예요. 生まれる(うまれる), 生きる(いきる), 生(なま), 先生(せんせい)."},{"t":"{星|ほし}","p":"명사","m":"별","n":"한국어 '성(星)'과 같은 한자예요. 여기서는 타고난 운명을 뜻해요."},{"t":"の"},{"t":"もと","m":"아래","w":"星の下に生まれる라는 관용 표현의 下(もと)를 히라가나로 썼어요.","n":"下는 보통 した지만, 이 관용 표현에서는 もと로 읽어요."},{"t":"が"},{"t":"　"},{"t":"{違|ちが}くたって","p":"동사","m":"달라도","b":"{違|ちが}う","bm":"다르다","w":"違う는 동사라 표준형은 違っても예요. 違う를 い형용사처럼 활용한 회화체라, 문법책에는 나오지 않는 형태예요.","n":"〜たって는 〜ても(~해도)의 회화체예요. 違くない, 違かった도 같은 회화체예요."}],"ko":"타고난 별이 달라도","lit":"태어난 / 별 / 의 / 아래 / 가 / 달라도","g":[{"k":"{星|ほし}の{下|もと}に{生|う}まれる","d":"'~한 별 아래 태어나다' = 그런 운명을 타고나다. 生まれた星のもとが違う = 타고난 운명(처지)이 다르다."},{"k":"〜たって","d":"'~해도'. 〜ても의 회화체예요. 違ったって가 표준이고, 가사의 違くたって는 더 거친 구어예요."}],"s":"違くたって는 일부러 비문을 쓴 곳이에요. 바른 말 대신 친구끼리 하는 말투를 그대로 옮겨, 화자가 가까이 느껴져요.","c":"너와 나는 사는 세계가 다르다는 걸 알고 있어요. 제목의 高嶺の花(넘볼 수 없는 사람)와 이어지는 줄이에요."},{"id":"c5","tk":[{"t":"{偶|ぐう}{然|ぜん}"},{"t":"と"},{"t":"{夏|なつ}"},{"t":"の"},{"t":"{魔|ま}{法|ほう}"},{"t":"とやら","p":"조사","m":"~라나 뭐라나, ~인지 뭔지","n":"と + やら. 들은 말이나 잘 모르는 것을 반쯤 의심하며 가리켜요."},{"t":"の"},{"t":"{力|ちから}"},{"t":"で","m":"~으로 (수단)"}],"ko":"우연과 여름의 마법인지 뭔지 하는 힘으로","lit":"우연 / 과 / 여름 / 의 / 마법 / 이라나 뭐라나 / 의 / 힘 / 으로","g":[{"k":"〜とやら","d":"'~라나 뭐라나'. 夏の魔法とやら = 여름의 마법인지 뭔지. 믿지 않으면서 기대는 말투예요."}],"s":"偶然·夏·魔法·力 같은 한자 명사 사이를 と·の·とやら·で 같은 히라가나 조사가 이어요.","c":"우연과 마법, 둘 다 내 힘이 아닌 것에 기대요. 스스로는 어떻게 할 수 없다는 고백으로도 읽혀요."},{"id":"c6","tk":[{"t":"{僕|ぼく}"},{"t":"の"},{"t":"もの"},{"t":"に","m":"~으로 (변화의 결과)"},{"t":"　"},{"t":"なる","p":"동사","m":"될","w":"成る라는 한자가 있지만 '되다'는 보통 히라가나로 써요."},{"t":"わけ","p":"형식명사","m":"리, 까닭","w":"訳라는 한자가 있지만 문법 표현으로 쓸 때는 히라가나로 써요.","n":"〜わけない = '~할 리 없다'. そんなわけない(그럴 리 없어)."},{"t":"ない","p":"い형용사","m":"없다","w":"無い로 쓸 수도 있지만 보통 히라가나로 써요."},{"t":"か"}],"ko":"내 것이 될 리 없겠지","lit":"나 / 의 / 것 / 으로 / 되다 / 리 / 없다 / 겠지","g":[{"k":"〜わけない","d":"'~할 리 없다'. なるわけない = 될 리 없어. 뒤에 か를 붙이면 '그럴 리 없겠지' 하고 혼자 수긍하는 말이 돼요."}],"s":"한자는 僕 하나뿐이에요. なる·わけ·ない 모두 한자가 있는 말이지만, 문법처럼 쓰여 히라가나로 풀었어요.","c":"후렴 내내 쌓은 바람을 마지막 한 줄에서 스스로 무너뜨려요. 우스우면서도 애달픈 이 곡의 맛이 담긴 줄이에요."}]},{"label":"2절 · Aメロ","note":"네 연인이 될 남자를 마음대로 상상해요. 모델 같고, 연상이고, 그을린 피부에 서양 음악을 좋아하는 사람이에요.","lines":[{"id":"d1","tk":[{"t":"{君|きみ}"},{"t":"の"},{"t":"{恋|こい}{人|びと}","p":"명사","m":"연인, 애인","w":"恋(こい) + 人(ひと)가 합쳐지며 ひ가 び로 탁해졌어요(렌다쿠).","n":"한국어 '연인(戀人)'과 같은 한자지만 쿤요미로 こいびと라고 읽어요. 恋는 戀의 일본식 약자예요."},{"t":"に","m":"~이 (변화의 결과)"},{"t":"なる","p":"동사","m":"될"},{"t":"{人|ひと}"},{"t":"は"}],"ko":"네 연인이 될 사람은","lit":"너 / 의 / 연인 / 이 / 될 / 사람 / 은","g":[{"k":"Aになる","d":"'A가 되다'. 恋人になる = 연인이 되다. 한국어 '~이 되다'의 이/가 자리에 に가 와요."}],"s":"恋人의 人는 びと, 뒤의 人는 ひと예요. 같은 한자가 한 줄에서 다르게 읽혀요.","c":"이번에는 내가 아니라 네 연인이 될 남자를 상상해요. 1절보다 더 멀리 간 망상이에요."},{"id":"d2","tk":[{"t":"モデル","p":"명사","m":"모델","w":"영어 model에서 온 외래어라 가타카나로 써요."},{"t":"みたいな","p":"조동사","m":"~같은","n":"명사 + みたいな + 명사 = '~같은 ~'. 회화에서 아주 많이 써요. 글에서는 ような를 써요."},{"t":"{人|ひと}"},{"t":"なんだろう","p":"조동사","m":"~이겠지","n":"な + んだ + ろう. '~인 거겠지'. 혼자 짐작할 때 써요."}],"ko":"모델 같은 사람이겠지","lit":"모델 / 같은 / 사람 / 이겠지","g":[{"k":"〜みたいな","d":"'~같은'. モデルみたいな人 = 모델 같은 사람."},{"k":"〜なんだろう","d":"'~인 거겠지'. 명사 + なんだろう. 혼잣말로 짐작해요."}],"s":"외래어 モデル는 가타카나, 나머지는 히라가나와 人 하나예요.","c":"확인한 것도 아닌데 '그렇겠지'라고 단정해요. 스스로 상처 낼 상상을 계속 키워 가는 모습이에요."},{"id":"d3","tk":[{"t":"そいつ"},{"t":"は"},{"t":"きっと"},{"t":"　"},{"t":"{君|きみ}"},{"t":"よりも","p":"조사","m":"~보다도"},{"t":"{年|とし}{上|うえ}","p":"명사","m":"연상","n":"年(나이) + 上(위). 반대말은 年下(としした, 연하)예요."},{"t":"で","p":"조동사","m":"~이고"}],"ko":"그 녀석은 분명 너보다 연상이고","lit":"그 녀석 / 은 / 분명 / 너 / 보다도 / 연상 / 이고","g":[{"k":"Aよりも","d":"'A보다도'. より(~보다)에 も를 더해 강조해요."},{"k":"명사 + で","d":"だ의 연결형이에요. 年上で = 연상이고. 다음 줄로 이어져요."}],"s":"年上은 한자 둘 다 쿤요미로 읽어요(とし + うえ). 한국어 '연상'과 같은 뜻이지만 읽는 법이 전혀 달라요.","c":"아직 있지도 않은 상대를 그 녀석(そいつ)이라고 거칠게 불러요. 벌써 질투가 섞여 있어요."},{"id":"d4","tk":[{"t":"{焼|や}けた","p":"동사","m":"그을린, 탄","b":"{焼|や}ける","bm":"타다, 햇볕에 그을리다","w":"어간 焼는 한자, けた는 히라가나예요.","n":"日焼け(ひやけ)는 '햇볕에 탐'이에요. 焼는 燒의 일본식 약자예요."},{"t":"{肌|はだ}","p":"명사","m":"피부","n":"한국어 '기(肌)'와 같은 한자예요. 肌が白い(피부가 하얗다)."},{"t":"が"},{"t":"よく","p":"부사","m":"잘","w":"良く로 쓸 수 있지만 부사로는 히라가나로 써요."},{"t":"{似|に}{合|あ}う","p":"동사","m":"어울리는","w":"似る(닮다)와 合う(맞다)가 합쳐진 말이에요. 한자 둘 사이에 오쿠리가나가 없어요.","n":"Aがよく似合う = A가 잘 어울리다. 赤がよく似合う(빨강이 잘 어울려)."}],"ko":"그을린 피부가 잘 어울리는","lit":"그을린 / 피부 / 가 / 잘 / 어울리는","g":[{"k":"동사 과거형 + 명사","d":"焼けた肌 = 그을린 피부. 과거형이 명사를 꾸미면 '~한 상태의'라는 뜻이 돼요."}],"s":"似合う는 한자 둘에 히라가나 う 하나예요. 복합어인데 사이의 오쿠리가나가 빠졌어요.","c":"햇볕에 그을린 피부는 바다·서핑 같은 활동적인 여름 남자의 모습이에요. 바다에 데려갈 차도 없는 화자와 대비돼요."},{"id":"d5","tk":[{"t":"{洋|よう}{楽|がく}","p":"명사","m":"서양 음악, 팝송","n":"洋(서양) + 楽(음악). 반대말은 邦楽(ほうがく, 일본 음악)이에요. 楽는 樂의 일본식 약자예요."},{"t":"{好|ず}きな","p":"접미사","m":"~를 좋아하는","b":"{好|ず}き","bm":"~를 좋아함","w":"好き(すき)가 명사 뒤에 붙어 す가 ず로 탁해졌어요(렌다쿠).","n":"명사 + 好き = '~를 좋아함, ~광'. 映画好き(영화를 좋아함), 犬好き(개를 좋아함)."},{"t":"{人|ひと}"},{"t":"だ"}],"ko":"서양 음악을 좋아하는 사람이야","lit":"서양 음악 / 좋아하는 / 사람 / 이다","g":[{"k":"명사 + {好|す}き","d":"'~를 좋아함'. 洋楽好きな人 = 서양 음악을 좋아하는 사람. 好き가 な형용사라 명사 앞에서 な가 붙어요."}],"s":"好き가 앞말에 붙으면 ずき로 읽어요. 한자는 같아도 렌다쿠로 소리가 바뀌어요.","c":"그 녀석은 서양 음악을 즐겨 듣는 세련된 사람이라고 상상해요. 그런 사람과 나를 비교하는 자조로 읽혀요."}]},{"label":"2절 · Bメロ","note":"그 녀석과 너의 다정한 장면을 그리다 '뭐 하나 못 이긴다'고 좌절하고, 문득 정신을 차려요.","lines":[{"id":"e1","tk":[{"t":"キス","p":"명사","m":"키스","w":"영어 kiss에서 온 외래어라 가타카나로 써요."},{"t":"を"},{"t":"する","p":"동사","m":"하다","w":"'하다'는 한자 없이 히라가나로 써요."},{"t":"とき","p":"명사","m":"때","b":"{時|とき}","bm":"때","w":"時라는 한자가 있지만 '~할 때'처럼 쓸 때는 히라가나로 많이 써요."},{"t":"も"},{"t":"　"},{"t":"{君|きみ}"},{"t":"は"},{"t":"{背|せ}{伸|の}びしている","p":"동사","m":"발돋움하고 있어","b":"{背|せ}{伸|の}びする","bm":"발돋움하다, 까치발을 하다","w":"背(키) + 伸び(늘임). 伸び에 오쿠리가나 び가 붙은 명사에 する가 이어졌어요.","n":"背伸び는 '무리해서 어른스럽게 굴다'라는 비유로도 써요. 背伸びした服(무리해서 고른 어른스러운 옷)."}],"ko":"키스할 때도 너는 까치발을 하고 있어","lit":"키스 / 를 / 하다 / 때 / 도 / 너 / 는 / 발돋움하고 있다","g":[{"k":"〜ている","d":"'~하고 있다'. 背伸びしている = 발돋움하고 있다. 장면을 눈앞에 그리듯 말해요."},{"k":"동사 + とき","d":"'~할 때'. キスをするとき = 키스할 때."}],"s":"時 대신 とき로 썼어요. '~할 때'처럼 뜻이 옅은 말은 히라가나로 많이 풀어요.","c":"키 큰 연상에게 맞추려 까치발을 하는 너예요. 背伸び에는 어른스러운 상대에게 맞추려 애쓴다는 느낌도 겹쳐 읽혀요."},{"id":"e2","tk":[{"t":"{頭|あたま}","p":"명사","m":"머리","n":"한국어 '두(頭)'와 같은 한자예요. 한자어 안에서는 とう·ず로 읽어요(頭痛 = ずつう)."},{"t":"を"},{"t":"なでられ","p":"동사","m":"쓰다듬어져","b":"なでる","bm":"쓰다듬다","w":"撫でる라는 한자가 있지만 획이 많고 어려운 한자라 히라가나로 풀었어요.","n":"なでる의 수동형 なでられる의 연용형이에요. 頭をなでられる = 머리를 쓰다듬어지다."},{"t":"{君|きみ}"},{"t":"が"},{"t":"{笑|わら}います","p":"동사","m":"웃어요","b":"{笑|わら}う","bm":"웃다","w":"어간 笑는 한자, います는 히라가나예요."}],"ko":"머리를 쓰다듬어 주면 네가 웃어요","lit":"머리 / 를 / 쓰다듬어져 / 너 / 가 / 웃어요","g":[{"k":"Aを〜られる","d":"'A를 ~당하다'. 일본어는 자기 몸의 일부가 무언가를 당할 때 수동형을 써요. 頭をなでられる = 머리를 쓰다듬어지다."},{"k":"갑작스러운 ます형","d":"반말 가사 속에 笑います가 튀어나와요. 내레이션처럼 담담하게 상황을 읊는 느낌이 나요."}],"s":"撫でる의 撫 대신 히라가나 なでられ로 써서 손길이 부드럽게 느껴져요.","c":"갑자기 정중한 말투가 되면서, 자기 상상을 남 일처럼 해설하는 느낌으로 읽혀요. 우스우면서도 서글픈 장면이에요."},{"id":"e3","tk":[{"t":"{駄|だ}{目|め}","p":"な형용사","m":"안 됨, 글렀음","w":"駄目는 소리에 한자를 맞춘 아테지(当て字)예요. 駄(짐 실을 태)와 目(눈 목)의 뜻과는 상관없어요.","n":"바둑에서 어느 쪽 집도 되지 않는 곳을 駄目라고 한 데서 왔다고 알려져 있어요. ダメ로 가타카나로도 자주 써요."},{"t":"だ"},{"t":"{何|なに}ひとつ","p":"표현","m":"무엇 하나 (~도 없다)","b":"{何|なに}{一|ひと}つ","bm":"무엇 하나","w":"何一つ로 쓸 수 있지만 숫자 一つ를 히라가나로 풀었어요. 숫자 느낌을 지워 말이 부드러워져요.","n":"何ひとつ + 부정 = '무엇 하나 ~하지 않다'. 何ひとつ分からない(뭐 하나 모르겠어)."},{"t":"　"},{"t":"{勝|か}ってない","p":"동사","m":"이기지 못했어","b":"{勝|か}つ","bm":"이기다","w":"어간 勝는 한자, ってない는 히라가나예요.","n":"勝っていない의 い가 빠진 회화체예요. '이긴 상태가 아니다' = 이긴 게 없다."}],"ko":"안 되겠다, 뭐 하나 이긴 게 없어","lit":"글렀음 / 이다 / 무엇 하나 / 이기지 못했다","g":[{"k":"〜てない","d":"〜ていない의 회화체. 勝ってない = 이기지 못했어(이긴 게 없어). い가 빠지는 건 회화에서 흔해요."},{"k":"{何|なに}ひとつ〜ない","d":"'무엇 하나 ~없다'. 부정과 함께 써서 전부를 부정해요."}],"s":"駄目는 아테지라 한자 뜻으로 풀면 안 돼요. 何ひとつ는 一을 히라가나로 풀어 썼어요.","c":"상상 속 상대와 자신을 비교하다 혼자 졌다고 해요. 상대는 아직 있지도 않은데 말이에요."},{"id":"e4","tk":[{"t":"いや","p":"감동사","m":"아니","w":"말을 뒤집을 때 쓰는 감동사라 히라가나로 써요. 嫌(いや, 싫다)와는 다른 말이에요."},{"t":"{待|ま}て","p":"동사","m":"기다려","b":"{待|ま}つ","bm":"기다리다","w":"어간 待는 한자, て는 히라가나예요.","n":"待つ의 명령형이 待て예요. いや待てよ = 아니, 잠깐만. 혼잣말로 자주 써요."},{"t":"よ"},{"t":"　"},{"t":"そいつ"},{"t":"{誰|だれ}"},{"t":"だ"}],"ko":"아니 잠깐, 그 녀석 누구야","lit":"아니 / 기다려 / 봐 / 그 녀석 / 누구 / 야","g":[{"k":"명령형","d":"5단 동사는 끝 う단을 え단으로 바꿔요. 待つ → 待て. いや待てよ는 자신에게 하는 말이라 거칠게 들리지 않아요."}],"s":"한자는 待·誰 두 글자예요. 짧은 말들이 공백으로 끊겨, 퍼뜩 정신 차리는 호흡이 나요.","c":"있지도 않은 상대에게 진 걸 깨닫고 스스로 태클을 걸어요. 일본 만담의 츳코미(つっこみ, 엉뚱한 말에 받아치기) 같은 웃음 포인트로 읽혀요."}]},{"label":"サビ 2 · 두 번째 후렴","note":"후렴을 되풀이하다, 네가 다른 누군가를 좋아하더라도 주문 같은 힘으로 내 것으로 만들고 싶다고 해요.","lines":[{"same":"c1"},{"same":"c2"},{"same":"c3"},{"id":"f1","tk":[{"t":"{君|きみ}"},{"t":"が"},{"t":"{他|ほか}","p":"명사","m":"다른 (것)","n":"他는 ほか와 た 두 가지로 읽어요. 他の人는 ほかのひと, 他人은 たにん."},{"t":"の"},{"t":"{誰|だれ}"},{"t":"を"},{"t":"　"},{"t":"{気|き}になっていたって","p":"동사","m":"신경 쓰고 있다 해도","b":"{気|き}になる","bm":"신경 쓰이다, 마음에 걸리다","w":"気는 한자, になっていたって는 히라가나예요.","n":"気になる = 신경 쓰이다, 마음이 가다. 좋아하는 사람이 생겼을 때 気になる人(마음 가는 사람)라고 해요."}],"ko":"네가 다른 누군가를 마음에 두고 있대도","lit":"너 / 가 / 다른 / 의 / 누구 / 를 / 신경 쓰고 있다 해도","g":[{"k":"〜ていたって","d":"'~하고 있었다 해도'. 〜ていても의 회화체예요. c4의 違くたって와 같은 たって예요."},{"k":"{誰|だれ}を{気|き}になる","d":"표준형은 誰が気になる(누가 신경 쓰이다)예요. 気にする(신경 쓰다)의 を가 섞인 듯한 회화체예요."}],"s":"他는 ほか로 읽었어요. 같은 한자를 た로 읽는 말(他人)도 있어서 앞뒤로 구별해요.","c":"1절의 바람에서 한 걸음 더 나가, 다른 사람이 있어도 상관없다는 억지예요. 망상이 점점 대담해져요."},{"id":"f2","tk":[{"t":"{偶|ぐう}{然|ぜん}"},{"t":"と"},{"t":"アブラカタブラ","p":"명사","m":"아브라카다브라 (주문)","w":"외국에서 온 주문이라 가타카나로 써요. 한국어 '수리수리 마수리' 같은 말이에요.","n":"마술사가 쓰는 주문으로 일본에서도 널리 알려져 있어요."},{"t":"な","p":"조동사","m":"~같은, ~인","n":"명사 뒤에 な를 붙여 な형용사처럼 명사를 꾸몄어요. 가사다운 장난스러운 쓰임이에요."},{"t":"{力|ちから}"},{"t":"で","m":"~으로 (수단)"}],"ko":"우연과 아브라카다브라 같은 힘으로","lit":"우연 / 과 / 아브라카다브라 / 같은 / 힘 / 으로","g":[{"k":"명사 + な + 명사","d":"원래 명사에는 の가 붙지만, な를 붙여 형용사처럼 썼어요. アブラカタブラな力 = 주문 같은 힘."}],"s":"첫 후렴의 夏の魔法とやら 자리에 가타카나 주문 アブラカタブラ가 들어왔어요. 한자 명사가 가타카나로 바뀌어 더 장난스러워요.","c":"여름의 마법도 모자라 주문까지 외워요. 우스운 말 뒤에 그만큼 간절하다는 마음이 숨어 있어요."},{"id":"f3","tk":[{"t":"{僕|ぼく}"},{"t":"の"},{"t":"もの"},{"t":"に","m":"~으로 (변화의 결과)"}],"ko":"내 것으로","lit":"나 / 의 / 것 / 으로","g":[{"k":"말 줄임","d":"첫 후렴은 僕のものになるわけないか로 끝났어요. 여기서는 なるわけないか를 빼고 僕のものに에서 끊었어요."}],"c":"'될 리 없겠지'라는 체념을 이번에는 말하지 않아요. 바람만 남기고 끊은 것으로 읽혀요."}]},{"label":"Cメロ · 브리지","note":"용기 내어 달려가도 들떠 있던 건 나뿐이라는 결말만 떠올라, 한여름 하늘 아래서 떨며 너를 생각해요.","lines":[{"id":"g1","tk":[{"t":"この","p":"연체사","m":"이","w":"この·その·あの·どの는 히라가나로 써요."},{"t":"{胸|むね}","p":"명사","m":"가슴","n":"한국어 '흉(胸)'과 같은 한자예요(흉부 = 胸部)."},{"t":"の"},{"t":"　"},{"t":"{焦|あせ}り","p":"명사","m":"초조함, 조바심","b":"{焦|あせ}り","w":"동사 焦る(초조해하다)에서 온 명사라, 명사인데도 오쿠리가나 り가 붙어요.","n":"焦(탈 초)는 한국어 '초조(焦燥)'의 焦예요. 焦げる(こげる)는 '타다, 눋다'예요."},{"t":"に"},{"t":"{身|み}","p":"명사","m":"몸","n":"身는 혼자 쓰면 み예요. 身を任せる = 몸을 맡기다."},{"t":"を"},{"t":"{任|まか}せ","p":"동사","m":"맡기고","b":"{任|まか}せる","bm":"맡기다","w":"어간 任는 한자, せ는 히라가나예요.","n":"任せる의 연용형으로 다음 줄에 이어요. お任せ(맡김)는 식당의 '오마카세'예요."}],"ko":"이 가슴의 조바심에 몸을 맡기고","lit":"이 / 가슴 / 의 / 초조함 / 에 / 몸 / 을 / 맡기고","g":[{"k":"{身|み}を{任|まか}せる","d":"'몸을 맡기다' = 흐름이나 감정에 따르다. 焦りに身を任せ = 조바심이 이끄는 대로."}],"s":"焦り는 명사인데 오쿠리가나 り가 붙어 있어요. 동사 焦る에서 왔다는 흔적이에요.","c":"브리지에서 처음으로 화자가 행동하는 상상을 해요. 하지만 이 행동도 결국 상상 속이에요."},{"id":"g2","tk":[{"t":"{君|きみ}"},{"t":"の"},{"t":"とこ","p":"명사","m":"곳, 데","b":"{所|ところ}","bm":"곳","w":"ところ(所)가 줄어든 회화체예요. 줄인 말이라 한자 없이 히라가나로 써요.","n":"君のとこ = 너 있는 곳. 사람 + のところ는 '그 사람이 있는 곳'이에요."},{"t":"へ"},{"t":"{走|はし}った","p":"동사","m":"달려갔다","b":"{走|はし}る","bm":"달리다","w":"어간 走는 한자, った는 히라가나예요.","n":"走る는 る로 끝나지만 5단 동사예요. 과거형이 走った가 돼요."},{"t":"として","p":"조사(복합)","m":"~했다고 쳐도"},{"t":"　"},{"t":"{実|じつ}は","p":"부사","ro":"jitsuwa","m":"사실은","w":"実은 온요미 じつ로 읽어요. は는 조사에서 왔지만 하나로 굳은 부사라 wa로 읽어요.","n":"한국어 '실(實)'과 같은 한자예요. 実는 實의 일본식 약자예요.","kana":"じつわ"},{"t":"{僕|ぼく}"},{"t":"の"},{"t":"{方|ほう}","p":"명사","m":"쪽","n":"方는 ほう(쪽), かた(분, 방법) 두 가지로 읽어요. 僕の方が = 내 쪽이."},{"t":"が"}],"ko":"너에게 달려갔다 쳐도, 사실은 내 쪽이","lit":"너 / 의 / 곳 / 으로 / 달려갔다 / 고 쳐도 / 사실은 / 나 / 의 / 쪽 / 이","g":[{"k":"〜たとして","d":"'~했다고 쳐도, ~했다고 해도'. 일어나지 않은 일을 가정해요."},{"k":"Aの{方|ほう}が","d":"'A 쪽이'. 둘을 비교할 때 써요. 僕の方が = (너가 아니라) 내 쪽이."}],"s":"ところ를 줄인 とこ를 썼어요. 말하는 그대로를 옮겨 적은 느낌이에요.","c":"문장이 다음 줄로 길게 이어져요. 가정이 무서운 결말로 흘러가는 과정을 따라가 보세요."},{"id":"g3","tk":[{"t":"{悪|わる}い","p":"い형용사","m":"나쁜","w":"어간 悪는 한자, い는 히라가나예요.","n":"悪(악할 악)는 惡의 일본식 약자예요. 한국어 '악(惡)'과 같은 한자예요."},{"t":"{意|い}{味|み}","p":"명사","m":"의미, 뜻","n":"한국어 '의미(意味)'와 같은 한자어예요."},{"t":"で"},{"t":"　"},{"t":"{夏|なつ}"},{"t":"の"},{"t":"{魔|ま}{法|ほう}{的|てき}な","p":"な형용사","m":"마법 같은","b":"{魔|ま}{法|ほう}{的|てき}","bm":"마법적","w":"한자어 魔法에 的를 붙여 な형용사로 만들었어요. 的와 な만 히라가나 쪽이에요.","n":"명사 + 的 = '~적'. 한국어 '마법적'과 같은 말이에요. 的는 원래 '과녁'이라는 뜻이에요."},{"t":"もの"},{"t":"で","m":"~때문에 (원인)"}],"ko":"나쁜 의미로, 여름의 마법 같은 것 때문에","lit":"나쁜 / 의미 / 로 / 여름 / 의 / 마법 같은 / 것 / 때문에","g":[{"k":"{悪|わる}い{意|い}{味|み}で","d":"'나쁜 의미로'. いい意味で(좋은 의미로)와 짝인 회화 표현이에요."},{"k":"〜{的|てき}なもの","d":"'~같은 것'. 딱 잘라 말하지 않고 흐릴 때 써요. 夏の魔法的なもの = 여름의 마법 같은 것."}],"s":"후렴의 夏の魔法とやら가 여기서는 夏の魔法的なもの로 바뀌었어요. 같은 말을 또 흐려서, 이번에는 나를 탓하는 데 써요.","c":"후렴에서 기대던 여름의 마법이, 여기서는 나를 착각하게 만든 원인으로 돌아와요."},{"id":"g4","tk":[{"t":"{舞|ま}い{上|あ}がってました","p":"동사","m":"들떠 있었습니다","b":"{舞|ま}い{上|あ}がる","bm":"날아오르다, 들뜨다","w":"舞う(춤추다)와 上がる(오르다)가 합쳐진 복합동사예요. 한자 둘에 오쿠리가나가 각각 붙어요.","n":"舞い上がる는 원래 '날아오르다'인데, 기뻐서 붕 뜬 마음을 말할 때도 써요. 舞い上がっていました의 い가 빠진 회화체예요."},{"t":"って","p":"조사","m":"~라는 (인용)","n":"と·という의 회화체예요. 다음 줄의 オチ를 꾸며요."}],"ko":"'들떠 있었습니다' 하는","lit":"들떠 있었습니다 / 라는","g":[{"k":"〜てました","d":"〜ていました의 회화체. 舞い上がってました = 들떠 있었습니다."},{"k":"〜って","d":"인용의 と·という를 줄인 말. 〜ましたって + オチ = '~였습니다'라는 결말."}],"s":"舞·上 두 한자에 오쿠리가나가 하나씩 붙고, 뒤로 히라가나가 길게 이어져요.","c":"ます형으로 고백하듯 끝나요. 사과 회견처럼 '사실 제가 들떠 있었습니다' 하고 털어놓는 장면으로 읽혀요."},{"id":"g5","tk":[{"t":"{怖|こわ}すぎる","p":"い형용사","m":"너무 무서운","b":"{怖|こわ}い","bm":"무섭다","w":"어간 怖는 한자, すぎる는 히라가나예요.","n":"い형용사의 い를 빼고 すぎる를 붙이면 '너무 ~하다'. 怖い → 怖すぎる."},{"t":"オチ","p":"명사","m":"결말, 이야기의 끝","b":"{落|お}ち","bm":"결말","w":"落ち라는 일본어지만 가타카나로 써요. '이야기의 결말'이라는 특별한 뜻임을 눈에 띄게 하는 표기예요.","n":"落ちる(떨어지다)에서 온 말로, 라쿠고(落語)에서 이야기를 맺는 한마디를 落ち라고 부른 데서 왔어요."},{"t":"ばかり","p":"조사","m":"~만, ~뿐"},{"t":"{浮|う}かんできて","p":"동사","m":"떠올라서","b":"{浮|う}かぶ","bm":"떠오르다","w":"어간 浮는 한자, かんできて는 히라가나예요.","n":"浮かぶ의 て형 浮かんで + くる(~해 오다)의 て형이에요. 생각이 자꾸 떠오르는 느낌이에요."}],"ko":"너무 무서운 결말만 떠올라서","lit":"너무 무서운 / 결말 / 만 / 떠올라 와서","g":[{"k":"〜すぎる","d":"'너무 ~하다'. 怖い → 怖すぎる. 동사에도 써요(食べすぎる = 과식하다)."},{"k":"〜ばかり","d":"'~만, ~뿐'. オチばかり = 결말만."}],"s":"원래 일본어인 オチ를 가타카나로 썼어요. 외래어가 아닌데 가타카나인 말이에요.","c":"용기를 내 봤자 '혼자 착각했다'는 결말뿐일 것 같아 겁이 나요. 그래서 다시 상상 속으로 물러나요."},{"id":"g6","tk":[{"t":"{真|ま}{夏|なつ}","p":"명사","m":"한여름","w":"真(ま)는 '한가운데, 진짜'라는 뜻의 접두사예요. 쿤요미로 まなつ라고 읽어요.","n":"真冬(まふゆ, 한겨울), 真夜中(まよなか, 한밤중)도 같은 真예요."},{"t":"の"},{"t":"{空|そら}","p":"명사","m":"하늘","n":"한국어 '공(空)'과 같은 한자예요. 空(から)로 읽으면 '빈'이에요."},{"t":"の"},{"t":"{下|した}","p":"명사","m":"아래","n":"여기서는 した로 읽어요. 星の下(もと)의 下와 같은 한자예요."},{"t":"で"},{"t":"　"},{"t":"{震|ふる}えながら","p":"동사","m":"떨면서","b":"{震|ふる}える","bm":"떨다","w":"어간 震는 한자, えながら는 히라가나예요.","n":"震(우레 진)은 한국어 '지진(地震)'의 震예요."}],"ko":"한여름 하늘 아래서 떨면서","lit":"한여름 / 의 / 하늘 / 의 / 아래 / 에서 / 떨면서","g":[{"k":"ます형 + ながら","d":"'~하면서'. 震える → 震えながら."}],"s":"下를 여기서는 した로 읽어요. 후렴의 星のもと는 같은 뜻을 もと라고 히라가나로 썼어요.","c":"가장 더운 한여름에 떨고 있다는 모순이에요. 더위가 아니라 두려움과 긴장 때문이라는 게 느껴져요."},{"id":"g7","tk":[{"t":"{君|きみ}"},{"t":"の"},{"t":"{事|こと}","p":"명사","m":"일, 것","w":"'너에 대한 것'처럼 뜻이 옅을 때는 보통 こと로 히라가나로 쓰는데, 여기서는 한자 事를 썼어요.","n":"人 + のこと = '그 사람에 관한 것'. 君のことを考える = 너를 생각하다."},{"t":"を"},{"t":"{考|かんが}えます","p":"동사","m":"생각해요","b":"{考|かんが}える","bm":"생각하다","w":"어간 考는 한자, えます는 히라가나예요.","n":"思う는 마음에 떠오르는 생각, 考える는 머리로 따져 보는 생각이에요."}],"ko":"너를 생각해요","lit":"너 / 의 / 것 / 을 / 생각해요","g":[{"k":"사람 + のこと","d":"일본어는 사람을 생각할 때 君を考える보다 君のことを考える라고 해요. '너에 관한 것'을 생각하는 셈이에요."}],"s":"事를 한자로 썼어요. 같은 뜻이라도 히라가나 こと로 쓰는 경우가 더 많아요.","c":"2절의 笑います처럼 다시 ます형이에요. 떨면서도 담담하게 자기를 해설하는 말투가 우스우면서 애처로워요."},{"id":"g8","tk":[{"t":"{好|す}きな","p":"な형용사","m":"좋아하는","b":"{好|す}き","bm":"좋아함","w":"어간 好는 한자, き는 히라가나예요. 명사 앞에서 な가 붙어요.","n":"2절의 洋楽好き에서는 ずき, 여기서는 すき예요."},{"t":"アイス","p":"명사","m":"아이스크림","w":"영어 ice cream에서 온 アイスクリーム의 줄임말이라 가타카나로 써요.","n":"일본에서는 アイス라고만 하면 대개 아이스크림이에요. 얼음은 氷(こおり)예요."},{"t":"の"},{"t":"{味|あじ}","p":"명사","m":"맛","n":"한국어 '미(味)'와 같은 한자예요. 意味(いみ)에서는 み로 읽어요."},{"t":"は"},{"t":"きっと"}],"ko":"좋아하는 아이스크림 맛은 분명","lit":"좋아하는 / 아이스크림 / 의 / 맛 / 은 / 분명","g":[{"k":"말끝 흐리기","d":"きっと 뒤의 말이 없어요. 문장을 끝맺지 않고 마지막 후렴으로 넘어가요."}],"s":"외래어 줄임말 アイス는 가타카나, 好·味는 한자예요. 첫 줄과 같은 きっと로 끝나
