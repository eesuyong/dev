","p":"동사","m":"생기다","w":"できる를 한자 出来る로 썼어요. 1절 첫 줄 出来るだけ와 같은 표기예요.","n":"出来る는 '할 수 있다'와 '생기다' 두 뜻이 있어요. 여기서는 '생기다'예요. 友達が出来る(친구가 생기다)."},{"t":"けれど"}],"ko":"만날 수 없게 되는 사람도 생기겠지만","lit":"만날 수 없게 / 되는 / 사람 / 도 / 생기다 / 지만","g":[{"k":"〜なくなる","d":"'~하지 않게 되다, ~할 수 없게 되다'. 会えない → 会えなくなる. ない의 い를 く로 바꾸고 なる를 붙여요."},{"k":"{出|で}{来|き}る (생기다)","d":"'할 수 있다' 말고 '생기다'라는 뜻도 있어요. 人も出来る = 사람도 생긴다."}],"c":"졸업이나 이별처럼, 시간이 쌓이면 멀어지는 사람이 생겨요. 1절 Bメロ처럼 けれど로 끝나 후렴으로 넘어가요."}]},{"label":"サビ 2 · 두 번째 후렴","note":"이번에는 옅은 밤, 꿈이 이루어진 환호 속에 숨은 누군가의 비명을 봐요.","lines":[{"id":"f1","tk":[{"t":"{透|す}き{通|とお}る","p":"동사","m":"비쳐 보이는","w":"透(비치다)와 通(통하다) 사이에 き가 끼었어요. 透く + 通る가 합쳐진 복합동사예요.","n":"透き通る는 '속까지 투명하게 비치다'예요. 透き通った水(맑은 물). 通는 한국어 '통(通)'과 같은 한자예요."},{"t":"ほど","p":"조사","m":"~만큼"},{"t":"{淡|あわ}い","p":"い형용사","m":"옅은","w":"어간 淡는 한자, い는 히라가나예요.","n":"淡는 한국어 '담(淡)'이에요. 淡水(たんすい, 담수). 淡い恋(풋사랑)처럼 마음에도 써요."},{"t":"{夜|よる}","p":"명사","m":"밤"},{"t":"に","m":"~에 (때)"}],"ko":"비쳐 보일 만큼 옅은 밤에","lit":"비쳐 보이는 / 만큼 / 옅은 / 밤 / 에","g":[{"k":"〜ほど","d":"'~만큼, ~할 정도로'. 透き通るほど淡い = 비쳐 보일 만큼 옅다. 泣くほど嬉しい(울 만큼 기뻐)."}],"s":"透き通る는 두 한자 사이에 き가 끼는 복합동사예요. 오쿠리가나가 가운데와 끝 두 곳에 있어요.","c":"첫 후렴은 빛나는 아침, 두 번째 후렴은 옅은 밤이에요. 희망이 무너진 아침과 꿈이 이루어진 밤이 짝을 이뤄요."},{"id":"f2","tk":[{"t":"あなた"},{"t":"の"},{"t":"{夢|ゆめ}","p":"명사","m":"꿈","n":"夢는 쿤요미 ゆめ, 온요미 む예요. 夢中(むちゅう, 열중)."},{"t":"が"},{"t":"ひとつ","p":"명사","m":"하나","b":"{一|ひと}つ","bm":"하나","w":"一つ로 쓸 수 있지만 히라가나로 풀어 썼어요. 숫자보다 '꿈 하나'라는 부드러운 느낌이 나요.","n":"ひとつ, ふたつ, みっつ…는 일본 고유의 수 세기예요. 물건 개수를 셀 때 써요."},{"t":"{叶|かな}って","p":"동사","m":"이루어지고","b":"{叶|かな}う","bm":"이루어지다","w":"叶는 조요칸지에 없는 한자라 신문에서는 かなう로 써요. 가사에서는 소원이 이루어진다는 말에 한자 叶를 자주 써요.","n":"叶う(이루어지다, 자동사) ↔ 叶える(이루다, 타동사). 夢が叶う(꿈이 이루어지다), 夢を叶える(꿈을 이루다)."}],"ko":"당신의 꿈이 하나 이루어지고","lit":"당신 / 의 / 꿈 / 이 / 하나 / 이루어지고","g":[{"k":"{夢|ゆめ}が{叶|かな}う","d":"'꿈이 이루어지다'. 叶う는 자동사라 が를 써요. 타동사 叶える는 を를 써요: 夢を叶える."}],"s":"ひとつ는 히라가나, 叶う는 조요칸지 밖의 한자예요. 쉬운 말은 풀고, 뜻이 중요한 말은 한자로 쓴 대비가 보여요.","c":"첫 후렴에서 희망이 무너졌다면, 두 번째 후렴에서는 꿈이 하나 이루어져요. ひとつ라서 모든 꿈이 아니라 그중 하나라는 느낌이 나요."},{"id":"f3","tk":[{"t":"{歓|かん}{声|せい}","p":"명사","m":"환호성","n":"한국어 '환성(歡聲)'과 같은 한자어예요. 歓은 歡의, 声은 聲의 일본식 약자예요."},{"t":"と","m":"~와"},{"t":"{拍|はく}{手|しゅ}","p":"명사","m":"박수","n":"한국어 '박수(拍手)'와 같은 한자어예요. 手를 온요미 しゅ로 읽어요."},{"t":"の"},{"t":"{中|なか}","p":"명사","m":"속, 안"},{"t":"に"}],"ko":"환호와 박수 속에","lit":"환호성 / 과 / 박수 / 의 / 속 / 에","g":[{"k":"〜と〜","d":"명사 + と + 명사 = '~와 ~'. 歓声と拍手 = 환호와 박수. Cメロ의 雑音と足音도 같아요."},{"k":"〜の{中|なか}に","d":"'~속에'. 中는 쿤요미 なか예요."}],"s":"歓声는 声를 せい로 읽어요. 첫 후렴 悲しい声의 声(こえ)와 같은 한자, 다른 읽기예요.","c":"환호와 박수는 이긴 쪽의 소리예요. 대회의 결승 장면처럼 읽을 수 있어요."},{"id":"f4","tk":[{"t":"{誰|だれ}か"},{"t":"の"},{"t":"{悲|ひ}{鳴|めい}","p":"명사","m":"비명","n":"한국어 '비명(悲鳴)'과 같은 한자어예요. 悲를 온요미 ひ로 읽어요."},{"t":"が"},{"t":"{隠|かく}れている","p":"동사","m":"숨어 있어","b":"{隠|かく}れる","bm":"숨다","w":"어간 隠는 한자, れている는 히라가나예요.","n":"隠れる(숨다, 자동사) ↔ 隠す(숨기다, 타동사). かくれんぼ(숨바꼭질)."}],"ko":"누군가의 비명이 숨어 있어","lit":"누군가 / 의 / 비명 / 이 / 숨어 있다","g":[{"k":"〜ている (상태)","d":"隠れる → 隠れている. 숨는 동작이 끝나고 그 상태가 이어지는 '숨어 있다'예요."}],"s":"悲鳴의 悲는 ひ, 悲しい의 悲는 かな예요. 온요미와 쿤요미가 이 곡 안에서 함께 나와요.","c":"누군가의 꿈이 이루어지면, 그 뒤에는 꿈을 잃은 누군가가 있어요. 첫 후렴의 '누군가는 예쁘다고'와 거울처럼 짝을 이루는 줄로 읽혀요."},{"id":"f5","tk":[{"t":"{耐|た}える","p":"동사","m":"견딜","w":"어간 耐는 한자, える는 히라가나예요.","n":"耐(견딜 내)는 한국어 '인내(忍耐)'의 耐예요."},{"t":"{理|り}{由|ゆう}","p":"명사","m":"이유","n":"한국어 '이유(理由)'와 같은 한자어예요. 由를 ゆう로 길게 읽어요."},{"t":"を"},{"t":"{探|さが}しながら","p":"동사","m":"찾으면서","b":"{探|さが}す","bm":"찾다","w":"어간 探는 한자, しながら는 히라가나예요.","n":"探す는 원하는 것을 찾는 것, 捜す는 잃어버린 것을 찾는 것이라고 구별하기도 해요."}],"ko":"견딜 이유를 찾으면서","lit":"견딜 / 이유 / 를 / 찾으면서","g":[{"k":"ます형 + ながら","d":"'~하면서'. 첫 후렴의 歌いながら와 같아요. 探す → 探しながら."}],"c":"이룬 꿈의 무게도, 잃은 꿈의 아픔도 견뎌야 할 때가 있어요. 이유를 '찾는다'는 건 아직 답을 모른다는 뜻이기도 해요."},{"id":"f6","tk":[{"t":"いくつも","p":"부사","m":"몇 개나, 여러 개","w":"한자 幾つ도 있지만 보통 히라가나로 써요.","n":"いくつ(몇 개) + も = 몇 개나. いくつ는 나이를 물을 때도 써요. おいくつですか(몇 살이세요)."},{"t":"{答|こた}え","p":"명사","m":"답","w":"명사인데 오쿠리가나 え가 붙었어요. 동사 答える(대답하다)에서 온 명사라서예요.","n":"答える의 ます형 答え가 그대로 명사가 됐어요."},{"t":"を"},{"t":"{抱|かか}えながら","p":"동사","m":"끌어안은 채","b":"{抱|かか}える","bm":"떠안다, 끌어안다","w":"어간 抱는 한자, えながら는 히라가나예요.","n":"抱는 읽기가 여럿이에요. 抱える(かかえる, 떠안다), 抱く(だく, 안다). Laughter에서도 抱의 여러 읽기를 봤어요."},{"t":"{悩|なや}んで","p":"동사","m":"고민하고","b":"{悩|なや}む","bm":"고민하다","w":"어간 悩는 한자, んで는 히라가나예요.","n":"悩는 惱의 일본식 약자예요. 悩む의 て형은 悩んで(む → んで)예요."}],"ko":"몇 개나 되는 답을 끌어안은 채 고민하고","lit":"몇 개나 / 답 / 을 / 끌어안으면서 / 고민하고","g":[{"k":"む → んで","d":"む로 끝나는 5단 동사의 て형은 んで예요. 悩む → 悩んで, 読む → 読んで."},{"k":"ながら + 동사","d":"抱えながら悩んで = 끌어안은 채 고민하며. ながら 뒤의 동사가 중심 동작이에요."}],"s":"いくつも는 히라가나, 答え는 명사인데 오쿠리가나가 붙은 말이에요. 抱는 Laughter에도 나온 한자로, 여기서는 かかえる로 읽어요.","c":"답이 없어서가 아니라 답이 여럿이라 고민해요. 1절 Bメロ의 '옳음과 옳음'처럼 정답이 하나가 아니라는 생각과 이어져요."},{"id":"f7","tk":[{"t":"あなた"},{"t":"は"},{"t":"{自|じ}{分|ぶん}"},{"t":"を"},{"t":"{知|し}る","p":"동사","m":"알다","w":"어간 知는 한자, る는 히라가나예요.","n":"知る는 る로 끝나지만 5단 동사예요. て형은 知って예요."},{"t":"でしょう"}],"ko":"당신은 자신을 알게 될 거야","lit":"당신 / 은 / 자신 / 을 / 알다 / 겠지","g":[{"k":"〜でしょう","d":"첫 후렴 끝 見るでしょう와 같은 짐작이에요. 知る + でしょう = 알게 되겠지."}],"c":"첫 후렴은 '그것을 보겠지', 두 번째 후렴은 '자신을 알겠지'로 끝나요. 밖의 빛을 보는 데서 내 안을 아는 데로 옮겨 가요."}]},{"label":"Cメロ · 브리지","note":"아무에게도 남지 않는 평범한 오늘에도, 소음 속에서 '나 여기 있어'라고 외치는 목소리가 있어요.","lines":[{"id":"h1","tk":[{"t":"{誰|だれ}"},{"t":"の"},{"t":"{心|こころ}"},{"t":"に"},{"t":"{残|のこ}る","p":"동사","m":"남는","w":"어간 残는 한자, る는 히라가나예요.","n":"残는 殘의 일본식 약자예요. 残る(남다, 자동사) ↔ 残す(남기다, 타동사)."},{"t":"{事|こと}"},{"t":"も"}],"ko":"누구의 마음에 남는 일도","lit":"누구 / 의 / 마음 / 에 / 남는 / 일 / 도","g":[{"k":"{誰|だれ}の〜も + 부정","d":"'누구의 ~도 ~않다'. 다음 줄 끝의 ない까지 이어져요. 誰の心に残る事も(ない) = 누구의 마음에도 남지 않는다."}],"s":"事가 이번에도 한자예요. 다음 줄 焼き付く事も와 나란히 놓여요.","c":"Cメロ는 아무 일도 없는 평범한 날을 그려요. 대회도, 기록도 없는 하루로도 읽혀요."},{"id":"h2","tk":[{"t":"{目|め}","p":"명사","m":"눈"},{"t":"に"},{"t":"{焼|や}き{付|つ}く","p":"동사","m":"새겨지는","w":"焼(굽다)와 付(붙다) 사이에 き가 끼었어요. 焼く + 付く가 합쳐진 복합동사예요.","n":"目に焼き付く = 눈에 새겨지다, 장면이 또렷이 기억에 남다. 心に焼き付く(마음에 새겨지다)처럼도 써요."},{"t":"{事|こと}"},{"t":"も"},{"t":"ない","p":"い형용사","m":"없는","w":"첫 줄의 無い와 같은 형용사인데, 여기서는 히라가나로 썼어요."},{"t":"{今日|きょう}","p":"명사","m":"오늘","w":"今日는 한자 하나하나가 아니라 단어 전체를 きょう로 읽는 주쿠지쿤이에요.","n":"今日를 こんにち로 읽으면 '오늘날'이에요. こんにちは의 こんにち가 이 今日예요."},{"t":"も"}],"ko":"눈에 새겨질 일도 없는 오늘도","lit":"눈 / 에 / 새겨지는 / 일 / 도 / 없는 / 오늘 / 도","g":[{"k":"〜{事|こと}もない","d":"'~하는 일도 없다'. 앞 줄의 残る事も와 이 줄의 焼き付く事も가 함께 ない에 걸려요."},{"k":"{目|め}に{焼|や}き{付|つ}く","d":"'눈에 새겨지다'. 어떤 장면이 잊히지 않게 또렷이 남는 것이에요. 눈에 거슬린다는 뜻이 아니에요."}],"s":"같은 '없다'를 첫 줄은 無い, 여기서는 ない로 썼어요. 事는 이번에도 한자예요. 今日는 주쿠지쿤이에요.","c":"누구의 마음에도, 누구의 눈에도 남지 않는 오늘. 특별한 무대가 없는 날을 가리키는 것으로 읽혀요."},{"id":"h3","tk":[{"t":"{雑|ざつ}{音|おん}","p":"명사","m":"잡음, 소음","n":"한국어 '잡음(雜音)'과 같은 한자어예요. 雑은 雜의 일본식 약자예요."},{"t":"と","m":"~와"},{"t":"{足|あし}{音|おと}","p":"명사","m":"발소리","w":"足(あし)와 音(おと) 모두 쿤요미로 읽어요. 雑音(ざつおん)의 音은 온요미 おん이에요.","n":"音는 쿤요미 おと, 온요미 おん이에요. 같은 줄에 두 읽기가 모두 나와요."},{"t":"の"},{"t":"{奥|おく}","p":"명사","m":"깊은 안쪽","n":"奥는 겉에서 보이지 않는 깊숙한 안쪽이에요. 奥の部屋(안쪽 방)."},{"t":"で","m":"~에서"}],"ko":"잡음과 발소리 그 깊은 곳에서","lit":"잡음 / 과 / 발소리 / 의 / 안쪽 / 에서","g":[{"k":"〜の{奥|おく}で","d":"'~의 깊은 곳에서'. で는 동작이 일어나는 장소예요."}],"s":"雑音(ざつおん)과 足音(あしおと)에 같은 音가 나와요. 하나는 온요미, 하나는 쿤요미예요.","c":"잡음과 발소리는 수많은 사람이 오가는 소리예요. 그 속에 묻혀 들리지 않는 목소리가 있다고 말해요."},{"id":"h4","tk":[{"t":"{私|わたし}","p":"대명사","m":"나","n":"わたし는 남녀 모두 쓰는 기본 1인칭이에요. 私는 한국어 '사(私)'예요(私立 = 사립)."},{"t":"は"},{"t":"ここ","p":"대명사","m":"여기","w":"こ·そ·あ·ど 지시어라 히라가나로 써요. 한자 此処는 거의 쓰지 않아요."},{"t":"だ","p":"조동사","m":"~이다"},{"t":"と"},{"t":"{叫|さけ}んでいる","p":"동사","m":"외치고 있어","b":"{叫|さけ}ぶ","bm":"외치다","w":"어간 叫는 한자, んでいる는 히라가나예요.","n":"ぶ로 끝나는 5단 동사의 て형은 んで예요. 叫ぶ → 叫んで, 遊ぶ → 遊んで."}],"ko":"나는 여기 있다고 외치고 있어","lit":"나 / 는 / 여기 / 이다 / 라고 / 외치고 있다","g":[{"k":"〜だと","d":"인용 '~라고'. ここだ(여기야) + と = 여기라고. 私はここだ = 나는 여기 있어."},{"k":"〜ている (진행)","d":"叫ぶ → 叫んでいる. 지금 외치고 있는 중이에요."}],"c":"곡 전체에서 1인칭 私는 이 줄에만 나와요. 눈에 띄지 않는 하루 속에서도 '나 여기 있어'라고 외치는 목소리예요. 그 목소리가 누구의 것인지는 열려 있어요."}]},{"label":"ラストサビ · 마지막 후렴","note":"첫 후렴을 그대로 되풀이하고, '당신은 그걸 보게 될 거야'를 한 번 더 부르며 끝나요.","lines":[{"same":"c1"},{"same":"c2"},{"same":"c3"},{"same":"c4"},{"same":"c5"},{"same":"c6"},{"same":"c7"},{"same":"c7"}]}]},"aiwo":{"id":"aiwo","title":"{愛|あい}を{伝|つた}えたいだとか","artist":"あいみょん","year":2017,"eyebrow":"あいみょん · 2017","sub":"사랑을 전하고 싶다느니 하는 오글거리는 생각만 하며 소파에 가라앉는 하루. 기다림과 투정이 섞인 아이묭의 초기 싱글.","release":"2017년 5월 3일 · 싱글","lyricist":"あいみょん","composer":"あいみょん","listen":"https://www.youtube.com/results?search_query=%E3%81%82%E3%81%84%E3%81%BF%E3%82%87%E3%82%93+%E6%84%9B%E3%82%92%E4%BC%9D%E3%81%88%E3%81%9F%E3%81%84%E3%81%A0%E3%81%A8%E3%81%8B","intro":"愛を伝えたいだとか는 아이묭이 2017년 5월에 낸 싱글이에요. 석 달 뒤 君はロックを聴かない가 나왔고, 이듬해 マリーゴールド로 이어져요.\n\n화자는 '사랑을 전하고 싶다'느니 하는 오글거리는 생각만 하면서 너를 기다려요. 그러다 소파에 점점 가라앉고, 투덜대고, 또 기다려요. 커튼, 앞머리, 깨진 계란 프라이, 장미, 케이크 같은 집 안의 작은 물건들을 따라 읽어 보세요.","notes":[{"tag":"배경","title":"君はロックを聴かない 석 달 전","body":"2017년 5월 3일에 나온 싱글로, 같은 해 8월의 君はロックを聴かない보다 먼저 나왔어요. 세 곡 모두 '너'를 향한 마음을 노래하지만 장면이 달라요. 이 곡은 혼자 집에서 너를 기다리는 하루예요.\n\n화자가 [[{僕|ぼく}]]이고 말끝에 さ·や를 자주 붙이는 것도 君はロックを聴かない와 같아요."},{"tag":"표기","title":"聞く와 聴く","body":"이 곡은 君の'愛してる'が[[{聞|き}きたい]]처럼 보통의 [[{聞|き}く]]를 써요. 君はロックを聴かない는 음악을 귀 기울여 듣는 [[{聴|き}く]]를 썼죠.\n\n사랑한다는 말을 '듣고 싶다'는 건 음악 감상이 아니라 그냥 귀에 들리는 말이라 聞く가 자연스러워요. 같은 가수가 두 곡에서 한자를 다르게 고른 셈이에요."},{"tag":"표기","title":"馬鹿와 バカ, 薔薇 대신 バラ","body":"1절의 [[{馬鹿|ばか}な{夢|ゆめ}]](바보 같은 꿈)는 한자로, C메로의 [[バカでかい]](엄청 큰)는 가타카나로 썼어요. 같은 말인데 가타카나로 쓰면 더 가볍고 장난스러운 느낌이 나요. 馬鹿는 소리에 맞춰 한자를 빌린 아테지예요.\n\n장미는 한자로 薔薇라고 쓰지만 너무 어려워서 보통 가타카나 [[バラ]]로 써요. [[キリがない]](끝이 없다)의 キリ(切り)도 가타카나로 써서 강조했어요."},{"tag":"표기","title":"조요칸지 밖의 한자들","body":"[[{溢|あふ}れちゃう]](넘쳐 버려), [[{惹|ひ}かれない]](끌리지 않아), [[{雫|しずく}]](물방울)는 조요칸지(일상 글에 쓰도록 정한 한자 목록) 밖의 글자예요. 신문이라면 あふれる, ひかれる, しずく로 풀어 쓸 말이에요.\n\n가사에서는 이런 한자를 골라 써서 글자 모양으로 분위기를 더하기도 해요. 히게단의 繋·想와 같은 습관이에요."},{"tag":"표현","title":"臭いこと, 오글거리는 말","body":"[[{臭|くさ}いこと]]는 글자 그대로는 '냄새나는 것'이지만, 회화에서는 '오글거리는 말, 낯간지러운 말'이라는 뜻으로 써요. 臭いセリフ(오글거리는 대사)처럼요.\n\n사랑을 전하고 싶다느니 하는 생각을 스스로 '臭い'라고 부르며 쑥스러워하는 말투예요. 2절의 [[{腐|くさ}るほど]](썩을 만큼 = 아주 많이)도 같은 くさ 소리가 들어 있어 말장난처럼 들리기도 해요."},{"tag":"표현","title":"사랑의 맛, 辛い·酸っぱい·甘ったるい","body":"1절 B메로는 [[{辛|から}くて]](맵고), [[{酸|す}っぱくて]](시고), [[{甘|あま}ったるかったり]](느끼하게 달기도 하고)처럼 맛 표현을 늘어놓아요. 앞줄의 깨진 계란 프라이에 이어, 사랑이나 하루의 기분을 맛으로 빗댄 것으로 읽혀요.\n\n음식 탭의 '맛과 식감'에서 이 형용사들을 다시 볼 수 있어요."},{"tag":"표현","title":"〜わけでもない, 그런 것도 아니고","body":"[[〜わけでもない]]는 '~인 것도 아니다'라는 말로, 이 곡에 세 번이나 나와요. [[{良|い}い{男|おとこ}になるわけでもない]](좋은 남자가 될 것도 아니고), [[{言|ゆ}うわけでもない]](말하려는 것도 아니고), [[{食|く}いつくわけでもない]](덥석 먹을 것도 아니고).\n\n하고 싶은 걸 하나하나 '그렇다고 뭐가 달라지는 것도 아니고'라며 스스로 접는 말투예요. 화자의 투덜거림과 체념이 이 말에 담겨 있어요."}],"dict":{"{君|きみ}":{"p":"대명사","m":"너","w":"'너'를 뜻하는 대명사로, 한자로 쓰는 게 일반적이에요.","n":"원래 '임금'을 뜻하던 한자예요(君主 = 군주)."},"{僕|ぼく}":{"p":"대명사","m":"나 (남성)","w":"1인칭 대명사로 한자로 쓰는 게 일반적이에요.","n":"아이묭은 君はロックを聴かない처럼 이 곡에서도 화자를 僕로 써요."},"は":{"p":"조사","m":"~은/는 (주제)","n":"조사로 쓸 때는 ha가 아니라 wa로 읽어요."},"が":{"p":"조사","m":"~이/가"},"を":{"p":"조사","m":"~을/를","n":"발음은 お(o)와 같아요."},"に":{"p":"조사","m":"~에, ~에게"},"の":{"p":"조사","m":"~의"},"で":{"p":"조사","m":"~으로, ~에서"},"と":{"p":"조사","m":"~라고 (인용)"},"も":{"p":"조사","m":"~도"},"から":{"p":"조사","m":"~니까"},"さ":{"p":"조사(종조사)","m":"~야, ~말야","n":"문장 끝이나 말 중간에 붙여 가볍게 툭 던지는 말투예요. 이 곡에 아주 많이 나와요."},"や":{"p":"조사(종조사)","m":"~네, ~다 (혼잣말)","n":"문장 끝 や는 혼잣말처럼 가볍게 감정을 털어놓는 말투예요. 간사이 지방 말투로도 자주 들려요."},"よ":{"p":"조사(종조사)","m":"~야, ~할게","n":"상대에게 알리거나 다짐할 때 붙여요."},"な":{"p":"조사(종조사)","m":"~네, ~구나","n":"문장 끝 な는 혼잣말처럼 감탄할 때 붙어요."},"{少|すこ}し":{"p":"부사","m":"조금, 살짝","w":"어간 少는 한자, し는 히라가나예요."},"{男|おとこ}":{"p":"명사","m":"남자","n":"男(사내 남). 女(おんな) = 여자."},"{目|め}":{"p":"명사","m":"눈","n":"한국어 '목(目)'과 같은 한자예요."},"{今日|きょう}":{"p":"명사","m":"오늘","w":"今日는 단어 전체를 きょう로 읽는 주쿠지쿤(熟字訓)이에요."},"{明日|あした}":{"p":"명사","m":"내일","w":"明日는 단어 전체를 あした로 읽는 주쿠지쿤(熟字訓)이에요. 딱딱한 말로는 あす, みょうにち로도 읽어요."},"だんだん":{"p":"부사","m":"점점","w":"부사라 히라가나로 써요(段々).","n":"같은 소리를 두 번 겹친 말이에요. 少しずつ(조금씩)와 비슷해요."},"{夢|ゆめ}":{"p":"명사","m":"꿈","n":"한국어 '몽(夢)'과 같은 한자예요."},"バラ":{"p":"명사","m":"장미","w":"한자로는 薔薇인데 너무 어려워서 보통 가타카나로 써요. 외래어가 아닌데 가타카나로 쓰는 말이에요.","n":"동식물 이름은 가타카나로 쓰는 일이 많아요(ネコ, サクラ)."},"{花|はな}":{"p":"명사","m":"꽃","n":"한국어 '화(花)'와 같은 한자예요. 花火(はなび) = 불꽃놀이."},"{愛|あい}":{"p":"명사","m":"사랑","n":"한 글자 한자어예요(온요미 あい). 恋(こい)보다 깊고 넓은 사랑이에요."},"とりあえず":{"p":"부사","m":"일단, 우선","w":"한자로 取り敢えず라고 쓸 수 있지만 보통 히라가나로 써요.","n":"회화에서 아주 많이 써요. とりあえずビール(일단 맥주부터)는 술자리 첫 주문으로 유명해요."},"わけでもない":{"p":"표현","m":"~인 것도 아니다","w":"わけ(訳, 이유·사정)는 뜻이 옅어진 형식명사라 히라가나로 써요.","n":"わけ + でも + ない. '그렇다고 ~인 것도 아니다'. 이 곡에 세 번 나와요."}},"sections":[{"label":"1절 · Aメロ","note":"상쾌한 아침, 흔들리는 커튼과 들뜬 앞머리. 그런데 계란 프라이는 깨져 버렸어요.","lines":[{"id":"a1","tk":[{"t":"{健康的|けんこうてき}な","p":"な형용사","m":"건강한","b":"{健康的|けんこうてき}","bm":"건강함","w":"한자어 健康에 '~적'을 뜻하는 的를 붙였어요. な는 히라가나예요.","n":"한국어 '건강적'처럼 的를 붙여 な형용사를 만들어요. 積極的(せっきょくてき, 적극적)."},{"t":"{朝|あさ}","p":"명사","m":"아침","n":"한국어 '조(朝)'와 같은 한자예요. 朝ご飯(あさごはん) = 아침밥."},{"t":"だ","p":"조동사","m":"~이다"},{"t":"な"}],"ko":"건강한 아침이네","lit":"건강적인 / 아침 / 이다 / 네","g":[{"k":"〜{的|てき}","d":"한자어 + 的 = '~적'. 명사를 꾸밀 때 な를 붙여요. 健康的な朝(건강한 아침)."}],"s":"健康的은 한국어 '건강'과 같은 한자에 的가 붙은 말이라 한자만 봐도 뜻이 보여요.","c":"첫 줄은 상쾌한 아침 풍경이에요. 그런데 이어지는 줄에서 화자는 이 좋은 아침에 '너'의 말이 듣고 싶다고 해요."},{"id":"a2","tk":[{"t":"こんな","p":"연체사","m":"이런","w":"こんな·そんな·あんな·どんな는 히라가나로 써요."},{"t":"{時|とき}","p":"명사","m":"때","n":"時(때 시). こんな時に = 이럴 때에."},{"t":"に"},{"t":"{君|きみ}"},{"t":"の"},{"t":"“"},{"t":"{愛|あい}してる","p":"동사","m":"사랑해","b":"{愛|あい}する","bm":"사랑하다","w":"한자어 愛에 する를 붙인 동사예요. してる는 している의 회화체예요.","n":"일본어에서 愛してる는 아주 무게 있는 말이라 일상에서는 好き(좋아해)를 더 자주 써요."},{"t":"”"},{"t":"が"},{"t":"{聞|き}きたい","p":"동사","m":"듣고 싶어","b":"{聞|き}く","bm":"듣다","w":"어간 聞는 한자, きたい는 히라가나예요. 君はロックを聴かない의 聴く와 달리 보통의 聞く를 썼어요.","n":"동사 ます형 + たい = '~하고 싶다'. 聞く → 聞きたい."},{"t":"や"}],"ko":"이럴 때 너의 '사랑해'가 듣고 싶어","lit":"이런 / 때 / 에 / 너 / 의 / 사랑해 / 가 / 듣고 싶다 / 네","g":[{"k":"ます형 + たい","d":"'~하고 싶다'. 聞く → 聞きたい, 会う → 会いたい. 듣고 싶은 대상에는 が도 を도 써요."}],"s":"따옴표로 “ ”를 썼어요. 일본어는 보통 「 」를 쓰지만 가사에서는 이렇게 쓰기도 해요. 聞く와 聴く의 차이는 곡 노트를 보세요.","c":"상쾌한 아침이라서 오히려 너의 '사랑해'가 듣고 싶다는 거예요. 화자는 혼자 있어요."},{"id":"a3","tk":[{"t":"{揺|ゆ}れる","p":"동사","m":"흔들리는","w":"어간 揺는 한자, れる는 히라가나예요.","n":"マリーゴールド의 揺れたマリーゴールド와 같은 동사예요."},{"t":"カーテン","p":"명사","m":"커튼","w":"영어 curtain에서 온 외래어라 가타카나로 써요."}],"ko":"흔들리는 커튼","lit":"흔들리는 / 커튼","g":[{"k":"동사 + 명사","d":"동사 사전형이 그대로 명사를 꾸며요. 揺れるカーテン = 흔들리는 커튼."}],"s":"揺れる는 マリーゴールド에도 나온 동사예요. 아이묭 곡에는 바람에 흔들리는 것이 자주 나와요.","c":"창문이 열려 바람이 들어오는 아침 방 안이에요."},{"id":"a4","tk":[{"t":"{少|すこ}し","p":"부사","m":"조금, 살짝","w":"어간 少는 한자, し는 히라가나예요."},{"t":"{浮|う}いた","p":"동사","m":"들뜬, 뜬","b":"{浮|う}く","bm":"뜨다","w":"어간 浮는 한자, いた는 히라가나예요.","n":"浮く → 과거형 浮いた가 명사를 꾸며요. 浮いた前髪 = 붕 뜬 앞머리."},{"t":"{前髪|まえがみ}","p":"명사","m":"앞머리","w":"前(まえ) + 髪(かみ). 髪가 뒤에 붙으며 か가 が로 탁해졌어요(렌다쿠).","n":"髪(머리카락)는 紙(종이)·神(신)과 소리가 같아요."},{"t":"も"}],"ko":"살짝 뜬 앞머리도","lit":"조금 / 뜬 / 앞머리 / 도","g":[{"k":"〜も","d":"'~도'. 다음 줄 すべて(전부)와 이어져 '~도 전부'가 돼요."}],"s":"前髪는 前 + 髪로, 髪의 か가 が로 탁해졌어요. 두 말이 합쳐질 때 뒷말이 탁해지는 렌다쿠예요.","c":"자고 일어나 들뜬 앞머리까지 기분 좋다는 건, 그만큼 느긋하고 좋은 아침이라는 뜻이에요."},{"id":"a5","tk":[{"t":"すべて","p":"명사","m":"전부, 모두","w":"한자로 全て라고도 쓰지만 히라가나로 풀어 썼어요."},{"t":"{心地|ここち}いい","p":"い형용사","m":"기분 좋다, 쾌적하다","b":"{心地|ここち}いい","w":"心地는 단어 전체를 ここち로 읽어요. いい는 히라가나예요.","n":"心(마음) + 地(땅) = 마음의 상태. 心地いい·心地よい = 기분 좋다. 居心地(いごこち) = 머무는 느낌."},{"t":"さ"}],"ko":"전부 기분 좋아","lit":"전부 / 기분 좋다 / 야","g":[{"k":"종조사 さ","d":"문장 끝 さ는 가볍게 툭 던지는 말투예요. 心地いいさ = 기분 좋거든."}],"s":"すべて는 全て라는 한자가 있지만 히라가나로 써서 부드럽게 만들었어요.","c":"커튼도 앞머리도 다 기분 좋다는 평화로운 아침이에요. 다음 줄에서 그 분위기가 살짝 깨져요."},{"id":"a6","tk":[{"t":"それに","p":"접속사","m":"그런데, 게다가","w":"접속사라 히라가나로 써요.","n":"원래는 '게다가'라는 뜻이에요. 여기서는 앞의 좋은 기분에 '그런 와중에'라고 덧붙이는 느낌이에요."},{"t":"{割|わ}れてしまった","p":"동사","m":"깨져 버린","b":"{割|わ}れる","bm":"깨지다","w":"어간 割는 한자, れてしまった는 히라가나예요.","n":"割れる(깨지다, 자동사)와 割る(깨다, 타동사)는 짝이에요."},{"t":"{目|め}{玉|だま}{焼|や}き","p":"명사","m":"계란 프라이 (서니사이드업)","b":"{目|め}{玉|だま}{焼|や}き","w":"目(눈) + 玉(구슬) + 焼き(구이). 玉의 た가 だ로 탁해졌어요.","n":"노른자가 눈알처럼 보여서 '눈알 구이'라는 이름이 붙었어요."}],"ko":"그런데 터져 버린 계란 프라이","lit":"게다가 / 깨져 버린 / 계란 프라이","g":[{"k":"〜てしまう","d":"'~해 버리다'. 원하지 않은 일이 일어났을 때 써요. 割れる → 割れてしまった(깨져 버렸다)."}],"s":"目玉焼き는 한자 세 개에 히라가나 き가 붙어요. 한자만 보면 '눈알 구이'라는 그림이 보여요.","c":"노른자가 터진 계란 프라이예요. 완벽한 아침에 생긴 작은 실패라서 다음 줄의 '재수 없네'로 이어져요."},{"id":"a7","tk":[{"t":"ついてない","p":"동사","m":"운이 없다","b":"つく","bm":"(운이) 따르다","w":"'운이 따르다'라는 뜻일 때는 보통 히라가나로 써요.","n":"ついてる = 운이 좋다, ついてない = 운이 없다. 회화에서 아주 많이 써요."},{"t":"なあ","p":"조사(종조사)","m":"~네, ~구나","n":"な를 길게 늘인 혼잣말 말투예요."}],"ko":"재수 없네","lit":"운이 따르지 않다 / 네","g":[{"k":"ついてる · ついてない","d":"'운이 좋다 · 운이 없다'. 今日はついてない(오늘은 재수 없다)."}],"s":"つく는 붙다(付く), 도착하다(着く), 켜지다(点く) 등 한자가 많은데, '운이 따르다'일 때는 히라가나로 써요.","c":"깨진 계란 프라이 하나로 '오늘 재수 없네' 하고 투덜대는 귀여운 장면이에요."},{"id":"a8","tk":[{"t":"バランス","p":"명사","m":"균형, 밸런스","w":"영어 balance에서 온 외래어라 가타카나로 써요."},{"t":"を"},{"t":"とっても","p":"동사","m":"잡아도","b":"とる","bm":"잡다, 취하다","w":"取る라는 한자가 있지만 히라가나로 썼어요. バランスをとる = 균형을 잡다.","n":"とる → て형 とって + も = '~해도'. 부사 とっても(아주)와 소리가 같으니 앞뒤를 보고 구별해요."},{"t":"{溢|あふ}れちゃう","p":"동사","m":"넘쳐 버려","b":"{溢|あふ}れる","bm":"넘치다","w":"溢는 조요칸지 밖의 한자예요. 보통은 あふれる로 풀어 써요. ちゃう는 てしまう의 회화체예요.","n":"溢れてしまう → 회화체 溢れちゃう. 宿命의 あふれ出す도 같은 동사예요."},{"t":"や"}],"ko":"균형을 잡아도 넘쳐 버려","lit":"균형 / 을 / 잡아도 / 넘쳐 버린다 / 네","g":[{"k":"〜ちゃう (= 〜てしまう)","d":"'~해 버리다'의 회화체. 溢れてしまう → 溢れちゃう, 食べてしまう → 食べちゃう."},{"k":"て형 + も","d":"'~해도'. とる → とっても(잡아도)."}],"s":"溢는 조요칸지 밖의 어려운 한자예요. 宿命에서는 あふれ出す를 히라가나로 썼는데, 이 곡은 한자를 골랐어요.","c":"아무리 마음의 균형을 잡으려 해도 감정이 넘쳐 버린다는 고백으로 읽혀요. 계란 노른자가 넘쳐흐르는 그림과도 겹쳐요."}]},{"label":"1절 · Bメロ","note":"맵고 시고 느끼하게 단 하루. 일단 오늘은 장미에 소원을 담아요.","lines":[{"id":"b1","tk":[{"t":"{少|すこ}し"},{"t":"{辛|から}くて","p":"い형용사","m":"맵고","b":"{辛|から}い","bm":"맵다","w":"어간 辛는 한자, くて는 히라가나예요.","n":"같은 한자 辛い를 つらい로 읽으면 '괴롭다'예요. 여기서는 からい(맵다)예요."},{"t":"　"},{"t":"{少|すこ}し"},{"t":"{酸|す}っぱくて","p":"い형용사","m":"시고","b":"{酸|す}っぱい","bm":"시다","w":"어간 酸는 한자, っぱくて는 히라가나예요.","n":"酸(실 산)은 한국어 '산성(酸性)'의 酸이에요."}],"ko":"조금 맵고 조금 시고","lit":"조금 / 맵고 / 조금 / 시고","g":[{"k":"い형용사 〜くて","d":"い를 くて로 바꾸면 '~하고'. 辛い → 辛くて, 酸っぱい → 酸っぱくて. 형용사를 나란히 이어요."}],"s":"줄 가운데 전각 공백이 노래의 쉼표 역할을 해요. 少し를 두 번 되풀이해 리듬을 맞췄어요.","c":"앞의 계란 프라이에 이어 맛 표현이 이어져요. 사랑이나 하루의 기분을 맛으로 빗댄 것으로 읽혀요."},{"id":"b2","tk":[{"t":"{甘|あま}ったるかったり","p":"い형용사","m":"느끼하게 달기도 하고","b":"{甘|あま}ったるい","bm":"느끼하게 달다","w":"어간 甘는 한자, ったるかったり는 히라가나예요.","n":"甘い(달다)보다 지나치게 달아 질리는 느낌이에요. 〜たり는 '~하기도 하고'."},{"t":"さ"}],"ko":"느끼하게 달기도 하고 말야","lit":"느끼하게 달기도 하고 / 말야","g":[{"k":"〜たり","d":"과거형 た + り = '~하기도 하고'. 甘ったるかった → 甘ったるかったり. 여러 가지를 예로 들 때 써요."}],"s":"甘ったるい는 甘 한 글자 뒤에 히라가나가 길게 붙는 형용사예요. 소리만으로도 끈적하게 단 느낌이 나요.","c":"맵고, 시고, 너무 단 것까지. 좋기만 하지 않은 하루, 또는 사랑의 여러 맛으로 읽혀요."},{"id":"b3","tk":[{"t":"とりあえず"},{"t":"{今日|きょう}"},{"t":"は"}],"ko":"일단 오늘은","lit":"일단 / 오늘 / 은","g":[{"k":"とりあえず","d":"'일단, 우선'. 다른 건 제쳐 두고 먼저 하나 할 때 써요."}],"s":"とりあえず는 取り敢えず라는 한자가 있지만 보통 히라가나로 써요.","c":"복잡한 생각은 일단 접어 두고, 오늘 할 일을 정하는 말이에요. 2절에도 똑같이 나와요."},{"id":"b4","tk":[{"t":"バラ"},{"t":"の"},{"t":"{花|はな}"},{"t":"に"},{"t":"{願|ねが}い","p":"명사","m":"소원","b":"{願|ねが}い","w":"어간 願는 한자, い는 히라가나예요. 동사 願う(바라다)의 ます형이 명사가 됐어요.","n":"お願いします의 願와 같은 한자예요."},{"t":"{込|こ}めて","p":"동사","m":"담아","b":"{込|こ}める","bm":"담다, 넣다","w":"어간 込는 한자, めて는 히라가나예요.","n":"願いを込める = 소원을 담다, 心を込める = 마음을 담다. 込는 일본에서 만든 한자(국자)예요."},{"t":"さ"}],"ko":"장미꽃에 소원을 담아서 말야","lit":"장미 / 의 / 꽃 / 에 / 소원 / 담아 / 말야","g":[{"k":"〜を{込|こ}める","d":"'~를 담다'. 이 줄은 願いを込めて에서 を가 빠졌어요. 가사에서는 조사를 자주 줄여요."}],"s":"バラ는 한자 薔薇가 어려워서 가타카나로 쓰는 대표적인 말이에요. 외래어가 아닌데 가타카나인 말이에요.","c":"장미꽃 한 송이에 소원을 담는 건 조금 낭만적인 행동이에요. 다음 줄에서 스스로 '바보 같은 꿈'이라고 불러요."},{"id":"b5","tk":[{"t":"{馬鹿|ばか}な","p":"な형용사","m":"바보 같은","b":"{馬鹿|ばか}","bm":"바보, 어리석음","w":"馬鹿는 소리에 맞춰 한자를 빌린 아테지예요. C메로에서는 같은 말을 가타카나 バカ로 써요.","n":"馬(말) + 鹿(사슴)으로, 글자 뜻과는 상관없이 소리만 빌렸어요."},{"t":"{夢|ゆめ}"},{"t":"で"},{"t":"{踊|おど}ろう","p":"동사","m":"춤추자","b":"{踊|おど}る","bm":"춤추다","w":"어간 踊는 한자, ろう는 히라가나예요.","n":"君はロックを聴かない의 踊ろうよ와 같은 말이에요."}],"ko":"바보 같은 꿈속에서 춤추자","lit":"바보 같은 / 꿈 / 에서 / 춤추자","g":[{"k":"의지형 〜おう","d":"'~하자'. 踊る → 踊ろう. 君はロックを聴かない의 乾いたメロディで踊ろうよ와 같아요."}],"s":"馬鹿는 한자, 뒤의 バカでかい는 가타카나예요. 같은 말을 다른 문자로 써서 느낌을 바꿨어요.","c":"君はロックを聴かない에서도 '춤추자'고 했어요. 아이묭의 초기 곡에서 춤은 마음을 들뜨게 하는 상상으로 자주 나와요."}]},{"label":"サビ · 후렴","note":"사랑을 전하고 싶다느니 오글거리는 생각만 하며 소파에 가라앉아요. 그래도 서두르지 않고 기다려요.","lines":[{"id":"c1","tk":[{"t":"{愛|あい}"},{"t":"を"},{"t":"{伝|つた}えたい","p":"동사","m":"전하고 싶다","b":"{伝|つた}える","bm":"전하다","w":"어간 伝는 한자, えたい는 히라가나예요.","n":"伝える(전하다, 타동사)와 伝わる(전해지다, 자동사)는 짝이에요. 伝는 傳의 일본식 약자예요."},{"t":"だとか","p":"조사","m":"~라느니, ~라든가","n":"だ + とか. 예를 늘어놓으며 '~라느니 하는'처럼 조금 낮춰 말해요."}],"ko":"사랑을 전하고 싶다느니","lit":"사랑 / 을 / 전하고 싶다 / 라느니","g":[{"k":"〜だとか","d":"'~라느니, ~라든가'. 앞의 말을 예로 들며 살짝 비꼬거나 쑥스러워하는 말투예요."}],"s":"곡 제목이 그대로 나오는 줄이에요. 愛·伝 두 한자에 나머지는 히라가나예요.","c":"사랑을 전하고 싶다는 말을 스스로 だとか(~라느니)로 깎아내려요. 진지한 마음을 쑥스러워하는 말투예요."},{"id":"c2","tk":[{"t":"{臭|くさ}い","p":"い형용사","m":"오글거리는","w":"어간 臭는 한자, い는 히라가나예요. 가타카나로 クサい라고 쓰기도 해요.","n":"원래 '냄새나다'인데, 회화에서는 '오글거리다, 낯간지럽다'라는 뜻으로도 써요."},{"t":"こと","p":"형식명사","m":"것","w":"뜻이 옅어진 형식명사라 히라가나로 써요."},{"t":"ばっか","p":"조사","m":"~만, ~뿐","n":"ばかり의 회화체예요. 臭いことばっか = 오글거리는 것만."},{"t":"{考|かんが}えて","p":"동사","m":"생각하고","b":"{考|かんが}える","bm":"생각하다","w":"어간 考는 한자, えて는 히라가나예요."},{"t":"{待|ま}ってても","p":"동사","m":"기다리고 있어도","b":"{待|ま}つ","bm":"기다리다","w":"어간 待는 한자, ってても는 히라가나예요.","n":"待っていても의 회화체예요. 待つ → 待って + いて + も."}],"ko":"오글거리는 생각만 하며 기다려 봐도","lit":"오글거리는 / 것 / 만 / 생각하고 / 기다리고 있어도","g":[{"k":"〜ばっか (= ばかり)","d":"'~만, ~뿐'. 회화에서는 ばっか로 줄여요. C메로의 事ばかり와 같은 말이에요."}],"s":"ばっか(회화체)와 C메로의 ばかり(본래 꼴)가 한 곡에 같이 나와요.","c":"사랑을 전하는 멋진 말을 상상만 하면서 기다리는 화자예요. 스스로도 '오글거린다'고 알고 있어요."},{"id":"c3","tk":[{"t":"だんだん"},{"t":"ソファ","p":"명사","m":"소파","w":"영어 sofa에서 온 외래어라 가타카나로 써요. ソファー라고 장음을 붙이기도 해요."},{"t":"に"},{"t":"{沈|しず}んでいく","p":"동사","m":"가라앉아 가는","b":"{沈|しず}む","bm":"가라앉다","w":"어간 沈는 한자, んでいく는 히라가나예요.","n":"沈む + ていく(~해 가다). 해가 지는 것도 日が沈む라고 해요."},{"t":"だけ","p":"조사","m":"~뿐"}],"ko":"점점 소파에 가라앉아 갈 뿐","lit":"점점 / 소파 / 에 / 가라앉아 간다 / 뿐","g":[{"k":"〜ていく","d":"'~해 가다'. 지금부터 앞으로 변해 가는 모습이에요. 沈んでいく = 가라앉아 가다."}],"s":"ソファ는 君はロックを聴かない의 メロディ처럼 장음 ー 없이 썼어요.","c":"생각만 하다가 몸이 소파에 푹 꺼져 들어가는 모습이에요. 기다림이 길어지는 시간이 그려져요."},{"id":"c4","tk":[{"t":"{僕|ぼく}"},{"t":"が"},{"t":"{明日|あした}"},{"t":"{良|い}い","p":"い형용사","m":"좋은","w":"良い는 よい와 いい 두 가지로 읽어요. 이 노래에서는 いい로 불러요.","n":"いい는 활용할 때 よ-로 돌아가요(よくない, よかった)."},{"t":"{男|おとこ}","p":"명사","m":"남자","n":"男(사내 남). 女(おんな) = 여자."},{"t":"に"},{"t":"なる","p":"동사","m":"되다","w":"なる는 보통 히라가나로 써요."},{"t":"わけでもない"},{"t":"から"},{"t":"さ"}],"ko":"내가 내일 좋은 남자가 되는 것도 아니니까 말야","lit":"나 / 가 / 내일 / 좋은 / 남자 / 가 / 되다 / 것도 아니다 / 니까 / 말야","g":[{"k":"〜わけでもない","d":"'~인 것도 아니다'. 僕が明日良い男になるわけでもない = 내가 내일 갑자기 좋은 남자가 되는 것도 아니다."},{"k":"〜になる","d":"'~이 되다'. 조사 に를 써요."}],"s":"良い를 いい로 읽었어요. 같은 한자를 よい로 읽기도 해서 루비를 보고 확인해요.","c":"애써 봤자 하루아침에 멋진 사람이 되는 건 아니니까, 하고 스스로를 달래는 말이에요."},{"id":"c5","tk":[{"t":"{焦|あせ}らずに","p":"동사","m":"서두르지 않고","b":"{焦|あせ}る","bm":"조급해하다, 서두르다","w":"어간 焦는 한자, らずに는 히라가나예요.","n":"〜ずに = 〜ないで(~하지 않고). 焦る는 る로 끝나는 5단 동사예요. 君はロックを聴かない의 焦がれる와 같은 한자예요."},{"t":"いる","p":"보조동사","m":"있다","w":"보조로 쓰는 いる는 히라가나로 써요."},{"t":"よ"}],"ko":"조급해하지 않고 있을게","lit":"서두르지 않고 / 있다 / 할게","g":[{"k":"〜ずに","d":"'~하지 않고'. ないで의 조금 딱딱한 꼴이에요. 焦らずに = 서두르지 않고, 食べずに = 먹지 않고."}],"s":"焦는 '타다'라는 뜻의 한자예요. 焦る(조급하다), 焦がれる(애태우다), 焦げる(눋다) 모두 마음이나 물건이 '타는' 그림이에요.","c":"앞줄에서 스스로를 달랜 뒤, 조급해하지 않겠다고 다짐해요. 그래도 마음은 다음 줄의 질문으로 이어져요."},{"id":"c6","tk":[{"t":"{今日|きょう}"},{"t":"は"},{"t":"{日|ひ}","p":"명사","m":"해","n":"日는 '날'도 되고 '해'도 돼요. 日が落ちる = 해가 지다."},{"t":"が"},{"t":"{落|お}ちる","p":"동사","m":"지는, 떨어지는","w":"어간 落는 한자, ちる는 히라가나예요.","n":"落ちる(떨어지다, 자동사)와 落とす(떨어뜨리다, 타동사)는 짝이에요."},{"t":"{頃|ころ}","p":"명사","m":"무렵","n":"頃(ころ) = 무렵, 쯤. 숫자 뒤에서는 ごろ(三時ごろ, 3시쯤)."},{"t":"に"},{"t":"{会|あ}える","p":"동사","m":"만날 수 있다","b":"{会|あ}う","bm":"만나다","w":"어간 会는 한자, える는 히라가나예요.","n":"会う → 가능형 会える(만날 수 있다)."},{"t":"の","p":"조사(종조사)","m":"~거야?","n":"문장 끝 の를 올려 말하면 부드러운 질문이 돼요."},{"t":"？"}],"ko":"오늘은 해 질 무렵에 만날 수 있어?","lit":"오늘 / 은 / 해 / 가 / 지는 / 무렵 / 에 / 만날 수 있다 / 거야","g":[{"k":"문장 끝 の (질문)","d":"회화에서 문장 끝에 の를 붙여 올려 말하면 '~거야?'라는 부드러운 질문이에요. 会えるの? = 만날 수 있어?"}],"s":"日는 날(日曜日)도 해(日が落ちる)도 돼요. 이 줄에서는 '해'예요.","c":"서두르지 않겠다고 해 놓고 바로 '오늘 저녁엔 만날 수 있어?'라고 물어요. 참지 못하는 마음이 귀엽게 드러나요."}]},{"label":"2절 · Aメロ","note":"'완벽한 남자엔 끌리지 않아'라며 웃던 너가 분하고, 할 말은 잔뜩인데 외로워요.","lines":[{"id":"d1","tk":[{"t":"“"},{"t":"{完璧|かんぺき}な","p":"な형용사","m":"완벽한","b":"{完璧|かんぺき}","bm":"완벽함","w":"뜻을 담은 한자어라 한자로 쓰고, な는 히라가나예요.","n":"한국어 '완벽(完璧)'과 같은 한자어예요. 璧(구슬 벽)을 壁(벽)으로 잘못 쓰기 쉬워요."},{"t":"{男|おとこ}"},{"t":"に"},{"t":"なんて","p":"조사","m":"~같은 건","n":"앞의 말을 가볍게 낮춰 불러요. 君はロックを聴かない의 なんか와 비슷해요."},{"t":"{惹|ひ}かれない","p":"동사","m":"끌리지 않아","b":"{惹|ひ}かれる","bm":"끌리다, 매혹되다","w":"惹는 조요칸지 밖의 한자예요. 보통 ひかれる로 풀어 쓰거나 引かれる로 써요.","n":"惹かれる는 마음이 이끌리는 것, 引かれる는 물리적으로 끌려가는 것에 주로 써요."},{"t":"”"},{"t":"と"}],"ko":"'완벽한 남자 같은 덴 끌리지 않아'라며","lit":"완벽한 / 남자 / 에게 / 같은 건 / 끌리지 않는다 / 라고","g":[{"k":"〜になんて","d":"に + なんて = '~ 같은 데에는'. 完璧な男になんて惹かれない = 완벽한 남자 같은 덴 끌리지 않아."}],"s":"惹는 조요칸지 밖의 한자예요. 마음이 '이끌린다'는 뜻을 살리려고 引 대신 골랐어요.","c":"너가 했던 말이에요. 화자는 이 말이 위로인지 놀림인지 몰라 다음 줄에서 '분하다'고 해요."},{"id":"d2","tk":[{"t":"{君|きみ}"},{"t":"が"},{"t":"{笑|わら}ってた","p":"동사","m":"웃고 있었다","b":"{笑|わら}う","bm":"웃다","w":"어간 笑는 한자, ってた는 히라가나예요.","n":"笑っていた의 회화체예요."},{"t":"から"},{"t":"{悔|くや}しい","p":"い형용사","m":"분하다","w":"어간 悔는 한자, しい는 히라가나예요.","n":"져서 분하거나 억울할 때 써요. 한국어 '분하다·약 오르다'에 가까워요."},{"t":"や"}],"ko":"네가 웃고 있었으니까 분해","lit":"너 / 가 / 웃고 있었다 / 니까 / 분하다 / 네","g":[{"k":"〜てた (= 〜ていた)","d":"'~하고 있었다'의 회화체. 笑っていた → 笑ってた."}],"s":"悔しい는 悔(뉘우칠 회) 한 글자에 しい가 붙는 형용사예요.","c":"완벽하지 않은 나라서 오히려 좋다는 말 같기도 한데, 웃으며 말하니 약이 올라요. 귀여운 투정이에요."},{"id":"d3","tk":[{"t":"{腐|くさ}る","p":"동사","m":"썩다","w":"어간 腐는 한자, る는 히라가나예요.","n":"腐るほど = 썩을 만큼 = 남아돌 만큼 많이. 후렴의 臭い(くさい)와 소리가 닮았어요."},{"t":"ほど","p":"조사","m":"~만큼"},{"t":"に"},{"t":"{話|はな}したい","p":"동사","m":"이야기하고 싶은","b":"{話|はな}す","bm":"이야기하다","w":"어간 話는 한자, したい는 히라가나예요."},{"t":"こと","p":"형식명사","m":"것","w":"뜻이 옅어진 형식명사라 히라가나로 써요."},{"t":"{沢山|たくさん}","p":"부사","m":"잔뜩, 많이","w":"沢山은 소리에 맞춰 한자를 빌린 아테지예요. 보통은 たくさん으로 히라가나로 써요."},{"t":"ある","p":"동사","m":"있다","w":"ある는 보통 히라가나로 써요."},{"t":"のに","p":"조사","m":"~는데 (아쉬움)","n":"기대와 다를 때 아쉬움을 담아 '~는데'. 話したいことがあるのに = 할 말이 있는데."},{"t":"な"}],"ko":"썩을 만큼 하고 싶은 얘기가 잔뜩 있는데","lit":"썩다 / 만큼 / 에 / 이야기하고 싶은 / 것 / 잔뜩 / 있다 / 는데 / 네","g":[{"k":"〜ほど","d":"'~할 만큼'. 腐るほど = 썩을 만큼(아주 많이), 泣くほど嬉しい = 울 만큼 기뻐."},{"k":"〜のに","d":"'~는데'(아쉬움). 할 말은 많은데 너가 없다는 아쉬움이에요."}],"s":"沢山은 보통 히라가나 たくさん으로 쓰는 말인데 한자로 썼어요. 沢(못)·山(산)의 뜻과는 상관없는 아테지예요.","c":"썩을 만큼 많은 이야기, 과장된 표현이에요. 다음 줄에서 그 마음이 '외로워'로 정리돼요."},{"id":"d4","tk":[{"t":"{寂|さび}しい","p":"い형용사","m":"외롭다, 쓸쓸하다","w":"어간 寂는 한자, しい는 히라가나예요.","n":"君はロックを聴かない의 寂しそうな君(쓸쓸해 보이는 너)과 같은 말이에요."},{"t":"さ"}],"ko":"외로워","lit":"외롭다 / 야","g":[{"k":"い형용사 + さ","d":"종조사 さ를 붙여 담담하게 말해요. 寂しいさ = 외롭거든."}],"s":"한 단어짜리 줄이에요. 寂しい 뒤의 さ가 쓸쓸함을 덤덤하게 들려줘요.","c":"君はロックを聴かない에서는 '너'가 쓸쓸해 보였는데, 이 곡에서는 화자가 외로워요."},{"id":"d5","tk":[{"t":"{結局|けっきょく}","p":"명사","m":"결국","n":"한국어 '결국(結局)'과 같은 한자어예요. Pretender에도 나왔어요."},{"t":"の"},{"t":"ところ","p":"형식명사","m":"점, 바","w":"'곳'의 所를 뜻이 옅어진 형식명사로 써서 히라가나로 썼어요.","n":"結局のところ = 결국에는, 따지고 보면."},{"t":"{君|きみ}"},{"t":"は"},{"t":"さ"}],"ko":"결국 너는 말야","lit":"결국 / 의 / 바 / 너 / 는 / 말야","g":[{"k":"{結局|けっきょく}のところ","d":"'결국에는, 따지고 보면'. 結局만 써도 되지만 のところ를 붙여 말을 고르는 느낌이 나요."}],"s":"말 중간의 さ는 '있잖아' 하고 잠깐 숨을 고르는 말투예요.","c":"외로움이 투정으로 바뀌는 순간이에요. 다음 두 줄에서 너에게 직접 따져 물어요."},{"id":"d6","tk":[{"t":"どう","p":"부사","m":"어떻게","w":"こう·そう·ああ·どう 같은 지시어는 히라가나로 써요."},{"t":"したい","p":"동사","m":"하고 싶다","b":"する","bm":"하다","w":"する는 히라가나로 써요."},{"t":"の","p":"조사(종조사)","m":"~거야?"},{"t":"？"}],"ko":"어떻게 하고 싶은 거야?","lit":"어떻게 / 하고 싶다 / 거야","g":[{"k":"どうしたいの?","d":"'어떻게 하고 싶은 거야?'. 상대의 속마음을 묻는 말이에요."}],"s":"한자가 하나도 없는 줄이에요. 짧고 직접적인 질문이라 히라가나만으로 날카롭게 들려요.","c":"앞줄 結局のところ君はさ에 이어지는 질문이에요."},{"id":"d7","tk":[{"t":"まじで","p":"부사","m":"진짜로, 정말로","w":"한자 真面目에서 온 속어라 히라가나나 가타카나(マジで)로 써요.","n":"젊은 사람들이 많이 쓰는 속어예요. マリーゴールド의 真面目(まじめ)와 같은 뿌리예요."},{"t":"{僕|ぼく}"},{"t":"に"},{"t":"{愛|あい}される","p":"동사","m":"사랑받을","b":"{愛|あい}する","bm":"사랑하다","w":"愛する의 수동형이에요. される는 히라가나예요.","n":"する → される(~당하다, ~받다). 僕に愛される = 나에게 사랑받다."},{"t":"{気|き}","p":"명사","m":"마음, 생각","n":"〜する気 = ~할 생각. 行く気がない(갈 생각이 없다)."},{"t":"あんの","p":"동사","m":"있는 거야?","b":"ある","bm":"있다","w":"あるの를 회화에서 줄여 あんの로 썼어요. 히라가나로만 써요.","n":"る가 ん으로 바뀌는 건 편한 회화체예요. わかるの → わかんの."},{"t":"？"}],"ko":"진짜로 나한테 사랑받을 마음은 있는 거야?","lit":"진짜로 / 나 / 에게 / 사랑받을 / 마음 / 있는 거야","g":[{"k":"수동형 〜される","d":"する → される. 愛される = 사랑받다. ~에게 받을 때는 に를 써요(僕に愛される)."},{"k":"あんの (= あるの)","d":"る가 ん으로 바뀐 회화체예요. 아주 편한 말투라 친구끼리만 써요."}],"s":"まじで는 真面目에서 온 말이에요. 같은 한자어가 マリーゴールド에서는 真面目に(진지하게), 이 곡에서는 속어 まじで(진짜로)로 나와요.","c":"투정의 절정이에요. 사랑받을 마음이 있긴 한 거냐고 따지지만, 그만큼 사랑받고 싶다는 말이기도 해요."}]},{"label":"2절 · Bメロ","note":"창가에 떨어지는 물방울. 일단 오늘은 불을 일찍 끄고 아무래도 좋은 꿈을 꾸기로 해요.","lines":[{"id":"e1","tk":[{"t":"{雫|しずく}","p":"명사","m":"물방울","w":"雫는 조요칸지 밖의 한자예요. 보통 しずく로 풀어 쓰거나 滴로 써요.","n":"雨(비) 아래 下(아래)를 붙인 모양으로, 빗방울이 떨어지는 그림 같은 글자예요."},{"t":"が"},{"t":"{落|お}ちてる","p":"동사","m":"떨어지고 있어","b":"{落|お}ちる","bm":"떨어지다","w":"어간 落는 한자, ちてる는 히라가나예요.","n":"落ちている의 회화체예요. 후렴의 日が落ちる와 같은 동사예요."}],"ko":"물방울이 떨어지고 있어","lit":"물방울 / 이 / 떨어지고 있다","g":[{"k":"〜てる (= 〜ている)","d":"'~하고 있다'의 회화체. 落ちている → 落ちてる."}],"s":"雫는 雨 밑에 下가 붙은 글자라 모양만 봐도 물방울이 떨어지는 그림이에요.","c":"다음 줄과 이어 읽으면 창가, 눈가, 꽃에서 물방울이 떨어지는 장면이에요. 눈가의 물방울은 눈물로도 읽혀요."},{"id":"e2","tk":[{"t":"{窓際|まどぎわ}","p":"명사","m":"창가","w":"窓(まど) + 際(きわ). 際가 뒤에 붙으며 き가 ぎ로 탁해졌어요(렌다쿠).","n":"際(가 제)는 '가장자리'예요. 같은 줄의 目の際(めのきわ)는 탁해지지 않았어요."},{"t":"{目|め}"},{"t":"の"},{"t":"{際|きわ}","p":"명사","m":"가장자리","n":"目の際 = 눈가. 앞의 窓際(まどぎわ)와 같은 한자예요."},{"t":"お{気|き}に{入|い}り","p":"명사","m":"마음에 듦, 좋아하는 것","w":"気(き)와 入(い) 두 한자 사이와 뒤에 히라가나가 붙었어요. 앞의 お는 공손하게 만드는 말이에요.","n":"気に入る(마음에 들다)에서 온 명사예요. お気に入りの花 = 아끼는 꽃."},{"t":"の"},{"t":"{花|はな}"}],"ko":"창가에, 눈가에, 아끼는 꽃에","lit":"창가 / 눈 / 의 / 가장자리 / 마음에 드는 / 의 / 꽃","g":[{"k":"명사 나열","d":"조사 없이 명사를 늘어놓아 장면을 차례로 비춰요. 窓際、目の際、お気に入りの花."}],"s":"같은 際를 窓際에서는 ぎわ, 目の際에서는 きわ로 읽어요. 바로 붙으면 탁해지고(렌다쿠), の가 사이에 있으면 탁해지지 않아요.","c":"창가의 빗방울, 눈가의 눈물, 꽃의 물방울을 차례로 보여 줘요. 1절의 장미와 이어져 '아끼는 꽃'이 나와요."},{"same":"b3"},{"id":"e4","tk":[{"t":"{部屋|へや}","p":"명사","m":"방","w":"部屋는 단어 전체를 へや로 읽는 주쿠지쿤(熟字訓)이에요."},{"t":"の"},{"t":"{明|あ}かり","p":"명사","m":"불빛, 조명","b":"{明|あ}かり","w":"어간 明는 한자, かり는 히라가나예요.","n":"明るい(밝다)와 같은 한자예요. 明かりを消す = 불을 끄다."},{"t":"{早|はや}めに","p":"부사","m":"일찌감치, 조금 일찍","w":"早(이를 조)에 '조금 ~하게'라는 め와 に가 붙었어요.","n":"早めに = 평소보다 조금 일찍. 多めに(조금 많이)도 같은 꼴이에요."},{"t":"{消|け}して","p":"동사","m":"끄고","b":"{消|け}す","bm":"끄다, 지우다","w":"어간 消는 한자, して는 히라가나예요.","n":"消す(끄다, 타동사)와 消える(꺼지다, 자동사)는 짝이에요."},{"t":"さ"}],"ko":"방 불을 일찌감치 끄고 말야","lit":"방 / 의 / 불빛 / 일찌감치 / 끄고 / 말야","g":[{"k":"〜めに","d":"'조금 ~하게'. 早めに(조금 일찍), 多めに(조금 많이), 少なめに(조금 적게)."}],"s":"明かり는 明 한 글자에 かり가 붙어요. 明るい(あかるい, 밝다)와 같은 읽기예요.","c":"1절은 장미에 소원을 담았는데, 2절은 일찍 불을 끄고 잠들기로 해요. 기다리다 지친 하루의 끝이에요."},{"id":"e5","tk":[{"t":"どうでもいい","p":"표현","m":"아무래도 좋은, 시시한","w":"どう + でも + いい가 굳은 말이라 히라가나로 써요.","n":"'어찌 되든 상관없는'. どうでもいいこと = 하찮은 일."},{"t":"{夢|ゆめ}"},{"t":"を"},{"t":"{見|み}よう","p":"동사","m":"꾸자","b":"{見|み}る","bm":"보다, (꿈을) 꾸다","w":"어간 見는 한자, よう는 히라가나예요.","n":"夢を見る = 꿈을 꾸다. 한국어는 '꾸다', 일본어는 '보다'예요."}],"ko":"아무래도 좋은 꿈이나 꾸자","lit":"아무래도 좋은 / 꿈 / 을 / 보자","g":[{"k":"{夢|ゆめ}を{見|み}る","d":"'꿈을 꾸다'. 일본어는 꿈을 '본다'고 해요."}],"s":"1절은 馬鹿な夢(바보 같은 꿈), 2절은 どうでもいい夢(아무래도 좋은 꿈)예요. 꿈 앞의 말만 바꿔 같은 틀을 이었어요.","c":"1절에서는 꿈속에서 춤추자고 했는데, 2절에서는 그냥 아무 꿈이나 꾸자고 해요. 기운이 조금 빠진 모습이에요."}]},{"label":"サビ 2 · 두 번째 후렴","note":"내일은 둘이서 보내고 싶다고 생각해도 문은 열리지 않아요. 점점 센치해질 뿐이에요.","lines":[{"id":"f1","tk":[{"t":"{明日|あした}"},{"t":"は"},{"t":"{2人|ふたり}","p":"명사","m":"둘","b":"{二人|ふたり}","bm":"두 사람","w":"보통은 二人로 쓰는데 아라비아 숫자 2를 썼어요. 읽기는 ふたり 그대로예요.","n":"マリーゴールド에도 2人가 나와요. 아이묭이 즐겨 쓰는 표기예요."},{"t":"で"},{"t":"{過|す}ごしたい","p":"동사","m":"보내고 싶다","b":"{過|す}ごす","bm":"(시간을) 보내다","w":"어간 過는 한자, ごしたい는 히라가나예요.","n":"過ごす = 시간을 보내다. 楽しく過ごす(즐겁게 보내다)."},{"t":"なんて","p":"조사","m":"~라느니, ~같은 걸","n":"앞의 생각을 가볍게 가리켜요. 쑥스러운 마음이 담겨요."}],"ko":"내일은 둘이서 보내고 싶다느니","lit":"내일 / 은 / 둘 / 이서 / 보내고 싶다 / 라느니","g":[{"k":"〜で (인원)","d":"사람 수 + で = '~이서'. 2人で(둘이서), 一人で(혼자서)."}],"s":"2人를 아라비아 숫자로 썼어요. マリーゴールド와 같은 표기예요.","c":"첫 후렴의 愛を伝えたいだとか가 '내일은 둘이서 보내고 싶다느니'로 바뀌었어요. 바람이 더 구체적이에요."},{"id":"f2","tk":[{"t":"{考|かんが}えていても","p":"동사","m":"생각하고 있어도","b":"{考|かんが}える","bm":"생각하다","w":"어간 考는 한자, えていても는 히라가나예요."},{"t":"ドア","p":"명사","m":"문","w":"영어 door에서 온 외래어라 가타카나로 써요.","n":"일본식 미닫이문은 戸(と)나 扉(とびら)라고 해요."},{"t":"は"},{"t":"{開|あ}かない","p":"동사","m":"열리지 않아","b":"{開|あ}く","bm":"열리다","w":"어간 開는 한자, かない는 히라가나예요.","n":"開く(열리다, 자동사)와 開ける(열다, 타동사)는 짝이에요."},{"t":"し","p":"조사","m":"~하고 (게다가)","n":"이유를 늘어놓을 때 '~하고'. 다음 줄로 이어져요."}],"ko":"생각하고 있어도 문은 열리지 않고","lit":"생각하고 있어도 / 문 / 은 / 열리지 않는다 / 하고","g":[{"k":"〜し","d":"'~하고(게다가)'. 이유나 사정을 늘어놓을 때 써요. ドアは開かないし = 문은 안 열리고."}],"s":"ドア는 외래어라 가타카나, 開かない는 한자 + 히라가나예요.","c":"아무리 생각해도 너가 문을 열고 들어오지는 않아요. 기다림이 계속돼요."},{"id":"f3","tk":[{"t":"だんだん"},{"t":"おセンチ","p":"な형용사","m":"센치함, 감상적","w":"영어 sentimental을 줄인 センチ(가타카나)에 공손하게 만드는 お(히라가나)를 붙였어요. 한 단어에 히라가나와 가타카나가 섞였어요.","n":"조금 옛날 말투예요. センチメンタル(센티멘털)을 장난스럽게 줄인 말이에요."},{"t":"に"},{"t":"なる","p":"동사","m":"되다"},{"t":"だけ","p":"조사","m":"~뿐"},{"t":"だ","p":"조동사","m":"~이다"},{"t":"{僕|ぼく}"},{"t":"は"}],"ko":"점점 센치해질 뿐이야, 나는","lit":"점점 / 센치 / 하게 / 되다 / 뿐 / 이다 / 나 / 는","g":[{"k":"도치 (말 순서 바꾸기)","d":"원래 순서는 僕はだんだんおセンチになるだけだ. 僕は를 뒤로 보내 '나는 말이야'처럼 덧붙였어요."}],"s":"おセンチ는 히라가나 お + 가타카나 センチ예요. 한 단어 안에서 문자가 바뀌는 재미있는 말이에요.","c":"첫 후렴은 '소파에 가라앉을 뿐', 두 번째는 '센치해질 뿐'이에요. 몸에 이어 마음까지 가라앉아요."},{"id":"f4","tk":[{"t":"{愛|あい}"},{"t":"が"},{"t":"{何|なん}","p":"대명사","m":"무엇","n":"何은 뒤 소리에 따라 なに 또는 なん으로 읽어요."},{"t":"だとか","p":"조사","m":"~라느니"},{"t":"{言|ゆ}う","p":"동사","m":"말하다","b":"{言|い}う","bm":"말하다","w":"사전형은 いう라고 쓰지만, 실제 발음은 ゆう에 가까워서 노래도 ゆう로 불러요.","n":"言う는 글자로는 いう, 소리로는 ゆう예요. 그래서 한글 발음도 '유우'예요."},{"t":"わけでもない"},{"t":"けど","p":"조사","m":"~지만"}],"ko":"사랑이 뭐라느니 말하려는 것도 아니지만","lit":"사랑 / 이 / 무엇 / 이라느니 / 말하다 / 것도 아니다 / 지만","g":[{"k":"〜わけでもないけど","d":"'~인 것도 아니지만'. 후렴의 良い男になるわけでもない와 같은 말이에요."}],"s":"言う는 쓸 때는 いう, 말할 때는 ゆう예요. 글자와 소리가 다른 대표적인 말이에요.","c":"사랑에 대해 거창하게 말하려는 건 아니라고 한 발 물러서요. 다음 줄에서 진짜 마음이 나와요."},{"id":"f5","tk":[{"t":"ただ","p":"부사","m":"그저, 다만","w":"부사라 히라가나로 써요."},{"t":"{切|せつ}ない","p":"い형용사","m":"애달프다, 가슴이 저리다","w":"切(せつ)는 한자, ない는 히라가나예요. 부정의 ない가 아니라 형용사의 일부예요.","n":"그립고 아프고 안타까운 마음이 섞인 말로, 한국어로 딱 맞는 말이 없어요. 노래 가사에 아주 많이 나와요."},{"t":"と"},{"t":"{言|い}えば","p":"동사","m":"말하면","b":"{言|い}う","bm":"말하다","w":"어간 言는 한자, えば는 히라가나예요."},{"t":"キリ","p":"명사","m":"끝, 한도","b":"{切|き}り","bm":"끝","w":"切り를 가타카나로 써서 강조했어요. キリがない = 끝이 없다.","n":"같은 줄의 切ない와 같은 한자 切인데, 한쪽은 한자, 한쪽은 가타카나로 썼어요."},{"t":"が"},{"t":"ない","p":"い형용사","m":"없다","w":"ない는 히라가나로 써요."},{"t":"くらい","p":"조사","m":"~정도"},{"t":"なんだ","p":"조동사","m":"~인 거야","n":"な + んだ. 설명하거나 강조하는 말끝이에요."}],"ko":"그저 애달프다고 말하자면 끝이 없을 정도야","lit":"그저 / 애달프다 / 라고 / 말하면 / 끝 / 이 / 없다 / 정도 / 인 거야","g":[{"k":"〜と{言|い}えば","d":"'~라고 말하면'. 言う → 가정형 言えば."},{"k":"キリがない","d":"'끝이 없다'. 一つ一つ言えばキリがない(하나하나 말하면 끝이 없어)."}],"s":"切ない(한자)와 キリ(가타카나)에 같은 切가 숨어 있어요. 한 줄 안에서 같은 글자를 다르게 표기했어요.","c":"거창한 사랑 얘기는 아니라면서도, 애달픈 마음은 말하자면 끝이 없다는 고백이에요."},{"id":"f6","tk":[{"t":"もう","p":"부사","m":"이제, 정말","w":"부사라 히라가나로 써요."},{"t":"{嫌|いや}だ","p":"な형용사","m":"싫어","b":"{嫌|いや}","bm":"싫음","w":"어간 嫌는 한자, だ는 히라가나예요.","n":"嫌い(きらい, 싫어하다)와 같은 한자예요. もう嫌だ = 이제 싫어, 못 해 먹겠어."}],"ko":"이제 싫어","lit":"이제 / 싫다","g":[{"k":"もう + 감정","d":"'이제 정말 ~'. もう嫌だ(이제 싫어), もう無理(이제 무리야)."}],"s":"嫌는 いや(싫음)와 きらい(싫어함) 두 가지로 읽어요. 여기서는 いや예요.","c":"애달픔이 쌓여 '이제 싫어'라고 터져요. 다음 C메로에서 투정이 이어져요."}]},{"label":"Cメロ · 브리지","note":"촛불, 엄청 큰 케이크도 소용없다며 치사한 생각만 해요. 오늘은 장미꽃도 없어요.","lines":[{"id":"g1","tk":[{"t":"ろうそく","p":"명사","m":"초, 양초","w":"한자로 蝋燭라고 쓰지만 너무 어려워서 보통 히라가나로 써요."},{"t":"{炊|た}いて","p":"동사","m":"피우고","b":"{炊|た}く","bm":"(밥을) 짓다","w":"보통 초나 불을 피울 때는 焚く(たく)를 쓰는데, 이 곡은 밥을 지을 때 쓰는 炊く로 썼어요.","n":"炊く(밥을 짓다)와 焚く(불을 때다)는 소리가 같아요. 원문 표기를 그대로 따랐어요."}],"ko":"촛불을 켜고","lit":"양초 / 피우고","g":[{"k":"を 빠짐","d":"원래는 ろうそくを炊いて예요. 가사에서는 조사를 자주 줄여요."}],"s":"炊く와 焚く는 둘 다 たく예요. 보통 촛불에는 焚く를 써서, 이 곡의 炊く는 눈에 띄는 표기예요.","c":"촛불을 켜고 기념일처럼 꾸미는 장면이에요. 다음 줄에서 케이크까지 나와요."},{"id":"g2","tk":[{"t":"バカでかい","p":"い형용사","m":"엄청나게 큰","w":"馬鹿(바보)를 가타카나 バカ로 써서 '엄청'이라는 강조로 썼어요. 1절의 馬鹿な夢은 한자였어요.","n":"バカ + でかい(크다). バカ는 앞에 붙어 '엄청'이라는 강조가 돼요(バカ正直, 바보처럼 정직)."},{"t":"ケーキ","p":"명사","m":"케이크","w":"영어 cake에서 온 외래어라 가타카나로 써요."},{"t":"が"},{"t":"あっても","p":"동사","m":"있어도","b":"ある","bm":"있다","w":"ある는 보통 히라가나로 써요."}],"ko":"엄청나게 큰 케이크가 있어도","lit":"엄청 큰 / 케이크 / 가 / 있어도","g":[{"k":"て형 + も","d":"'~해도'. ある → あっても(있어도)."}],"s":"같은 ばか를 1절에서는 한자 馬鹿, 여기서는 가타카나 バカ로 썼어요. 가타카나가 더 가볍고 장난스러워요.","c":"아무리 크게 준비해도 소용없다는 투정이에요."},{"id":"g3","tk":[{"t":"{君|きみ}"},{"t":"が"},{"t":"{食|く}いつく","p":"동사","m":"덥석 달려들다","w":"食(く)와 つく 사이에 い가 끼었어요. 食う(먹다, 거친 말) + 付く가 합쳐진 말이에요.","n":"음식에 덥석 달려들거나, 이야기·제안에 크게 관심을 보이는 것도 食いつく라고 해요."},{"t":"わけでもない"},{"t":"だろう","p":"조동사","m":"~겠지","n":"추측의 말끝이에요. 정중하게는 でしょう."}],"ko":"네가 덥석 좋아할 것도 아니겠지","lit":"너 / 가 / 덥석 달려들다 / 것도 아니다 / 겠지","g":[{"k":"〜わけでもないだろう","d":"'~인 것도 아니겠지'. わけでもない + だろう(추측)."}],"s":"食う는 食べる보다 거친 말이에요. 食(く)를 食べる에서는 た로 읽어요.","c":"케이크를 준비해도 너가 기뻐할 것 같지 않다며 미리 실망해요. 화자의 자신 없는 마음이 보여요."},{"id":"g4","tk":[{"t":"{情|なさ}けない","p":"い형용사","m":"한심한","w":"情(なさ)는 한자, けない는 히라가나예요. 부정의 ない가 아니라 형용사의 일부예요.","n":"情(뜻 정)에서 온 말이지만 지금은 '한심하다, 꼴사납다'예요."},{"t":"ずるい","p":"い형용사","m":"치사한, 교활한","w":"한자 狡い가 있지만 거의 안 써서 히라가나로 써요."},{"t":"{事|こと}","p":"명사","m":"일, 것","w":"보통 형식명사 こと는 히라가나로 쓰는데, 여기서는 한자 事로 썼어요."},{"t":"ばかり","p":"조사","m":"~만"},{"t":"を"}],"ko":"한심하고 치사한 생각만","lit":"한심한 / 치사한 / 일 / 만 / 을","g":[{"k":"〜ばかり","d":"'~만'. 후렴의 ばっか가 원래 꼴 ばかり로 나왔어요."}],"s":"후렴은 臭いこと(히라가나), 여기는 ずるい事(한자)예요. 같은 こと를 한 곡 안에서 다르게 썼어요.","c":"케이크를 준비하면서도 '어차피 안 좋아하겠지' 같은 치사한 생각만 해요. 스스로도 한심하다고 알아요."},{"id":"g5","tk":[{"t":"{考|かんが}えてしまう","p":"동사","m":"생각해 버리는","b":"{考|かんが}える","bm":"생각하다","w":"어간 考는 한자, えてしまう는 히라가나예요."},{"t":"{今日|きょう}"},{"t":"は"}],"ko":"생각해 버리는 오늘은","lit":"생각해 버리는 / 오늘 / 은","g":[{"k":"〜てしまう","d":"'~해 버리다'. 원하지 않는데 그렇게 되는 일이에요. 1절의 割れてしまった와 같아요."}],"s":"앞 줄과 한 문장이에요. 情けないずるい事ばかりを考えてしまう今日は = 한심하고 치사한 생각만 해 버리는 오늘은.","c":"그런 생각을 '해 버리는' 날이라서, 다음 줄에서 장미꽃도 없다고 해요."},{"id":"g6","tk":[{"t":"バラ"},{"t":"の"},{"t":"{花|はな}"},{"t":"も"},{"t":"ない","p":"い형용사","m":"없다","w":"ない는 히라가나로 써요."},{"t":"よ"}],"ko":"장미꽃도 없어","lit":"장미 / 의 / 꽃 / 도 / 없다 / 야","g":[{"k":"〜もない","d":"'~도 없다'. バラの花もない = 장미꽃도 없어."}],"s":"1절의 バラの花に願い込めて(장미꽃에 소원을 담아)와 짝이에요. 장미가 있다가 없어졌어요.","c":"1절에서는 장미에 소원을 담았는데, 오늘은 그 장미조차 없어요. 기대가 꺾인 하루예요."},{"id":"g7","tk":[{"t":"{汚|よご}れてる","p":"동사","m":"더러워진","b":"{汚|よご}れる","bm":"더러워지다","w":"어간 汚는 한자, れてる는 히라가나예요.","n":"汚れている의 회화체예요. 같은 汚를 汚い(きたない, 더럽다)로도 읽어요."},{"t":"シャツ","p":"명사","m":"셔츠","w":"영어 shirt에서 온 외래어라 가타카나로 써요."},{"t":"に"},{"t":"{履|は}き{慣|な}れた","p":"동사","m":"오래 입어 익숙한","b":"{履|は}き{慣|な}れる","bm":"신어(입어) 익숙해지다","w":"履(신다)와 慣(익숙하다) 두 한자 사이에 き가 끼었어요. 履く + 慣れる가 합쳐진 복합동사예요.","n":"바지·신발은 履く(はく)를 써요. 윗옷은 着る(きる)."},{"t":"ジーパン","p":"명사","m":"청바지","w":"jeans + pants를 일본에서 줄여 만든 외래어(일본식 영어)라 가타카나로 써요.","n":"요즘은 ジーンズ, デニム이라고도 해요."},{"t":"で"}],"ko":"더러워진 셔츠에 오래 입은 청바지 차림으로","lit":"더러워진 / 셔츠 / 에 / 입어 익숙한 / 청바지 / 로","g":[{"k":"{履|は}く · {着|き}る","d":"아래에 입는 것(바지·신발)은 履く, 위에 입는 것(셔츠)은 着る. 한국어 '입다·신다'와 나누는 방식이 달라요."}],"s":"ジーパン은 영어에 없는 일본식 영어예요. 가타카나로 써도 진짜 영어와는 다른 말이 있어요.","c":"멋진 옷이 아니라 평소 차림 그대로예요. 꾸미지 않은 내 모습으로 너를 기다린다는 장면이 마지막 후렴으로 이어져요."}]},{"label":"ラストサビ · 마지막 후렴","note":"첫 후렴을 그대로 다시 불러요. 그래도 오늘 저녁엔 만날 수 있냐고 물으며 끝나요.","lines":[{"same":"c1"},{"same":"c2"},{"same":"c3"},{"same":"c4"},{"same":"c5"},{"same":"c6"}]}]},"kimirock":{"id":"kimirock","title":"{君|きみ}はロックを{聴|き}かない","artist":"あいみょん","year":2017,"eyebrow":"あいみょん · 2017","sub":"록 같은 건 듣지 않을 너에게, 그래도 내가 들어 온 노래들을 들려주고 싶은 마음을 담은 곡. 아이묭의 3번째 싱글.","release":"2017년 8월 2일 · 3번째 싱글 · 앨범 『青春のエキサイトメント』(2017) 수록","tieIn":"없음","lyricist":"あいみょん","composer":"あいみょん","listen":"https://www.youtube.com/results?search_query=%E3%81%82%E3%81%84%E3%81%BF%E3%82%87%E3%82%93+%E5%90%9B%E3%81%AF%E3%83%AD%E3%83%83%E3%82%AF%E3%82%92%E8%81%B4%E3%81%8B%E3%81%AA%E3%81%84","intro":"君はロックを聴かない는 아이묭이 2017년 8월에 낸 3번째 싱글이에요. 같은 해 9월에 나온 첫 앨범 『青春のエキサイトメント』에도 실렸어요. 이듬해의 マリーゴールド보다 한 해 앞선 곡이에요.\n\n화자는 쓸쓸해 보이는 '너'에게 레코드를 틀어 주며 마음을 전하려 해요. 너는 록 같은 건 듣지 않을 거라고 생각하면서도, 내가 그 노래들로 사랑을 견뎌 왔다는 걸 알아주길 바라요. 레코드, 바늘, 심장 박동 같은 '소리'에 관한 말을 따라 읽어 보세요.","notes":[{"tag":"배경","title":"마리골드 한 해 전의 곡","body":"2017년 8월에 나온 3번째 싱글로, 드라마나 광고 주제가는 아니었어요. 같은 해 9월 첫 정규 앨범 『青春のエキサイトメント』(청춘의 익사이트먼트)에 실렸어요.\n\n2018년의 マリーゴールド와 함께 아이묭의 초기 대표곡으로 자주 꼽혀요. 두 곡 모두 '너'를 향한 마음을 노래하지만, 마리골드가 여름 풍경이라면 이 곡은 방 안에서 레코드를 트는 장면이에요."},{"tag":"표기","title":"聞く가 아니라 聴く","body":"'듣다'는 보통 [[{聞|き}く]]로 써요. 이 곡은 제목부터 끝까지 [[{聴|き}く]]를 써요. 聴는 귀를 기울여 주의 깊게 듣는다는 느낌의 한자라, 음악을 감상할 때 자주 골라 써요(音楽を聴く).\n\n소리는 둘 다 きく예요. 같은 소리에 뜻에 맞는 한자를 골라 쓰는 건 マリーゴールド의 写る(映る가 아니라)와 같은 방식이에요."},{"tag":"표기","title":"가타카나 의성어와 숫자·알파벳","body":"[[フツフツ]](보글보글), [[ダラダラ]](줄줄)는 소리나 모양을 흉내 내는 말이에요. 보통 히라가나 ふつふつ, だらだら로 쓰는데, 일부러 가타카나로 써서 소리가 또렷하고 거칠게 튀어나오는 느낌을 줘요.\n\n2절에는 [[BPM]]과 [[190]]처럼 알파벳과 숫자가 그대로 나와요. 읽을 때는 ビーピーエム, ひゃくきゅうじゅう예요. 숫자를 섞어 쓰는 건 マリーゴールド의 2人와도 이어져요."},{"tag":"문화","title":"ドーナツ盤과 바늘","body":"[[ドーナツ{盤|ばん}]](도넛판)은 가운데 구멍이 크게 뚫린 작은 레코드판이에요. 생긴 모양이 도넛 같아서 붙은 이름이에요. 주로 싱글곡 한두 곡을 담았어요.\n\n[[{針|はり}を{落|お}とす]](바늘을 떨어뜨리다)는 턴테이블의 바늘을 레코드 위에 내려놓아 음악을 트는 동작이에요. 먼지투성이 레코드를 진지하게 트는 모습에서, 오래 아껴 온 노래를 꺼내 들려주는 장면이 그려져요."},{"tag":"표현","title":"〜なんか, 낮춰 부르는 말","body":"[[ロックなんか]]의 なんか는 '~같은 건, ~따위'라는 뜻으로, 앞의 말을 가볍게 낮춰 불러요. 君はロックなんか聴かない = '너는 록 같은 건 안 듣잖아'.\n\n화자가 정말 록을 낮게 보는 게 아니라, 너는 이런 걸 좋아하지 않을 거라는 체념과 쑥스러움이 섞인 말투로 읽혀요."},{"tag":"표현","title":"ぜ·ぞ·のかい, 거친 말끝","body":"[[{止|と}めすぎたぜ]], [[なったぞ]], [[{気|き}づくのかい]], [[{笑|わら}うんだい]]의 말끝 ぜ·ぞ·かい·だい는 주로 남성이 쓰는 거친 말투예요. 1인칭도 [[{僕|ぼく}]]예요.\n\n아이묭은 여성 싱어송라이터지만 이 곡처럼 僕와 남성적인 말투로 가사를 쓰기도 해요. 화자를 남자 아이로 볼 수도 있고, 성별과 상관없이 솔직하고 거친 말투를 고른 것으로 볼 수도 있어요."},{"tag":"표현","title":"目が泳ぐ","body":"[[{泳|およ}ぐ{目|め}]](헤엄치는 눈)는 관용 표현 [[{目|め}が{泳|およ}ぐ]]에서 왔어요. 당황하거나 거짓말을 할 때 눈동자가 이리저리 흔들리는 모습을 '눈이 헤엄친다'고 해요.\n\n한국어로는 '눈이 흔들리다', '눈을 피하다'에 가까워요. 앞의 嘘みたいに(거짓말처럼)와 이어져, 웃음을 들킨 너의 당황한 눈빛이 그려져요."}],"dict":{"{君|きみ}":{"p":"대명사","m":"너","w":"'너'를 뜻하는 대명사로, 한자로 쓰는 게 일반적이에요.","n":"원래 '임금'을 뜻하던 한자예요(君主 = 군주). 지금은 가까운 사이에서 부르는 '너'예요."},"{僕|ぼく}":{"p":"대명사","m":"나 (남성)","w":"1인칭 대명사로 한자로 쓰는 게 일반적이에요.","n":"僕는 부드럽고 소년 같은 느낌의 1인칭이에요. 여성 작사가가 노래 속 화자로 僕를 쓰는 일도 많아요."},"は":{"p":"조사","m":"~은/는 (주제)","n":"조사로 쓸 때는 ha가 아니라 wa로 읽어요."},"が":{"p":"조사","m":"~이/가"},"を":{"p":"조사","m":"~을/를","n":"현대 일본어에서 を는 이 조사에만 쓰는 글자예요. 발음은 お(o)와 같아요."},"に":{"p":"조사","m":"~에게, ~에"},"の":{"p":"조사","m":"~의"},"で":{"p":"조사","m":"~으로"},"と":{"p":"조사","m":"~라고 (인용)"},"よ":{"p":"조사(종조사)","m":"~자, ~해 (권유·강조)","n":"문장 끝 よ는 상대에게 말을 건네며 힘을 주는 말이에요."},"ぜ":{"p":"조사(종조사)","m":"~다고, ~지 (거친 말투)","n":"주로 남성이 쓰는 거친 말끝이에요. 친구에게 툭 던지듯 말하는 느낌이에요."},"ロック":{"p":"명사","m":"록 (음악)","w":"영어 rock에서 온 외래어라 가타카나로 써요. 작은 ッ가 들어가 '록쿠'로 읽어요.","n":"ロックンロール(로큰롤)의 줄임말이에요. 한국어 '록'과 같은 말이에요."},"なんか":{"p":"조사","m":"~같은 건, ~따위","n":"앞의 말을 가볍게 낮춰 불러요. ロックなんか = 록 같은 건. 회화에서 아주 많이 써요."},"{聴|き}かない":{"p":"동사","m":"듣지 않아","b":"{聴|き}く","bm":"(음악 등을) 듣다","w":"보통 '듣다'는 聞く인데, 귀 기울여 듣는 느낌의 聴를 골라 썼어요. 음악을 들을 때 자주 쓰는 한자예요.","n":"聞く와 聴く는 둘 다 きく예요. 聴는 한국어 '청(聽)'의 일본식 약자예요(청취 = 聴取)."},"{少|すこ}し":{"p":"부사","m":"조금","w":"어간 少는 한자, し는 히라가나예요."},"{近|ちか}づいて":{"p":"동사","m":"다가와","b":"{近|ちか}づく","bm":"다가가다, 가까워지다","w":"近(가까울 근)은 한자, づいて는 히라가나예요. 近 + 付く(つく)가 합쳐지며 つ가 づ로 탁해졌어요(렌다쿠).","n":"近い(가깝다)와 같은 한자예요. 近づく의 て형이 近づいて예요."},"ほしくて":{"p":"보조형용사","m":"~해 주길 바라서","b":"ほしい","bm":"~해 주길 바라다","w":"'~해 주길 바라다'라는 보조 뜻일 때는 欲しい 대신 히라가나 ほしい로 써요.","n":"동사 て형 + ほしい = '~해 줬으면 좋겠다'. 끝의 くて는 '~해서'라는 이유예요."},"こんな":{"p":"연체사","m":"이런","w":"こんな·そんな·あんな·どんな 같은 지시어는 히라가나로 써요."},"あんな":{"p":"연체사","m":"저런, 그런","w":"こんな·そんな·あんな·どんな 같은 지시어는 히라가나로 써요.","n":"あんな는 눈앞에 없거나 지난 일을 가리켜요. こんな歌であんな歌で = 이런 노래로, 저런 노래로."},"{歌|うた}":{"p":"명사","m":"노래","n":"歌う(うたう)는 '노래하다'예요. 한국어 '가(歌)'와 같은 한자예요(가요 = 歌謡)."},"{思|おも}う":{"p":"동사","m":"생각해","w":"어간 思는 한자, う는 히라가나예요."},"けれども":{"p":"조사","m":"~지만","n":"けど·けれど보다 길고 또박또박한 말이에요. 같은 곡 안에 けど도 나와요."},"{恋|こい}":{"p":"명사","m":"사랑","n":"恋(こい)는 설레고 애타는 연애 감정, 愛(あい)는 더 깊고 넓은 사랑이에요."},"{青春|せいしゅん}":{"p":"명사","m":"청춘","n":"한국어 '청춘(靑春)'과 같은 한자어예요. 青는 靑의 일본식 자체예요. 앨범 제목 『青春のエキサイトメント』에도 들어 있어요."},"{音|おと}":{"p":"명사","m":"소리","n":"音楽(おんがく, 음악)에서는 おん으로 읽어요. 혼자 쓰면 おと예요."},"{乾|かわ}いた":{"p":"동사","m":"메마른","b":"{乾|かわ}く","bm":"마르다","w":"어간 乾는 한자, いた는 히라가나예요.","n":"乾く(마르다)의 과거형 乾いた가 명사를 꾸미면 '마른, 메마른'이 돼요. 목이 마를 때는 渇く(かわく)를 써요."},"メロディ":{"p":"명사","m":"멜로디, 선율","w":"영어 melody에서 온 외래어라 가타카나로 써요. メロディー처럼 장음을 붙여 쓰기도 하는데, 이 곡은 ー 없이 メロディ로 썼어요.","n":"외래어 끝의 장음 ー는 붙이기도 하고 빼기도 해요. コンピューター/コンピュータ처럼요."}},"sections":[{"label":"1절 · Aメロ","note":"쓸쓸해 보이는 너를 위해 서툰 깜짝 선물처럼 먼지 쌓인 레코드를 꺼내 틀어요.","lines":[{"id":"a1","tk":[{"t":"{少|すこ}し"},{"t":"{寂|さび}しそうな","p":"い형용사","m":"쓸쓸해 보이는","b":"{寂|さび}しい","bm":"쓸쓸하다, 외롭다","w":"어간 寂는 한자, しそうな는 히라가나예요. 寂しい의 い를 빼고 そうだ(~해 보이다)를 붙였어요.","n":"寂(고요할 적)는 한국어 '적막(寂寞)'의 寂예요. 淋しい(さびしい)로 쓰기도 해요."},{"t":"{君|きみ}"},{"t":"に"}],"ko":"조금 쓸쓸해 보이는 너에게","lit":"조금 / 쓸쓸해 보이는 / 너 / 에게","g":[{"k":"い형용사 + そうだ","d":"'~해 보이다'(겉모습을 보고 하는 짐작). 寂しい → 寂しそうだ, おいしい → おいしそうだ. 명사를 꾸밀 때는 寂しそうな君."}],"s":"寂しい는 어간 한자 하나 뒤에 긴 히라가나가 붙는 형용사예요. 그 뒤에 そうな까지 이어져서, 한 단어에 한자는 寂 하나뿐이에요.","c":"첫 줄부터 화자는 너를 '쓸쓸해 보인다'고 바라봐요. 그래서 노래를 들려주려는 이유가 생겨요."},{"id":"a2","tk":[{"t":"こんな"},{"t":"{歌|うた}"},{"t":"を"},{"t":"{聴|き}かせよう","p":"동사","m":"들려줘야지","b":"{聴|き}かせる","bm":"들려주다","w":"제목과 같은 聴를 써서 '귀 기울여 들려주다'라는 느낌을 살렸어요.","n":"聴く(듣다)의 사역형이 聴かせる(듣게 하다 = 들려주다)예요. 의지형 聴かせよう는 '들려줘야지'."}],"ko":"이런 노래를 들려줄게","lit":"이런 / 노래 / 를 / 들려주자","g":[{"k":"사역형 〜せる","d":"5단 동사 끝 う단을 あ단으로 바꾸고 せる를 붙이면 '~하게 하다'. 聴く → 聴かせる(듣게 하다 = 들려주다)."},{"k":"의지형 〜よう","d":"1단 동사는 る를 빼고 よう. 聴かせる → 聴かせよう(들려주자, 들려줘야지)."}],"s":"聴く는 이 곡에서 계속 나와요. 귀를 기울여 듣는 聴를 골라 '음악을 듣는다'는 장면을 분명히 했어요.","c":"こんな歌(이런 노래)는 화자가 아끼는 노래예요. 뒤에서 그게 록이라는 게 드러나요."},{"id":"a3","tk":[{"t":"{手|て}","p":"명사","m":"손","n":"한국어 '수(手)'와 같은 한자예요. 혼자 쓰면 て로 읽어요."},{"t":"を"},{"t":"{叩|たた}く","p":"동사","m":"치는, 두드리는","w":"어간 叩는 한자, く는 히라가나예요. 叩는 2010년에 조요칸지에 들어간 글자예요.","n":"手を叩く = 손뼉을 치다. ドアを叩く(문을 두드리다)."},{"t":"{合図|あいず}","p":"명사","m":"신호","w":"合(あい)와 図(ず)를 이어 읽는 한자어예요.","n":"合図する = 신호를 보내다. 図는 圖의 일본식 약자예요."}],"ko":"손뼉을 치는 신호","lit":"손 / 을 / 치는 / 신호","g":[{"k":"동사 + 명사","d":"동사 사전형이 그대로 명사를 꾸며요. 手を叩く合図 = 손뼉을 치는 신호."}],"s":"合図는 한자 두 개를 あい + ず로 읽어요. 한국어 한자음(합도)으로는 짐작하기 어려운 말이라 따로 외워 두면 좋아요.","c":"노래를 시작하는 신호로 손뼉을 쳐요. 다음 줄의 '엉성한 서프라이즈'로 이어지는, 쑥스럽고 서툰 시작이에요."},{"id":"a4","tk":[{"t":"{雑|ざつ}な","p":"な형용사","m":"엉성한, 대충인","b":"{雑|ざつ}","bm":"엉성함, 조잡함","w":"뜻을 담은 한자어라 한자로 쓰고, な는 히라가나예요.","n":"한국어 '잡(雜)'의 일본식 약자예요(잡지 = 雑誌). 雑に扱う(함부로 다루다)."},{"t":"サプライズ","p":"명사","m":"서프라이즈, 깜짝 선물","w":"영어 surprise에서 온 외래어라 가타카나로 써요."}],"ko":"엉성한 서프라이즈","lit":"엉성한 / 서프라이즈","g":[{"k":"な형용사 + 명사","d":"雑 + な + サプライズ. な형용사는 명사를 꾸밀 때 な가 붙어요."}],"s":"한자어 雑와 외래어 サプライズ가 나란히 놓였어요. 한자 하나, 히라가나 하나, 가타카나 다섯 글자로 된 짧은 줄이에요.","c":"준비가 엉성하다는 걸 스스로 알고 있어요. 그래도 해 보는 게 다음 줄의 '내 나름의 최선'이에요."},{"id":"a5","tk":[{"t":"{僕|ぼく}"},{"t":"なり","p":"접미사","m":"~나름","w":"뜻이 옅어진 접미사라 히라가나로 써요.","n":"명사 + なり = '~나름'. 僕なりの = 내 나름의, 自分なりに = 내 나름대로."},{"t":"の"},{"t":"{精一杯|せいいっぱい}","p":"명사","m":"최선, 힘껏","n":"精(정성 정) + 一杯(한 잔, 가득). '힘을 가득 담아'라는 뜻이에요. 精一杯頑張る(힘껏 노력하다)."}],"ko":"내 나름의 최선","lit":"나 / 나름 / 의 / 최선","g":[{"k":"〜なりの","d":"'~나름의'. 僕なりの精一杯 = 내 나름대로 할 수 있는 최선."}],"s":"精一杯는 せい + いっ + ぱい로 읽어요. 一杯(いっぱい)가 붙으면서 작은 っ와 ぱ가 생겼어요. 한글로는 '세이잇파이'예요.","c":"엉성해도 이게 지금 내가 할 수 있는 전부라는 말이에요. 서툴지만 진심인 화자의 모습이에요."},{"id":"a6","tk":[{"t":"{埃|ほこり}まみれ","p":"명사","m":"먼지투성이","b":"{埃|ほこり}まみれ","w":"埃는 조요칸지 밖의 한자예요. 보통 ほこり로 풀어 쓰지만, 여기서는 한자를 골라 먼지가 쌓인 모습을 또렷하게 보여 줘요. まみれ는 히라가나예요.","n":"명사 + まみれ = '~투성이'. 汗まみれ(땀투성이), 泥まみれ(진흙투성이)."},{"t":"　"},{"t":"ドーナツ{盤|ばん}","p":"명사","m":"도넛판 (작은 레코드판)","w":"외래어 ドーナツ(도넛)는 가타카나, '판'을 뜻하는 盤은 한자예요. 한 단어 안에서 가타카나와 한자가 섞였어요.","n":"가운데 구멍이 커서 도넛처럼 보이는 작은 레코드판이에요. 盤(소반 반)은 한국어 '음반(音盤)'의 盤이에요."},{"t":"には","p":"조사","m":"~에는"}],"ko":"먼지투성이 도넛판에는","lit":"먼지투성이 / 도넛판 / 에는","g":[{"k":"명사 + まみれ","d":"'~투성이'. 埃まみれ = 먼지투성이. 좋지 않은 것이 온통 묻어 있을 때 써요."}],"s":"埃(먼지)는 조요칸지 밖의 어려운 한자예요. 같은 소리의 誇り(ほこり, 자부심)와 구별하려고 한자로 쓰기도 해요. 줄 가운데의 전각 공백은 노래의 쉼표 같은 호흡이에요.","c":"오래 꺼내지 않아 먼지가 쌓인 레코드예요. 화자가 예전에 아끼던 노래를 다시 꺼내는 장면이에요."},{"id":"a7","tk":[{"t":"あの","p":"연체사","m":"그","w":"この·その·あの 같은 지시어는 히라가나로 써요."},{"t":"{日|ひ}","p":"명사","m":"날"},{"t":"の"},{"t":"{夢|ゆめ}","p":"명사","m":"꿈","n":"한국어 '몽(夢)'과 같은 한자예요. 夢中(むちゅう, 몰두)에서는 む로 읽어요."},{"t":"が"},{"t":"{踊|おど}る","p":"동사","m":"춤춰","w":"어간 踊는 한자, る는 히라가나예요.","n":"踊る는 5단 동사예요. 1절 끝 줄의 踊ろうよ(춤추자)로 다시 나와요."}],"ko":"그날의 꿈이 춤춰","lit":"그 / 날 / 의 / 꿈 / 이 / 춤추다","g":[{"k":"あの〜","d":"あの日 = 그날. あの는 서로 아는 지난 일을 가리켜요."}],"s":"줄 전체가 한자 명사(日·夢)와 히라가나 조사로 이루어져 있어요. 踊る만 오쿠리가나 る가 붙어 동사라는 게 보여요.","c":"레코드에서 흘러나오는 소리를 '그날의 꿈이 춤춘다'고 했어요. 노래를 들으면 그때의 꿈이 되살아나는 느낌으로 읽혀요."},{"id":"a8","tk":[{"t":"{真面目|まじめ}に","p":"な형용사","m":"진지하게","b":"{真面目|まじめ}","bm":"진지함, 성실함","w":"真面目는 단어 전체를 まじめ로 읽는 주쿠지쿤(熟字訓)이에요. マリーゴールド에도 나왔어요."},{"t":"{針|はり}","p":"명사","m":"바늘 (레코드 바늘)","n":"한국어 '침(針)'과 같은 한자예요. 時計の針(시곗바늘)."},{"t":"を"},{"t":"{落|お}とす","p":"동사","m":"내려놓아, 떨어뜨려","w":"어간 落는 한자, とす는 히라가나예요.","n":"落とす(떨어뜨리다, 타동사)와 落ちる(떨어지다, 자동사)는 짝이에요."}],"ko":"진지하게 바늘을 내려놓아","lit":"진지하게 / 바늘 / 을 / 떨어뜨린다","g":[{"k":"な형용사 + に","d":"真面目 → 真面目に(진지하게). マリーゴールド 1절의 真面目に見つめた와 같은 꼴이에요."}],"s":"真面目に는 マリーゴールド에서도 나온 말이에요. 아이묭 곡에서 '진지하게'가 두 곡 모두 첫머리에 나오는 게 재미있어요.","c":"針を落とす는 턴테이블 바늘을 레코드에 내려놓아 음악을 트는 동작이에요. 엉성한 서프라이즈지만, 레코드를 트는 손길만은 진지해요."},{"id":"a9","tk":[{"t":"{息|いき}","p":"명사","m":"숨","n":"息をする(숨을 쉬다), ため息(한숨)."},{"t":"を"},{"t":"{止|と}めすぎた","p":"동사","m":"너무 참았어","b":"{止|と}める","bm":"멈추다, 세우다","w":"어간 止는 한자, めすぎた는 히라가나예요. すぎる가 붙어 '너무 ~했다'가 됐어요.","n":"息を止める = 숨을 참다. 2절의 止まない(やまない)는 같은 止를 다르게 읽어요."},{"t":"ぜ"}],"ko":"숨을 너무 오래 참았지","lit":"숨 / 을 / 너무 멈췄다 / 지","g":[{"k":"〜すぎる","d":"동사 ます형 + すぎる = '너무 ~하다'. 止める → 止めすぎる. 과거형 止めすぎた."}],"s":"止는 이 줄에서는 と(める), 2절 止まない에서는 や(む)로 읽어요. 같은 한자에 쿤요미가 둘 있는 예예요.","c":"바늘을 내려놓는 동안 긴장해서 숨을 참고 있었다는 말이에요. 끝의 ぜ가 쑥스러움을 감추는 거친 말투로 들려요."}]},{"label":"1절 · Bメロ","note":"너를 앉히고, 보글보글 울리기 시작한 청춘의 소리에 맞춰 같이 춤추자고 해요.","lines":[{"id":"b1","tk":[{"t":"さあ","p":"감동사","m":"자","w":"감탄사라 히라가나로 써요.","n":"남을 재촉하거나 무언가를 시작할 때 써요. さあ、行こう(자, 가자)."},{"t":"{腰|こし}","p":"명사","m":"허리","n":"腰を下ろす = 허리를 내리다 → 앉다."},{"t":"を"},{"t":"{下|お}ろして","p":"동사","m":"내려놓아","b":"{下|お}ろす","bm":"내리다","w":"어간 下는 한자, ろして는 히라가나예요.","n":"下(아래 하)는 읽기가 많아요. した(아래), さがる(내려가다), おりる(내리다), おろす(내려놓다)."},{"t":"よ"}],"ko":"자, 앉아 봐","lit":"자 / 허리 / 를 / 내려놓아 / 줘","g":[{"k":"{腰|こし}を{下|お}ろす","d":"'허리를 내리다' = 앉다. 座る(すわる)보다 조금 차분하게 자리 잡고 앉는 느낌이에요."}],"s":"下는 한자 하나에 읽기가 아주 많은 글자예요. 이 줄에서는 오쿠리가나 ろす를 보고 おろす라고 읽어요.","c":"레코드가 돌기 시작하자 너에게 자리에 앉으라고 해요. 이제 함께 들을 준비가 됐어요."},{"id":"b2","tk":[{"t":"フツフツ","p":"부사","m":"보글보글, 부글부글","b":"ふつふつ","w":"보통 히라가나 ふつふつ로 쓰는데, 가타카나로 써서 소리가 또렷하고 힘 있게 튀어나오는 느낌을 줬어요.","n":"물이 끓어오르는 모양이나, 감정이 안에서 조금씩 끓어오르는 모양이에요. 怒りがふつふつと湧く(분노가 부글부글 끓어오르다)."},{"t":"と"},{"t":"{鳴|な}り{出|だ}す","p":"동사","m":"울리기 시작하는","b":"{鳴|な}り{出|だ}す","w":"鳴(울)와 出(나다) 두 한자 사이에 히라가나 り가 끼었어요. 鳴る + 出す가 합쳐진 복합동사예요.","n":"동사 ます형 + 出す = '~하기 시작하다'. 鳴り出す(울리기 시작하다), 泣き出す(울기 시작하다)."},{"t":"{青春|せいしゅん}"},{"t":"の"},{"t":"{音|おと}"}],"ko":"보글보글 울리기 시작하는 청춘의 소리","lit":"보글보글 / 하고 / 울리기 시작하는 / 청춘 / 의 / 소리","g":[{"k":"ます형 + {出|だ}す","d":"'~하기 시작하다'. 鳴る → 鳴り出す. 갑자기 시작되는 느낌이 있어요."},{"k":"의태어 + と","d":"フツフツと鳴り出す처럼 의태어 뒤에 と를 붙여 동사를 꾸며요."}],"s":"フツフツ는 원래 히라가나로 쓰는 말인데 가타카나로 썼어요. 가타카나는 소리를 또렷하게 강조할 때도 써요. 2절의 ダラダラ도 같아요.","c":"레코드 소리를 '청춘의 소리'라고 불러요. 끓어오르듯 울리기 시작하는 소리에, 마음도 같이 달아오르는 느낌이에요."},{"id":"b3","tk":[{"t":"{乾|かわ}いた"},{"t":"メロディ"},{"t":"で"},{"t":"{踊|おど}ろう","p":"동사","m":"춤추자","b":"{踊|おど}る","bm":"춤추다","w":"어간 踊는 한자, ろう는 히라가나예요.","n":"踊る → 의지형 踊ろう(춤추자)."},{"t":"よ"}],"ko":"메마른 멜로디에 맞춰 춤추자","lit":"메마른 / 멜로디 / 로 / 춤추자 / 요","g":[{"k":"의지형 〜おう","d":"5단 동사 끝 う단을 お단으로 바꾸고 う를 붙이면 '~하자'. 踊る → 踊ろう."}],"s":"メロディ는 보통 メロディー로 장음을 붙이기도 하지만, 이 곡의 원문은 ー 없이 썼어요. 외래어의 장음 표기는 사람마다 달라요.","c":"乾いた(메마른)는 거칠고 꾸밈없는 록 소리를 가리키는 말로 읽혀요. 그 소리에 맞춰 함께 춤추자고 해요."}]},{"label":"サビ · 후렴","note":"너는 록 같은 건 안 듣겠지만, 나는 이런 노래들로 사랑을 넘어 왔다고 고백해요.","lines":[{"id":"c1","tk":[{"t":"{君|きみ}"},{"t":"は"},{"t":"ロック"},{"t":"なんか"},{"t":"{聴|き}かない"},{"t":"と"},{"t":"{思|おも}いながら","p":"동사","m":"생각하면서","b":"{思|おも}う","bm":"생각하다","w":"어간 思는 한자, いながら는 히라가나예요.","n":"동사 ます형 + ながら = '~하면서'. 思いながら(생각하면서), 歩きながら(걸으면서)."}],"ko":"너는 록 같은 건 안 듣겠지 생각하면서도","lit":"너 / 는 / 록 / 같은 건 / 듣지 않는다 / 고 / 생각하면서","g":[{"k":"〜なんか","d":"'~같은 건, ~따위'. 앞의 말을 가볍게 낮춰 불러요. ロックなんか = 록 같은 건."},{"k":"ます형 + ながら","d":"'~하면서'. 두 동작이 동시에 일어나요. 思う → 思いながら."}],"s":"제목 君はロックを聴かない의 を가 후렴에서는 なんか로 바뀌었어요. '록을'이 '록 같은 건'이 되면서 쑥스럽고 체념한 말투가 됐어요.","c":"너는 내 취향과 다르다는 걸 알고 있어요. 그래도 다음 줄에서 조금이라도 다가와 주길 바라요."},{"id":"c2","tk":[{"t":"{少|すこ}し"},{"t":"でも","p":"조사","m":"~라도","n":"少しでも = 조금이라도. 一度でも(한 번이라도)."},{"t":"{僕|ぼく}"},{"t":"に"},{"t":"{近|ちか}づいて"},{"t":"ほしくて"}],"ko":"조금이라도 내게 다가와 줬으면 해서","lit":"조금 / 이라도 / 나 / 에게 / 다가와 / 주길 바라서","g":[{"k":"て형 + ほしい","d":"'~해 줬으면 좋겠다'. 近づく → 近づいてほしい. 끝을 くて로 바꾸면 '~해 줬으면 해서'라는 이유가 돼요."}],"s":"ほしい는 '갖고 싶다'일 때 欲しい로 쓰지만, '~해 주길 바라다'처럼 보조로 쓰면 히라가나로 써요. マリーゴールド의 みた(보조동사)와 같은 규칙이에요.","c":"록을 들려주는 진짜 이유가 나와요. 노래가 좋아서라기보다, 너와 가까워지고 싶어서예요."},{"id":"c3","tk":[{"t":"ロック"},{"t":"なんか"},{"t":"{聴|き}かない"},{"t":"と"},{"t":"{思|おも}う"},{"t":"けれども"}],"ko":"록 같은 건 안 듣겠지 싶지만","lit":"록 / 같은 건 / 듣지 않는다 / 고 / 생각하다 / 지만","g":[{"k":"〜と{思|おも}う","d":"'~라고 생각하다'. 앞 문장 끝에 と를 붙여 생각한 내용을 옮겨요."}],"s":"けれども는 けど보다 길고 또박또박한 말이에요. 박자에 맞춰 늘여 부르기 좋은 말이기도 해요.","c":"같은 말을 한 번 더 되풀이해요. 너는 안 들을 거라고 몇 번이고 스스로 확인하는 마음이에요."},{"id":"c4","tk":[{"t":"{僕|ぼく}"},{"t":"は"},{"t":"こんな"},{"t":"{歌|うた}"},{"t":"で"},{"t":"あんな"},{"t":"{歌|うた}"},{"t":"で"}],"ko":"나는 이런 노래로, 저런 노래로","lit":"나 / 는 / 이런 / 노래 / 로 / 저런 / 노래 / 로","g":[{"k":"こんな · あんな","d":"こんな(이런, 가까운 것), あんな(저런, 먼 것·지난 것). こんな歌であんな歌で = 이런 노래로 저런 노래로."}],"s":"한자는 僕·歌 두 글자뿐이고 나머지는 모두 히라가나예요. こ·そ·あ·ど 지시어는 히라가나로 쓰는 규칙이 잘 보여요.","c":"지금 틀어 준 노래도, 예전에 듣던 노래도 다 포함한 말이에요. 다음 줄에서 그 노래들로 무엇을 해 왔는지 나와요."},{"id":"c5","tk":[{"t":"{恋|こい}"},{"t":"を"},{"t":"{乗|の}り{越|こ}えてきた","p":"동사","m":"넘어 왔어, 견뎌 왔어","b":"{乗|の}り{越|こ}える","bm":"넘다, 극복하다","w":"乗(타다)와 越(넘다) 두 한자 사이에 り가 끼었어요. 乗る + 越える가 합쳐진 복합동사예요.","n":"乗り越える + てくる = '~해 오다'. 지금까지 쭉 넘어 왔다는 뜻이에요. 困難を乗り越える(어려움을 극복하다)."}],"ko":"사랑을 넘어 왔어","lit":"사랑 / 을 / 넘어 왔다","g":[{"k":"て형 + くる","d":"'~해 오다'. 과거부터 지금까지 이어진 일이에요. 乗り越える → 乗り越えてきた."}],"s":"乗り越える는 한자 둘에 오쿠리가나가 둘(り·える) 붙는 복합동사예요. 한자만 따라 읽으면 '타고 넘다'라는 그림이 보여요.","c":"실연이나 힘든 사랑을 록을 들으며 견뎌 왔다는 고백이에요. 그 노래들을 너에게 들려주는 건 내 마음의 역사를 보여 주는 일이에요."}]},{"label":"2절 · Aメロ","note":"심장이 BPM 190으로 뛰는데, 너는 눈치챘는지 갑자기 웃고 눈을 피해요.","lines":[{"id":"d1","tk":[{"t":"{僕|ぼく}"},{"t":"の"},{"t":"{心臓|しんぞう}","p":"명사","m":"심장","n":"한국어 '심장(心臟)'과 같은 한자어예요. 臓은 臟의 일본식 약자예요."},{"t":"の"},{"t":"{BPM|ビーピーエム}","p":"명사","m":"BPM (1분당 박자 수)","w":"영어 약자 BPM(beats per minute)을 알파벳 그대로 썼어요. 읽을 때는 알파벳을 하나씩 ビー·ピー·エム으로 읽어요.","n":"음악의 빠르기를 나타내는 단위예요. 심장 박동을 음악의 템포처럼 말한 재미있는 표현이에요."},{"t":"は"}],"ko":"내 심장의 BPM은","lit":"나 / 의 / 심장 / 의 / BPM / 은","g":[{"k":"〜の〜の","d":"僕の心臓のBPM = 나의 심장의 BPM. の를 여러 번 이어 쓸 수 있어요. 한국어로는 '내 심장의 BPM'처럼 하나만 남겨요."}],"s":"알파벳 약자가 가사 안에 그대로 나와요. 일본어는 영어 약자를 가타카나로 바꾸지 않고 알파벳으로 쓰는 일이 많아요(CD, DJ, BPM).","c":"심장 박동을 음악 용어로 말했어요. 록을 좋아하는 화자다운 표현이에요."},{"id":"d2","tk":[{"t":"{190|ひゃくきゅうじゅう}","p":"명사","m":"190","v":false,"w":"숫자를 아라비아 숫자로 썼어요. 읽을 때는 ひゃく(백) + きゅうじゅう(구십)예요.","n":"일본어 숫자: 100 ひゃく, 90 きゅうじゅう. 9는 きゅう 또는 く인데, 90은 きゅうじゅう로 읽어요."},{"t":"に"},{"t":"なった","p":"동사","m":"됐어","b":"なる","bm":"되다","w":"なる는 보통 히라가나로 써요."},{"t":"ぞ","p":"조사(종조사)","m":"~다고 (힘준 말투)","n":"주로 남성이 쓰는 말끝으로, 스스로 다짐하거나 상대에게 힘주어 알릴 때 써요."}],"ko":"190이 됐다고","lit":"190 / 에 / 되었다 / 고","g":[{"k":"〜になる","d":"'~이 되다'는 が가 아니라 に를 써요. 190になった = 190이 됐다. 大人になる(어른이 되다)."}],"s":"숫자 190을 아라비아 숫자로 썼어요. マリーゴールド의 2人처럼, 숫자를 그대로 써서 눈에 확 띄게 했어요.","c":"BPM 190은 아주 빠른 록 음악의 템포예요. 너 앞에서 심장이 그만큼 빨리 뛴다는 과장이에요."},{"id":"d3","tk":[{"t":"{君|きみ}"},{"t":"は"},{"t":"{気|き}づく","p":"동사","m":"눈치채다","w":"気(기운 기)는 한자, づく는 히라가나예요. 気 + 付く(つく)가 합쳐지며 つ가 づ로 탁해졌어요.","n":"気づく = 알아차리다, 눈치채다. 気が付く로도 써요."},{"t":"のかい","p":"조사(종조사)","m":"~는 거야?","n":"の + かい. 친근하지만 조금 남성적인 질문 말투예요."},{"t":"？"}],"ko":"넌 눈치챌까?","lit":"너 / 는 / 눈치채다 / 는 거야","g":[{"k":"〜のかい","d":"질문 끝에 붙이는 말투. 行くのかい?(가는 거야?). 조금 장난스럽고 남성적인 느낌이에요."}],"s":"물음표를 전각 ？로 썼어요. 일본어 문장에서는 물음표도 한자·가나와 같은 폭의 전각 문자를 쓰는 일이 많아요.","c":"빨리 뛰는 심장을 네가 알아챌지 조마조마한 마음이에요."},{"id":"d4","tk":[{"t":"なぜ","p":"부사","m":"왜","w":"한자로 쓰는 일이 거의 없는 의문사라 히라가나로 써요.","n":"なぜ는 どうして보다 조금 딱딱한 말이에요."},{"t":"{今|いま}","p":"명사","m":"지금"},{"t":"{笑|わら}うんだい","p":"동사","m":"웃는 거야","b":"{笑|わら}う","bm":"웃다","w":"어간 笑는 한자, うんだい는 히라가나예요.","n":"笑う + んだい(~는 거야?). んだい는 んだ의 질문형으로, 조금 남성적인 말투예요."},{"t":"？"}],"ko":"왜 지금 웃는 건데?","lit":"왜 / 지금 / 웃는 거야","g":[{"k":"〜んだい","d":"의문사와 함께 쓰는 질문 말투. なぜ笑うんだい = 왜 웃는 거야? 앞줄의 のかい와 짝이에요."}],"s":"笑うんだい처럼 ん으로 시작하는 말끝은 앞의 동사와 한 덩어리로 읽어요. 한글로는 '와라운다이'예요.","c":"너는 내 마음을 눈치챈 걸까, 갑자기 웃어요. 화자는 그 웃음의 뜻을 몰라 당황해요."},{"id":"d5","tk":[{"t":"{嘘|うそ}","p":"명사","m":"거짓말","w":"嘘는 조요칸지 밖의 글자예요. 일상 글에서는 うそ로도 많이 써요.","n":"嘘をつく = 거짓말을 하다. 嘘でしょ?(설마, 거짓말이지?)."},{"t":"みたいに","p":"조동사","m":"~처럼","n":"명사 + みたいに = '~처럼'. ような의 회화체예요. 夢みたいに(꿈처럼)."},{"t":"{泳|およ}ぐ","p":"동사","m":"헤엄치는 (흔들리는)","w":"어간 泳는 한자, ぐ는 히라가나예요.","n":"目が泳ぐ = 눈이 헤엄치다 → 당황해서 눈동자가 흔들리다, 눈을 피하다."},{"t":"{目|め}","p":"명사","m":"눈","n":"한국어 '목(目)'과 같은 한자예요."}],"ko":"거짓말처럼 흔들리는 눈","lit":"거짓말 / 처럼 / 헤엄치는 / 눈","g":[{"k":"{目|め}が{泳|およ}ぐ","d":"관용 표현. 당황하거나 숨기는 게 있을 때 눈동자가 이리저리 움직이는 모습이에요."},{"k":"〜みたいに","d":"'~처럼'. 嘘みたいに = 거짓말처럼."}],"s":"嘘도 埃처럼 조요칸지 밖의 한자예요. 이 곡은 埃·嘘 같은 어려운 한자를 일부러 한자로 남겼어요.","c":"웃던 너의 눈이 갑자기 흔들려요. 너도 나처럼 당황한 걸까, 하는 장면으로 읽혀요."}]},{"label":"2절 · Bメロ","note":"줄줄 흐르는 청춘의 소리, 메마른 멜로디는 멈추지 않아요.","lines":[{"id":"e1","tk":[{"t":"ダラダラ","p":"부사","m":"줄줄, 질질","b":"だらだら","w":"보통 히라가나 だらだら로 쓰는데 가타카나로 썼어요. 1절의 フツフツ와 짝을 이루는 표기예요.","n":"땀이나 물이 줄줄 흐르는 모양, 또는 빈둥빈둥 늘어지는 모양이에요. マリーゴールド의 だらける와 같은 뿌리예요."},{"t":"と"},{"t":"{流|なが}れる","p":"동사","m":"흐르는","w":"어간 流는 한자, れる는 히라가나예요.","n":"流れる(흐르다, 자동사)와 流す(흘리다, 타동사)는 짝이에요."},{"t":"{青春|せいしゅん}"},{"t":"の"},{"t":"{音|おと}"}],"ko":"줄줄 흐르는 청춘의 소리","lit":"줄줄 / 하고 / 흐르는 / 청춘 / 의 / 소리","g":[{"k":"의태어 + と + 동사","d":"ダラダラと流れる = 줄줄 흐르다. 1절 フツフツと鳴り出す와 같은 꼴이에요."}],"s":"1절 フツフツと鳴り出す青春の音, 2절 ダラダラと流れる青春の音. 가타카나 의태어 + と + 동사 + 青春の音이라는 같은 틀을 반복했어요.","c":"1절에서 끓어오르던 소리가 2절에서는 줄줄 흘러요. 시작의 설렘이 끝없이 이어지는 흐름으로 바뀌었어요."},{"id":"e2","tk":[{"t":"{乾|かわ}いた"},{"t":"メロディ"},{"t":"は"},{"t":"{止|や}まない","p":"동사","m":"멈추지 않아","b":"{止|や}む","bm":"그치다, 멎다","w":"어간 止는 한자, まない는 히라가나예요. 1절의 止める(とめる)와 같은 한자를 やむ로 읽었어요.","n":"止む = (비·소리가) 그치다. 雨が止む(비가 그치다). 止める(멈추다)와 읽기가 달라요."},{"t":"ぜ"}],"ko":"메마른 멜로디는 멈추지 않아","lit":"메마른 / 멜로디 / 는 / 그치지 않는다 / 지","g":[{"k":"〜ない (부정)","d":"止む → 止まない. む로 끝나는 5단 동사는 ま + ない가 돼요."}],"s":"같은 止를 1절에서는 とめる, 여기서는 やむ로 읽어요. 오쿠리가나(める·まない)를 보면 어떻게 읽을지 알 수 있어요.","c":"1절에서는 숨을 너무 참았는데(止めすぎた), 2절에서는 멜로디가 그치지 않아요(止まない). 같은 한자로 멈춤과 계속을 대비했어요."}]},{"label":"サビ 2 · 두 번째 후렴","note":"후렴을 되풀이하며, 이번에는 '조금만 더' 다가와 주길 바라고 사랑에 애태워 왔다고 해요.","lines":[{"same":"c1"},{"id":"f1","tk":[{"t":"あと","p":"부사","m":"앞으로, 조금 더","w":"후(後)라는 한자가 있지만, '앞으로 ~만 더'라는 뜻일 때는 히라가나로 써요.","n":"あと少し = 조금만 더. あと5分(앞으로 5분)."},{"t":"{少|すこ}し"},{"t":"{僕|ぼく}"},{"t":"に"},{"t":"{近|ちか}づいて"},{"t":"ほしくて"}],"ko":"조금만 더 내게 다가와 줬으면 해서","lit":"앞으로 / 조금 / 나 / 에게 / 다가와 / 주길 바라서","g":[{"k":"あと + 수량","d":"'~만 더'. あと少し(조금만 더), あと一回(한 번만 더)."}],"s":"첫 후렴의 少しでも(조금이라도)가 あと少し(조금만 더)로 바뀌었어요. 한 단어만 바꿔 바람이 조금 더 커졌어요.","c":"첫 후렴은 '조금이라도', 두 번째는 '조금만 더'예요. 이미 조금 가까워졌다는 느낌으로도 읽혀요."},{"same":"c3"},{"same":"c4"},{"id":"f2","tk":[{"t":"{恋|こい}"},{"t":"に"},{"t":"{焦|こ}がれてきたんだ","p":"동사","m":"애태워 왔어","b":"{焦|こ}がれる","bm":"애타게 그리다","w":"어간 焦는 한자, がれてきたんだ는 히라가나예요.","n":"焦がれる는 원래 '타다, 그을리다'(焦げる)에서 온 말로, 마음이 타듯 애타게 그리워하는 거예요. 恋焦がれる(사랑에 애태우다)."}],"ko":"사랑에 애태워 왔던 거야","lit":"사랑 / 에 / 애태워 왔던 거다","g":[{"k":"〜てきた + んだ","d":"'~해 왔던 거야'. 焦がれる → 焦がれてきた + んだ(설명·강조)."}],"s":"焦는 焦げる(こげる, 타다)의 한자예요. 사랑으로 마음이 '탄다'는 그림이 한자에 그대로 들어 있어요.","c":"첫 후렴은 사랑을 '넘어 왔다'였는데, 두 번째는 사랑에 '애태워 왔다'예요. 견뎌 온 것만이 아니라 그만큼 애타게 바라 왔다는 고백이에요."}]},{"label":"サビ 3 · 세 번째 후렴","part":"마지막","note":"너는 록을 안 듣는다는 걸 알지만, 연인처럼 곁에 있어 주길 바라며 또 가슴이 아파요.","lines":[{"id":"g1","tk":[{"t":"{君|きみ}"},{"t":"が"},{"t":"ロック"},{"t":"なんか"},{"t":"{聴|き}かない"},{"t":"こと","p":"형식명사","m":"~것","b":"こと","w":"'것'이라는 뜻만 남은 형식명사라 한자 事 대신 히라가나로 써요."},{"t":"{知|し}ってる","p":"동사","m":"알고 있어","b":"{知|し}る","bm":"알다","w":"어간 知는 한자, ってる는 히라가나예요.","n":"知る는 る로 끝나지만 5단 동사예요. 知っている → 회화체 知ってる."},{"t":"けど","p":"조사","m":"~지만","n":"けれども의 짧은 말이에요."}],"ko":"네가 록 같은 건 안 듣는다는 거 알지만","lit":"너 / 가 / 록 / 같은 건 / 듣지 않는 / 것 / 알고 있다 / 지만","g":[{"k":"〜こと + {知|し}ってる","d":"'~라는 것을 알고 있다'. 원래 ことを知ってる인데 を가 빠졌어요."},{"k":"は → が","d":"앞 후렴은 君は(너는), 여기서는 君が(네가)예요. 문장 속 문장의 주어에는 が를 써요."}],"s":"知る는 る로 끝나서 1단 동사처럼 보이지만 5단 동사예요. 그래서 て형이 知って가 돼요. 초보자가 자주 헷갈리는 동사예요.","c":"앞 후렴은 '안 듣겠지 생각하면서'였는데, 여기서는 '안 듣는다는 걸 알고 있다'예요. 짐작이 확신으로 바뀌었어요."},{"id":"g2","tk":[{"t":"{恋人|こいびと}","p":"명사","m":"연인","w":"恋(こい)와 人(ひと)가 합쳐지며 ひ가 び로 탁해졌어요(렌다쿠).","n":"한국어 '연인(戀人)'과 같은 한자어지만 こいびと라고 쿤요미로 읽어요."},{"t":"の"},{"t":"ように","p":"조동사","m":"~처럼","n":"명사 + のように = '~처럼'. 恋人のように = 연인처럼."},{"t":"{寄|よ}り{添|そ}って","p":"동사","m":"곁에 붙어","b":"{寄|よ}り{添|そ}う","bm":"바싹 다가붙다, 곁에 있어 주다","w":"寄(가까이하다)와 添(곁들이다) 두 한자 사이에 り가 끼었어요. 寄る + 添う가 합쳐진 복합동사예요.","n":"몸을 기대 붙는 것뿐 아니라, 마음으로 곁을 지켜 준다는 뜻으로도 써요. 気持ちに寄り添う(마음을 헤아려 주다)."},{"t":"ほしくて"}],"ko":"연인처럼 곁에 붙어 있어 줬으면 해서","lit":"연인 / 의 / 처럼 / 곁에 붙어 / 주길 바라서","g":[{"k":"〜のように","d":"'~처럼'. 恋人のように寄り添う = 연인처럼 바싹 붙다."}],"s":"恋人은 한국어 '연인'과 같은 한자지만, 일본어는 온요미(れんじん)가 아니라 쿤요미 こいびと로 읽어요.","c":"앞 후렴은 '다가와 줬으면'이었는데, 이번에는 '연인처럼 곁에'예요. 바람이 점점 커져요."},{"same":"c3"},{"same":"c4"},{"id":"g3","tk":[{"t":"また","p":"부사","m":"또, 다시","w":"부사라 히라가나로 써요."},{"t":"{胸|むね}","p":"명사","m":"가슴","n":"胸が痛い = 가슴이 아프다. 胸がいっぱい(가슴이 벅차다)."},{"t":"が"},{"t":"{痛|いた}いんだ","p":"い형용사","m":"아픈 거야","b":"{痛|いた}い","bm":"아프다","w":"어간 痛는 한자, いんだ는 히라가나예요.","n":"痛い + んだ(설명·강조). 痛い는 몸이 아플 때도, 마음이 아플 때도 써요."}],"ko":"또 가슴이 아파","lit":"또 / 가슴 / 이 / 아픈 거다","g":[{"k":"〜んだ","d":"설명이나 감정을 강조하는 말끝. 痛い → 痛いんだ(아픈 거야). 앞의 焦がれてきたんだ와 같아요."}],"s":"痛いんだ처럼 형용사 뒤 んだ는 한 덩어리로 읽어요. 한글로는 '이타인다'예요.","c":"사랑을 넘어 왔다던 노래들이, 이번에는 또 가슴을 아프게 해요. 너를 향한 마음 때문이라고 읽혀요."}]},{"label":"ラストサビ · 마지막 후렴","note":"첫 후렴을 그대로 되풀이하고, '사랑을 넘어 왔어'를 한 번 더 부르며 끝나요.","lines":[{"same":"c1"},{"same":"c2"},{"same":"c3"},{"same":"c4"},{"same":"c5"},{"same":"c5"}]}]},"film":{"id":"film","title":"115{万|まん}キロのフィルム","artist":"Official髭男dism","year":2018,"eyebrow":"Official髭男dism · 2018","sub":"너와의 평생을 한 편의 영화로 찍겠다는 사랑 노래. 앨범 『エスカパレード』 수록, 2020년 실사 영화 「思い、思われ、ふり、ふられ」 주제가.","release":"2018년 4월 11일 · 앨범 『エスカパレード』 수록","tieIn":"실사 영화 「思い、思われ、ふり、ふられ」(2020) 주제가","lyricist":"藤原聡","composer":"藤原聡","listen":"https://www.youtube.com/results?search_query=Official%E9%AB%AD%E7%94%B7dism+115%E4%B8%87%E3%82%AD%E3%83%AD%E3%81%AE%E3%83%95%E3%82%A3%E3%83%AB%E3%83%A0","intro":"115万キロのフィルム(ひゃくじゅうごまんキロのフィルム, 115만 킬로의 필름)은 2018년 4월에 나온 앨범 『エスカパレード』에 실린 곡이에요. 앨범 수록곡이었지만 결혼식 노래로도 사랑받았고, 2020년에는 실사 영화 「思い、思われ、ふり、ふられ」의 주제가가 되었어요.\n\n노래는 '지금부터 부를 곡은 내 머릿속 영화 이야기'라는 소개로 시작해요. 주연은 너, 나는 조연이자 감독이자 카메라맨이에요. 첫 싸움, 화해, 네가 웃는 장면을 영화처럼 찍고, 평생을 찍을 필름 115만 킬로를 준비했다고 노래해요. 영화 용어가 어떻게 사랑의 말이 되는지 따라가며 읽어 보세요.","notes":[{"tag":"배경","title":"앨범 수록곡에서 영화 주제가로","body":"115万キロのフィルム은 2018년 4월 11일에 나온 앨범 『エスカパレード』에 실린 곡이에요. 싱글이 아니라 앨범 수록곡이었지만 팬들 사이에서 사랑받았고, 결혼식 노래로도 많이 쓰였어요.\n\n2020년에는 8월 14일 개봉한 실사 영화 「思い、思われ、ふり、ふられ」의 주제가가 됐어요. 감독 三木孝浩가 작품에 맞는 곡으로 이 노래를 골랐다고 해요. 곡 속에서 '엔딩 크레디트는 만들고 싶지도 않다'고 노래한 곡이 영화의 엔딩 크레디트에 흐르게 된 셈이에요.\n\n히게단에게 영화와 무대는 익숙한 소재예요. Pretender는 이뤄지지 않는 사랑을 연극에 빗댔고, Laughter는 영화 「コンフィデンスマンJP」의 주제가였어요. 이 곡은 사랑 그 자체를 한 편의 영화로 그려요."},{"tag":"표현","title":"115만 킬로는 무슨 길이일까","body":"제목의 115万キロ(115만 킬로)는 평생을 영화 필름에 담을 때 필요한 길이로 풀이돼요. 藤原聡가 직접 밝힌 계산은 아니지만, 실제로 계산해 보면 딱 맞아떨어져서 널리 알려진 풀이예요.\n\n영화관에서 쓰던 35mm 필름은 1초에 24장면(프레임)을 찍고, 1초 분량이 약 45.7cm예요. 이 필름을 80년 동안 쉬지 않고 돌리면 약 115만 km가 돼요. 지구를 약 29바퀴 도는 길이이고, 달까지 거리(약 38만 km)의 약 3배예요.\n\n그래서 브리지의 [[{一|いっ}{生|しょう}{分|ぶん}の{長|なが}さを　ざっと{115万|ひゃくじゅうごまん}キロ]]는 '너와 함께할 평생을 빠짐없이 찍을 필름을 준비했다'는 고백이에요. 사랑한다는 말 대신 숫자로 평생을 약속한 노래예요."},{"tag":"표현","title":"사랑을 영화로 찍는 말들","body":"이 곡에는 영화 현장의 말이 줄줄이 나와요.\n\n**만드는 사람**: [[{主|しゅ}{演|えん}]](주연), [[{助|じょ}{演|えん}]](조연), [[{監|かん}{督|とく}]](감독), [[カメラマン]](카메라맨), [[キャスト]](출연진)\n\n**만드는 과정**: [[{撮|さつ}{影|えい}]](촬영), [[クランクアップ]](촬영 종료), [[フィルム]](필름), [[{焼|や}き{付|つ}ける]](인화하다, 새기다)\n\n**보여 주는 방법**: [[{掴|つか}み]](도입부), [[ダイジェスト]](요약), [[シーン]](장면), [[{見|み}どころ]](볼거리), [[サムネイル]](썸네일), [[{展|てん}{開|かい}]](전개), [[{名|めい}{場|ば}{面|めん}]](명장면), [[エンドロール]](엔딩 크레디트)\n\n주연·조연·감독·촬영처럼 한국어 한자음과 똑같은 한자어가 많아서 뜻을 짐작하기 쉬워요. 외래어는 모두 가타카나로 써서, 한자어와 외래어가 섞인 영화 현장의 말맛이 그대로 살아 있어요."},{"tag":"표기","title":"일본식 영어: キャパオーバー·エンドロール·クランクアップ","body":"가타카나로 쓴 말이 모두 영어에서 그대로 온 건 아니에요. 영어 단어를 일본에서 새로 조합한 말을 [[{和製英語|わせいえいご}]](일본식 영어)라고 해요.\n\n[[キャパオーバー]]: capacity를 줄인 キャパ에 over를 붙인 말로, '감당할 수 있는 양을 넘었다'는 뜻이에요. 영어권에서는 이렇게 말하지 않아요.\n\n[[エンドロール]]: end + roll. 영어로는 end credits예요.\n\n[[クランクアップ]]: 옛날 영화 카메라를 손잡이(crank)로 돌려 찍던 데서 온 말이에요. 일본에서는 촬영 시작을 クランクイン, 촬영 종료를 クランクアップ라고 해요. 영어 crank up과는 뜻이 달라요.\n\n한국어에도 '핸드폰', '아이쇼핑' 같은 한국식 영어가 있듯이, 일본어 가타카나에도 이런 말이 많아요. 외울 때는 실제 영어와 뜻이 다를 수 있다는 점을 기억해 두세요."},{"tag":"문화","title":"苗字がひとつになった日: 결혼과 성","body":"일본에서는 법으로 결혼한 부부가 같은 성(苗字)을 써야 해요. 대부분 아내가 남편의 성으로 바꾸기 때문에, '성이 하나가 된 날'이라고 하면 바로 결혼한 날을 떠올려요. 결혼해도 성이 바뀌지 않는 한국과 다른 점이에요. 부부가 각자의 성을 쓸 수 있게 하자는 '선택적 부부별성(選択的夫婦別姓)' 논의도 오래 이어지고 있어요.\n\n이 곡은 결혼이라는 말을 직접 쓰지 않고 [[{苗|みょう}{字|じ}がひとつになった{日|ひ}]]라고 돌려 말해요. 그리고 바로 다음 줄에 [[{何|なに}ひとつ{代|か}わり{映|ば}えのない{日|ひ}]](무엇 하나 다를 것 없는 날)을 나란히 놓아, 특별한 날과 평범한 날을 똑같이 소중하게 다뤄요."},{"tag":"표기","title":"永遠(とわ), 見どころ와 今の所, 그리고 숫자","body":"**특수 읽기**: [[{永遠|とわ|*}]]은 보통 えいえん이라고 읽어요. Pretender에서도 えいえん이었죠. 이 곡에서는 '영원'을 뜻하는 예스러운 말 とわ를 읽기로 달았어요. 노래에서는 한자로 뜻을 보여 주고, 읽기로 분위기를 바꾸는 일이 많아요.\n\n**같은 말, 다른 표기**: 후렴의 [[{見|み}どころ]]는 ところ를 히라가나로, 바로 뒤의 [[{今|いま}の{所|ところ}]]는 한자 所로 썼어요. 한 곡 안에서 같은 말이 두 가지로 쓰였어요.\n\n**숫자**: [[{115万|ひゃくじゅうごまん}]]와 [[{10|じゅう}{年|ねん}{後|ご}]]는 아라비아 숫자에 万·年 같은 한자 단위를 붙였어요. [[{一|いっ}{生|しょう}{分|ぶん}]]·[[{何|なに}ひとつ]]처럼 말로 굳은 표현은 한자나 히라가나로 써요.\n\n**조요칸지 밖의 한자**: [[{掴|つか}み]]의 掴, [[{喧|けん}{嘩|か}]]의 喧·嘩, [[{些|さ}{細|さい}]]의 些, [[{溢|あふ}れる]]의 溢는 조요칸지 목록에 없는 글자예요. Laughter의 覗·囀처럼, 히게단 가사에는 이런 한자가 꾸준히 나와요."},{"tag":"문화","title":"酸いも甘いも: 인생의 신맛 단맛","body":"아웃트로의 [[{酸|す}いも{甘|あま}いも]]는 '신맛도 단맛도'라는 뜻이에요. 원래 [[{酸|す}いも{甘|あま}いも{噛|か}み{分|わ}ける]]라는 관용 표현으로, 인생의 좋은 일과 힘든 일을 다 겪어서 세상 물정을 잘 안다는 뜻이에요. 한국어 '산전수전 다 겪다', '단맛 쓴맛 다 보다'와 비슷해요.\n\n이 곡은 그 표현을 빌려 [[{寄|よ}り{添|そ}って　{一|いっ}{緒|しょ}に{味|あじ}わおう]](곁에 붙어 함께 맛보자)라고 해요. 좋은 날만 함께하자는 게 아니라 힘든 날도 같이 겪자는 약속이에요. 결혼식의 '기쁠 때나 슬플 때나'라는 서약과도 닮았어요."}],"dict":{"{僕|ぼく}":{"p":"대명사","m":"나 (남성)","w":"1인칭 대명사로 한자로 쓰는 게 일반적이에요.","n":"부드럽고 소년 같은 느낌의 남성 1인칭이에요. 히게단 곡의 화자는 대부분 僕예요."},"{君|きみ}":{"p":"대명사","m":"너 (이 영화의 주연)","w":"'너'를 뜻하는 대명사로, 한자로 쓰는 게 일반적이에요."},"フィルム":{"p":"명사(외래어)","m":"필름","w":"영어 film을 가타카나로 옮긴 외래어예요.","n":"카메라에 넣는 필름과 영화 자체를 모두 가리켜요. 이 곡에서는 너와의 기억을 담는 필름이에요."},"{今|いま}":{"p":"명사","m":"지금"},"{歌|うた}":{"p":"명사","m":"노래","n":"歌(노래 가)에 う를 붙이면 동사 歌う(うたう, 노래하다)예요."},"{歌|うた}う":{"p":"동사","m":"노래하다, 부르다","w":"어간 歌는 한자, う는 히라가나예요."},"ひとつ":{"p":"명사","m":"하나","b":"{一|ひと}つ","bm":"하나","w":"一つ로 쓸 수 있는데 히라가나로 풀었어요. 숫자를 센다기보다 '하나가 되다', '하나도'처럼 말로 쓸 때 히라가나로 쓰는 일이 많아요."},"きっと":{"p":"부사","m":"분명, 아마 꼭","w":"부사라 히라가나로 써요."},"だから":{"p":"접속사","m":"그러니까","w":"접속사라 히라가나로 써요."},"Ah":{"p":"감동사(영어)","m":"아","v":false,"w":"영어 감탄사 Ah를 알파벳 그대로 썼어요."},"{笑|わら}う":{"p":"동사","m":"웃다","w":"어간 笑는 한자, う는 히라가나예요."},"{見|み}せる":{"p":"동사","m":"보여 주다","w":"어간 見는 한자, せる는 히라가나예요.","n":"見る(보다)와 짝이 되는 見せる(보여 주다)예요."},"{日|ひ}":{"p":"명사","m":"날"},"{日々|ひび}":{"p":"명사","m":"나날","w":"々는 앞 글자를 되풀이하는 기호예요. 日々 = 日日. 단어 전체에 ひび라는 읽기가 붙어요.","n":"人々(ひとびと, 사람들), 時々(ときどき, 가끔)도 같은 々예요."},"ここ":{"p":"대명사","m":"여기","w":"こ·そ·あ·ど 지시어라 히라가나로 써요."},"この":{"p":"연체사","m":"이","w":"こ·そ·あ·ど 지시어라 히라가나로 써요."},"その":{"p":"연체사","m":"그","w":"こ·そ·あ·ど 지시어라 히라가나로 써요."},"ない":{"p":"い형용사","m":"없다","b":"ない","bm":"없다","w":"'없다'의 ない는 히라가나로 써요."},"の":{"p":"조사","m":"~의"},"は":{"p":"조사","m":"~은/는 (주제)","n":"조사로 쓸 때는 wa로 읽어요."},"が":{"p":"조사","m":"~이/가"},"を":{"p":"조사","m":"~을/를","n":"발음은 お(o)와 같아요."},"に":{"p":"조사","m":"~에, ~로"},"も":{"p":"조사","m":"~도"},"で":{"p":"조사","m":"~에서, ~로"},"と":{"p":"조사","m":"~라고 (인용)"},"よ":{"p":"조사(종조사)","m":"~야, ~할게 (알려 주는 말투)","n":"문장 끝에 붙어 '내가 말해 줄게'라는 느낌을 더해요."},"か":{"p":"조사","m":"~인가 (불확실)"},"から":{"p":"조사","m":"~니까 (이유)"},"な":{"p":"조사(종조사)","m":"~네, ~지 (혼잣말)","n":"문장 끝의 な는 혼잣말처럼 느낌을 담아요."},"ね":{"p":"조사(종조사)","m":"~해 (부드럽게)","n":"문장 끝에서 말투를 부드럽게 하거나 동의를 구해요."},"さ":{"p":"조사(종조사)","m":"~야, ~지 (가볍게 맺음)","n":"문장 끝의 さ는 가볍게 툭 던지듯 말을 맺는 회화체예요."},"には":{"p":"조사(복합)","m":"~에는, ~에게는","n":"に + は. は 때문에 niwa로 읽어요."},"までの":{"p":"조사(복합)","m":"~까지의"},"なんて":{"p":"조사","m":"~ 같은 것, ~따위","n":"앞말을 가볍게 낮추거나 '그런 건' 하고 밀어내는 느낌을 담아요."},"くらい":{"p":"조사","m":"~쯤, ~정도"},"だけ":{"p":"조사","m":"~만"},"ように":{"p":"조동사","m":"~하도록","n":"〜ないように = ~하지 않도록."}},"sections":[{"label":"イントロ · 도입","note":"노래를 시작하자마자 '이건 내 머릿속 영화 이야기'라고 소개해요. 주연은 너, 나는 조연이자 감독이자 카메라맨이에요.","lines":[{"id":"i1","tk":[{"t":"これから","p":"부사","m":"이제부터, 지금부터","w":"지시어 これ(이것)에 から(~부터)가 붙은 말이라 히라가나로 써요.","n":"これから = 이제부터, 앞으로. 마지막 아웃트로에도 さあ、これから生まれる로 다시 나와요."},{"t":"{歌|うた}う"},{"t":"{曲|きょく}","p":"명사","m":"곡","n":"한국어 '곡(曲)'과 같은 한자예요. 作曲(さっきょく) = 작곡."},{"t":"の"},{"t":"{内|ない}{容|よう}","p":"명사","m":"내용","n":"한국어 '내용(內容)'과 같은 한자어예요."},{"t":"は"}],"ko":"지금부터 부를 노래의 내용은","lit":"이제부터 / 부르다 / 곡 / 의 / 내용 / 은","g":[{"k":"동사 사전형 + 명사","d":"동사가 그대로 명사를 꾸며요. 歌う曲 = 부를 곡. 한국어처럼 '~할/~하는'을 따로 붙이지 않아요."}],"c":"노래를 시작하며 노래의 내용을 먼저 소개하는, 무대 인사 같은 첫 줄이에요. 듣는 사람을 영화관 객석에 앉히는 느낌이에요."},{"id":"i2","tk":[{"t":"{僕|ぼく}"},{"t":"の"},{"t":"{頭|あたま}","p":"명사","m":"머리","n":"頭(머리 두)는 頭痛(ずつう, 두통)처럼 한자어에서는 ず·とう로 읽어요."},{"t":"の"},{"t":"{中|なか}","p":"명사","m":"안, 속"},{"t":"の"},{"t":"こと","p":"형식명사","m":"것, 일","w":"형식명사라 히라가나로 써요."}],"ko":"내 머릿속 이야기야","lit":"나 / 의 / 머리 / 의 / 속 / 의 / 것","g":[{"k":"명사 + のこと","d":"'~에 관한 것, ~ 이야기'. 君のこと = 너에 관한 것. 頭の中のこと = 머릿속에 있는 일들."}],"s":"の가 세 번 이어져요(僕の頭の中のこと). 히라가나 の가 한자 명사 사이를 이어 주는 모습이 잘 보이는 줄이에요.","c":"앞으로 나올 장면은 실제로 찍은 영화가 아니라 내 머릿속 상상이라 로 쓸 때는 오쿠리가나 없이 話 한 글자로 써요."},{"t":"さ"},{"t":"　"},{"t":"Ah"}],"ko":"내가 만드는 영화 이야기야, Ah","kr":"츠쿠루 에이가노 하나시사 아-","lit":"만들다 / 영화 / 의 / 이야기 / 야 / 아","g":[{"k":"〜さ","d":"문장 끝의 さ는 '~야, ~지'처럼 가볍게 말을 맺어요. 映画の話さ = 영화 이야기야. よ보다 툭 던지는 느낌이에요."}],"c":"첫 여섯 줄이 한 편의 예고편이에요. 이제부터 나오는 장면들이 모두 이 '영화'의 장면이라는 걸 알려 줘요."}]},{"label":"1절 · Aメロ","note":"시시하다고 웃어 줬다면 첫 장면은 성공이라며, 지금까지 찍은 장면을 조금만 보여 주겠다고 해요.","lines":[{"id":"a1","tk":[{"t":"くだらない","p":"い형용사","m":"시시한, 하찮은","w":"下らない라는 한자가 있지만 보통 히라가나로 써요.","n":"くだらない話 = 시시한 이야기. 친구의 농담에 くだらない!(시시해!)라고 웃으며 받아치기도 해요."},{"t":"な"},{"t":"と"},{"t":"{笑|わら}ったんなら","p":"동사","m":"웃었다면","b":"{笑|わら}う","bm":"웃다","w":"어간 笑는 한자, ったんなら는 히라가나예요.","n":"笑った(웃었다) + んなら(~한 거라면). んなら는 のなら의 회화체예요."}],"ko":"시시하다며 웃어 줬다면","lit":"시시하다 / 네 / 라고 / 웃었다 / 라면","g":[{"k":"〜んなら (〜のなら)","d":"'~한 거라면'. 앞 내용을 받아 조건을 걸어요. 行くんなら一緒に行こう = 갈 거라면 같이 가자."},{"k":"〜なと (혼잣말 인용)","d":"くだらないな(시시하네)라는 혼잣말을 と로 인용했어요."}],"c":"듣는 사람이 '뭐야, 시시해'라고 웃는 것까지 예상하고 말을 걸어요. 그 웃음마저 계산에 넣은 장난스러운 시작이에요."},{"id":"a2","tk":[{"t":"{掴|つか}み","p":"명사","m":"(관객을) 사로잡는 첫 부분","w":"掴む(つかむ, 붙잡다)의 명사형이라 오쿠리가나 み가 붙어요. 掴는 조요칸지에 없는 글자예요.","n":"掴み는 공연이나 코미디에서 처음에 관객의 마음을 붙잡는 부분이에요. 掴みはOK(처음 반응은 성공)라는 말을 일본 예능에서 자주 써요."},{"t":"は"},{"t":"それで","p":"접속사","m":"그걸로","w":"それ(그것) + で(~로)라 히라가나로 써요."},{"t":"{万|ばん}{事|じ}","p":"명사","m":"만사, 모든 일","n":"한국어 '만사(萬事)'와 같은 한자어예요. 여기서는 万을 ばん으로 읽어요. 브리지의 115万(まん)과 같은 한자예요."},{"t":"OK","p":"감동사(영어)","m":"좋아, 오케이","w":"영어 OK를 알파벳 그대로 썼어요.","n":"일본어로는 オーケー라고 읽어요. 일상 글에서도 알파벳 OK를 그대로 많이 써요."},{"t":"！"}],"ko":"그걸로 오프닝은 대성공!","kr":"츠카미와 소레데 반지 오-케-!","lit":"사로잡기 / 는 / 그걸로 / 만사 / OK","g":[{"k":"{万|ばん}{事|じ}OK","d":"'만사 OK, 다 잘됐다'. 万事(모든 일) + OK를 합친 장난스러운 말투예요."}],"s":"万을 ばん으로 읽는 万事와 브리지의 115万(まん)이 같은 한자예요. 掴는 조요칸지 밖의 글자인데 한자로 썼고, OK는 알파벳 그대로예요.","c":"掴み(관객을 사로잡는 첫 부분)라는 공연 용어를 써서, 웃게 만들었으면 오프닝은 성공이라고 말해요."},{"id":"a3","tk":[{"t":"{呆|あき}れて","p":"동사","m":"어이없어하며","b":"{呆|あき}れる","bm":"어이없어하다, 기가 막히다","w":"어간 呆는 한자, れて는 히라가나예요.","n":"呆れる = (너무 심해서) 어이없다. 呆れた!(어이없어!)."},{"t":"いないで","p":"보조동사","m":"~하고 있지 말고","b":"いる","bm":"있다","w":"보조동사 いる는 히라가나로 써요.","n":"〜ていないで = ~하고 있지 말고. 寝ていないで起きて = 자고 있지 말고 일어나."},{"t":"ちょっと","p":"부사","m":"잠깐, 조금","w":"부사라 히라가나로 써요.","n":"ちょっと待って = 잠깐만. 회화에서 가장 많이 쓰는 말 중 하나예요."},{"t":"{待|ま}って","p":"동사","m":"기다려 줘","b":"{待|ま}つ","bm":"기다리다","w":"어간 待는 한자, って는 히라가나예요.","n":"て형만으로 '~해 줘'라는 부탁이 돼요. 待って = 기다려 줘."}],"ko":"어이없어하지 말고 잠깐만 기다려 봐","lit":"어이없어하고 / 있지 말고 / 잠깐 / 기다려","g":[{"k":"〜ないで","d":"'~하지 말고, ~하지 마'. いる → いないで. 泣かないで = 울지 마."},{"k":"て형으로 부탁하기","d":"동사 て형만 말해도 '~해 줘'가 돼요. 待って(기다려 줘), 見て(봐 줘)."}],"c":"질려서 자리를 뜨려는 관객을 붙잡는 말투예요. 영화가 지루해지기 전에 관객을 붙드는 감독 같아요."},{"id":"a4","tk":[{"t":"きっと"},{"t":"{気|き}に{入|い}って","p":"표현","m":"마음에 들어","b":"{気|き}に{入|い}る","bm":"마음에 들다","w":"気(마음)·入(들다)는 한자, に·って는 히라가나예요.","n":"気(기분, 마음)에 入る(들어가다)라는 그림이 한국어 '마음에 들다'와 똑같아요."},{"t":"もらえる","p":"보조동사","m":"~해 받을 수 있다","b":"もらう","bm":"받다","w":"'받다'의 もらう가 '~해 받다'로 쓰일 때는 히라가나로 써요.","n":"〜てもらえる = (상대가) ~해 줄 수 있다. 気に入ってもらえる = (네가) 마음에 들어 해 줄 것이다."},{"t":"と"},{"t":"{思|おも}う","p":"동사","m":"생각하다","w":"어간 思는 한자, う는 히라가나예요."},{"t":"な"}],"ko":"분명 마음에 들어 할 거라고 생각해","lit":"분명 / 마음에 들어 / 받을 수 있다 / 라고 / 생각하다 / 네","g":[{"k":"〜てもらえる","d":"'(남이) ~해 줄 수 있다'. もらう(받다)의 가능형 もらえる. 手伝ってもらえる? = 도와줄 수 있어?"},{"k":"〜と{思|おも}う","d":"'~라고 생각하다'. 앞말이 생각의 내용이에요."}],"c":"끝의 な가 혼잣말처럼 기대를 담아요. 자신 있게 권하면서도 조금 쑥스러워하는 말투예요."},{"id":"a5","tk":[{"t":"ここ"},{"t":"までの"},{"t":"ダイジェスト","p":"명사(외래어)","m":"다이제스트, 요약판","w":"영어 digest를 가타카나로 옮긴 외래어예요.","n":"긴 영상이나 이야기를 줄인 요약판이에요. 스포츠 하이라이트 방송도 ダイジェスト라고 해요."},{"t":"を"},{"t":"　"},{"t":"{少|すこ}し","p":"부사","m":"조금"},{"t":"だけ"},{"t":"{見|み}せる"},{"t":"よ"}],"ko":"지금까지의 하이라이트를 조금만 보여 줄게","lit":"여기 / 까지의 / 다이제스트 / 를 / 조금 / 만 / 보여 주다 / 야","g":[{"k":"ここまでの + 명사","d":"'여기까지의 ~, 지금까지의 ~'. ここまでの話 = 지금까지의 이야기."}],"c":"지금까지 둘이 함께한 시간을 영화 요약 영상처럼 보여 주겠다는 말이에요. 다음 섹션이 바로 그 '다이제스트'예요."}]},{"label":"1절 · Bメロ","note":"다이제스트의 첫 장면은 처음 싸운 밤이에요. 아픈 장면도 건너뛰지 않고, 화해해서 손을 잡는 장면까지 이어 봐요.","lines":[{"id":"b1","tk":[{"t":"{初|はじ}めて","p":"부사","m":"처음으로","w":"어간 初는 한자, めて는 히라가나예요.","n":"初めまして(처음 뵙겠습니다)의 初め와 같은 말이에요."},{"t":"{喧|けん}{嘩|か}した","p":"동사","m":"싸웠던","b":"{喧|けん}{嘩|か}する","bm":"싸우다, 다투다","w":"喧·嘩 둘 다 조요칸지에 없는 어려운 한자예요. けんか로 히라가나로 쓰는 일도 많은데 한자로 썼어요.","n":"喧嘩는 말다툼부터 몸싸움까지 '싸움'을 두루 말해요. 夫婦喧嘩(ふうふげんか) = 부부 싸움."},{"t":"{夜|よる}","p":"명사","m":"밤"},{"t":"の"},{"t":"{涙|なみだ}","p":"명사","m":"눈물"}],"ko":"처음 싸웠던 밤의 눈물","lit":"처음으로 / 싸웠다 / 밤 / 의 / 눈물","g":[{"k":"과거형 + 명사","d":"동사 과거형이 그대로 명사를 꾸며요. 喧嘩した夜 = 싸운 밤."}],"c":"다이제스트는 예쁜 장면이 아니라 첫 싸움부터 시작해요. 좋은 기억만 고르지 않는 솔직한 영화예요."},{"id":"b2","tk":[{"t":"{個|こ}{人|じん}{的|てき}に","p":"부사","m":"개인적으로","b":"{個|こ}{人|じん}{的|てき}","bm":"개인적","w":"한자어 個人的에 부사를 만드는 に를 붙였어요.","n":"한국어 '개인적(個人的)'과 같은 한자어예요. らしさ에서 본 〜的(てき)가 여기도 나와요."},{"t":"{胸|むね}","p":"명사","m":"가슴"},{"t":"が"},{"t":"{痛|いた}む","p":"동사","m":"아프다","w":"어간 痛는 한자, む는 히라가나예요.","n":"痛い(아프다)는 형용사, 痛む(아파 오다)는 동사예요."},{"t":"けれど","p":"조사","m":"~지만","n":"けど보다 조금 단정한 말이에요."}],"ko":"개인적으로는 가슴이 아프지만","lit":"개인적으로 / 가슴 / 이 / 아프다 / 지만","g":[{"k":"{胸|むね}が{痛|いた}む","d":"'가슴이 아프다'. 몸의 통증보다 마음이 아플 때 많이 써요."}],"c":"감독 입장에서 '개인적으로는' 아픈 장면이라고 말하는 게 재미있어요. 영화 제작진 말투를 끝까지 지켜요."},{"id":"b3","tk":[{"t":"そのまま","p":"부사","m":"그대로","w":"その(그) + まま(채)가 합쳐진 말이라 히라가나로 써요.","n":"そのまま = 그대로, 그 상태로. らしさ에 나온 まま(~한 채)와 같은 말이에요."},{"t":"{見|み}{続|つづ}けよう","p":"동사","m":"계속 보자","b":"{見|み}{続|つづ}ける","bm":"계속 보다","w":"見·続 두 한자에 오쿠리가나가 붙은 복합동사예요.","n":"ます형 + 続ける = 계속 ~하다. Laughter의 歌い続けた와 같은 틀이에요."}],"ko":"그대로 계속 보자","lit":"그대로 / 계속 보자","g":[{"k":"의지형 〜よう","d":"'~하자, ~해야지'. 1단 동사는 る를 よう로 바꿔요. 見続ける → 見続けよう."}],"c":"아픈 장면도 멈추거나 건너뛰지 않겠다는 말이에요. 그 뒤에 오는 화해 장면이 더 소중하기 때문이에요."},{"id":"b4","tk":[{"t":"ごめん","p":"감동사","m":"미안","w":"御免이라는 한자가 있지만 사과할 때는 보통 히라가나로 써요.","n":"ごめんなさい는 조금 더 정중한 '미안해요'예요."},{"t":"ね"},{"t":"と"},{"t":"{言|い}って","p":"동사","m":"말하고","b":"{言|い}う","bm":"말하다","w":"어간 言는 한자, って는 히라가나예요."},{"t":"　"},{"t":"{仲|なか}{直|なお}りして","p":"동사","m":"화해하고","b":"{仲|なか}{直|なお}りする","bm":"화해하다","w":"仲(사이)·直(고치다) 두 한자에 오쿠리가나 り가 붙은 명사에 して를 붙였어요.","n":"仲(사이) + 直り(고쳐짐) = 사이가 다시 좋아짐. 한국어 '화해'에 해당해요."},{"t":"{手|て}","p":"명사","m":"손"},{"t":"を"},{"t":"{握|にぎ}って","p":"동사","m":"잡고","b":"{握|にぎ}る","bm":"쥐다, 잡다","w":"어간 握는 한자, って는 히라가나예요.","n":"握る = 꽉 쥐다. 手を握る = 손을 잡다. 손으로 쥐어 만드는 握り寿司(にぎりずし)의 握예요."},{"t":"…"}],"ko":"미안하다고 말하고, 화해하고, 손을 잡고…","lit":"미안 / 해 / 라고 / 말하고 / 화해하고 / 손 / 을 / 잡고","g":[{"k":"て형 나열","d":"言って、仲直りして、握って처럼 て형을 이어 '~하고 ~하고' 장면을 차례로 늘어놓아요."}],"s":"끝의 …(말줄임표)로 장면이 끝나지 않고 이어지는 느낌을 줘요.","c":"다이제스트가 싸움에서 화해까지 한 흐름으로 이어져요. 말줄임표 뒤로 곧장 후렴의 '웃는 장면'이 나와요."}]},{"label":"サビ · 후렴","note":"이 영화의 가장 큰 볼거리는 네가 웃는 장면이에요. 사진에도 다 담기지 않는 작은 몸짓이 어두운 이야기도 뒤집는다고 노래해요.","lines":[{"id":"c1","tk":[{"t":"ほら","p":"감동사","m":"봐, 자","w":"감탄사라 히라가나로 써요."},{"t":"、"},{"t":"ここ"},{"t":"で"},{"t":"{君|きみ}"},{"t":"が"},{"t":"{笑|わら}う"},{"t":"シーン","p":"명사(외래어)","m":"장면, 신","w":"영어 scene을 가타카나로 옮긴 외래어예요.","n":"일본어로는 場面(ばめん)이라고도 해요. 아웃트로의 名場面(명장면)과 같은 뜻이에요."},{"t":"が"},{"t":"　"},{"t":"{見|み}どころ","p":"명사","m":"볼거리, 하이라이트","w":"見所로도 쓰는데 ところ를 히라가나로 풀었어요. 후렴 끝의 今の所에서는 같은 ところ를 한자 所로 썼어요.","n":"見(보다) + 所(곳) = 볼 만한 곳. 영화나 여행지 소개에서 자주 써요."},{"t":"なんだ","p":"조동사","m":"~인 거야","n":"な + んだ. 명사 뒤에서 '~인 거야'라고 힘주어 말해요."},{"t":"から"},{"t":"さ"},{"t":"　"},{"t":"Ah"}],"ko":"봐, 여기서 네가 웃는 장면이 이 영화의 하이라이트니까, Ah","kr":"호라, 코코데 키미가 와라우 시-응가 미도코로난다카라사 아-","lit":"봐 / 여기 / 에서 / 너 / 가 / 웃다 / 장면 / 이 / 볼거리 / 인 거다 / 니까 / 야 / 아","g":[{"k":"명사 + なんだから","d":"'~이니까 (말이야)'. 이유를 힘주어 내세워요. 子供なんだから = 아이니까."},{"k":"ほら","d":"상대의 눈길을 끄는 '봐'. Laughter의 ほら와 같아요."}],"c":"영화를 같이 보는 사람에게 '지금이야, 잘 봐' 하고 화면을 가리키는 모습이 떠올라요. 이 영화에서 가장 중요한 장면은 거창한 사건이 아니라 네 웃음이에요."},{"id":"c2","tk":[{"t":"{写|しゃ}{真|しん}","p":"명사","m":"사진","n":"한국어 '사진(寫眞)'과 같은 한자어예요. 写는 寫의 일본식 약자예요."},{"t":"に"},{"t":"も","m":"~에도"},{"t":"{映|うつ}せ","p":"동사","m":"담을 수 (있다)","b":"{映|うつ}す","bm":"비추다, (사진·화면에) 담다","w":"어간 映는 한자, せ는 히라가나예요.","n":"映す(비추다)의 가능형 映せる에서 る가 빠진 꼴이에요. 뒤의 やしない와 합쳐 '도저히 담을 수 없다'가 돼요."},{"t":"や","p":"조사","m":"(강조) ~지도"},{"t":"しない","p":"동사","m":"하지 않는다","b":"する","bm":"하다"},{"t":"　"},{"t":"とても","p":"부사","m":"아주, 몹시"},{"t":"{些|さ}{細|さい}な","p":"な형용사","m":"사소한","b":"{些|さ}{細|さい}","bm":"사소함","w":"些는 조요칸지에 없는 글자예요. 細(가늘 세)와 합쳐 '아주 작은'이라는 뜻이에요.","n":"些(적을 사)는 한국어 '사소(些少)하다'의 些와 같은 글자예요."},{"t":"その"},{"t":"{仕|し}{草|ぐさ}","p":"명사","m":"몸짓, 행동","w":"仕草는 한자 뜻보다 소리에 맞춰 붙인 표기로 알려져 있어요. 仕種로도 쓰고, 히라가나 しぐさ로도 많이 써요.","n":"仕草 = 무심코 하는 작은 몸짓이나 버릇. 髪を触る仕草 = 머리를 만지는 몸짓."},{"t":"に"}],"ko":"사진에도 담을 수 없는 아주 사소한 그 몸짓에","lit":"사진 / 에 / 도 / 담을 수 / 지도 / 하지 않는다 / 아주 / 사소한 / 그 / 몸짓 / 에","g":[{"k":"〜やしない","d":"'도저히 ~하지 않는다, ~할 리 없다'. ます형 + やしない로 강하게 부정해요. 分かりやしない = 알 리가 없다. 여기서는 가능형 映せ + やしない = 도저히 담을 수 없다."}],"c":"사진은 한순간을 멈춰 찍지만, 웃을 때의 작은 몸짓은 움직임이라 사진으로는 다 남지 않아요. 그래서 '영화(필름)'로 찍는다는 곡의 설정과 이어져요."},{"id":"c3","tk":[{"t":"どんな","p":"연체사","m":"어떤","w":"こ·そ·あ·ど 지시어라 히라가나로 써요."},{"t":"{暗|くら}い","p":"い형용사","m":"어두운","w":"어간 暗는 한자, い는 오쿠리가나예요."},{"t":"ストーリー","p":"명사(외래어)","m":"이야기, 스토리","w":"영어 story를 가타카나로 옮긴 외래어예요.","n":"Pretender에도 나온 외래어예요."},{"t":"も","m":"~라도"},{"t":"　"},{"t":"{覆|くつがえ}す","p":"동사","m":"뒤엎다","w":"어간 覆는 한자, す는 히라가나예요.","n":"Laughter의 予想を覆した(예상을 뒤엎었다)와 같은 동사예요."},{"t":"{瞬|しゅん}{間|かん}","p":"명사","m":"순간","n":"한국어 '순간(瞬間)'과 같은 한자어예요. 瞬(눈 깜짝할 순)."},{"t":"が"},{"t":"{溢|あふ}れてる","p":"동사","m":"넘쳐나고 있어","b":"{溢|あふ}れる","bm":"넘치다","w":"어간 溢는 한자, れてる는 히라가나예요. 溢는 조요칸지에 없는 글자라 あふれる로 쓰는 일도 많아요.","n":"溢れている의 い가 빠진 회화체예요. 涙が溢れる = 눈물이 넘쳐흐르다."}],"ko":"어떤 어두운 이야기도 뒤집어 버리는 순간이 넘쳐나","lit":"어떤 / 어두운 / 스토리 / 도 / 뒤엎다 / 순간 / 이 / 넘쳐나고 있다","g":[{"k":"どんな + 명사 + も","d":"'어떤 ~라도'. どんな時も = 어떤 때라도. 뒤에 오는 말이 예외 없이 적용된다는 뜻이에요."}],"c":"영화로 치면 어두운 전개도 네 웃음 한 번이면 행복한 이야기로 바뀐다는 말이에요."},{"id":"c4","tk":[{"t":"どれ","p":"대명사","m":"어느 것","w":"こ·そ·あ·ど 지시어라 히라가나로 써요."},{"t":"か"},{"t":"ひとつ"},{"t":"を"},{"t":"{切|き}り{取|と}って","p":"동사","m":"잘라 내서","b":"{切|き}り{取|と}る","bm":"잘라 내다","w":"切·取 두 한자에 오쿠리가나가 붙은 복합동사예요.","n":"切る(자르다) + 取る(취하다) = 잘라 내다. 写真で風景を切り取る(사진으로 풍경을 담아내다)처럼 '한 장면을 골라 담다'는 뜻으로도 써요."},{"t":"　"},{"t":"サムネイル","p":"명사(외래어)","m":"썸네일","w":"영어 thumbnail을 가타카나로 옮긴 외래어예요.","n":"영상이나 사진을 작게 보여 주는 대표 이미지예요. 회화에서는 줄여서 サムネ라고 해요."},{"t":"に"},{"t":"しよう","p":"동사","m":"하자","b":"する","bm":"하다","w":"する의 의지형이에요."}],"ko":"그중 하나를 잘라 내서 썸네일로 하자","lit":"어느 것 / 인가 / 하나 / 를 / 잘라 내서 / 썸네일 / 로 / 하자","g":[{"k":"명사 + にする","d":"'~로 하다, ~로 정하다'. サムネイルにしよう = 썸네일로 하자. コーヒーにする = 커피로 할게."},{"k":"どれか","d":"'어느 것인가, 어느 하나'. 의문사 + か = 정해지지 않은 무엇. 誰か(누군가), どこか(어딘가)."}],"c":"수많은 웃는 장면 중 하나를 이 영화의 대표 이미지로 쓰겠다는 말이에요. 영상 사이트에서 익숙한 サムネイル이라는 말에 요즘 감각이 묻어나요."},{"id":"c5","tk":[{"t":"とりあえず","p":"부사","m":"일단, 우선","w":"取り敢えず라는 한자가 있지만 보통 히라가나로 써요.","n":"일본 술집에서 とりあえずビール(일단 맥주)라는 말이 유명해요."},{"t":"{今|いま}の{所|ところ}","p":"표현","m":"지금으로서는","w":"今(지금)·所(곳)는 한자, の는 히라가나예요. 같은 후렴의 見どころ에서는 ところ를 히라가나로 썼어요.","n":"今のところ = 지금으로서는, 현재까지는. 앞으로 바뀔 수 있다는 느낌을 담아요."},{"t":"は"}],"ko":"일단 지금으로서는 말이야","lit":"일단 / 지금으로서는 / 은","g":[{"k":"{今|いま}の{所|ところ}は","d":"'지금으로서는'. 앞으로 더 좋은 장면이 나오면 바뀔 수도 있다는 여지를 남겨요."}],"c":"썸네일은 '일단 지금은' 이걸로 하자는 말이에요. 앞으로 더 멋진 장면이 계속 생길 거라는 기대가 2절로 이어져요."}]},{"label":"2절 · Aメロ","note":"10년 뒤를 상상해요. 출연진이 늘어날지도 모르고, 박봉에 한심한 모습도 많이 보이겠지만요.","lines":[{"id":"d1","tk":[{"t":"きっと"},{"t":"{10|じゅう}{年|ねん}{後|ご}","p":"명사","m":"10년 뒤","v":false,"w":"숫자는 아라비아 숫자 10, 年·後는 한자예요. 가사에서도 숫자는 아라비아 숫자로 쓰는 일이 많아요.","n":"숫자 + 年後(ねんご) = ~년 뒤. 10은 じゅう로 읽어요. 3年後(さんねんご) = 3년 뒤."},{"t":"くらい"},{"t":"には"},{"t":"　"},{"t":"キャスト","p":"명사(외래어)","m":"출연진, 캐스트","w":"영어 cast를 가타카나로 옮긴 외래어예요.","n":"영화나 드라마의 출연진이에요. 여기서는 가족이 늘어나는 것을 영화 말로 돌려 말한 것으로 읽혀요."},{"t":"が"},{"t":"{増|ふ}えたり","p":"동사","m":"늘거나","b":"{増|ふ}える","bm":"늘다","w":"어간 増는 한자, えたり는 히라가나예요.","n":"増える(늘다, 자동사)와 増やす(늘리다, 타동사)는 짝이에요."},{"t":"も"},{"t":"するんだろう","p":"동사","m":"하겠지","b":"する","bm":"하다","w":"する는 기본 동사라 히라가나로 써요.","n":"する + んだろう(~하겠지). んだろう는 のだろう의 회화체로, '아마 ~하겠지'라고 짐작해요."}],"ko":"아마 10년쯤 뒤에는 출연진이 늘기도 하겠지","lit":"분명 / 10년 뒤 / 쯤 / 에는 / 캐스트 / 가 / 늘거나 / 도 / 하다 / 겠지","g":[{"k":"〜たりもする","d":"'~하기도 하다'. 동사 た형 + り + もする. 増えたりもする = 늘기도 한다. 여러 일 중 하나를 예로 들어요."},{"k":"〜んだろう","d":"'~하겠지'. 확신은 없지만 그럴 것 같다고 짐작해요. きっと와 함께 자주 써요."}],"c":"'출연진이 늘어난다'는 영화 말로 가족이 늘어나는 미래를 돌려 말해요. 결혼식에서 이 곡을 많이 트는 것도 이런 가사와 이어져 보여요."},{"id":"d2","tk":[{"t":"{今|いま}"},{"t":"でも","p":"조사","m":"~도, ~라도","n":"今でも = 지금도."},{"t":"{余|よ}{裕|ゆう}","p":"명사","m":"여유","n":"한국어 '여유(餘裕)
