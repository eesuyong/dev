/ 듣지 않는 / 것 / 알고 있다 / 지만","g":[{"k":"〜こと + {知|し}ってる","d":"'~라는 것을 알고 있다'. 원래 ことを知ってる인데 を가 빠졌어요."},{"k":"は → が","d":"앞 후렴은 君は(너는), 여기서는 君が(네가)예요. 문장 속 문장의 주어에는 が를 써요."}],"s":"知る는 る로 끝나서 1단 동사처럼 보이지만 5단 동사예요. 그래서 て형이 知って가 돼요. 초보자가 자주 헷갈리는 동사예요.","c":"앞 후렴은 '안 듣겠지 생각하면서'였는데, 여기서는 '안 듣는다는 걸 알고 있다'예요. 짐작이 확신으로 바뀌었어요."},{"id":"g2","tk":[{"t":"{恋人|こいびと}","p":"명사","m":"연인","w":"恋(こい)와 人(ひと)가 합쳐지며 ひ가 び로 탁해졌어요(렌다쿠).","n":"한국어 '연인(戀人)'과 같은 한자어지만 こいびと라고 쿤요미로 읽어요."},{"t":"の"},{"t":"ように","p":"조동사","m":"~처럼","n":"명사 + のように = '~처럼'. 恋人のように = 연인처럼."},{"t":"{寄|よ}り{添|そ}って","p":"동사","m":"곁에 붙어","b":"{寄|よ}り{添|そ}う","bm":"바싹 다가붙다, 곁에 있어 주다","w":"寄(가까이하다)와 添(곁들이다) 두 한자 사이에 り가 끼었어요. 寄る + 添う가 합쳐진 복합동사예요.","n":"몸을 기대 붙는 것뿐 아니라, 마음으로 곁을 지켜 준다는 뜻으로도 써요. 気持ちに寄り添う(마음을 헤아려 주다)."},{"t":"ほしくて"}],"ko":"연인처럼 곁에 붙어 있어 줬으면 해서","lit":"연인 / 의 / 처럼 / 곁에 붙어 / 주길 바라서","g":[{"k":"〜のように","d":"'~처럼'. 恋人のように寄り添う = 연인처럼 바싹 붙다."}],"s":"恋人은 한국어 '연인'과 같은 한자지만, 일본어는 온요미(れんじん)가 아니라 쿤요미 こいびと로 읽어요.","c":"앞 후렴은 '다가와 줬으면'이었는데, 이번에는 '연인처럼 곁에'예요. 바람이 점점 커져요."},{"same":"c3"},{"same":"c4"},{"id":"g3","tk":[{"t":"また","p":"부사","m":"또, 다시","w":"부사라 히라가나로 써요."},{"t":"{胸|むね}","p":"명사","m":"가슴","n":"胸が痛い = 가슴이 아프다. 胸がいっぱい(가슴이 벅차다)."},{"t":"が"},{"t":"{痛|いた}いんだ","p":"い형용사","m":"아픈 거야","b":"{痛|いた}い","bm":"아프다","w":"어간 痛는 한자, いんだ는 히라가나예요.","n":"痛い + んだ(설명·강조). 痛い는 몸이 아플 때도, 마음이 아플 때도 써요."}],"ko":"또 가슴이 아파","lit":"또 / 가슴 / 이 / 아픈 거다","g":[{"k":"〜んだ","d":"설명이나 감정을 강조하는 말끝. 痛い → 痛いんだ(아픈 거야). 앞의 焦がれてきたんだ와 같아요."}],"s":"痛いんだ처럼 형용사 뒤 んだ는 한 덩어리로 읽어요. 한글로는 '이타인다'예요.","c":"사랑을 넘어 왔다던 노래들이, 이번에는 또 가슴을 아프게 해요. 너를 향한 마음 때문이라고 읽혀요."}]},{"label":"ラストサビ · 마지막 후렴","note":"첫 후렴을 그대로 되풀이하고, '사랑을 넘어 왔어'를 한 번 더 부르며 끝나요.","lines":[{"same":"c1"},{"same":"c2"},{"same":"c3"},{"same":"c4"},{"same":"c5"},{"same":"c5"}]}]},"film":{"id":"film","title":"115{万|まん}キロのフィルム","artist":"Official髭男dism","year":2018,"eyebrow":"Official髭男dism · 2018","sub":"너와의 평생을 한 편의 영화로 찍겠다는 사랑 노래. 앨범 『エスカパレード』 수록, 2020년 실사 영화 「思い、思われ、ふり、ふられ」 주제가.","release":"2018년 4월 11일 · 앨범 『エスカパレード』 수록","tieIn":"실사 영화 「思い、思われ、ふり、ふられ」(2020) 주제가","lyricist":"藤原聡","composer":"藤原聡","listen":"https://www.youtube.com/results?search_query=Official%E9%AB%AD%E7%94%B7dism+115%E4%B8%87%E3%82%AD%E3%83%AD%E3%81%AE%E3%83%95%E3%82%A3%E3%83%AB%E3%83%A0","intro":"115万キロのフィルム(ひゃくじゅうごまんキロのフィルム, 115만 킬로의 필름)은 2018년 4월에 나온 앨범 『エスカパレード』에 실린 곡이에요. 앨범 수록곡이었지만 결혼식 노래로도 사랑받았고, 2020년에는 실사 영화 「思い、思われ、ふり、ふられ」의 주제가가 되었어요.\n\n노래는 '지금부터 부를 곡은 내 머릿속 영화 이야기'라는 소개로 시작해요. 주연은 너, 나는 조연이자 감독이자 카메라맨이에요. 첫 싸움, 화해, 네가 웃는 장면을 영화처럼 찍고, 평생을 찍을 필름 115만 킬로를 준비했다고 노래해요. 영화 용어가 어떻게 사랑의 말이 되는지 따라가며 읽어 보세요.","notes":[{"tag":"배경","title":"앨범 수록곡에서 영화 주제가로","body":"115万キロのフィルム은 2018년 4월 11일에 나온 앨범 『エスカパレード』에 실린 곡이에요. 싱글이 아니라 앨범 수록곡이었지만 팬들 사이에서 사랑받았고, 결혼식 노래로도 많이 쓰였어요.\n\n2020년에는 8월 14일 개봉한 실사 영화 「思い、思われ、ふり、ふられ」의 주제가가 됐어요. 감독 三木孝浩가 작품에 맞는 곡으로 이 노래를 골랐다고 해요. 곡 속에서 '엔딩 크레디트는 만들고 싶지도 않다'고 노래한 곡이 영화의 엔딩 크레디트에 흐르게 된 셈이에요.\n\n히게단에게 영화와 무대는 익숙한 소재예요. Pretender는 이뤄지지 않는 사랑을 연극에 빗댔고, Laughter는 영화 「コンフィデンスマンJP」의 주제가였어요. 이 곡은 사랑 그 자체를 한 편의 영화로 그려요."},{"tag":"표현","title":"115만 킬로는 무슨 길이일까","body":"제목의 115万キロ(115만 킬로)는 평생을 영화 필름에 담을 때 필요한 길이로 풀이돼요. 藤原聡가 직접 밝힌 계산은 아니지만, 실제로 계산해 보면 딱 맞아떨어져서 널리 알려진 풀이예요.\n\n영화관에서 쓰던 35mm 필름은 1초에 24장면(프레임)을 찍고, 1초 분량이 약 45.7cm예요. 이 필름을 80년 동안 쉬지 않고 돌리면 약 115만 km가 돼요. 지구를 약 29바퀴 도는 길이이고, 달까지 거리(약 38만 km)의 약 3배예요.\n\n그래서 브리지의 [[{一|いっ}{生|しょう}{分|ぶん}の{長|なが}さを　ざっと{115万|ひゃくじゅうごまん}キロ]]는 '너와 함께할 평생을 빠짐없이 찍을 필름을 준비했다'는 고백이에요. 사랑한다는 말 대신 숫자로 평생을 약속한 노래예요."},{"tag":"표현","title":"사랑을 영화로 찍는 말들","body":"이 곡에는 영화 현장의 말이 줄줄이 나와요.\n\n**만드는 사람**: [[{主|しゅ}{演|えん}]](주연), [[{助|じょ}{演|えん}]](조연), [[{監|かん}{督|とく}]](감독), [[カメラマン]](카메라맨), [[キャスト]](출연진)\n\n**만드는 과정**: [[{撮|さつ}{影|えい}]](촬영), [[クランクアップ]](촬영 종료), [[フィルム]](필름), [[{焼|や}き{付|つ}ける]](인화하다, 새기다)\n\n**보여 주는 방법**: [[{掴|つか}み]](도입부), [[ダイジェスト]](요약), [[シーン]](장면), [[{見|み}どころ]](볼거리), [[サムネイル]](썸네일), [[{展|てん}{開|かい}]](전개), [[{名|めい}{場|ば}{面|めん}]](명장면), [[エンドロール]](엔딩 크레디트)\n\n주연·조연·감독·촬영처럼 한국어 한자음과 똑같은 한자어가 많아서 뜻을 짐작하기 쉬워요. 외래어는 모두 가타카나로 써서, 한자어와 외래어가 섞인 영화 현장의 말맛이 그대로 살아 있어요."},{"tag":"표기","title":"일본식 영어: キャパオーバー·エンドロール·クランクアップ","body":"가타카나로 쓴 말이 모두 영어에서 그대로 온 건 아니에요. 영어 단어를 일본에서 새로 조합한 말을 [[{和製英語|わせいえいご}]](일본식 영어)라고 해요.\n\n[[キャパオーバー]]: capacity를 줄인 キャパ에 over를 붙인 말로, '감당할 수 있는 양을 넘었다'는 뜻이에요. 영어권에서는 이렇게 말하지 않아요.\n\n[[エンドロール]]: end + roll. 영어로는 end credits예요.\n\n[[クランクアップ]]: 옛날 영화 카메라를 손잡이(crank)로 돌려 찍던 데서 온 말이에요. 일본에서는 촬영 시작을 クランクイン, 촬영 종료를 クランクアップ라고 해요. 영어 crank up과는 뜻이 달라요.\n\n한국어에도 '핸드폰', '아이쇼핑' 같은 한국식 영어가 있듯이, 일본어 가타카나에도 이런 말이 많아요. 외울 때는 실제 영어와 뜻이 다를 수 있다는 점을 기억해 두세요."},{"tag":"문화","title":"苗字がひとつになった日: 결혼과 성","body":"일본에서는 법으로 결혼한 부부가 같은 성(苗字)을 써야 해요. 대부분 아내가 남편의 성으로 바꾸기 때문에, '성이 하나가 된 날'이라고 하면 바로 결혼한 날을 떠올려요. 결혼해도 성이 바뀌지 않는 한국과 다른 점이에요. 부부가 각자의 성을 쓸 수 있게 하자는 '선택적 부부별성(選択的夫婦別姓)' 논의도 오래 이어지고 있어요.\n\n이 곡은 결혼이라는 말을 직접 쓰지 않고 [[{苗|みょう}{字|じ}がひとつになった{日|ひ}]]라고 돌려 말해요. 그리고 바로 다음 줄에 [[{何|なに}ひとつ{代|か}わり{映|ば}えのない{日|ひ}]](무엇 하나 다를 것 없는 날)을 나란히 놓아, 특별한 날과 평범한 날을 똑같이 소중하게 다뤄요."},{"tag":"표기","title":"永遠(とわ), 見どころ와 今の所, 그리고 숫자","body":"**특수 읽기**: [[{永遠|とわ|*}]]은 보통 えいえん이라고 읽어요. Pretender에서도 えいえん이었죠. 이 곡에서는 '영원'을 뜻하는 예스러운 말 とわ를 읽기로 달았어요. 노래에서는 한자로 뜻을 보여 주고, 읽기로 분위기를 바꾸는 일이 많아요.\n\n**같은 말, 다른 표기**: 후렴의 [[{見|み}どころ]]는 ところ를 히라가나로, 바로 뒤의 [[{今|いま}の{所|ところ}]]는 한자 所로 썼어요. 한 곡 안에서 같은 말이 두 가지로 쓰였어요.\n\n**숫자**: [[{115万|ひゃくじゅうごまん}]]와 [[{10|じゅう}{年|ねん}{後|ご}]]는 아라비아 숫자에 万·年 같은 한자 단위를 붙였어요. [[{一|いっ}{生|しょう}{分|ぶん}]]·[[{何|なに}ひとつ]]처럼 말로 굳은 표현은 한자나 히라가나로 써요.\n\n**조요칸지 밖의 한자**: [[{掴|つか}み]]의 掴, [[{喧|けん}{嘩|か}]]의 喧·嘩, [[{些|さ}{細|さい}]]의 些, [[{溢|あふ}れる]]의 溢는 조요칸지 목록에 없는 글자예요. Laughter의 覗·囀처럼, 히게단 가사에는 이런 한자가 꾸준히 나와요."},{"tag":"문화","title":"酸いも甘いも: 인생의 신맛 단맛","body":"아웃트로의 [[{酸|す}いも{甘|あま}いも]]는 '신맛도 단맛도'라는 뜻이에요. 원래 [[{酸|す}いも{甘|あま}いも{噛|か}み{分|わ}ける]]라는 관용 표현으로, 인생의 좋은 일과 힘든 일을 다 겪어서 세상 물정을 잘 안다는 뜻이에요. 한국어 '산전수전 다 겪다', '단맛 쓴맛 다 보다'와 비슷해요.\n\n이 곡은 그 표현을 빌려 [[{寄|よ}り{添|そ}って　{一|いっ}{緒|しょ}に{味|あじ}わおう]](곁에 붙어 함께 맛보자)라고 해요. 좋은 날만 함께하자는 게 아니라 힘든 날도 같이 겪자는 약속이에요. 결혼식의 '기쁠 때나 슬플 때나'라는 서약과도 닮았어요."}],"dict":{"{僕|ぼく}":{"p":"대명사","m":"나 (남성)","w":"1인칭 대명사로 한자로 쓰는 게 일반적이에요.","n":"부드럽고 소년 같은 느낌의 남성 1인칭이에요. 히게단 곡의 화자는 대부분 僕예요."},"{君|きみ}":{"p":"대명사","m":"너 (이 영화의 주연)","w":"'너'를 뜻하는 대명사로, 한자로 쓰는 게 일반적이에요."},"フィルム":{"p":"명사(외래어)","m":"필름","w":"영어 film을 가타카나로 옮긴 외래어예요.","n":"카메라에 넣는 필름과 영화 자체를 모두 가리켜요. 이 곡에서는 너와의 기억을 담는 필름이에요."},"{今|いま}":{"p":"명사","m":"지금"},"{歌|うた}":{"p":"명사","m":"노래","n":"歌(노래 가)에 う를 붙이면 동사 歌う(うたう, 노래하다)예요."},"{歌|うた}う":{"p":"동사","m":"노래하다, 부르다","w":"어간 歌는 한자, う는 히라가나예요."},"ひとつ":{"p":"명사","m":"하나","b":"{一|ひと}つ","bm":"하나","w":"一つ로 쓸 수 있는데 히라가나로 풀었어요. 숫자를 센다기보다 '하나가 되다', '하나도'처럼 말로 쓸 때 히라가나로 쓰는 일이 많아요."},"きっと":{"p":"부사","m":"분명, 아마 꼭","w":"부사라 히라가나로 써요."},"だから":{"p":"접속사","m":"그러니까","w":"접속사라 히라가나로 써요."},"Ah":{"p":"감동사(영어)","m":"아","v":false,"w":"영어 감탄사 Ah를 알파벳 그대로 썼어요."},"{笑|わら}う":{"p":"동사","m":"웃다","w":"어간 笑는 한자, う는 히라가나예요."},"{見|み}せる":{"p":"동사","m":"보여 주다","w":"어간 見는 한자, せる는 히라가나예요.","n":"見る(보다)와 짝이 되는 見せる(보여 주다)예요."},"{日|ひ}":{"p":"명사","m":"날"},"{日々|ひび}":{"p":"명사","m":"나날","w":"々는 앞 글자를 되풀이하는 기호예요. 日々 = 日日. 단어 전체에 ひび라는 읽기가 붙어요.","n":"人々(ひとびと, 사람들), 時々(ときどき, 가끔)도 같은 々예요."},"ここ":{"p":"대명사","m":"여기","w":"こ·そ·あ·ど 지시어라 히라가나로 써요."},"この":{"p":"연체사","m":"이","w":"こ·そ·あ·ど 지시어라 히라가나로 써요."},"その":{"p":"연체사","m":"그","w":"こ·そ·あ·ど 지시어라 히라가나로 써요."},"ない":{"p":"い형용사","m":"없다","b":"ない","bm":"없다","w":"'없다'의 ない는 히라가나로 써요."},"の":{"p":"조사","m":"~의"},"は":{"p":"조사","m":"~은/는 (주제)","n":"조사로 쓸 때는 wa로 읽어요."},"が":{"p":"조사","m":"~이/가"},"を":{"p":"조사","m":"~을/를","n":"발음은 お(o)와 같아요."},"に":{"p":"조사","m":"~에, ~로"},"も":{"p":"조사","m":"~도"},"で":{"p":"조사","m":"~에서, ~로"},"と":{"p":"조사","m":"~라고 (인용)"},"よ":{"p":"조사(종조사)","m":"~야, ~할게 (알려 주는 말투)","n":"문장 끝에 붙어 '내가 말해 줄게'라는 느낌을 더해요."},"か":{"p":"조사","m":"~인가 (불확실)"},"から":{"p":"조사","m":"~니까 (이유)"},"な":{"p":"조사(종조사)","m":"~네, ~지 (혼잣말)","n":"문장 끝의 な는 혼잣말처럼 느낌을 담아요."},"ね":{"p":"조사(종조사)","m":"~해 (부드럽게)","n":"문장 끝에서 말투를 부드럽게 하거나 동의를 구해요."},"さ":{"p":"조사(종조사)","m":"~야, ~지 (가볍게 맺음)","n":"문장 끝의 さ는 가볍게 툭 던지듯 말을 맺는 회화체예요."},"には":{"p":"조사(복합)","m":"~에는, ~에게는","n":"に + は. は 때문에 niwa로 읽어요."},"までの":{"p":"조사(복합)","m":"~까지의"},"なんて":{"p":"조사","m":"~ 같은 것, ~따위","n":"앞말을 가볍게 낮추거나 '그런 건' 하고 밀어내는 느낌을 담아요."},"くらい":{"p":"조사","m":"~쯤, ~정도"},"だけ":{"p":"조사","m":"~만"},"ように":{"p":"조동사","m":"~하도록","n":"〜ないように = ~하지 않도록."}},"sections":[{"label":"イントロ · 도입","note":"노래를 시작하자마자 '이건 내 머릿속 영화 이야기'라고 소개해요. 주연은 너, 나는 조연이자 감독이자 카메라맨이에요.","lines":[{"id":"i1","tk":[{"t":"これから","p":"부사","m":"이제부터, 지금부터","w":"지시어 これ(이것)에 から(~부터)가 붙은 말이라 히라가나로 써요.","n":"これから = 이제부터, 앞으로. 마지막 아웃트로에도 さあ、これから生まれる로 다시 나와요."},{"t":"{歌|うた}う"},{"t":"{曲|きょく}","p":"명사","m":"곡","n":"한국어 '곡(曲)'과 같은 한자예요. 作曲(さっきょく) = 작곡."},{"t":"の"},{"t":"{内|ない}{容|よう}","p":"명사","m":"내용","n":"한국어 '내용(內容)'과 같은 한자어예요."},{"t":"は"}],"ko":"지금부터 부를 노래의 내용은","lit":"이제부터 / 부르다 / 곡 / 의 / 내용 / 은","g":[{"k":"동사 사전형 + 명사","d":"동사가 그대로 명사를 꾸며요. 歌う曲 = 부를 곡. 한국어처럼 '~할/~하는'을 따로 붙이지 않아요."}],"c":"노래를 시작하며 노래의 내용을 먼저 소개하는, 무대 인사 같은 첫 줄이에요. 듣는 사람을 영화관 객석에 앉히는 느낌이에요."},{"id":"i2","tk":[{"t":"{僕|ぼく}"},{"t":"の"},{"t":"{頭|あたま}","p":"명사","m":"머리","n":"頭(머리 두)는 頭痛(ずつう, 두통)처럼 한자어에서는 ず·とう로 읽어요."},{"t":"の"},{"t":"{中|なか}","p":"명사","m":"안, 속"},{"t":"の"},{"t":"こと","p":"형식명사","m":"것, 일","w":"형식명사라 히라가나로 써요."}],"ko":"내 머릿속 이야기야","lit":"나 / 의 / 머리 / 의 / 속 / 의 / 것","g":[{"k":"명사 + のこと","d":"'~에 관한 것, ~ 이야기'. 君のこと = 너에 관한 것. 頭の中のこと = 머릿속에 있는 일들."}],"s":"の가 세 번 이어져요(僕の頭の中のこと). 히라가나 の가 한자 명사 사이를 이어 주는 모습이 잘 보이는 줄이에요.","c":"앞으로 나올 장면은 실제로 찍은 영화가 아니라 내 머릿속 상상이라는 설정이에요."},{"id":"i3","tk":[{"t":"{主|しゅ}{演|えん}","p":"명사","m":"주연","n":"한국어 '주연(主演)'과 같은 한자어예요. 主人公(しゅじんこう, 주인공)의 主예요."},{"t":"は"},{"t":"もちろん","p":"부사","m":"물론","w":"勿論이라는 한자가 있지만 보통 히라가나로 써요.","n":"회화에서 '물론이지!'라고 대답할 때도 もちろん!이라고 해요."},{"t":"{君|きみ}"},{"t":"で","p":"조동사","m":"~이고 (だ의 이어 주는 꼴)","n":"だ(~이다)가 문장을 이어 갈 때 で가 돼요. 主演は君で = 주연은 너이고."}],"ko":"주연은 물론 너고","lit":"주연 / 은 / 물론 / 너 / 이고","g":[{"k":"명사 + で (이어 말하기)","d":"'~이고'. だ의 연용형 で로 다음 말을 이어요. 다음 줄의 助演で監督で(조연이고 감독이고)도 같은 で예요."}],"c":"영화 크레디트의 맨 앞자리, 주연은 당연히 '너'예요. 사랑 노래를 영화 제작진 소개처럼 시작해요."},{"id":"i4","tk":[{"t":"{僕|ぼく}"},{"t":"は"},{"t":"{助|じょ}{演|えん}","p":"명사","m":"조연","n":"한국어 '조연(助演)'과 같은 한자어예요. 助(도울 조)는 助ける(たすける, 돕다)의 助예요."},{"t":"で","p":"조동사","m":"~이고"},{"t":"{監|かん}{督|とく}","p":"명사","m":"감독","n":"한국어 '감독(監督)'과 같은 한자어예요. 영화감독은 映画監督(えいがかんとく)."},{"t":"で","p":"조동사","m":"~이고"},{"t":"カメラマン","p":"명사(외래어)","m":"카메라맨, 촬영 기사","w":"영어 cameraman을 가타카나로 옮긴 외래어예요.","n":"일본에서 カメラマン은 사진작가와 영상 촬영 기사를 모두 가리켜요."}],"ko":"나는 조연이자 감독이자 카메라맨","lit":"나 / 는 / 조연 / 이고 / 감독 / 이고 / 카메라맨","g":[{"k":"AでBでC","d":"'A이고 B이고 C'. で로 여러 역할을 줄줄이 이어요. 僕は助演で監督でカメラマン = 나는 조연이자 감독이자 카메라맨."}],"s":"主演·助演·監督은 한국어 한자음과 똑같은 한자어, カメラマン은 외래어라 가타카나예요. 한자어와 외래어가 섞인 영화 현장 말이 이어져요.","c":"주인공 자리는 너에게 주고, 나머지 일은 내가 다 맡겠다는 말이에요. 너를 가장 잘 찍고 싶다는 마음으로 읽혀요."},{"id":"i5","tk":[{"t":"{目|め}","p":"명사","m":"눈","n":"目(눈 목)는 目的(もくてき, 목적)처럼 한자어에서는 もく로 읽어요."},{"t":"の"},{"t":"{奥|おく}","p":"명사","m":"안쪽, 깊은 곳"},{"t":"に"},{"t":"ある","p":"동사","m":"있다","w":"ある(있다)는 보통 히라가나로 써요."},{"t":"フィルム"},{"t":"で","m":"~로 (수단)"}],"ko":"눈 깊숙이 있는 필름으로","lit":"눈 / 의 / 안쪽 / 에 / 있다 / 필름 / 으로","g":[{"k":"〜で (수단)","d":"'~로, ~을 써서'. フィルムで作る = 필름으로 만들다, ペンで書く = 펜으로 쓰다."}],"c":"카메라 대신 내 눈이 너를 찍고, 기억이 필름이 된다는 비유예요. 제목의 フィルム(필름)가 여기서 처음 나와요."},{"id":"i6","tk":[{"t":"{作|つく}る","p":"동사","m":"만들다","w":"어간 作는 한자, る는 히라가나예요.","n":"作(지을 작)는 作品(さくひん, 작품)의 作예요."},{"t":"{映|えい}{画|が}","p":"명사","m":"영화","n":"한국어 '영화(映畫)'와 같은 한자어예요. 画는 畫의 일본식 약자예요."},{"t":"の"},{"t":"{話|はなし}","p":"명사","m":"이야기","w":"話す(はなす, 이야기하다)의 명사형인데, 명사로 쓸 때는 오쿠리가나 없이 話 한 글자로 써요."},{"t":"さ"},{"t":"　"},{"t":"Ah"}],"ko":"내가 만드는 영화 이야기야, Ah","kr":"츠쿠루 에이가노 하나시사 아-","lit":"만들다 / 영화 / 의 / 이야기 / 야 / 아","g":[{"k":"〜さ","d":"문장 끝의 さ는 '~야, ~지'처럼 가볍게 말을 맺어요. 映画の話さ = 영화 이야기야. よ보다 툭 던지는 느낌이에요."}],"c":"첫 여섯 줄이 한 편의 예고편이에요. 이제부터 나오는 장면들이 모두 이 '영화'의 장면이라는 걸 알려 줘요."}]},{"label":"1절 · Aメロ","note":"시시하다고 웃어 줬다면 첫 장면은 성공이라며, 지금까지 찍은 장면을 조금만 보여 주겠다고 해요.","lines":[{"id":"a1","tk":[{"t":"くだらない","p":"い형용사","m":"시시한, 하찮은","w":"下らない라는 한자가 있지만 보통 히라가나로 써요.","n":"くだらない話 = 시시한 이야기. 친구의 농담에 くだらない!(시시해!)라고 웃으며 받아치기도 해요."},{"t":"な"},{"t":"と"},{"t":"{笑|わら}ったんなら","p":"동사","m":"웃었다면","b":"{笑|わら}う","bm":"웃다","w":"어간 笑는 한자, ったんなら는 히라가나예요.","n":"笑った(웃었다) + んなら(~한 거라면). んなら는 のなら의 회화체예요."}],"ko":"시시하다며 웃어 줬다면","lit":"시시하다 / 네 / 라고 / 웃었다 / 라면","g":[{"k":"〜んなら (〜のなら)","d":"'~한 거라면'. 앞 내용을 받아 조건을 걸어요. 行くんなら一緒に行こう = 갈 거라면 같이 가자."},{"k":"〜なと (혼잣말 인용)","d":"くだらないな(시시하네)라는 혼잣말을 と로 인용했어요."}],"c":"듣는 사람이 '뭐야, 시시해'라고 웃는 것까지 예상하고 말을 걸어요. 그 웃음마저 계산에 넣은 장난스러운 시작이에요."},{"id":"a2","tk":[{"t":"{掴|つか}み","p":"명사","m":"(관객을) 사로잡는 첫 부분","w":"掴む(つかむ, 붙잡다)의 명사형이라 오쿠리가나 み가 붙어요. 掴는 조요칸지에 없는 글자예요.","n":"掴み는 공연이나 코미디에서 처음에 관객의 마음을 붙잡는 부분이에요. 掴みはOK(처음 반응은 성공)라는 말을 일본 예능에서 자주 써요."},{"t":"は"},{"t":"それで","p":"접속사","m":"그걸로","w":"それ(그것) + で(~로)라 히라가나로 써요."},{"t":"{万|ばん}{事|じ}","p":"명사","m":"만사, 모든 일","n":"한국어 '만사(萬事)'와 같은 한자어예요. 여기서는 万을 ばん으로 읽어요. 브리지의 115万(まん)과 같은 한자예요."},{"t":"OK","p":"감동사(영어)","m":"좋아, 오케이","w":"영어 OK를 알파벳 그대로 썼어요.","n":"일본어로는 オーケー라고 읽어요. 일상 글에서도 알파벳 OK를 그대로 많이 써요."},{"t":"！"}],"ko":"그걸로 오프닝은 대성공!","kr":"츠카미와 소레데 반지 오-케-!","lit":"사로잡기 / 는 / 그걸로 / 만사 / OK","g":[{"k":"{万|ばん}{事|じ}OK","d":"'만사 OK, 다 잘됐다'. 万事(모든 일) + OK를 합친 장난스러운 말투예요."}],"s":"万을 ばん으로 읽는 万事와 브리지의 115万(まん)이 같은 한자예요. 掴는 조요칸지 밖의 글자인데 한자로 썼고, OK는 알파벳 그대로예요.","c":"掴み(관객을 사로잡는 첫 부분)라는 공연 용어를 써서, 웃게 만들었으면 오프닝은 성공이라고 말해요."},{"id":"a3","tk":[{"t":"{呆|あき}れて","p":"동사","m":"어이없어하며","b":"{呆|あき}れる","bm":"어이없어하다, 기가 막히다","w":"어간 呆는 한자, れて는 히라가나예요.","n":"呆れる = (너무 심해서) 어이없다. 呆れた!(어이없어!)."},{"t":"いないで","p":"보조동사","m":"~하고 있지 말고","b":"いる","bm":"있다","w":"보조동사 いる는 히라가나로 써요.","n":"〜ていないで = ~하고 있지 말고. 寝ていないで起きて = 자고 있지 말고 일어나."},{"t":"ちょっと","p":"부사","m":"잠깐, 조금","w":"부사라 히라가나로 써요.","n":"ちょっと待って = 잠깐만. 회화에서 가장 많이 쓰는 말 중 하나예요."},{"t":"{待|ま}って","p":"동사","m":"기다려 줘","b":"{待|ま}つ","bm":"기다리다","w":"어간 待는 한자, って는 히라가나예요.","n":"て형만으로 '~해 줘'라는 부탁이 돼요. 待って = 기다려 줘."}],"ko":"어이없어하지 말고 잠깐만 기다려 봐","lit":"어이없어하고 / 있지 말고 / 잠깐 / 기다려","g":[{"k":"〜ないで","d":"'~하지 말고, ~하지 마'. いる → いないで. 泣かないで = 울지 마."},{"k":"て형으로 부탁하기","d":"동사 て형만 말해도 '~해 줘'가 돼요. 待って(기다려 줘), 見て(봐 줘)."}],"c":"질려서 자리를 뜨려는 관객을 붙잡는 말투예요. 영화가 지루해지기 전에 관객을 붙드는 감독 같아요."},{"id":"a4","tk":[{"t":"きっと"},{"t":"{気|き}に{入|い}って","p":"표현","m":"마음에 들어","b":"{気|き}に{入|い}る","bm":"마음에 들다","w":"気(마음)·入(들다)는 한자, に·って는 히라가나예요.","n":"気(기분, 마음)에 入る(들어가다)라는 그림이 한국어 '마음에 들다'와 똑같아요."},{"t":"もらえる","p":"보조동사","m":"~해 받을 수 있다","b":"もらう","bm":"받다","w":"'받다'의 もらう가 '~해 받다'로 쓰일 때는 히라가나로 써요.","n":"〜てもらえる = (상대가) ~해 줄 수 있다. 気に入ってもらえる = (네가) 마음에 들어 해 줄 것이다."},{"t":"と"},{"t":"{思|おも}う","p":"동사","m":"생각하다","w":"어간 思는 한자, う는 히라가나예요."},{"t":"な"}],"ko":"분명 마음에 들어 할 거라고 생각해","lit":"분명 / 마음에 들어 / 받을 수 있다 / 라고 / 생각하다 / 네","g":[{"k":"〜てもらえる","d":"'(남이) ~해 줄 수 있다'. もらう(받다)의 가능형 もらえる. 手伝ってもらえる? = 도와줄 수 있어?"},{"k":"〜と{思|おも}う","d":"'~라고 생각하다'. 앞말이 생각의 내용이에요."}],"c":"끝의 な가 혼잣말처럼 기대를 담아요. 자신 있게 권하면서도 조금 쑥스러워하는 말투예요."},{"id":"a5","tk":[{"t":"ここ"},{"t":"までの"},{"t":"ダイジェスト","p":"명사(외래어)","m":"다이제스트, 요약판","w":"영어 digest를 가타카나로 옮긴 외래어예요.","n":"긴 영상이나 이야기를 줄인 요약판이에요. 스포츠 하이라이트 방송도 ダイジェスト라고 해요."},{"t":"を"},{"t":"　"},{"t":"{少|すこ}し","p":"부사","m":"조금"},{"t":"だけ"},{"t":"{見|み}せる"},{"t":"よ"}],"ko":"지금까지의 하이라이트를 조금만 보여 줄게","lit":"여기 / 까지의 / 다이제스트 / 를 / 조금 / 만 / 보여 주다 / 야","g":[{"k":"ここまでの + 명사","d":"'여기까지의 ~, 지금까지의 ~'. ここまでの話 = 지금까지의 이야기."}],"c":"지금까지 둘이 함께한 시간을 영화 요약 영상처럼 보여 주겠다는 말이에요. 다음 섹션이 바로 그 '다이제스트'예요."}]},{"label":"1절 · Bメロ","note":"다이제스트의 첫 장면은 처음 싸운 밤이에요. 아픈 장면도 건너뛰지 않고, 화해해서 손을 잡는 장면까지 이어 봐요.","lines":[{"id":"b1","tk":[{"t":"{初|はじ}めて","p":"부사","m":"처음으로","w":"어간 初는 한자, めて는 히라가나예요.","n":"初めまして(처음 뵙겠습니다)의 初め와 같은 말이에요."},{"t":"{喧|けん}{嘩|か}した","p":"동사","m":"싸웠던","b":"{喧|けん}{嘩|か}する","bm":"싸우다, 다투다","w":"喧·嘩 둘 다 조요칸지에 없는 어려운 한자예요. けんか로 히라가나로 쓰는 일도 많은데 한자로 썼어요.","n":"喧嘩는 말다툼부터 몸싸움까지 '싸움'을 두루 말해요. 夫婦喧嘩(ふうふげんか) = 부부 싸움."},{"t":"{夜|よる}","p":"명사","m":"밤"},{"t":"の"},{"t":"{涙|なみだ}","p":"명사","m":"눈물"}],"ko":"처음 싸웠던 밤의 눈물","lit":"처음으로 / 싸웠다 / 밤 / 의 / 눈물","g":[{"k":"과거형 + 명사","d":"동사 과거형이 그대로 명사를 꾸며요. 喧嘩した夜 = 싸운 밤."}],"c":"다이제스트는 예쁜 장면이 아니라 첫 싸움부터 시작해요. 좋은 기억만 고르지 않는 솔직한 영화예요."},{"id":"b2","tk":[{"t":"{個|こ}{人|じん}{的|てき}に","p":"부사","m":"개인적으로","b":"{個|こ}{人|じん}{的|てき}","bm":"개인적","w":"한자어 個人的에 부사를 만드는 に를 붙였어요.","n":"한국어 '개인적(個人的)'과 같은 한자어예요. らしさ에서 본 〜的(てき)가 여기도 나와요."},{"t":"{胸|むね}","p":"명사","m":"가슴"},{"t":"が"},{"t":"{痛|いた}む","p":"동사","m":"아프다","w":"어간 痛는 한자, む는 히라가나예요.","n":"痛い(아프다)는 형용사, 痛む(아파 오다)는 동사예요."},{"t":"けれど","p":"조사","m":"~지만","n":"けど보다 조금 단정한 말이에요."}],"ko":"개인적으로는 가슴이 아프지만","lit":"개인적으로 / 가슴 / 이 / 아프다 / 지만","g":[{"k":"{胸|むね}が{痛|いた}む","d":"'가슴이 아프다'. 몸의 통증보다 마음이 아플 때 많이 써요."}],"c":"감독 입장에서 '개인적으로는' 아픈 장면이라고 말하는 게 재미있어요. 영화 제작진 말투를 끝까지 지켜요."},{"id":"b3","tk":[{"t":"そのまま","p":"부사","m":"그대로","w":"その(그) + まま(채)가 합쳐진 말이라 히라가나로 써요.","n":"そのまま = 그대로, 그 상태로. らしさ에 나온 まま(~한 채)와 같은 말이에요."},{"t":"{見|み}{続|つづ}けよう","p":"동사","m":"계속 보자","b":"{見|み}{続|つづ}ける","bm":"계속 보다","w":"見·続 두 한자에 오쿠리가나가 붙은 복합동사예요.","n":"ます형 + 続ける = 계속 ~하다. Laughter의 歌い続けた와 같은 틀이에요."}],"ko":"그대로 계속 보자","lit":"그대로 / 계속 보자","g":[{"k":"의지형 〜よう","d":"'~하자, ~해야지'. 1단 동사는 る를 よう로 바꿔요. 見続ける → 見続けよう."}],"c":"아픈 장면도 멈추거나 건너뛰지 않겠다는 말이에요. 그 뒤에 오는 화해 장면이 더 소중하기 때문이에요."},{"id":"b4","tk":[{"t":"ごめん","p":"감동사","m":"미안","w":"御免이라는 한자가 있지만 사과할 때는 보통 히라가나로 써요.","n":"ごめんなさい는 조금 더 정중한 '미안해요'예요."},{"t":"ね"},{"t":"と"},{"t":"{言|い}って","p":"동사","m":"말하고","b":"{言|い}う","bm":"말하다","w":"어간 言는 한자, って는 히라가나예요."},{"t":"　"},{"t":"{仲|なか}{直|なお}りして","p":"동사","m":"화해하고","b":"{仲|なか}{直|なお}りする","bm":"화해하다","w":"仲(사이)·直(고치다) 두 한자에 오쿠리가나 り가 붙은 명사에 して를 붙였어요.","n":"仲(사이) + 直り(고쳐짐) = 사이가 다시 좋아짐. 한국어 '화해'에 해당해요."},{"t":"{手|て}","p":"명사","m":"손"},{"t":"を"},{"t":"{握|にぎ}って","p":"동사","m":"잡고","b":"{握|にぎ}る","bm":"쥐다, 잡다","w":"어간 握는 한자, って는 히라가나예요.","n":"握る = 꽉 쥐다. 手を握る = 손을 잡다. 손으로 쥐어 만드는 握り寿司(にぎりずし)의 握예요."},{"t":"…"}],"ko":"미안하다고 말하고, 화해하고, 손을 잡고…","lit":"미안 / 해 / 라고 / 말하고 / 화해하고 / 손 / 을 / 잡고","g":[{"k":"て형 나열","d":"言って、仲直りして、握って처럼 て형을 이어 '~하고 ~하고' 장면을 차례로 늘어놓아요."}],"s":"끝의 …(말줄임표)로 장면이 끝나지 않고 이어지는 느낌을 줘요.","c":"다이제스트가 싸움에서 화해까지 한 흐름으로 이어져요. 말줄임표 뒤로 곧장 후렴의 '웃는 장면'이 나와요."}]},{"label":"サビ · 후렴","note":"이 영화의 가장 큰 볼거리는 네가 웃는 장면이에요. 사진에도 다 담기지 않는 작은 몸짓이 어두운 이야기도 뒤집는다고 노래해요.","lines":[{"id":"c1","tk":[{"t":"ほら","p":"감동사","m":"봐, 자","w":"감탄사라 히라가나로 써요."},{"t":"、"},{"t":"ここ"},{"t":"で"},{"t":"{君|きみ}"},{"t":"が"},{"t":"{笑|わら}う"},{"t":"シーン","p":"명사(외래어)","m":"장면, 신","w":"영어 scene을 가타카나로 옮긴 외래어예요.","n":"일본어로는 場面(ばめん)이라고도 해요. 아웃트로의 名場面(명장면)과 같은 뜻이에요."},{"t":"が"},{"t":"　"},{"t":"{見|み}どころ","p":"명사","m":"볼거리, 하이라이트","w":"見所로도 쓰는데 ところ를 히라가나로 풀었어요. 후렴 끝의 今の所에서는 같은 ところ를 한자 所로 썼어요.","n":"見(보다) + 所(곳) = 볼 만한 곳. 영화나 여행지 소개에서 자주 써요."},{"t":"なんだ","p":"조동사","m":"~인 거야","n":"な + んだ. 명사 뒤에서 '~인 거야'라고 힘주어 말해요."},{"t":"から"},{"t":"さ"},{"t":"　"},{"t":"Ah"}],"ko":"봐, 여기서 네가 웃는 장면이 이 영화의 하이라이트니까, Ah","kr":"호라, 코코데 키미가 와라우 시-응가 미도코로난다카라사 아-","lit":"봐 / 여기 / 에서 / 너 / 가 / 웃다 / 장면 / 이 / 볼거리 / 인 거다 / 니까 / 야 / 아","g":[{"k":"명사 + なんだから","d":"'~이니까 (말이야)'. 이유를 힘주어 내세워요. 子供なんだから = 아이니까."},{"k":"ほら","d":"상대의 눈길을 끄는 '봐'. Laughter의 ほら와 같아요."}],"c":"영화를 같이 보는 사람에게 '지금이야, 잘 봐' 하고 화면을 가리키는 모습이 떠올라요. 이 영화에서 가장 중요한 장면은 거창한 사건이 아니라 네 웃음이에요."},{"id":"c2","tk":[{"t":"{写|しゃ}{真|しん}","p":"명사","m":"사진","n":"한국어 '사진(寫眞)'과 같은 한자어예요. 写는 寫의 일본식 약자예요."},{"t":"に"},{"t":"も","m":"~에도"},{"t":"{映|うつ}せ","p":"동사","m":"담을 수 (있다)","b":"{映|うつ}す","bm":"비추다, (사진·화면에) 담다","w":"어간 映는 한자, せ는 히라가나예요.","n":"映す(비추다)의 가능형 映せる에서 る가 빠진 꼴이에요. 뒤의 やしない와 합쳐 '도저히 담을 수 없다'가 돼요."},{"t":"や","p":"조사","m":"(강조) ~지도"},{"t":"しない","p":"동사","m":"하지 않는다","b":"する","bm":"하다"},{"t":"　"},{"t":"とても","p":"부사","m":"아주, 몹시"},{"t":"{些|さ}{細|さい}な","p":"な형용사","m":"사소한","b":"{些|さ}{細|さい}","bm":"사소함","w":"些는 조요칸지에 없는 글자예요. 細(가늘 세)와 합쳐 '아주 작은'이라는 뜻이에요.","n":"些(적을 사)는 한국어 '사소(些少)하다'의 些와 같은 글자예요."},{"t":"その"},{"t":"{仕|し}{草|ぐさ}","p":"명사","m":"몸짓, 행동","w":"仕草는 한자 뜻보다 소리에 맞춰 붙인 표기로 알려져 있어요. 仕種로도 쓰고, 히라가나 しぐさ로도 많이 써요.","n":"仕草 = 무심코 하는 작은 몸짓이나 버릇. 髪を触る仕草 = 머리를 만지는 몸짓."},{"t":"に"}],"ko":"사진에도 담을 수 없는 아주 사소한 그 몸짓에","lit":"사진 / 에 / 도 / 담을 수 / 지도 / 하지 않는다 / 아주 / 사소한 / 그 / 몸짓 / 에","g":[{"k":"〜やしない","d":"'도저히 ~하지 않는다, ~할 리 없다'. ます형 + やしない로 강하게 부정해요. 分かりやしない = 알 리가 없다. 여기서는 가능형 映せ + やしない = 도저히 담을 수 없다."}],"c":"사진은 한순간을 멈춰 찍지만, 웃을 때의 작은 몸짓은 움직임이라 사진으로는 다 남지 않아요. 그래서 '영화(필름)'로 찍는다는 곡의 설정과 이어져요."},{"id":"c3","tk":[{"t":"どんな","p":"연체사","m":"어떤","w":"こ·そ·あ·ど 지시어라 히라가나로 써요."},{"t":"{暗|くら}い","p":"い형용사","m":"어두운","w":"어간 暗는 한자, い는 오쿠리가나예요."},{"t":"ストーリー","p":"명사(외래어)","m":"이야기, 스토리","w":"영어 story를 가타카나로 옮긴 외래어예요.","n":"Pretender에도 나온 외래어예요."},{"t":"も","m":"~라도"},{"t":"　"},{"t":"{覆|くつがえ}す","p":"동사","m":"뒤엎다","w":"어간 覆는 한자, す는 히라가나예요.","n":"Laughter의 予想を覆した(예상을 뒤엎었다)와 같은 동사예요."},{"t":"{瞬|しゅん}{間|かん}","p":"명사","m":"순간","n":"한국어 '순간(瞬間)'과 같은 한자어예요. 瞬(눈 깜짝할 순)."},{"t":"が"},{"t":"{溢|あふ}れてる","p":"동사","m":"넘쳐나고 있어","b":"{溢|あふ}れる","bm":"넘치다","w":"어간 溢는 한자, れてる는 히라가나예요. 溢는 조요칸지에 없는 글자라 あふれる로 쓰는 일도 많아요.","n":"溢れている의 い가 빠진 회화체예요. 涙が溢れる = 눈물이 넘쳐흐르다."}],"ko":"어떤 어두운 이야기도 뒤집어 버리는 순간이 넘쳐나","lit":"어떤 / 어두운 / 스토리 / 도 / 뒤엎다 / 순간 / 이 / 넘쳐나고 있다","g":[{"k":"どんな + 명사 + も","d":"'어떤 ~라도'. どんな時も = 어떤 때라도. 뒤에 오는 말이 예외 없이 적용된다는 뜻이에요."}],"c":"영화로 치면 어두운 전개도 네 웃음 한 번이면 행복한 이야기로 바뀐다는 말이에요."},{"id":"c4","tk":[{"t":"どれ","p":"대명사","m":"어느 것","w":"こ·そ·あ·ど 지시어라 히라가나로 써요."},{"t":"か"},{"t":"ひとつ"},{"t":"を"},{"t":"{切|き}り{取|と}って","p":"동사","m":"잘라 내서","b":"{切|き}り{取|と}る","bm":"잘라 내다","w":"切·取 두 한자에 오쿠리가나가 붙은 복합동사예요.","n":"切る(자르다) + 取る(취하다) = 잘라 내다. 写真で風景を切り取る(사진으로 풍경을 담아내다)처럼 '한 장면을 골라 담다'는 뜻으로도 써요."},{"t":"　"},{"t":"サムネイル","p":"명사(외래어)","m":"썸네일","w":"영어 thumbnail을 가타카나로 옮긴 외래어예요.","n":"영상이나 사진을 작게 보여 주는 대표 이미지예요. 회화에서는 줄여서 サムネ라고 해요."},{"t":"に"},{"t":"しよう","p":"동사","m":"하자","b":"する","bm":"하다","w":"する의 의지형이에요."}],"ko":"그중 하나를 잘라 내서 썸네일로 하자","lit":"어느 것 / 인가 / 하나 / 를 / 잘라 내서 / 썸네일 / 로 / 하자","g":[{"k":"명사 + にする","d":"'~로 하다, ~로 정하다'. サムネイルにしよう = 썸네일로 하자. コーヒーにする = 커피로 할게."},{"k":"どれか","d":"'어느 것인가, 어느 하나'. 의문사 + か = 정해지지 않은 무엇. 誰か(누군가), どこか(어딘가)."}],"c":"수많은 웃는 장면 중 하나를 이 영화의 대표 이미지로 쓰겠다는 말이에요. 영상 사이트에서 익숙한 サムネイル이라는 말에 요즘 감각이 묻어나요."},{"id":"c5","tk":[{"t":"とりあえず","p":"부사","m":"일단, 우선","w":"取り敢えず라는 한자가 있지만 보통 히라가나로 써요.","n":"일본 술집에서 とりあえずビール(일단 맥주)라는 말이 유명해요."},{"t":"{今|いま}の{所|ところ}","p":"표현","m":"지금으로서는","w":"今(지금)·所(곳)는 한자, の는 히라가나예요. 같은 후렴의 見どころ에서는 ところ를 히라가나로 썼어요.","n":"今のところ = 지금으로서는, 현재까지는. 앞으로 바뀔 수 있다는 느낌을 담아요."},{"t":"は"}],"ko":"일단 지금으로서는 말이야","lit":"일단 / 지금으로서는 / 은","g":[{"k":"{今|いま}の{所|ところ}は","d":"'지금으로서는'. 앞으로 더 좋은 장면이 나오면 바뀔 수도 있다는 여지를 남겨요."}],"c":"썸네일은 '일단 지금은' 이걸로 하자는 말이에요. 앞으로 더 멋진 장면이 계속 생길 거라는 기대가 2절로 이어져요."}]},{"label":"2절 · Aメロ","note":"10년 뒤를 상상해요. 출연진이 늘어날지도 모르고, 박봉에 한심한 모습도 많이 보이겠지만요.","lines":[{"id":"d1","tk":[{"t":"きっと"},{"t":"{10|じゅう}{年|ねん}{後|ご}","p":"명사","m":"10년 뒤","v":false,"w":"숫자는 아라비아 숫자 10, 年·後는 한자예요. 가사에서도 숫자는 아라비아 숫자로 쓰는 일이 많아요.","n":"숫자 + 年後(ねんご) = ~년 뒤. 10은 じゅう로 읽어요. 3年後(さんねんご) = 3년 뒤."},{"t":"くらい"},{"t":"には"},{"t":"　"},{"t":"キャスト","p":"명사(외래어)","m":"출연진, 캐스트","w":"영어 cast를 가타카나로 옮긴 외래어예요.","n":"영화나 드라마의 출연진이에요. 여기서는 가족이 늘어나는 것을 영화 말로 돌려 말한 것으로 읽혀요."},{"t":"が"},{"t":"{増|ふ}えたり","p":"동사","m":"늘거나","b":"{増|ふ}える","bm":"늘다","w":"어간 増는 한자, えたり는 히라가나예요.","n":"増える(늘다, 자동사)와 増やす(늘리다, 타동사)는 짝이에요."},{"t":"も"},{"t":"するんだろう","p":"동사","m":"하겠지","b":"する","bm":"하다","w":"する는 기본 동사라 히라가나로 써요.","n":"する + んだろう(~하겠지). んだろう는 のだろう의 회화체로, '아마 ~하겠지'라고 짐작해요."}],"ko":"아마 10년쯤 뒤에는 출연진이 늘기도 하겠지","lit":"분명 / 10년 뒤 / 쯤 / 에는 / 캐스트 / 가 / 늘거나 / 도 / 하다 / 겠지","g":[{"k":"〜たりもする","d":"'~하기도 하다'. 동사 た형 + り + もする. 増えたりもする = 늘기도 한다. 여러 일 중 하나를 예로 들어요."},{"k":"〜んだろう","d":"'~하겠지'. 확신은 없지만 그럴 것 같다고 짐작해요. きっと와 함께 자주 써요."}],"c":"'출연진이 늘어난다'는 영화 말로 가족이 늘어나는 미래를 돌려 말해요. 결혼식에서 이 곡을 많이 트는 것도 이런 가사와 이어져 보여요."},{"id":"d2","tk":[{"t":"{今|いま}"},{"t":"でも","p":"조사","m":"~도, ~라도","n":"今でも = 지금도."},{"t":"{余|よ}{裕|ゆう}","p":"명사","m":"여유","n":"한국어 '여유(餘裕)'와 같은 한자어예요. 余는 餘의 일본식 약자예요."},{"t":"なんて"},{"t":"ない"},{"t":"のに","p":"조사","m":"~인데(도)","n":"기대와 다른 결과를 이어 줄 때 써요. 아쉬움이나 불만이 담겨요."}],"ko":"지금도 여유 같은 건 없는데","lit":"지금 / 도 / 여유 / 같은 것 / 없다 / 인데","g":[{"k":"〜なんてない","d":"'~ 같은 건 없다'. お金なんてない = 돈 같은 건 없어."},{"k":"〜のに","d":"'~인데(도)'. 今でも余裕なんてないのに = 지금도 여유가 없는데 (앞으로는 더할 텐데)."}],"c":"행복한 상상 다음에 바로 현실적인 걱정이 나와요. 진지한 사랑 노래에 생활감 있는 농담을 섞는 게 이 곡의 재미예요."},{"id":"d3","tk":[{"t":"こんな","p":"연체사","m":"이런","w":"こんな(이런)·そんな(그런)·あんな(저런)는 지시어라 히라가나로 써요."},{"t":"{安|やす}{月|げっ}{給|きゅう}","p":"명사","m":"박봉, 적은 월급","w":"安(싸다)과 月給(월급)을 합친 한자어예요.","n":"月給(げっきゅう)는 한국어 '월급(月給)'과 같은 한자어예요. 앞에 安(やす, 싼)을 붙여 '쥐꼬리만 한 월급'이 돼요."},{"t":"じゃ","p":"조사(복합)","m":"~로는","n":"では의 회화체예요. 安月給じゃ = 박봉으로는."},{"t":"もう","p":"부사","m":"벌써, 이미"},{"t":"キャパオーバー","p":"명사(외래어)","m":"한도 초과, 감당 불가","w":"キャパシティ(capacity)를 줄인 キャパ에 オーバー(over)를 붙인 일본식 영어예요. 가타카나로만 써요.","n":"영어로는 이렇게 쓰지 않는 일본식 영어예요. 仕事が多すぎてキャパオーバー = 일이 너무 많아 감당이 안 돼."},{"t":"！"}],"ko":"이런 박봉으로는 벌써 감당 불가야!","lit":"이런 / 박봉 / 으로는 / 이미 / 한도 초과","g":[{"k":"〜じゃ (〜では)","d":"'~로는, ~이면'. 뒤에 부정적인 말이 와요. この給料じゃ無理 = 이 월급으로는 무리야."}],"s":"キャパオーバー는 긴 외래어 キャパシティ를 キャパ로 줄여 붙인 말이에요. 일본어는 외래어를 이렇게 앞부분만 잘라 쓰는 일이 많아요(サムネイル → サムネ).","c":"가족이 늘면 생활비가 감당이 안 된다는 엄살 섞인 농담이에요. 노래하는 사람의 현실적인 모습이 오히려 진심처럼 들려요."},{"id":"d4","tk":[{"t":"きっと"},{"t":"{情|なさ}けない","p":"い형용사","m":"한심한, 볼품없는","w":"情(뜻 정)를 なさけ로 읽는 말에 ない가 붙었어요.","n":"情け(なさけ, 인정)가 없다는 모양이지만, 뜻은 '한심하다, 볼품없다'예요. 情けない顔 = 한심한 얼굴."},{"t":"ところ","p":"명사","m":"부분, 모습","w":"'곳, 부분'을 뜻하는 ところ는 히라가나로 쓰는 일이 많아요."},{"t":"も"},{"t":"　"},{"t":"{山|やま}","p":"명사","m":"산","n":"山ほど = 산만큼, 산더미처럼 많이."},{"t":"ほど","p":"조사","m":"~만큼"},{"t":"{見|み}せる"},{"t":"だろう","p":"조동사","m":"~하겠지"}],"ko":"분명 한심한 모습도 산더미처럼 보여 주겠지","lit":"분명 / 한심한 / 부분 / 도 / 산 / 만큼 / 보여 주다 / 겠지","g":[{"k":"{山|やま}ほど","d":"'산더미만큼, 엄청 많이'. 宿題が山ほどある = 숙제가 산더미야."},{"k":"〜だろう","d":"'~하겠지'. 앞 줄의 んだろう와 같은 짐작이에요."}],"c":"1절의 '조금만 보여 줄게(少しだけ見せるよ)'와 짝을 이뤄요. 좋은 장면은 조금, 한심한 모습은 산더미만큼 보여 줄 거라는 솔직한 고백이에요."}]},{"label":"2절 · Bメロ","note":"성이 하나가 된 날도, 아무 일 없는 평범한 날도 모두 소중하게 마음에 새기겠다고 해요.","lines":[{"id":"e1","tk":[{"t":"{苗|みょう}{字|じ}","p":"명사","m":"성(씨)","n":"苗字는 '성'이에요. 이름은 名前(なまえ), 성과 이름을 함께 쓴 이름은 氏名(しめい)라고 해요. 名字로도 써요."},{"t":"が"},{"t":"ひとつ"},{"t":"に"},{"t":"なった","p":"동사","m":"된","b":"なる","bm":"되다","w":"なる는 기본 동사라 히라가나로 써요."},{"t":"{日|ひ}"},{"t":"も"}],"ko":"성이 하나가 된 날도","lit":"성 / 이 / 하나 / 로 / 된 / 날 / 도","g":[{"k":"명사 + になる","d":"'~가 되다'. ひとつになる = 하나가 되다."}],"c":"일본에서는 결혼한 부부가 같은 성을 써야 해요. 그래서 '성이 하나가 된 날'은 결혼한 날을 뜻해요. 배경·문화 노트에서 더 자세히 다뤄요."},{"id":"e2","tk":[{"t":"{何|なに}","p":"대명사","m":"무엇"},{"t":"ひとつ"},{"t":"{代|か}わり{映|ば}え","p":"명사","m":"바꿔서 나아진 점","w":"代わり(바뀜)와 映え(빛남)를 합친 말이에요. 代·映에 각각 오쿠리가나가 붙어요.","n":"代わり映えしない / 代わり映えのない = (바꿔도) 별로 나아진 게 없는, 늘 그대로인. 거의 부정형으로만 써요."},{"t":"の","m":"~이 (꾸미는 말 속의 주어)"},{"t":"ない"},{"t":"{日|ひ}"},{"t":"も"}],"ko":"무엇 하나 달라질 것 없는 평범한 날도","lit":"무엇 / 하나 / 나아진 점 / 이 / 없는 / 날 / 도","g":[{"k":"{何|なに}ひとつ + 부정","d":"'무엇 하나 ~않다'. 何ひとつ分からない = 무엇 하나 모르겠다."},{"k":"{代|か}わり{映|ば}えのない","d":"'늘 똑같은, 새로울 것 없는'. 代わり映えのない毎日 = 매일 똑같은 나날."}],"c":"결혼한 날 같은 특별한 날과 아무 일도 없는 평범한 날을 나란히 놓아요. 둘 다 똑같이 찍어 두겠다는 게 이 곡의 마음이에요."},{"id":"e3","tk":[{"t":"{愛|いと}しい","p":"い형용사","m":"사랑스러운","w":"愛(사랑 애)를 いとしい로 읽는 말이에요. 한자어 愛(あい)와 같은 글자예요.","n":"愛しい = 사랑스럽다. 愛おしい(いとおしい)라고도 해요."},{"t":"{日々|ひび}"},{"t":"　"},{"t":"{尊|とうと}い","p":"い형용사","m":"귀한, 소중한","w":"어간 尊는 한자, い는 히라가나예요.","n":"尊い는 とうとい와 たっとい 두 가지로 읽어요. 한국어 '존귀(尊貴)'의 尊예요."},{"t":"{日々|ひび}"}],"ko":"사랑스러운 나날, 소중한 나날","lit":"사랑스러운 / 나날 / 귀한 / 나날","s":"愛しい·尊い처럼 마음을 담는 형용사 뒤에 日々를 두 번 되풀이해 리듬을 만들어요. 日々의 々는 앞 글자를 되풀이하는 기호예요.","c":"앞 두 줄의 특별한 날과 평범한 날을 이 한 줄로 묶어요. 어느 쪽이든 사랑스럽고 소중한 날이라는 말이에요."},{"id":"e4","tk":[{"t":"{逃|のが}さない","p":"동사","m":"놓치지 않는","b":"{逃|のが}す","bm":"놓치다","w":"어간 逃는 한자, さない는 히라가나예요.","n":"逃す(のがす, 놓치다)는 逃げる(にげる, 도망치다)와 같은 한자예요. チャンスを逃す = 기회를 놓치다."},{"t":"ように"},{"t":"　"},{"t":"{忘|わす}れない","p":"동사","m":"잊지 않는","b":"{忘|わす}れる","bm":"잊다","w":"어간 忘는 한자, れない는 히라가나예요."},{"t":"ように"}],"ko":"놓치지 않도록, 잊지 않도록","lit":"놓치지 않다 / 도록 / 잊지 않다 / 도록","g":[{"k":"〜ないように","d":"'~하지 않도록'. 목적을 나타내요. 遅れないように早く出る = 늦지 않도록 일찍 나간다."}],"c":"같은 〜ないように를 두 번 겹쳐서, 하루도 흘려보내지 않겠다는 마음을 강조해요."},{"id":"e5","tk":[{"t":"{焼|や}き{付|つ}けて","p":"동사","m":"새겨","b":"{焼|や}き{付|つ}ける","bm":"(마음·필름에) 새기다, 인화하다","w":"焼·付 두 한자에 오쿠리가나가 붙은 복합동사예요.","n":"焼き付ける는 원래 불로 '구워 붙이다', 사진 필름의 상을 종이에 '인화하다'는 뜻이에요. 目に焼き付ける = 눈에 새기다. 필름이 나오는 이 곡에 잘 맞는 동사예요."},{"t":"いく","p":"보조동사","m":"~해 가다","b":"{行|い}く","bm":"가다","w":"'가다'의 行く가 '~해 가다'로 쓰일 때는 보통 히라가나로 써요."},{"t":"よ"}],"ko":"마음에 새겨 갈게","lit":"새겨 / 가다 / 야","g":[{"k":"〜ていく","d":"'~해 가다'. 지금부터 앞으로 계속 이어 간다는 뜻이에요. 焼き付けていく = 새겨 가다."}],"c":"사진을 인화하듯 하루하루를 마음에 새기겠다는 말이에요. 필름과 인화라는 사진 말로 기억하는 일을 그려요."}]},{"label":"サビ 2 · 두 번째 후렴","note":"이번 후렴은 다짐이에요. 엇갈림이 우리를 갈라놓으려 할 때마다 이 노래를 부르겠다고, 엔딩 크레디트는 만들고 싶지도 않다고 해요.","lines":[{"id":"f1","tk":[{"t":"{今|いま}"},{"t":"、"},{"t":"{目|め}","p":"명사","m":"눈"},{"t":"を"},{"t":"{細|ほそ}めて","p":"동사","m":"가늘게 뜨고","b":"{細|ほそ}める","bm":"가늘게 하다","w":"어간 細는 한자, めて는 히라가나예요.","n":"目を細める = 눈을 가늘게 뜨다. 기뻐서 웃거나 눈부셔할 때의 표정이에요."},{"t":"{恥|は}じらいあって","p":"동사","m":"서로 수줍어하며","b":"{恥|は}じらいあう","bm":"서로 수줍어하다","w":"恥じらう(수줍어하다)에 '서로'를 뜻하는 あう를 붙였어요. あう는 合う로도 쓰지만 히라가나로 풀었어요.","n":"恥(부끄러울 치)는 恥ずかしい(はずかしい, 부끄럽다)의 恥예요."},{"t":"　"},{"t":"{永遠|とわ|*}","p":"명사","m":"영원","w":"보통 えいえん으로 읽는 永遠에 とわ라는 특별한 읽기를 달았어요.","n":"とわ는 '영원'을 뜻하는 예스럽고 시적인 말이에요. Pretender의 永遠(えいえん)과 같은 한자예요."},{"t":"を"},{"t":"{願|ねが}った","p":"동사","m":"바랐던","b":"{願|ねが}う","bm":"바라다","w":"어간 願는 한자, った는 히라가나예요."},{"t":"{僕|ぼく}たち","p":"대명사","m":"우리","w":"僕(나)는 한자, 복수를 만드는 たち는 히라가나예요.","n":"僕ら(ぼくら)와 같은 뜻이에요. 브리지에는 僕ら가 나와요."},{"t":"を"}],"ko":"지금 눈을 가늘게 뜨고 서로 수줍어하며 영원을 바란 우리를","lit":"지금 / 눈 / 을 / 가늘게 뜨고 / 서로 수줍어하며 / 영원 / 을 / 바랐다 / 우리 / 를","g":[{"k":"〜あう (〜{合|あ}う)","d":"'서로 ~하다'. 동사 ます형 + あう. 恥じらいあう = 서로 수줍어하다, 助け合う = 서로 돕다."}],"s":"永遠에 えいえん 대신 とわ라는 특별한 읽기를 달았어요. 점선 밑줄로 표시돼요. 가사에서는 한자에 이렇게 시적인 읽기를 붙이는 일이 많아요.","c":"결혼식 같은 장면을 떠올리게 하는 줄이에요. '영원을 바란 우리'를 지금 이 순간의 장면으로 찍어 두어요."},{"id":"f2","tk":[{"t":"すれ{違|ちが}い","p":"명사","m":"엇갈림","w":"すれ(스치다)는 히라가나, 違い(다름)는 한자예요. 擦れ違い로도 쓰지만 보통 앞부분은 히라가나로 써요.","n":"すれ違う = 스쳐 지나가다, (마음이) 엇갈리다. 명사 すれ違い = 엇갈림."},{"t":"や","p":"조사","m":"~이나 (나열)"},{"t":"{憂|ゆう}{鬱|うつ}な","p":"な형용사","m":"우울한","b":"{憂|ゆう}{鬱|うつ}","bm":"우울함","w":"憂鬱는 한자어라 한자로 써요. 鬱는 획이 아주 많기로 유명한 한자예요.","n":"한국어 '우울(憂鬱)'과 같은 한자어예요. 鬱는 2010년에 조요칸지에 새로 들어갔어요."},{"t":"{展|てん}{開|かい}","p":"명사","m":"전개","n":"한국어 '전개(展開)'와 같은 한자어예요. 영화나 이야기의 흐름을 말할 때 써요."},{"t":"が"},{"t":"　"},{"t":"{引|ひ}き{裂|さ}こう","p":"동사","m":"갈라놓으려","b":"{引|ひ}き{裂|さ}く","bm":"찢다, 갈라놓다","w":"引·裂 두 한자에 오쿠리가나가 붙은 복합동사예요.","n":"引き裂く의 의지형 引き裂こう + とする = 갈라놓으려 하다. らしさ에도 나온 동사예요."},{"t":"と"},{"t":"した","p":"동사","m":"했다","b":"する","bm":"하다"},{"t":"その"},{"t":"{時|とき}","p":"명사","m":"때"},{"t":"には"}],"ko":"엇갈림이나 우울한 전개가 우리를 갈라놓으려 할 그때에는","lit":"엇갈림 / 이나 / 우울한 / 전개 / 가 / 갈라놓자 / 라고 / 했다 / 그 / 때 / 에는","g":[{"k":"의지형 + とする","d":"'~하려고 하다'. 引き裂こうとした = 갈라놓으려고 했다. 寝ようとした時 = 자려고 했을 때."}],"c":"싸움이나 힘든 시기를 영화의 '우울한 전개'에 빗댔어요. 영화라면 위기가 오는 게 당연하다는 듯 담담하게 말해요."},{"id":"f3","tk":[{"t":"{僕|ぼく}"},{"t":"が"},{"t":"うるさい","p":"い형용사","m":"시끄러운","w":"煩い라는 한자가 있지만 보통 히라가나로 써요.","n":"らしさ의 うるさい와 같은 말이에요."},{"t":"くらい"},{"t":"の"},{"t":"{声|せい}{量|りょう}","p":"명사","m":"성량","n":"한국어 '성량(聲量)'과 같은 한자어예요. 声는 聲의 일본식 약자로, こえ로도 せい로도 읽어요."},{"t":"で"},{"t":"　"},{"t":"この"},{"t":"{歌|うた}"},{"t":"{何|なん}{度|ど}","p":"명사","m":"몇 번"},{"t":"も","m":"~이고, ~이나"},{"t":"{歌|うた}う"},{"t":"よ"}],"ko":"내가 시끄러울 만큼 큰 목소리로 이 노래를 몇 번이고 부를게","lit":"나 / 가 / 시끄럽다 / 정도 / 의 / 성량 / 으로 / 이 / 노래 / 몇 번 / 이고 / 부르다 / 야","g":[{"k":"〜くらいの + 명사","d":"'~할 정도의'. うるさいくらいの声量 = 시끄러울 정도의 성량."},{"k":"{何|なん}{度|ど}も","d":"'몇 번이고, 여러 번'. 何度も言った = 몇 번이나 말했어."}],"s":"この歌(を)何度も歌うよ에서 を가 빠졌어요. 노래 가사나 회화에서는 조사를 자주 생략해요.","c":"노래하는 사람이 정말로 이 노래를 부르는 사람이라는 게 겹쳐 보여요. 위기가 올 때마다 이 곡 자체가 둘을 지키는 주문이 돼요."},{"id":"f4","tk":[{"t":"だから"},{"t":"どうか","p":"부사","m":"부디","w":"부사라 히라가나로 써요."},{"t":"そば","p":"명사","m":"곁","w":"傍라는 한자가 있지만 보통 히라가나로 써요."},{"t":"に"},{"t":"いて","p":"동사","m":"있어 줘","b":"いる","bm":"있다","w":"いる(있다)는 히라가나로 써요."}],"ko":"그러니 부디 곁에 있어 줘","lit":"그러니까 / 부디 / 곁 / 에 / 있어 줘","g":[{"k":"どうか + 부탁","d":"'부디 ~해 줘'. 간절한 부탁에 붙여요. どうかお願いします = 부디 부탁드립니다."}],"c":"곡 전체에서 가장 짧고 직접적인 부탁이에요. 영화 비유를 잠시 내려놓고 마음을 그대로 말해요."},{"id":"f5","tk":[{"t":"エンドロール","p":"명사(외래어)","m":"엔딩 크레디트","w":"end와 roll을 합친 일본식 영어라 가타카나로 써요.","n":"영어로는 end credits라고 해요. 영화 끝에 출연진과 제작진 이름이 올라가는 부분이에요."},{"t":"なんて"},{"t":"もん","p":"형식명사","m":"것 (もの의 회화체)","w":"もの의 회화체라 히라가나로 써요."},{"t":"　"},{"t":"{作|つく}りたく","p":"동사","m":"만들고 싶게","b":"{作|つく}る","bm":"만들다","w":"어간 作는 한자, りたく는 히라가나예요.","n":"作りたい(만들고 싶다)의 く형 作りたく + も + ない = 만들고 싶지도 않다."},{"t":"も"},{"t":"ない","p":"조동사(부정)","m":"~않다"},{"t":"から"}],"ko":"엔딩 크레디트 같은 건 만들고 싶지도 않으니까","lit":"엔딩 크레디트 / 따위 / 것 / 만들고 싶게 / 도 / 않다 / 니까","g":[{"k":"〜たくもない","d":"'~하고 싶지도 않다'. たい의 く형에 も를 끼워 강하게 부정해요. 聞きたくもない = 듣고 싶지도 않아."},{"k":"〜なんてもん","d":"'~ 같은 것'. なんてもの의 회화체예요. 앞말을 '그런 건' 하고 밀어내는 느낌이에요."}],"c":"엔딩 크레디트는 영화가 끝났다는 표시예요. 그걸 만들고 싶지 않다는 건 이 영화, 곧 둘의 이야기가 끝나지 않기를 바란다는 뜻이에요."}]},{"label":"Cメロ · 브리지","note":"촬영이 언제 끝날지는 우리가 정할 수 없지만, 평생 분량의 필름 115만 킬로를 준비해 두었다고 해요. 제목의 뜻이 여기서 밝혀져요.","lines":[{"id":"g1","tk":[{"t":"クランクアップ","p":"명사(외래어)","m":"촬영 종료","w":"crank와 up을 합친 일본식 영어라 가타카나로 써요.","n":"옛날 영화 카메라는 손잡이(crank)를 돌려 찍었어요. 그래서 일본에서는 촬영 시작을 クランクイン, 촬영 종료를 クランクアップ라고 해요."},{"t":"が"},{"t":"いつ","p":"대명사","m":"언제","w":"'언제'를 뜻하는 의문사라 히라가나로 써요."},{"t":"なのか","p":"조사(복합)","m":"~인지","n":"な + の + か = ~인지. いつなのか = 언제인지."},{"t":"　"},{"t":"{僕|ぼく}ら","p":"대명사","m":"우리","w":"僕(나)는 한자, 복수를 만드는 ら는 히라가나예요."},{"t":"には"},{"t":"{決|き}められない","p":"동사","m":"정할 수 없다","b":"{決|き}める","bm":"정하다","w":"어간 決는 한자, められない는 히라가나예요.","n":"決める의 가능형 決められる의 부정이에요."}],"ko":"촬영이 언제 끝날지는 우리가 정할 수 없어","lit":"촬영 종료 / 가 / 언제 / 인지 / 우리 / 에게는 / 정할 수 없다","g":[{"k":"의문사 + なのか","d":"'~인지'. 문장 속에 질문을 넣어요. 誰なのか分からない = 누구인지 모르겠다."},{"k":"〜には + 가능형 부정","d":"'~로서는 ~할 수 없다'. 僕らには決められない = 우리로서는 정할 수 없다."}],"c":"촬영 종료, 곧 삶이 끝나는 때는 우리가 고를 수 없다는 말이에요. 무거운 이야기를 영화 용어로 가볍게 말해요."},{"id":"g2","tk":[{"t":"だから"},{"t":"{風|かぜ}","p":"명사","m":"바람"},{"t":"に"},{"t":"{吹|ふ}かれて","p":"동사","m":"바람을 맞으며","b":"{吹|ふ}く","bm":"(바람이) 불다","w":"어간 吹는 한자, かれて는 히라가나예요.","n":"吹く(불다)의 수동형 吹かれる = (바람을) 맞다. 風に吹かれる = 바람을 맞다, 바람에 몸을 맡기다."},{"t":"いこう","p":"보조동사","m":"~해 가자","b":"{行|い}く","bm":"가다","w":"'가다'의 行く가 '~해 가다'로 쓰일 때는 히라가나로 써요."}],"ko":"그러니 바람에 몸을 맡기고 가자","lit":"그러니까 / 바람 / 에 / 불려서 / 가자","g":[{"k":"{風|かぜ}に{吹|ふ}かれる","d":"'바람을 맞다, 바람에 날리다'. 수동형이지만 '바람 부는 대로 몸을 맡긴다'는 여유 있는 느낌으로도 써요."},{"k":"〜ていこう","d":"'~해 가자'. ていく의 의지형이에요."}],"c":"끝을 정할 수 없으니 걱정하지 말고 흘러가는 대로 함께 가자는 말이에요."},{"id":"g3","tk":[{"t":"フィルム"},{"t":"は"},{"t":"{用|よう}{意|い}した","p":"동사","m":"준비했다","b":"{用|よう}{意|い}する","bm":"준비하다","w":"한자어 用意에 する가 붙은 동사예요.","n":"用意(ようい) = 준비. 달리기 출발 구령 よーい、ドン(준비, 땅)의 よーい가 이 用意예요. らしさ의 노트에서 본 그 구령이에요."},{"t":"よ"}],"ko":"필름은 준비해 뒀어","lit":"필름 / 은 / 준비했다 / 야","c":"평생을 찍을 준비가 끝났다는 선언이에요. 다음 줄에서 그 필름의 길이가 나와요."},{"id":"g4","tk":[{"t":"{一|いっ}{生|しょう}{分|ぶん}","p":"명사","m":"평생 분량","w":"一生(평생)에 '~분, ~몫'을 뜻하는 分을 붙였어요.","n":"一生(いっしょう)는 한국어 '일생(一生)'과 같은 한자어예요. 〜分(ぶん) = ~분량. 三日分(みっかぶん) = 사흘 치."},{"t":"の"},{"t":"{長|なが}さ","p":"명사","m":"길이","b":"{長|なが}い","bm":"길다","w":"長는 한자, 명사를 만드는 さ는 히라가나예요.","n":"長い(길다) → 長さ(길이). Laughter의 強さ·正しさ와 같은 방법이에요."},{"t":"を"},{"t":"　"},{"t":"ざっと","p":"부사","m":"대략","w":"부사라 히라가나로 써요.","n":"ざっと = 대충, 대략. ざっと読む = 대충 훑어 읽다."},{"t":"{115万|ひゃくじゅうごまん}","p":"수사","m":"115만","b":"{万|まん}","bm":"만 (10,000)","w":"숫자 115는 아라비아 숫자, 단위 万는 한자예요.","n":"일본어도 한국어처럼 万(만) 단위로 세요. 115万 = 百十五万(ひゃくじゅうごまん)."},{"t":"キロ","p":"명사(외래어)","m":"킬로(미터)","w":"キロメートル(킬로미터)를 줄인 외래어예요.","n":"일본에서는 キロ만으로 킬로미터나 킬로그램을 말해요."}],"ko":"평생 분량의 길이로, 대략 115만 킬로","lit":"평생 분량 / 의 / 길이 / 를 / 대략 / 115만 / 킬로","g":[{"k":"〜{分|ぶん}","d":"'~분량, ~몫'. 一生分 = 평생 분량, 二人分 = 2인분."}],"s":"제목의 115万キロ가 여기서 나와요. 숫자는 아라비아 숫자로 쓰고, 万만 한자로 써서 일본어 숫자 표기의 기본 모양이 보여요.","c":"35mm 영화 필름으로 80년을 찍으면 약 115만 km가 된다는 계산이 널리 알려져 있어요. 평생을 너와 찍겠다는 말을 숫자로 바꾼 거예요. 배경·문화 노트에서 계산을 따라가 보세요."}]},{"label":"ラストサビ · 마지막 후렴","note":"첫 후렴을 다시 불러요. 이번에는 '일단 지금은'이라는 말 없이, 썸네일을 고르자는 말로 끝나요.","lines":[{"id":"h1","same":"c1"},{"id":"h2","same":"c2"},{"id":"h3","same":"c3"},{"id":"h4","same":"c4"}]},{"label":"アウトロ · 마무리","note":"앞으로 생길 명장면을 찾으러 가자고, 필름이 다할 때까지, 목숨이 있는 한 촬영을 계속하자고 맺어요.","lines":[{"id":"o1","tk":[{"t":"さあ","p":"감동사","m":"자","w":"감탄사라 히라가나로 써요."},{"t":"、"},{"t":"これから","p":"부사","m":"이제부터","w":"지시어 これ에 から가 붙은 말이라 히라가나로 써요."},{"t":"{生|う}まれる","p":"동사","m":"태어나다, 생겨나다","w":"어간 生는 한자, まれる는 히라가나예요.","n":"生는 生まれる(うまれる), 生きる(いきる), 生(せい)처럼 읽기가 아주 많은 한자예요."},{"t":"　"},{"t":"{名|めい}{場|ば}{面|めん}","p":"명사","m":"명장면","n":"名(이름난) + 場面(장면). 한국어 '명장면'과 같은 한자어예요."},{"t":"を"},{"t":"{探|さが}し","p":"동사","m":"찾으러","b":"{探|さが}す","bm":"찾다","w":"어간 探는 한자, し는 히라가나예요.","n":"ます형 + に行く = ~하러 가다. 探しに行く = 찾으러 가다."},{"t":"に","m":"~하러 (목적)"},{"t":"いこう","p":"동사","m":"가자","b":"{行|い}く","bm":"가다","w":"行く를 히라가나로 풀어 썼어요."},{"t":"よ"}],"ko":"자, 이제부터 생겨날 명장면을 찾으러 가자","lit":"자 / 이제부터 / 생겨나다 / 명장면 / 을 / 찾으러 / 하러 / 가자 / 야","g":[{"k":"ます형 + に{行|い}く","d":"'~하러 가다'. 探しにいく = 찾으러 가다, 食べに行く = 먹으러 가다."}],"c":"지금까지 지난 장면을 돌아봤다면, 여기서는 앞으로 찍을 장면을 향해 나가요. 첫 줄의 これから(이제부터)가 다시 나와 곡의 처음과 끝이 이어져요."},{"id":"o2","tk":[{"t":"{酸|す}い","p":"い형용사","m":"신 (것)","w":"酸(실 산)는 한자, い는 히라가나예요.","n":"酸い는 '시다'라는 형용사인데, 요즘은 酸っぱい(すっぱい)를 주로 써요. 酸いも甘いも라는 관용 표현으로 남아 있어요."},{"t":"も"},{"t":"{甘|あま}い","p":"い형용사","m":"단 (것)","w":"어간 甘는 한자, い는 히라가나예요."},{"t":"も"},{"t":"{寄|よ}り{添|そ}って","p":"동사","m":"곁에 붙어","b":"{寄|よ}り{添|そ}う","bm":"다가붙다, 곁을 지키다","w":"寄·添 두 한자에 오쿠리가나가 붙은 복합동사예요.","n":"寄る(다가가다) + 添う(곁에 붙다) = 바짝 다가붙다. 心に寄り添う = 마음을 헤아리고 곁을 지키다."},{"t":"　"},{"t":"{一|いっ}{緒|しょ}に","p":"부사","m":"함께","b":"{一|いっ}{緒|しょ}","bm":"함께함","w":"一緒(함께)는 한자어, 부사를 만드는 に는 히라가나예요.","n":"一緒に行こう = 같이 가자. 회화에서 아주 많이 써요."},{"t":"{味|あじ}わおう","p":"동사","m":"맛보자","b":"{味|あじ}わう","bm":"맛보다","w":"어간 味는 한자, わおう는 히라가나예요.","n":"味(あじ, 맛)에서 온 동사예요. 喜びを味わう = 기쁨을 맛보다처럼 무언가를 겪을 때도 써요."}],"ko":"신맛도 단맛도 서로 기대어 함께 맛보자","lit":"신 것 / 도 / 단 것 / 도 / 다가붙어서 / 함께 / 맛보자","g":[{"k":"{酸|す}いも{甘|あま}いも","d":"'신맛도 단맛도' → '인생의 좋은 일도 힘든 일도'. 酸いも甘いも噛み分ける(세상의 쓴맛 단맛을 다 안다)라는 관용 표현에서 왔어요."},{"k":"의지형 〜おう","d":"5단 동사는 끝소리를 お단 + う로 바꿔 '~하자'를 만들어요. 味わう → 味わおう."}],"c":"한국어 '단맛 쓴맛 다 보다'와 비슷한 표현이에요. 좋은 날만이 아니라 힘든 날도 함께 겪자는 말이에요."},{"id":"o3","tk":[{"t":"フィルム"},{"t":"が"},{"t":"なくなる","p":"동사","m":"다 떨어지다, 없어지다","w":"なくなる는 보통 히라가나로 써요."},{"t":"まで","p":"조사","m":"~까지"}],"ko":"필름이 다 떨어질 때까지","lit":"필름 / 이 / 없어지다 / 까지","g":[{"k":"동사 사전형 + まで","d":"'~할 때까지'. フィルムがなくなるまで = 필름이 다할 때까지."}],"c":"필름이 다한다는 건 브리지의 115만 킬로, 곧 평생을 다 쓴다는 뜻이에요."},{"id":"o4","tk":[{"t":"{撮|さつ}{影|えい}","p":"명사","m":"촬영","n":"한국어 '촬영(撮影)'과 같은 한자어예요. 撮(찍을 촬)는 撮る(とる, 찍다)로도 읽어요."},{"t":"を"},{"t":"{続|つづ}けよう","p":"동사","m":"계속하자","b":"{続|つづ}ける","bm":"계속하다","w":"어간 続는 한자, けよう는 히라가나예요."},{"t":"　"},{"t":"この"},{"t":"{命|いのち}","p":"명사","m":"목숨, 생명","n":"命(목숨 명)는 運命(うんめい, 운명)처럼 한자어에서는 めい로 읽어요. Pretender의 運命, 宿命의 宿命에 들어 있는 命예요."},{"t":"ある","p":"동사","m":"있다","w":"ある(있다)는 보통 히라가나로 써요."},{"t":"{限|かぎ}り","p":"명사","m":"~하는 한","n":"〜限り = ~하는 한. 宿命에도 나온 말이에요."}],"ko":"촬영을 계속하자, 이 목숨이 있는 한","lit":"촬영 / 을 / 계속하자 / 이 / 목숨 / 있다 / 한","g":[{"k":"명사 + ある{限|かぎ}り","d":"'~가 있는 한'. 命ある限り = 목숨이 있는 한. 원래는 命がある限り인데 が를 생략했어요."}],"c":"곡은 '영원'이라는 말 대신 '목숨이 있는 한'으로 끝나요. 끝이 있다는 걸 알기에 더 진심으로 들리는 마무리예요."}]}]},"marigold":{"id":"marigold","title":"マリーゴールド","artist":"あいみょん","year":2018,"eyebrow":"あいみょん · 2018","sub":"밀짚모자를 쓴 너를 여름날 흔들리던 마리골드에 빗대어 부르는 사랑 노래. 타이업 없이 라디오와 스트리밍으로 퍼진 아이묭의 대표곡.","release":"2018년 8월 8일 · 5번째 싱글 · 앨범 『瞬間的シックスセンス』 수록","tieIn":"없음 (드라마·CM 주제가가 아니었어요)","lyricist":"あいみょん","composer":"あいみょん","listen":"https://www.youtube.com/results?search_query=%E3%81%82%E3%81%84%E3%81%BF%E3%82%87%E3%82%93+%E3%83%9E%E3%83%AA%E3%83%BC%E3%82%B4%E3%83%BC%E3%83%AB%E3%83%89","intro":"マリーゴールド는 아이묭이 2018년 8월에 낸 5번째 싱글이에요. 드라마나 광고 주제가가 아니었는데도 라디오와 스트리밍으로 입소문이 나며 크게 퍼졌고, 그해 연말 아이묭은 NHK 「紅白歌合戦」(홍백가합전)에 처음 출전했어요.\n\n노래는 지나간 여름의 사랑을 떠올리는 데서 시작해요. 밀짚모자를 쓴 너, 흔들리는 마리골드, 파란 하늘, 구름처럼 곳곳에 여름 풍경이 나와요. 그 풍경이 '그리운 추억'에서 '놓지 않겠다는 다짐'으로 바뀌어 가는 흐름을 따라 읽어 보세요.","notes":[{"tag":"배경","title":"주제가가 아닌데 퍼진 노래","body":"일본에서 히트곡은 보통 드라마·영화·CM 주제가로 먼저 알려져요. マリーゴールド는 그런 타이업 없이 라디오에서 자주 흘러나오고 스트리밍 순위에서 오래 상위를 지키며 퍼졌어요. 그러다 TV 음악 프로그램에서도 크게 다뤄지게 됐어요.\n\n2018년 연말에는 이 곡으로 「紅白歌合戦」에 처음 섰어요. 히게단의 Pretender가 영화 주제가로 출발한 것과 비교해 보면 재미있어요."},{"tag":"표현","title":"마리골드라는 꽃","body":"マリーゴールド(marigold)는 여름부터 가을까지 노랑·주황 꽃을 피우는 꽃이에요. 한국에서는 '메리골드' 또는 '만수국'이라고도 불러요. 외래어라서 가타카나로 쓰고, 장음 ー가 두 번 들어가 '마리-고-루도'처럼 길게 읽어요.\n\n일본에서 흔히 소개되는 마리골드의 꽃말에는 '질투'나 '절망' 같은 어두운 말도 있어요. 그래서 2절의 [[{絶望|ぜつぼう}は{見|み}えない]](절망은 보이지 않아)와 겹쳐 읽는 사람도 있어요. 다만 작사 의도로 밝혀진 이야기는 아니니 하나의 읽는 법으로만 봐 주세요."},{"tag":"표기","title":"숫자로 쓴 2人","body":"이 곡은 '두 사람'을 [[{2人|ふたり}]]처럼 아라비아 숫자로 써요. 보통은 [[{二人|ふたり}]]라고 쓰지만, 가사·SNS·광고에서는 숫자로 쓰면 눈에 잘 띄고 가벼운 느낌이 나서 이렇게 쓰기도 해요. 읽는 법은 그대로 ふたり예요.\n\n히게단의 115万キロのフィルム도 제목에 아라비아 숫자를 썼어요. 숫자를 섞어 쓰는 건 요즘 가사에서 흔한 방식이에요."},{"tag":"표기","title":"한자를 고르고 푸는 손길","body":"**일부러 히라가나로 푼 말**: [[かみしめて]](噛み締めて), [[{抱|だ}きしめて]](抱き締めて)는 締·噛 같은 한자 대신 히라가나로 써서 부드럽게 만들었어요.\n\n**골라 쓴 한자**: '마음'의 [[{想|おも}い]], '이어지다'의 [[{繋|つな}がって]]는 조요칸지(일상 글에 쓰도록 정한 한자 목록) 밖의 글자나 읽기예요. 보통 思い, つながって로 써요. 히게단 곡에도 想·繋가 자주 나왔죠.\n\n**뜻을 고른 한자**: 눈 속에 '비치는' 실루엣을 [[{写|うつ}る]]로 썼어요. 거울이나 물에 비칠 때는 보통 映る를 쓰고, 写る는 사진에 찍힐 때 써요. 눈에 사진처럼 박혀 있다는 느낌으로도 읽혀요."},{"tag":"표현","title":"そっと、ぎゅっと","body":"[[そっと]](살짝)와 [[ぎゅっと]](꽉)는 모양이나 느낌을 소리로 나타내는 의태어예요. 둘 다 '~っと'로 끝나는 짝이라 리듬이 맞아요. 부드럽게 다가가서 세게 끌어안는 움직임이 두 단어에 다 들어 있어요.\n\n일본어는 이런 의태어가 아주 많아요. ずっと(계속), もっと(더)도 같은 꼴이에요."},{"tag":"문화","title":"麦わら帽子와 여름","body":"[[{麦|むぎ}わら{帽子|ぼうし}]](밀짚모자)는 일본에서 여름방학, 시골, 해바라기 밭을 떠올리게 하는 대표적인 여름 소품이에요. 노래 첫 후렴에 밀짚모자, 마리골드, 파란 하늘이 한꺼번에 나와서 한여름의 한 장면이 그려져요."},{"tag":"문화","title":"〜ますように, 소원을 비는 말","body":"[[{同|おな}じでありますように]]의 〜ますように는 '~하기를'이라는 소원 표현이에요. 신사에서 소원을 적어 거는 나무판(絵馬, えま)이나 칠석(七夕, たなばた) 날 대나무에 거는 종이에 [[{合格|ごうかく}できますように]](합격할 수 있기를)처럼 쓰는 말이에요. 브리지에서 화자가 조용히 기도하듯 바라는 장면으로 읽혀요."}],"dict":{"{君|きみ}":{"p":"대명사","m":"너","w":"'너'를 뜻하는 대명사로, 한자로 쓰는 게 일반적이에요.","n":"원래 '임금'을 뜻하던 한자예요(君主 = 군주). 지금은 가까운 사이에서 부르는 '너'예요. 히게단 곡에서도 자주 나왔죠."},"が":{"p":"조사","m":"~이/가"},"の":{"p":"조사","m":"~의"},"を":{"p":"조사","m":"~을/를","n":"현대 일본어에서 を는 이 조사에만 쓰는 글자예요. 발음은 お(o)와 같아요."},"は":{"p":"조사","m":"~은/는 (주제)","n":"조사로 쓸 때는 ha가 아니라 wa로 읽어요."},"に":{"p":"조사","m":"~에"},"で":{"p":"조사","m":"~에서, ~으로"},"と":{"p":"조사","m":"~라고 (인용)"},"から":{"p":"조사","m":"~니까"},"ずっと":{"p":"부사","m":"계속, 줄곧","w":"부사라 히라가나로 써요.","n":"작은 っ가 들어가 '즛토'처럼 한 박자 쉬고 읽어요. そっと·ぎゅっと와 같은 꼴이에요."},"まだ":{"p":"부사","m":"아직","w":"부사라 히라가나로 써요."},"{2人|ふたり}":{"p":"명사","m":"두 사람, 둘","b":"{二人|ふたり}","bm":"두 사람","w":"보통은 二人로 쓰지만 아라비아 숫자 2를 섞어 썼어요. 가사나 SNS에서 눈에 잘 띄고 가볍게 보이려고 숫자를 쓰기도 해요. 읽는 법은 ふたり 그대로예요.","n":"一人(ひとり), 二人(ふたり)까지만 특별하게 읽고, 三人(さんにん)부터는 숫자 + にん으로 읽어요."},"{雲|くも}":{"p":"명사","m":"구름","n":"한국어 '운(雲)'과 같은 한자예요. 雲は白い(구름은 하얗다)처럼 써요."},"{目|め}":{"p":"명사","m":"눈","n":"한국어 '목(目)'과 같은 한자예요. 하늘에서 내리는 눈(雪, ゆき)과 헷갈리지 마세요."},"{抱|だ}きしめて":{"p":"동사","m":"끌어안고","b":"{抱|だ}きしめる","bm":"꼭 끌어안다","w":"抱き締める의 締(조이다)를 히라가나로 풀어 썼어요. 가사나 편지에서는 이렇게 부드럽게 쓰는 일이 많아요.","n":"抱く(だく, 안다) + 締める(しめる, 조이다)가 합쳐진 말이라 '꽉 끌어안다'예요."},"{離|はな}さない":{"p":"동사","m":"놓지 않아","b":"{離|はな}す","bm":"놓다, 떼다","w":"어간 離는 한자, 부정의 さない는 히라가나예요.","n":"離す(놓다, 타동사)와 離れる(떨어지다, 자동사)는 짝이에요. 후렴의 「もう離れないで」(떨어지지 말아줘)와 같이 나와요."},"いつまでも":{"p":"부사","m":"언제까지나","w":"いつ(언제) + まで(까지) + も(도)가 굳은 부사라 히라가나로 써요."},"ああ":{"p":"감동사","m":"아아","w":"감탄사라 히라가나로 써요."}},"sections":[{"label":"1절 · Aメロ","note":"센 바람이 마음을 흔들자, 진지하게 바라봐 주던 '너'가 그리워져요.","lines":[{"id":"a1","tk":[{"t":"{風|かぜ}","p":"명사","m":"바람","n":"한국어 '풍(風)'과 같은 한자예요. 風景(ふうけい, 풍경)에서는 ふう로 읽어요."},{"t":"の"},{"t":"{強|つよ}さ","p":"명사","m":"세기, 강함","b":"{強|つよ}さ","w":"어간 強는 한자, 명사를 만드는 さ는 히라가나예요.","n":"い형용사의 い를 さ로 바꾸면 '정도'를 나타내는 명사가 돼요. 強い(강하다) → 強さ(강함), 優しい → 優しさ. 후렴의 優しさ도 같은 꼴이에요."},{"t":"が"},{"t":"ちょっと","p":"부사","m":"조금, 좀","w":"한자로 쓰는 일이 거의 없는 부사라 히라가나로 써요.","n":"회화에서 아주 많이 쓰는 말이에요. 少し(すこし)보다 가볍고 편한 말투예요."}],"ko":"바람이 조금 세서","lit":"바람 / 의 / 세기 / 가 / 조금","g":[{"k":"〜さ (명사 만들기)","d":"い형용사 어간 + さ = '~함, ~의 정도'. 強い → 強さ(세기), 高い → 高さ(높이), 優しい → 優しさ(상냥함)."}],"s":"한 줄에 한자(風·強), 히라가나(の·さ·が·ちょっと)만 있어요. 뜻을 담은 말은 한자, 문법 조각과 부사는 히라가나라는 기본 규칙이 그대로 보여요.","c":"첫 줄은 '바람의 세기가 조금'에서 끊기고 다음 줄로 이어져요. 바람이 세서 마음이 흔들렸다는 한 문장을 두 줄로 나눠 노래해요."},{"id":"a2","tk":[{"t":"{心|こころ}","p":"명사","m":"마음","n":"한국어 '심(心)'과 같은 한자예요. 心配(しんぱい, 걱정)에서는 しん으로 읽어요."},{"t":"を"},{"t":"{揺|ゆ}さぶりすぎて","p":"동사","m":"너무 흔들어서","b":"{揺|ゆ}さぶる","bm":"흔들다, 뒤흔들다","w":"어간 揺는 한자, さぶりすぎて는 히라가나예요. すぎる(지나치다)가 붙어 '너무 ~하다'가 됐어요.","n":"揺れる(ゆれる, 흔들리다)와 같은 揺 자예요. 후렴의 揺れたマリーゴールド(흔들린 마리골드)로 이어져요."}],"ko":"마음을 너무 흔들어 놓아서","lit":"마음 / 을 / 너무 흔들어서","g":[{"k":"〜すぎる","d":"동사 ます형 + すぎる = '너무 ~하다'. 揺さぶる → 揺さぶりすぎる, 食べる → 食べすぎる(과식하다). て형 すぎて는 '너무 ~해서'라는 이유가 돼요."}],"s":"揺라는 한자가 이 줄과 후렴(揺れた)에 두 번 나와요. 바람에 흔들리는 마음과 바람에 흔들리는 꽃이 같은 글자로 이어져요.","c":"센 바람이 마음까지 흔들었다는 건, 그만큼 마음이 약해져 있다는 뜻으로도 읽혀요. 그래서 다음 줄에서 '너'가 그리워져요."},{"id":"a3","tk":[{"t":"{真面目|まじめ}に","p":"な형용사","m":"진지하게","b":"{真面目|まじめ}","bm":"진지함, 성실함","w":"真面目는 글자마다 읽기가 나뉘지 않고 단어 전체를 まじめ로 읽는 주쿠지쿤(熟字訓)이에요. 뒤의 に는 '~하게'로 바꿔 주는 히라가나예요.","n":"真面目な人(성실한 사람)처럼 써요. 반대로 '농담하지 마'는 ふざけないで예요."},{"t":"{見|み}つめた","p":"동사","m":"바라보던","b":"{見|み}つめる","bm":"바라보다, 응시하다","w":"어간 見는 한자, つめた는 히라가나예요.","n":"見る(보다)보다 오래, 한곳을 가만히 보는 느낌이에요. 후렴의 見つめる君を에서 다시 나와요."}],"ko":"진지하게 바라봐 주던","lit":"진지하게 / 바라보던","g":[{"k":"な형용사 + に","d":"な형용사에 に를 붙이면 부사가 돼요. 真面目 → 真面目に(진지하게), 静か → 静かに(조용히)."}],"s":"真面目는 한 글자씩 읽으면 しんめんもく처럼 될 것 같지만 まじめ라고 읽어요. 이렇게 단어 전체에 읽기를 붙이는 주쿠지쿤은 루비가 단어 전체에 하나로 달려요.","c":"見つめた는 과거형이라 그 시선은 지금이 아니라 예전 일이에요. 다음 줄의 '그리워'로 이어지며 지난 시간을 떠올리는 노래라는 게 드러나요."},{"id":"a4","tk":[{"t":"{君|きみ}"},{"t":"が"},{"t":"{恋|こい}しい","p":"い형용사","m":"그립다","w":"어간 恋는 한자, 형용사 어미 しい는 히라가나예요.","n":"恋(こい, 사랑)에서 나온 말이라 사람을 그리워할 때 써요. 장소나 옛날이 그리울 때는 후렴의 懐かしい를 더 많이 써요."}],"ko":"네가 그리워","lit":"너 / 가 / 그립다","g":[{"k":"〜が + 감정 형용사","d":"좋아하다·그립다·무섭다 같은 감정의 대상에는 が를 써요. 君が恋しい(네가 그리워), 犬が好き(개가 좋아). 한국어 '네가 그리워'와 같아요."}],"s":"恋しい의 恋는 후렴 끝의 恋(사랑)와 같은 글자예요. 첫 덩어리가 '그리움'으로 끝나고, 후렴이 '사랑'으로 끝나요.","c":"곡의 첫 네 줄이 한 문장이에요. '바람이 조금 세서 마음이 흔들리니, 진지하게 바라봐 주던 네가 그리워'라는 흐름이에요."},{"id":"a5","tk":[{"t":"でんぐり{返|がえ}し","p":"명사","m":"앞구르기, 뒤죽박죽","b":"でんぐり{返|がえ}し","w":"でんぐり 부분은 한자가 없는 말이라 히라가나로 쓰고, 返し만 한자예요. 返す(かえす, 뒤집다)가 뒤에 붙으면서 か가 が로 탁해졌어요.","n":"원래 몸을 동그랗게 말아 구르는 '앞구르기'예요. 여기서는 하루하루가 뒤집히고 뒤죽박죽인 나날을 빗댄 말로 읽혀요."},{"t":"の"},{"t":"{日々|ひび}","p":"명사","m":"나날","w":"々는 앞 글자를 한 번 더 쓴다는 반복 기호예요. 日々 = 日日.","n":"人々(ひとびと, 사람들), 時々(ときどき, 가끔)도 같은 기호를 써요."}],"ko":"엎치락뒤치락하는 나날","lit":"앞구르기 / 의 / 나날","g":[{"k":"명사 + の + 명사","d":"でんぐり返しの日々 = '앞구르기의 나날' → '앞구르기 같은 나날'. の가 앞 명사로 뒤 명사를 꾸며요."}],"s":"々(같은 글자 반복 기호)가 처음 나와요. 히라가나도 가타카나도 아닌 기호라 읽을 때는 앞 글자를 한 번 더 읽되, 日々처럼 소리가 바뀌는(ひ → び) 경우가 많아요.","c":"보내 주신 번역의 '반복되는 나날'처럼, 구르듯 똑같이 굴러가는 날들로도 읽을 수 있어요. 어느 쪽이든 마음이 안정되지 않은 시간이에요."},{"id":"a6","tk":[{"t":"{可哀想|かわいそう}な","p":"な형용사","m":"불쌍한","b":"{可哀想|かわいそう}","bm":"불쌍함, 가엾음","w":"可哀想는 소리에 맞춰 한자를 빌려 쓴 표기(当て字)예요. 그래서 かわいそう처럼 히라가나로 쓰는 일도 많아요.","n":"可愛い(かわいい, 귀엽다)와 소리가 닮았지만 다른 말이에요. 한자로 쓰면 구별이 쉬워요."},{"t":"ふり","p":"명사","m":"~인 척","b":"{振|ふ}り","bm":"척, 시늉","w":"한자 振り가 있지만 '~인 척'이라는 뜻일 때는 보통 히라가나로 써요.","n":"〜ふりをする = '~인 척하다'. 知らないふり(모르는 척), 寝たふり(자는 척). 히게단의 Pretender(~인 척하는 사람)와 이어지는 말이에요."},{"t":"を"},{"t":"して","p":"동사","m":"하며","b":"する","bm":"하다","w":"する는 히라가나로 써요."}],"ko":"불쌍한 척을 하면서","lit":"불쌍한 / 척 / 을 / 하며","g":[{"k":"〜ふりをする","d":"'~인 척하다'. 명사 + の + ふり(病気のふり), 동사·형용사 + ふり(可哀想なふり)."}],"s":"可哀想는 소리를 맞춰 한자를 고른 当て字라, 한자의 뜻(가히 슬퍼할 생각)과 '불쌍하다'가 대략 통하게 골랐어요. 寿司(すし)처럼 일본어에는 이런 표기가 꽤 있어요.","c":"스스로를 불쌍한 사람인 척 만들어 본다는 고백이에요. 히게단 Pretender의 '척하는' 화자와 겹쳐 읽어도 재미있어요."},{"id":"a7","tk":[{"t":"だらけて","p":"동사","m":"늘어져서","b":"だらける","bm":"늘어지다, 게으름 피우다","w":"한자가 없는 말이라 히라가나로 써요.","n":"힘을 빼고 축 늘어진 모습이에요. だらだら(빈둥빈둥)라는 의태어와 같은 뿌리예요."},{"t":"みた","p":"보조동사","m":"~해 봤다","b":"みる","bm":"~해 보다","w":"'보다'라는 원래 뜻이 아니라 '시험 삼아 ~해 보다'라는 보조 뜻이라 히라가나로 써요."},{"t":"けど","p":"조사","m":"~지만","n":"けれど·けれども의 줄임말로 회화에서 많이 써요."}],"ko":"게으름도 피워 봤지만","lit":"늘어져 / 봤다 / 지만","g":[{"k":"〜てみる","d":"동사 て형 + みる = '~해 보다'. だらけてみる(늘어져 보다), 食べてみる(먹어 보다). 이때 みる는 히라가나로 써요."}],"s":"見る(보다)가 '~해 보다'로 쓰이면 한자 대신 히라가나 みる로 써요. 뜻이 옅어진 보조 동사는 히라가나로 쓴다는 규칙이에요.","c":"불쌍한 척도 해 보고 늘어져 보기도 했지만, 그래도 안 된다는 말이 다음 줄로 이어져요."},{"id":"a8","tk":[{"t":"{希望|きぼう}","p":"명사","m":"희망","n":"한국어 '희망(希望)'과 같은 한자어예요. 2절의 絶望(ぜつぼう, 절망)과 짝을 이뤄요."},{"t":"の"},{"t":"{光|ひかり}","p":"명사","m":"빛","n":"한국어 '광(光)'과 같은 한자예요. 光る(ひかる)는 '빛나다'예요."},{"t":"は"}],"ko":"희망의 빛은","lit":"희망 / 의 / 빛 / 은","g":[{"k":"〜は (주제)","d":"希望の光は = '희망의 빛은'. 문장이 다음 줄로 이어져요. 주제를 먼저 꺼내 놓고 설명을 뒤에 붙이는 일본어 어순이에요."}],"s":"希望(희망)은 한국어와 같은 한자어라 한자만 보고도 뜻을 알 수 있어요. 일본어 공부에서 한국어 한자어가 큰 도움이 되는 예예요.","c":"아무리 늘어져 봐도 희망의 빛은 꺼지지 않았다는 말이 Bメロ로 이어져요."}]},{"label":"1절 · Bメロ","note":"희망의 빛이 눈앞에서 계속 빛나고 있다고, '행복해'라고 말해요.","lines":[{"id":"b1","tk":[{"t":"{目|め}"},{"t":"の"},{"t":"{前|まえ}","p":"명사","m":"앞","n":"目の前 = 눈앞. 한국어 '전(前)'과 같은 한자예요."},{"t":"で"},{"t":"ずっと"},{"t":"{輝|かがや}いている","p":"동사","m":"빛나고 있는","b":"{輝|かがや}く","bm":"빛나다, 반짝이다","w":"어간 輝는 한자, いている는 히라가나예요.","n":"光る(ひかる)보다 크고 눈부시게 빛나는 느낌이에요. 한국어 '휘(輝)'와 같은 한자예요."}],"ko":"눈앞에서 줄곧 빛나고 있는","lit":"눈 / 의 / 앞 / 에서 / 계속 / 빛나고 있는","g":[{"k":"〜ている","d":"동사 て형 + いる = '~하고 있다'. 輝く → 輝いている(빛나고 있다). 이 줄에서는 앞줄 希望の光は의 설명이에요."}],"s":"輝く의 て형은 輝いて예요. く로 끝나는 5단 동사는 て형에서 く가 い로 바뀌어요(書く → 書いて).","c":"앞줄과 이어 읽으면 '희망의 빛은 눈앞에서 줄곧 빛나고 있어'예요. 흔들리던 마음 속에서도 희망이 바로 앞에 있다는 걸 알아차리는 순간이에요."},{"id":"b2","tk":[{"t":"{幸|しあわ}せ","p":"な형용사","m":"행복","b":"{幸|しあわ}せ","bm":"행복함","w":"어간 幸는 한자, せ는 히라가나예요. 명사처럼 보여도 오쿠리가나(한자 뒤에 붙는 히라가나) せ가 붙어요.","n":"幸せ와 같은 뜻의 幸福(こうふく)은 한국어 '행복'과 같은 한자어인데, 회화에서는 幸せ를 훨씬 많이 써요."},{"t":"だ","p":"조동사","m":"~이다","n":"명사·な형용사 뒤에 붙는 단정의 말이에요. 정중하게는 です."}],"ko":"행복해","lit":"행복 / 이다","g":[{"k":"な형용사 + だ","d":"幸せだ = 행복하다. な형용사는 문장 끝에서 だ, 명사를 꾸밀 때 な가 붙어요(幸せな日, 행복한 날)."}],"s":"한 단어짜리 줄이에요. 幸せ처럼 한자 하나에 히라가나 하나가 붙는 짧은 말은 초보자가 외우기 좋은 단어예요.","c":"흔들리고 늘어지던 1절이 '행복해'라는 한마디로 정리되고, 곧바로 후렴으로 넘어가요."}]},{"label":"サビ · 후렴","note":"밀짚모자를 쓴 너, 흔들리는 마리골드, 파란 여름 하늘. 그날의 사랑을 떠올리며 너를 꼭 안고 놓지 않겠다고 해요.","lines":[{"id":"c1","tk":[{"t":"{麦|むぎ}わら","p":"명사","m":"밀짚","b":"{麦|むぎ}{藁|わら}","bm":"밀짚","w":"麦藁의 藁(짚)가 어려운 한자라 わら만 히라가나로 풀어 썼어요. 한자와 히라가나를 섞어 쓰는 표기(交ぜ書き)예요.","n":"麦(むぎ)는 보리·밀이에요. 한국어 '맥(麥)'의 일본식 약자예요."},{"t":"の"},{"t":"{帽子|ぼうし}","p":"명사","m":"모자","n":"한국어 '모자(帽子)'와 같은 한자어예요. 麦わら帽子 = 밀짚모자."},{"t":"の","m":"~을 쓴, ~인","n":"帽子の君 = '모자의 너' → '모자를 쓴 너'. の가 '~을 지닌, ~인'이라는 뜻으로 쓰였어요."},{"t":"{君|きみ}"},{"t":"が"}],"ko":"밀짚모자를 쓴 네가","lit":"밀짚 / 의 / 모자 / 의 / 너 / 가","g":[{"k":"명사 + の + 사람","d":"麦わらの帽子の君 = '밀짚모자의 너' → '밀짚모자를 쓴 너'. の 하나로 '~을 쓴, ~을 입은'까지 나타낼 수 있어요."}],"s":"麦わら는 한자 藁가 어려워 わら만 히라가나로 풀었어요. 한 단어 안에서 한자와 히라가나가 섞이는 표기로, 가사나 신문에서 종종 봐요.","c":"밀짚모자는 일본에서 여름방학과 시골, 바닷가를 떠올리게 하는 여름 소품이에요. 후렴 첫 줄부터 여름 풍경이 펼쳐져요."},{"id":"c2","tk":[{"t":"{揺|ゆ}れた","p":"동사","m":"흔들린, 흔들리던","b":"{揺|ゆ}れる","bm":"흔들리다","w":"어간 揺는 한자, れた는 히라가나예요.","n":"揺れる(흔들리다, 자동사)와 揺らす(흔들다, 타동사)는 짝이에요. 1절의 揺さぶる와 같은 한자예요."},{"t":"マリーゴールド","p":"명사","m":"마리골드 (꽃)","w":"영어 marigold에서 온 외래어라 가타카나로 써요. 장음 ー가 두 번 들어가요.","n":"여름부터 가을까지 노랑·주황 꽃이 피어요. 한국에서는 메리골드, 만수국이라고도 해요."},{"t":"に"},{"t":"{似|に}てる","p":"동사","m":"닮았어","b":"{似|に}る","bm":"닮다","w":"어간 似는 한자, てる는 히라가나예요. 似ている의 い를 뺀 회화체예요.","n":"'~를 닮다'는 〜を가 아니라 〜に似る라고 해요. 父に似てる(아빠를 닮았어)."}],"ko":"흔들리는 마리골드를 닮았어","lit":"흔들린 / 마리골드 / 에 / 닮아 있어","g":[{"k":"〜に{似|に}る","d":"'~를 닮다'는 조사 に를 써요. 한국어는 '~를'이라 헷갈리기 쉬워요. 似ている → 회화에서는 似てる."},{"k":"〜てる (회화체)","d":"〜ている에서 い가 빠진 말투예요. 似ている → 似てる, 見ている → 見てる."}],"s":"한 줄에 한자(揺·似), 히라가나(れた·に·てる), 가타카나(マリーゴールド)가 다 들어 있어요. 외래어 꽃 이름만 가타카나라 눈에 확 띄어요.","c":"제목이 처음 나오는 줄이에요. 바람에 흔들리는 꽃 한 송이처럼 밀짚모자를 쓴 네가 여름 풍경 속에 서 있어요."},{"id":"c3","tk":[{"t":"あれ","p":"대명사","m":"그것, 그건 (지난 일)","w":"これ·それ·あれ 같은 지시어는 히라가나로 써요.","n":"あれ는 눈앞에 없는 것, 서로 아는 지난 일을 가리켜요. 한국어로는 '그건'이 자연스러워요."},{"t":"は"},{"t":"{空|そら}","p":"명사","m":"하늘","n":"한국어 '공(空)'과 같은 한자지만 '하늘'일 때는 そら로 읽어요. 空気(くうき, 공기)에서는 くう예요."},{"t":"が"},{"t":"まだ"},{"t":"{青|あお}い","p":"い형용사","m":"파란","w":"어간 青는 한자, い는 히라가나예요.","n":"한국어 '청(靑)'의 일본식 자체예요. 일본어 青い는 신호등 초록불이나 푸른 잎도 가리킬 만큼 넓은 색이에요."},{"t":"{夏|なつ}","p":"명사","m":"여름","n":"한국어 '하(夏)'와 같은 한자예요. 夏休み(なつやすみ) = 여름방학."},{"t":"の"},{"t":"こと","p":"형식명사","m":"일","b":"こと","w":"'일, 것'이라는 뜻만 남은 형식명사라 한자 事 대신 히라가나로 써요."}],"ko":"그건 하늘이 아직 파랗던 여름의 일","lit":"그것 / 은 / 하늘 / 이 / 아직 / 파란 / 여름 / 의 / 일","g":[{"k":"〜のこと","d":"명사 + のこと = '~의 일'. 夏のこと(여름의 일), 君のこと(너에 관한 것)."}],"s":"こと는 事라고 쓸 수 있지만, 뜻이 옅어진 형식명사라 히라가나로 써요. 앞 줄의 みた(보조동사)와 같은 규칙이에요.","c":"あれ(그건)로 시작해서 이 장면이 이미 지나간 여름이라는 게 분명해져요. 지금은 그 여름을 떠올리고 있는 거예요."},{"id":"c4","tk":[{"t":"{懐|なつ}かしい","p":"い형용사","m":"그립다, 반갑다","w":"어간 懐는 한자, かしい는 히라가나예요.","n":"지난 시간이나 장소, 오랜만에 만난 것이 반갑고 그리울 때 써요. 1절의 恋しい는 사람을 그리워하는 말이에요."},{"t":"と"},{"t":"{笑|わら}えた","p":"동사","m":"웃을 수 있었던","b":"{笑|わら}う","bm":"웃다","w":"어간 笑는 한자, えた는 히라가나예요.","n":"笑う → 가능형 笑える(웃을 수 있다) → 과거 笑えた. 笑顔(えがお, 웃는 얼굴)도 같은 한자예요."},{"t":"あの","p":"연체사","m":"그, 저","w":"この·その·あの 같은 지시어는 히라가나로 써요."},{"t":"{日|ひ}","p":"명사","m":"날","n":"あの日 = 그날. 한국어 '일(日)'과 같은 한자지만 혼자 쓰면 ひ로 읽어요."},{"t":"の"},{"t":"{恋|こい}","p":"명사","m":"사랑","n":"恋(こい)는 설레는 연애 감정, 愛(あい)는 더 깊고 넓은 사랑이에요."}],"ko":"그립다며 웃을 수 있었던 그날의 사랑","lit":"그립다 / 라고 / 웃을 수 있었던 / 그 / 날 / 의 / 사랑","g":[{"k":"가능형 〜える","d":"5단 동사의 끝 う단을 え단으로 바꾸고 る를 붙이면 '~할 수 있다'. 笑う → 笑える, 書く → 書ける. 과거는 笑えた."}],"s":"懐かしい는 오쿠리가나가 かしい로 길어요. 어간 한자 하나에 긴 히라가나가 붙는 형용사는 恋しい, 優しい처럼 이 곡에 여럿 나와요.","c":"'그립다'며 웃을 수 있었다는 건, 그 사랑이 아픈 기억이 아니라 따뜻한 추억이라는 뜻으로 읽혀요."},{"id":"c5","tk":[{"t":"「"},{"t":"もう","p":"부사","m":"이젠, 더는","w":"부사라 히라가나로 써요.","n":"부정과 함께 쓰면 '이젠 ~하지 마'예요. もう泣かないで(이젠 울지 마)."},{"t":"{離|はな}れないで","p":"동사","m":"떨어지지 말아줘","b":"{離|はな}れる","bm":"떨어지다, 멀어지다","w":"어간 離는 한자, れないで는 히라가나예요.","n":"離れる(떨어지다, 자동사)와 離す(놓다, 타동사)는 짝이에요. 후렴 끝의 離さない로 대답해요."},{"t":"」"},{"t":"と"}],"ko":"“이젠 떨어지지 말아줘”라며","lit":"이젠 / 떨어지지 말아줘 / 라고","g":[{"k":"〜ないで","d":"동사 부정형 + で = '~하지 말아줘'. 離れない → 離れないで, 行かない → 行かないで."},{"k":"「…」と","d":"따옴표 「」로 말을 옮기고 と(~라고)를 붙여요. 한국어 '“…”라며'와 같아요."}],"s":"일본어는 따옴표로 「 」를 써요. 책 제목에는 『 』를 써요(앨범 『瞬間的シックスセンス』).","c":"떨어지지 말아 달라는 건 '너'의 말이에요. 그 말에 화자가 어떻게 대답하는지가 이 후렴의 끝이에요."},{"id":"c6","tk":[{"t":"{泣|な}きそうな","p":"동사","m":"울 것 같은","b":"{泣|な}く","bm":"울다","w":"어간 泣는 한자, きそうな는 히라가나예요.","n":"泣く(울다)의 ます형 泣き + そうだ(~할 것 같다). 泣きそうな顔(울 것 같은 얼굴)처럼 자주 써요."},{"t":"{目|め}"},{"t":"で"},{"t":"{見|み}つめる","p":"동사","m":"바라보는","b":"{見|み}つめる","bm":"바라보다, 응시하다","w":"어간 見는 한자, つめる는 히라가나예요."},{"t":"{君|きみ}"},{"t":"を"}],"ko":"울 것 같은 눈으로 바라보는 너를","lit":"울 것 같은 / 눈 / 으로 / 바라보는 / 너 / 를","g":[{"k":"ます형 + そうだ","d":"'~할 것 같다'(모양을 보고 하는 추측). 泣く → 泣きそうだ, 雨が降りそうだ(비가 올 것 같다). 명사를 꾸밀 때는 泣きそうな目."}],"s":"見つめる가 1절 見つめた에 이어 다시 나와요. 1절에서는 네가 진지하게 바라봐 주던 기억, 여기서는 울 것 같은 눈으로 바라보는 너예요.","c":"앞줄의 「もう離れないで」를 말하는 '너'의 얼굴이에요. 다음 두 줄에서 화자가 그 너를 끌어안아요."},{"id":"c7","tk":[{"t":"{雲|くも}"},{"t":"の"},{"t":"ような","p":"조동사","m":"~같은","n":"명사 + のような = '~같은'. 夢のような(꿈같은), 雲のような(구름 같은)."},{"t":"{優|やさ}しさ","p":"명사","m":"상냥함, 다정함","b":"{優|やさ}しさ","w":"어간 優는 한자, しさ는 히라가나예요. 優しい(상냥하다)의 い를 さ로 바꾼 명사예요.","n":"1절 強さ(세기)와 같은 꼴이에요. 優しい人 = 다정한 사람."},{"t":"で"},{"t":"そっと","p":"부사","m":"살짝, 가만히","w":"모양을 소리로 나타내는 의태어라 히라가나로 써요.","n":"소리 나지 않게 조심스러운 모양이에요. そっと開ける(살짝 열다)."},{"t":"ぎゅっと","p":"부사","m":"꽉","w":"의태어라 히라가나로 써요. 강조하고 싶을 때는 가타카나 ギュッと로도 써요.","n":"세게 쥐거나 끌어안는 모양이에요. ぎゅっと握る(꽉 쥐다)."}],"ko":"구름 같은 다정함으로 살며시, 꽉","lit":"구름 / 의 / 같은 / 다정함 / 으로 / 살짝 / 꽉","g":[{"k":"〜のような","d":"명사 + のような + 명사 = '~같은 ~'. 雲のような優しさ(구름 같은 다정함)."}],"s":"そっと·ぎゅっと는 모양을 소리로 그리는 의태어예요. 의태어는 보통 히라가나로 쓰지만, 만화나 광고에서 힘을 주고 싶을 때는 가타카나로도 써요.","c":"구름처럼 부드럽게 다가가 꽉 안는 움직임이에요. 살짝(そっと)과 꽉(ぎゅっと)이 반대처럼 보여도, 소중하게 끌어안는 한 동작으로 읽혀요."},{"id":"c8","tk":[{"t":"{抱|だ}きしめて"},{"t":"{抱|だ}きしめて","p":"동사","m":"끌어안고","b":"{抱|だ}きしめる","bm":"꼭 끌어안다"},{"t":"{離|はな}さない"}],"ko":"끌어안고 또 끌어안고 놓지 않아","lit":"끌어안고 / 끌어안고 / 놓지 않아","g":[{"k":"て형 반복","d":"抱きしめて抱きしめて처럼 て형을 겹치면 동작을 거듭하는 느낌이 나요. 한국어 '안고 또 안고'와 비슷해요."},{"k":"〜ない (부정)","d":"離す → 離さない. す로 끝나는 5단 동사는 さ + ない가 돼요."}],"s":"抱き締める의 締를 히라가나로 풀어 抱きしめる로 썼어요. 뒤의 離さない는 離す의 부정이에요. 앞줄의 離れないで(떨어지지 마)에 '놓지 않아'로 대답하는 셈이에요.","c":"「もう離れないで」라는 부탁에 대한 대답이에요. 떨어지지 말라는 말에, 이쪽에서 먼저 놓지 않겠다고 다짐해요."}]},{"label":"2절 · Aメロ","note":"진심을 다 털어놓을 만큼 강하지는 않지만, 이상하게도 절망은 보이지 않는다고 해요.","lines":[{"id":"d1","tk":[{"t":"{本当|ほんとう}","p":"명사","m":"진짜, 정말","n":"本当の〜 = '진짜 ~'. 회화에서는 ほんと로 줄여 말하기도 해요."},{"t":"の"},{"t":"{気持|きも}ち","p":"명사","m":"마음, 기분","w":"気(き)와 持(も)는 한자, ち는 히라가나예요. 명사지만 持つ(もつ)에서 온 말이라 오쿠리가나 ち가 붙어요.","n":"本当の気持ち = 진심. 気持ちいい는 '기분 좋다'예요."},{"t":"{全部|ぜんぶ}","p":"명사","m":"전부","n":"한국어 '전부(全部)'와 같은 한자어예요. 발음은 ん이 ぶ 앞이라 '젬부'처럼 들려요."}],"ko":"진심을 전부","lit":"진짜 / 의 / 마음 / 전부","g":[{"k":"명사 + 全部","d":"気持ち全部 = '마음 전부'. 일본어는 全部를 명사 뒤에 붙여 '~를 전부'처럼 쓰기도 해요. 원래는 気持ちを全部인데 を가 빠졌어요."}],"s":"気持ち처럼 명사인데도 오쿠리가나가 붙는 말이 있어요. 동사 持つ에서 온 말이라 ち가 남아 있어요.","c":"후렴에서 '놓지 않아'라고 다짐했지만, 2절에서는 속마음을 다 꺼내지 못하는 약한 모습이 나와요."},{"id":"d2","tk":[{"t":"{吐|は}き{出|だ}せる","p":"동사","m":"털어놓을 수 있는","b":"{吐|は}き{出|だ}す","bm":"토해 내다, 털어놓다","w":"吐(は)와 出(だ) 두 한자 사이와 뒤에 히라가나가 붙었어요. 吐く + 出す가 합쳐진 복합동사예요.","n":"吐き出す → 가능형 吐き出せる. 속마음을 '토해 내다'라고 하는 건 한국어와 같은 비유예요."},{"t":"ほど","p":"조사","m":"~만큼, ~정도로","n":"동사 + ほど = '~할 정도로'. 泣くほど嬉しい(울 정도로 기뻐)."},{"t":"{強|つよ}く","p":"い형용사","m":"강하게, 강하지","b":"{強|つよ}い","bm":"강하다","w":"어간 強는 한자, く는 히라가나예요."},{"t":"は"},{"t":"ない","p":"い형용사","m":"않다, 없다","b":"ない","bm":"없다","w":"부정의 ない는 히라가나로 써요."}],"ko":"털어놓을 만큼 강하지는 않아","lit":"털어놓을 수 있을 / 만큼 / 강하게 / 는 / 않다","g":[{"k":"い형용사 〜くはない","d":"強い → 強くない(강하지 않다). 사이에 は를 넣은 強くはない는 '강하지는 않다'처럼 한정하는 느낌이에요."}],"s":"1절의 強さ(세기)에 이어 強い가 다시 나와요. 바람은 셌는데 나는 강하지 않다는 대비로도 읽혀요.","c":"진심을 다 꺼낼 만큼 강하지 못하다는 고백이에요. 다음 줄에서 '그래도'로 뒤집혀요."},{"id":"d3","tk":[{"t":"でも","p":"접속사","m":"그래도, 하지만","w":"접속사라 히라가나로 써요."},{"t":"{不思議|ふしぎ}な","p":"な형용사","m":"신기한, 이상한","b":"{不思議|ふしぎ}","bm":"신기함, 이상함","w":"뜻을 담은 한자어라 한자로 쓰고, な는 히라가나예요.","n":"한국어 '불가사의(不可思議)'의 不思議 부분이에요. 不思議の国のアリス = 이상한 나라의 앨리스."},{"t":"くらい","p":"조사","m":"~정도","n":"ぐらい라고도 해요. 不思議なくらい(신기할 정도로)."},{"t":"に"}],"ko":"그래도 신기할 정도로","lit":"그래도 / 신기한 / 정도 / 로","g":[{"k":"〜くらいに","d":"'~할 정도로'. 不思議なくらいに = 신기할 정도로. 앞줄의 ほど와 비슷한 말이에요."}],"s":"不思議는 한국어 '불가사의'와 같은 한자를 써요. 한자를 알면 뜻이 바로 보이는 말이에요.","c":"앞줄의 약한 고백을 でも(그래도)로 받아서 분위기가 바뀌어요."},{"id":"d4","tk":[{"t":"{絶望|ぜつぼう}","p":"명사","m":"절망","n":"한국어 '절망(絶望)'과 같은 한자어예요. 1절의 希望(희망)과 짝이에요."},{"t":"は"},{"t":"{見|み}えない","p":"동사","m":"보이지 않아","b":"{見|み}える","bm":"보이다","w":"어간 見는 한자, えない는 히라가나예요.","n":"見る(보다)는 내가 보는 것, 見える(보이다)는 저절로 보이는 것이에요."}],"ko":"절망은 보이지 않아","lit":"절망 / 은 / 보이지 않는다","g":[{"k":"{見|み}る · {見|み}える","d":"見る = (일부러) 보다, 見える = (저절로) 보이다. 絶望は見えない = 절망이 눈에 들어오지 않는다."}],"s":"1절 希望(희망)과 2절 絶望(절망)이 望 한 글자를 같이 써요. 한자를 보면 두 말이 짝이라는 게 한눈에 보여요.","c":"1절은 '희망의 빛은 눈앞에', 2절은 '절망은 보이지 않아'예요. 같은 이야기를 반대쪽에서 한 번 더 하는 구성이에요."}]},{"label":"2절 · Bメロ","note":"눈 속에 계속 비치는 너의 실루엣. 이번에는 '정말 좋아'라고 말해요.","lines":[{"id":"e1","tk":[{"t":"{目|め}"},{"t":"の"},{"t":"{奥|おく}","p":"명사","m":"안쪽, 깊은 곳","n":"目の奥 = 눈 깊은 곳, 눈동자 속. 奥さん(おくさん, 남의 아내)도 같은 한자예요."},{"t":"に"},{"t":"ずっと"},{"t":"{写|うつ}る","p":"동사","m":"비치는, 찍히는","w":"어간 写는 한자, る는 히라가나예요. 거울이나 물에 비칠 때는 보통 映る를 쓰는데, 사진에 찍히는 写る를 골랐어요.","n":"写真(しゃしん, 사진)의 写예요. 눈 속에 사진처럼 박혀 있다는 느낌으로도 읽혀요."},{"t":"シルエット","p":"명사","m":"실루엣","w":"프랑스어 silhouette에서 온 외래어라 가타카나로 써요. 작은 ッ가 들어가 '시루엣토'로 읽어요."}],"ko":"눈 속에 계속 비치는 실루엣","lit":"눈 / 의 / 안쪽 / 에 / 계속 / 비치는 / 실루엣","g":[{"k":"동사 + 명사","d":"동사 사전형이 그대로 명사를 꾸며요. 写るシルエット = 비치는 실루엣. 한국어처럼 따로 '~는'을 붙이지 않아요."}],"s":"写る와 映る는 둘 다 うつる라고 읽어요. 같은 소리에 뜻이 조금 다른 한자를 골라 쓰는 게 일본어 표기의 재미예요. 이 곡은 사진의 写를 골랐어요.","c":"1절 Bメロ '눈앞에서 계속 빛나는'(目の前でずっと)과 짝이에요. 1절은 눈앞, 2절은 눈 속(目の奥)이에요. 희망의 빛이 너의 모습으로 바뀌었어요."},{"id":"e2","tk":[{"t":"{大|だい}{好|す}き","p":"な형용사","m":"정말 좋아함","b":"{大|だい}{好|す}き","bm":"아주 좋아함","w":"大(だい)와 好(す)는 한자, き는 히라가나예요. 好き(좋아함)에 大(크게)가 붙었어요.","n":"好き(좋아해)보다 강한 말이에요. 일본어는 '사랑해(愛してる)'보다 大好き를 훨씬 자주 써요."},{"t":"さ","p":"조사(종조사)","m":"~야, ~라고","n":"문장 끝 さ는 가볍게 단정하는 말투예요. 조금 덤덤하고 쿨한 느낌이에요."}],"ko":"정말 좋아해","lit":"정말 좋아함 / 이야","g":[{"k":"종조사 さ","d":"大好きさ = '정말 좋아해'. 끝에 さ를 붙이면 담담하게 툭 던지는 말투가 돼요."}],"s":"1절은 幸せだ(행복해), 2절은 大好きさ(정말 좋아해)로 끝나요. 둘 다 한 단어짜리 줄이고, 끝말 だ·さ만 바뀌었어요.","c":"1절 Bメロ의 '행복해'가 2절에서는 '정말 좋아해'로 바뀌어요. 마음이 조금 더 솔직해졌다고도 읽혀요."}]},{"label":"サビ 2 · 두 번째 후렴","note":"추억이 아니라 '오늘'의 장면이에요. 둘이 걸으며 오늘에 이름을 붙이고, 사랑한다는 말로는 부족해 키스해요.","lines":[{"id":"f1","tk":[{"t":"{柔|やわ}らかな","p":"な형용사","m":"부드러운","b":"{柔|やわ}らか","bm":"부드러움","w":"어간 柔는 한자, らかな는 히라가나예요.","n":"柔らかい(い형용사)와 같은 뜻이에요. 柔らかな는 조금 더 글말 같고 부드러운 느낌이라 노래 가사에 잘 어울려요."},{"t":"{肌|はだ}","p":"명사","m":"피부, 살결","n":"한국어 '기(肌)'와 같은 한자예요. 肌が白い(피부가 하얗다)."},{"t":"を"},{"t":"{寄|よ}せあい","p":"동사","m":"서로 맞대고","b":"{寄|よ}せ{合|あ}う","bm":"서로 가까이 대다","w":"寄せ合い의 合를 히라가나 あい로 풀어 썼어요. '서로'라는 뜻의 合う는 이렇게 히라가나로 쓰는 일이 많아요.","n":"寄せる(가까이 대다) + 合う(서로 ~하다). 肩を寄せ合う(어깨를 맞대다)."}],"ko":"부드러운 살결을 맞대고","lit":"부드러운 / 살결 / 을 / 서로 맞대고","g":[{"k":"ます형 + 合う","d":"'서로 ~하다'. 寄せる → 寄せ合う(서로 맞대다), 話す → 話し合う(서로 이야기하다). 여기서는 ます형 寄せあい로 문장을 이어 가요."}],"s":"寄せ合い에서 合만 히라가나 あい로 썼어요. 한 단어 안에서 한자와 히라가나를 고르는 감각이 1절의 麦わら와 비슷해요.","c":"1절 후렴은 지난 여름의 추억이었는데, 2절 후렴은 지금 함께 걷는 장면이에요. 시간이 '그때'에서 '오늘'로 옮겨 와요."},{"id":"f2","tk":[{"t":"{少|すこ}し","p":"부사","m":"조금","w":"어간 少는 한자, し는 히라가나예요.","n":"1절의 ちょっと보다 조금 정돈된 말이에요."},{"t":"{冷|つめ}たい","p":"い형용사","m":"차가운","w":"어간 冷는 한자, たい는 히라가나예요.","n":"冷たい는 물건이나 바람이 차가울 때 써요. 날씨가 추울 때는 寒い(さむい)예요."},{"t":"{空気|くうき}","p":"명사","m":"공기","n":"한국어 '공기(空氣)'와 같은 한자어예요. 気는 氣의 일본식 약자예요."},{"t":"を"},{"t":"{2人|ふたり}"}],"ko":"조금 차가운 공기를 둘이서","lit":"조금 / 차가운 / 공기 / 를 / 둘","g":[{"k":"명사 + 수량","d":"空気を2人(で) = '공기를 둘이서'. 원래는 2人で(둘이서)인데 で가 빠졌어요. 가사에서는 이렇게 조사를 줄이는 일이 많아요."}],"s":"2人를 아라비아 숫자로 썼어요. 보통은 二人라고 쓰지만, 가사·SNS에서는 숫자를 섞어 가볍고 눈에 띄게 쓰기도 해요.","c":"'조금 차가운 공기'라서 한여름이 아니라 계절이 조금 지난 때로도 읽혀요. 여름의 추억이 지금으로 이어진 느낌이에요."},{"id":"f3","tk":[{"t":"かみしめて","p":"동사","m":"곱씹으며, 음미하며","b":"かみしめる","bm":"곱씹다, 깊이 음미하다","w":"한자로는 噛み締める인데, 噛(씹다)·締(조이다)가 어려워서 히라가나로 풀어 썼어요.","n":"원래는 이를 꽉 물다라는 뜻이고, 행복이나 기쁨을 천천히 느낀다는 뜻으로도 써요. 幸せをかみしめる(행복을 곱씹다)."},{"t":"{歩|ある}く","p":"동사","m":"걷는","w":"어간 歩는 한자, く는 히라가나예요.","n":"歩(ほ)는 한국어 '보(步)'의 일본식 자체예요. 散歩(さんぽ) = 산책."},{"t":"{今日|きょう}","p":"명사","m":"오늘","w":"今日는 글자마다 나누지 않고 전체를 きょう로 읽는 주쿠지쿤이에요.","n":"글자대로 읽으면 こんにち인데, こんにちは(안녕하세요)에 그 읽기가 남아 있어요."},{"t":"という","p":"조사(복합)","m":"~라는","n":"명사 + という + 명사 = '~라는 ~'. 今日という日(오늘이라는 날)."},{"t":"{日|ひ}","p":"명사","m":"날"},{"t":"に"}],"ko":"곱씹으며 걷는 오늘이라는 날에","lit":"곱씹으며 / 걷는 / 오늘 / 이라는 / 날 / 에","g":[{"k":"〜という","d":"'~라는'. 今日という日 = 오늘이라는 날. 평범한 '오늘'을 특별한 하루로 강조하는 말투예요."}],"s":"かみしめる를 히라가나로 풀어 써서 딱딱한 한자 噛·締가 사라지고 부드러워졌어요. 抱きしめる도 같은 방식이에요.","c":"차가운 공기를 '곱씹으며' 걷는다는 건 그 순간을 천천히 느낀다는 뜻으로 읽혀요. 그 하루가 특별해서 다음 줄에서 이름을 붙이려 해요."},{"id":"f4","tk":[{"t":"{何|なん}","p":"대명사","m":"무엇","n":"何은 뒤에 오는 소리에 따라 なに 또는 なん으로 읽어요. と 앞에서는 なん이에요."},{"t":"と"},{"t":"{名前|なまえ}","p":"명사","m":"이름","n":"名前をつける = 이름을 붙이다."},{"t":"を"},{"t":"つけよう","p":"동사","m":"붙일까","b":"つける","bm":"붙이다","w":"한자로 付ける라고도 쓰지만 히라가나로 쓰는 일이 많아요.","n":"つける → 의지형 つけよう(붙이자). 뒤에 か가 붙어 '붙일까?'가 됐어요."},{"t":"か","p":"조사","m":"~까"},{"t":"なんて","p":"조사","m":"~같은 (말)","n":"앞의 말을 가볍게 가리켜요. '어떤 이름을 붙일까, 같은 얘기'처럼 살짝 쑥스러운 느낌이 들어요."},{"t":"{話|はな}して","p":"동사","m":"이야기하며","b":"{話|はな}す","bm":"이야기하다","w":"어간 話는 한자, して는 히라가나예요.","n":"話(わ)는 한국어 '화(話)'와 같은 한자예요. 電話(でんわ) = 전화."}],"ko":"어떤 이름을 붙일까, 그런 얘기를 하면서","lit":"무엇 / 이라고 / 이름 / 을 / 붙이자 / 까 / 같은 / 이야기하며","g":[{"k":"의지형 + か","d":"'~할까?'. つける → つけよう → つけようか(붙일까?), 行こうか(갈까?)."},{"k":"〜なんて","d":"앞의 말을 가볍게 가리키는 말. 何と名前をつけようかなんて話して = 어떤 이름을 붙일까, 같은 얘기를 하며."}],"s":"つける는 付ける라는 한자가 있지만 히라가나로 썼어요. 일상에서 자주 쓰는 동사는 히라가나로 쓰는 일이 많아요.","c":"평범한 하루에 이름을 붙이자는 건 그만큼 오늘이 특별하다는 뜻이에요. 기념일을 만드는 연인들의 말장난처럼 들려요."},{"id":"f5","tk":[{"t":"ああ"},{"t":"アイラブユー","p":"표현","m":"아이 러브 유 (사랑해)","w":"영어 I love you를 일본식 발음으로 옮겨 가타카나로 썼어요. 알파벳이 아니라 가타카나라서 일본어 말투 속에 자연스럽게 녹아요.","n":"영어 L과 R, V는 일본어에서 ラ행·バ행으로 옮겨요. love → ラブ."},{"t":"の"},{"t":"{言葉|ことば}","p":"명사","m":"말","n":"言(말씀 언) + 葉(잎 엽). '말의 잎'이라는 재미있는 한자 조합이에요."},{"t":"じゃ","p":"조사","m":"~로는","n":"では(で + は)의 회화체예요. 言葉じゃ足りない = 말로는 부족해."}],"ko":"아아, '아이 러브 유'라는 말로는","lit":"아아 / 아이 러브 유 / 의 / 말 / 로는","g":[{"k":"〜じゃ (= では)","d":"で(~로) + は(~는) = では, 회화에서는 じゃ. 言葉じゃ = 말로는. 다음 줄 足りない와 이어져요."}],"s":"I love you를 알파벳이 아니라 가타카나 アイラブユー로 썼어요. 히게단 Pretender의 アイムソーリー(I'm sorry)와 같은 방식이에요.","c":"일본어에는 愛してる(사랑해)라는 말이 있지만, 여기서는 일부러 영어를 가타카나로 옮겼어요. 조금 쑥스러운 고백을 가볍게 만드는 느낌으로 읽혀요."},{"id":"f6","tk":[{"t":"{足|た}りない","p":"동사","m":"부족해","b":"{足|た}りる","bm":"충분하다","w":"어간 足는 한자, りない는 히라가나예요.","n":"足(발 족)를 '충분하다'는 뜻으로도 써요. 足りる는 1단 동사라 부정은 足りない예요."},{"t":"から"},{"t":"と","p":"조사","m":"~라며"},{"t":"キス","p":"명사","m":"키스","w":"영어 kiss에서 온 외래어라 가타카나로 써요."},{"t":"して","p":"동사","m":"하고","b":"する","bm":"하다","w":"する는 히라가나로 써요."}],"ko":"부족하다며 키스하고","lit":"부족하다 / 니까 / 라며 / 키스 / 하고","g":[{"k":"〜からと","d":"이유(から) + 인용(と) = '~니까, 라며'. 足りないからとキスして = 부족하니까 라며 키스해."},{"k":"외래어 + する","d":"キスする(키스하다)처럼 외래어 명사에 する를 붙이면 동사가 돼요. メールする(메일하다)."}],"s":"외래어 キス에 する를 붙여 동사로 썼어요. 가타카나 + 히라가나 조합이라 한 단어 안에서도 문자가 바뀌어요.","c":"말로는 마음을 다 전할 수 없어 행동으로 보여 줘요. 2절의 '진심을 다 털어놓을 만큼 강하지 않다'와 이어 읽으면, 말 대신 몸짓으로 전한다는 흐름이에요."},{"id":"f7","tk":[{"t":"{雲|くも}"},{"t":"が"},{"t":"まだ"},{"t":"{2人|ふたり}"},{"t":"の"},{"t":"{影|かげ}","p":"명사","m":"그림자","n":"한국어 '영(影)'과 같은 한자예요. 影は長い(그림자가 길다)."},{"t":"を"},{"t":"{残|のこ}す","p":"동사","m":"남겨 두다","w":"어간 残는 한자, す는 히라가나예요.","n":"残す(남기다, 타동사)와 残る(남다, 자동사)는 짝이에요."},{"t":"から"}],"ko":"구름이 아직 두 사람의 그림자를 남겨 두니까","lit":"구름 / 이 / 아직 / 둘 / 의 / 그림자 / 를 / 남기니까","g":[{"k":"〜から (이유)","d":"문장 끝 から = '~니까'. 다음 줄 '언제까지나 이대로'의 이유가 돼요."}],"s":"雲(구름)가 1절 후렴(雲のような優しさ)에 이어 다시 나와요. 1절에서는 다정함의 비유, 여기서는 두 사람 위에 떠 있는 실제 구름이에요.","c":"구름이 그림자를 남긴다는 건 햇빛 아래 둘이 함께 있다는 장면이에요. 구름이 아직 거기 있으니 이대로 있자는 말로 이어져요."},{"id":"f8","tk":[{"t":"いつまでも"},{"t":"いつまでも"},{"t":"このまま","p":"부사","m":"이대로","w":"この(이) + まま(그대로)가 굳은 말이라 히라가나로 써요.","n":"このままでいい(이대로 좋아)처럼 써요."}],"ko":"언제까지나, 언제까지나 이대로","lit":"언제까지나 / 언제까지나 / 이대로","g":[{"k":"いつ + まで + も","d":"いつ(언제) + まで(까지) + も(도) = '언제까지나'. 의문사 + も는 '~라도, ~나'가 돼요. どこでも(어디서나)."}],"s":"줄 전체가 히라가나예요. 한자가 하나도 없이 부드러운 소리만 남아, 조용히 바라는 느낌이 나요.","c":"1절 후렴의 '놓지 않아'가 2절에서는 '언제까지나 이대로'로 바뀌어요. 붙잡는 다짐이 머무르고 싶은 바람으로 변했어요."}]},{"label":"Cメロ · 브리지","note":"멀리 떨어져 있어도 이어져 있고 싶다고, 두 사람의 마음이 같기를 조용히 빌어요.","lines":[{"id":"g1","tk":[{"t":"{遥|はる}か","p":"부사","m":"아득히","b":"{遥|はる}か","w":"어간 遥는 한자, か는 히라가나예요. 遥는 2010년에 조요칸지에 들어간 글자예요.","n":"遥か遠く(아득히 멀리)처럼 '멀다'를 더 강조해요."},{"t":"{遠|とお}い","p":"い형용사","m":"먼","w":"어간 遠는 한자, い는 히라가나예요.","n":"とおい는 '토-이'처럼 길게 읽어요. お를 하나 더 쓰는 장음이에요."},{"t":"{場所|ばしょ}","p":"명사","m":"장소, 곳","n":"한국어 '장소(場所)'와 같은 한자인데 ばしょ라고 읽어요."},{"t":"に"},{"t":"いても","p":"동사","m":"있어도","b":"いる","bm":"있다","w":"사람·동물이 '있다'는 いる는 보통 히라가나로 써요(居る)."}],"ko":"아득히 먼 곳에 있다 해도","lit":"아득히 / 먼 / 곳 / 에 / 있어도","g":[{"k":"〜ても","d":"동사 て형 + も = '~해도'. いる → いても(있어도), 雨が降っても(비가 와도)."}],"s":"遥는 2010년에야 조요칸지에 들어온 글자라 예전 글에서는 はるか로 풀어 쓰기도 했어요. 지금은 가사와 이름에 자주 써요.","c":"후렴까지 '이대로', '놓지 않아'라고 했지만, 브리지에서는 언젠가 떨어질 수도 있다는 생각이 처음 나와요."},{"id":"g2","tk":[{"t":"{繋|つな}がっていたい","p":"동사","m":"이어져 있고 싶은","b":"{繋|つな}がる","bm":"이어지다, 연결되다","w":"繋는 조요칸지 밖의 글자라 공문서나 신문에서는 つながる로 써요. 가사에서는 '끈으로 묶어 잇는' 뜻을 살리려고 한자를 골라 쓰기도 해요.","n":"繋がる(이어지다, 자동사)와 繋ぐ(잇다, 타동사)는 짝이에요. 히게단 곡에도 繋가 나왔어요."},{"t":"なあ","p":"조사(종조사)","m":"~네, ~면 좋겠다","n":"문장 끝 なあ는 혼잣말처럼 바람이나 감탄을 담아요. な를 길게 늘인 말투예요."}],"ko":"이어져 있고 싶어","lit":"이어져 있고 싶다 / 네","g":[{"k":"〜ていたい","d":"〜ている(~해 있다) + たい(~하고 싶다) = '~해 있고 싶다'. 繋がっていたい = 이어져 있고 싶다."}],"s":"繋는 조요칸지 밖의 글자예요. 일부러 이 한자를 골라 '끈으로 이어진' 그림을 남겼다고 볼 수 있어요.","c":"멀리 있어도 끊어지지 않고 싶다는 바람이에요. 끝의 なあ가 혼잣말처럼 들려 다짐보다는 소원에 가까워요."},{"id":"g3","tk":[{"t":"{2人|ふたり}"},{"t":"の"},{"t":"{想|おも}い","p":"명사","m":"마음, 생각","b":"{想|おも}い","w":"보통 思い로 쓰는데, 그리워하고 마음에 품는 느낌을 살리려고 想를 골랐어요. 想를 おもい로 읽는 건 조요칸지 표에 없는 읽기예요.","n":"思い는 '생각'이 넓게, 想い는 '누군가를 향한 마음'이 강하게 느껴져요. 히게단 곡에도 想い가 나왔어요."},{"t":"が"}],"ko":"두 사람의 마음이","lit":"둘 / 의 / 마음 / 이","g":[{"k":"〜の〜が","d":"2人の想いが = 두 사람의 마음이. 다음 줄 同じでありますように와 이어져요."}],"s":"思い 대신 想い를 쓴 표기는 노래 가사에서 아주 흔해요. 같은 おもい라도 한자를 바꿔 사랑의 느낌을 더해요.","c":"'나의 마음'이 아니라 '두 사람의 마음'이에요. 혼자 다짐하던 화자가 처음으로 둘을 함께 바라봐요."},{"id":"g4","tk":[{"t":"{同|おな}じ","p":"な형용사","m":"같음","b":"{同|おな}じ","bm":"같다","w":"어간 同은 한자, じ는 히라가나예요.","n":"同じ는 명사를 꾸밀 때 な 없이 바로 붙어요(同じ日, 같은 날). 조금 특이한 な형용사예요."},{"t":"であります","p":"조동사","m":"~입니다, ~이기를","n":"だ(~이다)의 아주 정중한 말투 であります예요. 뒤에 ように가 붙어 소원을 비는 말이 돼요."},{"t":"ように","p":"조동사","m":"~하기를","n":"〜ますように = '~하기를'. 소원을 빌 때 쓰는 말이에요."}],"ko":"같을 수 있기를","lit":"같음 / 입니다 / 하기를","g":[{"k":"〜ますように","d":"'~하기를'. 소원을 빌 때 써요. 合格できますように(합격할 수 있기를), 晴れますように(맑기를)."}],"s":"であります처럼 아주 정중한 말투를 쓴 건 기도하는 말투라서예요. 소원을 빌 때는 신에게 말하듯 정중하게 말해요.","c":"신사에서 소원을 적는 나무판(絵馬)이나 칠석 소원 종이에 쓰는 말투예요. 브리지가 조용한 기도처럼 끝나요."}]},{"label":"ラストサビ · 마지막 후렴","note":"첫 후렴을 다시 부르고, 두 번째 후렴의 '아이 러브 유'로 이어 붙여 끝을 향해 가요.","lines":[{"same":"c1"},{"same":"c2"},{"same":"c3"},{"same":"c4"},{"same":"c5"},{"same":"c6"},{"same":"c7"},{"id":"h1","tk":[{"t":"{抱|だ}きしめて"},{"t":"{離|はな}さない"}],"ko":"끌어안고 놓지 않아","lit":"끌어안고 / 놓지 않아","g":[{"k":"〜て + 동사","d":"抱きしめて離さない = 안고 (그대로) 놓지 않는다. て형이 두 동작을 이어 줘요."}],"s":"첫 후렴은 抱きしめて를 두 번 불렀는데, 마지막 후렴은 한 번만 불러요. 반복을 줄여 말이 짧고 단단해졌어요.","c":"같은 후렴이지만 끝줄만 달라요. 몇 번이고 안던 마음이 이제는 한 번 안고 그대로 놓지 않는 다짐으로 들려요."},{"same":"f5"},{"same":"f6"},{"same":"f7"},{"same":"f8"}]},{"label":"アウトロ · 마무리","note":"'놓지 않아'를 되풀이하며 곡을 닫아요.","lines":[{"id":"i1","tk":[{"t":"{離|はな}さない"}],"ko":"놓지 않아","lit":"놓지 않아","g":[{"k":"〜ない (부정)","d":"離す(놓다) → 離さない(놓지 않다). 1절 후렴부터 되풀이된 말이에요."}],"s":"한 단어짜리 줄이에요. 離는 한국어 '이(離)'와 같은 한자예요(이별 = 離別).","c":"노래 전체에서 가장 많이 반복되는 말이 마지막에 혼자 남아요."},{"id":"i2","tk":[{"t":"いつまでも"},{"t":"いつまでも"},{"t":"{離|はな}さない"}],"ko":"언제까지나, 언제까지나 놓지 않아","lit":"언제까지나 / 언제까지나 / 놓지 않아","g":[{"k":"いつまでも〜ない","d":"'언제까지나 ~하지 않는다'. 2절의 いつまでもこのまま(언제까지나 이대로)와 1절의 離さない를 하나로 합친 줄이에요."}],"s":"いつまでも(히라가나)와 離さない(한자 + 히라가나)가 이어져요. 끝까지 부드러운 히라가나가 많은 곡이에요.","c":"1절의 '놓지 않아'와 2절의 '언제까지나 이대로'가 마지막 한 줄에서 만나요. 추억을 그리워하던 노래가 지금의 사랑을 지키겠다는 말로 끝나요."}]}]},"pretender":{"id":"pretender","title":"Pretender","artist":"Official髭男dism","year":2019,"eyebrow":"Official髭男dism · 2019","sub":"이어질 수 없는 사랑을 알면서도 곁에 남아 '괜찮은 척'하는 사람의 노래. 영화 「コンフィデンスマンJP ロマンス編」 주제가.","release":"2019년 5월 15일","tieIn":"영화 「コンフィデンスマンJP ロマンス編」(2019) 주제가","lyricist":"藤原聡","composer":"藤原聡","listen":"https://www.youtube.com/results?search_query=Official%E9%AB%AD%E7%94%B7dism+Pretender","intro":"Pretender는 히게단이 2019년에 발표한 곡으로, 밴드를 일본 전국구 밴드로 만든 대표곡이에요. 그해 연말에는 이 곡으로 NHK 「紅白歌合戦」(홍백가합전) 무대에 처음 섰어요.\n\n제목 Pretender는 '~인 척하는 사람'이라는 뜻이에요. 상대의 '운명의 사람'은 자신이 아니라는 걸 알면서도 곁을 떠나지 못하고, 아무렇지 않은 척, 연인인 척하는 화자의 이야기예요. 가사 곳곳에 연극과 이야기에 관한 말이 숨어 있으니, 그 비유를 따라가며 읽어 보세요.","notes":[{"tag":"배경","title":"사기꾼 영화의 주제가","body":"「コンフィデンスマンJP」는 '컨피던스맨(confidence man, 사기꾼)'들이 화려한 속임수로 악당을 골탕 먹이는 후지TV 드라마예요. 그 극장판이 「ロマンス編」(로맨스 편)이고, Pretender는 이 영화의 주제가예요. 속이고 속는 이야기에 'Pretender(~인 척하는 사람)'라는 제목이 겹치고, 가사의 ロマンス라는 단어도 영화 부제와 이어져요.\n\n드라마판 주제가 「ノーダウト」도 히게단의 메이저 데뷔곡이라, 이 시리즈와 밴드의 인연이 각별해요."},{"tag":"표현","title":"연극으로 그린 사랑","body":"가사에는 무대와 이야기에 관한 말이 계속 나와요. [[ラブストーリー]](러브스토리), [[ひとり{芝居|しばい}]](1인극), [[{観客|かんきゃく}]](관객), [[{設定|せってい}]](설정), [[{世界線|せかいせん}]](세계선), [[ロマンス]](로맨스), [[エンドライン]](끝선).\n\n화자는 자기 사랑을 한 편의 작품처럼 바라봐요. 그 안에서 주인공이 아니라 혼자 연기하는 배우이자 객석의 관객이죠. 제목 Pretender가 바로 그 '연기하는 사람'이에요."},{"tag":"표기","title":"이 곡의 가타카나 읽는 법","body":"가타카나는 크게 두 갈래로 쓰였어요.\n\n**외래어**: ラブストーリー, アイムソーリー, ロマンス, グッバイ, エンドライン. 영어를 알파벳 대신 가타카나로 옮겨서 일본어 발음으로 부르는 말이 돼요.\n\n**일부러 바꾼 표기**: [[{運命|うんめい}のヒト]], [[ピンとこなくて]]. 평소 한자나 히라가나로 쓰는 말을 가타카나로 바꿔 거리감이나 소리의 생생함을 줘요. 특히 ヒト는 '운명의 사람'이라는 말을 남의 말처럼 따옴표 친 듯 보이게 해요.\n\n반대로 알파벳으로 쓴 영어는 Cry 하나뿐이에요."},{"tag":"표기","title":"조요칸지 밖의 한자: 綺麗·繋","body":"綺麗의 綺와 繋いだ의 繋는 일본의 조요칸지(常用漢字)에 없는 글자예요. 신문이나 공문서라면 きれい, つないだ처럼 히라가나로 썼을 말이죠. 가사에서는 이런 한자를 일부러 써서 화려함과 무게를 더해요.\n\n繋 아랫부분에는 실 사(糸)가 들어 있어요. 아래 '운명의 붉은 실' 이야기와 함께 읽으면 더 와닿아요."},{"tag":"문화","title":"運命の人와 붉은 실","body":"일본에서는 맺어질 운명의 상대를 [[{運命|うんめい}の{人|ひと}]](운명의 사람)라고 부르고, 두 사람의 새끼손가락이 보이지 않는 [[{運命|うんめい}の{赤|あか}い{糸|いと}]](운명의 붉은 실)로 이어져 있다고 말해요. 중국 고사에서 온 이야기가 일본에서는 새끼손가락에 묶인 실로 퍼졌어요.\n\n그래서 君の運命のヒトは僕じゃない는 '네 붉은 실의 끝에 나는 없다'는 말로 들려요."},{"tag":"문화","title":"世界線이라는 말","body":"世界線은 원래 상대성 이론의 물리 용어(world line)예요. 일본에서는 2009년 게임 「シュタインズ・ゲート」에서 '선택에 따라 갈라지는 평행 세계'라는 뜻으로 쓰인 뒤 인터넷 유행어가 됐어요.\n\n[[{別|べつ}の{世界線|せかいせん}では]](다른 세계선에서는)처럼 '그때 다르게 했다면'을 말할 때 가볍게 써요. 애니·게임 문화에서 나와 일상어가 된 말이라, 이 곡을 듣는 일본 젊은 세대에게는 아주 익숙한 표현이에요."},{"tag":"구성","title":"Aメロ·Bメロ·サビ","body":"일본에서는 노래 구성을 verse·chorus 대신 [[Aメロ]], [[Bメロ]], [[サビ]]라고 불러요. Aメロ는 1절 도입, Bメロ는 후렴으로 끌어올리는 부분, サビ는 후렴이에요. メロ는 멜로디(メロディー)의 줄임말이고, 마지막 후렴은 ラストサビ나 大サビ라고 부르기도 해요.\n\nPretender는 Aメロ → Bメロ → サビ를 두 번 되풀이한 뒤, 마지막 후렴과 짧은 마무리로 끝나요."}],"dict":{"{君|きみ}":{"p":"대명사","m":"너","w":"'너'를 뜻하는 대명사로, 한자로 쓰는 게 일반적이에요. 가사에 따라 きみ로 풀어 쓰기도 해요.","n":"원래 '임금·주군'을 뜻하던 한자예요(君主 = 군주). 지금은 친한 사이나 손아랫사람을 부르는 '너'예요. 이 곡의 화자는 끝까지 상대를 이름 대신 君라고만 불러요."},"{僕|ぼく}":{"p":"대명사","m":"나 (남성)","w":"1인칭 대명사로 한자로 쓰는 게 일반적이에요.","n":"僕는 부드럽고 소년 같은 느낌의 남성 1인칭이에요. 俺(おれ)보다 순하고 私(わたし)보다 친근해요. 원래 '하인·종'을 뜻하던 한자로, 자신을 낮추는 말에서 출발했어요."},"は":{"p":"조사","m":"~은/는 (주제)","n":"조사로 쓸 때는 ha가 아니라 wa로 읽어요. 옛 표기법이 조사에만 남은 흔적이에요."},"の":{"p":"조사","m":"~의"},"と":{"p":"조사","m":"~와/과"},"を":{"p":"조사","m":"~을/를","n":"현대 일본어에서 を는 이 조사에만 쓰는 글자예요. 발음은 お(o)와 같아요."},"が":{"p":"조사","m":"~이/가"},"に":{"p":"조사","m":"~에"},"で":{"p":"조사","m":"~으로"},"も":{"p":"조사","m":"~도"},"から":{"p":"조사","m":"~니까 / ~에서"},"だ":{"p":"조동사","m":"~이다","n":"명사·な형용사 뒤에 붙는 단정의 말이에요. 정중하게는 です."},"な":{"p":"조사(종조사)","m":"~네, ~겠다 (혼잣말)","n":"문장 끝 な는 혼잣말처럼 감탄하거나 바람을 말할 때 붙어요."},"けど":{"p":"조사","m":"~지만","n":"けれど·けれども의 줄임말로 회화에서 많이 써요. 곡의 마지막에는 정돈된 형태인 けれど가 나와요."},"でも":{"p":"접속사","m":"하지만, 그래도","w":"접속사라 히라가나로 써요."},"のさ":{"p":"조사(종조사)","m":"~란 말이야, ~인걸","n":"설명의 の + 가벼운 종조사 さ. 감정을 덤덤하게 털어놓는 말투로, 주로 남성적이고 담백한 말씨에서 써요."},"よな":{"p":"조사(종조사)","m":"~겠지, ~잖아","n":"よ(알림) + な(혼잣말). 스스로에게 '그렇잖아' 하고 수긍하는 말투예요."},"そう":{"p":"부사","m":"그렇게","w":"こう(이렇게)·そう(그렇게)·ああ(저렇게) 같은 지시어는 히라가나로 써요."},"もっと":{"p":"부사","m":"더, 좀 더","w":"부사라 히라가나로 써요."},"それ":{"p":"대명사","m":"그것","w":"これ(이것)·それ(그것)·あれ(저것) 같은 지시어는 히라가나로 써요.","n":"こ·そ·あ·ど 체계: これ(이것) / それ(그것) / あれ(저것) / どれ(어느 것). 한국어 이·그·저·어느와 거의 그대로 대응해요."},"その":{"p":"연체사","m":"그 (~)","w":"この(이)·その(그)·あの(저)는 지시어라 히라가나로 써요."},"いい":{"p":"い형용사","m":"좋다","b":"いい","w":"良い로도 쓰지만 회화체 いい는 보통 히라가나로 써요.","n":"いい는 원래 よい에서 온 말이라 활용할 때는 よ-로 돌아가요. いい → よかった(좋았다), よくない(좋지 않다)."},"ひとつ":{"p":"명사(수)","m":"하나","b":"{一|ひと}つ","bm":"하나","w":"一つ라고 쓸 수 있지만 히라가나로 풀어 썼어요. 2행의 ひとり처럼, 숫자보다 부드럽고 무게 있는 '하나'로 읽히게 하는 가사다운 표기예요."},"{違|ちが}う":{"p":"동사","m":"다른 (다르다)","w":"어간 違는 한자, 활용 어미 う는 히라가나예요.","n":"違う는 동사지만 명사 앞에서 '다른'이라는 형용사처럼 쓰여요. 회화에서 '아니야!'를 違う!라고도 해요."},"{願|ねが}っても":{"p":"동사","m":"바라도","b":"{願|ねが}う","bm":"바라다, 빌다","w":"어간 願는 한자, 활용 어미 っても는 히라가나예요.","n":"願う는 '간절히 바라다, 기원하다'. お願い(부탁)도 같은 말에서 왔어요."},"{向|む}こう":{"p":"명사","m":"너머, 건너편","w":"명사인데도 한자 向 뒤에 こう가 붙어 있어요. 동사 向かう(향하다)에서 온 말이라, 동사처럼 오쿠리가나를 붙여 쓰는 표기가 굳어졌어요."},"ロマンス":{"p":"명사","m":"로맨스","w":"영어 romance를 옮긴 외래어라 가타카나로 써요."},"{何|なに}":{"p":"대명사","m":"무엇","n":"何는 뒤에 오는 소리에 따라 なに/なん으로 읽어요. 何？처럼 문장 끝이나 何ひとつ 앞에서는 なに."},"{綺麗|きれい}":{"p":"な형용사","m":"예쁘다, 아름답다","w":"綺는 조요칸지에 없는 글자라 신문·교과서에서는 きれい로 히라가나로 써요. 가사에서는 일부러 한자 綺麗를 써서 더 화려하고 문학적인 느낌을 냈어요.","n":"きれい에는 '예쁘다'와 '깨끗하다' 두 뜻이 있어요. 美しい(うつくしい)가 감탄이 담긴 글말의 '아름답다'라면, きれい는 일상에서 가장 많이 쓰는 '예쁘다'예요."},"{通|どお}り":{"p":"접미사","m":"~대로","b":"{通|とお}り","bm":"길, ~대로","w":"通(통하다)는 한자, り는 오쿠리가나예요. 동사 通る(지나가다)에서 나온 말이라 한자 뒤에 り가 붙어요.","n":"원래 읽기는 とおり인데 명사 뒤에 붙으면 どおり로 탁해져요. 두 말이 합쳐질 때 뒷말 첫소리가 다쿠온이 되는 현상을 렌다쿠(連濁, れんだく)라고 해요."},"グッバイ":{"p":"감동사(외래어)","m":"굿바이, 안녕","w":"영어 goodbye를 일본식 발음으로 옮긴 외래어라 가타카나예요. 알파벳 Goodbye로 쓰지 않아서, 영어 인사라기보다 일본어 노래 안에 녹아든 '굿바이'로 들려요.","n":"グッ의 작은 ッ는 소쿠온이라 '굿'처럼 한 박자 끊어요. 일상 작별 인사로는 じゃあね, またね를 더 많이 쓰고, グッバイ는 노래나 드라마에서 쓰는 극적인 말이에요."}},"sections":[{"label":"1절 · Aメロ","note":"일본에서는 노래의 1절 도입부를 Aメロ라고 불러요(メロ = メロディー, 멜로디). 사랑을 '러브스토리', '1인극'처럼 작품에 빗대며 시작해요.","lines":[{"id":"a1","tk":[{"t":"{君|きみ}"},{"t":"と","m":"~와 (함께)","n":"君と = 너와. と는 '함께하는 상대'를 나타내요."},{"t":"の","n":"と(~와) + の(~의)가 겹쳐 '~와의'. 한국어 '너와의'와 똑같은 구조예요."},{"t":"ラブ","p":"명사","m":"러브, 사랑","w":"영어 love를 일본식 발음으로 옮긴 외래어라 가타카나예요. 일본어에는 v 소리가 없어서 ブ(bu)가 됐어요."},{"t":"ストーリー","p":"명사","m":"스토리, 이야기","w":"영어 story를 옮긴 외래어라 가타카나예요. 장음 ー가 두 번 들어가 '스토-리-'처럼 길게 읽어요.","n":"ラブストーリー(러브스토리)는 드라마·영화 장르 이름처럼 들리는 말이에요. 첫 줄부터 사랑을 '작품'처럼 바라보는 시선이 시작돼요."},{"t":"　"},{"t":"それ"},{"t":"は"},{"t":"{予想|よそう}","p":"명사","m":"예상","n":"한국어 '예상(豫想)'과 같은 한자어예요. 予는 豫의 일본식 약자예요."},{"t":"{通|どお}り"}],"ko":"너와의 러브 스토리, 그건 예상했던 그대로야","lit":"너 / 와 / 의 / 러브 / 스토리 / 그것 / 은 / 예상 / 대로","g":[{"k":"〜との","d":"と(~와) + の(~의) = '~와의'. 君とのラブストーリー = 너와의 러브스토리."},{"k":"〜{通|どお}り","d":"명사 + 通り = '~대로'. 予想通り(예상대로), いつも通り(평소대로), 約束通り(약속대로)."}],"s":"첫 줄에 일본어 표기의 세 가지 역할이 다 들어 있어요. 외래어 ラブ·ストーリー는 가타카나, 뜻을 담은 君·予想·通는 한자, 조사 と·の·は와 지시어 それ는 히라가나예요.","c":"화자는 이 사랑이 어떻게 끝날지 이미 알고 있어요. 첫 줄부터 사랑을 '스토리'라고 부르며, 결말을 아는 영화를 보듯 한 발짝 물러나 있죠. 이 '연극·작품' 비유가 곡 전체로 이어져요."},{"id":"a2","tk":[{"t":"いざ","p":"부사","m":"막상, 정작","w":"한자로 쓰는 일이 거의 없는 부사라 히라가나로 써요.","n":"いざとなると(막상 닥치면), いざという時(만일의 경우)처럼 자주 써요."},{"t":"{始|はじ}まれば","p":"동사","m":"시작되면","b":"{始|はじ}まる","bm":"시작되다","w":"어간 始는 한자, 활용 어미 まれ와 가정의 ば는 히라가나예요.","n":"始まる(자동사: 시작되다)와 始める(타동사: 시작하다)는 짝이에요. 여기서는 사랑이 '저절로 시작되는' 자동사를 썼어요."},{"t":"ひとり","p":"명사","m":"혼자, 한 사람","b":"{一人|ひとり}","bm":"혼자","w":"一人라고 쓸 수 있지만 히라가나로 풀어 썼어요. 숫자 느낌을 지우고 '혼자'라는 외로운 뉘앙스를 부드럽게 살리는 표기예요."},{"t":"{芝居|しばい}","p":"명사","m":"연극","w":"뜻을 담은 명사라 한자로 써요.","n":"芝居는 글자 그대로 '잔디(芝)에 앉음(居)'이에요. 옛날 절이나 신사 마당의 공연을 관객이 잔디에 앉아 봤던 데서, '관람석 → 공연 → 연극'으로 뜻이 넓어졌어요. ひとり芝居 = 1인극."},{"t":"だ"}],"ko":"막상 시작되고 나면 혼자 하는 연극이야","lit":"막상 / 시작되면 / 혼자 / 연극 / 이다","g":[{"k":"いざ〜ば","d":"'막상 ~하면'. いざ가 '정작 그때가 되면'이라는 느낌을 더해요."},{"k":"〜ば (가정형)","d":"동사 끝 う단을 え단으로 바꾸고 ば를 붙이면 '~하면'. 始まる(hajimaru) → 始まれば(hajimareba)."}],"s":"一人 대신 ひとり로 쓴 것에 주목해 보세요. 가사에서는 숫자 한자를 히라가나로 풀어 감정을 부드럽게 만드는 일이 많아요. 후렴의 たったひとつ도 같은 방식이에요.","c":"ひとり芝居(1인극)는 상대 없이 혼자 연기하는 무대예요. 둘의 사랑인 줄 알았는데 막상 시작해 보니 자기 혼자 감정을 연기하고 있었다는 고백이죠. 제목 Pretender(~인 척하는 사람)와 바로 이어지는 표현이에요."},{"id":"a3","tk":[{"t":"ずっと","p":"부사","m":"계속, 줄곧","w":"부사라 히라가나로 써요. 작은 っ(소쿠온)가 들어 있어 '즛토'처럼 한 박자 끊어 읽어요."},{"t":"そば","p":"명사","m":"곁, 옆","w":"한자 側·傍로도 쓰지만 가사나 일상 글에서는 히라가나 そば를 많이 써요.","n":"そばにいる = 곁에 있다. 같은 소리의 そば(蕎麦)는 메밀국수예요. 한자를 쓰지 않으면 문맥으로 구별해요."},{"t":"に"},{"t":"いたって","p":"동사","m":"있었다 해도","b":"いる","bm":"있다 (사람·동물)","w":"いる(있다)는 보통 히라가나로 써요. 한자 居る도 있지만 일상 표기에서는 거의 쓰지 않아요.","n":"いたって는 いても(있어도)의 구어체예요. 2절의 いたって(至って, 지극히)와 소리는 같지만 전혀 다른 말이에요."},{"t":"　"},{"t":"{結局|けっきょく}","p":"부사","m":"결국","w":"한자어라 한자로 써요.","n":"한국어 '결국(結局)'과 같은 한자예요. 원래 바둑에서 한 판(局)을 끝맺는(結) 것을 뜻하던 말이에요."},{"t":"ただ","p":"부사","m":"그저, 단지","w":"'그저·단지'라는 뜻일 때는 히라가나로 써요.","n":"ただの + 명사 = '그저 ~일 뿐인'. 참고로 '공짜'라는 뜻의 ただ는 タダ처럼 가타카나로 쓰는 경우가 많아요. 같은 말도 문자를 바꾸면 다르게 읽혀요."},{"t":"の","m":"~인 (ただの = 그저 ~인)"},{"t":"{観客|かんきゃく}","p":"명사","m":"관객","n":"한국어 '관객(觀客)'과 같은 한자어예요. 観은 觀의 일본식 약자예요."},{"t":"だ"}],"ko":"줄곧 곁에 있었다 해도 결국 그저 관객일 뿐이야","lit":"계속 / 곁 / 에 / 있었다 해도 / 결국 / 그저 / 인 / 관객 / 이다","g":[{"k":"〜たって","d":"〜ても(~해도)의 구어체. いても → いたって(있어도, 있었다 해도). 말하듯 툭 던지는 느낌이에요."},{"k":"ただの〜","d":"'그저 ~일 뿐인'. ただの観客 = 그냥 관객."}],"s":"부사·명사 ずっと·そば·ただ는 히라가나, 한자어 結局·観客는 한자로 깔끔하게 나뉘어요. 결국·관객은 한국어와 같은 한자어라 한자를 알면 뜻이 바로 보여요.","c":"앞 줄의 ひとり芝居(1인극)에 이어 이번엔 観客(관객). 화자는 무대 위 배우이면서 객석의 관객이기도 해요. 아무리 가까이 있어도 상대의 '진짜 이야기' 안에는 들어가지 못한다는 거리감을 연극 비유로 그려요."},{"id":"a4","tk":[{"t":"{感情|かんじょう}","p":"명사","m":"감정","n":"한국어 '감정(感情)'과 같은 한자어예요. じょう처럼 う로 끝나는 온요미는 '죠-'처럼 길게 읽어요."},{"t":"の","m":"~이 (꾸미는 말 속 주어)","n":"感情がない → 感情のない. 뒤의 명사를 꾸미는 말 안에서는 주어의 が를 の로 바꿀 수 있어요."},{"t":"ない","p":"い형용사","m":"없다","w":"'없다'는 보통 히라가나로 써요. 한자 無い도 있지만 일상 표기에서는 잘 쓰지 않아요."},{"t":"アイムソーリー","p":"표현(외래어)","m":"아임 쏘리, 미안해","w":"영어 I'm sorry를 알파벳이 아니라 가타카나로 썼어요. 영어 발음 그대로가 아니라 일본식 발음으로 납작하게 말하는 '형식적인 사과'의 느낌이 나요. 감정 없는 사과라는 앞말과 잘 어울리는 표기예요."},{"t":"　"},{"t":"それ"},{"t":"は"},{"t":"いつも","p":"부사","m":"늘, 언제나","w":"부사라 히라가나로 써요."},{"t":"{通|どお}り"}],"ko":"감정 없는 '아임 쏘리', 그건 늘 그렇듯이","lit":"감정 / 이 / 없는 / 아임 쏘리 / 그것 / 은 / 늘 / 대로","g":[{"k":"〜のない + 명사","d":"'~이 없는 (명사)'. 명사를 꾸미는 말 안에서는 が 대신 の를 쓸 수 있어요. 感情のないアイムソーリー = 감정 없는 사과."}],"s":"1행과 짝을 이루는 줄이에요. 君との / 感情のない, ラブストーリー / アイムソーリー, 予想通り / いつも通り가 구조와 리듬을 맞추고 있어요. ストーリー와 ソーリー는 끝소리까지 같아서 운을 맞춘 것처럼 들려요.","c":"한국어로 '미안해'라고 옮기면 진심이 담긴 것처럼 들려서, 해석에서는 일부러 '아임 쏘리'라고 소리 그대로 두었어요. 습관처럼 내뱉는 빈 사과의 느낌이에요."},{"id":"a5","tk":[{"t":"{慣|な}れて","p":"동사","m":"익숙해져","b":"{慣|な}れる","bm":"익숙해지다","w":"어간 慣는 한자, 활용 어미 れて는 히라가나예요."},{"t":"しまえば","p":"보조동사","m":"~해 버리면","b":"しまう","bm":"(완전히) ~해 버리다","w":"보조동사로 쓰일 때는 히라가나로 써요. 원래 동사 仕舞う(끝내다·치우다)에서 왔지만, 문법 기능을 할 때는 한자를 쓰지 않는 게 표기 원칙이에요."},{"t":"{悪|わる}く","p":"い형용사","m":"나쁘게, 나쁘지","b":"{悪|わる}い","bm":"나쁘다","w":"어간 悪는 한자, 활용 어미 く는 히라가나예요. 悪い → 悪く."},{"t":"は","m":"~는 (대비·완곡)","n":"悪くない(나쁘지 않아) 사이에 は를 넣으면 '나쁘지는 않아'처럼 한 발 물러선 말투가 돼요."},{"t":"ない","p":"조동사","m":"~지 않다","n":"엄밀히는 형용사 뒤의 ない는 보조형용사지만, '~하지 않다'를 만드는 문법 요소로 기억하면 충분해요."},{"t":"けど"}],"ko":"익숙해지고 나면 나쁘지는 않지만","lit":"익숙해져 / 버리면 / 나쁘게 / 는 / 않다 / 지만","g":[{"k":"〜てしまう","d":"'~해 버리다'. 완전히 그렇게 됐거나, 원치 않았는데 그렇게 됐다는 아쉬움을 더해요. 慣れてしまう = 익숙해져 버리다."},{"k":"〜くはない","d":"い형용사 + く + は + ない = '~하지는 않다'. 悪くはない = 나쁘지는 않다."}],"s":"慣れる·悪い처럼 활용하는 말은 한자 + 히라가나, しまう 같은 보조동사와 は·けど는 히라가나예요. 보조동사는 원래 한자가 있어도 히라가나로 쓰는 게 일본어 표기 원칙이에요.","c":"'익숙해지면 나쁘지 않다'는 말 끝을 けど(~지만)로 흐려서, 사실은 괜찮지 않다는 속마음을 남겨 둬요. 일본어는 이렇게 문장 끝을 열어 두고 듣는 사람이 뒤를 짐작하게 하는 말투가 흔해요."},{"id":"a6","tk":[{"t":"{君|きみ}"},{"t":"と"},{"t":"の"},{"t":"ロマンス","n":"1행의 ラブストーリー에 이어 또 '작품' 같은 외래어예요. 영화 부제(ロマンス編)와도 겹치는 단어예요."},{"t":"は"},{"t":"{人生|じんせい}","p":"명사","m":"인생","n":"한국어 '인생(人生)'과 같은 한자어예요."},{"t":"{柄|がら}","p":"접미사","m":"~의 성격상, ~인 탓에","w":"명사 뒤에 붙어 '~의 성질상'이라는 뜻을 더하는 접미사예요. 뜻이 분명해서 한자로 써요.","n":"職業柄(직업 특성상), 土地柄(그 지역 특성상)처럼 써요. 人生柄는 사전에 실린 말이 아니라 작사가가 만든 표현으로 보여요. '내 인생이 원래 그런 식이라'는 체념이 담겨 있어요."},{"t":"　"},{"t":"{続|つづ}き","p":"동사","m":"이어지기","b":"{続|つづ}く","bm":"이어지다, 계속되다","w":"어간 続는 한자, 활용 어미 き는 히라가나예요.","n":"続きはしない는 続かない(이어지지 않는다)를 강조한 말투예요. 続き는 명사로 '다음 편'이라는 뜻도 있어서, 이 사랑 이야기에 '속편은 없다'는 느낌도 함께 떠올라요."},{"t":"は","m":"~는 (강조)"},{"t":"しない","p":"동사","m":"하지 않는다","b":"する","bm":"하다","w":"する(하다)는 문법 기능이 큰 기본 동사라 히라가나로 써요."},{"t":"こと","p":"형식명사","m":"~것","w":"'~하는 것'처럼 문장을 명사로 만드는 형식명사는 히라가나로 써요. '일·사건'이라는 실제 뜻일 때는 事로 쓰기도 해요."},{"t":"を"},{"t":"{知|し}った","p":"동사","m":"알았다","b":"{知|し
