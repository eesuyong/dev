}る","bm":"알다","w":"어간 知는 한자, 활용 어미 った는 히라가나예요. 知る → 知った.","n":"知る는 몰랐던 사실을 '알게 되다', 分かる는 '이해하다'에 가까워요. 후렴의 分からない(모르겠다)와 비교해 보세요."}],"ko":"너와의 로맨스는 내 인생이 원래 그렇듯 이어지지 않는다는 걸 알았어","lit":"너 / 와의 / 로맨스 / 는 / 인생 / 성격상 / 이어지기 / 는 / 하지 않는다 / 것 / 을 / 알았다","g":[{"k":"〜{柄|がら}","d":"명사 + 柄 = '~의 성격상, ~인 만큼'. 職業柄(직업 특성상), 場所柄(장소가 장소인 만큼)."},{"k":"〜はしない","d":"동사 ます형 + は + しない = '~하지는 않는다'. 続かない보다 단호하게 못 박는 부정이에요."},{"k":"〜ことを{知|し}る","d":"문장 + こと = '~라는 것'. 〜ことを知った = ~라는 걸 알았다."}],"s":"ロマンス는 외래어라 가타카나, 人生·柄·続·知는 뜻이 담긴 한자, は·しない·こと·を는 문법 요소라 히라가나예요.","c":"人生柄는 '직업 특성상(職業柄)' 같은 말투를 인생에 갖다 붙인 표현이에요. 사랑이 이어지지 않는 걸 상대 탓이 아니라 '내 인생이 원래 그런 식'이라고 체념하는 말이라, 한국어의 '팔자'와 비슷한 느낌으로 읽어도 좋아요."}]},{"label":"1절 · Bメロ","note":"Bメロ는 후렴(サビ)으로 넘어가기 전 감정을 끌어올리는 부분이에요. もっと違う〜で가 네 번 되풀이되며 '다른 세계였다면' 하는 가정을 쌓아요.","lines":[{"id":"b1","tk":[{"t":"もっと"},{"t":"{違|ちが}う"},{"t":"{設定|せってい}","p":"명사","m":"설정","n":"한국어 '설정(設定)'과 같은 한자어예요. 일본에서는 애니·게임 캐릭터의 배경을 キャラ設定(캐릭터 설정)이라고 부르는데, 여기서도 두 사람의 관계를 '이야기 설정'처럼 말하고 있어요."},{"t":"で","m":"~으로 (조건·상태)"},{"t":"　"},{"t":"もっと"},{"t":"{違|ちが}う"},{"t":"{関係|かんけい}","p":"명사","m":"관계","n":"한국어 '관계(關係)'와 같은 한자어예요. 関은 關의 일본식 약자예요."},{"t":"で","m":"~으로 (조건·상태)"}],"ko":"좀 더 다른 설정으로, 좀 더 다른 관계로","lit":"더 / 다른 / 설정 / 으로 / 더 / 다른 / 관계 / 로","g":[{"k":"동사 + 명사","d":"일본어 동사는 기본형 그대로 명사 앞에 붙여 꾸밀 수 있어요. 違う設定 = 다른(다르다) 설정. 한국어처럼 '-ㄴ'으로 바꿀 필요가 없어요."},{"k":"〜で","d":"여기서 で는 '~인 상태로, ~으로'. 違う設定で = 다른 설정으로."}],"s":"부사 もっと와 조사 で는 히라가나, 違·設定·関係는 한자예요. 같은 구조를 두 번 되풀이해 노래의 리듬을 만들어요."},{"id":"b2","tk":[{"t":"{出|で}{会|あ}える","p":"동사","m":"만날 수 있는","b":"{出|で}{会|あ}う","bm":"(우연히) 만나다","w":"出(나오다)+会(만나다) 두 한자가 합쳐진 동사예요. 어간은 한자, 가능형 어미 える는 히라가나예요.","n":"出会う는 '처음 만나다, 운명처럼 마주치다'라는 느낌이고, 그냥 会う는 '(아는 사람을) 만나다'예요."},{"t":"{世界線|せかいせん}","p":"명사","m":"세계선, 평행 세계","w":"한자어라 한자로 써요.","n":"원래 물리학 용어(world line)인데, 일본에서는 게임·애니메이션 「シュタインズ・ゲート」를 계기로 '다른 선택을 했을 때의 평행 세계'라는 뜻으로 널리 퍼졌어요. 지금은 인터넷에서 '다른 세계선에서는…'처럼 가볍게 써요."},{"t":"　"},{"t":"{選|えら}べたら","p":"동사","m":"고를 수 있었다면","b":"{選|えら}ぶ","bm":"고르다","w":"어간 選는 한자, 가능형 + 가정형 어미 べたら는 히라가나예요. 選ぶ → 選べる(고를 수 있다) → 選べたら."},{"t":"よかった","p":"い형용사","m":"좋았을 텐데","b":"いい","bm":"좋다","w":"良かった로도 쓰지만, '~했으면 좋았을 텐데' 같은 문법 표현 속에서는 히라가나로 쓰는 경우가 많아요.","n":"いい(좋다)의 과거형은 いかった가 아니라 よかった예요. いい는 원래 よい에서 온 말이라 활용할 때는 よ-로 돌아가요."}],"ko":"만날 수 있는 세계선을 고를 수 있었다면 좋았을 텐데","lit":"만날 수 있다 / 세계선 / 고를 수 있었다면 / 좋았다","g":[{"k":"〜たらよかった","d":"'~했으면 좋았을 텐데'. 이미 지나간 일에 대한 후회예요. 選べたらよかった = 고를 수 있었으면 좋았을 텐데."},{"k":"가능형 (5단동사)","d":"끝소리 う단을 え단으로 바꾸고 る를 붙여요. 出会う → 出会える, 選ぶ → 選べる."},{"k":"조사 생략","d":"世界線(を) 選べたら처럼, 가사와 회화에서는 を가 자주 생략돼요."}],"s":"出·会·世界線·選 모두 뜻이 담긴 한자, 활용 어미와 よかった는 히라가나예요.","c":"世界線은 일본 애니·게임 문화에서 나와 일상어가 된 말이에요. '이 세계선에서는 너와 이어질 수 없다'는 감각이 곡 전체의 핵심이에요."},{"id":"b3","tk":[{"t":"もっと"},{"t":"{違|ちが}う"},{"t":"{性格|せいかく}","p":"명사","m":"성격","n":"한국어 '성격(性格)'과 같은 한자어예요."},{"t":"で","m":"~으로 (조건·상태)"},{"t":"　"},{"t":"もっと"},{"t":"{違|ちが}う"},{"t":"{価値観|かちかん}","p":"명사","m":"가치관","n":"한국어 '가치관(價値觀)'과 같은 한자어예요. 価는 價, 観은 觀의 일본식 약자예요."},{"t":"で","m":"~으로 (조건·상태)"}],"ko":"좀 더 다른 성격으로, 좀 더 다른 가치관으로","lit":"더 / 다른 / 성격 / 으로 / 더 / 다른 / 가치관 / 으로","s":"性格·価値観 모두 한국어와 같은 한자어라 한자만 보면 뜻이 보여요. 일본식 약자(価 = 價, 観 = 觀)에 익숙해지면 읽기가 훨씬 쉬워져요.","c":"앞의 7행은 설정·관계처럼 바깥 조건, 이번 줄은 성격·가치관처럼 내 안의 조건이에요. '세상이 달랐다면'이라는 바람이 '내가 다른 사람이었다면'으로 깊어져요."},{"id":"b4","tk":[{"t":"{愛|あい}","p":"명사","m":"사랑","w":"뜻을 담은 명사라 한자예요. 한 글자로 된 한자어(온요미)예요.","n":"愛는 온요미 あい로 읽는 한자어예요(한국어 '애'). 고유어 恋(こい)도 '사랑'인데, 愛는 깊고 넓은 사랑, 恋는 설레는 연애 감정에 가까워요. 2절에 恋가 나와요."},{"t":"を"},{"t":"{伝|つた}えられたら","p":"동사","m":"전할 수 있다면","b":"{伝|つた}える","bm":"전하다","w":"어간 伝는 한자, 가능형 + 가정형 어미 えられたら는 히라가나예요.","n":"伝える → 伝えられる(전할 수 있다) → 伝えられたら(전할 수 있다면)."},{"t":"いい"},{"t":"な","m":"~겠다 (혼잣말·바람)"}],"ko":"사랑을 전할 수 있다면 좋을 텐데","lit":"사랑 / 을 / 전할 수 있다면 / 좋다 / 겠다","g":[{"k":"〜たらいいな","d":"'~하면 좋겠다'. 앞으로의 바람이에요. 8행의 〜たらよかった(~했으면 좋았을 텐데, 지난 일에 대한 후회)와 비교해 보세요."},{"k":"가능형 (1단동사)","d":"る로 끝나는 1단 동사는 る를 られる로 바꿔요. 伝える → 伝えられる."}],"s":"한자는 愛와 伝 두 군데뿐이고 나머지는 모두 활용 어미와 문법 요소라 히라가나예요. 한자가 '사랑'과 '전하다'에만 박혀 있어 핵심이 한눈에 보여요."},{"id":"b5","tk":[{"t":"そう"},{"t":"{願|ねが}っても"},{"t":"{無駄|むだ}","p":"な형용사","m":"헛됨, 소용없음","w":"뜻이 분명해서 한자로 써요. 한국어에서는 쓰지 않는 일본식 한자어예요.","n":"無駄 = 쓸데없음, 헛수고. 無駄遣い(낭비)처럼 자주 써요. 2절의 같은 자리에는 虚しい(허무하다)가 와요."},{"t":"だ"},{"t":"から"}],"ko":"그렇게 바라 봐도 소용없으니까","lit":"그렇게 / 바라도 / 헛됨 / 이다 / 니까","g":[{"k":"〜ても","d":"'~해도'. 願う → 願っても(바라도). 3행의 〜たって는 이것의 구어체예요."},{"k":"〜だから","d":"명사·な형용사 + だから = '~이니까'. 無駄だから = 소용없으니까."}],"c":"문장이 だから(~니까)로 끝나고 다음 말 グッバイ로 바로 이어져요. '바라 봐도 소용없으니까, 굿바이'라는 흐름이에요."}]},{"label":"サビ · 후렴","note":"サビ는 일본어로 후렴, 곡에서 가장 고조되는 부분이에요. グッバイ로 시작하는 두 덩어리로 되어 있어요.","lines":[{"id":"c1","tk":[{"t":"グッバイ"}],"ko":"굿바이","lit":"굿바이","s":"후렴은 매번 グッバイ로 시작해요. 영어 그대로가 아닌 가타카나라서, 영어 인사라기보다 일본어 화자가 꺼내는 작별의 한마디로 들려요.","c":"제목이 Pretender(~인 척하는 사람)라는 걸 떠올리면, 이 グッバイ도 정말 떠나는 인사라기보다 '떠나야 한다'고 스스로에게 하는 말에 가까워요. 바로 뒤에 '떠나기 어렵다'는 말이 이어지거든요."},{"id":"c2","tk":[{"t":"{君|きみ}"},{"t":"の"},{"t":"{運命|うんめい}","p":"명사","m":"운명","n":"한국어 '운명(運命)'과 같은 한자어예요. 運命の人(운명의 사람)은 '천생연분, 운명의 짝'을 뜻하는 관용 표현이에요."},{"t":"の"},{"t":"ヒト","p":"명사","m":"사람","b":"{人|ひと}","bm":"사람","w":"원래 人(ひと)이라고 한자로 쓰는 말을 일부러 가타카나로 썼어요. 가타카나로 쓰면 눈앞의 '그 사람'이 아니라 '운명의 짝'이라는 하나의 개념이나 꼬리표처럼, 한 발 떨어진 느낌이 나요. 생물학에서 종(種)으로서의 인간을 부를 때도 ヒト라고 써요.","n":"가타카나는 외래어만이 아니라 '평소와 다르게 보이게' 하고 싶을 때도 써요. 이 곡에서 가장 눈여겨볼 표기예요."},{"t":"は"},{"t":"{僕|ぼく}"},{"t":"じゃない","p":"조동사(부정)","m":"~가 아니다","b":"ではない","w":"ではない(~이 아니다)의 회화체예요. では가 じゃ로 줄어든 문법 요소라 히라가나로 써요."}],"ko":"너의 운명의 사람은 내가 아니야","lit":"너 / 의 / 운명 / 의 / 사람 / 은 / 나 / 가 아니다","g":[{"k":"〜じゃない","d":"'~이 아니다'. 정식으로는 ではない, 회화에서는 じゃない. 僕じゃない = 내가 아니야."},{"k":"AのBのC","d":"の를 여러 번 이어 붙일 수 있어요. 君の運命のヒト = 너의 운명의 사람."}],"s":"이 줄의 주인공은 가타카나 ヒト예요. 人이라고 쓰면 평범한 '사람'이지만, ヒト라고 쓰면 '운명의 사람'이라는 말 자체를 따옴표로 묶은 듯한 느낌이 나요.","c":"일본에서 '운명의 사람(運命の人)'은 '운명의 붉은 실(運命の赤い糸)'로 이어진 상대라는 이미지와 함께 쓰여요. 새끼손가락에 보이지 않는 붉은 실이 묶여 있다는 이야기예요. 화자는 그 실의 끝에 자기가 없다는 걸 담담하게 인정해요."},{"id":"c3","tk":[{"t":"{辛|つら}い","p":"い형용사","m":"괴롭다","w":"어간 辛는 한자, 끝의 い는 오쿠리가나라 히라가나예요.","n":"같은 한자 辛い를 からい로 읽으면 '맵다'예요. 읽기를 문맥으로 구별해야 하는 대표적인 한자라, 가사집에는 꼭 루비가 달려요."},{"t":"けど"},{"t":"{否|いな}めない","p":"동사","m":"부정할 수 없다","b":"{否|いな}む","bm":"부정하다, 거절하다","w":"어간 否는 한자, 활용 어미 めない는 히라가나예요.","n":"否めない는 글말에서 쓰는 조금 딱딱한 표현이에요. 회화라면 否定できない(부정할 수 없다)라고 하는 게 보통이에요. 노래 속에 갑자기 문어체가 나와 '인정하기 싫지만 인정할 수밖에 없다'는 무게가 실려요."},{"t":"　"},{"t":"でも"},{"t":"{離|はな}れ{難|がた}い","p":"い형용사","m":"떠나기 어렵다","b":"{離|はな}れ{難|がた}い","bm":"떨어지기 어렵다","w":"離れる(떨어지다)의 어간 + 難い(~하기 어렵다). 뜻의 중심인 離·難은 한자로, 활용 부분 れ·い는 히라가나로 썼어요.","n":"〜難い(がたい)는 '~하기 어렵다'는 글말 표현이에요. 회화에서는 〜にくい(離れにくい)를 많이 써요. 忘れ難い(잊기 어렵다), 信じ難い(믿기 어렵다)."},{"t":"のさ"}],"ko":"괴롭지만 부정할 수 없어. 그래도 떠나기는 어려운걸","lit":"괴롭다 / 지만 / 부정할 수 없다 / 하지만 / 떠나기 어렵다 / 란 말이야","g":[{"k":"〜{難|がた}い","d":"동사 ます형 + 難い = '~하기 어렵다'(글말). 離れる → 離れ難い. 회화체는 〜にくい."},{"k":"〜のさ","d":"설명의 の + 가벼운 종조사 さ. 감정을 덤덤하게 털어놓는 말투예요."},{"k":"けど / でも","d":"けど는 문장 중간에서 '~지만', でも는 문장 첫머리에서 '하지만'. 한 줄 안에 반전이 두 번 들어 있어요."}],"s":"辛·否·離·難처럼 감정의 뼈대가 되는 말은 한자, けど·でも·のさ 같은 연결어와 말투는 히라가나예요.","c":"괴롭다 → 그래도 인정할 수밖에 → 하지만 떠날 수 없다. 한 줄 안에서 마음이 세 번 뒤집혀요. 결론을 내리지 못하고 흔들리는 화자의 상태가 문장 구조에 그대로 담겨 있어요."},{"id":"c4","tk":[{"t":"その"},{"t":"{髪|かみ}","p":"명사","m":"머리카락","n":"같은 소리 かみ에는 紙(종이), 神(신)도 있어요. 한자 덕분에 뜻이 구별돼요."},{"t":"に","n":"触れる는 대상에 に를 써요. 髪に触れる = 머리카락에 닿다."},{"t":"{触|ふ}れた","p":"동사","m":"닿았다, 스쳤다","b":"{触|ふ}れる","bm":"닿다, 스치다","w":"어간 触는 한자, 활용 어미 れた는 히라가나예요.","n":"触れる는 살짝 닿는 느낌, 触る(さわる)는 손으로 만지는 느낌이에요."},{"t":"だけで","p":"조사","m":"~만으로","n":"だけ(~만) + で(~으로). 触れただけで = 닿기만 했는데도."},{"t":"　"},{"t":"{痛|いた}い","p":"い형용사","m":"아프다","w":"어간 痛는 한자, 끝의 い는 오쿠리가나예요."},{"t":"や","p":"조사(종조사)","m":"~네 (혼잣말)","n":"혼잣말로 체념하듯 내뱉는 종조사예요. 痛いや = '아프네'."},{"t":"　"},{"t":"いや","p":"감동사","m":"아니","w":"감탄사라 히라가나로 써요.","n":"痛いや의 끝소리 '야'와 いや(아니)가 이어져, '이타이야 이야'처럼 말장난같이 울려요."},{"t":"でも"}],"ko":"그 머리카락에 닿기만 해도 아파. 아니, 그래도","lit":"그 / 머리카락 / 에 / 닿았다 / 만으로 / 아프다 / 네 / 아니 / 하지만","g":[{"k":"〜ただけで","d":"동사 과거형 + だけで = '~한 것만으로'. 触れただけで = 닿기만 했는데도."},{"k":"〜や (종조사)","d":"혼잣말로 '~네, ~구나'. 체념하거나 툭 털어놓는 느낌이에요."}],"s":"痛いや / いや / でも로 이어지는 히라가나 부분은 생각이 정리되지 않은 혼잣말을 그대로 받아 적은 듯한 느낌이에요.","c":"'이타이야 이야 데모'는 노래에서 아주 빠르게 이어져요. 아프다고 말해 놓고 곧바로 아니라고 뒤집는 망설임이 비슷한 소리의 반복으로 표현돼요."},{"id":"c5","tk":[{"t":"{甘|あま}い","p":"い형용사","m":"달콤하다 / 무르다","w":"어간 甘는 한자, 끝의 い는 오쿠리가나예요.","n":"甘い는 맛이 '달다'는 뜻 말고도 '생각이 무르다, 안이하다'는 뜻이 있어요. 考えが甘い = 생각이 안일하다. 이 줄은 두 뜻으로 다 읽혀요."},{"t":"な","m":"~네 (혼잣말·감탄)"},{"t":"　"},{"t":"いやいや","p":"감동사","m":"아니 아니","w":"감탄사라 히라가나로 써요.","n":"いや를 두 번 겹쳐 '아니야 아니야' 하고 스스로를 다그치는 말이에요."}],"ko":"달콤하네. 아니, 아니야","lit":"달콤하다 / 네 / 아니 아니","g":[{"k":"〜な (종조사)","d":"혼잣말처럼 감탄하거나 스스로에게 하는 말. 甘いな = 달콤하네 / 무르네."}],"c":"甘いな는 '(닿은 순간이) 달콤하다'로도, '(이런 생각을 하는 내가) 무르다'로도 읽혀요. 곧바로 いやいや(아니 아니)로 자기를 다그치니, 두 번째 뜻으로 읽으면 '나도 참 미련하네' 하는 자조가 돼요. 아픔과 달콤함, 자책이 한 줄에 겹쳐 있어요."},{"same":"c1"},{"id":"c6","tk":[{"t":"それじゃ","p":"접속사","m":"그럼, 그렇다면","b":"それでは","w":"それでは(그렇다면)의 회화체예요. 접속사라 히라가나로 써요."},{"t":"{僕|ぼく}"},{"t":"にとって","p":"조사(복합)","m":"~에게 있어","n":"に + とって가 굳어진 말이에요. 〜にとって = '~의 입장에서, ~에게'. 문법 표현이라 히라가나로 써요."},{"t":"{君|きみ}"},{"t":"は"},{"t":"{何|なに}"},{"t":"？"}],"ko":"그럼 나에게 너는 뭘까?","lit":"그럼 / 나 / 에게 있어 / 너 / 는 / 무엇?","g":[{"k":"〜にとって","d":"'~에게 있어, ~의 입장에서'. 僕にとって = 나에게 있어."},{"k":"それじゃ","d":"それでは(그렇다면)의 회화체. では가 じゃ로 줄어드는 건 じゃない와 같은 원리예요."}],"c":"앞에서 '너의 운명의 사람은 내가 아니다'라고 상대 쪽에서 봤다면, 이번엔 시점을 뒤집어 '그럼 나에게 너는?' 하고 스스로 물어요."},{"id":"c7","tk":[{"t":"{答|こた}え","p":"명사","m":"대답, 답","b":"{答|こた}え","w":"동사 答える(대답하다)에서 나온 명사라, 한자 答 뒤에 오쿠리가나 え가 붙어요."},{"t":"は"},{"t":"{分|わ}からない","p":"동사","m":"모르겠다","b":"{分|わ}かる","bm":"알다, 이해하다","w":"分(나누다)는 한자, 활용 어미 からない는 히라가나예요. 사물이 '나뉘어 구별된다 → 안다'는 뜻에서 分을 써요.","n":"分かる를 わかる로 히라가나로만 쓰는 사람도 많아요. 둘 다 맞는 표기예요."},{"t":"　"},{"t":"{分|わ}かりたく","p":"동사","m":"알고 싶(지)","b":"{分|わ}かる","bm":"알다, 이해하다","w":"分는 한자, 활용 어미와 바람을 나타내는 たく는 히라가나예요.","n":"分かる + たい(~하고 싶다) → 分かりたい → 分かりたく(뒤에 ない가 올 때의 모양)."},{"t":"も","m":"~도 (강조)","n":"〜たくもない = '~하고 싶지도 않다'. も가 들어가 거부감이 더 강해져요."},{"t":"ない","p":"조동사","m":"~지 않다"},{"t":"のさ"}],"ko":"답은 모르겠어. 알고 싶지도 않은걸","lit":"답 / 은 / 모른다 / 알고 싶 / 지도 / 않다 / 란 말이야","g":[{"k":"〜たくもない","d":"동사 ます형 + たい(~하고 싶다) → たくない(~하고 싶지 않다) → たくもない(~하고 싶지도 않다)."}],"c":"모른다(分からない)에서 멈추지 않고 알고 싶지도 않다(分かりたくもない)로 이어 가요. 답을 알게 되면 정말 끝내야 하니까, 일부러 눈을 감는 마음이에요."},{"id":"c8","tk":[{"t":"たった","p":"부사","m":"단, 오직","w":"부사라 히라가나로 써요.","n":"ただ(그저)가 강조되며 소쿠온이 들어간 말이라고 해요. たった一つ = 단 하나."},{"t":"ひとつ"},{"t":"{確|たし}かな","p":"な형용사","m":"확실한","b":"{確|たし}か","bm":"확실하다","w":"어간 確는 한자, か는 오쿠리가나, 명사를 꾸미는 な는 히라가나예요."},{"t":"こと","p":"형식명사","m":"~것","w":"형식명사라 히라가나로 써요."},{"t":"が"},{"t":"ある","p":"동사","m":"있다 (사물)","w":"ある(있다)는 보통 히라가나로 써요. 한자 有る·在る도 있지만 일상 표기에서는 잘 쓰지 않아요.","n":"사람·동물은 いる, 사물·일은 ある. 3행의 いたって(있어도)와 비교해 보세요."},{"t":"と","m":"~라고"},{"t":"する","p":"동사","m":"(~라고) 하다, 가정하다","w":"する는 히라가나로 써요."},{"t":"のならば","p":"조사(복합)","m":"~라면","n":"の + なら + ば. '만약 ~라고 한다면'을 무게를 실어 말하는 형태예요."}],"ko":"단 하나 확실한 게 있다고 한다면","lit":"단 / 하나 / 확실한 / 것 / 이 / 있다 / 고 / 한다 / 면","g":[{"k":"〜とするなら(ば)","d":"'~라고 한다면, ~라고 가정하면'. あるとするのならば = 있다고 한다면."},{"k":"な형용사 + な + 명사","d":"な형용사가 명사를 꾸밀 때는 な를 붙여요. 確か + こと → 確かなこと."}],"s":"한자는 確 하나뿐이고 나머지는 모두 히라가나예요. 히라가나가 길게 이어지며 다음 줄의 결론을 향해 숨을 고르는 느낌을 줘요."},{"id":"c9","tk":[{"t":"「"},{"t":"{君|きみ}"},{"t":"は"},{"t":"{綺麗|きれい}"},{"t":"だ"},{"t":"」"}],"ko":"“너는 아름다워”","lit":"너 / 는 / 아름답다 / 이다","g":[{"k":"「 」","d":"일본어의 따옴표예요. 대화나 인용, 강조하고 싶은 말을 「」로 묶어요. 겹따옴표는 『』."}],"s":"綺麗는 조요칸지 밖의 글자라 일반 문서라면 きれい로 썼을 말이에요. 이 곡은 끝까지 綺麗를 한자로 써서 이 말이 특별하다는 걸 눈으로도 보여 줘요.","c":"아무것도 확실하지 않은데 단 하나 확실한 건 '네가 아름답다'는 것. 좋아한다는 말 대신 綺麗だ라고 말하는 건, 좋아한다고 말할 자격이 없다고 느끼는 화자의 최대한의 고백이에요. 「」로 묶어 마음속에서 꺼낸 한마디처럼 보여요."}]},{"label":"2절 · Aメロ","note":"2절은 남들이 말하는 '연애의 정답'이 자기에게는 하나도 와닿지 않는다는 이야기로 시작해요.","lines":[{"id":"d1","tk":[{"t":"{誰|だれ}か","p":"대명사","m":"누군가","b":"{誰|だれ}か","w":"誰(누구)는 한자, 막연함을 더하는 か는 히라가나예요.","n":"의문사 + か = '~인가'. 誰か(누군가), 何か(무언가), どこか(어딘가)."},{"t":"が"},{"t":"{偉|えら}そうに","p":"부사","m":"잘난 듯이","b":"{偉|えら}い","bm":"훌륭하다, 잘났다","w":"어간 偉는 한자, そうに는 문법 요소라 히라가나예요.","n":"偉い + そう(~해 보이다) + に(부사형) = '잘난 것처럼'. 偉そう는 '거만하게, 잘난 척'이라는 부정적인 느낌이에요."},{"t":"　"},{"t":"{語|かた}る","p":"동사","m":"이야기하다, 늘어놓다","w":"어간 語는 한자, る는 히라가나예요.","n":"話す(말하다)보다 무게 있게 '이야기를 펼쳐 놓다'는 느낌이에요. 여기선 남의 연애론을 장황하게 늘어놓는 모습이에요."},{"t":"{恋愛|れんあい}","p":"명사","m":"연애","n":"한국어 '연애(戀愛)'와 같은 한자어예요. 恋는 戀의 일본식 약자예요."},{"t":"の"},{"t":"{論理|ろんり}","p":"명사","m":"논리","n":"한국어 '논리(論理)'와 같은 한자어예요."}],"ko":"누군가 잘난 듯이 늘어놓는 연애의 논리","lit":"누군가 / 가 / 잘난 듯이 / 이야기하는 / 연애 / 의 / 논리","g":[{"k":"〜そうに","d":"い형용사 어간 + そう = '~해 보이다'. 偉い → 偉そう(잘난 듯한) → 偉そうに(잘난 듯이)."},{"k":"{誰|だれ}か・{何|なに}か","d":"의문사 + か = '~인가'. 誰か(누군가), 何か(무언가), どこか(어딘가)."}],"s":"誰·偉·語·恋愛·論理처럼 뜻을 지닌 말은 모두 한자, 그 사이를 か·が·そうに·の가 히라가나로 이어 줘요.","c":"TV·잡지·SNS에 넘쳐나는 연애 조언, 이른바 '연애론'을 떠올리면 돼요. 그런 '정답'이 자기 사랑에는 하나도 맞지 않는다는 이야기가 다음 줄로 이어져요."},{"id":"d2","tk":[{"t":"{何|なに}"},{"t":"ひとつ"},{"t":"として","p":"조사(복합)","m":"~로서","n":"何ひとつとして + 부정 = '무엇 하나 ~하지 않다'. 강하게 전부를 부정해요."},{"t":"ピンと","p":"부사","m":"딱 (와닿는 모양)","w":"소리나 모양을 흉내 낸 의태어라 가타카나로 썼어요. 히라가나 ぴんと로도 쓰지만, 가타카나로 쓰면 톡 튀는 느낌이 살아나요.","n":"ピンとくる = '딱 와닿다, 감이 오다'. 부정형 ピンとこない(와닿지 않다)도 일상에서 아주 자주 써요."},{"t":"こなくて","p":"동사","m":"오지 않아서","b":"{来|く}る","bm":"오다","w":"来る(오다)의 부정형인데 한자 없이 こなくて로 썼어요. ピンとくる 같은 관용 표현 속의 くる는 히라가나로 쓰는 경우가 많아요.","n":"来る는 불규칙 동사예요. くる → こない(부정) → こなくて(~하지 않아서). 소리가 く/こ/き로 바뀌어요."}],"ko":"무엇 하나 와닿지 않아서","lit":"무엇 / 하나 / 로서 / 딱 / 오지 않아서","g":[{"k":"{何|なに}ひとつとして〜ない","d":"'무엇 하나 ~않다'. 하나도 빠짐없이 부정할 때 써요."},{"k":"ピンとこない","d":"'와닿지 않다, 감이 안 오다'. 긍정은 ピンとくる."},{"k":"〜なくて","d":"부정형 + て = '~하지 않아서'. 이유를 나타내며 다음 줄로 이어져요."}],"s":"ピン은 외래어가 아닌데 가타카나로 쓴 예예요. 후렴의 ヒト와 함께, 이 곡에서 '일부러 가타카나로 바꾼' 두 말 중 하나예요. 의성어·의태어는 가타카나로 쓰면 소리가 더 생생하게 튀어요."},{"id":"d3","tk":[{"t":"{飛行機|ひこうき}","p":"명사","m":"비행기","n":"한국어 '비행기(飛行機)'와 같은 한자어예요."},{"t":"の"},{"t":"{窓|まど}","p":"명사","m":"창문","n":"고유어라 쿤요미 まど로 읽어요."},{"t":"から","m":"~에서 (출발점)"},{"t":"{見|み}{下|お}ろした","p":"동사","m":"내려다본","b":"{見|み}{下|お}ろす","bm":"내려다보다","w":"見る(보다)+下ろす(내리다)가 합쳐진 복합동사예요. 뜻을 담은 見·下는 한자, 활용 부분은 히라가나예요.","n":"見下ろす는 '위에서 내려다보다'. 같은 한자를 見下す(みくだす)라고 읽으면 '깔보다'라는 뜻이 돼요."},{"t":"　"},{"t":"{知|し}らない","p":"동사","m":"모르는","b":"{知|し}る","bm":"알다"},{"t":"{街|まち}","p":"명사","m":"거리, 도시","w":"まち는 町로도 써요. 街는 상점과 불빛이 늘어선 도시의 거리, 町는 행정 단위나 동네 느낌이라, 밤의 도시를 그린 여기서는 街를 썼어요."},{"t":"の"},{"t":"{夜景|やけい}","p":"명사","m":"야경","n":"한국어 '야경(夜景)'과 같은 한자어예요."},{"t":"みたいだ","p":"조동사","m":"~같다","n":"명사 + みたいだ = '~같다'(회화체). 글말로는 〜のようだ."}],"ko":"비행기 창문으로 내려다본, 모르는 도시의 야경 같아","lit":"비행기 / 의 / 창문 / 에서 / 내려다본 / 모르는 / 도시 / 의 / 야경 / 같다","g":[{"k":"〜みたいだ","d":"명사 + みたいだ = '~같다'. 夜景みたいだ = 야경 같아. 비유할 때 회화에서 많이 써요."},{"k":"복합동사","d":"동사 두 개를 이어 하나로 만든 말이에요. 見る + 下ろす → 見下ろす(내려다보다). 앞 동사는 ます형으로 바뀌어요."}],"c":"남들의 연애론은 비행기에서 내려다보는 낯선 도시의 불빛 같다는 비유예요. 반짝이고 예쁘지만, 내가 사는 곳이 아니라 닿지도 않고 실감도 안 나요. 한국어로도 그대로 그림이 그려지는 표현이에요."}]},{"label":"2절 · Bメロ","note":"앞 두 줄은 1절과 같고, 뒤의 세 줄이 새로 바뀌어요.","lines":[{"same":"b1"},{"same":"b2"},{"id":"e1","tk":[{"t":"いたって","p":"부사","m":"더없이, 지극히","b":"{至|いた}って","bm":"지극히, 아주","w":"한자로는 至って(이를 지)지만, 부사로 쓸 때는 히라가나로 쓰는 경우가 많아요.","n":"1절 3행의 いたって(居たって, 있어도)와 소리는 같지만 완전히 다른 말이에요. 같은 소리를 다른 뜻으로 다시 불러서 귀에 남아요."},{"t":"{純|じゅん}な","p":"な형용사","m":"순수한","b":"{純|じゅん}","bm":"순수하다","w":"純은 한 글자 한자어(온요미)예요. 명사를 꾸미는 な는 히라가나.","n":"한국어 '순(純)'과 같은 한자예요. 純粋(じゅんすい, 순수)라고도 해요."},{"t":"{心|こころ}","p":"명사","m":"마음","n":"心는 쿤요미 こころ. 온요미는 しん(心臓 しんぞう, 심장)이에요."},{"t":"で","m":"~으로 (상태)"},{"t":"　"},{"t":"{叶|かな}った","p":"동사","m":"이루어진","b":"{叶|かな}う","bm":"(꿈·소원이) 이루어지다","w":"어간 叶는 한자, 활용 어미 った는 히라가나예요.","n":"叶う는 소원·꿈·사랑이 '이루어지다'. 夢が叶う = 꿈이 이루어지다."},{"t":"{恋|こい}","p":"명사","m":"사랑, 연애 감정","n":"恋는 설레고 애타는 연애 감정, 愛는 깊고 넓은 사랑이에요. 恋人(こいびと, 연인), 初恋(はつこい, 첫사랑)."},{"t":"を"},{"t":"{抱|だ}きしめて","p":"동사","m":"꼭 껴안고","b":"{抱|だ}きしめる","bm":"꼭 껴안다","w":"抱(안다)는 한자, きしめて는 히라가나예요. 抱き締める처럼 締(조이다)까지 한자로 쓸 수도 있지만, 히라가나로 풀어 부드럽게 썼어요.","n":"抱く(안다) + 締める(조이다) = 꽉 끌어안다."}],"ko":"더없이 순수한 마음으로, 이루어진 사랑을 꼭 끌어안고","lit":"지극히 / 순수한 / 마음 / 으로 / 이루어진 / 사랑 / 을 / 꼭 껴안고","g":[{"k":"과거형 + 명사","d":"叶った恋 = 이루어진 사랑. 과거형 동사가 그대로 명사를 꾸며요."},{"k":"〜て (연결)","d":"동사 て형으로 다음 말과 이어요. 抱きしめて = 껴안고 → 다음 줄로."}],"s":"1절 3행의 いたって와 소리가 같은 말이 다시 나와요. 히라가나로만 쓰면 둘이 똑같이 보이지만, 한자로 바꾸면 居たって(있어도) / 至って(지극히)로 전혀 달라요. 히라가나 표기가 만드는 말맛이에요.","c":"'이루어진 사랑'은 지금의 화자에게 없는 것이에요. 다른 세계선이라면 순수한 마음으로 그 사랑을 안을 수 있었을 거라는 상상이에요."},{"id":"e2","tk":[{"t":"「"},{"t":"{好|す}き","p":"な형용사","m":"좋아함","w":"뜻을 담은 好는 한자, 끝의 き는 오쿠리가나라 히라가나예요."},{"t":"だ"},{"t":"」"},{"t":"とか","p":"조사","m":"~라든가, ~같은","n":"인용 + とか = '~같은 말'. 딱 잘라 말하지 않고 예를 들듯 흐리는 말투예요."},{"t":"{無責任|むせきにん}に","p":"な형용사","m":"무책임하게","b":"{無責任|むせきにん}","bm":"무책임","w":"한자어 無責任은 한자, 부사로 만드는 に는 히라가나예요.","n":"한국어 '무책임(無責任)'과 같은 한자어예요."},{"t":"{言|い}えたら","p":"동사","m":"말할 수 있다면","b":"{言|い}う","bm":"말하다","w":"어간 言은 한자, 가능형 + 가정형 어미 えたら는 히라가나예요.","n":"言う → 言える(말할 수 있다) → 言えたら(말할 수 있다면)."},{"t":"いい"},{"t":"な","m":"~겠다 (혼잣말·바람)"}],"ko":"“좋아해” 같은 말을 무책임하게 할 수 있다면 좋을 텐데","lit":"좋아한다 / 같은 말 / 무책임하게 / 말할 수 있다면 / 좋다 / 겠다","g":[{"k":"〜とか","d":"'~라든가, ~같은'. 「好きだ」とか = '좋아해' 같은 말."},{"k":"な형용사 + に","d":"な형용사를 부사로 만들 때는 に를 붙여요. 無責任 → 無責任に(무책임하게)."}],"c":"'좋아해'를 '무책임하게' 말하고 싶다는 건, 결과를 생각하지 않고 마음 가는 대로 고백할 수 있는 관계였으면 좋겠다는 뜻이에요. 지금은 그 말을 하면 상대도 자신도 곤란해진다는 걸 알기에 할 수 없죠. 후렴의 「君は綺麗だ」와 짝을 이뤄요."},{"id":"e3","tk":[{"t":"そう"},{"t":"{願|ねが}っても"},{"t":"{虚|むな}しい","p":"い형용사","m":"허무하다, 공허하다","w":"어간 虚는 한자, 활용 어미 しい는 히라가나예요.","n":"空しい로도 써요. 한국어 '허(虛)'와 같은 한자예요. 1절의 같은 자리에는 無駄(소용없다)가 있었어요."},{"t":"のさ"}],"ko":"그렇게 바라 봐도 허무할 뿐이야","lit":"그렇게 / 바라도 / 허무하다 / 란 말이야","g":[{"k":"い형용사 + のさ","d":"い형용사에는 のさ를 바로 붙여요. 虚しい + のさ. (명사·な형용사는 なのさ)"}],"c":"1절은 無駄だから(소용없으니까), 2절은 虚しいのさ(허무할 뿐이야). '소용없다'고 이성적으로 판단하던 화자가 2절에서는 '허무하다'는 감정을 그대로 드러내요."}]},{"label":"サビ 2 · 두 번째 후렴","note":"두 번째 후렴은 첫 마디 グッバイ만 같고 가사가 새로 바뀌어요.","lines":[{"same":"c1"},{"id":"f1","tk":[{"t":"{繋|つな}いだ","p":"동사","m":"맞잡은, 이은","b":"{繋|つな}ぐ","bm":"잇다, (손을) 잡다","w":"繋는 조요칸지에 없는 글자라 일반 문서에서는 つなぐ로 히라가나로 써요. 가사에서는 한자 繋를 그대로 썼는데, 아랫부분에 실 사(糸)가 들어 있어 '실로 이어 묶는다'는 모양이 보여요.","n":"手を繋ぐ = 손을 잡다(손을 잇다). 繋ぐ → 繋いだ(과거형에서 ぐ가 いだ로 바뀌어요)."},{"t":"{手|て}","p":"명사","m":"손"},{"t":"の"},{"t":"{向|む}こう"},{"t":"に"},{"t":"エンドライン","p":"명사","m":"엔드라인, 끝선","w":"영어 end + line을 이은 외래어라 가타카나예요.","n":"스포츠 코트의 끝선이나 '마지막 선'을 뜻해요. 손을 잡고 있어도 그 끝에 '여기까지'라는 선이 그어져 있다는 느낌이에요."}],"ko":"맞잡은 손 너머에는 엔드라인(끝선)","lit":"맞잡은 / 손 / 의 / 너머 / 에 / 엔드라인","g":[{"k":"〜の{向|む}こうに","d":"'~의 너머에'. 繋いだ手の向こうに = 맞잡은 손 너머에."},{"k":"ぐ → いだ","d":"ぐ로 끝나는 동사의 과거형은 いだ. 繋ぐ → 繋いだ, 泳ぐ → 泳いだ."}],"s":"繋도 綺麗의 綺처럼 조요칸지 밖의 글자예요. 이 곡은 일반 문서라면 히라가나로 풀었을 말을 일부러 한자로 써서 가사에 무게를 줘요.","c":"손을 잡은 행복한 순간에도 그 너머에 끝(エンド)이 보인다는 표현이에요. 문장이 명사 エンドライン에서 뚝 끊겨, '있다'라는 동사 없이 장면만 던져 놓아요."},{"id":"f2","tk":[{"t":"{引|ひ}き{伸|の}ばす","p":"동사","m":"잡아 늘이다, 질질 끌다","w":"引く(당기다)+伸ばす(늘이다)의 복합동사예요. 각 동사의 어간은 한자, 활용 부분 き·ばす는 히라가나예요.","n":"물건을 잡아당겨 늘리는 것뿐 아니라 '시간이나 관계를 질질 끌다'는 뜻도 있어요. 끝날 관계를 조금이라도 늘려 보려는 모습이에요."},{"t":"たびに","p":"표현","m":"~할 때마다","w":"'~할 때마다'는 度に로도 쓰지만, 문법 표현이라 히라가나로 쓰는 경우가 많아요."},{"t":"　"},{"t":"{疼|うず}きだす","p":"동사","m":"욱신거리기 시작하다","b":"{疼|うず}く","bm":"욱신거리다, 쑤시다","w":"어간 疼는 한자, き와 '~하기 시작하다'를 더하는 だす는 히라가나예요. 보조동사로 쓸 때는 出す를 히라가나로 쓰는 경우가 많아요.","n":"疼く는 상처가 욱신욱신 쑤시는 것. 마음이 아릴 때도 써요. 동사 ます형 + だす = '~하기 시작하다'. 泣きだす(울기 시작하다)."},{"t":"{未来|みらい}","p":"명사","m":"미래","n":"한국어 '미래(未來)'와 같은 한자어예요. 来는 來의 일본식 약자예요."},{"t":"には","p":"조사","m":"~에는","n":"に(~에) + は(대비). '미래에는 (다른 건 몰라도) 네가 없다'처럼 대비가 강조돼요."}],"ko":"붙잡아 늘일 때마다 욱신거리기 시작하는 미래에는","lit":"잡아당겨 늘이다 / 때마다 / 욱신거리기 시작하다 / 미래 / 에는","g":[{"k":"〜たびに","d":"동사 기본형 + たびに = '~할 때마다'."},{"k":"〜だす","d":"동사 ます형 + だす = '~하기 시작하다'. 疼く → 疼きだす."}],"c":"이별을 미룰수록 미래가 상처처럼 욱신거리기 시작한다는 표현이에요. '미래'를 아픈 몸처럼 그린 비유가 이 곡다워요."},{"id":"f3","tk":[{"t":"{君|きみ}"},{"t":"は"},{"t":"いない","p":"동사","m":"없다 (사람)","b":"いる","bm":"있다 (사람·동물)","w":"いる(있다)는 보통 히라가나로 써요.","n":"사람이 '없다'는 いない, 사물이 없다면 ない예요."},{"t":"　"},{"t":"その"},{"t":"{事実|じじつ}","p":"명사","m":"사실","n":"한국어 '사실(事實)'과 같은 한자예요. 다만 일본어로는 じじつ라고 읽어요. 같은 한자어라도 소리는 꽤 다를 수 있어요."},{"t":"に","m":"~에 (원인·대상)"},{"t":"　"},{"t":"Cry","p":"동사(영어)","m":"울다","w":"영어를 알파벳 그대로 썼어요. 후렴의 グッバイ는 가타카나인데 Cry는 알파벳이라, 이 단어만 영어 발음으로 툭 튀어나와요.","n":"일본어 泣く(なく, 울다) 대신 영어를 써서, 감정을 한 발 떨어져서 말하는 느낌도 나요."},{"t":"…"}],"ko":"너는 없어. 그 사실에 Cry…","lit":"너 / 는 / 없다 / 그 / 사실 / 에 / 울다…","g":[{"k":"いる / ある","d":"사람·동물이 '있다'는 いる, 사물이 '있다'는 ある. 君はいない = 너는 없어."}],"s":"가사 전체에서 알파벳으로 쓴 영어는 Cry 하나뿐이에요. 같은 영어라도 グッバイ·ロマンス는 가타카나, Cry는 알파벳으로 표기가 갈려요.","c":"울고 있다고 일본어로 직접 말하는 대신 영어 한 단어로 대신해요. 감정이 가장 터지는 순간에 오히려 말을 아끼는 표현이에요."},{"id":"f4","tk":[{"t":"そりゃ","p":"감동사","m":"그야","b":"それは","bm":"그것은","w":"それは(그것은)가 회화에서 줄어든 말이에요. 지시어라 히라가나로 써요.","n":"それは → そりゃ. '그야 당연히'라는 느낌으로 문장 첫머리에 써요."},{"t":"{苦|くる}しい","p":"い형용사","m":"괴롭다, 고통스럽다","w":"어간 苦는 한자, 활용 어미 しい는 히라가나예요.","n":"苦의 온요미는 く(苦労 くろう, 고생)로, 한국어 '고(苦)'와 같은 한자예요. 같은 한자를 苦い(にがい)라고 읽으면 '쓰다(맛)'예요."},{"t":"よな"}],"ko":"그야 괴롭겠지","lit":"그야 / 괴롭다 / 겠지","g":[{"k":"〜よな","d":"종조사 よ + な. 혼잣말로 '~잖아, ~겠지' 하고 수긍할 때 써요. 마지막의 悪くないよな도 같은 말투예요."}],"c":"괴로움을 남 얘기하듯 '그야 괴롭겠지'라고 받아들이는 말투예요. 앞 줄 Cry…의 감정을 스스로 다독이며 마무리해요."}]},{"label":"ラストサビ · 마지막 후렴","note":"마지막 후렴은 1절 후렴과 가사가 같아요. 각 줄을 열면 앞의 해석을 그대로 볼 수 있어요.","lines":[{"same":"c1"},{"same":"c2"},{"same":"c3"},{"same":"c4"},{"same":"c5"},{"same":"c1"},{"same":"c6"},{"same":"c7"},{"same":"c8"},{"same":"c9"}]},{"label":"アウトロ · 마무리","note":"곡을 닫는 마지막 부분이에요. 1절의 悪くはないけど와 후렴의 綺麗だ가 다시 돌아와요.","lines":[{"id":"g1","tk":[{"t":"それもこれも","p":"표현","m":"이것도 저것도, 모두","w":"지시어 それ·これ와 조사 も로 이루어진 말이라 모두 히라가나예요.","n":"직역은 '그것도 이것도'. 한국어로는 '이것저것 다, 모든 게'에 가까워요."},{"t":"ロマンス"},{"t":"の"},{"t":"{定|さだ}め","p":"명사","m":"숙명, 정해진 운명","b":"{定|さだ}め","w":"동사 定める(정하다)에서 나온 명사라, 한자 定 뒤에 오쿠리가나 め가 붙어요.","n":"定め는 '정해진 것' → '피할 수 없는 운명'이에요. 후렴의 運命(うんめい)는 한자어, 定め(さだめ)는 일본 고유어예요. 같은 '운명'을 처음엔 한자어로, 마지막엔 고유어로 불러요."},{"t":"なら","p":"조사","m":"~라면"},{"t":"{悪|わる}く","p":"い형용사","m":"나쁘지","b":"{悪|わる}い","bm":"나쁘다","w":"어간 悪는 한자, 활용 어미 く는 히라가나예요."},{"t":"ない","p":"조동사","m":"~지 않다"},{"t":"よな"}],"ko":"이것도 저것도 다 로맨스의 숙명이라면, 나쁘지 않겠지","lit":"이것도 저것도 / 로맨스 / 의 / 숙명 / 이라면 / 나쁘지 / 않다 / 겠지","g":[{"k":"〜なら","d":"'~라면'. 명사에 바로 붙어요. 定めなら = 숙명이라면."},{"k":"{悪|わる}くない / {悪|わる}くはない","d":"1절은 悪くはないけど(나쁘지는 않지만)로 망설였고, 여기서는 悪くないよな(나쁘지 않겠지)로 받아들여요. は가 빠지고 けど 대신 よな가 붙으면서 말투가 체념에서 수긍으로 바뀌어요."}],"s":"외래어 ロマンス(가타카나)와 고유어 定め(한자 + 히라가나)가 나란히 있어요. 서양에서 온 '로맨스'와 일본 고유어 '숙명'을 한 줄에 묶은 대비예요.","c":"1절에서 '익숙해지면 나쁘지는 않지만…' 하고 흐렸던 말이, 마지막에는 '이것도 로맨스의 숙명이라면 나쁘지 않겠지'로 돌아와요. 이루어지지 않는 사랑까지 하나의 '로맨스'로 받아들이는 결말이에요."},{"id":"g2","tk":[{"t":"{永遠|えいえん}","p":"명사","m":"영원","n":"한국어 '영원(永遠)'과 같은 한자어예요."},{"t":"も"},{"t":"{約束|やくそく}","p":"명사","m":"약속","n":"한국어 '약속(約束)'과 같은 한자어예요. 소리도 '약속/야쿠소쿠'로 꽤 닮았어요."},{"t":"も"},{"t":"ない","p":"い형용사","m":"없다","w":"'없다'는 보통 히라가나로 써요."},{"t":"けれど","p":"조사","m":"~지만","n":"けど의 원래 형태예요. けど보다 조금 정돈되고 여운 있는 느낌이에요."}],"ko":"영원도 약속도 없지만","lit":"영원 / 도 / 약속 / 도 / 없다 / 지만","g":[{"k":"AもBも","d":"'A도 B도'. 永遠も約束も = 영원도 약속도."},{"k":"けれど / けど","d":"같은 '~지만'이에요. けれど가 원래 형태, けど는 회화체 줄임말. 1절은 けど, 마지막은 けれど."}],"c":"끝까지 '영원'이나 '약속' 같은 사랑의 말은 하나도 없어요. 그래도 남는 단 하나의 말이 다음 줄에 와요."},{"id":"g3","tk":[{"t":"とても","p":"부사","m":"정말, 매우","w":"부사라 히라가나로 써요.","n":"とても는 '매우'라는 뜻이에요. 원래는 'とても〜ない(도저히 ~않다)'처럼 부정과 함께 쓰던 말이에요."},{"t":"「"},{"t":"{綺麗|きれい}"},{"t":"だ"},{"t":"」"}],"ko":"정말 “아름다워”","lit":"정말 / 아름답다 / 이다","s":"곡 전체에서 綺麗만은 끝까지 한자로 썼어요. 조요칸지 밖의 글자를 쓰면서까지 지킨 표기라, 이 말이 곡의 중심이라는 걸 눈으로도 알 수 있어요.","c":"후렴의 「君は綺麗だ」에서 君は(너는)가 빠지고 とても(정말)가 붙었어요. 곡의 마지막 말이 '사랑해'가 아니라 '아름다워'라는 것, 그리고 주어 없이 혼잣말처럼 끝난다는 것이 이 곡의 여운이에요."}]}]},"shukumei":{"id":"shukumei","title":"{宿命|しゅくめい}","artist":"Official髭男dism","year":2019,"eyebrow":"Official髭男dism · 2019","sub":"기적이 아니어도, 아름답지 않아도 괜찮다. 바꿀 수 없는 '숙명'을 불태우며 달려가는 사람들을 위한 응원가. 고교야구 프로그램 「熱闘甲子園」 2019 테마송.","release":"2019년 여름 · 앨범 『Traveler』(2019) 수록","tieIn":"ABC·TV아사히 「熱闘甲子園」 2019 테마송","lyricist":"藤原聡","composer":"藤原聡","listen":"https://www.youtube.com/results?search_query=Official%E9%AB%AD%E7%94%B7dism+%E5%AE%BF%E5%91%BD","intro":"宿命(しゅくめい)는 2019년 여름, 일본 고교야구 대회의 하루를 매일 밤 정리해 보여 주는 프로그램 「熱闘甲子園」의 테마송으로 쓰인 곡이에요. 같은 해 발표된 Pretender와 함께 히게단의 2019년을 대표하는 곡이에요.\n\n가사에는 バッテリー(투수와 포수), 背番号(등번호), 泥だらけ(흙투성이)처럼 야구를 떠올리게 하는 말이 곳곳에 숨어 있어요. 그렇다고 야구만의 노래는 아니에요. 결과가 기적이 아니어도, 모습이 아름답지 않아도, 바꿀 수 없는 '숙명'을 연료 삼아 지금 전력을 다하는 모든 사람에게 보내는 응원가예요.","notes":[{"tag":"배경","title":"甲子園과 「熱闘甲子園」","body":"[[{甲子園|こうしえん}]]은 효고현에 있는 야구장 이름이자, 해마다 봄·여름에 이곳에서 열리는 전국 고교야구 대회를 가리키는 말이에요. 특히 여름 대회는 각 지역 예선을 이긴 학교가 모여 토너먼트로 겨루는, 일본 여름의 국민적인 행사예요. 지역 대표가 나가기 때문에 출신 지역 전체가 '우리 고향 학교'를 응원해요.\n\n「熱闘甲子園」은 그날 경기의 명장면과 선수들의 사연을 매일 밤 소개하는 TV 프로그램이에요. 宿命는 2019년 이 프로그램의 테마송이었어요."},{"tag":"문화","title":"진 팀이 흙을 담아 가는 이유","body":"고시엔에서 진 팀 선수들이 눈물을 흘리며 그라운드의 흙을 주머니에 담아 가는 모습은 일본 여름의 상징 같은 장면이에요. 3학년에게는 마지막 여름이고, 한 번 지면 끝나는 토너먼트라서 패배의 눈물과 흙이 함께 기억돼요.\n\n가사의 [[{涙|なみだ}の{足跡|あしあと}]](눈물의 발자국), [[{泥|どろ}だらけの{笑顔|えがお}]](흙투성이 웃음), [[{掌|てのひら}の{爪痕|つめあと}]](손바닥의 손톱자국)이 모두 이런 장면을 떠올리게 해요."},{"tag":"표현","title":"宿命·運命·定め","body":"모두 '운명'으로 옮길 수 있지만 뉘앙스가 달라요.\n\n**[[{宿命|しゅくめい}]]**: 宿(깃들다)+命(목숨). 태어날 때부터 정해져 바꿀 수 없는 것. 일본에서는 '運命는 바꿀 수 있지만 宿命는 바꿀 수 없다'는 말이 있을 만큼 무겁게 여겨요.\n\n**[[{運命|うんめい}]]**: 運(움직이다)+命. 살면서 만나는 흐름과 인연. Pretender의 運命のヒト가 이 말이에요.\n\n**[[{定|さだ}め]]**: 일본 고유어로 '정해진 것'. Pretender 마지막 줄의 ロマンスの定め.\n\n이 곡은 바꿀 수 없는 宿命를 원망하지 않고 '불태우고(燃やして)', 마지막에는 '치켜든다(かざして)'고 노래해요."},{"tag":"표현","title":"야구 용어로 다시 읽기","body":"**[[バッテリー]]**: 건전지이자, 야구에서 투수와 포수 한 쌍을 부르는 말이에요. 切れないバッテリー = 닳지 않는 에너지 + 끊어지지 않는 투수·포수의 호흡.\n\n**[[{背番号|せばんごう}]]**: 고교야구에서는 정해진 인원만 등번호를 받아 벤치에 들어가요. 1번은 에이스 투수, 2번은 포수처럼 번호가 역할을 나타내요.\n\n**[[{泥|どろ}だらけ]]**: 슬라이딩과 다이빙 캐치로 흙투성이가 된 유니폼. 고교야구의 대표적인 이미지예요."},{"tag":"표기","title":"이 곡의 표기 포인트","body":"**히라가나로 푼 말**: あふれ(溢れ), かざす(翳す), やつ(奴), 生きがい(生き甲斐). 어렵거나 조요칸지 밖의 한자를 피하고 말투를 가볍게 했어요.\n\n**일부러 고른 한자**: 讃える(보통은 称える), 想い(보통은 思い), 掌(보통은 手のひら). 감정이 실린 말에는 오히려 무게 있는 한자를 썼어요. Pretender의 綺麗·繋와 같은 방식이에요.\n\n**같은 한자, 다른 읽기**: 重さ(おもさ, 무게)와 重なって(かさなって, 겹쳐져).\n\n**영어**: メロディ·バッテリー·イヤフォン·アンサー는 가타카나, FOREVER 하나만 대문자 알파벳이에요."},{"tag":"문화","title":"頑張れ라는 말의 무게","body":"[[{頑張|がんば}れ]](힘내)는 일본에서 가장 흔한 응원의 말이에요. 그런데 이미 한계까지 버티고 있는 사람에게는 '더 버텨라'라는 부담이 될 수 있어서, 지친 사람에게는 조심해서 쓰자는 이야기도 자주 나와요.\n\n2절의 「大丈夫」や「頑張れ」って歌詞に 苛立ってしまった가 바로 그런 마음이에요. 응원가가 스스로 '뻔한 응원'에 지쳤던 밤을 고백하기 때문에, 후렴의 응원이 더 진심으로 들려요."},{"tag":"문화","title":"生きがい(ikigai)","body":"[[{生|い}きがい]]는 '살아가는 보람, 아침에 일어날 이유'를 뜻해요. 해외에서는 일본식 삶의 태도를 소개하는 말로 'ikigai'가 그대로 알려지기도 했어요.\n\n이 곡에서는 그 거창한 말에 ってやつ(~라는 녀석)를 붙여, 쑥스러운 듯 가볍게 불러요."}],"dict":{"{君|きみ}":{"p":"대명사","m":"너","w":"'너'를 뜻하는 대명사로, 한자로 쓰는 게 일반적이에요.","n":"원래 '임금·주군'을 뜻하던 한자예요(君主 = 군주). 노래 속 君는 '특별한 한 사람'을 부르는 말이에요. 이 곡에서는 함께 뛰는 동료나 응원하는 사람으로도 읽혀요."},"{僕|ぼく}ら":{"p":"대명사","m":"우리","b":"{僕|ぼく}ら","w":"僕(나)는 한자, 복수를 만드는 ら는 히라가나예요.","n":"僕ら = 우리(남성적·젊은 느낌). 私たち(わたしたち)보다 친근해서 노래 가사에서 아주 자주 써요."},"の":{"p":"조사","m":"~의"},"は":{"p":"조사","m":"~은/는 (주제)","n":"조사로 쓸 때는 wa로 읽어요."},"が":{"p":"조사","m":"~이/가"},"を":{"p":"조사","m":"~을/를","n":"발음은 お(o)와 같아요."},"に":{"p":"조사","m":"~에"},"と":{"p":"조사","m":"~와/과"},"も":{"p":"조사","m":"~도"},"から":{"p":"조사","m":"~에서 (출발점)"},"けど":{"p":"조사","m":"~지만"},"じゃない":{"p":"조동사(부정)","m":"~이 아니다","b":"ではない","w":"ではない(~이 아니다)의 회화체예요. では가 じゃ로 줄어든 문법 요소라 히라가나로 써요."},"{夢|ゆめ}":{"p":"명사","m":"꿈","n":"夢는 쿤요미 ゆめ, 온요미 む(夢中 むちゅう, 몰두)예요."},"{無駄|むだ}":{"p":"な형용사","m":"헛됨, 소용없음","w":"뜻이 분명해서 한자로 써요. 한국어에서는 쓰지 않는 일본식 한자어예요.","n":"Pretender에서는 そう願っても無駄だから(바라 봐도 소용없으니까)로 나왔던 말이에요. 이 곡에서는 '無駄じゃない(헛되지 않아)'로 반대로 쓰여요."},"{宿命|しゅくめい}":{"p":"명사","m":"숙명","w":"한자어라 한자로 써요.","n":"宿(머물다, 깃들다)+命(목숨). 태어날 때부터 몸에 깃들어 바꿀 수 없는 운명이라는 뜻이에요. 한국어 '숙명(宿命)'과 같은 한자어예요. 일본에서는 '運命는 바꿀 수 있지만 宿命는 바꿀 수 없다'고 구별하기도 해요."},"って":{"p":"조사","m":"~라는","n":"という(~라는)의 회화체예요. 宿命って = 宿命という."},"やつ":{"p":"명사","m":"녀석, 것","w":"한자 奴로도 쓰지만 가벼운 회화체라 히라가나로 써요.","n":"원래 사람을 낮춰 부르는 '녀석'이지만, 회화에서는 물건이나 개념을 '그거, 그 녀석'처럼 친근하게 부를 때도 써요. 〜ってやつ = '~라는 녀석, ~라는 거'."},"{燃|も}やして":{"p":"동사","m":"불태워서","b":"{燃|も}やす","bm":"불태우다","w":"어간 燃는 한자, 활용 어미 やして는 히라가나예요.","n":"燃える(타다, 자동사) ↔ 燃やす(태우다, 타동사). 情熱を燃やす = 열정을 불태우다."},"{暴|あば}れ{出|だ}す":{"p":"동사","m":"날뛰기 시작하다","w":"暴れる(날뛰다)+出す(~하기 시작하다)의 복합동사예요. 어간 暴·出는 한자, れ·す는 히라가나. Pretender의 疼きだす는 だす를 히라가나로 썼는데, 이 곡은 出す를 한자로 썼어요. 정해진 답이 없어서 곡마다 달라요.","n":"暴れる는 '난폭하게 날뛰다'지만, 여기서는 '거침없이 마음껏 부딪쳐 보다'는 긍정적인 뜻이에요."},"だけ":{"p":"조사","m":"~뿐, ~만"},"なんだ":{"p":"조동사","m":"~인 거야","b":"のだ","w":"なのだ의 회화체예요. 문법 요소라 히라가나로 써요.","n":"〜んだ는 이유나 결심을 힘주어 말하는 말투예요. 〜だけなんだ = '그저 ~할 뿐이야'."},"{未来|みらい}":{"p":"명사","m":"미래","n":"한국어 '미래(未來)'와 같은 한자어예요. 来는 來의 일본식 약자예요."},"{声|こえ}":{"p":"명사","m":"목소리, 소리","n":"声는 쿤요미 こえ, 온요미 せい(歓声 かんせい, 환성)예요."},"あふれ{出|だ}した":{"p":"동사","m":"넘쳐 나온","b":"あふれ{出|だ}す","bm":"넘쳐 나오다","w":"あふれる(넘치다)는 한자 溢れる가 있지만 溢가 조요칸지가 아니라 히라가나로 썼어요. 뒤의 出す(내다)는 쉬운 한자라 한자로 남겨서, 한 단어 안에 히라가나 → 한자 → 히라가나가 섞였어요.","n":"동사 ます형 + 出す = '~해 밖으로 나오다, ~하기 시작하다'. あふれる → あふれ出す(넘쳐흐르기 시작하다)."},"いい":{"p":"い형용사","m":"좋다, 괜찮다","w":"良い로도 쓰지만 회화체 いい는 보통 히라가나로 써요."},"{届|とど}け":{"p":"동사(명령형)","m":"닿아라","b":"{届|とど}く","bm":"닿다, 도착하다","w":"어간 届는 한자, 명령형 어미 け는 히라가나예요.","n":"届く(닿다) → 届け(닿아라!). 끝의 う단을 え단으로 바꾸면 명령형이 돼요. 마음이나 목소리가 상대에게 닿기를 비는 말로 노래와 응원에서 자주 써요."},"それ":{"p":"대명사","m":"그것","w":"지시어라 히라가나로 써요."},"そんな":{"p":"연체사","m":"그런","w":"こんな(이런)·そんな(그런)·あんな(저런)는 지시어라 히라가나로 써요."},"ただ":{"p":"부사","m":"그저, 오직","w":"'그저·오직'이라는 뜻의 부사라 히라가나로 써요."}},"sections":[{"label":"1절 · Aメロ","note":"응원석의 함성처럼, '나'와 '너'의 목소리가 하나로 합쳐지는 장면으로 시작해요.","lines":[{"id":"a1","tk":[{"t":"{心臓|しんぞう}","p":"명사","m":"심장","n":"한국어 '심장(心臟)'과 같은 한자어예요. 臓은 臟의 일본식 약자예요."},{"t":"から"},{"t":"あふれ{出|だ}した"},{"t":"{声|こえ}"},{"t":"で","p":"조사","m":"~로 (수단)"}],"ko":"심장에서 넘쳐 나온 목소리로","lit":"심장 / 에서 / 넘쳐 나온 / 목소리 / 로","g":[{"k":"〜{出|だ}す","d":"동사 ます형 + 出す = '~해 밖으로 나오다' 또는 '~하기 시작하다'. あふれる → あふれ出す."},{"k":"〜から","d":"'~에서, ~로부터'(출발점). 心臓から = 심장에서."}],"s":"あふれ는 히라가나, 出는 한자예요. 溢れる의 溢이 조요칸지 밖의 글자라 히라가나로 풀고, 쉬운 出す는 한자로 남겼어요.","c":"목소리가 '목'이 아니라 '심장'에서 넘쳐 나온다고 해요. 응원석의 함성이나 선수의 외침처럼 몸 깊은 곳에서 터져 나오는 소리예요."},{"id":"a2","tk":[{"t":"{歌|うた}う","p":"동사","m":"노래하는","b":"{歌|うた}う","bm":"노래하다","w":"어간 歌는 한자, う는 히라가나예요."},{"t":"メロディ","p":"명사","m":"멜로디","w":"영어 melody를 옮긴 외래어라 가타카나예요. メロディー처럼 끝에 장음을 붙이기도 하는데, 여기서는 짧게 メロディ로 썼어요.","n":"ディ는 デ에 작은 ィ를 붙여 di 소리를 만든 표기예요. 원래 일본어에 없는 소리를 외래어용으로 만든 조합이에요."}],"ko":"노래하는 멜로디","lit":"노래하다 / 멜로디","g":[{"k":"동사 + 명사","d":"동사 기본형이 그대로 명사를 꾸며요. 歌うメロディ = 노래하는 멜로디."}],"s":"ディ처럼 작은 ィ·ァ·ェ를 붙인 가타카나는 외래어 소리를 옮기려고 만든 표기예요. 히라가나로는 거의 쓰지 않아요."},{"id":"a3","tk":[{"t":"{振|ふ}り{向|む}いた","p":"동사","m":"돌아본","b":"{振|ふ}り{向|む}く","bm":"뒤돌아보다","w":"振る(흔들다)+向く(향하다)의 복합동사예요. 각 어간은 한자, 활용 부분은 히라가나예요.","n":"振り向く = 고개나 몸을 돌려 뒤를 보다. 向く → 向いた(く가 いた로 바뀌는 과거형)."},{"t":"{未来|みらい}"}],"ko":"우리 쪽을 돌아본 미래","lit":"돌아본 / 미래","g":[{"k":"꾸미는 말의 주어","d":"振り向いた未来는 '미래가 돌아봤다'는 뜻이에요. 振り向く는 대상을 받지 않는 자동사라서, 꾸밈을 받는 未来가 곧 돌아본 주인공이에요."}],"c":"'내가 미래를 돌아봤다'가 아니라, 외면하던 미래가 마침내 이쪽을 돌아봐 주었다는 의인법이에요. 2절에서는 반대로 遠ざかってく未来(멀어져 가는 미래)가 나와요. 두 줄을 같이 읽어 보세요."},{"id":"a4","tk":[{"t":"{君|きみ}"},{"t":"から","m":"~에게서"},{"t":"あふれ{出|だ}した"},{"t":"{声|こえ}"},{"t":"と"}],"ko":"네게서 넘쳐 나온 목소리와","lit":"너 / 에게서 / 넘쳐 나온 / 목소리 / 와","s":"1행과 같은 틀(〜からあふれ出した声)을 되풀이해서 '나'와 '너'를 나란히 세워요.","c":"1행의 '심장에서 넘쳐 나온 목소리'와 짝을 이뤄요. 나의 목소리와 너의 목소리가 다음 줄에서 하나로 합쳐져요."},{"id":"a5","tk":[{"t":"{合|あ}わさって","p":"동사","m":"합쳐져서","b":"{合|あ}わさる","bm":"합쳐지다, 포개지다","w":"어간 合는 한자, わさって는 히라가나예요.","n":"合う(맞다)·合わせる(맞추다)·合わさる(합쳐지다)는 한 가족이에요."},{"t":"{響|ひび}いた","p":"동사","m":"울려 퍼졌다","b":"{響|ひび}く","bm":"울리다, 울려 퍼지다","w":"어간 響는 한자, いた는 히라가나예요.","n":"響く는 소리가 공간에 퍼지는 것. 마음에 와닿을 때도 心に響く라고 해요."}],"ko":"하나로 합쳐져 울려 퍼졌어","lit":"합쳐져서 / 울려 퍼졌다","g":[{"k":"〜て (연결)","d":"합쳐져서 → 울렸다처럼 て형으로 동작을 이어요."},{"k":"く → いた","d":"く로 끝나는 동사의 과거형은 いた. 響く → 響いた, 向く → 向いた."}]},{"id":"a6","tk":[{"t":"{群青|ぐんじょう}","p":"명사","m":"군청색 (짙은 파랑)","w":"한자어라 한자로 써요.","n":"群青은 짙고 선명한 파란색이에요. 원래 광물을 갈아 만든 일본화 물감의 이름이에요. 한국어 '군청색'과 같은 한자어예요."},{"t":"の"},{"t":"{空|そら}","p":"명사","m":"하늘"},{"t":"の"},{"t":"{下|した}","p":"명사","m":"아래","n":"下는 쿤요미 した(아래), 온요미 か·げ(地下 ちか, 지하)예요."}],"ko":"군청빛 하늘 아래","lit":"군청 / 의 / 하늘 / 의 / 아래","s":"群青·空·下 모두 한자, の만 히라가나예요. 명사를 の로 이어 붙여 장면을 한 장의 그림처럼 만들어요.","c":"여름 한낮의 짙은 하늘이에요. 고교야구 대회가 열리는 8월, 甲子園 구장 위의 하늘을 떠올리게 해요."}]},{"label":"1절 · Bメロ","note":"'~じゃない(~이 아니야)'를 되풀이하며 지나온 시간이 진짜였다고 확인해요.","lines":[{"id":"b1","tk":[{"t":"{夢|ゆめ}"},{"t":"じゃない"},{"t":"　"},{"t":"{夢|ゆめ}"},{"t":"じゃない"},{"t":"　"},{"t":"{涙|なみだ}","p":"명사","m":"눈물"},{"t":"の"},{"t":"{足|あし}{跡|あと}","p":"명사","m":"발자국","w":"足(발)+跡(자국) 두 한자로 된 고유어예요.","n":"온요미로 そくせき라고 읽으면 '업적, 발자취'라는 딱딱한 말이 돼요. 같은 한자도 읽는 법에 따라 말의 결이 달라져요."}],"ko":"꿈이 아니야, 꿈이 아니야. 눈물의 발자국","lit":"꿈 / 이 아니다 / 꿈 / 이 아니다 / 눈물 / 의 / 발자국","g":[{"k":"〜じゃない","d":"명사 + じゃない = '~이 아니다'. 夢じゃない = 꿈이 아니야."}],"s":"夢·涙·足跡은 한자, じゃない와 の는 히라가나예요. '~じゃない'를 두 번 되풀이하는 리듬이 이 부분 전체에 이어져요.","c":"흘린 눈물이 땅에 남긴 발자국처럼, 지나온 고생이 진짜였다는 말이에요. 고시엔에서 진 팀 선수들이 울면서 구장의 흙을 담아 가는 장면이 겹쳐지는 표현이에요."},{"id":"b2","tk":[{"t":"{嘘|うそ}","p":"명사","m":"거짓말","n":"嘘じゃない = 거짓이 아니야, 진짜야. 회화에서 嘘!라고만 하면 '말도 안 돼!, 진짜?' 하는 놀람의 말이 돼요."},{"t":"じゃない"},{"t":"　"},{"t":"{嘘|うそ}","p":"명사","m":"거짓말"},{"t":"じゃない"},{"t":"　"},{"t":"{泥|どろ}","p":"명사","m":"진흙"},{"t":"だらけ","p":"접미사","m":"~투성이","w":"'~투성이'를 뜻하는 접미사라 히라가나로 써요.","n":"명사 + だらけ = '~투성이'(대개 좋지 않은 것). 傷だらけ(상처투성이), ミスだらけ(실수투성이). 뒤에 나오는 まみれ(汗まみれ)와 비슷한 말이에요."},{"t":"の"},{"t":"{笑顔|えがお}","p":"명사","m":"웃는 얼굴","w":"笑(웃다)+顔(얼굴)의 명사예요.","n":"笑를 え로 읽는 건 이 단어에서만 쓰는 특별한 읽기예요. 단어 전체로 えがお라고 외워 두세요."}],"ko":"거짓이 아니야, 거짓이 아니야. 흙투성이의 웃는 얼굴","lit":"거짓말 / 이 아니다 / 거짓말 / 이 아니다 / 진흙 / 투성이 / 의 / 웃는 얼굴","g":[{"k":"〜だらけ","d":"명사 + だらけ = '~투성이'. 泥だらけ = 흙투성이."}],"s":"泥·笑顔은 한자, 접미사 だらけ는 히라가나예요.","c":"흙투성이 유니폼으로 웃는 얼굴은 고교야구의 대표적인 이미지예요. 진흙(泥)과 웃음(笑顔)을 나란히 놓아, 힘들었지만 진심으로 웃는 순간을 그려요."},{"id":"b3","tk":[{"t":"{夢|ゆめ}"},{"t":"じゃない"},{"t":"　"},{"t":"{夢|ゆめ}"},{"t":"じゃない"},{"t":"　"},{"t":"{肩|かた}","p":"명사","m":"어깨"},{"t":"を"},{"t":"{組|く}んで","p":"동사","m":"짜서, 걸고","b":"{組|く}む","bm":"짜다, 엮다","w":"어간 組는 한자, んで는 히라가나예요.","n":"肩を組む = 어깨동무하다. む로 끝나는 동사의 て형은 んで(組む → 組んで)."},{"t":"{叫|さけ}びたい","p":"동사","m":"외치고 싶다","b":"{叫|さけ}ぶ","bm":"외치다","w":"어간 叫는 한자, 활용 어미 び와 바람을 나타내는 たい는 히라가나예요."}],"ko":"꿈이 아니야, 꿈이 아니야. 어깨동무하고 외치고 싶어","lit":"꿈 / 이 아니다 / 꿈 / 이 아니다 / 어깨 / 를 / 걸고 / 외치고 싶다","g":[{"k":"{肩|かた}を{組|く}む","d":"'어깨동무하다'. 한국어처럼 몸을 쓰는 관용 표현이에요."},{"k":"〜たい","d":"동사 ます형 + たい = '~하고 싶다'. 叫ぶ → 叫びたい."}],"c":"팀 동료나 응원석의 친구들과 어깨를 걸고 함께 외치는 장면이에요. 혼자가 아니라 '우리'라는 감각이 다음 줄의 僕ら로 이어져요."},{"id":"b4","tk":[{"t":"{僕|ぼく}ら"},{"t":"の"},{"t":"{想|おも}い","p":"명사","m":"마음, 간절한 생각","b":"{想|おも}い","w":"おもい는 보통 思い로 쓰는데, 여기서는 想을 썼어요. 想는 누군가를 마음에 그리는 감정적인 생각에 써서 '간절한 마음'이라는 느낌이 강해져요.","n":"想를 おもう로 읽는 건 조요칸지표에 없는 읽기라 공문서에서는 쓰지 않아요. 가사에서는 감정을 담고 싶을 때 想い를 자주 골라요."},{"t":"　"},{"t":"{届|とど}け"},{"t":"!"}],"ko":"우리의 마음, 닿아라!","lit":"우리 / 의 / 마음 / 닿아라!","g":[{"k":"명령형","d":"5단 동사의 끝 う단을 え단으로 바꿔요. 届く → 届け(닿아라). 거친 명령만이 아니라 '부디 ~해라' 하는 바람으로도 써요."}],"c":"届け!는 응원과 기도의 외침이에요. 일본의 스포츠 응원이나 콘서트에서 '이 마음, 닿아라(届け)!'라는 말을 자주 들을 수 있어요."}]},{"label":"サビ · 후렴","note":"기적이 아니어도, 아름답지 않아도 괜찮다는 이 곡의 중심 메시지예요.","lines":[{"id":"c1","tk":[{"t":"{奇跡|きせき}","p":"명사","m":"기적","n":"한국어 '기적'과 같은 한자어예요. 한국에서는 奇蹟으로도 쓰지만 일본에서는 보통 奇跡로 써요."},{"t":"じゃなくて","p":"조동사(부정)","m":"~이 아니어도","b":"ではない","w":"じゃない의 て형이에요. 문법 요소라 히라가나로 써요."},{"t":"いい"}],"ko":"기적이 아니어도 괜찮아","lit":"기적 / 이 아니어도 / 좋다","g":[{"k":"〜なくていい","d":"'~하지 않아도 괜찮다'. 명사 + じゃなくていい = '~이 아니어도 돼'. 奇跡じゃなくていい = 기적이 아니어도 돼."}],"c":"보통 응원가라면 '기적을 일으키자'고 할 텐데, 이 곡은 '기적이 아니어도 괜찮다'고 시작해요. 우승이나 극적인 역전이 아니어도, 그 과정 자체가 의미 있다는 메시지예요."},{"id":"c2","tk":[{"t":"{美|うつく}しく","p":"い형용사","m":"아름답(지)","b":"{美|うつく}しい","bm":"아름답다","w":"어간 美는 한자, 활용 어미 しく는 히라가나예요.","n":"美しい는 감탄이 담긴 '아름답다'예요. 일상적인 '예쁘다'는 きれい(Pretender의 綺麗)."},{"t":"なくて","p":"조동사","m":"~지 않아도","b":"ない"},{"t":"いい"}],"ko":"아름답지 않아도 괜찮아","lit":"아름답 / 지 않아도 / 좋다","g":[{"k":"い형용사 + くなくていい","d":"い형용사 어간 + くなくていい = '~하지 않아도 괜찮다'. 美しい → 美しくなくていい."}],"c":"흙투성이에 땀범벅이어도, 보기 좋지 않아도 괜찮다는 말이에요. 앞 줄과 함께 '완벽하지 않아도 된다'는 이 곡의 태도를 보여 줘요."},{"id":"c3","tk":[{"t":"{生|い}きがい","p":"명사","m":"사는 보람","b":"{生|い}き{甲斐|がい}","bm":"삶의 보람","w":"生きる(살다)의 生는 한자, '보람'을 뜻하는 甲斐(かい)는 히라가나 がい로 풀어 썼어요. 甲斐는 뜻이 아니라 소리를 빌려 쓴 한자라 히라가나로 쓰는 경우가 많아요.","n":"生きがい = 살아갈 보람, 삶의 의미. 해외에도 'ikigai'라는 말로 알려져 있어요."},{"t":"って"},{"t":"やつ"},{"t":"が"}],"ko":"사는 보람이라는 녀석이","lit":"사는 보람 / 이라는 / 녀석 / 이","g":[{"k":"〜ってやつ","d":"명사 + ってやつ = '~라는 녀석, ~라는 거'. 거창한 말을 친근하게, 조금 쑥스럽게 부르는 말투예요. 이 곡에서는 生きがいってやつ, 宿命ってやつ로 두 번 나와요."}],"s":"生き 뒤로 がい·って·やつ·が까지 히라가나가 길게 이어져요. 甲斐·奴 같은 한자를 쓰지 않아 말투가 가볍고 친근해져요.","c":"生きがい(삶의 보람)처럼 무거운 말에 ってやつ(~라는 녀석)를 붙여, 거창하지 않게 툭 던지듯 말해요. 땀 흘리는 고교생의 말투 같은 친근함이 있어요."},{"id":"c4","tk":[{"t":"{光|ひか}り{輝|かがや}く","p":"동사","m":"눈부시게 빛나다","w":"光る(빛나다)+輝く(반짝이다)의 복합동사예요. 비슷한 뜻을 겹쳐 '눈부시게 빛나다'를 강조해요. 어간은 한자, り·く는 히라가나예요."},{"t":"から","m":"~니까 (이유)"}],"ko":"눈부시게 빛나니까","lit":"빛나고 반짝인다 / 니까","g":[{"k":"문장 + から","d":"'~니까'(이유). 光り輝くから = 빛나니까. 명사 뒤의 から(~에서)와 모양은 같지만 역할이 달라요."}],"c":"결과가 기적이 아니어도, 아름답지 않아도 괜찮은 이유가 바로 이것이에요. '사는 보람'이 빛나고 있으니까요."},{"id":"c5","tk":[{"t":"{切|き}れない","p":"동사","m":"끊기지 않는, 닳지 않는","b":"{切|き}れる","bm":"끊어지다, 다 떨어지다","w":"어간 切는 한자, 활용 어미 れない는 히라가나예요.","n":"電池が切れる = 배터리가 다 되다. 切れない = 다 닳지 않는."},{"t":"バッテリー","p":"명사","m":"배터리 / (야구) 투수와 포수","w":"영어 battery를 옮긴 외래어라 가타카나예요.","n":"야구에서 バッテリー는 투수와 포수 한 쌍을 부르는 말이에요. '닳지 않는 건전지'와 '끊어지지 않는 투수·포수의 호흡'을 동시에 떠올리게 하는 말이에요."}],"ko":"닳지 않는 배터리","lit":"끊기지 않는 / 배터리","s":"외래어 バッテリー는 가타카나, 切れない는 한자 + 히라가나예요.","c":"고교야구 응원가라서 바로 '투수와 포수(배터리)'가 떠올라요. 지치지 않는 에너지이자, 서로를 믿고 공을 주고받는 끈끈한 관계라는 두 겹의 뜻이에요."},{"id":"c6","tk":[{"t":"{魂|たましい}","p":"명사","m":"영혼, 혼","n":"魂은 쿤요미 たましい, 온요미 こん(闘魂 とうこん, 투혼)이에요. 한국어 '혼(魂)'과 같은 한자예요."},{"t":"の"},{"t":"{限|かぎ}り","p":"명사","m":"~이 다하도록, 한도","b":"{限|かぎ}り","w":"동사 限る(한정하다)에서 나온 명사라, 한자 限 뒤에 오쿠리가나 り가 붙어요.","n":"〜の限り = '~이 다하는 데까지'. 力の限り(힘이 닿는 데까지), 魂の限り(혼이 다하도록)."}],"ko":"혼이 다하도록","lit":"영혼 / 의 / 한도까지","g":[{"k":"〜の{限|かぎ}り","d":"명사 + の限り = '~이 다할 때까지, ~껏'. 魂の限り = 혼신을 다해."}]},{"id":"c7","tk":[{"t":"{宿命|しゅくめい}"},{"t":"って"},{"t":"やつ"},{"t":"を"},{"t":"{燃|も}やして"}],"ko":"숙명이라는 녀석을 불태워서","lit":"숙명 / 이라는 / 녀석 / 을 / 불태워서","g":[{"k":"자동사 / 타동사","d":"燃える(타다) ↔ 燃やす(태우다). 일본어에는 이런 짝이 많아요. 여기서는 내가 숙명을 '태운다'는 타동사예요."}],"c":"바꿀 수 없는 숙명을 원망하는 대신 연료처럼 '불태운다'는 발상이에요. 정해진 조건을 받아들이고 그걸 힘으로 바꾸는 태도죠. Pretender가 運命·定め를 받아들이며 끝났다면, 이 곡은 宿命를 태우며 달려 나가요."},{"id":"c8","tk":[{"t":"{暴|あば}れ{出|だ}す"},{"t":"だけ"},{"t":"なんだ"}],"ko":"그저 마음껏 날뛸 뿐이야","lit":"날뛰기 시작하다 / 뿐 / 인 거야","g":[{"k":"〜だけなんだ","d":"'그저 ~할 뿐이야'. だけ(~뿐) + なんだ(힘주어 말하기). 다른 건 몰라도 이것만은 한다는 결심이에요."}],"c":"결과나 기적은 상관없이 '그저 날뛸 뿐'. 후렴 전체가 결과보다 지금 전력을 다하는 것을 노래해요."}]},{"label":"2절 · Aメロ","note":"1절의 환희와 반대로, 음악조차 듣기 싫었던 좌절의 시간을 돌아봐요.","lines":[{"id":"d1","tk":[{"t":"{沈黙|ちんもく}","p":"명사","m":"침묵","n":"한국어 '침묵(沈默)'과 같은 한자어예요."},{"t":"が"},{"t":"{続|つづ}いた","p":"동사","m":"이어진","b":"{続|つづ}く","bm":"이어지다, 계속되다","w":"어간 続는 한자, いた는 히라가나예요."},{"t":"イヤフォン","p":"명사","m":"이어폰","w":"영어 earphone을 옮긴 외래어라 가타카나예요. フォ는 フ에 작은 ォ를 붙여 fo 소리를 만든 외래어용 표기예요.","n":"일본어 사전에서는 イヤホン이 더 일반적인 표기예요. 같은 외래어라도 표기가 여러 가지일 수 있어요."}],"ko":"침묵만 이어지던 이어폰","lit":"침묵 / 이 / 이어진 / 이어폰","c":"이어폰을 끼고 있는데 아무것도 흘러나오지 않는, 음악조차 듣고 싶지 않던 시기예요. 1절의 '목소리'와 '멜로디'가 2절에서는 '침묵'으로 바뀌었어요."},{"id":"d2","tk":[{"t":"{自分|じぶん}","p":"명사","m":"자기 자신, 나","n":"自分은 '자기 자신'. 회화에서는 '나'라는 1인칭처럼 쓰기도 해요."},{"t":"の"},{"t":"{弱|よわ}さ","p":"명사","m":"약함","b":"{弱|よわ}さ","w":"い형용사 弱い(약하다)의 어간 弱 + 명사를 만드는 さ예요. 어간은 한자, さ는 히라가나.","n":"い형용사 어간 + さ = 정도를 나타내는 명사. 弱い → 弱さ(약함), 悔しい → 悔しさ(분함), 熱い → 熱さ(뜨거움). 이 곡에 셋 다 나와요."},{"t":"に","m":"~에 (원인)"}],"ko":"나 자신의 약함에","lit":"자신 / 의 / 약함 / 에","g":[{"k":"い형용사 + さ","d":"い를 떼고 さ를 붙이면 명사가 돼요. 弱い → 弱さ, 悔しい → 悔しさ, 熱い → 熱さ."}]},{"id":"d3","tk":[{"t":"{遠|とお}ざかってく","p":"동사","m":"멀어져 가는","b":"{遠|とお}ざかる","bm":"멀어지다","w":"어간 遠는 한자, ざかってく는 히라가나예요.","n":"遠ざかっていく에서 い가 빠진 회화체예요(〜ていく → 〜てく). 遠い(멀다)에서 나온 동사예요."},{"t":"{未来|みらい}"}],"ko":"멀어져 가던 미래","lit":"멀어져 가는 / 미래","g":[{"k":"〜てく","d":"〜ていく(~해 가다)의 회화체. 遠ざかっていく → 遠ざかってく."}],"c":"1절의 振り向いた未来(우리 쪽을 돌아본 미래)와 정반대예요. 자신의 약함 때문에 미래가 등을 돌려 멀어져 가던 시간을 말해요."},{"id":"d4","tk":[{"t":"「"},{"t":"{大丈夫|だいじょうぶ}","p":"な형용사","m":"괜찮다","w":"한자어라 한자로 써요.","n":"大丈夫는 원래 '훌륭한 사나이(대장부)'라는 뜻의 한자어예요. 한국어 '대장부'와 같은 한자인데, 일본어에서는 '괜찮다'라는 뜻으로 바뀌어 일상에서 가장 많이 쓰는 말 중 하나가 됐어요."},{"t":"」"},{"t":"や","p":"조사","m":"~이나, ~랑","n":"や는 몇 가지를 예로 들며 늘어놓을 때 써요. AやB = A나 B (그 밖에도)."},{"t":"「"},{"t":"{頑|がん}{張|ば}れ","p":"동사(명령형)","m":"힘내, 파이팅","b":"{頑|がん}{張|ば}る","bm":"힘내다, 버티다","w":"어간 頑張는 한자, 명령형 어미 れ는 히라가나예요.","n":"頑張れ는 '힘내!'. 일본에서 응원할 때 가장 많이 쓰는 말이에요. 다만 이미 버티고 있는 사람에게는 부담이 될 수 있어서, 지친 사람에게는 조심해서 쓰자는 이야기도 있어요."},{"t":"」"},{"t":"って"},{"t":"{歌詞|かし}","p":"명사","m":"가사","n":"한국어 '가사(歌詞)'와 같은 한자어예요."},{"t":"に","m":"~에 (대상)"}],"ko":"“괜찮아”나 “힘내” 같은 가사에","lit":"괜찮다 / 나 / 힘내라 / 라는 / 가사 / 에","g":[{"k":"〜や〜","d":"A や B = 'A나 B (등)'. 대표적인 것 몇 가지를 예로 들 때 써요."},{"k":"명령형 (5단동사)","d":"頑張る → 頑張れ. 끝 う단을 え단으로 바꿔요. 届く → 届け도 같은 규칙이에요."}],"c":"응원가에 흔한 '괜찮아', '힘내'라는 말에 오히려 짜증이 났던 밤. 응원가인 이 곡이 스스로 '뻔한 응원 가사'를 돌아보는 부분이라 더 솔직하게 들려요."},{"id":"d5","tk":[{"t":"{苛|いら}{立|だ}って","p":"동사","m":"짜증이 나서","b":"{苛|いら}{立|だ}つ","bm":"짜증 나다, 초조해하다","w":"苛(가혹할 가)+立つ(서다)의 동사예요. 어간은 한자, 활용 부분 って는 히라가나.","n":"イライラ(짜증, 안절부절)와 뿌리가 같은 말이에요. イライラ는 의태어라 가타카나로 많이 써요."},{"t":"しまった","p":"보조동사","m":"~해 버렸다","b":"しまう","bm":"(완전히) ~해 버리다","w":"보조동사로 쓰일 때는 히라가나로 쓰는 게 표기 원칙이에요."}],"ko":"짜증이 나 버렸던","lit":"짜증 나서 / 버렸다","g":[{"k":"〜てしまった","d":"'~해 버렸다'. 원치 않았는데 그렇게 됐다는 후회예요. 苛立ってしまった = 짜증이 나 버렸다."}],"s":"苛立つ의 苛는 '가혹하다'는 뜻의 한자예요. 한자를 알면 '마음을 날카롭게 찌르는 짜증'이라는 느낌이 보여요."},{"id":"d6","tk":[{"t":"そんな"},{"t":"{夜|よる}","p":"명사","m":"밤"},{"t":"も"},{"t":"あった","p":"동사","m":"있었다","b":"ある","bm":"있다 (사물·일)","w":"ある(있다)는 보통 히라가나로 써요."}],"ko":"그런 밤도 있었어","lit":"그런 / 밤 / 도 / 있었다","c":"'그런 밤도 있었다'고 과거형으로 담담하게 정리해요. 지금은 그 시간을 지나왔다는 뜻이 담겨 있어요."}]},{"label":"2절 · Bメロ","note":"1절 Bメロ와 같은 틀에 '분함'과 '손톱자국'을 담았어요.","lines":[{"id":"e1","tk":[{"t":"{夢|ゆめ}"},{"t":"じゃない"},{"t":"　"},{"t":"{夢|ゆめ}"},{"t":"じゃない"},{"t":"　"},{"t":"あの","p":"연체사","m":"그 (서로 아는)","w":"지시어라 히라가나로 써요.","n":"あの는 '저'지만, 말하는 사람과 듣는 사람이 함께 아는 과거를 가리킬 때도 써요. あの日 = (우리가 아는) 그날."},{"t":"{日|ひ}","p":"명사","m":"날"},{"t":"の"},{"t":"{悔|くや}しさ","p":"명사","m":"분함, 억울함","b":"{悔|くや}しさ","w":"悔しい(분하다)의 어간 悔 + 명사를 만드는 さ예요.","n":"悔しい는 지거나 실패했을 때의 '분하다, 억울하다'예요. 일본 스포츠에서 아주 자주 듣는 감정 표현으로, 진 선수가 인터뷰에서 '悔しいです'라고 말하는 모습이 흔해요."},{"t":"と"}],"ko":"꿈이 아니야, 꿈이 아니야. 그날의 분함과","lit":"꿈 / 이 아니다 / 꿈 / 이 아니다 / 그 / 날 / 의 / 분함 / 과","c":"あの日(그날)는 아마 진 경기, 실패한 날이에요. 분했던 기억도 꿈이 아니라 진짜였다고 인정해요."},{"id":"e2","tk":[{"t":"{忘|わす}れない","p":"동사","m":"잊지 않아","b":"{忘|わす}れる","bm":"잊다","w":"어간 忘는 한자, れない는 히라가나예요."},{"t":"　"},{"t":"{忘|わす}れない","p":"동사","m":"잊지 않아","b":"{忘|わす}れる","bm":"잊다"},{"t":"　"},{"t":"{掌|てのひら}","p":"명사","m":"손바닥","w":"掌 한 글자를 てのひら라고 읽어요. 보통은 手のひら·手の平로 쓰는데, 가사에서는 한 글자 掌로 써서 문어적인 느낌을 냈어요.","n":"掌의 온요미는 しょう(合掌 がっしょう, 합장)예요. 한 글자 한자에 긴 쿤요미가 붙는 예예요."},{"t":"の"},{"t":"{爪|つめ}{痕|あと}","p":"명사","m":"손톱자국","w":"爪(손톱)+痕(자국)의 고유어예요.","n":"분해서 주먹을 꽉 쥐었을 때 손바닥에 남는 손톱자국이에요. 爪痕는 '재해가 남긴 상처'라는 뜻으로 뉴스에서도 자주 써요."}],"ko":"잊지 않아, 잊지 않아. 손바닥의 손톱자국","lit":"잊지 않는다 / 잊지 않는다 / 손바닥 / 의 / 손톱자국","s":"1절의 足跡(발자국)과 2절의 爪痕(손톱자국)이 짝을 이뤄요. 跡는 지나간 자리, 痕는 상처가 남은 자국이라 둘 다 '흔적'이지만 한자가 달라요.","c":"너무 분해서 주먹을 꽉 쥐면 손톱이 손바닥을 파고들어 자국이 남죠. 말로 하지 않고 몸에 남은 흔적으로 '분함'을 보여 주는 표현이에요."},{"id":"e3","tk":[{"t":"{無駄|むだ}"},{"t":"じゃない"},{"t":"　"},{"t":"{無駄|むだ}"},{"t":"じゃない"},{"t":"　"},{"t":"それ"},{"t":"も"},{"t":"{全|すべ}て","p":"명사","m":"모두, 전부","b":"{全|すべ}て","w":"全(온전할 전)은 한자, て는 오쿠리가나예요. すべて는 히라가나로만 쓰는 경우도 많아요."},{"t":"{讃|たた}えたい","p":"동사","m":"기리고 싶다","b":"{讃|たた}える","bm":"칭송하다, 기리다","w":"たたえる는 보통 称える로 쓰는데, 여기서는 讃(기릴 찬)을 썼어요. 讃은 조요칸지가 아니라서 일반 문서에서는 잘 쓰지 않는, 노래다운 표기예요.","n":"讃美歌(찬미가)처럼 '기리다, 찬양하다'는 뜻의 한자예요. 단순한 칭찬이 아니라 '존경을 담아 기리다'는 무게가 있어요."}],"ko":"헛되지 않아, 헛되지 않아. 그것도 전부 기리고 싶어","lit":"헛됨 / 이 아니다 / 헛됨 / 이 아니다 / 그것 / 도 / 전부 / 기리고 싶다","g":[{"k":"〜たい","d":"동사 ます형 + たい = '~하고 싶다'. 讃える → 讃えたい."}],"s":"讃은 조요칸지 밖의 글자예요. Pretender의 綺麗·繋처럼, 히게단 가사는 감정이 실린 말에 일부러 무게 있는 한자를 써요.","c":"분함도 손톱자국도 헛되지 않았다며 '기리고 싶다'고 말해요. 실패한 과거를 감추지 않고 자랑스럽게 받아들이는 태도예요. 夢じゃない → 嘘じゃない → 無駄じゃない로 '~じゃない'가 계속 모양을 바꿔요."},{"id":"e4","tk":[{"t":"もう","p":"부사","m":"이제","w":"부사라 히라가나로 써요.","n":"もう는 '이미'라는 뜻도 있지만, もうあと少し처럼 '이제 조금만 더'라는 뜻으로도 써요."},{"t":"あと","p":"부사","m":"앞으로 (남은)","w":"한자 後로도 쓰지만 '앞으로 ~만 남았다'는 뜻일 때는 히라가나로 많이 써요."},{"t":"{少|すこ}し","p":"부사","m":"조금","b":"{少|すこ}し","w":"어간 少는 한자, し는 오쿠리가나예요."}],"ko":"이제 조금만 더","lit":"이제 / 앞으로 / 조금","g":[{"k":"あと + 수량","d":"'앞으로 ~ 남았다'. あと少し = 조금만 더, あと一点 = 한 점만 더."}],"c":"결승선이 눈앞에 보일 때의 '조금만 더!'예요. 짧은 한마디로 2절을 끝내고 다음 부분으로 넘어가요."}]},{"label":"Cメロ · 브리지","note":"Cメロ는 1·2절과 다른 새 멜로디가 나오는 부분이에요. 기대와 부담, 그리고 등번호 이야기가 나와요.","lines":[{"id":"f1","tk":[{"t":"{願|ねが}い","p":"명사","m":"소원","b":"{願|ねが}い","w":"동사 願う(바라다)에서 나온 명사라, 한자 願 뒤에 오쿠리가나 い가 붙어요."},{"t":"の"},{"t":"{熱|あつ}さ","p":"명사","m":"뜨거움, 열기","b":"{熱|あつ}さ","w":"熱い(뜨겁다)의 어간 熱 + 명사를 만드는 さ예요.","n":"あつい는 한자에 따라 뜻이 달라요. 熱い(물체·마음이 뜨겁다), 暑い(날씨가 덥다), 厚い(두껍다). 여기서는 마음의 열기라 熱."},{"t":"に","m":"~에 (원인)"}],"ko":"소원의 열기에","lit":"소원 / 의 / 뜨거움 / 에","s":"願い는 동사 願う에서, 熱さ는 형용사 熱い에서 나온 명사예요. 뜻을 담은 願·熱은 한자, 끝의 い·さ는 히라가나라서 품사가 바뀐 부분이 눈에 보여요."},{"id":"f2","tk":[{"t":"{汗|あせ}","p":"명사","m":"땀"},{"t":"まみれ","p":"접미사","m":"~범벅, ~투성이","w":"'~범벅'을 뜻하는 접미사라 히라가나로 써요. 한자 塗れ는 거의 쓰지 않아요.","n":"명사 + まみれ = 온몸이 ~로 뒤덮인 상태. 汗まみれ(땀범벅), 泥まみれ(진흙범벅). 1절의 だらけ와 비슷하지만, まみれ는 '몸에 들러붙어 뒤덮였다'는 느낌이 더 강해요."},{"t":"に","m":"~이/가 (되다)"},{"t":"なったり","p":"동사","m":"되기도 하고","b":"なる","bm":"되다","w":"なる(되다)는 기본 동사라 히라가나로 써요."}],"ko":"땀범벅이 되기도 하고","lit":"땀 / 범벅 / 이 / 되기도 하고","g":[{"k":"〜になる","d":"명사 + になる = '~이 되다'. 汗まみれになる = 땀범벅이 되다."},{"k":"〜たり","d":"'~하기도 하고'. 몇 가지 동작을 예로 들어 늘어놓을 때 써요."}]},{"id":"f3","tk":[{"t":"{期待|きたい}","p":"명사","m":"기대","n":"한국어 '기대(期待)'와 같은 한자어예요."},{"t":"{背|せ}{負|お}って","p":"동사","m":"짊어지고","b":"{背|せ}{負|お}う","bm":"짊어지다, 업다","w":"背(등)+負う(지다)의 동사예요. 어간은 한자, って는 히라가나.","n":"背負う = 등에 지다. 期待を背負う = 기대를 짊어지다. 여기서는 を가 생략됐어요."},{"t":"{立|た}って","p":"동사","m":"서서","b":"{立|た}つ","bm":"서다","n":"〜を背負って立つ = '~을 짊어지고 서다' → '~을 떠맡다'라는 관용 표현이기도 해요."}],"ko":"기대를 짊어지고 서서","lit":"기대 / (를) / 짊어지고 / 서서","g":[{"k":"〜を{背|せ}{負|お}って{立|た}つ","d":"'~을 짊어지고 서다' → '~을 떠맡다'. 日本を背負って立つ = 일본의 미래를 짊어지다."},{"k":"조사 생략","d":"期待(を)背負って처럼 を가 생략됐어요."}],"c":"고교 선수들은 학교, 지역, 가족의 기대를 한 몸에 받아요. 고시엔에는 지역 대표가 나가기 때문에 고향 전체의 응원을 짊어지는 무게가 있어요."},{"id":"f4","tk":[{"t":"{重|おも}さ","p":"명사","m":"무게","b":"{重|おも}さ","w":"重い(무겁다)의 어간 + 명사를 만드는 さ예요."},{"t":"に","m":"~에 (원인)"},{"t":"{臆病|おくびょう}","p":"な형용사","m":"겁이 많음","n":"臆(겁낼 억)+病(병). 글자 그대로 '겁이 많은 병'이라는 뜻이에요. 臆病者 = 겁쟁이."},{"t":"に","m":"~하게 (되다)"},{"t":"なる","p":"동사","m":"되다","w":"なる(되다)는 기본 동사라 히라가나로 써요."},{"t":"けど"}],"ko":"그 무게에 겁이 나기도 하지만","lit":"무게 / 에 / 겁 많음 / 이 / 되다 / 지만","g":[{"k":"な형용사 + になる","d":"'~해지다'. 臆病 → 臆病になる(겁이 많아지다)."}],"s":"熱さ·汗·重さ처럼 몸의 감각을 나타내는 말이 Cメロ 내내 이어져요. 기대라는 보이지 않는 것을 '무게'라는 몸의 감각으로 바꿔 말해요."},{"id":"f5","tk":[{"t":"{僕|ぼく}ら"},{"t":"の"},{"t":"{背番号|せばんごう}","p":"명사","m":"등번호","n":"背(등)+番号(번호). 야구에서 1번은 에이스 투수, 2번은 포수처럼 번호가 포지션을 상징해요. 고교야구에서는 등번호를 받는 것 자체가 큰 의미예요."}],"ko":"우리의 등번호","lit":"우리 / 의 / 등번호","c":"고교야구에서는 정해진 인원만 등번호를 받아 벤치에 들어갈 수 있어서, 등번호는 노력의 증표이자 선택받은 무게예요."},{"id":"f6","tk":[{"t":"それ"},{"t":"は"},{"t":"{背中|せなか}","p":"명사","m":"등"},{"t":"じゃなく","p":"조동사(부정)","m":"~이 아니라","b":"ではない","w":"문법 요소라 히라가나로 써요.","n":"じゃなくて에서 て가 빠진 형태로, 문장을 다음 줄로 이어요."}],"ko":"그건 등이 아니라","lit":"그것 / 은 / 등 / 이 아니라","g":[{"k":"AじゃなくB","d":"'A가 아니라 B'. 背中じゃなく瞳の奥の… = 등이 아니라 눈동자 깊은 곳의…. 다음 줄까지 이어서 읽어요."}]},{"id":"f7","tk":[{"t":"{瞳|ひとみ}","p":"명사","m":"눈동자","n":"目(め, 눈)보다 시적인 말이에요. 가사에서 '눈빛, 눈망울'을 말할 때 자주 써요."},{"t":"の"},{"t":"{奥|おく}","p":"명사","m":"깊은 곳, 안쪽","n":"奥는 '안쪽 깊숙한 곳'. 心の奥(마음 깊은 곳)."},{"t":"の"},{"t":"アンサー","p":"명사","m":"대답, 답","w":"영어 answer를 옮긴 외래어라 가타카나예요. 일본어 答え(대답)가 있는데도 외래어를 골라, 노래다운 리듬과 세련된 느낌을 냈어요."},{"t":"　"},{"t":"{重|かさ}なって","p":"동사","m":"겹쳐져","b":"{重|かさ}なる","bm":"겹치다, 포개지다","w":"어간 重는 한자, なって는 히라가나예요.","n":"같은 重를 앞 줄에서는 おも(重さ, 무게), 여기서는 かさ(重なる, 겹치다)로 읽어요. 한 한자가 여러 쿤요미를 가진 예예요."}],"ko":"눈동자 깊은 곳의 대답이 겹쳐져","lit":"눈동자 / 의 / 깊은 곳 / 의 / 대답 / 겹쳐져","s":"重さ(おもさ)와 重なって(かさなって). 같은 한자 重가 가까운 줄에서 다른 읽기로 나와요. 루비를 확인하며 읽어 보세요.","c":"등번호는 등에 붙어 있는 게 아니라 눈동자 깊은 곳에 있다는 말이에요. 번호가 아니라 각자가 품은 '답', 왜 이걸 하는지에 대한 마음이 진짜 등번호라는 뜻이에요."},{"id":"f8","tk":[{"t":"{照|て}らし{合|あ}ってく","p":"동사","m":"서로 비춰 가는","b":"{照|て}らし{合|あ}う","bm":"서로 비추다","w":"照らす(비추다)+合う(서로 ~하다)의 복합동사에 〜てく(~해 가다)가 붙었어요. 어간은 한자, 나머지는 히라가나예요.","n":"동사 ます형 + 合う = '서로 ~하다'. 助け合う(서로 돕다), 見つめ合う(서로 바라보다)."},{"t":"FOREVER","p":"부사(영어)","m":"영원히","w":"영어를 대문자 알파벳 그대로 썼어요. 가타카나 フォーエバー가 아니라 대문자로 써서, 외치듯 힘이 실린 느낌을 줘요."}],"ko":"서로를 비춰 가, 영원히(FOREVER)","lit":"서로 비춰 가다 / 영원히","g":[{"k":"〜{合|あ}う","d":"동사 ます형 + 合う = '서로 ~하다'. 照らす → 照らし合う(서로 비추다)."},{"k":"〜てく","d":"〜ていく(~해 가다)의 회화체예요."}],"s":"이 곡에서 알파벳으로 쓴 영어는 FOREVER 하나예요. 그것도 대문자라서 가장 크게 외치는 말처럼 보여요.","c":"각자의 눈 속에 있는 '답'이 겹쳐지고 서로를 비춰 준다는 장면이에요. 팀은 등번호가 아니라 같은 마음으로 이어진다는 뜻이에요."}]},{"label":"Dメロ · 마지막 후렴 전","note":"불안을 이겨 내고 마지막 후렴으로 달려가는 부분이에요.","lines":[{"id":"g1","tk":[{"t":"{緊張|きんちょう}","p":"명사","m":"긴장","n":"한국어 '긴장(緊張)'과 같은 한자어예요."},{"t":"から"},{"t":"{不安|ふあん}","p":"명사","m":"불안","n":"한국어 '불안(不安)'과 같은 한자어예요."},{"t":"が"},{"t":"{芽|め}{生|ば}えて","p":"동사","m":"싹터서","b":"{芽|め}{生|ば}える","bm":"싹트다","w":"芽(싹)+生える(나다)가 합쳐진 동사예요. 어간은 한자, えて는 히라가나.","n":"生える(はえる)의 は가 앞말과 합쳐지며 ば로 탁해졌어요(렌다쿠). 恋が芽生える(사랑이 싹트다)처럼 감정에도 써요."}],"ko":"긴장에서 불안이 싹터서","lit":"긴장 / 에서 / 불안 / 이 / 싹터서","c":"불안을 식물처럼 그려요. 긴장이라는 씨앗에서 싹이 트고(芽生えて), 다음 줄에서 뿌리를 내려요."},{"id":"g2","tk":[{"t":"{根|ね}","p":"명사","m":"뿌리"},{"t":"を"},{"t":"{張|は}る","p":"동사","m":"뻗다, 펼치다","n":"根を張る = 뿌리를 내리다(뻗다). 張る는 줄·천 등을 팽팽하게 펼치는 것이에요."},{"t":"みたいに","p":"조동사","m":"~처럼, ~하듯이","b":"みたいだ","n":"みたいだ(~같다)의 부사형이에요. 〜みたいに = '~처럼'."}],"ko":"뿌리를 내리듯이","lit":"뿌리 / 를 / 뻗다 / 처럼","g":[{"k":"〜みたいに","d":"동사·명사 + みたいに = '~처럼, ~하듯이'. 根を張るみたいに = 뿌리내리듯이."}]},{"id":"g3","tk":[{"t":"{僕|ぼく}ら"},{"t":"を"},{"t":"{支配|しはい}する","p":"동사","m":"지배하다","b":"{支配|しはい}する","w":"한자어 支配는 한자, する는 히라가나예요.","n":"한자어 명사 + する = 동사. 支配(지배) + する = 지배하다. 한국어 '~하다'와 똑같은 구조예요."}],"ko":"우리를 지배하는","lit":"우리 / 를 / 지배하다","g":[{"k":"한자어 + する","d":"한자어 명사에 する를 붙이면 동사가 돼요. 支配する(지배하다), 期待する(기대하다). 한국어 '~하다'와 같아요."}]},{"id":"g4","tk":[{"t":"そんな"},{"t":"もの","p":"형식명사","m":"것","w":"'것'이라는 뜻의 형식명사라 히라가나로 써요. 눈에 보이는 물건이라는 뜻일 때는 物로 써요."},{"t":"に","m":"~에게"}],"ko":"그딴 것에","lit":"그런 / 것 / 에게","c":"そんなもの(그런 것)는 상대를 깎아내리는 말투예요. 불안을 '그딴 것'으로 낮춰 부르며 맞설 준비를 해요."},{"id":"g5","tk":[{"t":"{負|ま}けて","p":"동사","m":"져서","b":"{負|ま}ける","bm":"지다","w":"어간 負는 한자, けて는 히라가나예요."},{"t":"たまるか","p":"표현","m":"~할까 보냐","w":"'참을 수 있겠냐'는 관용 표현이라 히라가나로 써요. 한자 堪る는 거의 쓰지 않아요.","n":"〜てたまるか = '~해서 되겠냐, 절대 ~하지 않겠다'. 負けてたまるか = 질 수는 없지!"},{"t":"と","m":"~라고 (인용)"}],"ko":"질까 보냐 하고","lit":"져서 / 참을 수 있겠냐 / 라고","g":[{"k":"〜てたまるか","d":"동사 て형 + たまるか = '~할까 보냐, 절대 ~ 못 하지'. 강한 반발과 결의를 나타내요."}],"c":"負けてたまるか는 스포츠 만화나 드라마에서 주인공이 이를 악물고 외치는 대표적인 대사예요."},{"id":"g6","tk":[{"t":"{今|いま}","p":"명사","m":"지금"},{"t":"　"},{"t":"{宿命|しゅくめい}"},{"t":"って"},{"t":"やつ"},{"t":"を"}],"ko":"지금, 숙명이라는 녀석을","lit":"지금 / 숙명 / 이라는 / 녀석 / 을","c":"후렴의 宿命ってやつを 앞에 今(지금)를 붙였어요. 후렴에서는 다짐이었던 말이 여기서는 '지금 이 순간'의 행동이 돼요."},{"id":"g7","tk":[{"t":"{燃|も}やして"},{"t":"　"},{"t":"{暴|あば}れ{出|だ}す"}],"ko":"불태워서 날뛰기 시작해","lit":"불태워서 / 날뛰기 시작한다","c":"후렴의 暴れ出すだけなんだ(날뛸 뿐이야)와 달리, 여기서는 だけなんだ 없이 暴れ出す로 끊어요. 다짐이 아니라 지금 바로 행동으로 옮기는 순간이에요."},{"id":"g8","tk":[{"t":"{届|とど}け"},{"t":"!"}],"ko":"닿아라!","lit":"닿아라!","c":"1절 Bメロ의 僕らの想い 届け!가 짧게 다시 나와요. 이 외침을 신호로 마지막 후렴이 시작돼요."}]},{"label":"ラストサビ · 마지막 후렴","note":"1절 후렴과 가사가 같아요. 각 줄을 열면 앞의 해석을 그대로 볼 수 있어요.","lines":[{"same":"c1"},{"same":"c2"},{"same":"c3"},{"same":"c4"},{"same":"c5"},{"same":"c6"},{"same":"c7"},{"same":"c8"}]},{"label":"アウトロ · 마무리","note":"숙명을 '불태우던' 후렴에서, 숙명을 '치켜들고' 맞서는 결말로 끝나요.","lines":[{"id":"h1","tk":[{"t":"ただ"},{"t":"{宿命|しゅくめい}"},{"t":"って"},{"t":"やつ"},{"t":"を"},{"t":"かざして","p":"동사","m":"높이 치켜들고","b":"かざす","bm":"(높이) 치켜들다, 내걸다","w":"한자 翳す가 있지만 조요칸지가 아니라 히라가나로 써요.","n":"かざす는 손이나 물건을 높이 들어 보이는 것이에요. 깃발을 내걸 듯 숙명을 높이 치켜든다는 이미지예요."}],"ko":"그저 숙명이라는 녀석을 높이 치켜들고","lit":"그저 / 숙명 / 이라는 / 녀석 / 을 / 치켜들고","c":"후렴에서는 숙명을 '불태웠는데(燃やして)', 마지막에는 '치켜들어요(かざして)'. 숙명을 연료로 쓰던 데서, 이제는 깃발처럼 앞세우고 나아가요."},{"id":"h2","tk":[{"t":"{立|た}ち{向|む}かう","p":"동사","m":"맞서다","w":"立つ(서다)+向かう(향하다)의 복합동사예요. 어간은 한자, 활용 부분은 히라가나예요.","n":"立ち向かう = (어려움·적에) 맞서다. 困難に立ち向かう = 어려움에 맞서다."},{"t":"だけ"},{"t":"なんだ"}],"ko":"맞서 나갈 뿐이야","lit":"맞서다 / 뿐 / 인 거야","c":"곡은 '날뛸 뿐이야'가 아니라 '맞설 뿐이야'로 끝나요. 숙명과 싸우는 게 아니라, 숙명을 안고 앞을 향해 서는 결말이에요."}]}]},"laughter":{"id":"laughter","title":"Laughter","artist":"Official髭男dism","year":2020,"eyebrow":"Official髭男dism · 2020","sub":"새장 같은 거리를 떠나 '웃음'이라는 이름의 새로 날아오르는 노래. 영화 「コンフィデンスマンJP プリンセス編」 주제가.","release":"2020년 7월 선행 디지털 발매 · 『HELLO EP』(2020년 8월 5일) 수록","tieIn":"영화 「コンフィデンスマンJP プリンセス編」(2020) 주제가","lyricist":"藤原聡","composer":"藤原聡","listen":"https://www.youtube.com/results?search_query=Official%E9%AB%AD%E7%94%B7dism+Laughter","intro":"Laughter는 2020년 7월에 먼저 디지털로 공개되고, 8월 5일 발매된 『HELLO EP』에 실린 곡이에요. 사기꾼들의 활약을 그린 영화 「コンフィデンスマンJP プリンセス編」의 주제가예요. 히게단은 드라마판의 ノーダウト, 첫 영화의 Pretender에 이어 이 시리즈의 노래를 세 번째로 맡았어요.\n\n곡의 주인공은 쇠창살 같은 거리에 갇혀 있던 새예요. 거울을 봐도 깃털 하나 보이지 않고, 세상은 '정말 날 수 있나요?'라고 묻지만, 새는 Yes도 No도 말하지 않고 하늘만 바라봐요. 그 새의 이름이 '웃음'이라는 뜻의 ラフター(Laughter)예요. 새장, 날개, 바람, 폭우로 이어지는 비유를 따라가며 읽어 보세요.","notes":[{"tag":"배경","title":"「コンフィデンスマンJP」와 히게단","body":"「コンフィデンスマンJP」는 2018년 드라마로 시작한 코미디 시리즈예요. 사기꾼 세 사람이 욕심 많은 악당을 속여 넘기는 이야기로, 제목의 コンフィデンスマン은 영어 confidence man(신용 사기꾼)에서 왔어요.\n\n히게단은 이 시리즈의 노래를 세 번 맡았어요. 드라마의 ノーダウト(2018), 첫 영화 「ロマンス編」의 Pretender(2019), 그리고 두 번째 영화 「プリンセス編」의 Laughter(2020)예요. 「プリンセス編」은 코로나19 확산으로 개봉이 미뤄졌다가 2020년 7월 23일에 개봉했어요.\n\n藤原聡는 이 곡을 '영화의 세계관과 이어지면서, 자기답게 살아가는 것, 나에게 소중한 것과 함께 인생을 걸어가는 것의 멋짐을 노래한 곡'이라고 소개했어요. Pretender가 이뤄지지 않는 사랑을 연극에 빗댄 노래였다면, Laughter는 새장을 부수고 날아가는 새의 노래예요."},{"tag":"표현","title":"새장을 부순 새","body":"이 곡은 처음부터 끝까지 새의 비유로 이어져요. 1절에서는 거울 속에서 [[{羽|は}{根|ね}]](깃털)을 찾다가 [[{鉄|てつ}{格|ごう}{子|し}みたいな{街|まち}]](쇠창살 같은 거리)를 떠나기로 해요. 후렴에서는 [[{翼|つばさ}]](날개)가 움직이냐는 물음 끝에 [[ケージ]](새장)를 부숴요.\n\n2절에서는 거센 바람에 떠밀려 다른 새의 [[{航|こう}{路|ろ}]](항로)로 잘못 들어서고, [[{乱|らん}{気|き}{流|りゅう}]](난기류) 속에서 빛을 찾아요. 브리지에서는 전례 없는 폭우 속에서 [[{羽|は}ばたいて]](날갯짓해) 앞길을 향해요.\n\n거울을 들여다보는 사람이 곧 새라는 점에서, 새는 화자 자신으로 읽혀요. 쇠창살 같은 거리는 나를 붙잡아 두는 익숙한 환경, 새장을 부수는 건 그곳을 떠나는 결심으로 볼 수 있어요. 그 새의 이름이 '웃음'이라는 뜻의 ラフター라는 것도 함께 기억해 두세요."},{"tag":"표현","title":"Yes도 No도: 묻는 목소리와 대답하지 않는 새","body":"후렴은 정중한 질문으로 시작해요. 1절은 [[{翼|つばさ}は{動|うご}きますか？{本|ほん}{当|とう}に{飛|と}べますか？]](날개는 움직이나요? 정말 날 수 있나요?), 2절은 [[{現|げん}{実|じつ}は{見|み}えますか？{保|ほ}{証|しょう}は{出|で}{来|き}ますか？]](현실은 보이나요? 보장할 수 있나요?)예요. 이 곡에서 〜ます 정중체는 이 질문들에만 나와요. 그래서 반말로 노래하는 '나'와 달리, 거리를 두고 묻는 다른 목소리처럼 들려요.\n\n대답도 1절과 2절이 달라요. 1절은 [[{言|い}わずに]](말하지 않고), 2절은 [[{言|い}えずに]](말하지 못하고)예요. 言わない는 '안 말한다', 言えない는 가능형 言える의 부정이라 '못 말한다'예요. わ와 え 한 글자로, 일부러 대답하지 않는 지금의 새와 대답이 막혔던 과거의 내가 갈려요.\n\nYes와 No는 알파벳으로 썼어요. 일본에서도 [[イエスかノーか]](예스냐 노냐)처럼 일상에서 쓰는 말이라, 딱 잘라 대답하라는 압박이 그대로 느껴져요."},{"tag":"문화","title":"気持ちだけ受け取る: 마음만 받을게","body":"일본에서는 호의나 선물을 정중하게 사양할 때 [[お{気|き}{持|も}ちだけいただきます]](마음만 받겠습니다)라고 말해요. 상대의 마음은 고맙게 받되 물건이나 제안은 받지 않겠다는 뜻이에요. 한국어 '마음만 받을게'와 거의 같은 말이라 쓰임도 비슷해요.\n\n1절의 [[それを{引|ひ}き{留|と}める{言|こと}{葉|ば}も　{気|き}{持|も}ちだけ{受|う}け{取|と}るよ]]는 이 표현을 빌린 말이에요. 떠나지 말라는 말에 화를 내지도, 흔들리지도 않고 마음만 받아 둬요. 바로 이어지는 [[どうも{有|あり}{難|がと}う]](정말 고마워)까지, 정중하지만 단호한 작별이에요."},{"tag":"문화","title":"有難う: '있기 어렵다'에서 온 고마움","body":"ありがとう는 형용사 [[{有|あ}り{難|がた}い]]에서 왔어요. 글자 그대로 '있기(有) 어렵다(難)', 곧 '드물다'는 뜻이었고, 드물고 귀한 일이라는 데서 '고맙다'로 뜻이 넓어졌어요. ありがたく의 소리가 바뀌어 ありがとう가 됐어요.\n\n요즘 일상 글에서는 히라가나 ありがとう가 더 흔해요. 이 곡은 한자 有難う로 써서 그 원래 뜻이 글자에 그대로 남아 있어요.\n\n앞에 붙은 [[どうも]]는 '정말, 참'이라는 부사예요. どうも만 말해도 '고마워요', '안녕하세요', '죄송해요'를 대신할 수 있어서, 일본에서 가장 편하게 쓰는 인사말 중 하나예요."},{"tag":"표기","title":"같은 한자 抱의 세 가지 읽기","body":"한자 抱(안을 포)는 곡마다 다르게 읽혀 왔어요.\n\n[[{抱|だ}きしめて]](꼭 끌어안아): Pretender. 팔로 꼭 안는 だく예요.\n\n[[{抱|かか}えて]](감싸 안고, 떠안고): らしさ. 이 곡의 [[{膝|ひざ}を{抱|かか}えた]](무릎을 끌어안은)도 같은 かかえる예요.\n\n[[{抱|いだ}き]](마음에 품고): 이 곡의 [[そんな{希|き}{望|ぼう}{抱|いだ}き]](그런 희망을 품고). 꿈이나 희망, 의문 같은 마음을 품을 때는 いだく로 읽어요.\n\n세 읽기 모두 '안는다'는 뜻이에요. だく는 몸으로 안고, かかえる는 팔 안에 감싸 들고, いだく는 마음속에 품어요. 한자 하나에 읽기가 여럿이라 처음엔 어렵지만, 곡을 따라가며 만나면 문맥으로 고르는 감이 생겨요."},{"tag":"표기","title":"이 곡의 가타카나·알파벳·한자","body":"**가타카나**: [[ラフター]]·[[ケージ]]·[[ゴール]]·[[サーチライト]]는 모두 영어에서 온 외래어예요. 제목은 알파벳 Laughter인데 가사 속 새의 이름은 가타카나 ラフター로 썼어요. 같은 말을 제목에서는 영어 글자로, 노래 속에서는 일본어 소리로 보여 주는 셈이에요.\n\n**알파벳**: 대답을 뜻하는 Yes·No만 알파벳 그대로 썼어요. 가타카나 イエス·ノー로 쓰지 않아서 '대답'이라는 말이 눈에 확 띄어요.\n\n**조요칸지 밖의 한자**: [[{覗|のぞ}く]]의 覗, [[{囀|さえず}り]]의 囀는 일상 글에 쓰도록 정한 조요칸지 목록에 없는 글자예요. 히라가나로 써도 되는 말을 한자로 썼어요. Pretender의 綺麗처럼 히게단 가사에는 이런 한자가 종종 나와요.\n\n**한자와 히라가나를 고른 곳**: 형식명사 こと는 1절에서는 한자 [[{事|こと}]], 2절에서는 히라가나 [[こと]]예요. 보통 히라가나로 쓰는 ありがとう·ある는 [[{有|あり}{難|がと}う]]·[[{在|あ}りたい]]처럼 한자로 써서 원래 뜻을 살렸어요. 반대로 一つ는 히라가나 [[ひとつ]], 掛ける는 [[かけた]]로 풀었어요."}],"dict":{"{自|じ}{分|ぶん}":{"p":"명사","m":"자기, 나","w":"'자기 자신'을 뜻하는 한자어예요.","n":"自分은 '자기'라는 뜻인데, 회화에서는 '나'를 가리킬 때도 많이 써요. 自分で = 스스로."},"{鳥|とり}":{"p":"명사","m":"새","n":"鳥(새 조)는 새의 모습을 본뜬 한자예요. 이 곡은 처음부터 끝까지 새의 비유로 이어져요."},"{空|そら}":{"p":"명사","m":"하늘","n":"空는 から(빈), くう(공)로도 읽어요. 空っぽ(からっぽ) = 텅 빔."},"{今|いま}":{"p":"명사","m":"지금"},"{中|なか}":{"p":"명사","m":"안, 속","n":"中(가운데 중)를 쿤요미로 なか라고 읽어요. 鏡の中 = 거울 속."},"{声|こえ}":{"p":"명사","m":"목소리","n":"声는 聲(소리 성)의 일본식 약자예요. 歌声(うたごえ) = 노랫소리."},"{光|ひかり}":{"p":"명사","m":"빛","w":"동사 光る(ひかる, 빛나다)의 명사형인데, 명사로 쓸 때는 오쿠리가나 없이 光 한 글자로 써요.","n":"光(빛 광)는 한국어 '광선(光線)', '관광(觀光)'의 光예요."},"{正|ただ}しさ":{"p":"명사","m":"올바름","b":"{正|ただ}しい","bm":"올바르다","w":"正는 한자, しさ는 히라가나예요. 형용사 正しい의 い를 さ로 바꾼 명사예요.","n":"正しい(올바르다) → 正しさ(올바름). らしさ(~다움)와 같은 방법으로 만든 명사예요."},"ラフター":{"p":"명사(외래어)","m":"래프터, 웃음 (새의 이름)","w":"영어 laughter(웃음)를 가타카나로 옮긴 외래어예요. 제목은 알파벳 Laughter, 가사 속 새의 이름은 가타카나 ラフター예요.","n":"laughter는 laugh(웃다)의 명사형이에요. 일본어로 '웃음'은 笑い(わらい)인데, 일상에서 ラフター라는 말은 거의 쓰지 않아서 새의 이름처럼 들려요."},"Yes":{"p":"감동사(영어)","m":"예","w":"영어 yes를 알파벳 그대로 썼어요.","n":"일본어로는 はい예요. 가타카나로는 イエス라고 써요."},"No":{"p":"감동사(영어)","m":"아니요","w":"영어 no를 알파벳 그대로 썼어요.","n":"일본어로는 いいえ예요. 가타카나로는 ノー라고 써요."},"もの":{"p":"형식명사","m":"것","w":"'것'이라는 뜻의 형식명사라 히라가나로 써요."},"そんな":{"p":"연체사","m":"그런","w":"こんな(이런)·そんな(그런)·あんな(저런)는 지시어라 히라가나로 써요."},"ため":{"p":"형식명사","m":"~하기 위함","w":"'위함'을 뜻하는 형식명사라 히라가나로 써요. 한자 為로도 쓰지만 드물어요."},"の":{"p":"조사","m":"~의"},"は":{"p":"조사","m":"~은/는 (주제)","n":"조사로 쓸 때는 wa로 읽어요."},"が":{"p":"조사","m":"~이/가"},"を":{"p":"조사","m":"~을/를","n":"발음은 お(o)와 같아요."},"に":{"p":"조사","m":"~에"},"も":{"p":"조사","m":"~도"},"や":{"p":"조사","m":"~이나 (나열)","n":"몇 가지를 예로 들어 늘어놓을 때 써요. AやB = A나 B (말고도 더)."},"で":{"p":"조사","m":"~에서, ~로"},"よ":{"p":"조사(종조사)","m":"~야 (알려 주는 말투)","n":"문장 끝에 붙어 '내가 말해 줄게'라는 느낌을 더해요."},"か":{"p":"조사(종조사)","m":"~까 (질문)"},"けど":{"p":"조사","m":"~지만"},"だった":{"p":"조동사","m":"~였다","n":"だ(~이다)의 과거형이에요."},"でも":{"p":"조사(복합)","m":"~도 (AでもBでもない)","n":"で(~이다) + も(~도). AでもBでもない = A도 B도 아니다."},"では":{"p":"조사(복합)","m":"~이/가 (ではない)","n":"では는 dewa로 읽어요. ではない = ~이 아니다."},"なく":{"p":"조동사(부정)","m":"~아니고","b":"ない"},"なくて":{"p":"조동사(부정)","m":"~아니라, ~아니고","b":"ない"},"よりも":{"p":"조사(복합)","m":"~보다도","n":"비교의 より(~보다) + 강조의 も. 誰よりも = 누구보다도."},"だけ":{"p":"조사","m":"~만, ~뿐"}},"sections":[{"label":"1절 · Aメロ","note":"거울 속에서 날개깃을 찾던 '나'가 쇠창살 같은 거리를 떠나기로 결심해요. 붙잡는 말에는 고마움만 전하고요.","lines":[{"id":"a1","tk":[{"t":"{鏡|かがみ}","p":"명사","m":"거울","n":"鏡(거울 경)는 眼鏡(めがね, 안경)에도 들어 있는 한자예요."},{"t":"の"},{"t":"{中|なか}"},{"t":"を"},{"t":"{覗|のぞ}いても","p":"동사","m":"들여다봐도","b":"{覗|のぞ}く","bm":"들여다보다, 엿보다","w":"어간 覗는 한자, いても는 히라가나예요. 覗는 조요칸지(일상 글에 쓰도록 정한 한자 목록)에 없는 글자라 のぞく로 풀어 쓰는 일도 많은데, 가사에서는 한자로 썼어요.","n":"覗く는 틈이나 구멍, 거울처럼 좁은 곳을 들여다볼 때 써요. 窓を覗く = 창문을 들여다보다."},{"t":"　"},{"t":"{羽|は}{根|ね}","p":"명사","m":"깃털","w":"羽(깃 우)와 根(뿌리 근)를 합쳐 '깃털'을 나타내요. 羽 한 글자로도 はね라고 읽어요.","n":"羽根는 빠진 깃털 하나나 배드민턴 셔틀콕, 선풍기 날개처럼 '깃 모양의 것'에 많이 써요. 새에 달린 날개는 羽나 翼(つばさ)라고 해요."},{"t":"ひとつ","p":"명사","m":"하나","b":"{一|ひと}つ","bm":"하나","w":"一つ로 쓸 수 있는데 히라가나로 풀었어요. Pretender의 ひとり처럼, 숫자보다 '단 하나'라는 느낌을 살리는 표기로 볼 수 있어요."},{"t":"も"},{"t":"{見|み}つからない","p":"동사","m":"찾을 수 없다, 보이지 않는다","b":"{見|み}つかる","bm":"발견되다, 찾게 되다","w":"어간 見는 한자, つからない는 히라가나예요.","n":"見つかる(발견되다, 자동사)와 見つける(찾아내다, 타동사)는 짝이에요."},{"t":"けど"}],"ko":"거울 속을 들여다봐도 깃털 하나 보이지 않지만","lit":"거울 / 의 / 속 / 을 / 들여다봐도 / 깃털 / 하나 / 도 / 발견되지 않는다 / 지만","g":[{"k":"〜ても","d":"'~해도'. 동사 て형 + も. 覗いても = 들여다봐도, 探しても = 찾아도. 뒤에는 기대와 다른 결과가 와요."},{"k":"ひとつも + 부정","d":"'하나도 ~않다'. ひとつも見つからない = 하나도 찾지 못한다. 一人も(한 명도), 少しも(조금도)도 같은 틀이에요."}],"s":"어려운 覗는 조요칸지 밖의 글자인데도 한자로 쓰고, 쉬운 一つ는 오히려 히라가나 ひとつ로 풀었어요. 한 줄 안에 두 방향의 표기 선택이 같이 있어요.","c":"거울 속 자신에게서 깃털을 찾는다는 건, 거울을 보는 '나'가 곧 새라는 뜻으로 읽혀요. 날 수 있다는 증거가 하나도 없는 상태에서 곡이 시작해요."},{"id":"a2","tk":[{"t":"{空|そら}"},{"t":"を"},{"t":"{待|ま}ち{焦|こ}がれた","p":"동사","m":"애타게 기다린","b":"{待|ま}ち{焦|こ}がれる","bm":"애타게 기다리다","w":"待·焦 두 한자에 각각 오쿠리가나가 붙은 복합동사예요.","n":"待つ(기다리다) + 焦がれる(애태우다, 그리워하다). 焦는 らしさ의 焦る(あせる, 조급해하다), 焦げる(こげる, 타다)에도 쓰는 한자예요."},{"t":"　"},{"t":"{鳥|とり}"},{"t":"の","m":"~이/가 (꾸미는 말 속의 주어)"},{"t":"{急|せ}かす","p":"동사","m":"재촉하다","w":"어간 急는 한자, かす는 히라가나예요. 急를 いそぐ(서두르다)가 아니라 せかす로 읽는 말이에요.","n":"急かす = 남을 서두르게 하다. 急(급할 급)는 急ぐ(いそぐ, 서두르다), 急に(きゅうに, 갑자기)로도 읽어요."},{"t":"ような","p":"조동사","m":"~같은, ~하는 듯한","n":"ようだ(~같다)가 명사를 꾸밀 때의 모양이에요."},{"t":"{囀|さえず}り","p":"명사","m":"(새의) 지저귐","w":"囀는 조요칸지에 없는 어려운 글자라 さえずり로 히라가나로 쓰는 일도 많은데, 가사에서는 한자로 썼어요.","n":"囀る(さえずる, 지저귀다)의 명사형이에요. 왼쪽에 口(입 구)가 붙어 있어서 소리와 관련된 글자라는 게 보여요."},{"t":"が"},{"t":"{聞|き}こえる","p":"동사","m":"들리다","w":"어간 聞는 한자, こえる는 히라가나예요.","n":"聞く(듣다)는 일부러 듣는 것, 聞こえる(들리다)는 저절로 귀에 들어오는 것이에요. 見る(보다)와 見える(보이다)도 같은 짝이에요."}],"ko":"하늘을 애타게 기다려 온 새가 재촉하듯 지저귀는 소리가 들려","lit":"하늘 / 을 / 애타게 기다린 / 새 / 가 / 재촉하다 / 같은 / 지저귐 / 이 / 들리다","g":[{"k":"명사を{待|ま}ち{焦|こ}がれる","d":"'~을 애타게 기다리다'. 과거형 待ち焦がれた가 명사 鳥를 꾸며요. 空を待ち焦がれた鳥 = 하늘을 애타게 기다린 새."},{"k":"꾸미는 말 속의 の = が","d":"명사를 꾸미는 절 안에서는 주어의 が를 の로 바꾸는 일이 많아요. 鳥が急かす → 鳥の急かすような囀り(새가 재촉하는 듯한 지저귐)."},{"k":"〜ような + 명사","d":"'~같은, ~하는 듯한'. 夢のような話 = 꿈 같은 이야기."}],"s":"앞 줄의 覗에 이어 囀도 조요칸지 밖의 글자예요. Pretender의 綺麗처럼, 히게단 가사에는 히라가나로 써도 될 말을 이런 한자로 쓰는 곳이 종종 있어요.","c":"하늘을 애타게 기다린 새는 아직 날지 못한 내 안의 마음으로 읽을 수 있어요. 그 새가 '빨리 가자'고 재촉하는 소리가 들리기 시작한 거예요."},{"id":"a3","tk":[{"t":"{鉄|てつ}{格|ごう}{子|し}","p":"명사","m":"쇠창살","w":"鉄(쇠)와 格子(격자)를 합친 한자어예요.","n":"格子(こうし)는 한국어 '격자(格子)'와 같은 한자어인데, 鉄 뒤에서 こ가 ご로 흐려져 てつごうし가 돼요. 이렇게 뒷말 첫소리가 탁해지는 걸 連濁(れんだく)라고 해요."},{"t":"みたいな","p":"조동사","m":"~같은","n":"みたいだ(~같다)가 명사를 꾸밀 때의 모양이에요. 앞 줄의 ような와 뜻이 같고 더 회화적이에요."},{"t":"{街|まち}","p":"명사","m":"거리, 동네","n":"まち는 町로도 쓰는데, 街는 상점과 건물이 늘어선 번화한 거리라는 느낌이에요."},{"t":"を"},{"t":"{抜|ぬ}け{出|だ}す","p":"동사","m":"빠져나가다","w":"抜·出 두 한자에 오쿠리가나가 붙은 복합동사예요.","n":"抜ける(빠지다) + 出す(내다) = 빠져나오다. 出す가 뒤에 붙으면 だす로 흐려져요."},{"t":"{事|こと}","p":"형식명사","m":"것, 일","w":"형식명사 こと는 보통 히라가나로 쓰는데, 여기서는 한자 事로 썼어요. 2절의 迷い込むこともある에서는 히라가나 こと예요."},{"t":"に"},{"t":"{決|き}めた","p":"동사","m":"정했다","b":"{決|き}める","bm":"정하다","w":"어간 決는 한자, めた는 히라가나예요.","n":"決める(정하다, 타동사)와 決まる(정해지다, 자동사)는 짝이에요. 한국어 '결정(決定)'의 決예요."},{"t":"よ"},{"t":"　"},{"t":"{今|いま}"}],"ko":"쇠창살 같은 이 거리를 빠져나가기로 정했어, 지금","lit":"쇠창살 / 같은 / 거리 / 를 / 빠져나가다 / 것 / 으로 / 정했다 / 야 / 지금","g":[{"k":"〜{事|こと}に{決|き}める","d":"'~하기로 정하다'. 동사 사전형 + ことに決める. 行く事に決めた = 가기로 했어. ことにする도 비슷한 뜻이에요."},{"k":"〜みたいな + 명사","d":"'~같은'. ような보다 말하듯 편한 말투예요. 夢みたいな話 = 꿈같은 이야기."}],"s":"형식명사 こと를 한자 事로 썼어요. 같은 곡의 2절에는 히라가나 こと가 나와서, 한 곡 안에서 두 표기를 모두 볼 수 있어요.","c":"今(지금)를 문장 맨 끝에 따로 붙여 '바로 지금'을 강조했어요. 鉄格子(쇠창살)라는 말로 내가 사는 거리를 새장처럼 그려요."},{"id":"a4","tk":[{"t":"それ","p":"대명사","m":"그것 (떠나는 일)","w":"こ·そ·あ·ど 지시어라 히라가나로 써요."},{"t":"を"},{"t":"{引|ひ}き{留|と}める","p":"동사","m":"붙잡다, 만류하다","w":"引·留 두 한자에 오쿠리가나가 붙은 복합동사예요.","n":"引く(끌다) + 留める(머물게 하다). 떠나려는 사람을 말이나 손으로 붙잡는 거예요."},{"t":"{言|こと}{葉|ば}","p":"명사","m":"말","n":"言(말씀 언) + 葉(잎 엽). 일본에서는 옛 시(와카) 시절부터 말을 '言の葉(말의 잎)'라고 불러 왔어요."},{"t":"も"},{"t":"　"},{"t":"{気|き}{持|も}ち","p":"명사","m":"마음, 기분","w":"気(기운 기)는 한자, 持ち는 持つ(가지다)의 명사형이라 오쿠리가나 ち가 붙어요.","n":"気持ち = 마음, 기분. 気持ちいい = 기분 좋다."},{"t":"だけ"},{"t":"{受|う}け{取|と}る","p":"동사","m":"받다","w":"受·取 두 한자에 오쿠리가나가 붙은 복합동사예요.","n":"受ける(받다) + 取る(잡다) = 받아 들다. 荷物を受け取る = 짐을 받다."},{"t":"よ"}],"ko":"날 붙잡는 말도, 마음만 받아 둘게","lit":"그것 / 을 / 붙잡다 / 말 / 도 / 마음 / 만 / 받다 / 야","g":[{"k":"{気|き}{持|も}ちだけ{受|う}け{取|と}る","d":"'마음만 받다'. 호의는 고맙게 받되 그 내용은 사양할 때 쓰는 정중한 표현이에요."}],"c":"일본에서는 선물이나 호의를 사양할 때 お気持ちだけいただきます(마음만 받겠습니다)라고 말해요. 떠나지 말라는 말에 고마움만 받고 결심은 바꾸지 않겠다는 뜻이에요. 다음 줄의 どうも有難う로 이어져요."},{"id":"a5","tk":[{"t":"どうも","p":"부사","m":"정말, 참","w":"부사라 히라가나로 써요.","n":"どうも만 말해도 '고마워요', '안녕하세요', '죄송해요'를 대신할 수 있는 만능 인사말이에요."},{"t":"{有|あり}{難|がと}う","p":"감동사","m":"고마워","w":"보통 히라가나 ありがとう로 쓰는 말을 한자 有難う로 썼어요. 有(있을 유)·難(어려울 난)이 보여서 원래 뜻 '있기 어렵다'가 드러나요.","n":"有り難い(ありがたい)는 '있기 어렵다' → '드물다' → '드물 만큼 고맙다'로 뜻이 바뀐 말이에요. ありがたく의 소리가 바뀌어 ありがとう가 됐어요."}],"ko":"정말 고마워","lit":"정말 / 고마워","s":"ありがとう를 한자 有難う로 썼어요. 요즘 일상 글에서는 히라가나가 더 흔해서, 한자 표기가 오히려 눈에 띄어요.","c":"작별 인사를 짧게 끝내요. 앞 줄의 '마음만 받을게'에 이어지는, 떠나는 사람의 정중한 마무리예요."}]},{"label":"1절 · Bメロ","note":"떠나면서 잃는 것들을 저울질했고, 스스로 골랐으니 후회할 권리마저 버렸다고 말해요.","lines":[{"id":"b1","tk":[{"t":"{失|うしな}う","p":"동사","m":"잃다","w":"어간 失는 한자, う는 히라가나예요.","n":"한국어 '실(失)'과 같은 한자예요. 失敗(しっぱい, 실패), 失恋(しつれん, 실연)."},{"t":"もの"},{"t":"や"},{"t":"　"},{"t":"{諦|あきら}める","p":"동사","m":"포기하다, 단념하다","w":"어간 諦는 한자, める는 히라가나예요.","n":"諦めない(포기하지 않아)는 응원할 때 자주 쓰는 말이에요. 諦는 2010년에 조요칸지에 새로 들어간 글자예요."},{"t":"もの"},{"t":"は"}],"ko":"잃게 될 것도, 포기해야 할 것도","lit":"잃다 / 것 / 이나 / 포기하다 / 것 / 은","g":[{"k":"동사 사전형 + もの","d":"'~하는 것'. 동사가 그대로 명사 もの를 꾸며요. 失うもの = 잃는 것, 諦めるもの = 포기하는 것."}],"c":"새장을 나가는 데에는 대가가 따라요. 익숙한 거리, 붙잡던 사람들, 안정된 생활 같은 것들이 그 '것'으로 읽혀요."},{"id":"b2","tk":[{"t":"{確|たし}かに","p":"부사","m":"확실히, 분명","b":"{確|たし}か","bm":"확실함","w":"確는 한자, か는 오쿠리가나, 부사를 만드는 に는 히라가나예요.","n":"確か(확실함, な형용사) + に = 확실히. 確かに!는 '맞아, 그렇네!'라는 맞장구로도 많이 써요."},{"t":"どれ","p":"대명사","m":"어느 것","w":"こ·そ·あ·ど 지시어라 히라가나로 써요."},{"t":"も","m":"~나 (どれも = 모두)"},{"t":"{輝|かがや}いて","p":"동사","m":"빛나서","b":"{輝|かがや}く","bm":"빛나다","w":"어간 輝는 한자, いて는 히라가나예요.","n":"輝(빛날 휘)는 반짝반짝 빛나는 모습이에요. 光(ひかり)가 '빛' 자체라면 輝く는 '빛나다'예요."},{"t":"{見|み}える","p":"동사","m":"보이다","w":"어간 見는 한자, える는 히라가나예요."},{"t":"けど"}],"ko":"분명 하나같이 빛나 보이지만","lit":"확실히 / 어느 것 / 이나 / 빛나서 / 보이다 / 지만","g":[{"k":"〜て{見|み}える","d":"'~해 보이다'. 輝いて見える = 빛나 보이다. 형용사는 く형 + 見える(若く見える = 젊어 보이다)."},{"k":"どれも","d":"'어느 것이나, 모두'. 誰も(누구나), いつも(언제나)처럼 의문사 + も = 모두."}],"c":"버리고 가는 것들이 하나같이 빛나 보인다는 솔직한 고백이에요. 미련이 없는 척하지 않아요."},{"id":"b3","tk":[{"t":"{秤|はかり}","p":"명사","m":"저울","n":"秤는 무게를 다는 저울이에요. 양쪽 접시에 올려 비교하는 천칭은 天秤(てんびん)이라고 해요."},{"t":"に"},{"t":"かけた","p":"동사","m":"(저울에) 달았다","b":"かける","bm":"걸다, 달다","w":"掛ける로도 쓰지만 히라가나로 풀었어요. かける는 뜻이 아주 많은 기본 동사라 히라가나로 쓰는 일이 많아요."},{"t":"　"},{"t":"{自|じ}{分|ぶん}"},{"t":"で","m":"~가 직접, ~의 힘으로"},{"t":"{選|えら}んだ","p":"동사","m":"골랐다","b":"{選|えら}ぶ","bm":"고르다, 선택하다","w":"어간 選는 한자, んだ는 히라가나예요.","n":"選ぶ의 た형은 ぶ가 んだ로 바뀌어 選んだ예요. 遊ぶ → 遊んだ, 飛ぶ → 飛んだ도 같아요."}],"ko":"저울에 달아 보고, 내 손으로 골랐어","lit":"저울 / 에 / 달았다 / 자기 / 로 / 골랐다","g":[{"k":"{秤|はかり}にかける","d":"'저울에 달다' → '(둘을) 비교해 따져 보다'. 天秤にかける라고도 해요. 仕事と家族を天秤にかける = 일과 가족을 저울질하다."},{"k":"{自|じ}{分|ぶん}で","d":"'스스로, 내 힘으로'. 自分で選んだ = 내가 직접 골랐다."}],"c":"잃을 것과 얻을 것을 저울에 달아 본 끝에 스스로 고른 길이라는 말이에요. 남이 시킨 게 아니라는 점이 다음 줄로 이어져요."},{"id":"b4","tk":[{"t":"{悔|く}やむ","p":"동사","m":"후회하다, 분해하다","w":"어간 悔는 한자, やむ는 히라가나예요.","n":"悔는 한국어 '후회(後悔)'의 悔예요. 悔しい(くやしい, 분하다)도 같은 한자예요."},{"t":"{権|けん}{利|り}","p":"명사","m":"권리","n":"한국어 '권리(權利)'와 같은 한자어예요. 権은 權의 일본식 약자예요."},{"t":"も","m":"~마저, ~도"},{"t":"{捨|す}て{去|さ}ってた","p":"동사","m":"버려 두었어","b":"{捨|す}て{去|さ}る","bm":"떨쳐 버리다","w":"捨·去 두 한자에 오쿠리가나가 붙은 복합동사예요.","n":"捨てる(버리다) + 去る(떠나다) = 남김없이 버리다. 捨て去ってた는 捨て去っていた에서 い가 빠진 회화체예요."}],"ko":"후회할 권리마저 진작 버려 두었어","lit":"후회하다 / 권리 / 도 / 버려 버렸었다","g":[{"k":"〜てた (〜ていた의 줄임)","d":"捨て去っていた → 捨て去ってた. 회화에서는 ている·ていた의 い를 자주 빼요. 사비의 見てた, 2절의 響いてた도 같은 모양이에요."}],"c":"스스로 골랐으니 나중에 후회할 자격도 없다고 미리 각오를 다지는 말이에요. らしさ의 本気で勝負だ(진심으로 승부다)와도 닮은 각오예요."}]},{"label":"サビ · 후렴","note":"정말 날 수 있느냐는 물음에 대답 대신 하늘을 봐요. 새의 이름이 ラフター라는 게 처음 밝혀져요.","lines":[{"id":"c1","tk":[{"t":"{翼|つばさ}","p":"명사","m":"날개","n":"翼(날개 익)는 비행기 날개에도 써요. 羽(はね)가 깃털이나 날개 전반이라면, 翼는 날기 위한 큰 날개라는 느낌이에요."},{"t":"は"},{"t":"{動|うご}きます","p":"동사","m":"움직입니다","b":"{動|うご}く","bm":"움직이다","w":"어간 動는 한자, きます는 히라가나예요.","n":"動く(움직이다, 자동사)와 動かす(움직이게 하다, 타동사)는 짝이에요."},{"t":"か"},{"t":"？"},{"t":"{本|ほん}{当|とう}に","p":"부사","m":"정말로","b":"{本|ほん}{当|とう}","bm":"진짜, 사실","w":"本当(진짜)은 한자어, 부사를 만드는 に는 히라가나예요."},{"t":"{飛|と}べます","p":"동사","m":"날 수 있습니다","b":"{飛|と}ぶ","bm":"날다","w":"어간 飛는 한자, べます는 히라가나예요.","n":"飛ぶ의 가능형 飛べる(날 수 있다) + ます예요. Pretender의 飛行機(ひこうき, 비행기)에도 같은 飛가 들어 있어요."},{"t":"か"},{"t":"？"}],"ko":"날개는 움직이나요? 정말 날 수 있나요?","lit":"날개 / 는 / 움직입니다 / 까 / 정말로 / 날 수 있습니다 / 까","g":[{"k":"〜ますか","d":"'~합니까?'. 정중체 ます + 질문의 か. 이 곡에서 ます가 나오는 건 후렴의 질문들뿐이에요."},{"k":"5단 동사 가능형","d":"끝소리를 え단으로 바꾸고 る를 붙여요. 飛ぶ → 飛べる(날 수 있다), 書く → 書ける(쓸 수 있다)."}],"s":"일본어는 か만으로도 질문이 돼서 딱딱한 글에서는 물음표를 생략하기도 해요. 가사에서는 전각 ？를 붙여 묻는 말투를 또렷하게 했어요.","c":"반말로 이어지던 곡에 갑자기 정중한 질문이 나와요. 내가 나에게 묻는 말로도, 의심하는 세상이 묻는 말로도 읽혀요. 배경·문화 노트 'Yes도 No도'에서 더 자세히 다뤄요."},{"id":"c2","tk":[{"t":"Yes"},{"t":"も"},{"t":"No"},{"t":"も"},{"t":"{言|い}わずに","p":"동사","m":"말하지 않고","b":"{言|い}う","bm":"말하다","w":"어간 言는 한자, わずに는 히라가나예요.","n":"ずに는 '~하지 않고'의 글말이에요. 言う → 言わない → 言わずに. 회화에서는 言わないで라고도 해요."},{"t":"{真|ま}っ{直|す}ぐに","p":"부사","m":"곧게, 똑바로","b":"{真|ま}っ{直|す}ぐ","bm":"곧음, 똑바름","w":"真(참 진)·直(곧을 직) 두 한자 사이에 작은 っ와 ぐ가 끼어 있어요. 히라가나만으로 まっすぐ라고 쓰는 일도 많아요.","n":"真っ〜는 '완전히, 아주'를 더하는 말이에요. 真っ白(새하얀), 真っ赤(새빨간), 真っ暗(캄캄한)."},{"t":"{空|そら}"},{"t":"を"},{"t":"{見|み}てた","p":"동사","m":"보고 있었어","b":"{見|み}る","bm":"보다","w":"어간 見는 한자, てた는 히라가나예요.","n":"見ていた의 い가 빠진 회화체예요."}],"ko":"Yes도 No도 말하지 않고 똑바로 하늘만 보고 있었어","lit":"Yes / 도 / No / 도 / 말하지 않고 / 똑바로 / 하늘 / 을 / 보고 있었다","kr":"예스모 노-모 이와즈니 맛스구니 소라오 미테타","g":[{"k":"〜ずに","d":"'~하지 않고'. 동사 ない형에서 ない를 빼고 ずに를 붙여요. 言わずに(말하지 않고), 食べずに(먹지 않고). する는 せずに."},{"k":"AもBも","d":"'A도 B도'. 부정과 함께 쓰면 '둘 다 아니다'. YesもNoも言わずに = 예도 아니요도 말하지 않고."}],"s":"Yes와 No를 가타카나 イエス·ノー가 아니라 알파벳으로 썼어요. 대답 자체를 영어 글자 그대로 보여 줘서, 질문에 대한 '답'이라는 게 한눈에 들어와요.","c":"질문에 말로 대답하는 대신 하늘을 보는 것으로 답해요. 날 수 있느냐는 물음에 날아서 보여 주겠다는 태도로 읽을 수 있어요."},{"id":"c3","tk":[{"t":"{鳥|とり}"},{"t":"の"},{"t":"{名|な}{前|まえ}","p":"명사","m":"이름","n":"名(이름 명) + 前(앞 전). お名前は? = 성함이 어떻게 되세요?"},{"t":"は"},{"t":"ラフター"},{"t":"　"},{"t":"ケージ","p":"명사(외래어)","m":"새장, 우리","w":"영어 cage(새장, 우리)를 가타카나로 옮긴 외래어예요.","n":"일본어로 새장은 鳥籠(とりかご)라고도 해요. 1절의 鉄格子(쇠창살)가 이 ケージ로 이어져요."},{"t":"を"},{"t":"{壊|こわ}した","p":"동사","m":"부쉈어","b":"{壊|こわ}す","bm":"부수다, 망가뜨리다","w":"어간 壊는 한자, した는 히라가나예요.","n":"壊す(부수다, 타동사)와 壊れる(부서지다, 자동사)는 짝이에요. 壊는 한국어 '파괴(破壞)'의 壞를 줄인 일본식 약자예요."}],"ko":"그 새의 이름은 Laughter, 새장을 부숴 버렸어","lit":"새 / 의 / 이름 / 은 / 래프터 / 새장 / 을 / 부쉈다","s":"ラフター·ケージ 둘 다 영어에서 온 외래어라 가타카나예요. 제목은 알파벳 Laughter인데 가사 속 새 이름은 가타카나 ラフター로 썼어요. 같은 말을 제목에서는 영어 글자로, 노래 속에서는 일본어 소리로 부르는 셈이에요.","c":"드디어 새의 이름이 나와요. laughter는 '웃음'이라는 뜻이에요. 1절에서 쇠창살 같은 거리를 빠져나가기로 한 결심이 여기서 새장을 부수는 장면이 돼요."},{"id":"c4","tk":[{"t":"Yes"},{"t":"でも"},{"t":"No"},{"t":"でも"},{"t":"なくて"},{"t":"　"},{"t":"{飛|と}びたい","p":"동사","m":"날고 싶다","b":"{飛|と}ぶ","bm":"날다","w":"어간 飛는 한자, びたい는 히라가나예요.","n":"동사 ます형 + たい = ~하고 싶다. 飛びます → 飛びたい."},{"t":"と","p":"조사","m":"~라고 (인용)"},{"t":"はしゃいでる","p":"동사","m":"들떠 떠드는","b":"はしゃぐ","bm":"신나서 떠들다, 들뜨다","w":"한자(燥ぐ)가 있긴 하지만 거의 쓰지 않아서 히라가나로 써요.","n":"아이들이 신나서 소리치며 뛰노는 모습에 자주 써요. はしゃいでる는 はしゃいでいる의 い가 빠진 모양이에요."},{"t":"{声|こえ}"},{"t":"だけで","p":"조사(복합)","m":"~만으로","n":"だけ(~만) + で(~로) = ~만으로. 声だけで = 목소리만으로."}],"ko":"Yes도 No도 아니라, 날고 싶다고 들떠 외치는 목소리 하나로","lit":"Yes / 도 / No / 도 / 아니고 / 날고 싶다 / 라고 / 들떠 떠드는 / 목소리 / 만으로","kr":"예스데모 노-데모나쿠테 토비타이토 하샤이데루 코에다케데","g":[{"k":"〜たい","d":"'~하고 싶다'. 동사 ます형 + たい. 飛びたい(날고 싶다), 会いたい(만나고 싶다). い형용사처럼 활용해요."},{"k":"AでもBでもなくて","d":"'A도 B도 아니고'. 앞 줄의 YesもNoも를 받아서, 대답은 둘 다 아니라 '날고 싶다'는 외침이라고 말해요."}],"c":"논리적인 대답 대신 아이처럼 들뜬 목소리가 날개가 된다는 그림이에요. 새의 이름이 '웃음'인 것과도 이어져요."},{"id":"c5","tk":[{"t":"{膝|ひざ}","p":"명사","m":"무릎","n":"膝는 2010년에 조요칸지에 새로 들어간 글자예요. 膝を抱える = 무릎을 끌어안다."},{"t":"を"},{"t":"{抱|かか}えた","p":"동사","m":"끌어안은","b":"{抱|かか}える","bm":"끌어안다, 떠안다","w":"어간 抱는 한자, えた는 히라가나예요.","n":"らしさ의 抱えて와 같은 かかえる예요. 2절 Bメロ의 希望抱き에서는 같은 抱를 いだく로 읽어요."},{"t":"{昨日|きのう}","p":"명사","m":"어제","w":"한자 하나하나가 아니라 단어 전체에 きのう라는 읽기가 붙은 주쿠지쿤이에요.","n":"한자어로 읽으면 さくじつ인데, 뉴스나 편지에 쓰는 딱딱한 말이에요."},{"t":"までの","p":"조사(복합)","m":"~까지의"},{"t":"{自|じ}{分|ぶん}"},{"t":"を"}],"ko":"무릎을 끌어안고 있던 어제까지의 나를","lit":"무릎 / 을 / 끌어안은 / 어제 / 까지의 / 나 / 를","g":[{"k":"{膝|ひざ}を{抱|かか}える","d":"'무릎을 끌어안다'. 무릎을 세우고 두 팔로 감싸 웅크린 자세예요. 외로움이나 의기소침한 모습을 나타낼 때 자주 써요."},{"k":"〜までの + 명사","d":"'~까지의'. 昨日までの自分 = 어제까지의 나. 駅までの道 = 역까지 가는 길."}],"c":"웅크리고 앉아 있던 어제의 나와, 하늘을 나는 오늘의 새가 대비돼요. 문장은 다음 줄의 乗り越えた(넘어선)로 이어져요."},{"id":"c6","tk":[{"t":"{乗|の}り{越|こ}えた","p":"동사","m":"넘어선, 극복한","b":"{乗|の}り{越|こ}える","bm":"넘어서다, 극복하다","w":"乗·越 두 한자에 오쿠리가나가 붙은 복합동사예요.","n":"乗る(타다) + 越える(넘다) = 타고 넘다 → 어려움을 극복하다. 壁を乗り越える = 벽을 넘어서다."},{"t":"ラフター"},{"t":"　"},{"t":"{今日|きょう}","p":"명사","m":"오늘","w":"단어 전체에 きょう라는 읽기가 붙은 주쿠지쿤이에요."},{"t":"も"},{"t":"{歌|うた}い{続|つづ}けた","p":"동사","m":"계속 노래했어","b":"{歌|うた}い{続|つづ}ける","bm":"계속 노래하다","w":"歌·続 두 한자에 오쿠리가나가 붙은 복합동사예요.","n":"동사 ます형 + 続ける = 계속 ~하다. 走り続ける = 계속 달리다."}],"ko":"어제의 나를 넘어선 Laughter, 오늘도 노래를 이어 갔어","lit":"넘어선 / 래프터 / 오늘 / 도 / 계속 노래했다","g":[{"k":"ます형 + {続|つづ}ける","d":"'계속 ~하다'. 歌い続けた = 계속 노래했다. 반대로 ます형 + やめる는 '~하기를 그만두다'."}],"c":"'넘어선 ラフター'라고 명사로 한 번 끊고 다음 말로 넘어가요. 과거형 続けた라서, 날아오른 뒤로 하루하루 노래를 이어 왔다는 느낌이 나요."},{"id":"c7","tk":[{"t":"{自|じ}{分|ぶん}{自|じ}{身|しん}","p":"명사","m":"자기 자신","n":"自分(자기) + 自身(자신)을 겹쳐 '바로 나 자신'을 강조한 말이에요. 한국어 '자기 자신'과 같은 구조예요."},{"t":"に"},{"t":"{勝|しょう}{利|り}","p":"명사","m":"승리","n":"한국어 '승리(勝利)'와 같은 한자어예요."},{"t":"を"},{"t":"{告|つ}げる","p":"동사","m":"알리다, 고하다","w":"어간 告는 한자, げる는 히라가나예요.","n":"告(고할 고)는 告白(こくはく, 고백)의 告예요. 告げる는 '분명히 전하다'라는 글말이에요."},{"t":"ため"},{"t":"の"},{"t":"{歌|うた}","p":"명사","m":"노래"}],"ko":"나 자신에게 승리를 알리기 위한 노래","lit":"자기 자신 / 에게 / 승리 / 를 / 알리다 / 위함 / 의 / 노래","g":[{"k":"〜ための + 명사","d":"'~하기 위한 (명사)'. らしさ의 僕が僕であるための要素에도 나온 틀이에요."}],"c":"이기는 상대는 남이 아니라 어제의 나예요. 그래서 승리를 알리는 대상도 '나 자신'이에요."}]},{"label":"2절 · Aメロ","note":"거센 바람과 난기류 속에서 길을 잃기도 하지만, 가짜일지라도 나만의 올바름을 만들어 가겠다고 해요.","lines":[{"id":"d1","tk":[{"t":"{本|ほん}{当|とう}","p":"명사","m":"진짜, 참","n":"本当の = 진짜의. 사비의 本当に(정말로)와 같은 말이에요."},{"t":"の"},{"t":"{正|ただ}しさ"},{"t":"って","p":"조사","m":"~라는 (회화체)","n":"って는 という(~라는)나 と(~라고)의 회화체예요. 正しさってもの = 正しさというもの(올바름이라는 것)."},{"t":"もの"},{"t":"を"},{"t":"　"},{"t":"{風|かぜ}","p":"명사","m":"바람"},{"t":"の"},{"t":"{強|つよ}さ","p":"명사","m":"세기, 강함","b":"{強|つよ}い","bm":"강하다","w":"強는 한자, 명사를 만드는 さ는 히라가나예요.","n":"い형용사의 い를 さ로 바꾸면 명사가 돼요. 強い → 強さ, 正しい → 正しさ."},{"t":"に","m":"~에게 (당하는 상대)"},{"t":"{問|と}い{詰|つ}められて","p":"동사","m":"추궁당해","b":"{問|と}い{詰|つ}める","bm":"캐묻다, 추궁하다","w":"問·詰 두 한자에 오쿠리가나가 붙은 복합동사예요.","n":"問う(묻다) + 詰める(몰아붙이다) = 끝까지 캐묻다. 問い詰められて는 수동형(~당하다) + て예요."}],"ko":"진짜 올바름이란 게 뭐냐고 거센 바람에 추궁당하고","lit":"진짜 / 의 / 올바름 / 이라는 / 것 / 을 / 바람 / 의 / 세기 / 에게 / 추궁당해서","g":[{"k":"い형용사 → 〜さ","d":"い를 さ로 바꾸면 '~함'이라는 명사가 돼요. 正しい → 正しさ, 強い → 強さ. らしさ의 らしい → らしさ와 같은 방법이에요."},{"k":"수동형 〜られる","d":"'~당하다'. 問い詰める → 問い詰められる(추궁당하다). 당하는 상대는 に로 나타내요. 風の強さに = 바람의 세기에게."}],"c":"날아오른 뒤에 만나는 시련을 바람으로 그려요. '진짜 올바름이 뭐냐'는 물음은 남들이 정해 둔 정답을 따르라는 압박으로도 읽혀요."},{"id":"d2","tk":[{"t":"{行|ゆ}く","p":"동사","m":"가다","b":"{行|い}く","bm":"가다","w":"어간 行는 한자, く는 히라가나예요. 行く는 いく와 ゆく 두 가지로 읽어요.","n":"ゆく는 いく보다 예스럽고 글말 느낌이 있어서 노래나 시에 자주 나와요."},{"t":"べき","p":"조동사","m":"~해야 할","n":"べき = 마땅히 ~해야 할. 守るべきもの = 지켜야 할 것."},{"t":"{道|みち}","p":"명사","m":"길"},{"t":"を"},{"t":"{逸|そ}れて","p":"동사","m":"벗어나","b":"{逸|そ}れる","bm":"빗나가다, 벗어나다","w":"어간 逸는 한자, れて는 히라가나예요. 逸는 보통 いつ로 읽는 한자인데, 여기서는 それる로 읽어요.","n":"逸れる는 원래 가려던 방향에서 빗나가는 거예요. 話が逸れる = 이야기가 딴 데로 새다. 히라가나로 それる라고 쓰는 일도 많아요."},{"t":"　"},{"t":"{他|ほか}","p":"명사","m":"다른 (것)","n":"他는 ほか와 た 두 가지로 읽어요. 他の = 다른."},{"t":"の"},{"t":"{鳥|とり}"},{"t":"の"},{"t":"{航|こう}{路|ろ}","p":"명사","m":"항로","n":"한국어 '항로(航路)'와 같은 한자어예요. 배나 비행기가 다니는 길이에요."},{"t":"へ","p":"조사","m":"~로 (방향)","n":"조사로 쓸 때는 e로 읽어요."},{"t":"{迷|まよ}い{込|こ}む","p":"동사","m":"잘못 들어서다, 헤매어 들어가다","w":"迷·込 두 한자에 오쿠리가나가 붙은 복합동사예요.","n":"迷う(헤매다) + 込む(안으로 들어가다) = 길을 잃고 엉뚱한 곳에 들어서다."},{"t":"こと","p":"형식명사","m":"일, 경우","w":"형식명사라 히라가나로 써요. 1절의 抜け出す事에서는 한자 事였어요."},{"t":"も"},{"t":"ある","p":"동사","m":"있다","w":"ある(있다)는 보통 히라가나로 써요."}],"ko":"가야 할 길을 벗어나 다른 새의 항로로 잘못 들어설 때도 있어","lit":"가다 / 해야 할 / 길 / 을 / 벗어나서 / 다른 / 의 / 새 / 의 / 항로 / 로 / 잘못 들어서다 / 일 / 도 / 있다","g":[{"k":"〜べき + 명사","d":"'~해야 할 (명사)'. 行くべき道 = 가야 할 길. する는 すべき로도 써요."},{"k":"〜こともある","d":"'~할 때도 있다'. 동사 사전형 + こともある. 失敗することもある = 실패할 때도 있다."}],"s":"1절의 한자 事와 달리 여기서는 형식명사 こと를 히라가나로 썼어요. 逸れる는 히라가나로 쓰는 일도 많은 말인데 한자로 썼어요.","c":"다른 새의 항로는 남의 인생, 남이 정한 성공의 길로 읽을 수 있어요. 바람에 떠밀려 나답지 않은 길로 들어서는 순간도 있다고 솔직하게 말해요."},{"id":"d3","tk":[{"t":"{乱|らん}{気|き}{流|りゅう}","p":"명사","m":"난기류","n":"한국어 '난기류(亂氣流)'와 같은 한자어예요. 乱은 亂, 気는 氣의 일본식 약자예요."},{"t":"の"},{"t":"{中|なか}"},{"t":"で"},{"t":"さざめく","p":"동사","m":"일렁이다, 술렁이다","w":"보통 히라가나로 쓰는 동사예요.","n":"원래 여럿이 웅성웅성 떠드는 소리를 뜻해요. 가사에서는 빛 알갱이들이 반짝이며 일렁이는 모습을 이렇게 표현했어요."},{"t":"　"},{"t":"{光|ひかり}"},{"t":"の"},{"t":"{粒|つぶ}","p":"명사","m":"알갱이","n":"粒는 쌀알이나 빗방울처럼 작고 동그란 알갱이예요. 一粒(ひとつぶ) = 한 알."},{"t":"を"},{"t":"{探|さが}して","p":"동사","m":"찾아","b":"{探|さが}す","bm":"찾다","w":"어간 探는 한자, して는 히라가나예요.","n":"探す는 갖고 싶은 것을 찾을 때, 捜す는 잃어버린 것을 찾을 때 많이 써요. 둘 다 さがす예요."},{"t":"　"},{"t":"ほら","p":"감동사","m":"봐, 자","w":"감탄사라 히라가나로 써요.","n":"상대의 눈길을 끌 때 하는 말이에요. ほら、見て = 봐, 저거 봐."}],"ko":"난기류 속에서 일렁이는 빛 알갱이를 찾아, 봐","lit":"난기류 / 의 / 속 / 에서 / 일렁이다 / 빛 / 의 / 알갱이 / 를 / 찾아서 / 봐","g":[{"k":"〜で (장소)","d":"동작이 일어나는 장소를 나타내요. 乱気流の中で = 난기류 속에서. 무엇이 '있는' 장소에는 に를 써요(中にいる)."}],"s":"さざめく·ほら처럼 소리를 살린 말은 히라가나, 乱気流·光·粒처럼 뜻이 무거운 말은 한자예요.","c":"거센 기류 속에서도 작은 빛을 찾는 모습이에요. 끝의 ほら(봐)는 듣는 사람에게 그 빛을 가리켜 보이는 것처럼 들려요."},{"id":"d4","tk":[{"t":"たとえ","p":"부사","m":"설령, 비록","w":"부사라 히라가나로 써요. 한자 仮令로 쓰기도 하지만 드물어요.","n":"たとえ〜ても / たとえ〜としても = 설령 ~라 해도. 뒷말과 짝으로 외워요."},{"t":"{紛|まが}い{物|もの}","p":"명사","m":"가짜, 모조품","w":"紛(어지러울 분)를 まがう로 읽는 말에 物가 붙었어요. 히라가나로 まがいもの라고도 써요.","n":"紛う(まがう)는 '헷갈릴 만큼 닮다'. 紛い物 = 진짜와 헷갈리게 만든 가짜예요. 같은 紛를 紛れる(まぎれる, 섞여 들다)로도 읽어요."},{"t":"だった"},{"t":"としても","p":"조사(복합)","m":"~라고 해도"},{"t":"　"},{"t":"{自|じ}{分|ぶん}"},{"t":"にとっての","p":"조사(복합)","m":"~에게 있어서의","n":"にとって(~에게 있어서) + の. 自分にとっての正しさ = 나에게 있어서의 올바름."},{"t":"{正|ただ}しさ"},{"t":"を"}],"ko":"설령 가짜였다고 해도, 나에게 맞는 올바름을","lit":"설령 / 가짜 / 였다 / 라고 해도 / 나 / 에게 있어서의 / 올바름 / 을","g":[{"k":"たとえ〜としても","d":"'설령 ~라고 해도'. たとえ雨でも行く = 설령 비가 와도 간다. としても 대신 ても도 써요."},{"k":"〜にとっての + 명사","d":"'~에게 있어서의 (명사)'. 私にとっての幸せ = 나에게 있어서의 행복."}],"c":"1행의 '진짜 올바름'과 맞서는 줄이에요. 남들이 보기엔 가짜라도 내가 만든 올바름을 택하겠다는 말로 읽혀요."},{"id":"d5","tk":[{"t":"{創|そう}{造|ぞう}して","p":"동사","m":"창조해, 만들어","b":"{創|そう}{造|ぞう}する","bm":"창조하다","w":"한자어 創造에 する가 붙은 동사예요.","n":"한국어 '창조(創造)'와 같은 한자어예요. 같은 소리의 想像(そうぞう, 상상)과 헷갈리기 쉬워요."},{"t":"みる","p":"보조동사","m":"~해 보다","w":"'보다'의 見る가 '~해 보다'로 쓰일 때는 보통 히라가나로 써요.","n":"동사 て형 + みる = 시험 삼아 ~해 보다. 食べてみる = 먹어 보다."},{"t":"よ"},{"t":"　"},{"t":"{大|だい}{事|じ}","p":"な형용사","m":"소중함","n":"大事는 '소중함, 중요함'. 大丈夫(だいじょうぶ)처럼 大를 だい로 읽어요. お大事に는 아픈 사람에게 하는 '몸조리 잘하세요'예요."},{"t":"に","m":"~하게 (な형용사 + に)"},{"t":"する","p":"동사","m":"하다","w":"する는 기본 동사라 히라가나로 써요."},{"t":"よ"}],"ko":"직접 만들어 볼게, 소중히 할게","lit":"창조해 / 보다 / 야 / 소중함 / 하게 / 하다 / 야","g":[{"k":"〜てみる","d":"'~해 보다'. 創造してみる = 만들어 보다. 확실하지 않아도 일단 해 보겠다는 느낌이에요."},{"k":"な형용사 + にする","d":"'~하게 하다, ~히 여기다'. 大事にする = 소중히 하다, 綺麗にする = 깨끗하게 하다."}],"s":"創造(そうぞう)는 想像(そうぞう, 상상)과 소리가 완전히 같아요. 귀로만 들으면 '상상해 볼게'로도 들리지만, 한자가 '만들어 낸다'는 뜻으로 정해 줘요.","c":"〜よ로 끝나는 짧은 다짐 두 개를 나란히 둬서, 스스로에게 하는 약속처럼 들려요."}]},{"label":"2절 · Bメロ","note":"훌륭한 사람이 아니라 '지금'을 자랑할 수 있는 사람이 되고 싶다는 소박한 바람이에요.","lines":[{"id":"e1","tk":[{"t":"{人|じん}{格|かく}{者|しゃ}","p":"명사","m":"인격자, 인품이 훌륭한 사람","n":"人格(인격) + 者(사람). 人을 じん으로 읽는 한자어예요."},{"t":"では"},{"t":"なく"},{"t":"　"},{"t":"{成|せい}{功|こう}{者|しゃ}","p":"명사","m":"성공한 사람","n":"成功(성공) + 者. 한국어 '성공(成功)'과 같은 한자예요."},{"t":"でも"},{"t":"なく"}],"ko":"훌륭한 인격자도 아니고, 성공한 사람도 아니고","lit":"인격자 / 이 / 아니고 / 성공자 / 도 / 아니고","g":[{"k":"AではなくBでもなく","d":"'A도 아니고 B도 아니고'. ない의 연용형 なく로 문장을 이어 가요. 회화에서는 じゃなくて를 많이 써요."}],"s":"人格者·成功者처럼 〜者(しゃ, ~한 사람)가 붙은 한자어를 나란히 두었어요. 둘 다 한국어 한자음 '인격자, 성공자'와 같아서 뜻이 바로 보여요.","c":"세상이 '훌륭하다'고 부르는 두 가지 모습을 먼저 지워요. 다음 줄에서 내가 되고 싶은 사람이 나와요."},{"id":"e2","tk":[{"t":"いつでも","p":"부사","m":"언제나, 언제든지","w":"부사라 히라가나로 써요.","n":"いつ(언제) + でも = 언제든지."},{"t":"{今|いま}"},{"t":"を"},{"t":"{誇|ほこ}れる","p":"동사","m":"자랑할 수 있는","b":"{誇|ほこ}る","bm":"자랑하다","w":"어간 誇는 한자, れる는 히라가나예요.","n":"誇る의 가능형이에요. らしさ의 첫 줄 誇るよ全部(자랑할 거야, 전부)와 같은 동사예요."},{"t":"{人|ひと}","p":"명사","m":"사람"},{"t":"で","p":"조동사","m":"~으로, ~인 (である의 で)"},{"t":"{在|あ}りたい","p":"동사","m":"있고 싶다","b":"{在|あ}る","bm":"있다, 존재하다","w":"보통 히라가나로 쓰는 ある를 한자 在로 썼어요. '그런 사람으로 존재하고 싶다'는 무게를 싣는 표기예요.","n":"〜で在りたい = ~이고 싶다, ~로 있고 싶다. 在는 한국어 '존재(存在)', '재학(在學)'의 在예요."}],"ko":"언제든 지금을 자랑할 수 있는 사람이고 싶어","lit":"언제든지 / 지금 / 을 / 자랑할 수 있다 / 사람 / 으로 / 있고 싶다","g":[{"k":"〜で{在|あ}りたい","d":"'~이고 싶다, ~로 있고 싶다'. である(~이다) + たい. 正直で在りたい = 정직한 사람이고 싶다."},{"k":"5단 동사 가능형","d":"誇る → 誇れる(자랑할 수 있다). 사비의 飛ぶ → 飛べる와 같은 방법이에요."}],"s":"ある를 한자 在로 쓴 게 포인트예요. 일상에서는 히라가나 ある가 보통이라, 한자를 쓰면 '그런 존재로 있다'는 무게가 실려요.","c":"인격자도 성공자도 아닌, '지금'을 자랑할 수 있는 사람. 거창한 목표 대신 오늘을 부끄럽지 않게 사는 것을 바라는 말이에요."},{"id":"e3","tk":[{"t":"そんな"},{"t":"{希|き}{望|ぼう}","p":"명사","m":"희망","n":"한국어 '희망(希望)'과 같은 한자어예요."},{"t":"{抱|いだ}き","p":"동사","m":"품고","b":"{抱|いだ}く","bm":"(마음에) 품다","w":"어간 抱는 한자, き는 히라가나예요. 같은 抱를 だく·かかえる·いだく로 읽는데, 여기서는 いだく예요.","n":"抱く는 だく(팔로 안다)와 いだく(마음에 품다) 두 가지로 읽어요. 夢を抱く, 希望を抱く처럼 꿈이나 희망을 품을 때는 いだく예요."},{"t":"　"},{"t":"{未|み}{来|らい}{図|ず}","p":"명사","m":"미래도, 앞날의 그림","n":"未来(미래) + 図(그림). 図를 ず로 읽어요. 地図(ちず, 지도)의 図와 같아요."},{"t":"を"},{"t":"{描|えが}き","p":"동사","m":"그리며","b":"{描|えが}く","bm":"그리다","w":"어간 描는 한자, き는 히라가나예요.","n":"らしさ의 夢をちゃんと描く에서도 えがく로 읽었어요."}],"ko":"그런 희망을 품고 앞날을 그리며","lit":"그런 / 희망 / 품고 / 미래도 / 를 / 그리고","g":[{"k":"연용형으로 잇기","d":"동사 ます형(연용형)만으로 문장을 이을 수 있어요. 抱き、描き = 품고, 그리고. て형(抱いて、描いて)보다 글말 느낌이 나요."},{"k":"조사 생략","d":"希望(を)抱き에서 を가 빠졌어요. 가사나 회화에서는 조사를 자주 생략해요."}],"s":"抱를 いだく로 읽었어요. Pretender의 抱きしめて(だき), らしさ의 抱えて(かかえ), 이 곡 사비의 膝を抱えた(かかえ)에 이어 같은 한자의 또 다른 읽기예요.","c":"抱き·描き처럼 き로 끝나는 말을 나란히 두어 리듬을 맞췄어요."},{"id":"e4","tk":[{"t":"{手|て}{放|ばな}さず","p":"동사","m":"놓지 않고","b":"{手|て}{放|ばな}す","bm":"손에서 놓다, 내놓다","w":"手·放 두 한자에 오쿠리가나가 붙은 동사예요.","n":"手(손) + 放す(놓다). 放す가 뒤에 붙으면 ばなす로 흐려져요. 〜ず는 〜ずに와 같은 '~하지 않고'예요."},{"t":"{生|い}きて","p":"동사","m":"살아","b":"{生|い}きる","bm":"살다","w":"어간 生는 한자, きて는 히라가나예요."},{"t":"いたい","p":"보조동사","m":"~하고 있고 싶다","b":"いる","bm":"있다","w":"보조동사 いる는 히라가나로 써요."},{"t":"だけ"}],"ko":"놓지 않고 살아가고 싶을 뿐이야","lit":"놓지 않고 / 살아 / 있고 싶다 / 뿐","g":[{"k":"〜ず","d":"'~하지 않고'. ずに에서 に를 뺀 글말이에요. 手放さず = 놓지 않고. 사비의 言わずに와 같은 형태예요."},{"k":"〜ていたい","d":"'~하고 있고 싶다'. 生きていたい = 살아 있고
