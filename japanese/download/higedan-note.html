 공개됐고, 7월 3일 15번째 싱글로 나왔어요. 작사는 LiSA 본인, 작곡은 草野華余子, 편곡은 江口亮이에요. 그해 말 LiSA는 이 곡으로 NHK 紅白歌合戦에 처음 나갔어요.\n\n화자는 진흙투성이 기억에 굳어 가는 마음과 떨리는 손을 안고 있어요. 그래도 '강해질 수 있는 이유'를 알았다며 스스로에게 '나아가라', '피어나라' 하고 명령해요. 슬픔에게 '고마워'라고 말하는 역설, 그리고 '타고난 재능의 꽃보다 끝까지 도전해 핀 한 송이'라는 비유를 따라 읽어 보세요.","notes":[{"tag":"배경","title":"「鬼滅の刃」의 오프닝","body":"「鬼滅の刃」는 가족을 잃은 소년이 도깨비(鬼)가 된 여동생을 사람으로 되돌리려고 싸우는 이야기예요. 紅蓮華는 2019년 TV 애니메이션의 오프닝으로, 매회 시작마다 흘러나왔어요.\n\n작사는 LiSA 본인이 맡았어요. 가족을 잃은 주인공의 처지와 겹쳐 읽히는 가사라는 평이 많지만, 가사에 작품 속 이름이나 장면은 나오지 않아요. LiSA는 이듬해 극장판 「鬼滅の刃」 無限列車編의 주제가 炎(ほむら)도 불렀어요."},{"tag":"표현","title":"紅蓮, 붉은 연꽃과 불꽃","body":"[[{紅蓮|ぐれん}]]은 '붉은(紅) 연꽃(蓮)'이에요. 일본어에서는 [[{紅蓮|ぐれん}の{炎|ほのお}]](시뻘건 불꽃)처럼 타오르는 불의 색을 말할 때도 자주 써요. 제목 紅蓮華는 '붉은 연꽃의 꽃'이면서, 불꽃처럼 타오르는 꽃으로도 읽혀요.\n\n연꽃은 진흙 속에서 자라도 물들지 않고 피는 꽃으로 알려져 있어요. 곡 첫머리의 [[{泥|どろ}だらけ]](진흙투성이)와 이어서, 고된 과거를 딛고 피어나는 모습으로 읽는 해석도 있어요."},{"tag":"표기","title":"華와 花","body":"같은 はな인데 후렴은 [[{紅蓮|ぐれん}の{華|はな}]], 2절은 [[{逸材|いつざい}の{花|はな}]]예요.\n\n花는 일반적인 '꽃'이에요. 華는 華やか(화려하다), 豪華(호화)처럼 '빛나고 화려함'이 담긴 글자예요. 한국어에서도 '화려(華麗)'의 華예요.\n\n그래서 남의 재능을 가리키는 逸材の花는 평범한 花로, 스스로 피워 낸 紅蓮の華는 특별한 華로 갈라 쓴 것으로 읽혀요."},{"tag":"표기","title":"한자를 두고 가타카나로 쓴 말","body":"[[イナビカリ]](번개)는 稲光, [[トゲ]](가시)는 棘라는 한자가 있어요. 외래어도 아닌데 가타카나로 썼어요.\n\n가타카나는 글자 모양이 각지고 딱딱해서, 번쩍이는 번개나 찌르는 가시처럼 날카로운 느낌을 줄 때 쓰기도 해요. 소리 자체를 앞세우는 효과도 있어요. 반대로 [[わかってる]]는 한자 分かる를 두고 히라가나로 풀어서 혼잣말처럼 부드럽게 들려요."},{"tag":"표현","title":"명령형과 '〜よ'로 거는 주문","body":"이 곡은 자기 자신에게 명령하는 말이 많아요. [[{進|すす}め]](나아가라), [[{咲|さ}き{誇|ほこ}れ]](흐드러지게 피어라)는 동사의 명령형이에요.\n\n[[{悲|かな}しみよ]], [[{紅蓮|ぐれん}の{華|はな}よ]]의 よ는 '~여, ~아' 하고 무언가를 부르는 말이에요. 한국어 '슬픔이여'와 같은 느낌이라 노래나 시에서 자주 써요. 부르고, 명령하면서 스스로를 일으켜 세우는 노래예요."},{"tag":"표현","title":"할 수 있다(〜れる)와 당하다(〜れる)","body":"같은 〜れる·〜られる가 두 가지 뜻으로 나와요.\n\n**가능: ~할 수 있다.** [[{強|つよ}くなれる]](강해질 수 있다), [[{変|か}わっていける]](변해 갈 수 있다), [[{消|け}せない]](지울 수 없다), [[{止|と}まれない]](멈출 수 없다), [[{守|まも}れない]](지킬 수 없다).\n\n**수동: ~당하다.** [[{打|う}ちのめされて]](두들겨 맞아 쓰러지고), [[{敷|し}き{詰|つ}められた]](깔린), [[{片付|かたづ}けられた]](치워진).\n\n세상에 '당하는' 말과 스스로 '할 수 있는' 말이 맞서는 구도로 읽혀요."},{"tag":"구성","title":"영어 코러스와 다른 가사의 두 번째 후렴","body":"보내 주신 가사의 영어 코러스 두 곳([[I’ll spend all thirty nights / Staring into the sky]], [[Tell me why…]])은 가사 사이트(j-lyric)의 원문에는 실려 있지 않아요. 노래에서 겹쳐 들리는 부분이라 이 노트에서는 따로 한 줄씩 넣었어요.\n\n두 번째 후렴은 첫 후렴을 되풀이하지 않고 완전히 새 가사(逸材の花より…)로 바뀌어요. 마지막 후렴에서야 첫 후렴이 돌아오고, 運命を照らして를 한 번 더 외치며 끝나요."}],"dict":{"{僕|ぼく}":{"p":"대명사","m":"나 (남성적)","w":"1인칭 대명사로 한자로 쓰는 게 일반적이에요.","n":"여성 가수가 부르지만 가사의 1인칭은 僕예요. 일본 노래에서는 성별과 상관없이 僕를 쓰는 일이 흔해요."},"{強|つよ}く":{"p":"い형용사","m":"강하게","b":"{強|つよ}い","bm":"강하다","w":"어간 強은 한자, く는 히라가나예요."},"なれる":{"p":"동사","m":"될 수 있는","b":"なる","bm":"되다","w":"なる는 보통 히라가나로 써요.","n":"なる의 가능형이 なれる예요. 強くなれる = 강해질 수 있다."},"{知|し}った":{"p":"동사","m":"알았다","b":"{知|し}る","bm":"알다","w":"어간 知는 한자, った는 히라가나예요.","n":"知る는 る로 끝나지만 5단 동사예요. 그래서 과거형이 知った가 돼요."},"{心|こころ}":{"p":"명사","m":"마음","n":"한국어 '심(心)'과 같은 한자예요(심장 = 心臓)."},"それ":{"p":"대명사","m":"그것","w":"こ·そ·あ·ど 지시어는 히라가나로 써요."},"だけ":{"p":"조사","m":"~만, ~뿐"},"さ":{"p":"조사(종조사)","m":"~야, ~지","n":"가볍게 단정하는 말끝이에요. それだけさ = 그것뿐이야."},"{夢|ゆめ}":{"p":"명사","m":"꿈","n":"한국어 '몽(夢)'과 같은 한자예요(몽상 = 夢想)."},"{今|いま}":{"p":"명사","m":"지금"},"{誰|だれ}か":{"p":"대명사","m":"누군가","w":"誰는 한자, か는 히라가나예요.","n":"誰(누구) + か = 누군가. どこか(어딘가), 何か(무언가)와 같은 짜임이에요."},"{紅蓮|ぐれん}":{"p":"명사","m":"붉은 연꽃, 시뻘건 빛","w":"紅(붉을 홍)과 蓮(연꽃 련)을 묶어 ぐれん으로 읽어요. 紅을 く로 읽는 것도 온요미 중 하나예요(真紅 = しんく). 蓮은 조요칸지 밖의 한자예요.","n":"紅蓮の炎(시뻘건 불꽃)처럼 불의 색을 말할 때도 써요. 紅은 보통 こう(紅茶 = 홍차)로 읽어요."},"{運命|うんめい}":{"p":"명사","m":"운명","n":"한국어 '운명(運命)'과 같은 한자어예요. Pretender에도 나온 말이에요."},"{照|て}らして":{"p":"동사","m":"비춰 줘","b":"{照|て}らす","bm":"비추다","w":"어간 照는 한자, らして는 히라가나예요.","n":"〜て로 끝내면 '~해 줘'라는 부탁이 돼요. 照らす(비추다, 타동사)와 照る(빛나다, 자동사)는 짝이에요."},"だらけ":{"p":"접미사","m":"~투성이","w":"접미사라 히라가나로 써요.","n":"명사 뒤에 붙어 '그것이 잔뜩 묻은, 그것뿐인'을 뜻해요. 대개 좋지 않은 것에 써요(傷だらけ = 상처투성이)."},"もの":{"p":"형식명사","m":"것","w":"형식명사로 쓰는 もの는 보통 히라가나로 써요(물건을 뜻하면 物)."},"ある":{"p":"동사","m":"있다","w":"ある는 보통 히라가나로 써요."},"ありがとう":{"p":"감동사","m":"고마워","w":"有り難う로 쓸 수도 있지만 인사말은 보통 히라가나로 써요.","n":"有り難い(있기 어렵다 = 드물고 귀하다)에서 온 말이에요."},"どうしたって":{"p":"표현","m":"어떻게 해도, 어차피","w":"どう(어떻게) + したって(해도). 지시어 계열이라 히라가나로 써요.","n":"〜たって는 〜ても의 회화체예요. どうしても(어떻게 해서라도, 아무리 해도)와 비슷한 말이에요."},"の":{"p":"조사","m":"~의"},"は":{"p":"조사","m":"~은/는 (주제)","n":"조사로 쓸 때는 ha가 아니라 wa로 읽어요."},"が":{"p":"조사","m":"~이/가"},"を":{"p":"조사","m":"~을/를","n":"현대 일본어에서 を는 이 조사에만 쓰는 글자예요. 발음은 お(o)와 같아요."},"に":{"p":"조사","m":"~에, ~에게"},"で":{"p":"조사","m":"~에서"},"も":{"p":"조사","m":"~도"},"よ":{"p":"조사","m":"~여, ~아 (부르는 말)","n":"명사 뒤에 붙여 무언가를 부를 때 써요. 悲しみよ = 슬픔이여. 노래나 시에서 자주 쓰는 말투예요."},"から":{"p":"조사","m":"~니까"}},"sections":[{"label":"イントロ · 도입","note":"곡은 결론부터 외치며 시작해요. 강해질 수 있는 이유를 알았으니 나를 데리고 나아가라고요.","lines":[{"id":"a1","tk":[{"t":"{強|つよ}く"},{"t":"なれる"},{"t":"{理由|りゆう}","p":"명사","m":"이유","n":"한국어 '이유(理由)'와 같은 한자어예요. 由를 ゆう로 길게 읽어요."},{"t":"を"},{"t":"{知|し}った"},{"t":"　"},{"t":"{僕|ぼく}"},{"t":"を"},{"t":"{連|つ}れて","p":"동사","m":"데리고","b":"{連|つ}れる","bm":"데리고 가다","w":"어간 連은 한자, れて는 히라가나예요.","n":"連れて行く(데려가다), 連れて来る(데려오다)처럼 써요. 한국어 '연결(連結)'의 連이에요."},{"t":"{進|すす}め","p":"동사","m":"나아가라","b":"{進|すす}む","bm":"나아가다","w":"어간 進은 한자, め는 히라가나예요.","n":"進む의 명령형이 進め예요. 5단 동사는 끝 글자를 え단으로 바꾸면 명령형이 돼요(む → め)."}],"ko":"강해질 수 있는 이유를 알았어. 나를 데리고 나아가","lit":"강하게 / 될 수 있는 / 이유 / 를 / 알았다 / 나 / 를 / 데리고 / 나아가라","g":[{"k":"い형용사 く + なれる","d":"'~해질 수 있다'. 強い → 強く + なる(되다)의 가능형 なれる. 強くなれる = 강해질 수 있다."},{"k":"명령형","d":"5단 동사의 끝을 え단으로 바꾸면 명령형이에요. 進む → 進め(나아가라). 말투가 세서 일상에선 친한 사이나 구호에 써요."}],"s":"뜻을 담은 強·理由·知·僕·連·進만 한자, 나머지는 히라가나예요. 원문은 知った 뒤에 전각 공백을 두어 두 문장을 나눠요.","c":"僕を連れて進め(나를 데리고 나아가라)는 남이 아니라 자기 자신에게 하는 명령으로 읽혀요. 흔들리는 나를 강해진 내가 끌고 가는 그림이에요."}]},{"label":"1절 · Aメロ","note":"진흙투성이 기억에 마음은 굳고 손은 떨리지만, 붙잡고 싶은 게 있다는 것 하나만은 분명해요.","lines":[{"id":"b1","tk":[{"t":"{泥|どろ}","p":"명사","m":"진흙","n":"泥(진흙 니)는 한국어 '니토(泥土)'의 泥예요. 泥棒(どろぼう)는 도둑이에요."},{"t":"だらけ"},{"t":"の"},{"t":"{走馬灯|そうまとう}","p":"명사","m":"주마등","w":"走(달릴 주)·馬(말 마)·灯(등불 등)을 온요미로 읽는 한자어예요.","n":"한국어 '주마등(走馬燈)'과 같은 말이에요. 灯는 燈의 일본식 약자예요. 走馬灯のように = 주마등처럼(기억이 스쳐 지나가듯)."},{"t":"に"},{"t":"{酔|よ}う","p":"동사","m":"취하다","w":"어간 酔는 한자, う는 히라가나예요.","n":"酔う는 술에 취하다, 차멀미하다(車に酔う), 무언가에 도취하다까지 써요."},{"t":"　"},{"t":"こわばる","p":"동사","m":"굳어지다, 뻣뻣해지다","w":"強張る라는 한자 표기가 있지만 보통 히라가나로 써요.","n":"긴장해서 몸이나 표정이 굳는 걸 말해요. 顔がこわばる = 얼굴이 굳다."},{"t":"{心|こころ}"}],"ko":"진흙투성이 주마등에 취해서, 굳어 가는 마음","lit":"진흙 / 투성이 / 의 / 주마등 / 에 / 취하다 / 굳어지는 / 마음","g":[{"k":"〜だらけ","d":"'~투성이'. 명사 뒤에 붙어요. 泥だらけ = 진흙투성이. 2절의 トゲだらけ(가시투성이)도 같은 말이에요."},{"k":"동사 + 명사","d":"동사 기본형이 그대로 뒤의 명사를 꾸며요. こわばる心 = 굳어지는 마음."}],"s":"こわばる는 한자 強張る가 있지만 히라가나로 풀었어요. 뒤의 心까지 부드럽게 이어지면서, 굳어 가는 느낌은 뜻으로 전해요.","c":"走馬灯은 죽음 직전에 인생이 눈앞을 스친다고 할 때 쓰는 말이에요. 진흙투성이 기억이 계속 돌아가는, 괴로운 과거로 읽혀요."},{"id":"b2","tk":[{"t":"{震|ふる}える","p":"동사","m":"떨리는","w":"어간 震는 한자, える는 히라가나예요.","n":"震(떨 진)은 한국어 '지진(地震)'의 震이에요."},{"t":"{手|て}","p":"명사","m":"손"},{"t":"は"},{"t":"{掴|つか}みたい","p":"동사","m":"붙잡고 싶은","b":"{掴|つか}む","bm":"붙잡다","w":"掴는 조요칸지 밖의 한자예요. 신문에서는 つかむ로 쓰지만 가사에서는 한자로 썼어요."},{"t":"もの"},{"t":"が"},{"t":"ある"},{"t":"　"},{"t":"それ"},{"t":"だけ"},{"t":"さ"}],"ko":"떨리는 손에는 붙잡고 싶은 게 있어. 그뿐이야","lit":"떨리는 / 손 / 은 / 붙잡고 싶은 / 것 / 이 / 있다 / 그것 / 뿐 / 이야","g":[{"k":"AはBがある","d":"'A에게는 B가 있다'. 主題(は)와 있는 것(が)을 나눠 말해요. 手は〜ものがある = 손에는 ~것이 있다."},{"k":"〜たい","d":"동사 ます형 + たい = '~하고 싶다'. 掴む → 掴みたい."}],"s":"掴는 조요칸지 밖의 한자예요. 형식명사 もの는 히라가나로 풀어서, 붙잡고 싶은 게 '물건'이 아니라 무언가 소중한 것이라는 느낌을 남겨요.","c":"앞 줄의 굳은 마음과 이 줄의 떨리는 손. 두려워도 놓지 않으려는 것이 있다는 게 곡을 끌고 가는 힘이에요."}]},{"label":"1절 · Bメロ","note":"밤공기 속에서 하늘을 노려봐도 바뀌지 않아요. 바뀔 수 있는 건 나 자신뿐이라는 걸 받아들여요.","lines":[{"id":"b3","tk":[{"t":"{夜|よる}","p":"명사","m":"밤"},{"t":"の"},{"t":"{匂|にお}い","p":"명사","m":"냄새, 내음","w":"좋은 냄새는 匂い, 나쁜 냄새는 臭い로 한자를 골라 써요. 匂는 일본에서 만든 한자(国字)예요.","n":"夜の匂い = 밤 냄새, 밤공기의 느낌."},{"t":"に"},{"t":"{空|そら}","p":"명사","m":"하늘"},{"t":"{睨|にら}んでも","p":"동사","m":"노려봐도","b":"{睨|にら}む","bm":"노려보다","w":"睨는 조요칸지 밖의 한자예요. 신문에서는 にらむ로 써요.","n":"む로 끝나는 동사의 て형은 んで예요. 睨む → 睨んで → 睨んでも(노려봐도)."}],"ko":"밤 냄새 속에서 하늘을 노려봐도","lit":"밤 / 의 / 냄새 / 에 / 하늘 / 노려봐도","g":[{"k":"〜ても","d":"'~해도'. て형 + も. 睨む → 睨んでも. 다음 줄의 '변할 수 있는 건 나뿐'으로 이어져요."},{"k":"조사 생략","d":"空を睨んでも에서 を가 빠졌어요. 노래에서는 박자에 맞춰 조사를 자주 생략해요."}],"s":"匂い는 좋은 냄새, 臭い는 나쁜 냄새예요. 밤공기를 匂い로 써서 불쾌함보다 쓸쓸한 분위기를 줘요. 睨는 조요칸지 밖의 한자예요.","c":"하늘을 노려본다는 건 운명이나 세상에 대한 원망으로 읽혀요. 하지만 하늘은 바뀌지 않아요."},{"id":"b4","tk":[{"t":"I’ll spend all thirty nights","p":"영어","m":"서른 밤을 다 보낼 거야","v":false,"w":"영어 코러스라 알파벳 그대로 써요."},{"t":"　"},{"t":"Staring into the sky","p":"영어","m":"하늘을 바라보며","v":false,"w":"영어 코러스라 알파벳 그대로 써요."}],"kr":"아일 스펜드 올 서티 나이츠 스테어링 인투 더 스카이","ko":"(서른 밤을 다 보낼 거야, 하늘을 바라보면서)","lit":"서른 밤을 다 보낼 거야 / 하늘을 바라보며","g":[{"k":"Staring into the sky","d":"영어 stare는 '뚫어지게 보다'예요. 앞 줄의 睨む(노려보다)와 짝을 이뤄요."}],"s":"가사 사이트 j-lyric의 원문에는 실려 있지 않은 영어 코러스예요. 보내 주신 가사에 따라 넣었어요. 노래에서는 앞 줄 夜の匂いに와 空睨んでも 사이사이에 겹쳐 들려요.","c":"thirty nights(서른 밤)는 한 달 내내라는 뜻으로 읽혀요. 매일 밤 하늘을 노려보며 버티는 시간이에요."},{"id":"b5","tk":[{"t":"{変|か}わっていける","p":"동사","m":"변해 갈 수 있는","b":"{変|か}わる","bm":"바뀌다, 변하다","w":"어간 変은 한자, わっていける는 히라가나예요.","n":"変わる + 〜ていく(~해 가다)의 가능형 いける. 変わっていける = 변해 갈 수 있다."},{"t":"の","p":"형식명사","m":"것","v":false,"w":"형식명사 の는 히라가나로 써요.","n":"동사 뒤의 の는 '~하는 것'이라는 뜻으로 앞말을 명사로 만들어요."},{"t":"は"},{"t":"{自|じ}{分|ぶん}","p":"명사","m":"자기, 나","n":"한국어 '자기'에 가까운 말이에요. 自(스스로 자) + 分(나눌 분)."},{"t":"{自|じ}{身|しん}","p":"명사","m":"자신","n":"自分自身 = 자기 자신. 한국어 '자신(自身)'과 같은 한자어예요."},{"t":"だけ"},{"t":"　"},{"t":"それ"},{"t":"だけ"},{"t":"さ"}],"ko":"변해 갈 수 있는 건 나 자신뿐. 그뿐이야","lit":"변해 갈 수 있는 / 것 / 은 / 자기 / 자신 / 뿐 / 그것 / 뿐 / 이야","g":[{"k":"〜ていける","d":"〜ていく(~해 가다)의 가능형이에요. 変わっていく → 変わっていける(변해 갈 수 있다)."},{"k":"〜のは〜だけ","d":"'~하는 건 ~뿐'. 変わっていけるのは自分自身だけ = 변할 수 있는 건 나 자신뿐."}],"s":"自分自身은 루비를 글자마다 나눠 달았어요(じ·ぶん·じ·しん). 1절 Aメロ 끝의 それだけさ를 그대로 되풀이해요.","c":"하늘(세상)은 바뀌지 않지만 나는 바뀔 수 있다는 깨달음이에요. 이게 후렴의 '강해질 수 있는 이유'로 이어져요."}]},{"label":"サビ · 후렴","note":"어떻게 해도 지울 수 없는 꿈과 멈출 수 없는 지금을 안고, 슬픔에게 고맙다고 말하며 붉은 연꽃처럼 피어나라고 외쳐요.","lines":[{"id":"c1","same":"a1"},{"id":"c2","tk":[{"t":"どうしたって"},{"t":"！"}],"ko":"어떻게 해도!","lit":"어떻게 해도","g":[{"k":"〜たって","d":"〜ても(~해도)의 회화체예요. どうしても → どうしたって. 말이 짧고 세져요."}],"c":"짧게 끊어 외치는 한마디로 후렴에 불을 붙여요. 다음 줄의 '지울 수 없는, 멈출 수 없는'과 이어져요."},{"id":"c3","tk":[{"t":"{消|け}せない","p":"동사","m":"지울 수 없는","b":"{消|け}す","bm":"지우다, 끄다","w":"어간 消는 한자, せない는 히라가나예요.","n":"消す → 消せる(지울 수 있다) → 消せない. 消す(지우다, 타동사)와 消える(사라지다, 자동사)는 짝이에요."},{"t":"{夢|ゆめ}"},{"t":"も"},{"t":"　"},{"t":"{止|と}まれない","p":"동사","m":"멈출 수 없는","b":"{止|と}まる","bm":"멈추다, 서다","w":"어간 止는 한자, まれない는 히라가나예요.","n":"止まる(멈추다, 자동사)와 止める(멈추게 하다, 타동사)는 짝이에요."},{"t":"{今|いま}"},{"t":"も"}],"ko":"지울 수 없는 꿈도, 멈출 수 없는 지금도","lit":"지울 수 없는 / 꿈 / 도 / 멈출 수 없는 / 지금 / 도","g":[{"k":"가능형 + ない","d":"'~할 수 없다'. 消す → 消せない, 止まる → 止まれない. 5단 동사는 끝을 え단으로 바꾸고 る를 붙이면 가능형이에요."},{"k":"AもBも","d":"'A도 B도'. 둘을 나란히 늘어놓아요."}],"s":"消せない·止まれない로 같은 〜ない 모양을 맞추고, 원문은 사이에 전각 공백을 두어 대구를 보여 줘요.","c":"지우고 싶어도 지워지지 않는 꿈, 멈추고 싶어도 멈출 수 없는 지금. 둘 다 버거운 짐이면서 나아가게 하는 힘이에요."},{"id":"c4","tk":[{"t":"{誰|だれ}か"},{"t":"の"},{"t":"ために","p":"형식명사","m":"~을 위해","b":"ため","bm":"~을 위함","w":"為라는 한자가 있지만 형식명사라 보통 히라가나로 써요.","n":"명사 + のために = '~를 위해'. 誰かのために = 누군가를 위해."},{"t":"{強|つよ}く"},{"t":"なれる"},{"t":"なら","p":"조사","m":"~라면"}],"ko":"누군가를 위해 강해질 수 있다면","lit":"누군가 / 의 / 위해 / 강하게 / 될 수 있다 / 라면","g":[{"k":"〜のために","d":"'~를 위해'. 목적이나 이익을 받는 사람을 나타내요."},{"k":"〜なら","d":"'~라면'. 앞의 일을 가정하고 뒷말로 이어요. 強くなれるなら = 강해질 수 있다면."}],"c":"곡 첫머리의 '강해질 수 있는 이유'가 여기서 드러나요. 나를 위해서가 아니라 누군가를 위해서라면 강해질 수 있다는 거예요."},{"id":"c5","tk":[{"t":"ありがとう"},{"t":"　"},{"t":"{悲|かな}しみ","p":"명사","m":"슬픔","b":"{悲|かな}しみ","bm":"슬픔","w":"悲는 한자, しみ는 히라가나예요.","n":"형용사 悲しい(슬프다)의 い를 み로 바꾼 명사예요. 楽しみ(즐거움), 痛み(아픔)도 같은 짜임이에요."},{"t":"よ"}],"ko":"고마워, 슬픔아","lit":"고마워 / 슬픔 / 이여","g":[{"k":"명사 + よ (부르기)","d":"'~여, ~아'. 사람이나 사물을 부를 때 붙여요. 悲しみよ = 슬픔이여."},{"k":"형용사 い → み","d":"い형용사의 い를 み로 바꾸면 명사가 돼요. 悲しい → 悲しみ."}],"s":"ありがとう는 히라가나, 悲しみ는 어간만 한자예요. 원문은 둘 사이에 전각 공백을 두어 '고마워' 다음에 한 번 숨을 쉬어요.","c":"슬픔에게 고맙다고 말하는 역설이에요. 슬픔이 있었기에 누군가를 위해 강해질 이유를 알았다는 뜻으로 읽혀요."},{"id":"c6","tk":[{"t":"{世界|せかい}","p":"명사","m":"세상, 세계","n":"한국어 '세계(世界)'와 같은 한자어예요."},{"t":"に"},{"t":"{打|う}ちのめされて","p":"동사","m":"흠씬 두들겨 맞고","b":"{打|う}ちのめす","bm":"때려눕히다, 큰 타격을 주다","w":"打(칠 타)는 한자, ちのめされて는 히라가나예요.","n":"打つ(치다) + のめす(쓰러뜨리다)가 합친 말이에요. 수동형 打ちのめされる = 흠씬 두들겨 맞다, 크게 좌절하다."},{"t":"{負|ま}ける","p":"동사","m":"지다","w":"어간 負는 한자, ける는 히라가나예요.","n":"負ける(지다)와 勝つ(이기다)는 반대말이에요. 한국어 '승부(勝負)'의 負예요."},{"t":"{意味|いみ}","p":"명사","m":"의미","n":"한국어 '의미(意味)'와 같은 한자어예요."},{"t":"を"},{"t":"{知|し}った"}],"ko":"세상에 흠씬 두들겨 맞고서 진다는 게 뭔지 알았어","lit":"세상 / 에 / 두들겨 맞고 / 지다 / 의미 / 를 / 알았다","g":[{"k":"수동형 〜される","d":"'~당하다'. 打ちのめす → 打ちのめされる. 당한 상대(세상)에는 に를 붙여요. 世界に打ちのめされて = 세상에 두들겨 맞고."}],"s":"원문은 이 줄에 공백 없이 한 호흡으로 이어 써요. 打ちのめされて에서 한자는 打 하나뿐이고 나머지는 모두 히라가나예요.","c":"지는 것의 '의미'를 알았다는 게 이 곡의 핵심이에요. 패배를 겪고서야 다시 일어서는 법을 안다는 이야기로 읽혀요."},{"id":"c7","tk":[{"t":"{紅蓮|ぐれん}"},{"t":"の"},{"t":"{華|はな}","p":"명사","m":"꽃 (화려한)","w":"같은 はな라도 花가 아니라 華를 골랐어요. 華는 '화려하고 빛나는' 꽃이에요.","n":"한국어 '화려(華麗)'의 華예요. 華やか = 화려하다."},{"t":"よ"},{"t":"{咲|さ}き{誇|ほこ}れ","p":"동사","m":"흐드러지게 피어라","b":"{咲|さ}き{誇|ほこ}る","bm":"한껏 피다, 만발하다","w":"咲와 誇에 각각 루비를 달았어요. 사이의 き와 끝의 れ는 히라가나예요.","n":"咲く(피다) + 誇る(뽐내다) = 뽐내듯 활짝 피다. 誇る의 명령형 誇れ가 붙었어요."},{"t":"！"},{"t":"　"},{"t":"{運命|うんめい}"},{"t":"を"},{"t":"{照|て}らして"}],"ko":"붉은 연꽃이여, 흐드러지게 피어라! 운명을 비춰 줘","lit":"붉은 연꽃 / 의 / 꽃 / 이여 / 한껏 피어라 / 운명 / 을 / 비춰 줘","g":[{"k":"복합동사의 명령형","d":"咲き誇る처럼 두 동사가 합친 말은 뒤 동사만 활용해요. 誇る → 誇れ, 그래서 咲き誇れ."},{"k":"〜て (부탁)","d":"て형으로 문장을 끝내면 '~해 줘'라는 부탁이 돼요. 照らして = 비춰 줘."}],"s":"제목 紅蓮華가 여기서 '紅蓮の華'로 풀려 나와요. 원문은 ！ 뒤에 전각 공백을 두어 외침과 부탁을 나눠요.","c":"명령(咲き誇れ)과 부탁(照らして)이 한 줄에 같이 있어요. 스스로 피어나서, 그 빛으로 앞길(운명)을 밝히라는 그림이에요."}]},{"label":"2절 · Aメロ","note":"번개 같은 잡음에 마음이 흔들리고, 다정함만으로는 지킬 수 없는 게 있다는 걸 알면서도 받아들이기 힘들어해요.","lines":[{"id":"d1","tk":[{"t":"イナビカリ","p":"명사","m":"번개, 번갯불","b":"{稲光|いなびかり}","bm":"번개","w":"稲光라는 한자가 있는데 외래어도 아닌 말을 가타카나로 썼어요. 번쩍이는 날카로운 느낌을 살리는 표기로 읽혀요.","n":"稲(벼) + 光(빛). 번개가 치면 벼가 잘 여문다는 옛 믿음에서 온 말이라고 해요."},{"t":"の"},{"t":"{雑音|ざつおん}","p":"명사","m":"잡음","n":"한국어 '잡음(雜音)'과 같은 한자어예요. 雑는 雜의 일본식 약자예요."},{"t":"が"},{"t":"{耳|みみ}","p":"명사","m":"귀"},{"t":"を"},{"t":"{刺|さ}す","p":"동사","m":"찌르다","w":"어간 刺는 한자, す는 히라가나예요.","n":"刺(찌를 자)는 한국어 '자극(刺戟)'의 刺예요. 刺身(さしみ, 회)도 같은 한자예요."},{"t":"　"},{"t":"{戸惑|とまど}う","p":"동사","m":"당황하다, 갈피를 못 잡다","w":"戸(문 호)와 惑(미혹할 혹)을 묶어 とまど로 읽었어요. う는 히라가나예요.","n":"어디로 가야 할지 문(戸) 앞에서 헤맨다(惑う)는 짜임으로 기억하면 쉬워요."},{"t":"{心|こころ}"}],"ko":"번갯불 같은 잡음이 귀를 찔러. 갈피를 못 잡는 마음","lit":"번개 / 의 / 잡음 / 이 / 귀 / 를 / 찌르다 / 당황하는 / 마음","g":[{"k":"동사 + 명사","d":"1절 こわばる心처럼 동사 기본형이 心을 꾸며요. 戸惑う心 = 갈피를 못 잡는 마음."}],"s":"イナビカリ는 한자 稲光가 있는데도 가타카나로 썼어요. 외래어가 아닌데 가타카나로 쓴 말이라 눈에 확 띄어요. 1절 Aメロ의 こわばる心와 짝을 이루는 戸惑う心도 볼 만해요.","c":"번개처럼 시끄러운 세상의 소리가 귀를 찌른다는 그림이에요. 남들의 말이나 소문으로 읽을 수도 있어요."},{"id":"d2","tk":[{"t":"{優|やさ}しい","p":"い형용사","m":"다정한, 착한","w":"어간 優는 한자, しい는 히라가나예요."},{"t":"だけじゃ","p":"조사(복합)","m":"~만으로는","n":"だけ(~만) + では(~로는)의 회화체 じゃ예요."},{"t":"{守|まも}れない","p":"동사","m":"지킬 수 없는","b":"{守|まも}る","bm":"지키다","w":"어간 守는 한자, れない는 히라가나예요.","n":"守る → 守れる(지킬 수 있다) → 守れない. 한국어 '수비(守備)'의 守예요."},{"t":"もの"},{"t":"が"},{"t":"ある"},{"t":"？"},{"t":"　"},{"t":"わかってる","p":"동사","m":"알고 있어","b":"{分|わ}かる","bm":"알다","w":"分かる라는 한자 표기가 있지만 히라가나로 풀었어요. 혼잣말 같은 부드러운 느낌이 나요."},{"t":"けど","p":"조사","m":"~지만"}],"ko":"다정한 것만으로는 지킬 수 없는 게 있다고? 알고는 있지만","lit":"다정하다 / 만으로는 / 지킬 수 없는 / 것 / 이 / 있다 / 알고 있다 / 지만","g":[{"k":"〜だけじゃ〜ない","d":"'~만으로는 ~할 수 없다'. じゃ는 では의 회화체예요."},{"k":"〜けど","d":"'~지만'. 말을 끝맺지 않고 여운을 남기는 데도 써요."}],"s":"分かる를 히라가나 わかってる로 썼어요. 같은 곡의 掴む·睨む처럼 표 밖 한자까지 쓰는 곡인데, 이 말만은 풀어 써서 힘을 뺐어요. ？를 넣어 남에게 들은 말을 되묻는 느낌을 줘요.","c":"'다정함만으론 아무것도 못 지켜'라는 말을 듣고 되묻는 장면으로 읽혀요. 머리로는 알지만 마음은 받아들이기 싫은 거예요."}]},{"label":"2절 · Bメロ","note":"물밑에서 선과 악이 얽히고, 뻔히 보이는 위선에 천벌이 내리기를 바라요.","lines":[{"id":"e1","tk":[{"t":"{水面下|すいめんか}","p":"명사","m":"물밑, 수면 아래","n":"한국어 '수면하(水面下)'와 같은 한자어예요. 水面下で = 겉으로 드러나지 않는 곳에서(물밑 작업)."},{"t":"で"},{"t":"{絡|から}まる","p":"동사","m":"얽히다","w":"어간 絡는 한자, まる는 히라가나예요.","n":"絡まる(얽히다, 자동사)와 絡める(얽다, 타동사)는 짝이에요. 한국어 '연락(連絡)'의 絡이에요."},{"t":"{善悪|ぜんあく}","p":"명사","m":"선악","n":"한국어 '선악(善惡)'과 같은 한자어예요. 悪는 惡의 일본식 약자예요."},{"t":"　"},{"t":"{透|す}けて","p":"동사","m":"비쳐","b":"{透|す}ける","bm":"비치다, 속이 들여다보이다","w":"어간 透는 한자, けて는 히라가나예요.","n":"透けて見える = 속이 훤히 들여다보이다. 한국어 '투명(透明)'의 透예요."},{"t":"{見|み}える","p":"동사","m":"보이는","w":"어간 見는 한자, える는 히라가나예요."},{"t":"{偽善|ぎぜん}","p":"명사","m":"위선","n":"한국어 '위선(僞善)'과 같은 한자어예요. 偽는 僞의 일본식 모양이에요."},{"t":"に"},{"t":"{天罰|てんばつ}","p":"명사","m":"천벌","n":"한국어 '천벌(天罰)'과 같은 한자어예요."}],"ko":"물밑에서 얽혀 드는 선과 악, 훤히 들여다보이는 위선에 천벌을","lit":"물밑 / 에서 / 얽히다 / 선악 / 비쳐 / 보이는 / 위선 / 에 / 천벌","g":[{"k":"〜て{見|み}える","d":"'~해 보이다'. 透けて見える = 비쳐 보이다, 속이 뻔히 보이다."},{"k":"명사로 끝내기","d":"偽善に天罰 다음의 '내려라(を下せ)' 같은 동사를 생략했어요. 명사로 끝내 말을 짧고 세게 만들어요."}],"s":"水面下·善悪·偽善·天罰, 한자어가 몰려 있는 줄이에요. 대부분 한국어와 같은 한자어라 한자음으로 뜻을 짐작할 수 있어요.","c":"겉으로는 착한 척하지만 속이 보이는 위선을 꾸짖는 줄이에요. 1절의 내면 이야기에서 바깥 세상으로 시선이 옮겨 가요."},{"id":"e2","tk":[{"t":"Tell me why, tell me why, tell me why, tell me, I don't need you","p":"영어","m":"왜인지 말해 봐, 난 네가 필요 없어","v":false,"w":"영어 코러스라 알파벳 그대로 써요."}],"kr":"텔 미 와이 텔 미 와이 텔 미 와이 텔 미 아이 돈트 니드 유","ko":"왜인지 말해 봐, 말해 봐, 말해 봐, 말해 봐. 난 너 따위 필요 없어","lit":"왜인지 말해 봐 ×3 / 말해 봐 / 난 네가 필요 없어","g":[{"k":"Tell me why","d":"영어 '왜인지 말해 봐'. 같은 말을 되풀이해 몰아붙여요."}],"s":"가사 사이트 j-lyric의 원문에는 실려 있지 않은 영어 부분이에요. 보내 주신 가사에 따라 넣었어요.","c":"앞 줄의 위선을 향해 따지고, I don't need you(필요 없어)로 끊어 내는 말로 읽혀요."}]},{"label":"サビ 2 · 두 번째 후렴","note":"첫 후렴을 되풀이하지 않고, 타고난 재능보다 끝까지 도전해 핀 꽃이 아름답다는 새 가사로 나아가요.","lines":[{"id":"f1","tk":[{"t":"{逸材|いつざい}","p":"명사","m":"뛰어난 인재, 타고난 재목","n":"逸(뛰어날 일) + 材(재목 재). 한국어 '일재(逸材)'와 같은 한자어인데, 일본어에서 훨씬 자주 써요."},{"t":"の"},{"t":"{花|はな}","p":"명사","m":"꽃","w":"후렴의 華와 달리 여기서는 보통의 花를 썼어요."},{"t":"より","p":"조사","m":"~보다"},{"t":"　"},{"t":"{挑|いど}み{続|つづ}け","p":"동사","m":"계속 도전해서","b":"{挑|いど}み{続|つづ}ける","bm":"계속 도전하다","w":"挑와 続에 각각 루비를 달았어요. 사이의 み와 끝의 け는 히라가나예요.","n":"挑む(도전하다) + 続ける(계속하다). ます형 + 続ける = 계속 ~하다."},{"t":"{咲|さ}いた","p":"동사","m":"피어난","b":"{咲|さ}く","bm":"(꽃이) 피다","w":"어간 咲는 한자, いた는 히라가나예요.","n":"く로 끝나는 동사의 과거형은 いた예요. 咲く → 咲いた."},{"t":"{一輪|いちりん}","p":"명사","m":"한 송이","n":"輪(바퀴 륜)은 꽃을 세는 말이에요. 一輪の花 = 꽃 한 송이."},{"t":"が"},{"t":"{美|うつく}しい","p":"い형용사","m":"아름답다","w":"어간 美는 한자, しい는 히라가나예요.","n":"한국어 '미(美)'와 같은 한자예요. きれい보다 조금 더 글말 같고 깊은 아름다움에 써요."}],"ko":"타고난 재목의 꽃보다, 끝까지 도전해 피어난 한 송이가 아름다워","lit":"뛰어난 인재 / 의 / 꽃 / 보다 / 계속 도전해 / 피어난 / 한 송이 / 가 / 아름답다","g":[{"k":"AよりBが〜","d":"'A보다 B가 ~하다'. 비교할 때 써요. 逸材の花より一輪が美しい."},{"k":"ます형 + {続|つづ}ける","d":"'계속 ~하다'. 挑む → 挑み続ける. 문장 중간에서는 ます형 挑み続け로 이어요."}],"s":"후렴은 紅蓮の華, 여기는 逸材の花. 같은 はな를 다른 한자로 썼어요. 타고난 재능은 평범한 花로, 애써 피운 꽃은 뒤에서 紅蓮의 이미지로 이어져요.","c":"타고난 재능보다 노력으로 피운 꽃이 아름답다는 선언이에요. 곡 전체에서 가장 또렷한 메시지로 읽혀요."},{"id":"f2","tk":[{"t":"{乱暴|らんぼう}に","p":"부사","m":"거칠게, 난폭하게","b":"{乱暴|らんぼう}","bm":"난폭함","w":"乱暴는 한자, に는 히라가나예요.","n":"한국어 '난폭(亂暴)'과 같은 한자어예요. 乱는 亂의 일본식 약자예요."},{"t":"{敷|し}き{詰|つ}められた","p":"동사","m":"빽빽하게 깔린","b":"{敷|し}き{詰|つ}める","bm":"빈틈없이 깔다","w":"敷와 詰에 각각 루비를 달았어요. 사이의 き와 められた는 히라가나예요.","n":"敷く(깔다) + 詰める(채우다). 수동형 敷き詰められる = 빈틈없이 깔리다."},{"t":"　"},{"t":"トゲ","p":"명사","m":"가시","b":"{棘|とげ}","bm":"가시","w":"棘라는 한자가 있지만 조요칸지 밖이라 보통 とげ로 쓰는데, 여기서는 가타카나로 썼어요. 뾰족한 느낌이 살아나요."},{"t":"だらけ"},{"t":"の"},{"t":"{道|みち}","p":"명사","m":"길"},{"t":"も"}],"ko":"거칠게 빽빽이 깔린 가시투성이 길도","lit":"거칠게 / 빽빽이 깔린 / 가시 / 투성이 / 의 / 길 / 도","g":[{"k":"수동형 〜られる","d":"1단 동사는 る 대신 られる를 붙여요. 敷き詰める → 敷き詰められる(깔리다)."},{"k":"な형용사 + に","d":"な형용사에 に를 붙이면 부사처럼 동사를 꾸며요. 乱暴 → 乱暴に."}],"s":"トゲ는 외래어가 아닌데 가타카나로 썼어요. 2절 Aメロ의 イナビカリ와 같은 표기 방식이에요. 1절의 泥だらけ에 이어 だらけ가 다시 나와요.","c":"누군가 일부러 거칠게 깔아 놓은 듯한 가시밭길이에요. 다음 줄에서 이 길이 왜 나타나는지 말해요."},{"id":"f3","tk":[{"t":"{本気|ほんき}","p":"명사","m":"진심, 진지함","w":"本(근본 본) + 気(기운 기). 노래에 따라 マジ라고 특수 읽기를 달기도 하는데, 여기서는 그대로 ほんき로 읽어요.","n":"本気で = 진심으로, 진지하게. 회화에서는 マジ라고 줄여 말하기도 해요."},{"t":"の"},{"t":"{僕|ぼく}"},{"t":"だけ"},{"t":"に"},{"t":"{現|あらわ}れる","p":"동사","m":"나타나다","w":"어간 現는 한자, れる는 히라가나예요.","n":"한국어 '출현(出現)'의 現이에요. 現れる(나타나다)와 表れる(드러나다)는 같은 あらわれる지만 한자가 달라요."},{"t":"から"},{"t":"　"},{"t":"{乗|の}り{越|こ}えて","p":"동사","m":"넘어","b":"{乗|の}り{越|こ}える","bm":"넘어서다, 극복하다","w":"乗와 越에 각각 루비를 달았어요. 사이의 り와 えて는 히라가나예요.","n":"乗る(타다) + 越える(넘다) = 타고 넘다, 극복하다."},{"t":"みせる","p":"보조동사","m":"~해 보이다 (해내고 말겠다)","b":"みせる","bm":"(~해) 보이다","w":"보조동사로 쓰는 みせる는 히라가나로 써요(보여 주다는 見せる)."},{"t":"よ","p":"조사(종조사)","m":"~할게, ~야 (강조)"}],"ko":"진심인 나에게만 나타나는 거니까, 넘어서 보일게","lit":"진심 / 의 / 나 / 에게만 / 나타나다 / 니까 / 넘어 / 보이다 / 야","g":[{"k":"〜てみせる","d":"'(보란 듯이) ~해 보이겠다, 꼭 해내겠다'. 의지를 강하게 드러내요. 乗り越える → 乗り越えてみせる."},{"k":"〜から (이유)","d":"'~니까'. 앞이 이유, 뒤가 결론이에요."}],"s":"보조동사 みせる는 히라가나, '보여 주다'라는 본래 뜻의 見せる는 한자로 써요. 같은 소리라도 뜻에 따라 문자가 갈려요.","c":"가시밭길은 진심으로 덤비는 사람에게만 나타난다고 뒤집어 말해요. 시련을 진심의 증거로 받아들이는 거예요."},{"id":"f4","tk":[{"t":"{簡単|かんたん}に","p":"부사","m":"간단히, 쉽게","b":"{簡単|かんたん}","bm":"간단함","w":"簡単은 한자, に는 히라가나예요.","n":"한국어 '간단(簡單)'과 같은 한자어예요. 単은 單의 일본식 약자예요."},{"t":"{片付|かたづ}けられた","p":"동사","m":"치워져 버린","b":"{片付|かたづ}ける","bm":"치우다, 정리하다","w":"片과 付를 묶어 かたづ로 읽었어요. 付의 つ가 づ로 흐려지는 렌다쿠예요. けられた는 히라가나예요.","n":"片付ける는 방을 정리하다, 일을 처리하다라는 뜻이에요. 수동형 片付けられる = 치워지다, 아무렇지 않게 처리되다."},{"t":"　"},{"t":"{守|まも}れなかった","p":"동사","m":"지키지 못한","b":"{守|まも}る","bm":"지키다","w":"어간 守는 한자, れなかった는 히라가나예요."},{"t":"{夢|ゆめ}"},{"t":"も"}],"ko":"쉽게 치워져 버린, 지키지 못한 꿈도","lit":"간단히 / 치워진 / 지킬 수 없었던 / 꿈 / 도","g":[{"k":"가능형 + なかった","d":"'~할 수 없었다'. 守る → 守れる → 守れなかった."},{"k":"수동형 〜られた","d":"片付ける → 片付けられた(치워졌다). 내 꿈을 남이 아무렇지 않게 정리해 버렸다는 느낌이에요."}],"s":"片付ける는 つ가 づ로 흐려지는 렌다쿠가 일어난 말이에요. 2절 Aメロ의 守れない가 여기서 과거형 守れなかった로 돌아와요.","c":"남에게는 하찮게 치워진 꿈, 내가 지켜 내지 못한 꿈. 다음 줄에서 그 꿈이 사라지지 않았다고 말해요."},{"id":"f5","tk":[{"t":"{紅蓮|ぐれん}"},{"t":"の"},{"t":"{心臓|しんぞう}","p":"명사","m":"심장","n":"한국어 '심장(心臟)'과 같은 한자어예요. 臓는 臟의 일본식 약자예요."},{"t":"に"},{"t":"{根|ね}","p":"명사","m":"뿌리"},{"t":"を"},{"t":"{生|は}やし","p":"동사","m":"내리고, 자라게 하고","b":"{生|は}やす","bm":"(뿌리·수염 등을) 자라게 하다","w":"生(날 생)을 はや로 읽는 말이에요. 生은 읽는 법이 아주 많은 한자예요.","n":"根を生やす = 뿌리를 내리다. 生은 せい, しょう, いきる, うまれる, なま, はえる 등 읽기가 많아요."},{"t":"　"},{"t":"この","p":"연체사","m":"이","w":"こ·そ·あ·ど 지시어는 히라가나로 써요."},{"t":"{血|ち}","p":"명사","m":"피","n":"한국어 '혈(血)'과 같은 한자예요. 한 글자로 ち라고 짧게 읽어요."},{"t":"に"},{"t":"{宿|やど}ってる","p":"동사","m":"깃들어 있어","b":"{宿|やど}る","bm":"깃들다, 머물다","w":"어간 宿는 한자, ってる는 히라가나예요.","n":"宿(잘 숙)은 宿題(숙제), 宿命(숙명)의 宿예요. 宿る = (정신·생명 등이) 깃들다."}],"ko":"붉은 심장에 뿌리를 내리고, 이 피에 깃들어 있어","lit":"붉은 연꽃 / 의 / 심장 / 에 / 뿌리 / 를 / 내리고 / 이 / 피 / 에 / 깃들어 있다","g":[{"k":"ます형으로 잇기","d":"生やす → 生やし. 글말에서는 て형 대신 ます형으로 문장을 이어요(根を生やし、宿ってる)."},{"k":"〜てる","d":"〜ている의 회화체예요. 宿っている → 宿ってる."}],"s":"生을 はや로 읽는 生やす가 볼 만해요. 宿는 히게단 宿命의 宿와 같은 한자예요.","c":"지키지 못한 꿈도 사라지지 않고 심장에 뿌리내려 피에 깃들어 있다는 고백이에요. 紅蓮이 꽃에서 심장의 붉은색으로 옮겨 가요."}]},{"label":"Cメロ · 브리지","note":"남몰래 덧없이 흩어지는 결말, 비명 같은 바람. 그래도 누구나 행복을 바라고 있다고 조용히 짚어요.","lines":[{"id":"g1","tk":[{"t":"{人|ひと}{知|し}れず","p":"부사","m":"남몰래, 아무도 모르게","w":"人과 知에 각각 루비를 달았어요. れず는 히라가나예요.","n":"人(남) + 知れず(알려지지 않고). 〜ず는 ない의 글말이에요."},{"t":"{儚|はかな}い","p":"い형용사","m":"덧없는","w":"儚는 조요칸지 밖의 한자예요. 人(사람)과 夢(꿈)을 합친 모양이라 '사람의 꿈은 덧없다'로 기억하기도 해요.","n":"신문에서는 はかない로 풀어 써요. 벚꽃처럼 금방 지는 것에 자주 쓰는 말이에요."},{"t":"　"},{"t":"{散|ち}りゆく","p":"동사","m":"져 가는, 흩어져 가는","b":"{散|ち}る","bm":"(꽃잎이) 지다, 흩어지다","w":"散는 한자, りゆく는 히라가나예요.","n":"散る + ゆく(가다). ゆく는 行く의 예스러운 읽기라 노래나 시에서 자주 써요."},{"t":"{結末|けつまつ}","p":"명사","m":"결말","n":"한국어 '결말(結末)'과 같은 한자어예요."}],"ko":"아무도 모르게 덧없이 져 가는 결말","lit":"남몰래 / 덧없는 / 져 가는 / 결말","g":[{"k":"〜ず","d":"ない의 글말이에요. 知れない → 知れず. 人知れず = 남이 모르게."},{"k":"ます형 + ゆく","d":"'~해 가다'. 散る → 散りゆく. 〜ていく보다 예스럽고 시적인 말이에요."}],"s":"儚는 조요칸지 밖의 한자예요. 人+夢 모양이라 가사에서 즐겨 쓰는 한자예요.","c":"꽃잎이 지듯 아무도 모르게 끝나 버리는 것들을 그려요. 앞의 '꽃'의 비유가 이어져요."},{"id":"g2","tk":[{"t":"{無情|むじょう}に","p":"부사","m":"무정하게","b":"{無情|むじょう}","bm":"무정함","w":"無情는 한자, に는 히라가나예요.","n":"한국어 '무정(無情)'과 같은 한자어예요."},{"t":"{破|やぶ}れた","p":"동사","m":"찢어진, 깨진","b":"{破|やぶ}れる","bm":"찢어지다, 깨지다","w":"어간 破는 한자, れた는 히라가나예요.","n":"破れる(찢어지다)는 敗れる(패하다)와 소리가 같아요. 꿈이 '깨지다'와 '지다' 두 느낌이 겹쳐 들려요."},{"t":"　"},{"t":"{悲鳴|ひめい}","p":"명사","m":"비명","n":"한국어 '비명(悲鳴)'과 같은 한자어예요."},{"t":"の"},{"t":"{風|かぜ}","p":"명사","m":"바람"},{"t":"{吹|ふ}く","p":"동사","m":"불다","w":"어간 吹는 한자, く는 히라가나예요."}],"ko":"무정하게 찢겨 나간, 비명 같은 바람이 불어","lit":"무정하게 / 찢어진 / 비명 / 의 / 바람 / 불다","g":[{"k":"조사 생략","d":"悲鳴の風が吹く에서 が가 빠졌어요. 박자에 맞춰 조사를 생략했어요."}],"s":"破れる는 敗れる(지다)와 소리가 같아요. 가사는 破를 써서 '찢어지다'를 골랐지만 '패배'의 울림도 겹쳐요.","c":"비명처럼 우는 바람이 지나가요. 앞 줄의 덧없는 결말과 함께 쓸쓸한 장면을 만들어요."},{"id":"g3","tk":[{"t":"{誰|だれ}か"},{"t":"の"},{"t":"{笑|わら}う","p":"동사","m":"웃는","w":"어간 笑는 한자, う는 히라가나예요."},{"t":"{影|かげ}","p":"명사","m":"그림자, 모습","n":"影는 그림자이자 사람의 모습이에요. 한국어 '영(影)'과 같은 한자예요(촬영 = 撮影)."},{"t":"　"},{"t":"{誰|だれ}か"},{"t":"の"},{"t":"{泣|な}き{声|ごえ}","p":"명사","m":"울음소리","w":"泣과 声에 각각 루비를 달았어요. 声(こえ)가 뒤에 붙으며 ごえ로 흐려지는 렌다쿠예요.","n":"泣く(울다) + 声(목소리). 笑い声(웃음소리)도 같은 짜임이에요."}],"ko":"누군가의 웃는 모습, 누군가의 울음소리","lit":"누군가 / 의 / 웃는 / 그림자 / 누군가 / 의 / 울음소리","g":[{"k":"대구","d":"誰かの〜 誰かの〜로 같은 틀을 두 번 놓았어요. 웃음과 울음을 나란히 세워요."}],"s":"泣き声의 声가 ごえ로 흐려지는 렌다쿠예요. 원문은 두 구절 사이에 전각 공백을 두어 대구를 보여 줘요.","c":"누군가는 웃고 누군가는 울어요. 다음 줄에서 그 모두가 같은 것을 바란다고 묶어요."},{"id":"g4","tk":[{"t":"{誰|だれ}","p":"대명사","m":"누구","w":"誰는 한자로도 히라가나 だれ로도 써요."},{"t":"もが","p":"조사(복합)","m":"~나가 (모두)","n":"誰もが = 누구나가, 모두가. も(~도) + が(~이/가)."},{"t":"{幸|しあわ}せ","p":"명사","m":"행복","w":"幸는 한자, せ는 히라가나예요. 명사인데 오쿠리가나가 붙은 말이에요.","n":"幸(다행 행)은 한국어 '행복(幸福)'의 幸이에요."},{"t":"を"},{"t":"{願|ねが}ってる","p":"동사","m":"바라고 있어","b":"{願|ねが}う","bm":"바라다, 빌다","w":"어간 願는 한자, ってる는 히라가나예요.","n":"한국어 '소원(所願)'의 願이에요. お願いします = 부탁합니다."}],"ko":"누구나 행복을 바라고 있어","lit":"누구 / 나가 / 행복 / 을 / 바라고 있다","g":[{"k":"{誰|だれ}もが","d":"'누구나 (다)'. 誰も 뒤에 부정이 오면 '아무도 ~않다'(誰も来ない)인데, もが로 긍정문을 만들면 '누구나'가 돼요."}],"s":"幸せ는 명사인데 오쿠리가나 せ가 붙어요. 한자 幸만 쓰면 さち로 읽혀서 せ를 붙여 구별해요.","c":"선악이 얽힌 세상이지만 누구나 바라는 건 행복이라는 걸 짚고, 마지막 후렴으로 넘어가요."}]},{"label":"ラストサビ · 마지막 후렴","note":"첫 후렴을 그대로 되풀이하고, '운명을 비춰 줘'를 한 번 더 외치며 끝나요.","lines":[{"id":"h1","same":"c2"},{"id":"h2","same":"c3"},{"id":"h3","same":"c4"},{"id":"h4","same":"c5"},{"id":"h5","same":"c6"},{"id":"h6","same":"c7"},{"id":"h7","tk":[{"t":"{運命|うんめい}"},{"t":"を"},{"t":"{照|て}らして"}],"ko":"운명을 비춰 줘","lit":"운명 / 을 / 비춰 줘","g":[{"k":"〜て (부탁)","d":"앞 줄의 照らして를 한 번 더 되풀이해요. て형으로 끝나 '~해 줘'라는 부탁이 돼요."}],"s":"가사 사이트 j-lyric의 원문에는 마지막 運命を照らして가 한 번만 실려 있어요. 보내 주신 가사대로 두 번 넣었어요.","c":"마지막에 남는 말은 명령(咲き誇れ)이 아니라 부탁(照らして)이에요. 강해지겠다고 외친 뒤, 앞길을 밝혀 달라고 조용히 바라며 끝나요."}]}]},"shukumei":{"id":"shukumei","title":"{宿命|しゅくめい}","artist":"Official髭男dism","year":2019,"eyebrow":"Official髭男dism · 2019","sub":"기적이 아니어도, 아름답지 않아도 괜찮다. 바꿀 수 없는 '숙명'을 불태우며 달려가는 사람들을 위한 응원가. 고교야구 프로그램 「熱闘甲子園」 2019 테마송.","release":"2019년 여름 · 앨범 『Traveler』(2019) 수록","tieIn":"ABC·TV아사히 「熱闘甲子園」 2019 테마송","lyricist":"藤原聡","composer":"藤原聡","listen":"https://www.youtube.com/results?search_query=Official%E9%AB%AD%E7%94%B7dism+%E5%AE%BF%E5%91%BD","intro":"宿命(しゅくめい)는 2019년 여름, 일본 고교야구 대회의 하루를 매일 밤 정리해 보여 주는 프로그램 「熱闘甲子園」의 테마송으로 쓰인 곡이에요. 같은 해 발표된 Pretender와 함께 히게단의 2019년을 대표하는 곡이에요.\n\n가사에는 バッテリー(투수와 포수), 背番号(등번호), 泥だらけ(흙투성이)처럼 야구를 떠올리게 하는 말이 곳곳에 숨어 있어요. 그렇다고 야구만의 노래는 아니에요. 결과가 기적이 아니어도, 모습이 아름답지 않아도, 바꿀 수 없는 '숙명'을 연료 삼아 지금 전력을 다하는 모든 사람에게 보내는 응원가예요.","notes":[{"tag":"배경","title":"甲子園과 「熱闘甲子園」","body":"[[{甲子園|こうしえん}]]은 효고현에 있는 야구장 이름이자, 해마다 봄·여름에 이곳에서 열리는 전국 고교야구 대회를 가리키는 말이에요. 특히 여름 대회는 각 지역 예선을 이긴 학교가 모여 토너먼트로 겨루는, 일본 여름의 국민적인 행사예요. 지역 대표가 나가기 때문에 출신 지역 전체가 '우리 고향 학교'를 응원해요.\n\n「熱闘甲子園」은 그날 경기의 명장면과 선수들의 사연을 매일 밤 소개하는 TV 프로그램이에요. 宿命는 2019년 이 프로그램의 테마송이었어요."},{"tag":"문화","title":"진 팀이 흙을 담아 가는 이유","body":"고시엔에서 진 팀 선수들이 눈물을 흘리며 그라운드의 흙을 주머니에 담아 가는 모습은 일본 여름의 상징 같은 장면이에요. 3학년에게는 마지막 여름이고, 한 번 지면 끝나는 토너먼트라서 패배의 눈물과 흙이 함께 기억돼요.\n\n가사의 [[{涙|なみだ}の{足跡|あしあと}]](눈물의 발자국), [[{泥|どろ}だらけの{笑顔|えがお}]](흙투성이 웃음), [[{掌|てのひら}の{爪痕|つめあと}]](손바닥의 손톱자국)이 모두 이런 장면을 떠올리게 해요."},{"tag":"표현","title":"宿命·運命·定め","body":"모두 '운명'으로 옮길 수 있지만 뉘앙스가 달라요.\n\n**[[{宿命|しゅくめい}]]**: 宿(깃들다)+命(목숨). 태어날 때부터 정해져 바꿀 수 없는 것. 일본에서는 '運命는 바꿀 수 있지만 宿命는 바꿀 수 없다'는 말이 있을 만큼 무겁게 여겨요.\n\n**[[{運命|うんめい}]]**: 運(움직이다)+命. 살면서 만나는 흐름과 인연. Pretender의 運命のヒト가 이 말이에요.\n\n**[[{定|さだ}め]]**: 일본 고유어로 '정해진 것'. Pretender 마지막 줄의 ロマンスの定め.\n\n이 곡은 바꿀 수 없는 宿命를 원망하지 않고 '불태우고(燃やして)', 마지막에는 '치켜든다(かざして)'고 노래해요."},{"tag":"표현","title":"야구 용어로 다시 읽기","body":"**[[バッテリー]]**: 건전지이자, 야구에서 투수와 포수 한 쌍을 부르는 말이에요. 切れないバッテリー = 닳지 않는 에너지 + 끊어지지 않는 투수·포수의 호흡.\n\n**[[{背番号|せばんごう}]]**: 고교야구에서는 정해진 인원만 등번호를 받아 벤치에 들어가요. 1번은 에이스 투수, 2번은 포수처럼 번호가 역할을 나타내요.\n\n**[[{泥|どろ}だらけ]]**: 슬라이딩과 다이빙 캐치로 흙투성이가 된 유니폼. 고교야구의 대표적인 이미지예요."},{"tag":"표기","title":"이 곡의 표기 포인트","body":"**히라가나로 푼 말**: あふれ(溢れ), かざす(翳す), やつ(奴), 生きがい(生き甲斐). 어렵거나 조요칸지 밖의 한자를 피하고 말투를 가볍게 했어요.\n\n**일부러 고른 한자**: 讃える(보통은 称える), 想い(보통은 思い), 掌(보통은 手のひら). 감정이 실린 말에는 오히려 무게 있는 한자를 썼어요. Pretender의 綺麗·繋와 같은 방식이에요.\n\n**같은 한자, 다른 읽기**: 重さ(おもさ, 무게)와 重なって(かさなって, 겹쳐져).\n\n**영어**: メロディ·バッテリー·イヤフォン·アンサー는 가타카나, FOREVER 하나만 대문자 알파벳이에요."},{"tag":"문화","title":"頑張れ라는 말의 무게","body":"[[{頑張|がんば}れ]](힘내)는 일본에서 가장 흔한 응원의 말이에요. 그런데 이미 한계까지 버티고 있는 사람에게는 '더 버텨라'라는 부담이 될 수 있어서, 지친 사람에게는 조심해서 쓰자는 이야기도 자주 나와요.\n\n2절의 「大丈夫」や「頑張れ」って歌詞に 苛立ってしまった가 바로 그런 마음이에요. 응원가가 스스로 '뻔한 응원'에 지쳤던 밤을 고백하기 때문에, 후렴의 응원이 더 진심으로 들려요."},{"tag":"문화","title":"生きがい(ikigai)","body":"[[{生|い}きがい]]는 '살아가는 보람, 아침에 일어날 이유'를 뜻해요. 해외에서는 일본식 삶의 태도를 소개하는 말로 'ikigai'가 그대로 알려지기도 했어요.\n\n이 곡에서는 그 거창한 말에 ってやつ(~라는 녀석)를 붙여, 쑥스러운 듯 가볍게 불러요."}],"dict":{"{君|きみ}":{"p":"대명사","m":"너","w":"'너'를 뜻하는 대명사로, 한자로 쓰는 게 일반적이에요.","n":"원래 '임금·주군'을 뜻하던 한자예요(君主 = 군주). 노래 속 君는 '특별한 한 사람'을 부르는 말이에요. 이 곡에서는 함께 뛰는 동료나 응원하는 사람으로도 읽혀요."},"{僕|ぼく}ら":{"p":"대명사","m":"우리","b":"{僕|ぼく}ら","w":"僕(나)는 한자, 복수를 만드는 ら는 히라가나예요.","n":"僕ら = 우리(남성적·젊은 느낌). 私たち(わたしたち)보다 친근해서 노래 가사에서 아주 자주 써요."},"の":{"p":"조사","m":"~의"},"は":{"p":"조사","m":"~은/는 (주제)","n":"조사로 쓸 때는 wa로 읽어요."},"が":{"p":"조사","m":"~이/가"},"を":{"p":"조사","m":"~을/를","n":"발음은 お(o)와 같아요."},"に":{"p":"조사","m":"~에"},"と":{"p":"조사","m":"~와/과"},"も":{"p":"조사","m":"~도"},"から":{"p":"조사","m":"~에서 (출발점)"},"けど":{"p":"조사","m":"~지만"},"じゃない":{"p":"조동사(부정)","m":"~이 아니다","b":"ではない","w":"ではない(~이 아니다)의 회화체예요. では가 じゃ로 줄어든 문법 요소라 히라가나로 써요."},"{夢|ゆめ}":{"p":"명사","m":"꿈","n":"夢는 쿤요미 ゆめ, 온요미 む(夢中 むちゅう, 몰두)예요."},"{無駄|むだ}":{"p":"な형용사","m":"헛됨, 소용없음","w":"뜻이 분명해서 한자로 써요. 한국어에서는 쓰지 않는 일본식 한자어예요.","n":"Pretender에서는 そう願っても無駄だから(바라 봐도 소용없으니까)로 나왔던 말이에요. 이 곡에서는 '無駄じゃない(헛되지 않아)'로 반대로 쓰여요."},"{宿命|しゅくめい}":{"p":"명사","m":"숙명","w":"한자어라 한자로 써요.","n":"宿(머물다, 깃들다)+命(목숨). 태어날 때부터 몸에 깃들어 바꿀 수 없는 운명이라는 뜻이에요. 한국어 '숙명(宿命)'과 같은 한자어예요. 일본에서는 '運命는 바꿀 수 있지만 宿命는 바꿀 수 없다'고 구별하기도 해요."},"って":{"p":"조사","m":"~라는","n":"という(~라는)의 회화체예요. 宿命って = 宿命という."},"やつ":{"p":"명사","m":"녀석, 것","w":"한자 奴로도 쓰지만 가벼운 회화체라 히라가나로 써요.","n":"원래 사람을 낮춰 부르는 '녀석'이지만, 회화에서는 물건이나 개념을 '그거, 그 녀석'처럼 친근하게 부를 때도 써요. 〜ってやつ = '~라는 녀석, ~라는 거'."},"{燃|も}やして":{"p":"동사","m":"불태워서","b":"{燃|も}やす","bm":"불태우다","w":"어간 燃는 한자, 활용 어미 やして는 히라가나예요.","n":"燃える(타다, 자동사) ↔ 燃やす(태우다, 타동사). 情熱を燃やす = 열정을 불태우다."},"{暴|あば}れ{出|だ}す":{"p":"동사","m":"날뛰기 시작하다","w":"暴れる(날뛰다)+出す(~하기 시작하다)의 복합동사예요. 어간 暴·出는 한자, れ·す는 히라가나. Pretender의 疼きだす는 だす를 히라가나로 썼는데, 이 곡은 出す를 한자로 썼어요. 정해진 답이 없어서 곡마다 달라요.","n":"暴れる는 '난폭하게 날뛰다'지만, 여기서는 '거침없이 마음껏 부딪쳐 보다'는 긍정적인 뜻이에요."},"だけ":{"p":"조사","m":"~뿐, ~만"},"なんだ":{"p":"조동사","m":"~인 거야","b":"のだ","w":"なのだ의 회화체예요. 문법 요소라 히라가나로 써요.","n":"〜んだ는 이유나 결심을 힘주어 말하는 말투예요. 〜だけなんだ = '그저 ~할 뿐이야'."},"{未来|みらい}":{"p":"명사","m":"미래","n":"한국어 '미래(未來)'와 같은 한자어예요. 来는 來의 일본식 약자예요."},"{声|こえ}":{"p":"명사","m":"목소리, 소리","n":"声는 쿤요미 こえ, 온요미 せい(歓声 かんせい, 환성)예요."},"あふれ{出|だ}した":{"p":"동사","m":"넘쳐 나온","b":"あふれ{出|だ}す","bm":"넘쳐 나오다","w":"あふれる(넘치다)는 한자 溢れる가 있지만 溢가 조요칸지가 아니라 히라가나로 썼어요. 뒤의 出す(내다)는 쉬운 한자라 한자로 남겨서, 한 단어 안에 히라가나 → 한자 → 히라가나가 섞였어요.","n":"동사 ます형 + 出す = '~해 밖으로 나오다, ~하기 시작하다'. あふれる → あふれ出す(넘쳐흐르기 시작하다)."},"いい":{"p":"い형용사","m":"좋다, 괜찮다","w":"良い로도 쓰지만 회화체 いい는 보통 히라가나로 써요."},"{届|とど}け":{"p":"동사(명령형)","m":"닿아라","b":"{届|とど}く","bm":"닿다, 도착하다","w":"어간 届는 한자, 명령형 어미 け는 히라가나예요.","n":"届く(닿다) → 届け(닿아라!). 끝의 う단을 え단으로 바꾸면 명령형이 돼요. 마음이나 목소리가 상대에게 닿기를 비는 말로 노래와 응원에서 자주 써요."},"それ":{"p":"대명사","m":"그것","w":"지시어라 히라가나로 써요."},"そんな":{"p":"연체사","m":"그런","w":"こんな(이런)·そんな(그런)·あんな(저런)는 지시어라 히라가나로 써요."},"ただ":{"p":"부사","m":"그저, 오직","w":"'그저·오직'이라는 뜻의 부사라 히라가나로 써요."}},"sections":[{"label":"1절 · Aメロ","note":"응원석의 함성처럼, '나'와 '너'의 목소리가 하나로 합쳐지는 장면으로 시작해요.","lines":[{"id":"a1","tk":[{"t":"{心臓|しんぞう}","p":"명사","m":"심장","n":"한국어 '심장(心臟)'과 같은 한자어예요. 臓은 臟의 일본식 약자예요."},{"t":"から"},{"t":"あふれ{出|だ}した"},{"t":"{声|こえ}"},{"t":"で","p":"조사","m":"~로 (수단)"}],"ko":"심장에서 넘쳐 나온 목소리로","lit":"심장 / 에서 / 넘쳐 나온 / 목소리 / 로","g":[{"k":"〜{出|だ}す","d":"동사 ます형 + 出す = '~해 밖으로 나오다' 또는 '~하기 시작하다'. あふれる → あふれ出す."},{"k":"〜から","d":"'~에서, ~로부터'(출발점). 心臓から = 심장에서."}],"s":"あふれ는 히라가나, 出는 한자예요. 溢れる의 溢이 조요칸지 밖의 글자라 히라가나로 풀고, 쉬운 出す는 한자로 남겼어요.","c":"목소리가 '목'이 아니라 '심장'에서 넘쳐 나온다고 해요. 응원석의 함성이나 선수의 외침처럼 몸 깊은 곳에서 터져 나오는 소리예요."},{"id":"a2","tk":[{"t":"{歌|うた}う","p":"동사","m":"노래하는","b":"{歌|うた}う","bm":"노래하다","w":"어간 歌는 한자, う는 히라가나예요."},{"t":"メロディ","p":"명사","m":"멜로디","w":"영어 melody를 옮긴 외래어라 가타카나예요. メロディー처럼 끝에 장음을 붙이기도 하는데, 여기서는 짧게 メロディ로 썼어요.","n":"ディ는 デ에 작은 ィ를 붙여 di 소리를 만든 표기예요. 원래 일본어에 없는 소리를 외래어용으로 만든 조합이에요."}],"ko":"노래하는 멜로디","lit":"노래하다 / 멜로디","g":[{"k":"동사 + 명사","d":"동사 기본형이 그대로 명사를 꾸며요. 歌うメロディ = 노래하는 멜로디."}],"s":"ディ처럼 작은 ィ·ァ·ェ를 붙인 가타카나는 외래어 소리를 옮기려고 만든 표기예요. 히라가나로는 거의 쓰지 않아요."},{"id":"a3","tk":[{"t":"{振|ふ}り{向|む}いた","p":"동사","m":"돌아본","b":"{振|ふ}り{向|む}く","bm":"뒤돌아보다","w":"振る(흔들다)+向く(향하다)의 복합동사예요. 각 어간은 한자, 활용 부분은 히라가나예요.","n":"振り向く = 고개나 몸을 돌려 뒤를 보다. 向く → 向いた(く가 いた로 바뀌는 과거형)."},{"t":"{未来|みらい}"}],"ko":"우리 쪽을 돌아본 미래","lit":"돌아본 / 미래","g":[{"k":"꾸미는 말의 주어","d":"振り向いた未来는 '미래가 돌아봤다'는 뜻이에요. 振り向く는 대상을 받지 않는 자동사라서, 꾸밈을 받는 未来가 곧 돌아본 주인공이에요."}],"c":"'내가 미래를 돌아봤다'가 아니라, 외면하던 미래가 마침내 이쪽을 돌아봐 주었다는 의인법이에요. 2절에서는 반대로 遠ざかってく未来(멀어져 가는 미래)가 나와요. 두 줄을 같이 읽어 보세요."},{"id":"a4","tk":[{"t":"{君|きみ}"},{"t":"から","m":"~에게서"},{"t":"あふれ{出|だ}した"},{"t":"{声|こえ}"},{"t":"と"}],"ko":"네게서 넘쳐 나온 목소리와","lit":"너 / 에게서 / 넘쳐 나온 / 목소리 / 와","s":"1행과 같은 틀(〜からあふれ出した声)을 되풀이해서 '나'와 '너'를 나란히 세워요.","c":"1행의 '심장에서 넘쳐 나온 목소리'와 짝을 이뤄요. 나의 목소리와 너의 목소리가 다음 줄에서 하나로 합쳐져요."},{"id":"a5","tk":[{"t":"{合|あ}わさって","p":"동사","m":"합쳐져서","b":"{合|あ}わさる","bm":"합쳐지다, 포개지다","w":"어간 合는 한자, わさって는 히라가나예요.","n":"合う(맞다)·合わせる(맞추다)·合わさる(합쳐지다)는 한 가족이에요."},{"t":"{響|ひび}いた","p":"동사","m":"울려 퍼졌다","b":"{響|ひび}く","bm":"울리다, 울려 퍼지다","w":"어간 響는 한자, いた는 히라가나예요.","n":"響く는 소리가 공간에 퍼지는 것. 마음에 와닿을 때도 心に響く라고 해요."}],"ko":"하나로 합쳐져 울려 퍼졌어","lit":"합쳐져서 / 울려 퍼졌다","g":[{"k":"〜て (연결)","d":"합쳐져서 → 울렸다처럼 て형으로 동작을 이어요."},{"k":"く → いた","d":"く로 끝나는 동사의 과거형은 いた. 響く → 響いた, 向く → 向いた."}]},{"id":"a6","tk":[{"t":"{群青|ぐんじょう}","p":"명사","m":"군청색 (짙은 파랑)","w":"한자어라 한자로 써요.","n":"群青은 짙고 선명한 파란색이에요. 원래 광물을 갈아 만든 일본화 물감의 이름이에요. 한국어 '군청색'과 같은 한자어예요."},{"t":"の"},{"t":"{空|そら}","p":"명사","m":"하늘"},{"t":"の"},{"t":"{下|した}","p":"명사","m":"아래","n":"下는 쿤요미 した(아래), 온요미 か·げ(地下 ちか, 지하)예요."}],"ko":"군청빛 하늘 아래","lit":"군청 / 의 / 하늘 / 의 / 아래","s":"群青·空·下 모두 한자, の만 히라가나예요. 명사를 の로 이어 붙여 장면을 한 장의 그림처럼 만들어요.","c":"여름 한낮의 짙은 하늘이에요. 고교야구 대회가 열리는 8월, 甲子園 구장 위의 하늘을 떠올리게 해요."}]},{"label":"1절 · Bメロ","note":"'~じゃない(~이 아니야)'를 되풀이하며 지나온 시간이 진짜였다고 확인해요.","lines":[{"id":"b1","tk":[{"t":"{夢|ゆめ}"},{"t":"じゃない"},{"t":"　"},{"t":"{夢|ゆめ}"},{"t":"じゃない"},{"t":"　"},{"t":"{涙|なみだ}","p":"명사","m":"눈물"},{"t":"の"},{"t":"{足|あし}{跡|あと}","p":"명사","m":"발자국","w":"足(발)+跡(자국) 두 한자로 된 고유어예요.","n":"온요미로 そくせき라고 읽으면 '업적, 발자취'라는 딱딱한 말이 돼요. 같은 한자도 읽는 법에 따라 말의 결이 달라져요."}],"ko":"꿈이 아니야, 꿈이 아니야. 눈물의 발자국","lit":"꿈 / 이 아니다 / 꿈 / 이 아니다 / 눈물 / 의 / 발자국","g":[{"k":"〜じゃない","d":"명사 + じゃない = '~이 아니다'. 夢じゃない = 꿈이 아니야."}],"s":"夢·涙·足跡은 한자, じゃない와 の는 히라가나예요. '~じゃない'를 두 번 되풀이하는 리듬이 이 부분 전체에 이어져요.","c":"흘린 눈물이 땅에 남긴 발자국처럼, 지나온 고생이 진짜였다는 말이에요. 고시엔에서 진 팀 선수들이 울면서 구장의 흙을 담아 가는 장면이 겹쳐지는 표현이에요."},{"id":"b2","tk":[{"t":"{嘘|うそ}","p":"명사","m":"거짓말","n":"嘘じゃない = 거짓이 아니야, 진짜야. 회화에서 嘘!라고만 하면 '말도 안 돼!, 진짜?' 하는 놀람의 말이 돼요."},{"t":"じゃない"},{"t":"　"},{"t":"{嘘|うそ}","p":"명사","m":"거짓말"},{"t":"じゃない"},{"t":"　"},{"t":"{泥|どろ}","p":"명사","m":"진흙"},{"t":"だらけ","p":"접미사","m":"~투성이","w":"'~투성이'를 뜻하는 접미사라 히라가나로 써요.","n":"명사 + だらけ = '~투성이'(대개 좋지 않은 것). 傷だらけ(상처투성이), ミスだらけ(실수투성이). 뒤에 나오는 まみれ(汗まみれ)와 비슷한 말이에요."},{"t":"の"},{"t":"{笑顔|えがお}","p":"명사","m":"웃는 얼굴","w":"笑(웃다)+顔(얼굴)의 명사예요.","n":"笑를 え로 읽는 건 이 단어에서만 쓰는 특별한 읽기예요. 단어 전체로 えがお라고 외워 두세요."}],"ko":"거짓이 아니야, 거짓이 아니야. 흙투성이의 웃는 얼굴","lit":"거짓말 / 이 아니다 / 거짓말 / 이 아니다 / 진흙 / 투성이 / 의 / 웃는 얼굴","g":[{"k":"〜だらけ","d":"명사 + だらけ = '~투성이'. 泥だらけ = 흙투성이."}],"s":"泥·笑顔은 한자, 접미사 だらけ는 히라가나예요.","c":"흙투성이 유니폼으로 웃는 얼굴은 고교야구의 대표적인 이미지예요. 진흙(泥)과 웃음(笑顔)을 나란히 놓아, 힘들었지만 진심으로 웃는 순간을 그려요."},{"id":"b3","tk":[{"t":"{夢|ゆめ}"},{"t":"じゃない"},{"t":"　"},{"t":"{夢|ゆめ}"},{"t":"じゃない"},{"t":"　"},{"t":"{肩|かた}","p":"명사","m":"어깨"},{"t":"を"},{"t":"{組|く}んで","p":"동사","m":"짜서, 걸고","b":"{組|く}む","bm":"짜다, 엮다","w":"어간 組는 한자, んで는 히라가나예요.","n":"肩を組む = 어깨동무하다. む로 끝나는 동사의 て형은 んで(組む → 組んで)."},{"t":"{叫|さけ}びたい","p":"동사","m":"외치고 싶다","b":"{叫|さけ}ぶ","bm":"외치다","w":"어간 叫는 한자, 활용 어미 び와 바람을 나타내는 たい는 히라가나예요."}],"ko":"꿈이 아니야, 꿈이 아니야. 어깨동무하고 외치고 싶어","lit":"꿈 / 이 아니다 / 꿈 / 이 아니다 / 어깨 / 를 / 걸고 / 외치고 싶다","g":[{"k":"{肩|かた}を{組|く}む","d":"'어깨동무하다'. 한국어처럼 몸을 쓰는 관용 표현이에요."},{"k":"〜たい","d":"동사 ます형 + たい = '~하고 싶다'. 叫ぶ → 叫びたい."}],"c":"팀 동료나 응원석의 친구들과 어깨를 걸고 함께 외치는 장면이에요. 혼자가 아니라 '우리'라는 감각이 다음 줄의 僕ら로 이어져요."},{"id":"b4","tk":[{"t":"{僕|ぼく}ら"},{"t":"の"},{"t":"{想|おも}い","p":"명사","m":"마음, 간절한 생각","b":"{想|おも}い","w":"おもい는 보통 思い로 쓰는데, 여기서는 想을 썼어요. 想는 누군가를 마음에 그리는 감정적인 생각에 써서 '간절한 마음'이라는 느낌이 강해져요.","n":"想를 おもう로 읽는 건 조요칸지표에 없는 읽기라 공문서에서는 쓰지 않아요. 가사에서는 감정을 담고 싶을 때 想い를 자주 골라요."},{"t":"　"},{"t":"{届|とど}け"},{"t":"!"}],"ko":"우리의 마음, 닿아라!","lit":"우리 / 의 / 마음 / 닿아라!","g":[{"k":"명령형","d":"5단 동사의 끝 う단을 え단으로 바꿔요. 届く → 届け(닿아라). 거친 명령만이 아니라 '부디 ~해라' 하는 바람으로도 써요."}],"c":"届け!는 응원과 기도의 외침이에요. 일본의 스포츠 응원이나 콘서트에서 '이 마음, 닿아라(届け)!'라는 말을 자주 들을 수 있어요."}]},{"label":"サビ · 후렴","note":"기적이 아니어도, 아름답지 않아도 괜찮다는 이 곡의 중심 메시지예요.","lines":[{"id":"c1","tk":[{"t":"{奇跡|きせき}","p":"명사","m":"기적","n":"한국어 '기적'과 같은 한자어예요. 한국에서는 奇蹟으로도 쓰지만 일본에서는 보통 奇跡로 써요."},{"t":"じゃなくて","p":"조동사(부정)","m":"~이 아니어도","b":"ではない","w":"じゃない의 て형이에요. 문법 요소라 히라가나로 써요."},{"t":"いい"}],"ko":"기적이 아니어도 괜찮아","lit":"기적 / 이 아니어도 / 좋다","g":[{"k":"〜なくていい","d":"'~하지 않아도 괜찮다'. 명사 + じゃなくていい = '~이 아니어도 돼'. 奇跡じゃなくていい = 기적이 아니어도 돼."}],"c":"보통 응원가라면 '기적을 일으키자'고 할 텐데, 이 곡은 '기적이 아니어도 괜찮다'고 시작해요. 우승이나 극적인 역전이 아니어도, 그 과정 자체가 의미 있다는 메시지예요."},{"id":"c2","tk":[{"t":"{美|うつく}しく","p":"い형용사","m":"아름답(지)","b":"{美|うつく}しい","bm":"아름답다","w":"어간 美는 한자, 활용 어미 しく는 히라가나예요.","n":"美しい는 감탄이 담긴 '아름답다'예요. 일상적인 '예쁘다'는 きれい(Pretender의 綺麗)."},{"t":"なくて","p":"조동사","m":"~지 않아도","b":"ない"},{"t":"いい"}],"ko":"아름답지 않아도 괜찮아","lit":"아름답 / 지 않아도 / 좋다","g":[{"k":"い형용사 + くなくていい","d":"い형용사 어간 + くなくていい = '~하지 않아도 괜찮다'. 美しい → 美しくなくていい."}],"c":"흙투성이에 땀범벅이어도, 보기 좋지 않아도 괜찮다는 말이에요. 앞 줄과 함께 '완벽하지 않아도 된다'는 이 곡의 태도를 보여 줘요."},{"id":"c3","tk":[{"t":"{生|い}きがい","p":"명사","m":"사는 보람","b":"{生|い}き{甲斐|がい}","bm":"삶의 보람","w":"生きる(살다)의 生는 한자, '보람'을 뜻하는 甲斐(かい)는 히라가나 がい로 풀어 썼어요. 甲斐는 뜻이 아니라 소리를 빌려 쓴 한자라 히라가나로 쓰는 경우가 많아요.","n":"生きがい = 살아갈 보람, 삶의 의미. 해외에도 'ikigai'라는 말로 알려져 있어요."},{"t":"って"},{"t":"やつ"},{"t":"が"}],"ko":"사는 보람이라는 녀석이","lit":"사는 보람 / 이라는 / 녀석 / 이","g":[{"k":"〜ってやつ","d":"명사 + ってやつ = '~라는 녀석, ~라는 거'. 거창한 말을 친근하게, 조금 쑥스럽게 부르는 말투예요. 이 곡에서는 生きがいってやつ, 宿命ってやつ로 두 번 나와요."}],"s":"生き 뒤로 がい·って·やつ·が까지 히라가나가 길게 이어져요. 甲斐·奴 같은 한자를 쓰지 않아 말투가 가볍고 친근해져요.","c":"生きがい(삶의 보람)처럼 무거운 말에 ってやつ(~라는 녀석)를 붙여, 거창하지 않게 툭 던지듯 말해요. 땀 흘리는 고교생의 말투 같은 친근함이 있어요."},{"id":"c4","tk":[{"t":"{光|ひか}り{輝|かがや}く","p":"동사","m":"눈부시게 빛나다","w":"光る(빛나다)+輝く(반짝이다)의 복합동사예요. 비슷한 뜻을 겹쳐 '눈부시게 빛나다'를 강조해요. 어간은 한자, り·く는 히라가나예요."},{"t":"から","m":"~니까 (이유)"}],"ko":"눈부시게 빛나니까","lit":"빛나고 반짝인다 / 니까","g":[{"k":"문장 + から","d":"'~니까'(이유). 光り輝くから = 빛나니까. 명사 뒤의 から(~에서)와 모양은 같지만 역할이 달라요."}],"c":"결과가 기적이 아니어도, 아름답지 않아도 괜찮은 이유가 바로 이것이에요. '사는 보람'이 빛나고 있으니까요."},{"id":"c5","tk":[{"t":"{切|き}れない","p":"동사","m":"끊기지 않는, 닳지 않는","b":"{切|き}れる","bm":"끊어지다, 다 떨어지다","w":"어간 切는 한자, 활용 어미 れない는 히라가나예요.","n":"電池が切れる = 배터리가 다 되다. 切れない = 다 닳지 않는."},{"t":"バッテリー","p":"명사","m":"배터리 / (야구) 투수와 포수","w":"영어 battery를 옮긴 외래어라 가타카나예요.","n":"야구에서 バッテリー는 투수와 포수 한 쌍을 부르는 말이에요. '닳지 않는 건전지'와 '끊어지지 않는 투수·포수의 호흡'을 동시에 떠올리게 하는 말이에요."}],"ko":"닳지 않는 배터리","lit":"끊기지 않는 / 배터리","s":"외래어 バッテリー는 가타카나, 切れない는 한자 + 히라가나예요.","c":"고교야구 응원가라서 바로 '투수와 포수(배터리)'가 떠올라요. 지치지 않는 에너지이자, 서로를 믿고 공을 주고받는 끈끈한 관계라는 두 겹의 뜻이에요."},{"id":"c6","tk":[{"t":"{魂|たましい}","p":"명사","m":"영혼, 혼","n":"魂은 쿤요미 たましい, 온요미 こん(闘魂 とうこん, 투혼)이에요. 한국어 '혼(魂)'과 같은 한자예요."},{"t":"の"},{"t":"{限|かぎ}り","p":"명사","m":"~이 다하도록, 한도","b":"{限|かぎ}り","w":"동사 限る(한정하다)에서 나온 명사라, 한자 限 뒤에 오쿠리가나 り가 붙어요.","n":"〜の限り = '~이 다하는 데까지'. 力の限り(힘이 닿는 데까지), 魂の限り(혼이 다하도록)."}],"ko":"혼이 다하도록","lit":"영혼 / 의 / 한도까지","g":[{"k":"〜の{限|かぎ}り","d":"명사 + の限り = '~이 다할 때까지, ~껏'. 魂の限り = 혼신을 다해."}]},{"id":"c7","tk":[{"t":"{宿命|しゅくめい}"},{"t":"って"},{"t":"やつ"},{"t":"を"},{"t":"{燃|も}やして"}],"ko":"숙명이라는 녀석을 불태워서","lit":"숙명 / 이라는 / 녀석 / 을 / 불태워서","g":[{"k":"자동사 / 타동사","d":"燃える(타다) ↔ 燃やす(태우다). 일본어에는 이런 짝이 많아요. 여기서는 내가 숙명을 '태운다'는 타동사예요."}],"c":"바꿀 수 없는 숙명을 원망하는 대신 연료처럼 '불태운다'는 발상이에요. 정해진 조건을 받아들이고 그걸 힘으로 바꾸는 태도죠. Pretender가 運命·定め를 받아들이며 끝났다면, 이 곡은 宿命를 태우며 달려 나가요."},{"id":"c8","tk":[{"t":"{暴|あば}れ{出|だ}す"},{"t":"だけ"},{"t":"なんだ"}],"ko":"그저 마음껏 날뛸 뿐이야","lit":"날뛰기 시작하다 / 뿐 / 인 거야","g":[{"k":"〜だけなんだ","d":"'그저 ~할 뿐이야'. だけ(~뿐) + なんだ(힘주어 말하기). 다른 건 몰라도 이것만은 한다는 결심이에요."}],"c":"결과나 기적은 상관없이 '그저 날뛸 뿐'. 후렴 전체가 결과보다 지금 전력을 다하는 것을 노래해요."}]},{"label":"2절 · Aメロ","note":"1절의 환희와 반대로, 음악조차 듣기 싫었던 좌절의 시간을 돌아봐요.","lines":[{"id":"d1","tk":[{"t":"{沈黙|ちんもく}","p":"명사","m":"침묵","n":"한국어 '침묵(沈默)'과 같은 한자어예요."},{"t":"が"},{"t":"{続|つづ}いた","p":"동사","m":"이어진","b":"{続|つづ}く","bm":"이어지다, 계속되다","w":"어간 続는 한자, いた는 히라가나예요."},{"t":"イヤフォン","p":"명사","m":"이어폰","w":"영어 earphone을 옮긴 외래어라 가타카나예요. フォ는 フ에 작은 ォ를 붙여 fo 소리를 만든 외래어용 표기예요.","n":"일본어 사전에서는 イヤホン이 더 일반적인 표기예요. 같은 외래어라도 표기가 여러 가지일 수 있어요."}],"ko":"침묵만 이어지던 이어폰","lit":"침묵 / 이 / 이어진 / 이어폰","c":"이어폰을 끼고 있는데 아무것도 흘러나오지 않는, 음악조차 듣고 싶지 않던 시기예요. 1절의 '목소리'와 '멜로디'가 2절에서는 '침묵'으로 바뀌었어요."},{"id":"d2","tk":[{"t":"{自分|じぶん}","p":"명사","m":"자기 자신, 나","n":"自分은 '자기 자신'. 회화에서는 '나'라는 1인칭처럼 쓰기도 해요."},{"t":"の"},{"t":"{弱|よわ}さ","p":"명사","m":"약함","b":"{弱|よわ}さ","w":"い형용사 弱い(약하다)의 어간 弱 + 명사를 만드는 さ예요. 어간은 한자, さ는 히라가나.","n":"い형용사 어간 + さ = 정도를 나타내는 명사. 弱い → 弱さ(약함), 悔しい → 悔しさ(분함), 熱い → 熱さ(뜨거움). 이 곡에 셋 다 나와요."},{"t":"に","m":"~에 (원인)"}],"ko":"나 자신의 약함에","lit":"자신 / 의 / 약함 / 에","g":[{"k":"い형용사 + さ","d":"い를 떼고 さ를 붙이면 명사가 돼요. 弱い → 弱さ, 悔しい → 悔しさ, 熱い → 熱さ."}]},{"id":"d3","tk":[{"t":"{遠|とお}ざかってく","p":"동사","m":"멀어져 가는","b":"{遠|とお}ざかる","bm":"멀어지다","w":"어간 遠는 한자, ざかってく는 히라가나예요.","n":"遠ざかっていく에서 い가 빠진 회화체예요(〜ていく → 〜てく). 遠い(멀다)에서 나온 동사예요."},{"t":"{未来|みらい}"}],"ko":"멀어져 가던 미래","lit":"멀어져 가는 / 미래","g":[{"k":"〜てく","d":"〜ていく(~해 가다)의 회화체. 遠ざかっていく → 遠ざかってく."}],"c":"1절의 振り向いた未来(우리 쪽을 돌아본 미래)와 정반대예요. 자신의 약함 때문에 미래가 등을 돌려 멀어져 가던 시간을 말해요."},{"id":"d4","tk":[{"t":"「"},{"t":"{大丈夫|だいじょうぶ}","p":"な형용사","m":"괜찮다","w":"한자어라 한자로 써요.","n":"大丈夫는 원래 '훌륭한 사나이(대장부)'라는 뜻의 한자어예요. 한국어 '대장부'와 같은 한자인데, 일본어에서는 '괜찮다'라는 뜻으로 바뀌어 일상에서 가장 많이 쓰는 말 중 하나가 됐어요."},{"t":"」"},{"t":"や","p":"조사","m":"~이나, ~랑","n":"や는 몇 가지를 예로 들며 늘어놓을 때 써요. AやB = A나 B (그 밖에도)."},{"t":"「"},{"t":"{頑|がん}{張|ば}れ","p":"동사(명령형)","m":"힘내, 파이팅","b":"{頑|がん}{張|ば}る","bm":"힘내다, 버티다","w":"어간 頑張는 한자, 명령형 어미 れ는 히라가나예요.","n":"頑張れ는 '힘내!'. 일본에서 응원할 때 가장 많이 쓰는 말이에요. 다만 이미 버티고 있는 사람에게는 부담이 될 수 있어서, 지친 사람에게는 조심해서 쓰자는 이야기도 있어요."},{"t":"」"},{"t":"って"},{"t":"{歌詞|かし}","p":"명사","m":"가사","n":"한국어 '가사(歌詞)'와 같은 한자어예요."},{"t":"に","m":"~에 (대상)"}],"ko":"“괜찮아”나 “힘내” 같은 가사에","lit":"괜찮다 / 나 / 힘내라 / 라는 / 가사 / 에","g":[{"k":"〜や〜","d":"A や B = 'A나 B (등)'. 대표적인 것 몇 가지를 예로 들 때 써요."},{"k":"명령형 (5단동사)","d":"頑張る → 頑張れ. 끝 う단을 え단으로 바꿔요. 届く → 届け도 같은 규칙이에요."}],"c":"응원가에 흔한 '괜찮아', '힘내'라는 말에 오히려 짜증이 났던 밤. 응원가인 이 곡이 스스로 '뻔한 응원 가사'를 돌아보는 부분이라 더 솔직하게 들려요."},{"id":"d5","tk":[{"t":"{苛|いら}{立|だ}って","p":"동사","m":"짜증이 나서","b":"{苛|いら}{立|だ}つ","bm":"짜증 나다, 초조해하다","w":"苛(가혹할 가)+立つ(서다)의 동사예요. 어간은 한자, 활용 부분 って는 히라가나.","n":"イライラ(짜증, 안절부절)와 뿌리가 같은 말이에요. イライラ는 의태어라 가타카나로 많이 써요."},{"t":"しまった","p":"보조동사","m":"~해 버렸다","b":"しまう","bm":"(완전히) ~해 버리다","w":"보조동사로 쓰일 때는 히라가나로 쓰는 게 표기 원칙이에요."}],"ko":"짜증이 나 버렸던","lit":"짜증 나서 / 버렸다","g":[{"k":"〜てしまった","d":"'~해 버렸다'. 원치 않았는데 그렇게 됐다는 후회예요. 苛立ってしまった = 짜증이 나 버렸다."}],"s":"苛立つ의 苛는 '가혹하다'는 뜻의 한자예요. 한자를 알면 '마음을 날카롭게 찌르는 짜증'이라는 느낌이 보여요."},{"id":"d6","tk":[{"t":"そんな"},{"t":"{夜|よる}","p":"명사","m":"밤"},{"t":"も"},{"t":"あった","p":"동사","m":"있었다","b":"ある","bm":"있다 (사물·일)","w":"ある(있다)는 보통 히라가나로 써요."}],"ko":"그런 밤도 있었어","lit":"그런 / 밤 / 도 / 있었다","c":"'그런 밤도 있었다'고 과거형으로 담담하게 정리해요. 지금은 그 시간을 지나왔다는 뜻이 담겨 있어요."}]},{"label":"2절 · Bメロ","note":"1절 Bメロ와 같은 틀에 '분함'과 '손톱자국'을 담았어요.","lines":[{"id":"e1","tk":[{"t":"{夢|ゆめ}"},{"t":"じゃない"},{"t":"　"},{"t":"{夢|ゆめ}"},{"t":"じゃない"},{"t":"　"},{"t":"あの","p":"연체사","m":"그 (서로 아는)","w":"지시어라 히라가나로 써요.","n":"あの는 '저'지만, 말하는 사람과 듣는 사람이 함께 아는 과거를 가리킬 때도 써요. あの日 = (우리가 아는) 그날."},{"t":"{日|ひ}","p":"명사","m":"날"},{"t":"の"},{"t":"{悔|くや}しさ","p":"명사","m":"분함, 억울함","b":"{悔|くや}しさ","w":"悔しい(분하다)의 어간 悔 + 명사를 만드는 さ예요.","n":"悔しい는 지거나 실패했을 때의 '분하다, 억울하다'예요. 일본 스포츠에서 아주 자주 듣는 감정 표현으로, 진 선수가 인터뷰에서 '悔しいです'라고 말하는 모습이 흔해요."},{"t":"と"}],"ko":"꿈이 아니야, 꿈이 아니야. 그날의 분함과","lit":"꿈 / 이 아니다 / 꿈 / 이 아니다 / 그 / 날 / 의 / 분함 / 과","c":"あの日(그날)는 아마 진 경기, 실패한 날이에요. 분했던 기억도 꿈이 아니라 진짜였다고 인정해요."},{"id":"e2","tk":[{"t":"{忘|わす}れない","p":"동사","m":"잊지 않아","b":"{忘|わす}れる","bm":"잊다","w":"어간 忘는 한자, れない는 히라가나예요."},{"t":"　"},{"t":"{忘|わす}れない","p":"동사","m":"잊지 않아","b":"{忘|わす}れる","bm":"잊다"},{"t":"　"},{"t":"{掌|てのひら}","p":"명사","m":"손바닥","w":"掌 한 글자를 てのひら라고 읽어요. 보통은 手のひら·手の平로 쓰는데, 가사에서는 한 글자 掌로 써서 문어적인 느낌을 냈어요.","n":"掌의 온요미는 しょう(合掌 がっしょう, 합장)예요. 한 글자 한자에 긴 쿤요미가 붙는 예예요."},{"t":"の"},{"t":"{爪|つめ}{痕|あと}","p":"명사","m":"손톱자국","w":"爪(손톱)+痕(자국)의 고유어예요.","n":"분해서 주먹을 꽉 쥐었을 때 손바닥에 남는 손톱자국이에요. 爪痕는 '재해가 남긴 상처'라는 뜻으로 뉴스에서도 자주 써요."}],"ko":"잊지 않아, 잊지 않아. 손바닥의 손톱자국","lit":"잊지 않는다 / 잊지 않는다 / 손바닥 / 의 / 손톱자국","s":"1절의 足跡(발자국)과 2절의 爪痕(손톱자국)이 짝을 이뤄요. 跡는 지나간 자리, 痕는 상처가 남은 자국이라 둘 다 '흔적'이지만 한자가 달라요.","c":"너무 분해서 주먹을 꽉 쥐면 손톱이 손바닥을 파고들어 자국이 남죠. 말로 하지 않고 몸에 남은 흔적으로 '분함'을 보여 주는 표현이에요."},{"id":"e3","tk":[{"t":"{無駄|むだ}"},{"t":"じゃない"},{"t":"　"},{"t":"{無駄|むだ}"},{"t":"じゃない"},{"t":"　"},{"t":"それ"},{"t":"も"},{"t":"{全|すべ}て","p":"명사","m":"모두, 전부","b":"{全|すべ}て","w":"全(온전할 전)은 한자, て는 오쿠리가나예요. すべて는 히라가나로만 쓰는 경우도 많아요."},{"t":"{讃|たた}えたい","p":"동사","m":"기리고 싶다","b":"{讃|たた}える","bm":"칭송하다, 기리다","w":"たたえる는 보통 称える로 쓰는데, 여기서는 讃(기릴 찬)을 썼어요. 讃은 조요칸지가 아니라서 일반 문서에서는 잘 쓰지 않는, 노래다운 표기예요.","n":"讃美歌(찬미가)처럼 '기리다, 찬양하다'는 뜻의 한자예요. 단순한 칭찬이 아니라 '존경을 담아 기리다'는 무게가 있어요."}],"ko":"헛되지 않아, 헛되지 않아. 그것도 전부 기리고 싶어","lit":"헛됨 / 이 아니다 / 헛됨 / 이 아니다 / 그것 / 도 / 전부 / 기리고 싶다","g":[{"k":"〜たい","d":"동사 ます형 + たい = '~하고 싶다'. 讃える → 讃えたい."}],"s":"讃은 조요칸지 밖의 글자예요. Pretender의 綺麗·繋처럼, 히게단 가사는 감정이 실린 말에 일부러 무게 있는 한자를 써요.","c":"분함도 손톱자국도 헛되지 않았다며 '기리고 싶다'고 말해요. 실패한 과거를 감추지 않고 자랑스럽게 받아들이는 태도예요. 夢じゃない → 嘘じゃない → 無駄じゃない로 '~じゃない'가 계속 모양을 바꿔요."},{"id":"e4","tk":[{"t":"もう","p":"부사","m":"이제","w":"부사라 히라가나로 써요.","n":"もう는 '이미'라는 뜻도 있지만, もうあと少し처럼 '이제 조금만 더'라는 뜻으로도 써요."},{"t":"あと","p":"부사","m":"앞으로 (남은)","w":"한자 後로도 쓰지만 '앞으로 ~만 남았다'는 뜻일 때는 히라가나로 많이 써요."},{"t":"{少|すこ}し","p":"부사","m":"조금","b":"{少|すこ}し","w":"어간 少는 한자, し는 오쿠리가나예요."}],"ko":"이제 조금만 더","lit":"이제 / 앞으로 / 조금","g":[{"k":"あと + 수량","d":"'앞으로 ~ 남았다'. あと少し = 조금만 더, あと一点 = 한 점만 더."}],"c":"결승선이 눈앞에 보일 때의 '조금만 더!'예요. 짧은 한마디로 2절을 끝내고 다음 부분으로 넘어가요."}]},{"label":"Cメロ · 브리지","note":"Cメロ는 1·2절과 다른 새 멜로디가 나오는 부분이에요. 기대와 부담, 그리고 등번호 이야기가 나와요.","lines":[{"id":"f1","tk":[{"t":"{願|ねが}い","p":"명사","m":"소원","b":"{願|ねが}い","w":"동사 願う(바라다)에서 나온 명사라, 한자 願 뒤에 오쿠리가나 い가 붙어요."},{"t":"の"},{"t":"{熱|あつ}さ","p":"명사","m":"뜨거움, 열기","b":"{熱|あつ}さ","w":"熱い(뜨겁다)의 어간 熱 + 명사를 만드는 さ예요.","n":"あつい는 한자에 따라 뜻이 달라요. 熱い(물체·마음이 뜨겁다), 暑い(날씨가 덥다), 厚い(두껍다). 여기서는 마음의 열기라 熱."},{"t":"に","m":"~에 (원인)"}],"ko":"소원의 열기에","lit":"소원 / 의 / 뜨거움 / 에","s":"願い는 동사 願う에서, 熱さ는 형용사 熱い에서 나온 명사예요. 뜻을 담은 願·熱은 한자, 끝의 い·さ는 히라가나라서 품사가 바뀐 부분이 눈에 보여요."},{"id":"f2","tk":[{"t":"{汗|あせ}","p":"명사","m":"땀"},{"t":"まみれ","p":"접미사","m":"~범벅, ~투성이","w":"'~범벅'을 뜻하는 접미사라 히라가나로 써요. 한자 塗れ는 거의 쓰지 않아요.","n":"명사 + まみれ = 온몸이 ~로 뒤덮인 상태. 汗まみれ(땀범벅), 泥まみれ(진흙범벅). 1절의 だらけ와 비슷하지만, まみれ는 '몸에 들러붙어 뒤덮였다'는 느낌이 더 강해요."},{"t":"に","m":"~이/가 (되다)"},{"t":"なったり","p":"동사","m":"되기도 하고","b":"なる","bm":"되다","w":"なる(되다)는 기본 동사라 히라가나로 써요."}],"ko":"땀범벅이 되기도 하고","lit":"땀 / 범벅 / 이 / 되기도 하고","g":[{"k":"〜になる","d":"명사 + になる = '~이 되다'. 汗まみれになる = 땀범벅이 되다."},{"k":"〜たり","d":"'~하기도 하고'. 몇 가지 동작을 예로 들어 늘어놓을 때 써요."}]},{"id":"f3","tk":[{"t":"{期待|きたい}","p":"명사","m":"기대","n":"한국어 '기대(期待)'와 같은 한자어예요."},{"t":"{背|せ}{負|お}って","p":"동사","m":"짊어지고","b":"{背|せ}{負|お}う","bm":"짊어지다, 업다","w":"背(등)+負う(지다)의 동사예요. 어간은 한자, って는 히라가나.","n":"背負う = 등에 지다. 期待を背負う = 기대를 짊어지다. 여기서는 を가 생략됐어요."},{"t":"{立|た}って","p":"동사","m":"서서","b":"{立|た}つ","bm":"서다","n":"〜を背負って立つ = '~을 짊어지고 서다' → '~을 떠맡다'라는 관용 표현이기도 해요."}],"ko":"기대를 짊어지고 서서","lit":"기대 / (를) / 짊어지고 / 서서","g":[{"k":"〜を{背|せ}{負|お}って{立|た}つ","d":"'~을 짊어지고 서다' → '~을 떠맡다'. 日本を背負って立つ = 일본의 미래를 짊어지다."},{"k":"조사 생략","d":"期待(を)背負って처럼 を가 생략됐어요."}],"c":"고교 선수들은 학교, 지역, 가족의 기대를 한 몸에 받아요. 고시엔에는 지역 대표가 나가기 때문에 고향 전체의 응원을 짊어지는 무게가 있어요."},{"id":"f4","tk":[{"t":"{重|おも}さ","p":"명사","m":"무게","b":"{重|おも}さ","w":"重い(무겁다)의 어간 + 명사를 만드는 さ예요."},{"t":"に","m":"~에 (원인)"},{"t":"{臆病|おくびょう}","p":"な형용사","m":"겁이 많음","n":"臆(겁낼 억)+病(병). 글자 그대로 '겁이 많은 병'이라는 뜻이에요. 臆病者 = 겁쟁이."},{"t":"に","m":"~하게 (되다)"},{"t":"なる","p":"동사","m":"되다","w":"なる(되다)는 기본 동사라 히라가나로 써요."},{"t":"けど"}],"ko":"그 무게에 겁이 나기도 하지만","lit":"무게 / 에 / 겁 많음 / 이 / 되다 / 지만","g":[{"k":"な형용사 + になる","d":"'~해지다'. 臆病 → 臆病になる(겁이 많아지다)."}],"s":"熱さ·汗·重さ처럼 몸의 감각을 나타내는 말이 Cメロ 내내 이어져요. 기대라는 보이지 않는 것을 '무게'라는 몸의 감각으로 바꿔 말해요."},{"id":"f5","tk":[{"t":"{僕|ぼく}ら"},{"t":"の"},{"t":"{背番号|せばんごう}","p":"명사","m":"등번호","n":"背(등)+番号(번호). 야구에서 1번은 에이스 투수, 2번은 포수처럼 번호가 포지션을 상징해요. 고교야구에서는 등번호를 받는 것 자체가 큰 의미예요."}],"ko":"우리의 등번호","lit":"우리 / 의 / 등번호","c":"고교야구에서는 정해진 인원만 등번호를 받아 벤치에 들어갈 수 있어서, 등번호는 노력의 증표이자 선택받은 무게예요."},{"id":"f6","tk":[{"t":"それ"},{"t":"は"},{"t":"{背中|せなか}","p":"명사","m":"등"},{"t":"じゃなく","p":"조동사(부정)","m":"~이 아니라","b":"ではない","w":"문법 요소라 히라가나로 써요.","n":"じゃなくて에서 て가 빠진 형태로, 문장을 다음 줄로 이어요."}],"ko":"그건 등이 아니라","lit":"그것 / 은 / 등 / 이 아니라","g":[{"k":"AじゃなくB","d":"'A가 아니라 B'. 背中じゃなく瞳の奥の… = 등이 아니라 눈동자 깊은 곳의…. 다음 줄까지 이어서 읽어요."}]},{"id":"f7","tk":[{"t":"{瞳|ひとみ}","p":"명사","m":"눈동자","n":"目(め, 눈)보다 시적인 말이에요. 가사에서 '눈빛, 눈망울'을 말할 때 자주 써요."},{"t":"の"},{"t":"{奥|おく}","p":"명사","m":"깊은 곳, 안쪽","n":"奥는 '안쪽 깊숙한 곳'. 心の奥(마음 깊은 곳)."},{"t":"の"},{"t":"アンサー","p":"명사","m":"대답, 답","w":"영어 answer를 옮긴 외래어라 가타카나예요. 일본어 答え(대답)가 있는데도 외래어를 골라, 노래다운 리듬과 세련된 느낌을 냈어요."},{"t":"　"},{"t":"{重|かさ}なって","p":"동사","m":"겹쳐져","b":"{重|かさ}なる","bm":"겹치다, 포개지다","w":"어간 重는 한자, なって는 히라가나예요.","n":"같은 重를 앞 줄에서는 おも(重さ, 무게), 여기서는 かさ(重なる, 겹치다)로 읽어요. 한 한자가 여러 쿤요미를 가진 예예요."}],"ko":"눈동자 깊은 곳의 대답이 겹쳐져","lit":"눈동자 / 의 / 깊은 곳 / 의 / 대답 / 겹쳐져","s":"重さ(おもさ)와 重なって(かさなって). 같은 한자 重가 가까운 줄에서 다른 읽기로 나와요. 루비를 확인하며 읽어 보세요.","c":"등번호는 등에 붙어 있는 게 아니라 눈동자 깊은 곳에 있다는 말이에요. 번호가 아니라 각자가 품은 '답', 왜 이걸 하는지에 대한 마음이 진짜 등번호라는 뜻이에요."},{"id":"f8","tk":[{"t":"{照|て}らし{合|あ}ってく","p":"동사","m":"서로 비춰 가는","b":"{照|て}らし{合|あ}う","bm":"서로 비추다","w":"照らす(비추다)+合う(서로 ~하다)의 복합동사에 〜てく(~해 가다)가 붙었어요. 어간은 한자, 나머지는 히라가나예요.","n":"동사 ます형 + 合う = '서로 ~하다'. 助け合う(서로 돕다), 見つめ合う(서로 바라보다)."},{"t":"FOREVER","p":"부사(영어)","m":"영원히","w":"영어를 대문자 알파벳 그대로 썼어요. 가타카나 フォーエバー가 아니라 대문자로 써서, 외치듯 힘이 실린 느낌을 줘요."}],"ko":"서로를 비춰 가, 영원히(FOREVER)","lit":"서로 비춰 가다 / 영원히","g":[{"k":"〜{合|あ}う","d":"동사 ます형 + 合う = '서로 ~하다'. 照らす → 照らし合う(서로 비추다)."},{"k":"〜てく","d":"〜ていく(~해 가다)의 회화체예요."}],"s":"이 곡에서 알파벳으로 쓴 영어는 FOREVER 하나예요. 그것도 대문자라서 가장 크게 외치는 말처럼 보여요.","c":"각자의 눈 속에 있는 '답'이 겹쳐지고 서로를 비춰 준다는 장면이에요. 팀은 등번호가 아니라 같은 마음으로 이어진다는 뜻이에요."}]},{"label":"Dメロ · 마지막 후렴 전","note":"불안을 이겨 내고 마지막 후렴으로 달려가는 부분이에요.","lines":[{"id":"g1","tk":[{"t":"{緊張|きんちょう}","p":"명사","m":"긴장","n":"한국어 '긴장(緊張)'과 같은 한자어예요."},{"t":"から"},{"t":"{不安|ふあん}","p":"명사","m":"불안","n":"한국어 '불안(不安)'과 같은 한자어예요."},{"t":"が"},{"t":"{芽|め}{生|ば}えて","p":"동사","m":"싹터서","b":"{芽|め}{生|ば}える","bm":"싹트다","w":"芽(싹)+生える(나다)가 합쳐진 동사예요. 어간은 한자, えて는 히라가나.","n":"生える(はえる)의 は가 앞말과 합쳐지며 ば로 탁해졌어요(렌다쿠). 恋が芽生える(사랑이 싹트다)처럼 감정에도 써요."}],"ko":"긴장에서 불안이 싹터서","lit":"긴장 / 에서 / 불안 / 이 / 싹터서","c":"불안을 식물처럼 그려요. 긴장이라는 씨앗에서 싹이 트고(芽生えて), 다음 줄에서 뿌리를 내려요."},{"id":"g2","tk":[{"t":"{根|ね}","p":"명사","m":"뿌리"},{"t":"を"},{"t":"{張|は}る","p":"동사","m":"뻗다, 펼치다","n":"根を張る = 뿌리를 내리다(뻗다). 張る는 줄·천 등을 팽팽하게 펼치는 것이에요."},{"t":"みたいに","p":"조동사","m":"~처럼, ~하듯이","b":"みたいだ","n":"みたいだ(~같다)의 부사형이에요. 〜みたいに = '~처럼'."}],"ko":"뿌리를 내리듯이","lit":"뿌리 / 를 / 뻗다 / 처럼","g":[{"k":"〜みたいに","d":"동사·명사 + みたいに = '~처럼, ~하듯이'. 根を張るみたいに = 뿌리내리듯이."}]},{"id":"g3","tk":[{"t":"{僕|ぼく}ら"},{"t":"を"},{"t":"{支配|しはい}する","p":"동사","m":"지배하다","b":"{支配|しはい}する","w":"한자어 支配는 한자, する는 히라가나예요.","n":"한자어 명사 + する = 동사. 支配(지배) + する = 지배하다. 한국어 '~하다'와 똑같은 구조예요."}],"ko":"우리를 지배하는","lit":"우리 / 를 / 지배하다","g":[{"k":"한자어 + する","d":"한자어 명사에 する를 붙이면 동사가 돼요. 支配する(지배하다), 期待する(기대하다). 한국어 '~하다'와 같아요."}]},{"id":"g4","tk":[{"t":"そんな"},{"t":"もの","p":"형식명사","m":"것","w":"'것'이라는 뜻의 형식명사라 히라가나로 써요. 눈에 보이는 물건이라는 뜻일 때는 物로 써요."},{"t":"に","m":"~에게"}],"ko":"그딴 것에","lit":"그런 / 것 / 에게","c":"そんなもの(그런 것)는 상대를 깎아내리는 말투예요. 불안을 '그딴 것'으로 낮춰 부르며 맞설 준비를 해요."},{"id":"g5","tk":[{"t":"{負|ま}けて","p":"동사","m":"져서","b":"{負|ま}ける","bm":"지다","w":"어간 負는 한자, けて는 히라가나예요."},{"t":"たまるか","p":"표현","m":"~할까 보냐","w":"'참을 수 있겠냐'는 관용 표현이라 히라가나로 써요. 한자 堪る는 거의 쓰지 않아요.","n":"〜てたまるか = '~해서 되겠냐, 절대 ~하지 않겠다'. 負けてたまるか = 질 수는 없지!"},{"t":"と","m":"~라고 (인용)"}],"ko":"질까 보냐 하고","lit":"져서 / 참을 수 있겠냐 / 라고","g":[{"k":"〜てたまるか","d":"동사 て형 + たまるか = '~할까 보냐, 절대 ~ 못 하지'. 강한 반발과 결의를 나타내요."}],"c":"負けてたまるか는 스포츠 만화나 드라마에서 주인공이 이를 악물고 외치는 대표적인 대사예요."},{"id":"g6","tk":[{"t":"{今|いま}","p":"명사","m":"지금"},{"t":"　"},{"t":"{宿命|しゅくめい}"},{"t":"って"},{"t":"やつ"},{"t":"を"}],"ko":"지금, 숙명이라는 녀석을","lit":"지금 / 숙명 / 이라는 / 녀석 / 을","c":"후렴의 宿命ってやつを 앞에 今(지금)를 붙였어요. 후렴에서는 다짐이었던 말이 여기서는 '지금 이 순간'의 행동이 돼요."},{"id":"g7","tk":[{"t":"{燃|も}やして"},{"t":"　"},{"t":"{暴|あば}れ{出|だ}す"}],"ko":"불태워서 날뛰기 시작해","lit":"불태워서 / 날뛰기 시작한다","c":"후렴의 暴れ出すだけなんだ(날뛸 뿐이야)와 달리, 여기서는 だけなんだ 없이 暴れ出す로 끊어요. 다짐이 아니라 지금 바로 행동으로 옮기는 순간이에요."},{"id":"g8","tk":[{"t":"{届|とど}け"},{"t":"!"}],"ko":"닿아라!","lit":"닿아라!","c":"1절 Bメロ의 僕らの想い 届け!가 짧게 다시 나와요. 이 외침을 신호로 마지막 후렴이 시작돼요."}]},{"label":"ラストサビ · 마지막 후렴","note":"1절 후렴과 가사가 같아요. 각 줄을 열면 앞의 해석을 그대로 볼 수 있어요.","lines":[{"same":"c1"},{"same":"c2"},{"same":"c3"},{"same":"c4"},{"same":"c5"},{"same":"c6"},{"same":"c7"},{"same":"c8"}]},{"label":"アウトロ · 마무리","note":"숙명을 '불태우던' 후렴에서, 숙명을 '치켜들고' 맞서는 결말로 끝나요.","lines":[{"id":"h1","tk":[{"t":"ただ"},{"t":"{宿命|しゅくめい}"},{"t":"って"},{"t":"やつ"},{"t":"を"},{"t":"かざして","p":"동사","m":"높이 치켜들고","b":"かざす","bm":"(높이) 치켜들다, 내걸다","w":"한자 翳す가 있지만 조요칸지가 아니라 히라가나로 써요.","n":"かざす는 손이나 물건을 높이 들어 보이는 것이에요. 깃발을 내걸 듯 숙명을 높이 치켜든다는 이미지예요."}],"ko":"그저 숙명이라는 녀석을 높이 치켜들고","lit":"그저 / 숙명 / 이라는 / 녀석 / 을 / 치켜들고","c":"후렴에서는 숙명을 '불태웠는데(燃やして)', 마지막에는 '치켜들어요(かざして)'. 숙명을 연료로 쓰던 데서, 이제는 깃발처럼 앞세우고 나아가요."},{"id":"h2","tk":[{"t":"{立|た}ち{向|む}かう","p":"동사","m":"맞서다","w":"立つ(서다)+向かう(향하다)의 복합동사예요. 어간은 한자, 활용 부분은 히라가나예요.","n":"立ち向かう = (어려움·적에) 맞서다. 困難に立ち向かう = 어려움에 맞서다."},{"t":"だけ"},{"t":"なんだ"}],"ko":"맞서 나갈 뿐이야","lit":"맞서다 / 뿐 / 인 거야","c":"곡은 '날뛸 뿐이야'가 아니라 '맞설 뿐이야'로 끝나요. 숙명과 싸우는 게 아니라, 숙명을 안고 앞을 향해 서는 결말이에요."}]}]},"laughter":{"id":"laughter","title":"Laughter","artist":"Official髭男dism","year":2020,"eyebrow":"Official髭男dism · 2020","sub":"새장 같은 거리를 떠나 '웃음'이라는 이름의 새로 날아오르는 노래. 영화 「コンフィデンスマンJP プリンセス編」 주제가.","release":"2020년 7월 선행 디지털 발매 · 『HELLO EP』(2020년 8월 5일) 수록","tieIn":"영화 「コンフィデンスマンJP プリンセス編」(2020) 주제가","lyricist":"藤原聡","composer":"藤原聡","listen":"https://www.youtube.com/results?search_query=Official%E9%AB%AD%E7%94%B7dism+Laughter","intro":"Laughter는 2020년 7월에 먼저 디지털로 공개되고, 8월 5일 발매된 『HELLO EP』에 실린 곡이에요. 사기꾼들의 활약을 그린 영화 「コンフィデンスマンJP プリンセス編」의 주제가예요. 히게단은 드라마판의 ノーダウト, 첫 영화의 Pretender에 이어 이 시리즈의 노래를 세 번째로 맡았어요.\n\n곡의 주인공은 쇠창살 같은 거리에 갇혀 있던 새예요. 거울을 봐도 깃털 하나 보이지 않고, 세상은 '정말 날 수 있나요?'라고 묻지만, 새는 Yes도 No도 말하지 않고 하늘만 바라봐요. 그 새의 이름이 '웃음'이라는 뜻의 ラフター(Laughter)예요. 새장, 날개, 바람, 폭우로 이어지는 비유를 따라가며 읽어 보세요.","notes":[{"tag":"배경","title":"「コンフィデンスマンJP」와 히게단","body":"「コンフィデンスマンJP」는 2018년 드라마로 시작한 코미디 시리즈예요. 사기꾼 세 사람이 욕심 많은 악당을 속여 넘기는 이야기로, 제목의 コンフィデンスマン은 영어 confidence man(신용 사기꾼)에서 왔어요.\n\n히게단은 이 시리즈의 노래를 세 번 맡았어요. 드라마의 ノーダウト(2018), 첫 영화 「ロマンス編」의 Pretender(2019), 그리고 두 번째 영화 「プリンセス編」의 Laughter(2020)예요. 「プリンセス編」은 코로나19 확산으로 개봉이 미뤄졌다가 2020년 7월 23일에 개봉했어요.\n\n藤原聡는 이 곡을 '영화의 세계관과 이어지면서, 자기답게 살아가는 것, 나에게 소중한 것과 함께 인생을 걸어가는 것의 멋짐을 노래한 곡'이라고 소개했어요. Pretender가 이뤄지지 않는 사랑을 연극에 빗댄 노래였다면, Laughter는 새장을 부수고 날아가는 새의 노래예요."},{"tag":"표현","title":"새장을 부순 새","body":"이 곡은 처음부터 끝까지 새의 비유로 이어져요. 1절에서는 거울 속에서 [[{羽|は}{根|ね}]](깃털)을 찾다가 [[{鉄|てつ}{格|ごう}{子|し}みたいな{街|まち}]](쇠창살 같은 거리)를 떠나기로 해요. 후렴에서는 [[{翼|つばさ}]](날개)가 움직이냐는 물음 끝에 [[ケージ]](새장)를 부숴요.\n\n2절에서는 거센 바람에 떠밀려 다른 새의 [[{航|こう}{路|ろ}]](항로)로 잘못 들어서고, [[{乱|らん}{気|き}{流|りゅう}]](난기류) 속에서 빛을 찾아요. 브리지에서는 전례 없는 폭우 속에서 [[{羽|は}ばたいて]](날갯짓해) 앞길을 향해요.\n\n거울을 들여다보는 사람이 곧 새라는 점에서, 새는 화자 자신으로 읽혀요. 쇠창살 같은 거리는 나를 붙잡아 두는 익숙한 환경, 새장을 부수는 건 그곳을 떠나는 결심으로 볼 수 있어요. 그 새의 이름이 '웃음'이라는 뜻의 ラフター라는 것도 함께 기억해 두세요."},{"tag":"표현","title":"Yes도 No도: 묻는 목소리와 대답하지 않는 새","body":"후렴은 정중한 질문으로 시작해요. 1절은 [[{翼|つばさ}は{動|うご}きますか？{本|ほん}{当|とう}に{飛|と}べますか？]](날개는 움직이나요? 정말 날 수 있나요?), 2절은 [[{現|げん}{実|じつ}は{見|み}えますか？{保|ほ}{証|しょう}は{出|で}{来|き}ますか？]](현실은 보이나요? 보장할 수 있나요?)예요. 이 곡에서 〜ます 정중체는 이 질문들에만 나와요. 그래서 반말로 노래하는 '나'와 달리, 거리를 두고 묻는 다른 목소리처럼 들려요.\n\n대답도 1절과 2절이 달라요. 1절은 [[{言|い}わずに]](말하지 않고), 2절은 [[{言|い}えずに]](말하지 못하고)예요. 言わない는 '안 말한다', 言えない는 가능형 言える의 부정이라 '못 말한다'예요. わ와 え 한 글자로, 일부러 대답하지 않는 지금의 새와 대답이 막혔던 과거의 내가 갈려요.\n\nYes와 No는 알파벳으로 썼어요. 일본에서도 [[イエスかノーか]](예스냐 노냐)처럼 일상에서 쓰는 말이라, 딱 잘라 대답하라는 압박이 그대로 느껴져요."},{"tag":"문화","title":"気持ちだけ受け取る: 마음만 받을게","body":"일본에서는 호의나 선물을 정중하게 사양할 때 [[お{気|き}{持|も}ちだけいただきます]](마음만 받겠습니다)라고 말해요. 상대의 마음은 고맙게 받되 물건이나 제안은 받지 않겠다는 뜻이에요. 한국어 '마음만 받을게'와 거의 같은 말이라 쓰임도 비슷해요.\n\n1절의 [[それを{引|ひ}き{留|と}める{言|こと}{葉|ば}も　{気|き}{持|も}ちだけ{受|う}け{取|と}るよ]]는 이 표현을 빌린 말이에요. 떠나지 말라는 말에 화를 내지도, 흔들리지도 않고 마음만 받아 둬요. 바로 이어지는 [[どうも{有|あり}{難|がと}う]](정말 고마워)까지, 정중하지만 단호한 작별이에요."},{"tag":"문화","title":"有難う: '있기 어렵다'에서 온 고마움","body":"ありがとう는 형용사 [[{有|あ}り{難|がた}い]]에서 왔어요. 글자 그대로 '있기(有) 어렵다(難)', 곧 '드물다'는 뜻이었고, 드물고 귀한 일이라는 데서 '고맙다'로 뜻이 넓어졌어요. ありがたく의 소리가 바뀌어 ありがとう가 됐어요.\n\n요즘 일상 글에서는 히라가나 ありがとう가 더 흔해요. 이 곡은 한자 有難う로 써서 그 원래 뜻이 글자에 그대로 남아 있어요.\n\n앞에 붙은 [[どうも]]는 '정말, 참'이라는 부사예요. どうも만 말해도 '고마워요', '안녕하세요', '죄송해요'를 대신할 수 있어서, 일본에서 가장 편하게 쓰는 인사말 중 하나예요."},{"tag":"표기","title":"같은 한자 抱의 세 가지 읽기","body":"한자 抱(안을 포)는 곡마다 다르게 읽혀 왔어요.\n\n[[{抱|だ}きしめて]](꼭 끌어안아): Pretender. 팔로 꼭 안는 だく예요.\n\n[[{抱|かか}えて]](감싸 안고, 떠안고): らしさ. 이 곡의 [[{膝|ひざ}を{抱|かか}えた]](무릎을 끌어안은)도 같은 かかえる예요.\n\n[[{抱|いだ}き]](마음에 품고): 이 곡의 [[そんな{希|き}{望|ぼう}{抱|いだ}き]](그런 희망을 품고). 꿈이나 희망, 의문 같은 마음을 품을 때는 いだく로 읽어요.\n\n세 읽기 모두 '안는다'는 뜻이에요. だく는 몸으로 안고, かかえる는 팔 안에 감싸 들고, いだく는 마음속에 품어요. 한자 하나에 읽기가 여럿이라 처음엔 어렵지만, 곡을 따라가며 만나면 문맥으로 고르는 감이 생겨요."},{"tag":"표기","title":"이 곡의 가타카나·알파벳·한자","body":"**가타카나**: [[ラフター]]·[[ケージ]]·[[ゴール]]·[[サーチライト]]는 모두 영어에서 온 외래어예요. 제목은 알파벳 Laughter인데 가사 속 새의 이름은 가타카나 ラフター로 썼어요. 같은 말을 제목에서는 영어 글자로, 노래 속에서는 일본어 소리로 보여 주는 셈이에요.\n\n**알파벳**: 대답을 뜻하는 Yes·No만 알파벳 그대로 썼어요. 가타카나 イエス·ノー로 쓰지 않아서 '대답'이라는 말이 눈에 확 띄어요.\n\n**조요칸지 밖의 한자**: [[{覗|のぞ}く]]의 覗, [[{囀|さえず}り]]의 囀는 일상 글에 쓰도록 정한 조요칸지 목록에 없는 글자예요. 히라가나로 써도 되는 말을 한자로 썼어요. Pretender의 綺麗처럼 히게단 가사에는 이런 한자가 종종 나와요.\n\n**한자와 히라가나를 고른 곳**: 형식명사 こと는 1절에서는 한자 [[{事|こと}]], 2절에서는 히라가나 [[こと]]예요. 보통 히라가나로 쓰는 ありがとう·ある는 [[{有|あり}{難|がと}う]]·[[{在|あ}りたい]]처럼 한자로 써서 원래 뜻을 살렸어요. 반대로 一つ는 히라가나 [[ひとつ]], 掛ける는 [[かけた]]로 풀었어요."}],"dict":{"{自|じ}{分|ぶん}":{"p":"명사","m":"자기, 나","w":"'자기 자신'을 뜻하는 한자어예요.","n":"自分은 '자기'라는 뜻인데, 회화에서는 '나'를 가리킬 때도 많이 써요. 自分で = 스스로."},"{鳥|とり}":{"p":"명사","m":"새","n":"鳥(새 조)는 새의 모습을 본뜬 한자예요. 이 곡은 처음부터 끝까지 새의 비유로 이어져요."},"{空|そら}":{"p":"명사","m":"하늘","n":"空는 から(빈), くう(공)로도 읽어요. 空っぽ(からっぽ) = 텅 빔."},"{今|いま}":{"p":"명사","m":"지금"},"{中|なか}":{"p":"명사","m":"안, 속","n":"中(가운데 중)를 쿤요미로 なか라고 읽어요. 鏡の中 = 거울 속."},"{声|こえ}":{"p":"명사","m":"목소리","n":"声는 聲(소리 성)의 일본식 약자예요. 歌声(うたごえ) = 노랫소리."},"{光|ひかり}":{"p":"명사","m":"빛","w":"동사 光る(ひかる, 빛나다)의 명사형인데, 명사로 쓸 때는 오쿠리가나 없이 光 한 글자로 써요.","n":"光(빛 광)는 한국어 '광선(光線)', '관광(觀光)'의 光예요."},"{正|ただ}しさ":{"p":"명사","m":"올바름","b":"{正|ただ}しい","bm":"올바르다","w":"正는 한자, しさ는 히라가나예요. 형용사 正しい의 い를 さ로 바꾼 명사예요.","n":"正しい(올바르다) → 正しさ(올바름). らしさ(~다움)와 같은 방법으로 만든 명사예요."},"ラフター":{"p":"명사(외래어)","m":"래프터, 웃음 (새의 이름)","w":"영어 laughter(웃음)를 가타카나로 옮긴 외래어예요. 제목은 알파벳 Laughter, 가사 속 새의 이름은 가타카나 ラフター예요.","n":"laughter는 laugh(웃다)의 명사형이에요. 일본어로 '웃음'은 笑い(わらい)인데, 일상에서 ラフター라는 말은 거의 쓰지 않아서 새의 이름처럼 들려요."},"Yes":{"p":"감동사(영어)","m":"예","w":"영어 yes를 알파벳 그대로 썼어요.","n":"일본어로는 はい예요. 가타카나로는 イエス라고 써요."},"No":{"p":"감동사(영어)","m":"아니요","w":"영어 no를 알파벳 그대로 썼어요.","n":"일본어로는 いいえ예요. 가타카나로는 ノー라고 써요."},"もの":{"p":"형식명사","m":"것","w":"'것'이라는 뜻의 형식명사라 히라가나로 써요."},"そんな":{"p":"연체사","m":"그런","w":"こんな(이런)·そんな(그런)·あんな(저런)는 지시어라 히라가나로 써요."},"ため":{"p":"형식명사","m":"~하기 위함","w":"'위함'을 뜻하는 형식명사라 히라가나로 써요. 한자 為로도 쓰지만 드물어요."},"の":{"p":"조사","m":"~의"},"は":{"p":"조사","m":"~은/는 (주제)","n":"조사로 쓸 때는 wa로 읽어요."},"が":{"p":"조사","m":"~이/가"},"を":{"p":"조사","m":"~을/를","n":"발음은 お(o)와 같아요."},"に":{"p":"조사","m":"~에"},"も":{"p":"조사","m":"~도"},"や":{"p":"조사","m":"~이나 (나열)","n":"몇 가지를 예로 들어 늘어놓을 때 써요. AやB = A나 B (말고도 더)."},"で":{"p":"조사","m":"~에서, ~로"},"よ":{"p":"조사(종조사)","m":"~야 (알려 주는 말투)","n":"문장 끝에 붙어 '내가 말해 줄게'라는 느낌을 더해요."},"か":{"p":"조사(종조사)","m":"~까 (질문)"},"けど":{"p":"조사","m":"~지만"},"だった":{"p":"조동사","m":"~였다","n":"だ(~이다)의 과거형이에요."},"でも":{"p":"조사(복합)","m":"~도 (AでもBでもない)","n":"で(~이다) + も(~도). AでもBでもない = A도 B도 아니다."},"では":{"p":"조사(복합)","m":"~이/가 (ではない)","n":"では는 dewa로 읽어요. ではない = ~이 아니다."},"なく":{"p":"조동사(부정)","m":"~아니고","b":"ない"},"なくて":{"p":"조동사(부정)","m":"~아니라, ~아니고","b":"ない"},"よりも":{"p":"조사(복합)","m":"~보다도","n":"비교의 より(~보다) + 강조의 も. 誰よりも = 누구보다도."},"だけ":{"p":"조사","m":"~만, ~뿐"}},"sections":[{"label":"1절 · Aメロ","note":"거울 속에서 날개깃을 찾던 '나'가 쇠창살 같은 거리를 떠나기로 결심해요. 붙잡는 말에는 고마움만 전하고요.","lines":[{"id":"a1","tk":[{"t":"{鏡|かがみ}","p":"명사","m":"거울","n":"鏡(거울 경)는 眼鏡(めがね, 안경)에도 들어 있는 한자예요."},{"t":"の"},{"t":"{中|なか}"},{"t":"を"},{"t":"{覗|のぞ}いても","p":"동사","m":"들여다봐도","b":"{覗|のぞ}く","bm":"들여다보다, 엿보다","w":"어간 覗는 한자, いても는 히라가나예요. 覗는 조요칸지(일상 글에 쓰도록 정한 한자 목록)에 없는 글자라 のぞく로 풀어 쓰는 일도 많은데, 가사에서는 한자로 썼어요.","n":"覗く는 틈이나 구멍, 거울처럼 좁은 곳을 들여다볼 때 써요. 窓を覗く = 창문을 들여다보다."},{"t":"　"},{"t":"{羽|は}{根|ね}","p":"명사","m":"깃털","w":"羽(깃 우)와 根(뿌리 근)를 합쳐 '깃털'을 나타내요. 羽 한 글자로도 はね라고 읽어요.","n":"羽根는 빠진 깃털 하나나 배드민턴 셔틀콕, 선풍기 날개처럼 '깃 모양의 것'에 많이 써요. 새에 달린 날개는 羽나 翼(つばさ)라고 해요."},{"t":"ひとつ","p":"명사","m":"하나","b":"{一|ひと}つ","bm":"하나","w":"一つ로 쓸 수 있는데 히라가나로 풀었어요. Pretender의 ひとり처럼, 숫자보다 '단 하나'라는 느낌을 살리는 표기로 볼 수 있어요."},{"t":"も"},{"t":"{見|み}つからない","p":"동사","m":"찾을 수 없다, 보이지 않는다","b":"{見|み}つかる","bm":"발견되다, 찾게 되다","w":"어간 見는 한자, つからない는 히라가나예요.","n":"見つかる(발견되다, 자동사)와 見つける(찾아내다, 타동사)는 짝이에요."},{"t":"けど"}],"ko":"거울 속을 들여다봐도 깃털 하나 보이지 않지만","lit":"거울 / 의 / 속 / 을 / 들여다봐도 / 깃털 / 하나 / 도 / 발견되지 않는다 / 지만","g":[{"k":"〜ても","d":"'~해도'. 동사 て형 + も. 覗いても = 들여다봐도, 探しても = 찾아도. 뒤에는 기대와 다른 결과가 와요."},{"k":"ひとつも + 부정","d":"'하나도 ~않다'. ひとつも見つからない = 하나도 찾지 못한다. 一人も(한 명도), 少しも(조금도)도 같은 틀이에요."}],"s":"어려운 覗는 조요칸지 밖의 글자인데도 한자로 쓰고, 쉬운 一つ는 오히려 히라가나 ひとつ로 풀었어요. 한 줄 안에 두 방향의 표기 선택이 같이 있어요.","c":"거울 속 자신에게서 깃털을 찾는다는 건, 거울을 보는 '나'가 곧 새라는 뜻으로 읽혀요. 날 수 있다는 증거가 하나도 없는 상태에서 곡이 시작해요."},{"id":"a2","tk":[{"t":"{空|そら}"},{"t":"を"},{"t":"{待|ま}ち{焦|こ}がれた","p":"동사","m":"애타게 기다린","b":"{待|ま}ち{焦|こ}がれる","bm":"애타게 기다리다","w":"待·焦 두 한자에 각각 오쿠리가나가 붙은 복합동사예요.","n":"待つ(기다리다) + 焦がれる(애태우다, 그리워하다). 焦는 らしさ의 焦る(あせる, 조급해하다), 焦げる(こげる, 타다)에도 쓰는 한자예요."},{"t":"　"},{"t":"{鳥|とり}"},{"t":"の","m":"~이/가 (꾸미는 말 속의 주어)"},{"t":"{急|せ}かす","p":"동사","m":"재촉하다","w":"어간 急는 한자, かす는 히라가나예요. 急를 いそぐ(서두르다)가 아니라 せかす로 읽는 말이에요.","n":"急かす = 남을 서두르게 하다. 急(급할 급)는 急ぐ(いそぐ, 서두르다), 急に(きゅうに, 갑자기)로도 읽어요."},{"t":"ような","p":"조동사","m":"~같은, ~하는 듯한","n":"ようだ(~같다)가 명사를 꾸밀 때의 모양이에요."},{"t":"{囀|さえず}り","p":"명사","m":"(새의) 지저귐","w":"囀는 조요칸지에 없는 어려운 글자라 さえずり로 히라가나로 쓰는 일도 많은데, 가사에서는 한자로 썼어요.","n":"囀る(さえずる, 지저귀다)의 명사형이에요. 왼쪽에 口(입 구)가 붙어 있어서 소리와 관련된 글자라는 게 보여요."},{"t":"が"},{"t":"{聞|き}こえる","p":"동사","m":"들리다","w":"어간 聞는 한자, こえる는 히라가나예요.","n":"聞く(듣다)는 일부러 듣는 것, 聞こえる(들리다)는 저절로 귀에 들어오는 것이에요. 見る(보다)와 見える(보이다)도 같은 짝이에요."}],"ko":"하늘을 애타게 기다려 온 새가 재촉하듯 지저귀는 소리가 들려","lit":"하늘 / 을 / 애타게 기다린 / 새 / 가 / 재촉하다 / 같은 / 지저귐 / 이 / 들리다","g":[{"k":"명사を{待|ま}ち{焦|こ}がれる","d":"'~을 애타게 기다리다'. 과거형 待ち焦がれた가 명사 鳥를 꾸며요. 空を待ち焦がれた鳥 = 하늘을 애타게 기다린 새."},{"k":"꾸미는 말 속의 の = が","d":"명사를 꾸미는 절 안에서는 주어의 が를 の로 바꾸는 일이 많아요. 鳥が急かす → 鳥の急かすような囀り(새가 재촉하는 듯한 지저귐)."},{"k":"〜ような + 명사","d":"'~같은, ~하는 듯한'. 夢のような話 = 꿈 같은 이야기."}],"s":"앞 줄의 覗에 이어 囀도 조요칸지 밖의 글자예요. Pretender의 綺麗처럼, 히게단 가사에는 히라가나로 써도 될 말을 이런 한자로 쓰는 곳이 종종 있어요.","c":"하늘을 애타게 기다린 새는 아직 날지 못한 내 안의 마음으로 읽을 수 있어요. 그 새가 '빨리 가자'고 재촉하는 소리가 들리기 시작한 거예요."},{"id":"a3","tk":[{"t":"{鉄|てつ}{格|ごう}{子|し}","p":"명사","m":"쇠창살","w":"鉄(쇠)와 格子(격자)를 합친 한자어예요.","n":"格子(こうし)는 한국어 '격자(格子)'와 같은 한자어인데, 鉄 뒤에서 こ가 ご로 흐려져 てつごうし가 돼요. 이렇게 뒷말 첫소리가 탁해지는 걸 連濁(れんだく)라고 해요."},{"t":"みたいな","p":"조동사","m":"~같은","n":"みたいだ(~같다)가 명사를 꾸밀 때의 모양이에요. 앞 줄의 ような와 뜻이 같고 더 회화적이에요."},{"t":"{街|まち}","p":"명사","m":"거리, 동네","n":"まち는 町로도 쓰는데, 街는 상점과 건물이 늘어선 번화한 거리라는 느낌이에요."},{"t":"を"},{"t":"{抜|ぬ}け{出|だ}す","p":"동사","m":"빠져나가다","w":"抜·出 두 한자에 오쿠리가나가 붙은 복합동사예요.","n":"抜ける(빠지다) + 出す(내다) = 빠져나오다. 出す가 뒤에 붙으면 だす로 흐려져요."},{"t":"{事|こと}","p":"형식명사","m":"것, 일","w":"형식명사 こと는 보통 히라가나로 쓰는데, 여기서는 한자 事로 썼어요. 2절의 迷い込むこともある에서는 히라가나 こと예요."},{"t":"に"},{"t":"{決|き}めた","p":"동사","m":"정했다","b":"{決|き}める","bm":"정하다","w":"어간 決는 한자, めた는 히라가나예요.","n":"決める(정하다, 타동사)와 決まる(정해지다, 자동사)는 짝이에요. 한국어 '결정(決定)'의 決예요."},{"t":"よ"},{"t":"　"},{"t":"{今|いま}"}],"ko":"쇠창살 같은 이 거리를 빠져나가기로 정했어, 지금","lit":"쇠창살 / 같은 / 거리 / 를 / 빠져나가다 / 것 / 으로 / 정했다 / 야 / 지금","g":[{"k":"〜{事|こと}に{決|き}める","d":"'~하기로 정하다'. 동사 사전형 + ことに決める. 行く事に決めた = 가기로 했어. ことにする도 비슷한 뜻이에요."},{"k":"〜みたいな + 명사","d":"'~같은'. ような보다 말하듯 편한 말투예요. 夢みたいな話 = 꿈같은 이야기."}],"s":"형식명사 こと를 한자 事로 썼어요. 같은 곡의 2절에는 히라가나 こと가 나와서, 한 곡 안에서 두 표기를 모두 볼 수 있어요.","c":"今(지금)를 문장 맨 끝에 따로 붙여 '바로 지금'을 강조했어요. 鉄格子(쇠창살)라는 말로 내가 사는 거리를 새장처럼 그려요."},{"id":"a4","tk":[{"t":"それ","p":"대명사","m":"그것 (떠나는 일)","w":"こ·そ·あ·ど 지시어라 히라가나로 써요."},{"t":"を"},{"t":"{引|ひ}き{留|と}める","p":"동사","m":"붙잡다, 만류하다","w":"引·留 두 한자에 오쿠리가나가 붙은 복합동사예요.","n":"引く(끌다) + 留める(머물게 하다). 떠나려는 사람을 말이나 손으로 붙잡는 거예요."},{"t":"{言|こと}{葉|ば}","p":"명사","m":"말","n":"言(말씀 언) + 葉(잎 엽). 일본에서는 옛 시(와카) 시절부터 말을 '言の葉(말의 잎)'라고 불러 왔어요."},{"t":"も"},{"t":"　"},{"t":"{気|き}{持|も}ち","p":"명사","m":"마음, 기분","w":"気(기운 기)는 한자, 持ち는 持つ(가지다)의 명사형이라 오쿠리가나 ち가 붙어요.","n":"気持ち = 마음, 기분. 気持ちいい = 기분 좋다."},{"t":"だけ"},{"t":"{受|う}け{取|と}る","p":"동사","m":"받다","w":"受·取 두 한자에 오쿠리가나가 붙은 복합동사예요.","n":"受ける(받다) + 取る(잡다) = 받아 들다. 荷物を受け取る = 짐을 받다."},{"t":"よ"}],"ko":"날 붙잡는 말도, 마음만 받아 둘게","lit":"그것 / 을 / 붙잡다 / 말 / 도 / 마음 / 만 / 받다 / 야","g":[{"k":"{気|き}{持|も}ちだけ{受|う}け{取|と}る","d":"'마음만 받다'. 호의는 고맙게 받되 그 내용은 사양할 때 쓰는 정중한 표현이에요."}],"c":"일본에서는 선물이나 호의를 사양할 때 お気持ちだけいただきます(마음만 받겠습니다)라고 말해요. 떠나지 말라는 말에 고마움만 받고 결심은 바꾸지 않겠다는 뜻이에요. 다음 줄의 どうも有難う로 이어져요."},{"id":"a5","tk":[{"t":"どうも","p":"부사","m":"정말, 참","w":"부사라 히라가나로 써요.","n":"どうも만 말해도 '고마워요', '안녕하세요', '죄송해요'를 대신할 수 있는 만능 인사말이에요."},{"t":"{有|あり}{難|がと}う","p":"감동사","m":"고마워","w":"보통 히라가나 ありがとう로 쓰는 말을 한자 有難う로 썼어요. 有(있을 유)·難(어려울 난)이 보여서 원래 뜻 '있기 어렵다'가 드러나요.","n":"有り難い(ありがたい)는 '있기 어렵다' → '드물다' → '드물 만큼 고맙다'로 뜻이 바뀐 말이에요. ありがたく의 소리가 바뀌어 ありがとう가 됐어요."}],"ko":"정말 고마워","lit":"정말 / 고마워","s":"ありがとう를 한자 有難う로 썼어요. 요즘 일상 글에서는 히라가나가 더 흔해서, 한자 표기가 오히려 눈에 띄어요.","c":"작별 인사를 짧게 끝내요. 앞 줄의 '마음만 받을게'에 이어지는, 떠나는 사람의 정중한 마무리예요."}]},{"label":"1절 · Bメロ","note":"떠나면서 잃는 것들을 저울질했고, 스스로 골랐으니 후회할 권리마저 버렸다고 말해요.","lines":[{"id":"b1","tk":[{"t":"{失|うしな}う","p":"동사","m":"잃다","w":"어간 失는 한자, う는 히라가나예요.","n":"한국어 '실(失)'과 같은 한자예요. 失敗(しっぱい, 실패), 失恋(しつれん, 실연)."},{"t":"もの"},{"t":"や"},{"t":"　"},{"t":"{諦|あきら}める","p":"동사","m":"포기하다, 단념하다","w":"어간 諦는 한자, める는 히라가나예요.","n":"諦めない(포기하지 않아)는 응원할 때 자주 쓰는 말이에요. 諦는 2010년에 조요칸지에 새로 들어간 글자예요."},{"t":"もの"},{"t":"は"}],"ko":"잃게 될 것도, 포기해야 할 것도","lit":"잃다 / 것 / 이나 / 포기하다 / 것 / 은","g":[{"k":"동사 사전형 + もの","d":"'~하는 것'. 동사가 그대로 명사 もの를 꾸며요. 失うもの = 잃는 것, 諦めるもの = 포기하는 것."}],"c":"새장을 나가는 데에는 대가가 따라요. 익숙한 거리, 붙잡던 사람들, 안정된 생활 같은 것들이 그 '것'으로 읽혀요."},{"id":"b2","tk":[{"t":"{確|たし}かに","p":"부사","m":"확실히, 분명","b":"{確|たし}か","bm":"확실함","w":"確는 한자, か는 오쿠리가나, 부사를 만드는 に는 히라가나예요.","n":"確か(확실함, な형용사) + に = 확실히. 確かに!는 '맞아, 그렇네!'라는 맞장구로도 많이 써요."},{"t":"どれ","p":"대명사","m":"어느 것","w":"こ·そ·あ·ど 지시어라 히라가나로 써요."},{"t":"も","m":"~나 (どれも = 모두)"},{"t":"{輝|かがや}いて","p":"동사","m":"빛나서","b":"{輝|かがや}く","bm":"빛나다","w":"어간 輝는 한자, いて는 히라가나예요.","n":"輝(빛날 휘)는 반짝반짝 빛나는 모습이에요. 光(ひかり)가 '빛' 자체라면 輝く는 '빛나다'예요."},{"t":"{見|み}える","p":"동사","m":"보이다","w":"어간 見는 한자, える는 히라가나예요."},{"t":"けど"}],"ko":"분명 하나같이 빛나 보이지만","lit":"확실히 / 어느 것 / 이나 / 빛나서 / 보이다 / 지만","g":[{"k":"〜て{見|み}える","d":"'~해 보이다'. 輝いて見える = 빛나 보이다. 형용사는 く형 + 見える(若く見える = 젊어 보이다)."},{"k":"どれも","d":"'어느 것이나, 모두'. 誰も(누구나), いつも(언제나)처럼 의문사 + も = 모두."}],"c":"버리고 가는 것들이 하나같이 빛나 보인다는 솔직한 고백이에요. 미련이 없는 척하지 않아요."},{"id":"b3","tk":[{"t":"{秤|はかり}","p":"명사","m":"저울","n":"秤는 무게를 다는 저울이에요. 양쪽 접시에 올려 비교하는 천칭은 天秤(てんびん)이라고 해요."},{"t":"に"},{"t":"かけた","p":"동사","m":"(저울에) 달았다","b":"かける","bm":"걸다, 달다","w":"掛ける로도 쓰지만 히라가나로 풀었어요. かける는 뜻이 아주 많은 기본 동사라 히라가나로 쓰는 일이 많아요."},{"t":"　"},{"t":"{自|じ}{分|ぶん}"},{"t":"で","m":"~가 직접, ~의 힘으로"},{"t":"{選|えら}んだ","p":"동사","m":"골랐다","b":"{選|えら}ぶ","bm":"고르다, 선택하다","w":"어간 選는 한자, んだ는 히라가나예요.","n":"選ぶ의 た형은 ぶ가 んだ로 바뀌어 選んだ예요. 遊ぶ → 遊んだ, 飛ぶ → 飛んだ도 같아요."}],"ko":"저울에 달아 보고, 내 손으로 골랐어","lit":"저울 / 에 / 달았다 / 자기 / 로 / 골랐다","g":[{"k":"{秤|はかり}にかける","d":"'저울에 달다' → '(둘을) 비교해 따져 보다'. 天秤にかける라고도 해요. 仕事と家族を天秤にかける = 일과 가족을 저울질하다."},{"k":"{自|じ}{分|ぶん}で","d":"'스스로, 내 힘으로'. 自分で選んだ = 내가 직접 골랐다."}],"c":"잃을 것과 얻을 것을 저울에 달아 본 끝에 스스로 고른 길이라는 말이에요. 남이 시킨 게 아니라는 점이 다음 줄로 이어져요."},{"id":"b4","tk":[{"t":"{悔|く}やむ","p":"동사","m":"후회하다, 분해하다","w":"어간 悔는 한자, やむ는 히라가나예요.","n":"悔는 한국어 '후회(後悔)'의 悔예요. 悔しい(くやしい, 분하다)도 같은 한자예요."},{"t":"{権|けん}{利|り}","p":"명사","m":"권리","n":"한국어 '권리(權利)'와 같은 한자어예요. 権은 權의 일본식 약자예요."},{"t":"も","m":"~마저, ~도"},{"t":"{捨|す}て{去|さ}ってた","p":"동사","m":"버려 두었어","b":"{捨|す}て{去|さ}る","bm":"떨쳐 버리다","w":"捨·去 두 한자에 오쿠리가나가 붙은 복합동사예요.","n":"捨てる(버리다) + 去る(떠나다) = 남김없이 버리다. 捨て去ってた는 捨て去っていた에서 い가 빠진 회화체예요."}],"ko":"후회할 권리마저 진작 버려 두었어","lit":"후회하다 / 권리 / 도 / 버려 버렸었다","g":[{"k":"〜てた (〜ていた의 줄임)","d":"捨て去っていた → 捨て去ってた. 회화에서는 ている·ていた의 い를 자주 빼요. 사비의 見てた, 2절의 響いてた도 같은 모양이에요."}],"c":"스스로 골랐으니 나중에 후회할 자격도 없다고 미리 각오를 다지는 말이에요. らしさ의 本気で勝負だ(진심으로 승부다)와도 닮은 각오예요."}]},{"label":"サビ · 후렴","note":"정말 날 수 있느냐는 물음에 대답 대신 하늘을 봐요. 새의 이름이 ラフター라는 게 처음 밝혀져요.","lines":[{"id":"c1","tk":[{"t":"{翼|つばさ}","p":"명사","m":"날개","n":"翼(날개 익)는 비행기 날개에도 써요. 羽(はね)가 깃털이나 날개 전반이라면, 翼는 날기 위한 큰 날개라는 느낌이에요."},{"t":"は"},{"t":"{動|うご}きます","p":"동사","m":"움직입니다","b":"{動|うご}く","bm":"움직이다","w":"어간 動는 한자, きます는 히라가나예요.","n":"動く(움직이다, 자동사)와 動かす(움직이게 하다, 타동사)는 짝이에요."},{"t":"か"},{"t":"？"},{"t":"{本|ほん}{当|とう}に","p":"부사","m":"정말로","b":"{本|ほん}{当|とう}","bm":"진짜, 사실","w":"本当(진짜)은 한자어, 부사를 만드는 に는 히라가나예요."},{"t":"{飛|と}べます","p":"동사","m":"날 수 있습니다","b":"{飛|と}ぶ","bm":"날다","w":"어간 飛는 한자, べます는 히라가나예요.","n":"飛ぶ의 가능형 飛べる(날 수 있다) + ます예요. Pretender의 飛行機(ひこうき, 비행기)에도 같은 飛가 들어 있어요."},{"t":"か"},{"t":"？"}],"ko":"날개는 움직이나요? 정말 날 수 있나요?","lit":"날개 / 는 / 움직입니다 / 까 / 정말로 / 날 수 있습니다 / 까","g":[{"k":"〜ますか","d":"'~합니까?'. 정중체 ます + 질문의 か. 이 곡에서 ます가 나오는 건 후렴의 질문들뿐이에요."},{"k":"5단 동사 가능형","d":"끝소리를 え단으로 바꾸고 る를 붙여요. 飛ぶ → 飛べる(날 수 있다), 書く → 書ける(쓸 수 있다)."}],"s":"일본어는 か만으로도 질문이 돼서 딱딱한 글에서는 물음표를 생략하기도 해요. 가사에서는 전각 ？를 붙여 묻는 말투를 또렷하게 했어요.","c":"반말로 이어지던 곡에 갑자기 정중한 질문이 나와요. 내가 나에게 묻는 말로도, 의심하는 세상이 묻는 말로도 읽혀요. 배경·문화 노트 'Yes도 No도'에서 더 자세히 다뤄요."},{"id":"c2","tk":[{"t":"Yes"},{"t":"も"},{"t":"No"},{"t":"も"},{"t":"{言|い}わずに","p":"동사","m":"말하지 않고","b":"{言|い}う","bm":"말하다","w":"어간 言는 한자, わずに는 히라가나예요.","n":"ずに는 '~하지 않고'의 글말이에요. 言う → 言わない → 言わずに. 회화에서는 言わないで라고도 해요."},{"t":"{真|ま}っ{直|す}ぐに","p":"부사","m":"곧게, 똑바로","b":"{真|ま}っ{直|す}ぐ","bm":"곧음, 똑바름","w":"真(참 진)·直(곧을 직) 두 한자 사이에 작은 っ와 ぐ가 끼어 있어요. 히라가나만으로 まっすぐ라고 쓰는 일도 많아요.","n":"真っ〜는 '완전히, 아주'를 더하는 말이에요. 真っ白(새하얀), 真っ赤(새빨간), 真っ暗(캄캄한)."},{"t":"{空|そら}"},{"t":"を"},{"t":"{見|み}てた","p":"동사","m":"보고 있었어","b":"{見|み}る","bm":"보다","w":"어간 見는 한자, てた는 히라가나예요.","n":"見ていた의 い가 빠진 회화체예요."}],"ko":"Yes도 No도 말하지 않고 똑바로 하늘만 보고 있었어","lit":"Yes / 도 / No / 도 / 말하지 않고 / 똑바로 / 하늘 / 을 / 보고 있었다","kr":"예스모 노-모 이와즈니 맛스구니 소라오 미테타","g":[{"k":"〜ずに","d":"'~하지 않고'. 동사 ない형에서 ない를 빼고 ずに를 붙여요. 言わずに(말하지 않고), 食べずに(먹지 않고). する는 せずに."},{"k":"AもBも","d":"'A도 B도'. 부정과 함께 쓰면 '둘 다 아니다'. YesもNoも言わずに = 예도 아니요도 말하지 않고."}],"s":"Yes와 No를 가타카나 イエス·ノー가 아니라 알파벳으로 썼어요. 대답 자체를 영어 글자 그대로 보여 줘서, 질문에 대한 '답'이라는 게 한눈에 들어와요.","c":"질문에 말로 대답하는 대신 하늘을 보는 것으로 답해요. 날 수 있느냐는 물음에 날아서 보여 주겠다는 태도로 읽을 수 있어요."},{"id":"c3","tk":[{"t":"{鳥|とり}"},{"t":"の"},{"t":"{名|な}{前|まえ}","p":"명사","m":"이름","n":"名(이름 명) + 前(앞 전). お名前は? = 성함이 어떻게 되세요?"},{"t":"は"},{"t":"ラフター"},{"t":"　"},{"t":"ケージ","p":"명사(외래어)","m":"새장, 우리","w":"영어 cage(새장, 우리)를 가타카나로 옮긴 외래어예요.","n":"일본어로 새장은 鳥籠(とりかご)라고도 해요. 1절의 鉄格子(쇠창살)가 이 ケージ로 이어져요."},{"t":"を"},{"t":"{壊|こわ}した","p":"동사","m":"부쉈어","b":"{壊|こわ}す","bm":"부수다, 망가뜨리다","w":"어간 壊는 한자, した는 히라가나예요.","n":"壊す(부수다, 타동사)와 壊れる(부서지다, 자동사)는 짝이에요. 壊는 한국어 '파괴(破壞)'의 壞를 줄인 일본식 약자예요."}],"ko":"그 새의 이름은 Laughter, 새장을 부숴 버렸어","lit":"새 / 의 / 이름 / 은 / 래프터 / 새장 / 을 / 부쉈다","s":"ラフター·ケージ 둘 다 영어에서 온 외래어라 가타카나예요. 제목은 알파벳 Laughter인데 가사 속 새 이름은 가타카나 ラフター로 썼어요. 같은 말을 제목에서는 영어 글자로, 노래 속에서는 일본어 소리로 부르는 셈이에요.","c":"드디어 새의 이름이 나와요. laughter는 '웃음'이라는 뜻이에요. 1절에서 쇠창살 같은 거리를 빠져나가기로 한 결심이 여기서 새장을 부수는 장면이 돼요."},{"id":"c4","tk":[{"t":"Yes"},{"t":"でも"},{"t":"No"},{"t":"でも"},{"t":"なくて"},{"t":"　"},{"t":"{飛|と}びたい","p":"동사","m":"날고 싶다","b":"{飛|と}ぶ","bm":"날다","w":"어간 飛는 한자, びたい는 히라가나예요.","n":"동사 ます형 + たい = ~하고 싶다. 飛びます → 飛びたい."},{"t":"と","p":"조사","m":"~라고 (인용)"},{"t":"はしゃいでる","p":"동사","m":"들떠 떠드는","b":"はしゃぐ","bm":"신나서 떠들다, 들뜨다","w":"한자(燥ぐ)가 있긴 하지만 거의 쓰지 않아서 히라가나로 써요.","n":"아이들이 신나서 소리치며 뛰노는 모습에 자주 써요. はしゃいでる는 はしゃいでいる의 い가 빠진 모양이에요."},{"t":"{声|こえ}"},{"t":"だけで","p":"조사(복합)","m":"~만으로","n":"だけ(~만) + で(~로) = ~만으로. 声だけで = 목소리만으로."}],"ko":"Yes도 No도 아니라, 날고 싶다고 들떠 외치는 목소리 하나로","lit":"Yes / 도 / No / 도 / 아니고 / 날고 싶다 / 라고 / 들떠 떠드는 / 목소리 / 만으로","kr":"예스데모 노-데모나쿠테 토비타이토 하샤이데루 코에다케데","g":[{"k":"〜たい","d":"'~하고 싶다'. 동사 ます형 + たい. 飛びたい(날고 싶다), 会いたい(만나고 싶다). い형용사처럼 활용해요."},{"k":"AでもBでもなくて","d":"'A도 B도 아니고'. 앞 줄의 YesもNoも를 받아서, 대답은 둘 다 아니라 '날고 싶다'는 외침이라고 말해요."}],"c":"논리적인 대답 대신 아이처럼 들뜬 목소리가 날개가 된다는 그림이에요. 새의 이름이 '웃음'인 것과도 이어져요."},{"id":"c5","tk":[{"t":"{膝|ひざ}","p":"명사","m":"무릎","n":"膝는 2010년에 조요칸지에 새로 들어간 글자예요. 膝を抱える = 무릎을 끌어안다."},{"t":"を"},{"t":"{抱|かか}えた","p":"동사","m":"끌어안은","b":"{抱|かか}える","bm":"끌어안다, 떠안다","w":"어간 抱는 한자, えた는 히라가나예요.","n":"らしさ의 抱えて와 같은 かかえる예요. 2절 Bメロ의 希望抱き에서는 같은 抱를 いだく로 읽어요."},{"t":"{昨日|きのう}","p":"명사","m":"어제","w":"한자 하나하나가 아니라 단어 전체에 きのう라는 읽기가 붙은 주쿠지쿤이에요.","n":"한자어로 읽으면 さくじつ인데, 뉴스나 편지에 쓰는 딱딱한 말이에요."},{"t":"までの","p":"조사(복합)","m":"~까지의"},{"t":"{自|じ}{分|ぶん}"},{"t":"を"}],"ko":"무릎을 끌어안고 있던 어제까지의 나를","lit":"무릎 / 을 / 끌어안은 / 어제 / 까지의 / 나 / 를","g":[{"k":"{膝|ひざ}を{抱|かか}える","d":"'무릎을 끌어안다'. 무릎을 세우고 두 팔로 감싸 웅크린 자세예요. 외로움이나 의기소침한 모습을 나타낼 때 자주 써요."},{"k":"〜までの + 명사","d":"'~까지의'. 昨日までの自分 = 어제까지의 나. 駅までの道 = 역까지 가는 길."}],"c":"웅크리고 앉아 있던 어제의 나와, 하늘을 나는 오늘의 새가 대비돼요. 문장은 다음 줄의 乗り越えた(넘어선)로 이어져요."},{"id":"c6","tk":[{"t":"{乗|の}り{越|こ}えた","p":"동사","m":"넘어선, 극복한","b":"{乗|の}り{越|こ}える","bm":"넘어서다, 극복하다","w":"乗·越 두 한자에 오쿠리가나가 붙은 복합동사예요.","n":"乗る(타다) + 越える(넘다) = 타고 넘다 → 어려움을 극복하다. 壁を乗り越える = 벽을 넘어서다."},{"t":"ラフター"},{"t":"　"},{"t":"{今日|きょう}","p":"명사","m":"오늘","w":"단어 전체에 きょう라는 읽기가 붙은 주쿠지쿤이에요."},{"t":"も"},{"t":"{歌|うた}い{続|つづ}けた","p":"동사","m":"계속 노래했어","b":"{歌|うた}い{続|つづ}ける","bm":"계속 노래하다","w":"歌·続 두 한자에 오쿠리가나가 붙은 복합동사예요.","n":"동사 ます형 + 続ける = 계속 ~하다. 走り続ける = 계속 달리다."}],"ko":"어제의 나를 넘어선 Laughter, 오늘도 노래를 이어 갔어","lit":"넘어선 / 래프터 / 오늘 / 도 / 계속 노래했다","g":[{"k":"ます형 + {続|つづ}ける","d":"'계속 ~하다'. 歌い続けた = 계속 노래했다. 반대로 ます형 + やめる는 '~하기를 그만두다'."}],"c":"'넘어선 ラフター'라고 명사로 한 번 끊고 다음 말로 넘어가요. 과거형 続けた라서, 날아오른 뒤로 하루하루 노래를 이어 왔다는 느낌이 나요."},{"id":"c7","tk":[{"t":"{自|じ}{分|ぶん}{自|じ}{身|しん}","p":"명사","m":"자기 자신","n":"自分(자기) + 自身(자신)을 겹쳐 '바로 나 자신'을 강조한 말이에요. 한국어 '자기 자신'과 같은 구조예요."},{"t":"に"},{"t":"{勝|しょう}{利|り}","p":"명사","m":"승리","n":"한국어 '승리(勝利)'와 같은 한자어예요."},{"t":"を"},{"t":"{告|つ}げる","p":"동사","m":"알리다, 고하다","w":"어간 告는 한자, げる는 히라가나예요.","n":"告(고할 고)는 告白(こくはく, 고백)의 告예요. 告げる는 '분명히 전하다'라는 글말이에요."},{"t":"ため"},{"t":"の"},{"t":"{歌|うた}","p":"명사","m":"노래"}],"ko":"나 자신에게 승리를 알리기 위한 노래","lit":"자기 자신 / 에게 / 승리 / 를 / 알리다 / 위함 / 의 / 노래","g":[{"k":"〜ための + 명사","d":"'~하기 위한 (명사)'. らしさ의 僕が僕であるための要素에도 나온 틀이에요."}],"c":"이기는 상대는 남이 아니라 어제의 나예요. 그래서 승리를 알리는 대상도 '나 자신'이에요."}]},{"label":"2절 · Aメロ","note":"거센 바람과 난기류 속에서 길을 잃기도 하지만, 가짜일지라도 나만의 올바름을 만들어 가겠다고 해요.","lines":[{"id":"d1","tk":[{"t":"{本|ほん}{当|とう}","p":"명사","m":"진짜, 참","n":"本当の = 진짜의. 사비의 本当に(정말로)와 같은 말이에요."},{"t":"の"},{"t":"{正|ただ}しさ"},{"t":"って","p":"조사","m":"~라는 (회화체)","n":"って는 という(~라는)나 と(~라고)의 회화체예요. 正しさってもの = 正しさというもの(올바름이라는 것)."},{"t":"もの"},{"t":"を"},{"t":"　"},{"t":"{風|かぜ}","p":"명사","m":"바람"},{"t":"の"},{"t":"{強|つよ}さ","p":"명사","m":"세기, 강함","b":"{強|つよ}い","bm":"강하다","w":"強는 한자, 명사를 만드는 さ는 히라가나예요.","n":"い형용사의 い를 さ로 바꾸면 명사가 돼요. 強い → 強さ, 正しい → 正しさ."},{"t":"に","m":"~에게 (당하는 상대)"},{"t":"{問|と}い{詰|つ}められて","p":"동사","m":"추궁당해","b":"{問|と}い{詰|つ}める","bm":"캐묻다, 추궁하다","w":"問·詰 두 한자에 오쿠리가나가 붙은 복합동사예요.","n":"問う(묻다) + 詰める(몰아붙이다) = 끝까지 캐묻다. 問い詰められて는 수동형(~당하다) + て예요."}],"ko":"진짜 올바름이란 게 뭐냐고 거센 바람에 추궁당하고","lit":"진짜 / 의 / 올바름 / 이라는 / 것 / 을 / 바람 / 의 / 세기 / 에게 / 추궁당해서","g":[{"k":"い형용사 → 〜さ","d":"い를 さ로 바꾸면 '~함'이라는 명사가 돼요. 正しい → 正しさ, 強い → 強さ. らしさ의 らしい → らしさ와 같은 방법이에요."},{"k":"수동형 〜られる","d":"'~당하다'. 問い詰める → 問い詰められる(추궁당하다). 당하는 상대는 に로 나타내요. 風の強さに = 바람의 세기에게."}],"c":"날아오른 뒤에 만나는 시련을 바람으로 그려요. '진짜 올바름이 뭐냐'는 물음은 남들이 정해 둔 정답을 따르라는 압박으로도 읽혀요."},{"id":"d2","tk":[{"t":"{行|ゆ}く","p":"동사","m":"가다","b":"{行|い}く","bm":"가다","w":"어간 行는 한자, く는 히라가나예요. 行く는 いく와 ゆく 두 가지로 읽어요.","n":"ゆく는 いく보다 예스럽고 글말 느낌이 있어서 노래나 시에 자주 나와요."},{"t":"べき","p":"조동사","m":"~해야 할","n":"べき = 마땅히 ~해야 할. 守るべきもの = 지켜야 할 것."},{"t":"{道|みち}","p":"명사","m":"길"},{"t":"を"},{"t":"{逸|そ}れて","p":"동사","m":"벗어나","b":"{逸|そ}れる","bm":"빗나가다, 벗어나다","w":"어간 逸는 한자, れて는 히라가나예요. 逸는 보통 いつ로 읽는 한자인데, 여기서는 それる로 읽어요.","n":"逸れる는 원래 가려던 방향에서 빗나가는 거예요. 話が逸れる = 이야기가 딴 데로 새다. 히라가나로 それる라고 쓰는 일도 많아요."},{"t":"　"},{"t":"{他|ほか}","p":"명사","m":"다른 (것)","n":"他는 ほか와 た 두 가지로 읽어요. 他の = 다른."},{"t":"の"},{"t":"{鳥|とり}"},{"t":"の"},{"t":"{航|こう}{路|ろ}","p":"명사","m":"항로","n":"한국어 '항로(航路)'와 같은 한자어예요. 배나 비행기가 다니는 길이에요."},{"t":"へ","p":"조사","m":"~로 (방향)","n":"조사로 쓸 때는 e로 읽어요."},{"t":"{迷|まよ}い{込|こ}む","p":"동사","m":"잘못 들어서다, 헤매어 들어가다","w":"迷·込 두 한자에 오쿠리가나가 붙은 복합동사예요.","n":"迷う(헤매다) + 込む(안으로 들어가다) = 길을 잃고 엉뚱한 곳에 들어서다."},{"t":"こと","p":"형식명사","m":"일, 경우","w":"형식명사라 히라가나로 써요. 1절의 抜け出す事에서는 한자 事였어요."},{"t":"も"},{"t":"ある","p":"동사","m":"있다","w":"ある(있다)는 보통 히라가나로 써요."}],"ko":"가야 할 길을 벗어나 다른 새의 항로로 잘못 들어설 때도 있어","lit":"가다 / 해야 할 / 길 / 을 / 벗어나서 / 다른 / 의 / 새 / 의 / 항로 / 로 / 잘못 들어서다 / 일 / 도 / 있다","g":[{"k":"〜べき + 명사","d":"'~해야 할 (명사)'. 行くべき道 = 가야 할 길. する는 すべき로도 써요."},{"k":"〜こともある","d":"'~할 때도 있다'. 동사 사전형 + こともある. 失敗することもある = 실패할 때도 있다."}],"s":"1절의 한자 事와 달리 여기서는 형식명사 こと를 히라가나로 썼어요. 逸れる는 히라가나로 쓰는 일도 많은 말인데 한자로 썼어요.","c":"다른 새의 항로는 남의 인생, 남이 정한 성공의 길로 읽을 수 있어요. 바람에 떠밀려 나답지 않은 길로 들어서는 순간도 있다고 솔직하게 말해요."},{"id":"d3","tk":[{"t":"{乱|らん}{気|き}{流|りゅう}","p":"명사","m":"난기류","n":"한국어 '난기류(亂氣流)'와 같은 한자어예요. 乱은 亂, 気는 氣의 일본식 약자예요."},{"t":"の"},{"t":"{中|なか}"},{"t":"で"},{"t":"さざめく","p":"동사","m":"일렁이다, 술렁이다","w":"보통 히라가나로 쓰는 동사예요.","n":"원래 여럿이 웅성웅성 떠드는 소리를 뜻해요. 가사에서는 빛 알갱이들이 반짝이며 일렁이는 모습을 이렇게 표현했어요."},{"t":"　"},{"t":"{光|ひかり}"},{"t":"の"},{"t":"{粒|つぶ}","p":"명사","m":"알갱이","n":"粒는 쌀알이나 빗방울처럼 작고 동그란 알갱이예요. 一粒(ひとつぶ) = 한 알."},{"t":"を"},{"t":"{探|さが}して","p":"동사","m":"찾아","b":"{探|さが}す","bm":"찾다","w":"어간 探는 한자, して는 히라가나예요.","n":"探す는 갖고 싶은 것을 찾을 때, 捜す는 잃어버린 것을 찾을 때 많이 써요. 둘 다 さがす예요."},{"t":"　"},{"t":"ほら","p":"감동사","m":"봐, 자","w":"감탄사라 히라가나로 써요.","n":"상대의 눈길을 끌 때 하는 말이에요. ほら、見て = 봐, 저거 봐."}],"ko":"난기류 속에서 일렁이는 빛 알갱이를 찾아, 봐","lit":"난기류 / 의 / 속 / 에서 / 일렁이다 / 빛 / 의 / 알갱이 / 를 / 찾아서 / 봐","g":[{"k":"〜で (장소)","d":"동작이 일어나는 장소를 나타내요. 乱気流の中で = 난기류 속에서. 무엇이 '있는' 장소에는 に를 써요(中にいる)."}],"s":"さざめく·ほら처럼 소리를 살린 말은 히라가나, 乱気流·光·粒처럼 뜻이 무거운 말은 한자예요.","c":"거센 기류 속에서도 작은 빛을 찾는 모습이에요. 끝의 ほら(봐)는 듣는 사람에게 그 빛을 가리켜 보이는 것처럼 들려요."},{"id":"d4","tk":[{"t":"たとえ","p":"부사","m":"설령, 비록","w":"부사라 히라가나로 써요. 한자 仮令로 쓰기도 하지만 드물어요.","n":"たとえ〜ても / たとえ〜としても = 설령 ~라 해도. 뒷말과 짝으로 외워요."},{"t":"{紛|まが}い{物|もの}","p":"명사","m":"가짜, 모조품","w":"紛(어지러울 분)를 まがう로 읽는 말에 物가 붙었어요. 히라가나로 まがいもの라고도 써요.","n":"紛う(まがう)는 '헷갈릴 만큼 닮다'. 紛い物 = 진짜와 헷갈리게 만든 가짜예요. 같은 紛를 紛れる(まぎれる, 섞여 들다)로도 읽어요."},{"t":"だった"},{"t":"としても","p":"조사(복합)","m":"~라고 해도"},{"t":"　"},{"t":"{自|じ}{分|ぶん}"},{"t":"にとっての","p":"조사(복합)","m":"~에게 있어서의","n":"にとって(~에게 있어서) + の. 自分にとっての正しさ = 나에게 있어서의 올바름."},{"t":"{正|ただ}しさ"},{"t":"を"}],"ko":"설령 가짜였다고 해도, 나에게 맞는 올바름을","lit":"설령 / 가짜 / 였다 / 라고 해도 / 나 / 에게 있어서의 / 올바름 / 을","g":[{"k":"たとえ〜としても","d":"'설령 ~라고 해도'. たとえ雨でも行く = 설령 비가 와도 간다. としても 대신 ても도 써요."},{"k":"〜にとっての + 명사","d":"'~에게 있어서의 (명사)'. 私にとっての幸せ = 나에게 있어서의 행복."}],"c":"1행의 '진짜 올바름'과 맞서는 줄이에요. 남들이 보기엔 가짜라도 내가 만든 올바름을 택하겠다는 말로 읽혀요."},{"id":"d5","tk":[{"t":"{創|そう}{造|ぞう}して","p":"동사","m":"창조해, 만들어","b":"{創|そう}{造|ぞう}する","bm":"창조하다","w":"한자어 創造에 する가 붙은 동사예요.","n":"한국어 '창조(創造)'와 같은 한자어예요. 같은 소리의 想像(そうぞう, 상상)과 헷갈리기 쉬워요."},{"t":"みる","p":"보조동사","m":"~해 보다","w":"'보다'의 見る가 '~해 보다'로 쓰일 때는 보통 히라가나로 써요.","n":"동사 て형 + みる = 시험 삼아 ~해 보다. 食べてみる = 먹어 보다."},{"t":"よ"},{"t":"　"},{"t":"{大|だい}{事|じ}","p":"な형용사","m":"소중함","n":"大事는 '소중함, 중요함'. 大丈夫(だいじょうぶ)처럼 大를 だい로 읽어요. お大事に는 아픈 사람에게 하는 '몸조리 잘하세요'예요."},{"t":"に","m":"~하게 (な형용사 + に)"},{"t":"する","p":"동사","m":"하다","w":"する는 기본 동사라 히라가나로 써요."},{"t":"よ"}],"ko":"직접 만들어 볼게, 소중히 할게","lit":"창조해 / 보다 / 야 / 소중함 / 하게 / 하다 / 야","g":[{"k":"〜てみる","d":"'~해 보다'. 創造してみる = 만들어 보다. 확실하지 않아도 일단 해 보겠다는 느낌이에요."},{"k":"な형용사 + にする","d":"'~하게 하다, ~히 여기다'. 大事にする = 소중히 하다, 綺麗にする = 깨끗하게 하다."}],"s":"創造(そうぞう)는 想像(そうぞう, 상상)과 소리가 완전히 같아요. 귀로만 들으면 '상상해 볼게'로도 들리지만, 한자가 '만들어 낸다'는 뜻으로 정해 줘요.","c":"〜よ로 끝나는 짧은 다짐 두 개를 나란히 둬서, 스스로에게 하는 약속처럼 들려요."}]},{"label":"2절 · Bメロ","note":"훌륭한 사람이 아니라 '지금'을 자랑할 수 있는 사람이 되고 싶다는 소박한 바람이에요.","lines":[{"id":"e1","tk":[{"t":"{人|じん}{格|かく}{者|しゃ}","p":"명사","m":"인격자, 인품이 훌륭한 사람","n":"人格(인격) + 者(사람). 人을 じん으로 읽는 한자어예요."},{"t":"では"},{"t":"なく"},{"t":"　"},{"t":"{成|せい}{功|こう}{者|しゃ}","p":"명사","m":"성공한 사람","n":"成功(성공) + 者. 한국어 '성공(成功)'과 같은 한자예요."},{"t":"でも"},{"t":"なく"}],"ko":"훌륭한 인격자도 아니고, 성공한 사람도 아니고","lit":"인격자 /
